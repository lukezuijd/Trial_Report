            const n = parseInt(hex.slice(1), 16);
            const r = Math.round(((n >> 16) & 255) * f);
            const g = Math.round(((n >> 8) & 255) * f);
            const b = Math.round((n & 255) * f);
            return `rgb(${r},${g},${b})`;
        };

                error: 'Algo salió mal'

        };
        const LANGS = (window.PERFOTEC_CONFIG && window.PERFOTEC_CONFIG.LANGUAGES) || [{ code: 'en', label: 'EN' }, { code: 'nl', label: 'NL' }, { code: 'es', label: 'ES' }];
        const getInitialLang = () => {
            const cfg = window.PERFOTEC_CONFIG;
            if (cfg && cfg.getLanguage) return cfg.getLanguage();
            const saved = localStorage.getItem('perfotec_lang');
            if (saved && T[saved]) return saved;
            const b = (navigator.language || '').substring(0, 2).toLowerCase();
            return T[b] ? b : 'en';
        };

        const LangSwitcher = ({ lang, setLang }) => (
            <div className="lang-selector" role="radiogroup" aria-label="Language">
                {LANGS.map(l => (
                    <button key={l.code} type="button" role="radio" aria-checked={lang === l.code}
                        className={`lang-btn ${lang === l.code ? 'active' : ''}`}
                        onClick={() => {
                            setLang(l.code);
                            if (window.PERFOTEC_CONFIG && window.PERFOTEC_CONFIG.setLanguage) window.PERFOTEC_CONFIG.setLanguage(l.code);
                            document.documentElement.lang = l.code;
                        }}>
                        {l.label}
                    </button>
                ))}
            </div>
        );

        // === Project modal (create / edit) ===
        // `product` stays the display name (Pipedrive fills it, and older cards
        // only have it). `productId` is the link into the shared product store —
        // empty when the name matches nothing yet.
        const emptyProject = () => ({
            id: null, title: '', client: '', product: '', productId: '', commercial: '',
            productManager: '', startDate: '', actions: [], phase: 'intake', image: ''
        });

        // How a product reads in a list: "Carrot Polished", "Bimi®Broccolini".
        const productLabel = (p) => [p && p.name, p && p.variety].filter(Boolean).join(' ').trim();

        // People entries may be legacy strings or { name, email, phone } objects.
        const normPeople = (arr) => (arr || [])
            .map(p => typeof p === 'string' ? { name: p, email: '', phone: '' } : { name: (p && p.name) || '', email: (p && p.email) || '', phone: (p && p.phone) || '' })
            .filter(p => p.name);

        // Actions may be a structured list [{id,date,text,auto}], or a legacy
        // single `nextAction` string. Normalise + sort (dated first, ascending).
        const getActions = (p) => {
            let acts = Array.isArray(p.actions) ? p.actions.slice() : [];
            if (!acts.length && p.nextAction) acts = [{ text: p.nextAction }];
            return acts.filter(a => a && a.text).sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));
        };
        // Effective completion: a manual override (doneManual) wins over the
        // auto-detected `done`.
        const effDone = (a) => (a && a.doneManual != null) ? !!a.doneManual : !!(a && a.done);
        // Identify the same action across a fresh getActions() copy and the manifest.
        const sameAction = (a, target) => {
            if (target.kind === 'measurement') return a.kind === 'measurement' && a.day === target.day;
            if (target.id) return a.id === target.id;
            return a.kind !== 'measurement' && a.date === target.date && a.text === target.text;
        };

        // A card's heading is the client, or the product when there is no client
        // yet. Sorting uses the same value, so the order matches what you read.
        const cardHeading = (p) => (p.client || p.product || p.title || '').trim();

        // Column order is fixed and never storage order: the folder hands back its
        // card files in whatever order the filesystem feels like, which is why the
        // tiles used to jump around on every refresh.
        //   1. the next open action's date, oldest first
        //   2. undated open actions after every dated one
        //   3. cards with nothing open last
        //   4. then A→Z on the heading, with the id as the final tiebreak so two
        //      reads of the same folder can never disagree.
        const nextActionKey = (p) => {
            const open = getActions(p).filter(a => !effDone(a));
            if (!open.length) return '9999';
            return open[0].date || '9998';
        };
        const compareProjects = (a, b) =>
            nextActionKey(a).localeCompare(nextActionKey(b)) ||
            cardHeading(a).localeCompare(cardHeading(b), undefined, { sensitivity: 'base', numeric: true }) ||
            String(a.id).localeCompare(String(b.id));

        // Downscale an uploaded photo to a small JPEG data URL so the manifest
        // stays lean (product photos are decorative card backgrounds). Delegates
        // to config.js §7c, which also applies EXIF orientation — this page had
        // its own canvas copy, and a portrait phone photo came out sideways.
        // This page has no `globalConfig` alias and reads window.PERFOTEC_CONFIG
        // directly; guard so an older cached config.js degrades instead of
        // throwing and swallowing the drop.
        const readScaledImage = (file, maxW = 480) => {
            const cfg = window.PERFOTEC_CONFIG;
            if (!cfg || !cfg.readImageFile) return Promise.reject(new Error('readImageFile unavailable'));
            return cfg.readImageFile(file, { maxEdge: maxW, quality: 0.72, skipBelowBytes: 0 })
                .then(r => r.dataUrl);
        };

        const Field = ({ label, icon: Icon, children }) => (
            <label className="block">
                <span className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500 mb-1">
                    {Icon && <Icon size={13} aria-hidden="true" />}{label}
                </span>
                {children}
            </label>
        );

        // A field Pipedrive owns: shown, not editable. Keeping these read-only is
        // what stops the board and the CRM from drifting apart — there is exactly
        // one place to change a customer detail, and it is Pipedrive.
        const LockedValue = ({ value, dealUrl, t }) => (
            <div className="flex items-center gap-2 w-full p-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-600">
                <Lock size={13} className="shrink-0 text-slate-400" aria-hidden="true" />
                <span className="flex-1 min-w-0 truncate">{value || '—'}</span>
                {dealUrl && (
                    <a href={dealUrl} target="_blank" rel="noopener noreferrer"

                )}
            </div>
        );

        // A dropdown of known people with an inline "add new" option, so the same
        // spelling is reused everywhere (typos would silently break filtering).
        const PersonSelect = ({ value, options, onChange, onAddNew, inputCls, t }) => {
            const list = value && !(options || []).includes(value) ? [value, ...(options || [])] : (options || []);
            return (
                <select className={inputCls} value={value || ''} onChange={e => {
                    const v = e.target.value;
                    if (v === '__add__') {
                        const name = (window.prompt(t.addPersonPrompt) || '').trim();
                        if (name) { onAddNew(name); onChange(name); }
                    } else onChange(v);
                }}>
                    <option value="">{t.selectNone}</option>
                    {list.map(o => <option key={o} value={o}>{o}</option>)}
                    <option value="__add__">{t.addNewOption}</option>
                </select>
            );
        };

        // Person picker + a manage popover to rename (prompt), delete (confirm) and
        // edit each person's email/phone. `peopleList` is an array of
        // { name, email, phone }. Destructive actions are guarded against 1-click.
        const PeopleField = ({ label, icon, value, peopleList, onChange, onAdd, onRename, onDelete, onUpdate, inputCls, t }) => {
            const [managing, setManaging] = useState(false);
            // Always include the current value, even if it isn't (yet) in the saved
            // registry — otherwise a project's existing person is missing.
            const list = (peopleList || []).slice();
            if (value && !list.some(p => p.name === value)) list.push({ name: value, email: '', phone: '' });
            list.sort((a, b) => a.name.localeCompare(b.name));
            const names = list.map(p => p.name);
            return (
                <Field label={label} icon={icon}>
                    <div className="relative flex items-center gap-1.5">
                        <div className="flex-1 min-w-0">
                            <PersonSelect value={value} options={names} onChange={onChange} onAddNew={onAdd} inputCls={inputCls} t={t} />
                        </div>
                        <button type="button" onClick={() => setManaging(m => !m)} title={t.managePeople}
                            className={`p-2 rounded-lg border shrink-0 ${managing ? 'border-[#084BCD] text-[#084BCD] bg-blue-50' : 'border-slate-200 text-slate-500 hover:bg-slate-100'}`}>
                            <Settings size={15} />
                        </button>
                        {managing && (
                            <div className="absolute z-30 top-full right-0 mt-1 w-72 bg-white rounded-xl shadow-2xl border border-slate-100 p-1.5 max-h-72 overflow-auto">
                                {list.length === 0 && <p className="text-xs text-slate-400 p-2">{t.noPeople}</p>}
                                {list.map(p => (
                                    <div key={p.name} className="px-2 py-1.5 rounded-lg hover:bg-slate-50 space-y-1">
                                        <div className="flex items-center gap-1">
                                            <span className="flex-1 truncate text-sm font-semibold">{p.name}</span>
                                            <button type="button" aria-label={t.rename}
                                                onClick={() => { const n = (window.prompt(t.renamePrompt, p.name) || '').trim(); if (n && n !== p.name) { onRename(p.name, n); if (value === p.name) onChange(n); } }}
                                                className="p-1 text-slate-400 hover:text-slate-700"><Pencil size={13} /></button>
                                            <button type="button" aria-label={t.delete}
                                                onClick={() => { if (window.confirm(t.confirmDeletePerson.replace('{name}', p.name))) { onDelete(p.name); if (value === p.name) onChange(''); } }}
                                                className="p-1 text-slate-400 hover:text-red-600"><Trash2 size={13} /></button>
                                        </div>
                                        <input type="email" defaultValue={p.email} placeholder={t.emailPlaceholder}
                                            onBlur={e => { const v = e.target.value.trim(); if (v !== (p.email || '')) onUpdate(p.name, { email: v }); }}
                                            className="w-full px-2 py-1 text-xs border border-slate-200 rounded-md outline-none focus:border-[#008837]" />
                                        <input type="text" defaultValue={p.phone} placeholder={t.phonePlaceholder}
                                            onBlur={e => { const v = e.target.value.trim(); if (v !== (p.phone || '')) onUpdate(p.name, { phone: v }); }}
                                            className="w-full px-2 py-1 text-xs border border-slate-200 rounded-md outline-none focus:border-[#008837]" />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </Field>
            );
        };

        const ProjectModal = ({ t, initial, onSave, onClose, people, productIndex, onAddPerson, onUpdatePerson, onRenamePerson, onDeletePerson }) => {
            const [data, setData] = useState(initial);
            const [err, setErr] = useState('');
            // Projects that came from Pipedrive: customer, product and commercial
            // lead are read-only here (see PIPEDRIVE_INTEGRATION.md §3).
            const crmOwned = !!initial.crmOwned;
            // Auto/measurement actions are managed by the tools — shown read-only.
            const autoActions = (Array.isArray(initial.actions) ? initial.actions : []).filter(a => a.auto || a.kind === 'measurement');
            const [actions, setActions] = useState(() => {
                const manual = (Array.isArray(initial.actions) ? initial.actions : []).filter(a => !a.auto && a.kind !== 'measurement');
                if (!manual.length && initial.nextAction) return [{ date: '', text: initial.nextAction, done: false }];
                return manual;
            });
            const inputCls = "w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-[#008837] focus:ring-2 focus:ring-[#008837]/20 text-sm bg-white";
            const set = (k, v) => setData(d => ({ ...d, [k]: v }));
            const updateAction = (i, k, v) => setActions(list => list.map((a, idx) => idx === i ? { ...a, [k]: v } : a));
            const addAction = () => setActions(list => [...list, { id: 'man-' + Date.now() + '-' + list.length, kind: 'manual', date: '', text: '', done: false }]);
            const removeAction = (i) => setActions(list => list.filter((_, idx) => idx !== i));
            const submit = () => {
                if (!(data.client || '').trim() && !(data.product || '').trim()) { setErr(t.requiredClientProduct); return; }
                const manual = actions.filter(a => (a.text || '').trim());
                const out = { ...data, actions: [...autoActions, ...manual] };
                delete out.nextAction;
                onSave(out);
            };
            const onPhoto = async (e) => {
                const f = e.target.files[0]; e.target.value = null;
                if (!f) return;
                try { set('image', await readScaledImage(f)); }
                catch (_) { setErr(t.photoError); }
            };
            return (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>

                            {crmOwned && (
                                <p className="flex items-center gap-2 text-xs font-semibold rounded-lg px-3 py-2 border"
                                    style={{ color: BRAND.blue, borderColor: BRAND.blue + '33', backgroundColor: BRAND.blue + '0d' }}>
                                    <Lock size={13} className="shrink-0" />{t.crmOwned}
                                    {data.pipedriveDealUrl && (
                                        <a href={data.pipedriveDealUrl} target="_blank" rel="noopener noreferrer"
                                            className="ml-auto inline-flex items-center gap-1 hover:underline shrink-0">
                                            <ExternalLink size={12} />Pipedrive
                                        </a>
                                    )}
                                </p>

                                {data.image ? (
                                    <div className="flex items-center gap-3">

                                    </label>
                                )}
                            </Field>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Field label={t.fClient} icon={Building2}>
                                    {crmOwned
                                        ? <LockedValue value={data.client} dealUrl={data.pipedriveDealUrl} t={t} />
                                        : <input className={inputCls} value={data.client} onChange={e => set('client', e.target.value)} autoFocus />}
                                </Field>
                                <Field label={t.fProduct} icon={Package}>
                                    {crmOwned
                                        ? <LockedValue value={data.product} dealUrl={data.pipedriveDealUrl} t={t} />
                                        : (
                                            <>
                                                {/* Free text with a datalist: pick a product from the shared
                                                    database to link the project to it, or type a name that
                                                    does not exist there yet. */}
                                                <input className={inputCls} list="pt-products" value={data.product}
                                                    onChange={e => {
                                                        const name = e.target.value;
                                                        const hit = (productIndex || []).find(p => productLabel(p) === name);
                                                        setData(d => ({ ...d, product: name, productId: hit ? hit.id : '' }));
                                                    }} />
                                                <datalist id="pt-products">
                                                    {(productIndex || []).map(p => <option key={p.id} value={productLabel(p)} />)}
                                                </datalist>
                                                {(data.product || '').trim() ? (
                                                    data.productId
                                                        ? <p className="text-[11px] mt-1 font-bold flex items-center gap-1" style={{ color: BRAND.green }}><Check size={11} />{t.productLinked}</p>
                                                        : <p className="text-[11px] mt-1 text-slate-400">{t.productUnlinked}</p>
                                                ) : null}
                                            </>
                                        )}
                                </Field>
                                {crmOwned ? (
                                    <Field label={t.fCommercial} icon={Briefcase}>
                                        <LockedValue value={data.commercial} dealUrl={data.pipedriveDealUrl} t={t} />
                                    </Field>
                                ) : (
                                <PeopleField label={t.fCommercial} icon={Briefcase} value={data.commercial} peopleList={(people && people.commercials) || []}
                                    onChange={v => set('commercial', v)} onAdd={n => onAddPerson('commercials', n)} onUpdate={(nm, patch) => onUpdatePerson('commercials', nm, patch)}
                                    onRename={(o, n) => onRenamePerson('commercials', o, n)} onDelete={o => onDeletePerson('commercials', o)} inputCls={inputCls} t={t} />
                                )}
                                <PeopleField label={t.fPM} icon={UserCog} value={data.productManager} peopleList={(people && people.productManagers) || []}
                                    onChange={v => set('productManager', v)} onAdd={n => onAddPerson('productManagers', n)} onUpdate={(nm, patch) => onUpdatePerson('productManagers', nm, patch)}
                                    onRename={(o, n) => onRenamePerson('productManagers', o, n)} onDelete={o => onDeletePerson('productManagers', o)} inputCls={inputCls} t={t} />
                                <Field label={t.fStart} icon={Calendar}>
                                    <input type="date" className={inputCls} value={data.startDate} onChange={e => set('startDate', e.target.value)} />
                                </Field>
                                <Field label={t.fPhase}>
                                    <select className={inputCls} value={data.phase} onChange={e => set('phase', e.target.value)}>
                                        {Board.PHASES.map(p => <option key={p.key} value={p.key}>{p.label}</option>)}
                                    </select>
                                </Field>
                            </div>
                            <Field label={t.fActions} icon={ArrowRight}>
                                <div className="space-y-2">
                                    {autoActions.length > 0 && (
                                        <div className="space-y-1">
                                            {autoActions.slice().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')).map((a, i) => {
                                                const done = effDone(a);
                                                return (
                                                    <div key={'auto' + i} className={`flex items-center gap-2 text-xs border rounded-lg px-2.5 py-1.5 ${done ? 'bg-green-50 border-green-200 text-green-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                                                        {done ? <Check size={12} className="shrink-0 text-green-600" /> : <BarChart3 size={12} className="shrink-0" style={{ color: BRAND.blue }} />}
                                                        <span className="font-bold tabular-nums shrink-0">{a.date ? fmtDate(a.date) : '—'}</span>
                                                        <span className={`truncate ${done ? 'line-through' : ''}`}>{a.text}</span>
                                                        <span className="ml-auto text-[9px] font-bold uppercase tracking-wider shrink-0">{a.kind === 'measurement' ? t.autoMeasure : t.autoTag}</span>
                                                    </div>
                                                );
                                            })}
                                            <p className="text-[10px] text-slate-400 italic">{t.autoActionsHint}</p>
                                        </div>
                                    )}
                                    {actions.map((a, i) => (
                                        <div key={i} className="flex items-center gap-2">
                                            <button type="button" title={a.done ? t.markOpen : t.markDone} onClick={() => updateAction(i, 'done', !a.done)}
                                                className={`shrink-0 w-8 h-[38px] rounded-lg border flex items-center justify-center ${a.done ? 'bg-green-500 border-green-500 text-white' : 'border-slate-200 text-transparent hover:border-green-500'}`}><Check size={15} /></button>
                                            <input type="date" className={inputCls + ' w-36 shrink-0'} value={a.date || ''} onChange={e => updateAction(i, 'date', e.target.value)} />
                                            <input className={`${inputCls} flex-1 ${a.done ? 'line-through text-slate-400' : ''}`} placeholder={t.actionPlaceholder} value={a.text || ''} onChange={e => updateAction(i, 'text', e.target.value)} />
                                            <button type="button" onClick={() => removeAction(i)} className="p-1.5 text-slate-400 hover:text-red-600 shrink-0" aria-label={t.delete}><X size={15} /></button>
                                        </div>
                                    ))}
                                    <button type="button" onClick={addAction} className="inline-flex items-center gap-1 text-xs font-bold" style={{ color: BRAND.green }}><Plus size={14} />{t.addAction}</button>
                                </div>
                            </Field>
                            {err && <p className="text-sm text-red-600 flex items-center gap-1.5"><AlertTriangle size={14} />{err}</p>}
                        </div>
                        <div className="flex justify-end gap-3 px-6 py-4 border-t border-slate-100">
                            <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">{t.cancel}</button>
                            <button type="button" onClick={submit} className="px-4 py-2 rounded-lg text-sm font-bold text-white flex items-center gap-2" style={{ backgroundColor: BRAND.green }}><Check size={16} />{t.save}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // === Project card ===
        const fmtDate = (s) => {
            if (!s) return '';
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
            return m ? `${m[3]}-${m[2]}-${m[1]}` : s;
        };
        const TODAY = new Date().toISOString().slice(0, 10);
        // Short local date+time for the CRM sync stamp (dd-mm HH:MM).
        const fmtDateTime = (iso) => {
            const d = new Date(iso);
            if (isNaN(d)) return iso || '';
            const p = (n) => String(n).padStart(2, '0');
            return `${p(d.getDate())}-${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
        };

        // One labelled info value: distinct icon + value, full label in the
        // tooltip. Inline rather than stacked, so commercial, PM and packing date
        // flow into one or two wrapped lines instead of always taking three of
        // their own — that was the single biggest chunk of the old tile height.
        const MetaRow = ({ icon: Icon, label, value }) => value ? (
            <span className="inline-flex items-center gap-1 min-w-0 max-w-full" title={label + ': ' + value}>
                <Icon size={12} className="shrink-0 text-slate-400" aria-hidden="true" />
                <span className="truncate font-medium text-slate-700">{value}</span>
            </span>
        ) : null;

        const ProjectCard = ({ t, project, lock, onDragStart, onEdit, onDelete, onArchive, onOpen, onActionOpen, onActionToggle }) => {
            const color = PHASE_COLORS[project.phase] || BRAND.blue;
            const isReport = project.phase === 'report';
            const hasImg = !!project.image;
            const heading = cardHeading(project) || t.untitled;
            const showProductRow = project.product && project.client;
            const acts = getActions(project);
            const open = () => onOpen(project, project.phase);
            return (
                <div
                    draggable
                    onDragStart={(e) => onDragStart(e, project.id)}
                    onClick={open}
                    role="button" tabIndex={0}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }}
                    title={t.openPhase}
                    className="group relative rounded-xl overflow-hidden ring-1 ring-slate-200/80 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all cursor-pointer"
                >
                    {/* Background: faded product photo, or a soft phase-tinted gradient. */}
                    {hasImg ? (
                        <>
                            <div className="absolute inset-0 bg-cover bg-center scale-105" style={{ backgroundImage: `url(${project.image})`, filter: 'saturate(1.08)' }} aria-hidden="true" />
                            {/* Legible scrim: near-opaque behind the text column (left),
                                fading right so the product photo stays clearly visible. */}
                            <div className="absolute inset-0" style={{ background: 'linear-gradient(105deg, rgba(255,255,255,0.92) 32%, rgba(255,255,255,0.55) 68%, rgba(255,255,255,0.30) 100%)' }} aria-hidden="true" />
                        </>
                    ) : (
                        <div className="absolute inset-0" style={{ background: `linear-gradient(150deg, ${color}14, #ffffff 62%)` }} aria-hidden="true" />
                    )}
                    {/* Phase accent bar */}
                    <div className="absolute left-0 top-0 bottom-0 w-1" style={{ backgroundColor: color }} aria-hidden="true" />

                    {/* Hover actions */}
                    <div className="absolute top-1.5 right-1.5 z-10 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                        {project.pipedriveDealUrl && (
                            <a href={project.pipedriveDealUrl} target="_blank" rel="noopener noreferrer"
                                onClick={(e) => e.stopPropagation()} title={t.openInPipedrive} aria-label={t.openInPipedrive}
                                className="p-1 rounded-md bg-white/85 backdrop-blur hover:bg-white text-slate-500 shadow-sm"
                                style={{ color: BRAND.blue }}><ExternalLink size={12} /></a>
                        )}
                        {/* Archiving is offered where a project is finished: the
                            Dashboard column. Elsewhere it would only hide work
                            that still has to happen. */}
                        {onArchive && (
                            <button type="button" onClick={(e) => { e.stopPropagation(); onArchive(project); }}
                                className="p-1 rounded-md bg-white/85 backdrop-blur hover:bg-white text-slate-500 shadow-sm"
                                title={t.archiveProject} aria-label={t.archiveProject}
                                onMouseEnter={(e) => { e.currentTarget.style.color = BRAND.blue; }}
                                onMouseLeave={(e) => { e.currentTarget.style.color = ''; }}><Archive size={12} /></button>
                        )}
                        <button type="button" onClick={(e) => { e.stopPropagation(); onEdit(project); }} className="p-1 rounded-md bg-white/85 backdrop-blur hover:bg-white text-slate-500 hover:text-slate-800 shadow-sm" title={t.editProject} aria-label={t.editProject}><Pencil size={12} /></button>
                        <button type="button" onClick={(e) => { e.stopPropagation(); onDelete(project); }} className="p-1 rounded-md bg-white/85 backdrop-blur hover:bg-white text-slate-500 hover:text-red-600 shadow-sm" title={t.delete} aria-label={t.delete}><Trash2 size={12} /></button>
                    </div>

                    {/* Content */}
                    <div className="relative py-2.5 pr-2.5 pl-3">
                        <p className={`font-extrabold text-[13.5px] leading-tight break-words pr-16 ${project.client ? 'text-slate-900' : 'text-slate-400 italic'}`}>{heading}</p>
                        {showProductRow && (
                            <p className="flex items-center gap-1 mt-0.5 text-[11.5px] font-semibold text-slate-700">
                                <Package size={12} className="shrink-0" style={{ color }} aria-hidden="true" />
                                <span className="truncate">{project.product}</span>
                            </p>
                        )}

                        {/* A colleague has this project open in a tool right now
                            (advisory only — it expires by itself after 2 minutes). */}
                        {lock && (
                            <div className="mt-1.5 flex items-center gap-1 rounded-md border border-blue-200 bg-blue-50/90 px-1.5 py-0.5 text-[10px] font-bold"
                                style={{ color: BRAND.blue }} title={fmtDateTime(lock.at)}>
                                <Lock size={10} className="shrink-0" />
                                <span className="truncate">{t.lockedBy.replace('{name}', lock.user)}</span>
                            </div>
                        )}

                        {/* CRM state that needs attention. The sync never moves or
                            deletes a card on its own — it flags it and leaves the
                            decision to a person. */}
                        {project.crmFlag && (
                            <div className="mt-1.5 flex items-center gap-1 rounded-md border border-amber-200 bg-amber-50/90 px-1.5 py-0.5 text-[10px] font-bold text-amber-800"
                                title={project.crmFlagDetail || ''}>
                                <CloudOff size={10} className="shrink-0" />
                                <span className="truncate">{project.crmFlag === 'dealLost' ? t.flagDealLost : t.flagGateWithdrawn}</span>
                            </div>
                        )}

                        {/* The trial has been moved to Dashboard but its results are
                            not in the product dashboard yet. Visible rather than
                            silent: nothing else on the board would tell you the
                            import is still outstanding. */}
                        {project.dashboardImportPending && (
                            <div className="mt-1.5 flex items-center gap-1 rounded-md border border-orange-200 bg-orange-50/90 px-1.5 py-0.5 text-[10px] font-bold text-orange-800"
                                title={t.importPendingHint}>
                                <ArrowRight size={10} className="shrink-0" />
                                <span className="truncate">{t.importPending}</span>
                            </div>
                        )}

                        <div className="mt-1.5 flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-[11px] leading-tight">
                            <MetaRow icon={Briefcase} label={t.fCommercial} value={project.commercial} />
                            <MetaRow icon={UserCog} label={t.fPM} value={project.productManager} />
                            <MetaRow icon={Calendar} label={t.fStart} value={fmtDate(project.startDate)} />
                        </div>

                        {acts.length > 0 && (() => {
                            const openActs = acts.filter(a => !effDone(a));
                            const primary = openActs[0];
                            if (!primary) {
                                return (
                                    <div className="mt-1.5 rounded-lg px-2 py-1 border bg-green-50/80 border-green-200 flex items-center gap-1 text-[10.5px] font-bold text-green-700">
                                        <Check size={12} className="shrink-0" />{t.allDone}
                                    </div>
                                );
                            }
                            const overdue = primary.date && primary.date < TODAY;
                            const boxCls = overdue ? 'bg-red-50 border-red-200' : (isReport ? 'bg-orange-50/90 border-orange-200' : 'bg-white/70 border-slate-200/80');
                            const accent = overdue ? '#dc2626' : (isReport ? BRAND.orange : '#66707F');
                            // The whole next action on one line: arrow, date, text,
                            // the "+n more" counter and the tick. The separate
                            // "NEXT ACTION" caption row is gone — the arrow carries
                            // it (and its tooltip spells it out), while "overdue"
                            // still gets a visible badge because that one is a
                            // warning, not a label.
                            return (
                                <div className={`mt-1.5 rounded-lg px-2 py-1 border flex items-start gap-1.5 ${boxCls}`}
                                    title={overdue ? t.overdue : t.fNext}>
                                    <ArrowRight size={11} className="shrink-0 mt-[3px]" style={{ color: accent }} aria-hidden="true" />
                                    {/* Two lines maximum, so one verbose action cannot make its
                                        tile twice the height of its neighbours. The full text is
                                        in the tooltip and in the tool the button opens. */}
                                    <button type="button" onClick={(e) => { e.stopPropagation(); onActionOpen(project, primary); }}
                                        title={primary.text}
                                        className="flex-1 min-w-0 text-left text-[11.5px] leading-snug"
                                        style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                                        {overdue && (
                                            <span className="mr-1 align-[1px] text-[9px] font-extrabold uppercase tracking-wider" style={{ color: accent }}>{t.overdue}</span>
                                        )}
                                        {primary.date && <span className="mr-1 font-bold tabular-nums text-[10.5px]" style={{ color: accent }}>{fmtDate(primary.date)}</span>}
                                        <span className="text-slate-700 hover:underline">{primary.text}</span>
                                        {openActs.length > 1 && (
                                            <span className="ml-1 text-[10px] font-bold text-slate-400" title={(openActs.length - 1) + ' ' + t.moreActions}>+{openActs.length - 1}</span>
                                        )}
                                    </button>
                                    <button type="button" title={t.markDone} aria-label={t.markDone} onClick={(e) => { e.stopPropagation(); onActionToggle(project, primary); }}
                                        className="shrink-0 p-0.5 rounded hover:bg-black/10 text-slate-400 hover:text-green-600"><Check size={13} /></button>
                                </div>
                            );
                        })()}
                    </div>
                </div>
            );
        };

        // === Column ===
        const Column = ({ t, phase, projects, locks, onDragStart, onDrop, dragOver, onOpen, onEdit, onDelete, onArchive, onHeaderClick, onActionOpen, onActionToggle }) => {
            const [over, setOver] = useState(false);
            const color = PHASE_COLORS[phase.key];
            const PhaseIcon = PHASE_ICONS[phase.key] || Package;
            const headerHint = phase.key === 'dashboard' ? t.openDashboard : t.startInPhase.replace('{phase}', phase.label);
            const countLabel = projects.length === 1 ? t.projOne : t.projMany;
            return (
                <div className="flex flex-col w-72 shrink-0">
                    {/* Solid, like the dashboard hero. A two-stop gradient on the most
                        prominent coloured chrome on the page was the other half of the
                        mismatch — v2.0 retires decorative gradients, and the per-phase
                        colour is the information here, not the shading. */}
                    <button type="button" onClick={() => onHeaderClick(phase.key)} title={headerHint}
                        className="group sticky top-0 z-20 w-full flex items-center gap-2.5 px-3 py-2 mb-2 rounded-lg shadow-md text-left transition-all hover:shadow-lg hover:brightness-[1.04]"
                        style={{ background: color }}>
                        <span className="flex items-center justify-center w-7 h-7 rounded-md bg-white/20 text-white shrink-0" aria-hidden="true">
                            <PhaseIcon size={15} />
                        </span>
                        <span className="flex flex-col min-w-0 flex-1">
                            <span className="font-extrabold text-[13px] uppercase tracking-wide text-white truncate leading-tight">{phase.label}</span>
                            <span className="text-[9.5px] font-semibold uppercase tracking-wider text-white/70">{projects.length} {countLabel}</span>
                        </span>
                        <span className="flex items-center justify-center w-6 h-6 rounded-md bg-white/20 text-white shrink-0 opacity-70 group-hover:opacity-100 transition-opacity" title={headerHint}>
                            <Plus size={14} />
                        </span>
                    </button>
                    <div
                        onDragOver={(e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = e.dataTransfer.types && [...e.dataTransfer.types].includes('Files') ? 'copy' : 'move'; setOver(true); }}
                        onDragLeave={() => setOver(false)}
                        onDrop={(e) => { e.preventDefault(); setOver(false); const dropped = (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) ? [...e.dataTransfer.files] : []; onDrop(phase.key, dropped); }}
                        className={`flex-1 rounded-lg p-1.5 space-y-1.5 min-h-[100px] transition-colors border-2 ${over ? 'border-dashed' : 'border-transparent'}`}
                        style={{ backgroundColor: over ? color + '10' : '#eef0f2', borderColor: over ? color : 'transparent' }}
                    >
                        {projects.length === 0 && (
                            <p className="text-[11px] text-slate-400 text-center py-5 select-none">{t.emptyColumn}</p>
                        )}
                        {projects.map(p => (
                            <ProjectCard key={p.id} t={t} project={p} lock={locks && locks[p.id]} onDragStart={onDragStart} onOpen={onOpen} onEdit={onEdit} onDelete={onDelete} onArchive={onArchive} onActionOpen={onActionOpen} onActionToggle={onActionToggle} />
                        ))}
                    </div>
                </div>
            );
        };

        // === Filter panel ===
        const FILTER_FIELDS = [
            { key: 'client', labelKey: 'fClient' },
            { key: 'product', labelKey: 'fProduct' },
            { key: 'commercial', labelKey: 'fCommercial' },
            { key: 'productManager', labelKey: 'fPM' }
        ];
        // === Products view ===
        // An overview of the product side of the same database, and a way into it.
        // Creating and editing product data stays in the Product Dashboard, where
        // all of that form logic already lives.
        const ProductCard = ({ t, product, projectCount, archivedCount, onOpen }) => {
            const label = productLabel(product) || '—';
            const stateLabel = product.state === 'processed' ? 'Processed' : product.state === 'whole' ? 'Whole' : (product.state || '');
            return (
                <button type="button" onClick={() => onOpen(product)} title={t.productOpen}
                    className="text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300 transition-all overflow-hidden flex flex-col focus:outline-none focus:ring-2 focus:ring-offset-2"
                    style={{ '--tw-ring-color': BRAND.blue }}>
                    <div className="h-24 bg-slate-100 relative shrink-0">
                        {product.imageUrl
                            ? <img src={product.imageUrl} alt="" className="w-full h-full object-cover" />
                            : <div className="w-full h-full flex items-center justify-center text-slate-300"><Package size={28} /></div>}
                        <span className="absolute top-2 right-2 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-white/90 text-slate-600">{stateLabel}</span>
                    </div>
                    <div className="p-4 flex flex-col gap-2 flex-1">
                        <h3 className="font-bold text-sm text-slate-900 leading-snug">{label}</h3>
                        <div className="flex flex-wrap items-center gap-1.5 mt-auto pt-1">
                            <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md"
                                style={product.hasSheet
                                    ? { backgroundColor: BRAND.green + '15', color: BRAND.green }
                                    : { backgroundColor: '#F2F5F9', color: '#8A97AD' }}>
                                {product.hasSheet ? t.productSheetYes : t.productSheetNo}
                            </span>
                            <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md"
                                style={projectCount > 0
                                    ? { backgroundColor: BRAND.blue + '15', color: BRAND.blue }
                                    : { backgroundColor: '#F2F5F9', color: '#8A97AD' }}>
                                {projectCount === 0 ? t.productNoProjects : projectCount === 1 ? t.productProject : t.productProjects.replace('{n}', projectCount)}
                            </span>
                            {/* Finished work on this product is still counted, so the
                                products tab does not read as "nothing ever happened"
                                once its projects have been archived. */}
                            {archivedCount > 0 && (
                                <span className="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-slate-100 text-slate-500"
                                    title={t.archiveTitle}>
                                    <Archive size={10} />{t.productArchived.replace('{n}', archivedCount)}
                                </span>
                            )}
                        </div>
                        {product.updatedAt && (
                            <p className="text-[11px] text-slate-400">{t.productUpdated} {String(product.updatedAt).slice(0, 10)}</p>
                        )}
                    </div>
                </button>
            );
        };

        // === Archive view ===
        // Archiving is a view decision, never a deletion: the card keeps its phase,
        // its documents and its Pipedrive link, and only stops taking up room in a
        // column. That is why every row here can go straight back to the board.
        // Deleted cards and deleted products, with what it takes to get them back.
        // Nothing in here expires on a timer: a bin that empties itself is a bin
        // that throws away the thing you came looking for. Items stay until
        // someone erases them here on purpose.
        const TrashView = ({ t, trash, onRestoreCard, onRestoreProduct, onPurgeCard, onPurgeProduct }) => {
            const age = (iso) => {
                const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
                if (!(d >= 0)) return '';
                return d === 0 ? t.trashToday : d === 1 ? t.trashOneDay : t.trashDays.replace('{n}', d);
            };
            const Row = ({ title, sub, when, onRestore, onPurge, icon: Icon }) => (
                <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-100 last:border-0 hover:bg-slate-50/70">
                    <Icon size={16} className="shrink-0 text-slate-400" />
                    <div className="min-w-0 flex-1">
                        <div className="font-bold text-sm text-slate-900 truncate">{title}</div>
                        {sub && <div className="text-xs text-slate-500 truncate">{sub}</div>}
                    </div>
                    <span className="text-[11px] text-slate-400 shrink-0 hidden sm:block">{when}</span>
                    <button type="button" onClick={onRestore}
                        className="shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg border transition-colors hover:bg-green-50"
                        style={{ borderColor: BRAND.green, color: BRAND.green }}>{t.trashRestore}</button>
                    <button type="button" onClick={onPurge}
                        className="shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:border-red-300 hover:text-red-600 transition-colors">
                        {t.trashPurge}</button>
                </div>
            );
            const empty = trash.loaded && trash.cards.length === 0 && trash.products.length === 0;
            return (
                <div className="max-w-[1100px] mx-auto px-4 md:px-6 pt-6 pb-8">
                    <h2 className="brand-heading text-lg text-slate-900">{t.trashTitle}</h2>
                    <p className="text-sm text-slate-500 mt-1 mb-5 max-w-2xl leading-relaxed">{t.trashDesc}</p>
                    {!trash.loaded && <p className="text-sm text-slate-400">{t.trashLoading}</p>}
                    {empty && <p className="text-sm text-slate-400">{t.trashEmpty}</p>}
                    {trash.cards.length > 0 && (
                        <div className="mb-6">
                            <h3 className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2">{t.trashProjects}</h3>
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                {trash.cards.map(c => (
                                    <Row key={c.id} icon={ClipboardList}
                                        title={c.client || c.product || c.id}
                                        sub={[c.product, c.phase].filter(Boolean).join(' · ')}
                                        when={age(c.deletedAt)}
                                        onRestore={() => onRestoreCard(c.id)} onPurge={() => onPurgeCard(c)} />
                                ))}
                            </div>
                        </div>
                    )}
                    {trash.products.length > 0 && (
                        <div>
                            <h3 className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2">{t.trashProductsHead}</h3>
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                {trash.products.map(p => (
                                    <Row key={p.id} icon={Package}
                                        title={[p.name, p.variety].filter(Boolean).join(' ') || p.id}
                                        sub={p.state === 'processed' ? t.stateProcessed : t.stateWhole}
                                        when={age(p.deletedAt)}
                                        onRestore={() => onRestoreProduct(p.id)} onPurge={() => onPurgeProduct(p)} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ArchiveView = ({ t, projects, onOpen, onUnarchive, onDelete }) => {
            const [q, setQ] = useState('');
            const needle = q.trim().toLowerCase();
            const rows = needle
                ? projects.filter(p => [p.client, p.product, p.commercial, p.productManager, p.title]
                    .filter(Boolean).join(' ').toLowerCase().includes(needle))
                : projects;
            return (
                <div className="max-w-[1100px] mx-auto px-4 md:px-6 pt-6 pb-8">
                    <div className="flex flex-wrap items-end justify-between gap-3 mb-4">
                        <div className="min-w-0">
                            <h2 className="brand-heading text-lg uppercase tracking-tight flex items-center gap-2" style={{ color: BRAND.blue }}>
                                <Archive size={18} style={{ color: BRAND.green }} />{t.archiveTitle}
                                <span className="text-xs font-bold normal-case tracking-normal text-slate-400">
                                    {t.archiveCount.replace('{n}', projects.length)}
                                </span>
                            </h2>
                            <p className="mt-1 text-sm text-slate-500 max-w-2xl">{t.archiveDesc}</p>
                        </div>
                        {projects.length > 0 && (
                            <label className="relative shrink-0">
                                <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true" />
                                <input type="search" value={q} onChange={(e) => setQ(e.target.value)}
                                    placeholder={t.archiveSearch} aria-label={t.archiveSearch}
                                    className="w-64 pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-sm bg-white outline-none focus:border-[#008837]" />
                            </label>
                        )}
                    </div>
                    {projects.length === 0 ? (
                        <p className="text-sm text-slate-400">{t.archiveEmpty}</p>
                    ) : rows.length === 0 ? (
                        <p className="text-sm text-slate-400">{t.archiveNoMatch}</p>
                    ) : (
                        <ul className="space-y-1.5">
                            {rows.map(p => {
                                const color = PHASE_COLORS[p.phase] || BRAND.blue;
                                const phase = Board.phaseByKey[p.phase];
                                return (
                                    <li key={p.id}
                                        className="group flex items-center gap-3 bg-white rounded-xl border border-slate-200 pl-0 pr-2 py-2 overflow-hidden hover:border-slate-300 hover:shadow-sm transition-all">
                                        <span className="w-1 self-stretch shrink-0" style={{ backgroundColor: color }} aria-hidden="true" />
                                        {p.image
                                            ? <img src={p.image} alt="" className="w-9 h-9 rounded-lg object-cover shrink-0" />
                                            : <span className="w-9 h-9 rounded-lg bg-slate-100 text-slate-300 flex items-center justify-center shrink-0"><Package size={16} /></span>}
                                        <button type="button" onClick={() => onOpen(p)} title={t.openPhase}
                                            className="flex-1 min-w-0 text-left">
                                            <span className={`block font-bold text-[13.5px] leading-tight truncate ${p.client ? 'text-slate-900' : 'text-slate-400 italic'}`}>
                                                {cardHeading(p) || t.untitled}
                                            </span>
                                            <span className="mt-0.5 flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-[11px]">
                                                <MetaRow icon={Package} label={t.fProduct} value={p.product} />
                                                <MetaRow icon={Briefcase} label={t.fCommercial} value={p.commercial} />
                                                <MetaRow icon={UserCog} label={t.fPM} value={p.productManager} />
                                                <MetaRow icon={Calendar} label={t.fStart} value={fmtDate(p.startDate)} />
                                            </span>
                                        </button>
                                        <span className="hidden sm:block shrink-0 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md"
                                            style={{ backgroundColor: color + '15', color }}>{phase ? phase.label : p.phase}</span>
                                        <span className="hidden md:block shrink-0 text-[11px] text-slate-400 tabular-nums text-right"
                                            title={t.archivedOn + ' ' + String(p.archivedAt || '').slice(0, 10) + (p.archivedBy ? ' ' + t.archivedBy + ' ' + p.archivedBy : '')}>
                                            {t.archivedOn} {fmtDate(String(p.archivedAt || '').slice(0, 10))}
                                            {p.archivedBy && <span className="block text-[10px]">{t.archivedBy} {p.archivedBy}</span>}
                                        </span>
                                        <span className="flex items-center gap-0.5 shrink-0">
                                            <button type="button" onClick={() => onUnarchive(p)} title={t.unarchive} aria-label={t.unarchive}
                                                className="flex items-center gap-1 text-[11px] font-bold px-2 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100">
                                                <RotateCcw size={13} /><span className="hidden lg:inline">{t.unarchiveShort}</span>
                                            </button>
                                            <button type="button" onClick={() => onDelete(p)} title={t.delete} aria-label={t.delete}
                                                className="p-1.5 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600"><Trash2 size={14} /></button>
                                        </span>
                                    </li>
                                );
                            })}
                        </ul>
                    )}
                </div>
            );
        };

        const FilterPanel = ({ t, projects, filters, setFilters, onClose }) => {
            const distinct = (key) => Array.from(new Set(projects.map(p => (p[key] || '').trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b));
            const selCls = "w-full p-2 border border-slate-200 rounded-lg text-sm bg-white outline-none focus:border-[#008837]";
            return (
                <div className="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-slate-100 z-40 p-4 space-y-3">
                    <div className="flex items-center justify-between">
                        <span className="font-bold text-sm" style={{ color: BRAND.blue }}>{t.filter}</span>
                        <button type="button" onClick={onClose} className="p-1 rounded hover:bg-slate-100" aria-label={t.cancel}><X size={16} /></button>
                    </div>
                    <input className={selCls} placeholder={t.search} value={filters.q} onChange={e => setFilters(f => ({ ...f, q: e.target.value }))} />
                    {FILTER_FIELDS.map(f => (
                        <label key={f.key} className="block">
                            <span className="text-xs font-bold uppercase tracking-wide text-slate-500">{t[f.labelKey]}</span>
                            <select className={selCls + ' mt-1'} value={filters[f.key]} onChange={e => setFilters(prev => ({ ...prev, [f.key]: e.target.value }))}>
                                <option value="">{t.all}</option>
                                {distinct(f.key).map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                        </label>
                    ))}
                    <button type="button" onClick={() => setFilters({ q: '', client: '', product: '', commercial: '', productManager: '' })}
                        className="w-full text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-lg py-2">{t.clear}</button>
                </div>
            );
        };

        // === Agenda: all actions across projects, filterable by person, in a
        // month CALENDAR (today highlighted; done struck-through) or a LIST view
        // (open tasks only). Clicking an action deep-links to it. ===
        const AgendaModal = ({ t, lang, projects, people, todayISO, onActionOpen, onActionToggle, onClose }) => {
            const [person, setPerson] = useState('');
            const [view, setView] = useState('calendar');
            const startY = parseInt(todayISO.slice(0, 4), 10), startM = parseInt(todayISO.slice(5, 7), 10) - 1;
            const [cursor, setCursor] = useState({ y: startY, m: startM });
            const names = Array.from(new Set([
                ...people.commercials.map(p => p.name), ...people.productManagers.map(p => p.name),
                ...projects.flatMap(p => [p.commercial, p.productManager]).filter(Boolean)
            ])).sort((a, b) => a.localeCompare(b));
            const allItems = [];
            projects.forEach(pr => {
                if (person && pr.commercial !== person && pr.productManager !== person) return;
                getActions(pr).forEach(a => allItems.push({ ...a, project: pr }));
            });
            const selCls = "p-2 border border-slate-200 rounded-lg text-sm bg-white outline-none focus:border-[#008837]";

            // Calendar month grid (Monday-first).
            const pad = (n) => String(n).padStart(2, '0');
            const localeMap = { en: 'en-GB', nl: 'nl-NL', es: 'es-ES' };
            const monthTitle = new Date(cursor.y, cursor.m, 1).toLocaleDateString(localeMap[lang] || 'en-GB', { month: 'long', year: 'numeric' });
            const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
            const firstWeekday = (new Date(cursor.y, cursor.m, 1).getDay() + 6) % 7;
            const byDate = {};
            allItems.forEach(a => { if (a.date) (byDate[a.date] = byDate[a.date] || []).push(a); });
            const cells = [];
            for (let i = 0; i < firstWeekday; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);
            while (cells.length % 7 !== 0) cells.push(null);
            const prevMonth = () => setCursor(c => c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 });
            const nextMonth = () => setCursor(c => c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 });

            // List view: only tasks still to do (completed hidden).
            const listItems = allItems.filter(a => !effDone(a)).sort((a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));

            const tabCls = (active) => `flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg ${active ? 'bg-white shadow-sm text-[#084BCD]' : 'text-slate-500 hover:text-slate-700'}`;

            return (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-start justify-center p-4 pt-10 overflow-auto" role="dialog" aria-modal="true" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl">
                        <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100 flex-wrap">
                            <h2 className="text-lg font-bold brand-heading flex items-center gap-2" style={{ color: BRAND.blue }}><Calendar size={18} style={{ color: BRAND.green }} />{t.agenda}</h2>
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="flex items-center bg-slate-100 rounded-lg p-0.5">
                                    <button type="button" className={tabCls(view === 'calendar')} onClick={() => setView('calendar')}><Calendar size={13} />{t.viewCalendar}</button>
                                    <button type="button" className={tabCls(view === 'list')} onClick={() => setView('list')}><List size={13} />{t.viewList}</button>
                                </div>
                                <select className={selCls} value={person} onChange={e => setPerson(e.target.value)}>
                                    <option value="">{t.agendaAllPeople}</option>
                                    {names.map(n => <option key={n} value={n}>{n}</option>)}
                                </select>
                                <button type="button" onClick={onClose} className="p-1.5 rounded-lg hover:bg-slate-100" aria-label={t.cancel}><X size={18} /></button>
                            </div>
                        </div>

                        <div className="p-4 max-h-[74vh] overflow-auto">
                            {view === 'calendar' ? (
                                <>
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center gap-1">
                                            <button type="button" onClick={prevMonth} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><ChevronLeft size={18} /></button>
                                            <span className="font-bold text-sm capitalize min-w-[150px] text-center">{monthTitle}</span>
                                            <button type="button" onClick={nextMonth} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><ChevronRight size={18} /></button>
                                        </div>
                                        <button type="button" onClick={() => setCursor({ y: startY, m: startM })} className="text-xs font-bold text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-100">{t.today}</button>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {t.weekdays.map((w, i) => <div key={i} className="text-[10px] font-bold uppercase text-slate-400 text-center py-1">{w}</div>)}
                                        {cells.map((d, i) => {
                                            if (d === null) return <div key={i} className="min-h-[76px] rounded-lg bg-slate-50/40" />;
                                            const dateISO = `${cursor.y}-${pad(cursor.m + 1)}-${pad(d)}`;
                                            const isToday = dateISO === todayISO;
                                            const dayActs = byDate[dateISO] || [];
                                            return (
                                                <div key={i} className={`min-h-[76px] rounded-lg border p-1 flex flex-col gap-0.5 ${isToday ? 'border-2 bg-green-50/50' : 'border-slate-100'}`} style={isToday ? { borderColor: BRAND.green } : {}}>
                                                    <span className={`text-[11px] font-bold px-0.5 ${isToday ? '' : 'text-slate-400'}`} style={isToday ? { color: BRAND.green } : {}}>{d}</span>
                                                    <div className="flex flex-col gap-0.5 overflow-hidden">
                                                        {dayActs.slice(0, 3).map((a, j) => {
                                                            const done = effDone(a);
                                                            const overdue = !done && dateISO < todayISO;
                                                            const color = PHASE_COLORS[a.project.phase] || BRAND.blue;
                                                            const label = a.project.product || a.project.client || a.text;
                                                            return (
                                                                <button key={j} type="button" title={`${a.text} — ${[a.project.client, a.project.product].filter(Boolean).join(' · ')}`}
                                                                    onClick={() => { onActionOpen(a.project, a); onClose(); }}
                                                                    className={`text-[9px] leading-tight text-left truncate rounded px-1 py-0.5 ${done ? 'line-through text-slate-400 bg-slate-100' : 'text-white'}`}
                                                                    style={done ? {} : { backgroundColor: overdue ? '#dc2626' : color }}>{label}</button>
                                                            );
                                                        })}
                                                        {dayActs.length > 3 && <span className="text-[9px] text-slate-400 px-1">+{dayActs.length - 3}</span>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            ) : (
                                <>
                                    {listItems.length === 0 && <p className="text-sm text-slate-400 text-center py-10">{t.agendaAllDone}</p>}
                                    <ul className="space-y-1.5">
                                        {listItems.map((a, i) => {
                                            const overdue = a.date && a.date < todayISO;
                                            const color = PHASE_COLORS[a.project.phase] || BRAND.blue;
                                            return (
                                                <li key={i} className={`flex items-center gap-2 px-2 py-1.5 rounded-xl border transition-all ${overdue ? 'border-red-200 bg-red-50/60 hover:shadow-sm' : 'border-slate-100 hover:border-slate-300 hover:shadow-sm'}`}>
                                                    <button type="button" title={t.markDone} onClick={() => onActionToggle(a.project, a)}
                                                        className="shrink-0 w-5 h-5 rounded-md border border-slate-300 text-transparent hover:border-green-500 hover:text-green-600 flex items-center justify-center"><Check size={13} /></button>
                                                    <button type="button" onClick={() => { onActionOpen(a.project, a); onClose(); }} className="flex-1 min-w-0 flex items-center gap-3 text-left">
                                                        <span className={`shrink-0 w-24 text-xs font-bold tabular-nums ${overdue ? 'text-red-600' : 'text-slate-500'}`}>{a.date ? fmtDate(a.date) : t.agendaNoDate}</span>
                                                        <span className="flex-1 min-w-0">
                                                            <span className="block text-sm truncate text-slate-800">{a.text}</span>
                                                            <span className="block text-xs text-slate-400 truncate">{[a.project.client, a.project.product].filter(Boolean).join(' · ')}</span>
                                                        </span>
                                                        <span className="shrink-0 text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full text-white" style={{ backgroundColor: color }}>{Board.phaseByKey[a.project.phase] ? Board.phaseByKey[a.project.phase].label : a.project.phase}</span>
                                                    </button>
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // === Who are you? ===
        // On a shared database every write is attributed, and the board hides your
        // own advisory lock. Asked once, kept in localStorage per browser.
        /* Who else has the database open. Grouped by NAME, not by session: two
           tabs open is still one colleague, and "Rebecca, Rebecca" just looks
           broken. Worded as "recently active" on purpose — on a synced folder
           this can never be truly live, and a list implying otherwise is worse
           than no list at all. */
        const PresencePanel = ({ t, people, userLabel, onClose }) => {
            const seen = (ms) => ms < 90000 ? t.whoSeenNow : t.whoSeenMin.replace('{n}', Math.round(ms / 60000));
            const byName = [];
            people.forEach(p => {
                const hit = byName.find(x => x.user === p.user);
                if (hit) { hit.pages.add(p.page); hit.ageMs = Math.min(hit.ageMs, p.ageMs); hit.self = hit.self || p.self; }
                else byName.push({ user: p.user, pages: new Set([p.page]), ageMs: p.ageMs, self: p.self });
            });
            return (
                <div className="absolute right-0 mt-2 w-72 bg-white rounded-xl shadow-2xl border border-slate-100 z-40 p-3">
                    <div className="flex items-center justify-between mb-2">
                        <span className="font-bold text-sm" style={{ color: BRAND.blue }}>{t.whoOnline}</span>
                        <button type="button" onClick={onClose} className="p-1 rounded hover:bg-slate-100 text-slate-400"><X size={14} /></button>
                    </div>
                    {byName.length === 0 && <p className="text-xs text-slate-400 py-2">{t.whoOnlineNone}</p>}
                    <ul className="space-y-1">
                        {byName.map(pn => (
                            <li key={pn.user} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50">
                                <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: BRAND.green }} aria-hidden="true" />
                                <span className="flex-1 min-w-0">
                                    <span className="block text-sm font-semibold text-slate-800 truncate">
                                        {pn.user}{pn.self && <span className="ml-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">({t.whoOnlineYou})</span>}
                                    </span>
                                    <span className="block text-[11px] text-slate-400 truncate">{Array.from(pn.pages).filter(Boolean).join(', ')}</span>
                                </span>
                                <span className="text-[10px] text-slate-400 tabular-nums shrink-0">{seen(pn.ageMs)}</span>
                            </li>
                        ))}
                    </ul>
                    <p className="mt-2 pt-2 border-t border-slate-100 text-[10px] leading-snug text-slate-400">
                        {!userLabel && <span className="block mb-1 font-bold text-amber-600">{t.whoOnlineNoName}</span>}
                        {t.whoOnlineHint}
                    </p>
                </div>
            );
        };

        /* The three things that used to sit in the header as permanent chips:
           which folder is bound, when the last backup ran, when the CRM last
           synced. They are status, not controls — worth having, not worth a
           slot each on every screen. The folder stays CHANGEABLE from here,
           because binding the wrong folder is the one thing you need a way
           out of. */
        const InfoPanel = ({ t, rootName, dbFormat, backupState, backupBusy, syncState, onChangeFolder, onOpenBackups, onOpenTrash, onClose }) => {
            const lastBackup = backupState && backupState.runs && backupState.runs.length
                ? fmtDateTime(backupState.runs[backupState.runs.length - 1].at) : t.backupNever;
            const Row = ({ label, children }) => (
                <div className="px-2 py-2 rounded-lg hover:bg-slate-50">
                    <span className="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">{label}</span>
                    {children}
                </div>
            );
            return (
                <div className="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-slate-100 z-40 p-3">
                    <div className="flex items-center justify-between mb-1">
                        <span className="font-bold text-sm" style={{ color: BRAND.blue }}>{t.infoTitle}</span>
                        <button type="button" onClick={onClose} className="p-1 rounded hover:bg-slate-100 text-slate-400"><X size={14} /></button>
                    </div>
                    <Row label={t.infoFolder}>
                        <div className="flex items-center gap-2">
                            <FolderOpen size={14} className="shrink-0" style={{ color: BRAND.green }} />
                            <span className="flex-1 min-w-0 truncate text-sm font-semibold text-slate-800">{rootName || '—'}</span>
                            <button type="button" onClick={onChangeFolder}
                                className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100">{t.changeFolder}</button>
                        </div>
                    </Row>
                    {dbFormat === 'cards' && (
                        <Row label={t.infoBackup}>
                            <div className="flex items-center gap-2">
                                <Lock size={13} className="shrink-0" style={{ color: BRAND.green }} />
                                <span className="flex-1 min-w-0 truncate text-sm text-slate-700">{backupBusy || lastBackup}</span>
                                <button type="button" onClick={onOpenBackups}
                                    className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100">{t.backupTitle}</button>
                            </div>
                        </Row>
                    )}
                    <Row label={t.viewTrash}>
                        <div className="flex items-center gap-2">
                            <Trash2 size={13} className="shrink-0 text-slate-400" />
                            <span className="flex-1 min-w-0 text-sm text-slate-700">{t.trashInfoLine}</span>
                            <button type="button" onClick={onOpenTrash}
                                className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100">{t.trashOpen}</button>
                        </div>
                    </Row>
                    <Row label={t.infoSync}>
                        <div className="flex items-center gap-2">
                            <RefreshCw size={13} className="shrink-0" style={{ color: BRAND.blue }} />
                            <span className="text-sm text-slate-700">{syncState && syncState.lastRunAt ? fmtDateTime(syncState.lastRunAt) : t.neverSynced}</span>
                        </div>
                    </Row>
                </div>
            );
        };
        const NameModal = ({ t, initial, onSave, onClose }) => {
            const [name, setName] = useState(initial || '');
            const canSave = !!name.trim();
            const save = () => { if (canSave) { onSave(name.trim()); onClose(); } };
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-7">
                        <div className="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style={{ backgroundColor: BRAND.green + '15', color: BRAND.green }}>
                            <User size={24} />
                        </div>
                        <h2 className="text-lg font-bold brand-heading mb-2">{t.whoTitle}</h2>
                        <p className="text-sm text-slate-500 leading-relaxed mb-5">{t.whoDesc}</p>
                        <input autoFocus type="text" value={name} onChange={e => setName(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') save(); }}
                            placeholder={t.whoPlaceholder}
