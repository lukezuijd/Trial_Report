                            className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 mb-5" />
                        <div className="flex justify-end gap-2">
                            {initial ? <button type="button" onClick={onClose} className="text-sm font-bold text-slate-500 px-4 py-2 rounded-lg hover:bg-slate-100">{t.backupClose}</button> : null}
                            <button type="button" onClick={save} disabled={!canSave}
                                className="text-sm font-bold text-white px-5 py-2 rounded-lg disabled:opacity-40"
                                style={{ backgroundColor: BRAND.green }}>{t.whoSave}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // === Backups ===
        const BackupsModal = ({ t, state, list, busy, onBackupNow, onRestore, onClose }) => {
            const groups = [
                { key: 'daily', label: t.backupDaily, restorable: true },
                { key: 'weekly', label: t.backupWeekly, restorable: true },
                { key: 'monthly', label: t.backupMonthly, restorable: false }
            ];
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between gap-3 px-6 py-4 border-b border-slate-200">
                            <h2 className="text-lg font-bold brand-heading flex items-center gap-2">
                                <Lock size={18} style={{ color: BRAND.green }} />{t.backupTitle}
                            </h2>
                            <div className="flex items-center gap-2">
                                <button type="button" onClick={onBackupNow} disabled={!!busy}
                                    className="text-sm font-bold text-white px-4 py-2 rounded-lg disabled:opacity-50"
                                    style={{ backgroundColor: BRAND.green }}>{busy || t.backupNow}</button>
                                <button type="button" onClick={onClose} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500"><X size={18} /></button>
                            </div>
                        </div>
                        <div className="overflow-auto px-6 py-5">
                            <p className="text-xs text-slate-500 leading-relaxed mb-5">{t.backupExplain}</p>
                            {!list ? <p className="text-sm text-slate-400">…</p> : groups.map(g => (
                                <div key={g.key} className="mb-5">
                                    <h3 className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2">{g.label}</h3>
                                    {(list[g.key] || []).length === 0 ? (
                                        <p className="text-sm text-slate-400 italic">{t.backupEmpty}</p>
                                    ) : (
                                        <ul className="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden">
                                            {list[g.key].slice().sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).map(e => (
                                                <li key={e.name} className="flex items-center justify-between gap-3 px-3 py-2 bg-white">
                                                    <div className="min-w-0">
                                                        <span className="font-bold text-sm text-slate-800">{e.name}</span>
                                                        <span className="ml-2 text-xs text-slate-500">
                                                            {e.createdAt ? fmtDateTime(e.createdAt) : ''}
                                                            {e.size ? ' · ' + Math.round(e.size / 1024) + ' kB' : ''}
                                                            {e.files ? ' · ' + e.files + ' files' : ''}
                                                            {e.complete === false ? ' · incomplete' : ''}
                                                        </span>
                                                    </div>
                                                    {g.restorable ? (
                                                        <button type="button" onClick={() => onRestore(e)} disabled={!!busy}
                                                            className="shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 disabled:opacity-50">
                                                            {t.backupRestore}
                                                        </button>
                                                    ) : null}
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            ))}
                            <p className="text-xs text-slate-400 leading-relaxed border-t border-slate-100 pt-4">{t.restoreFullHint}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // A banner that explains itself, for the things that are not errors but do
        // need a decision or an eyeball: migration, a lost race, sync conflict copies.
        // Module scope, like every other component here: declared inside App it
        // would be a new component type on every render, so React would throw the
        // card away and build a new one for every unrelated state change.
        const CenterCard = ({ icon: Icon, color, title, desc, action }) => (
            <div className="max-w-md mx-auto mt-20 bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
                <div className="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5" style={{ backgroundColor: color + '15', color }}>
                    <Icon size={32} />
                </div>
                <h2 className="text-xl font-bold brand-heading mb-2">{title}</h2>
                <p className="text-slate-500 text-sm leading-relaxed mb-6">{desc}</p>
                {action}
            </div>
        );

        const Notice = ({ tone, icon: Icon, title, children, action }) => {
            const tones = {
                amber: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-900', icon: '#b45309' },
                blue: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-900', icon: BRAND.blue }
            };
            const c = tones[tone] || tones.blue;
            return (
                <div className="px-4 md:px-6 pt-3">
                    <div className={`${c.bg} ${c.border} ${c.text} border text-sm rounded-lg px-4 py-3 flex items-start gap-3`}>
                        <Icon size={18} className="shrink-0 mt-0.5" style={{ color: c.icon }} />
                        <div className="min-w-0 flex-1">
                            <p className="font-bold">{title}</p>
                            <div className="text-xs leading-relaxed mt-0.5">{children}</div>
                        </div>
                        {action}
                    </div>
                </div>
            );
        };

        // === App ===
        const App = () => {
            const [lang, setLang] = useState(getInitialLang);
            const t = T[lang] || T.en;

            const [status, setStatus] = useState('loading'); // loading | unsupported | no-folder | needs-permission | ready
            const [rootName, setRootName] = useState(null);
            const [manifest, setManifest] = useState({ schemaVersion: '1.0', isPerfoTecBoard: true, projects: [] });
            const [error, setError] = useState('');
            const [editing, setEditing] = useState(null); // project object or null
            const [showFilter, setShowFilter] = useState(false);
            const [showAgenda, setShowAgenda] = useState(false);
            const [filters, setFilters] = useState({ q: '', client: '', product: '', commercial: '', productManager: '' });
            const [dragId, setDragId] = useState(null);
            const [syncState, setSyncState] = useState(null); // .sync/pipedrive-state.json
            // Products live in the same folder as the projects (see board-db.js).
            // Only the light index is read here — never the full records, which
            // carry the attached product-sheet HTML.
            const [productIndex, setProductIndex] = useState([]);
            const [view, setView] = useState('board'); // 'board' | 'products' | 'archive' | 'trash'
            // The recycle bin holds BOTH halves of the database: deleted project
            // cards and deleted products. One bin, because it is one folder and a
            // person looking for something they lost should not have to guess
            // which of two places it went to.
            const [trash, setTrash] = useState({ cards: [], products: [], loaded: false });
            const loadTrash = useCallback(async () => {
                try {
                    // Ask the layer rather than reading the dbFormat state: that is
                    // set by a startup effect, and gating on it made the bin read
                    // empty whenever it had not landed yet.
                    if (await Board.dbMode() !== 'cards') { setTrash({ cards: [], products: [], loaded: true }); return; }
                    const [cards, prods] = await Promise.all([
                        Board.readDeletedCards ? Board.readDeletedCards() : [],
                        Board.readDeletedProducts ? Board.readDeletedProducts() : []
                    ]);
                    setTrash({ cards: cards || [], products: prods || [], loaded: true });
                } catch (e) { setTrash({ cards: [], products: [], loaded: true }); }
            }, []);
            // Read it when the bin is opened, not on every board load: it walks
            // every card and product file, which is wasted work for the 99% of
            // visits that never look in here.
            useEffect(() => { if (view === 'trash') loadTrash(); }, [view, loadTrash]);

            const restoreCard = async (id) => {
                try { await Board.restoreCard(id); await loadManifest(); await loadTrash(); }
                catch (e) { setError(e.message || String(e)); }
            };
            const restoreProduct = async (id) => {
                try {
                    await Board.restoreProduct(id);
                    Board.readProductIndex().then(idx => setProductIndex(idx.products || [])).catch(() => {});
                    await loadTrash();
                } catch (e) { setError(e.message || String(e)); }
            };
            const purgeCard = async (item) => {
                if (!window.confirm(t.confirmPurge.replace('{name}', item.client || item.product || item.id))) return;
                try { await Board.purgeCard(item.id); await loadTrash(); }
                catch (e) { setError(e.message || String(e)); }
            };
            const purgeProduct = async (item) => {
                if (!window.confirm(t.confirmPurge.replace('{name}', [item.name, item.variety].filter(Boolean).join(' ')))) return;
                try { await Board.purgeProduct(item.id); await loadTrash(); }
                catch (e) { setError(e.message || String(e)); }
            };
            const todayISO = useMemo(() => new Date().toISOString().slice(0, 10), []);

            // ---- Shared database (schema 2.0) ----
            // Who is making the changes. Written into every card as `updatedBy`
            // and used to hide our own advisory lock.
            const [userLabel, setUserLabel] = useState(() => Board.getUserLabel());
            const [dbFormat, setDbFormat] = useState(null);   // 'legacy' | 'cards'
            const [migrating, setMigrating] = useState(false);
            // Someone else saved the same card first. Distinct from `error`: this
            // is not a failure, it is a race we handled — so it gets its own
            // amber banner with what to do next.
            const [conflictNote, setConflictNote] = useState(null);
            // OneDrive conflict copies in cards/ — a change may have gone missing.
            const [artefacts, setArtefacts] = useState([]);
            // projectId -> { user, at } for projects a colleague has open.
            const [locks, setLocks] = useState({});
            const [backupState, setBackupState] = useState(null);
            const [backupList, setBackupList] = useState(null);
            const [backupBusy, setBackupBusy] = useState('');
            const [showBackups, setShowBackups] = useState(false);
            const [showName, setShowName] = useState(false);
            // Who else has the database open. Polled, not pushed: a folder cannot
            // notify us, and one small directory listing a minute is cheap.
            const [presence, setPresence] = useState([]);
            const [showPresence, setShowPresence] = useState(false);
            const [showInfo, setShowInfo] = useState(false);

            // The manifest is mirrored in a ref that is updated SYNCHRONOUSLY on
            // every change. React state alone is not enough here: two edits made
            // in the same tick (blur the email field, then hit the rename pencil —
            // neither handler awaits the other) both read `manifest` out of the
            // same render closure, so the second one silently threw the first
            // one's change away. Every mutation below builds on this ref instead.
            const manifestRef = useRef(manifest);
            const applyManifest = useCallback((m) => { manifestRef.current = m; setManifest(m); }, []);

            const loadManifest = useCallback(async () => {
                try {
                    const m = await Board.readManifest();
                    applyManifest(m);
                    setError('');
                    setArtefacts(Board.lastSyncArtefacts ? Board.lastSyncArtefacts() : []);
                    // Written by pipedrive-sync.mjs; absent until the sync has run.
                    Board.readSyncState().then(setSyncState).catch(() => setSyncState(null));
                    Board.readProductIndex().then(idx => setProductIndex(idx.products || [])).catch(() => setProductIndex([]));
                    Board.readBackupState().then(setBackupState).catch(() => setBackupState(null));
                    // Locks are read in one pass per load instead of per card, so a
                    // board with 50 cards does not fire 50 reads on every render.
                    Promise.all((m.projects || []).map(p =>
                        Board.readLock(p.id).then(l => [p.id, l]).catch(() => [p.id, null])
                    )).then(pairs => {
                        const next = {};
                        pairs.forEach(([id, l]) => { if (l) next[id] = l; });
                        setLocks(next);
                    });
                } catch (e) {
                    if (e.code === 'NEEDS_PERMISSION') setStatus('needs-permission');
                    else if (e.code === 'NO_FOLDER') setStatus('no-folder');
                    else setError(e.message || String(e));
                }
            }, [applyManifest]);

            // Initial state detection
            useEffect(() => {
                if (!Board.isSupported()) { setStatus('unsupported'); return; }
                Board.getRootName().then(setRootName);
                Board.permissionState().then(state => {
                    if (state === 'none') setStatus('no-folder');
                    else if (state === 'granted') { setStatus('ready'); loadManifest(); }
                    else setStatus('needs-permission');
                });
            }, [loadManifest]);

            // Re-read the manifest when returning to the board (tools may have
            // created files or updated metadata in another tab). BUT never while the
            // edit modal is open: window.prompt/confirm blur+refocus the window, and
            // a reload there would clobber an in-flight people/manifest write with the
            // stale copy still on disk (the "new person disappears" bug).
            const editingRef = useRef(false);
            editingRef.current = !!editing;
            // A mutation (delete / drag / people edit) optimistically updates state
            // then writes to disk. window.confirm/prompt blur+refocus the window and
            // fire 'focus' before that write finishes — a reload there re-reads the
            // stale file and undoes the change (delete needed 2 clicks; new person
            // vanished). Suppress the focus-reload for a short window around writes.
            const suppressReloadUntil = useRef(0);
            const beginMutation = () => { suppressReloadUntil.current = Date.now() + 2000; };
            useEffect(() => {
                const onFocus = () => { if (status === 'ready' && !editingRef.current && Date.now() > suppressReloadUntil.current) loadManifest(); };
                window.addEventListener('focus', onFocus);
                return () => window.removeEventListener('focus', onFocus);
            }, [status, loadManifest]);

            useEffect(() => {
                if (status !== 'ready' || dbFormat !== 'cards') return;
                let stopped = false;
                const poll = () => { Board.readPresence().then(list => { if (!stopped) setPresence(list); }).catch(() => { }); };
                poll();
                const id = setInterval(poll, 60000);
                // Returning to the tab is exactly when a stale list shows, so
                // re-read then rather than waiting out the interval.
                const onFocus = () => poll();
                window.addEventListener('focus', onFocus);
                return () => { stopped = true; clearInterval(id); window.removeEventListener('focus', onFocus); };
            }, [status, dbFormat]);

            // Which storage format the linked folder uses, and the daily backup.
            // Both run once per page load — the focus-reload above must not fire
            // a backup every time you tab back to the board.
            const startupDone = useRef(false);
            // Detect the folder's format and run whatever backup is due for it.
            // Called on load AND after switching folders: another folder can be on
            // another format and has its own backups. Skipping it there would leave
            // the migration banner and the backup chip describing the folder you
            // just left.
            const runStartup = useCallback(async () => {
                try {
                    const mode = await Board.dbMode();
                    setDbFormat(mode);
                    if (mode !== 'cards') return;   // nothing to snapshot before migration
                    const done = await Board.runDueBackups({
                        onProgress: p => setBackupBusy(t.backupBusy + ' (' + p.copied + ')')
                    });
                    setBackupBusy('');
                    if (done && (done.daily || done.weekly || done.monthly)) {
                        Board.readBackupState().then(setBackupState).catch(() => {});
                    }
                } catch (e) { setBackupBusy(''); }
            }, [t]);
            useEffect(() => {
                if (status !== 'ready' || startupDone.current) return;
                startupDone.current = true;
                runStartup();
            }, [status, runStartup]);

            // Stop the browser from opening/navigating to a JSON file dropped
            // outside a column (columns handle their own drops). Only guards file
            // drags so internal card drag/drop is unaffected.
            useEffect(() => {
                const guard = (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); };
                window.addEventListener('dragover', guard);
                window.addEventListener('drop', guard);
                return () => { window.removeEventListener('dragover', guard); window.removeEventListener('drop', guard); };
            }, []);

            // A write that lost a race is NOT an error — the other person's version
            // is on disk and ours is not. Re-read so the board stops showing a lie,
            // and say what happened instead of dropping a red error line.
            const handleWriteError = useCallback(async (e) => {
                if (e && e.code === 'CONFLICTS') {
                    // Compose the sentence here rather than showing board-db's
                    // internal (English) error text: name the colleague and the
                    // card the way the user sees them on the board.
                    setConflictNote((e.conflicts || []).map(c => t.conflictLine
                        .replace('{name}', (c.theirs && c.theirs.updatedBy) || t.conflictSomeone)
                        .replace('{card}', (c.theirs && (c.theirs.client || c.theirs.product)) || c.cardId)
                    ).join(' '));
                    await loadManifest();
                    return;
                }
                setError(e.message || String(e));
            }, [loadManifest, t]);

            // The single place a manifest change is committed. Two things here are
            // load-bearing:
            //   * the change is built from `manifestRef.current`, so an edit made
            //     before the previous one's write finished builds on it instead of
            //     on a stale render closure (that lost update was the "my email /
            //     my person change did not save" bug);
            //   * the disk writes are chained, so two overlapping writeManifest
            //     calls cannot both diff against the same card snapshot — which is
            //     what produced spurious "someone else was faster" conflicts.
            const writeChain = useRef(Promise.resolve());
            const commit = useCallback((patch) => {
                beginMutation();
                const next = { ...manifestRef.current, ...patch };
                applyManifest(next);
                const job = writeChain.current
                    .then(() => Board.writeManifest(next), () => Board.writeManifest(next))
                    .then(() => setConflictNote(null), (e) => handleWriteError(e));
                writeChain.current = job.catch(() => {});
                return job;
            }, [applyManifest, handleWriteError]);

            const persist = useCallback((nextProjects) => commit({ projects: nextProjects }), [commit]);
            // What every mutation must build on. Render code reads `manifest`
            // instead — that has to stay reactive.
            const currentProjects = () => manifestRef.current.projects || [];

            // People registry: each entry is { name, email, phone } and lives in the
            // manifest so the same spelling + contact details are reused everywhere.
            // Projects still store the person's NAME (filters/cards unchanged);
            // email/phone are looked up here by name.
            const people = useMemo(() => ({
                commercials: normPeople(manifest.people && manifest.people.commercials),
                productManagers: normPeople(manifest.people && manifest.people.productManagers)
            }), [manifest.people]);

            const KIND_FIELD = { commercials: 'commercial', productManagers: 'productManager' };
            // Read from the ref, never from the render closure: see `commit`.
            const basePeople = () => {
                const p = manifestRef.current.people;
                return {
                    commercials: normPeople(p && p.commercials),
                    productManagers: normPeople(p && p.productManagers)
                };
            };
            const writePeople = useCallback((nextPeople, projects) =>
                commit(projects ? { people: nextPeople, projects } : { people: nextPeople }), [commit]);

            const addPerson = useCallback(async (kind, name) => {
                name = (name || '').trim(); if (!name) return;
                const np = basePeople();
                if (np[kind].some(p => p.name === name)) return;
                np[kind] = [...np[kind], { name, email: '', phone: '' }].sort((a, b) => a.name.localeCompare(b.name));
                await writePeople(np);
            }, [writePeople]);

            // Set email/phone on a person (upserts, so an orphan project value can
            // be enriched too).
            const updatePerson = useCallback(async (kind, name, patch) => {
                const np = basePeople();
                if (np[kind].some(p => p.name === name)) np[kind] = np[kind].map(p => p.name === name ? { ...p, ...patch } : p);
                else np[kind] = [...np[kind], { name, email: '', phone: '', ...patch }].sort((a, b) => a.name.localeCompare(b.name));
                await writePeople(np);
            }, [writePeople]);

            // Rename a person everywhere: the registry AND every project that used
            // the old name, so filtering stays consistent.
            const renamePerson = useCallback(async (kind, oldName, newName) => {
                newName = (newName || '').trim();
                if (!newName || newName === oldName) return;
                const field = KIND_FIELD[kind];
                const np = basePeople();
                np[kind] = np[kind].map(p => p.name === oldName ? { ...p, name: newName } : p).sort((a, b) => a.name.localeCompare(b.name));
                const projects = (manifestRef.current.projects || []).map(p => p[field] === oldName ? { ...p, [field]: newName } : p);
                await writePeople(np, projects);
            }, [writePeople]);

            // Remove a person from the picklist. Existing project values are left
            // as-is (the value still shows in that project's dropdown).
            const deletePerson = useCallback(async (kind, name) => {
                const np = basePeople();
                np[kind] = np[kind].filter(p => p.name !== name);
                await writePeople(np);
            }, [writePeople]);

            const chooseFolder = async () => {
                try {
                    const r = await Board.pickRootFolder();
                    setRootName(r.name);
                    setStatus('ready');
                    // Everything below describes the folder we are leaving.
                    setDbFormat(null);
                    setBackupState(null);
                    setBackupList(null);
                    setConflictNote(null);
                    await loadManifest();
                    startupDone.current = true;
                    await runStartup();
                } catch (e) { if (e.name !== 'AbortError') setError(e.message || String(e)); }
            };
            // Switching folders swaps the whole database under the board, so it
            // asks first. Needed to move onto the shared SharePoint folder, and to
            // recover when someone binds the wrong one — without this the only way
            // out is clearing site data.
            const switchFolder = async () => {
                if (!window.confirm(t.switchFolderConfirm.replace('{name}', rootName || '?'))) return;
                await chooseFolder();
            };
            const grantAccess = async () => {
                try {
                    const ok = await Board.requestAccess();
                    if (ok) { setStatus('ready'); Board.getRootName().then(setRootName); await loadManifest(); }
                } catch (e) { setError(e.message || String(e)); }
            };

            const saveProject = async (data) => {
                // Back-fill the product link for anything typed rather than picked
                // (and for Pipedrive-owned cards, where the name is read-only).
                if (!data.productId && (data.product || '').trim()) {
                    try {
                        const id = await Board.resolveProductId(data.product, { products: productIndex });
                        if (id) data = { ...data, productId: id };
                    } catch (e) { /* no product store yet — leave unlinked */ }
                }
                const exists = currentProjects().some(p => p.id === data.id);
                let next;
                if (exists) {
                    next = currentProjects().map(p => {
                        if (p.id !== data.id) return p;
                        const merged = { ...p, ...data, updatedAt: new Date().toISOString() };
                        // The sync arbitrates phase changes on both sides by
                        // timestamp, so every board-side move must be stamped.
                        if (data.phase !== p.phase) merged.phaseChangedAt = new Date().toISOString();
                        return merged;
                    });
                } else {
                    const proj = { ...data, id: Board.newId(), files: {}, updatedAt: new Date().toISOString() };
                    next = [...currentProjects(), proj];
                }
                await persist(next);
                setEditing(null);
            };

            const deleteProject = async (project) => {
                // On the shared store the card is tombstoned, not erased, and the
                // phase files (the actual work) are left alone: destroying them is
                // unrecoverable for the whole team at once, and a colleague may be
                // in that document right now. A card can be brought back with
                // Board.restoreCard(id).
                const shared = dbFormat === 'cards';
                if (!window.confirm(shared ? t.confirmDeleteShared : t.confirmDelete)) return;
                await persist(currentProjects().filter(p => p.id !== project.id));
                if (shared) return;
                try { await Board.deleteProjectFiles(project.id); } catch (e) { /* best effort */ }
            };

            // ---- Archive ----
            // A finished project should stop competing for attention with live
            // work, but throwing it away loses the trial history that the next
            // proposal for that client is built on. So it is stamped, not removed:
            // phase, files and CRM link all stay, and the Archive tab shows it.
            const archiveProject = async (project) => {
                if (!window.confirm(t.confirmArchive.replace('{name}', cardHeading(project) || t.untitled))) return;
                const at = new Date().toISOString();
                await persist(currentProjects().map(p => p.id === project.id
                    ? { ...p, archivedAt: at, archivedBy: userLabel || '', updatedAt: at }
                    : p));
            };
            const unarchiveProject = async (project) => {
                const at = new Date().toISOString();
                await persist(currentProjects().map(p => {
                    if (p.id !== project.id) return p;
                    // Drop the stamps rather than blanking them: writeCard() writes
                    // the object it is handed, so a removed key really is gone and
                    // an old card cannot be told apart from a restored one.
                    const next = { ...p, updatedAt: at };
                    delete next.archivedAt;
                    delete next.archivedBy;
                    return next;
                }));
            };

            // Which tool owns a project in this phase. Dashboard owns none: it is a
            // destination for finished trials, not a per-project editor, so a card
            // sitting there still opens the PROJECT — in the Report form, the last
            // one that edits it. Loading that trial into the product dashboard is a
            // separate action, and it happens once, when the card is moved there.
            const toolForPhase = (phaseKey) =>
                Board.phaseByKey[phaseKey === 'dashboard' ? 'report' : phaseKey];

            const openInTool = (project, phaseKey) => {
                const phase = toolForPhase(phaseKey);
                let url = phase.tool + '?boardProject=' + encodeURIComponent(project.id);
                // Claim the advisory lock before leaving, so colleagues see the card
                // is being worked on. Fire-and-forget: navigation must not wait on
                // it, and a lock we cannot write is not worth blocking the user.
                if (dbFormat === 'cards') Board.touchLock(project.id);
                window.location.assign(url); // open in the current tab
            };

            // Opening an archived project is a look back, not the next step, so it
            // skips the dashboard's automatic trial import — that runs for a card
            // that has just arrived, and re-running it on finished work would
            // rewrite a closed trial.
            const openArchived = (project) => {
                const phase = toolForPhase(project.phase) || Board.phaseByKey.report;
                if (dbFormat === 'cards') Board.touchLock(project.id);
                window.location.assign(phase.tool + '?boardProject=' + encodeURIComponent(project.id));
            };

            // ---- Migration to the shared format ----
            const runMigration = async () => {
                setMigrating(true);
                try {
                    const res = await Board.migrateToCards();
                    setDbFormat(await Board.dbMode());
                    await loadManifest();
                    if (res.migrated) window.alert(t.migrateDone.replace('{n}', res.cards));
                    // First snapshot right away: the migration is exactly the moment
                    // you want a restore point for.
                    await Board.runDueBackups({ force: true }).catch(() => {});
                    Board.readBackupState().then(setBackupState).catch(() => {});
                } catch (e) {
                    setError(e.message || String(e));
                } finally {
                    setMigrating(false);
                }
            };

            // ---- Backups ----
            const openBackups = async () => {
                setShowBackups(true);
                setBackupList(null);
                try {
                    const [list, state] = await Promise.all([Board.listBackups(), Board.readBackupState()]);
                    setBackupList(list);
                    setBackupState(state);
                } catch (e) { setError(e.message || String(e)); }
            };

            const backupNow = async () => {
                setBackupBusy(t.backupBusy);
                try {
                    await Board.runDueBackups({ force: true, onProgress: p => setBackupBusy(t.backupBusy + ' (' + p.copied + ')') });
                    const [list, state] = await Promise.all([Board.listBackups(), Board.readBackupState()]);
                    setBackupList(list);
                    setBackupState(state);
                } catch (e) { setError(e.message || String(e)); }
                finally { setBackupBusy(''); }
            };

            // Restore is deliberately two-step and never silent: read the bundle,
            // show what is in it, and only write after an explicit confirm.
            const restoreBackup = async (entry) => {
                let bundle;
                try {
                    bundle = await Board.readStructureBackup(entry.kind, entry.name);
                } catch (e) { setError(e.message || String(e)); return; }
                if (!bundle) { setError('Backup ' + entry.name + ' could not be read'); return; }
                const msg = t.restoreConfirm
                    .replace('{name}', entry.kind + '/' + entry.name)
                    .replace('{date}', fmtDateTime(bundle.createdAt))
                    .replace('{n}', (bundle.cards || []).length);
                if (!window.confirm(msg)) return;
                setBackupBusy(t.backupRestoreBusy);
                try {
                    const res = await Board.restoreStructureBackup(bundle);
                    await loadManifest();
                    setShowBackups(false);
                    window.alert(t.restoreDone.replace('{n}', res.cards));
                } catch (e) { setError(e.message || String(e)); }
                finally { setBackupBusy(''); }
            };

            const saveUserLabel = (name) => {
                const v = Board.setUserLabel(name);
                setUserLabel(v);
            };

            // Products open in the dashboard, which owns all product editing.
            const openProductInDashboard = (product) => {
                const url = Board.phaseByKey.dashboard.tool + '?product=' + encodeURIComponent(product.id);
                window.location.assign(url);
            };

            // Open the tool at a specific action. Measurement actions live in the
            // report phase and deep-link to that measurement day (&measureDay=).
            const openAction = (project, action) => {
                const phaseKey = action.kind === 'measurement' ? 'report' : project.phase;
                let url = Board.phaseByKey[phaseKey].tool + '?boardProject=' + encodeURIComponent(project.id);
                if (action.kind === 'measurement' && action.day != null) url += '&measureDay=' + encodeURIComponent(action.day);
                window.location.assign(url);
            };

            // Toggle an action's completion. Measurement actions get a manual
            // override (doneManual) that wins over auto-detection; manual actions
            // flip their own `done`.
            const toggleActionDone = async (project, action) => {
                const cur = effDone(action);
                const nextActions = (project.actions || []).map(a => {
                    if (!sameAction(a, action)) return a;
                    return a.kind === 'measurement' ? { ...a, doneManual: !cur } : { ...a, done: !cur };
                });
                await persist(currentProjects().map(p => p.id === project.id ? { ...p, actions: nextActions, updatedAt: new Date().toISOString() } : p));
            };

            // Clicking a column header starts a new document in that phase: it
            // creates a fresh project and opens the matching tool linked to it.
            // The Dashboard header just opens the product dashboard (it is the
            // destination view, not a per-project editor).
            const startNewInPhase = async (phaseKey) => {
                if (phaseKey === 'dashboard') { window.location.assign(Board.phaseByKey.dashboard.tool); return; }
                const proj = { ...emptyProject(), id: Board.newId(), phase: phaseKey, files: {}, updatedAt: new Date().toISOString() };
                await persist([...currentProjects(), proj]);
                openInTool(proj, phaseKey);
            };

            const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); };
            // Derive board metadata from any tool export (intake/proposal/report/BC).
            const deriveMeta = (d) => {
                const ci = (d && (d.clientInfo || d.client)) || {};
                const p = (d && d.project) || {};
                const product = p.productName || (Array.isArray(d && d.products) && d.products[0] && d.products[0].name) || '';
                return {
                    client: ci.companyName || p.company || '',
                    product: product,
                    commercial: '',
                    productManager: p.employee || '',
                    startDate: p.packingDate || ''
                };
            };

            // Import JSON files dropped onto a column from another window (mail,
            // Explorer, …): each becomes a new project in that phase, with the file
            // stored as its phase file and metadata derived from the JSON.
            const importExternalFiles = async (fileList, phaseKey) => {
                const jsons = fileList.filter(f => /\.json$/i.test(f.name) || f.type === 'application/json');
                if (!jsons.length) { setError(t.notJson); return; }
                beginMutation();
                const added = [];
                for (const f of jsons) {
                    try {
                        const data = JSON.parse(await f.text());
                        const id = Board.newId();
                        await Board.writePhaseFile(id, phaseKey, data);
                        const meta = deriveMeta(data);
                        let image = '';
                        const imgSrc = (data.project && (data.project.coverImage || data.project.startImage)) ||
                            (Array.isArray(data.products) && data.products[0] && data.products[0].photo) || '';
                        if (imgSrc) { const s = await Board.scaleImage(imgSrc, 480); if (s) image = s; }
                        added.push({ id, title: '', ...meta, image, phase: phaseKey, files: { [phaseKey]: true }, actions: [], updatedAt: new Date().toISOString() });
                    } catch (err) { setError(t.importFailed + ' ' + f.name); }
                }
                if (added.length) await persist([...currentProjects(), ...added]);
            };

            const onDrop = async (phaseKey, droppedFiles) => {
                // External JSON file(s) dropped from another window → new project(s).
                if (droppedFiles && droppedFiles.length) { setDragId(null); await importExternalFiles(droppedFiles, phaseKey); return; }
                if (!dragId) return;
                const project = currentProjects().find(p => p.id === dragId);
                setDragId(null);
                if (!project || project.phase === phaseKey) return;
                // Carry the project's data forward: copy the file from the phase it is
                // leaving into the new phase's file, so the tool opens with the existing
                // content instead of a blank form. Don't overwrite a file the target
                // phase already has, and skip Dashboard (it imports the report file).
                const files = { ...(project.files || {}) };
                // Only ever copy FORWARD. Moving a card back means "revisit that
                // earlier phase", and writing the downstream payload into the
                // upstream file would leave e.g. a report export sitting in
                // intake.json — which that tool then cannot own. Nothing is lost by
                // skipping it: readProjectData still falls back to the latest file
                // with content when the tool opens.
                const phaseOrder = Board.PHASES.map(ph => ph.key);
                const movingForward = phaseOrder.indexOf(phaseKey) > phaseOrder.indexOf(project.phase);
                if (phaseKey !== 'dashboard' && movingForward) {
                    try {
                        const existing = await Board.readPhaseFile(project.id, phaseKey);
                        // Copy forward when the target phase has no file, or only a
                        // blank stub that would otherwise open empty.
                        if (!existing || !Board.hasContent(existing)) {
                            // Source = the latest file WITH content (prefers the phase
                            // we are leaving, else the most-advanced meaningful one).
                            const src = await Board.readProjectData(project.id, project.phase);
                            if (src && Board.hasContent(src)) { await Board.writePhaseFile(project.id, phaseKey, src); files[phaseKey] = true; }
                        } else {
                            files[phaseKey] = true;
                        }
                    } catch (e) { /* best effort — the move still proceeds */ }
                }
                const movedAt = new Date().toISOString();
                // phaseChangedAt is what lets pipedrive-sync.mjs tell which side
                // moved the phase most recently when both did.
                const next = currentProjects().map(p => p.id === project.id
                    ? { ...p, phase: phaseKey, files, phaseChangedAt: movedAt, updatedAt: movedAt }
                    : p);
                // Moving into Dashboard means the trial has to reach the product
                // dashboard. Record that on the card instead of navigating there:
                // the card belongs in the Dashboard column now, and dragging it
                // should not throw the user into a different tool.
                if (phaseKey === 'dashboard') {
                    next.forEach((p, i) => { if (p.id === project.id) next[i] = { ...p, dashboardImportPending: true }; });
                }
                await persist(next);
                // persist() resolves even when the write LOST a race: commit()
                // routes that through handleWriteError, which re-reads the folder
                // and drops our change. Saying nothing here is how a drag into
                // Dashboard appeared to work and then sprang back to Report.
                const landed = (manifestRef.current.projects || []).find(p => p.id === project.id);
                if (!landed || landed.phase !== phaseKey) { setError(t.moveLost); return; }
            };

            // A project stores `product` as free text (Pipedrive owns it on CRM
            // cards) and `productId` as the link into the shared product
            // database. Show the linked product's name where there is one, so a
            // card that says "Bimi" reads as "Bimi®Broccolini" once it points at
            // that product. Resolved once here and used by the cards, the filter
            // and the agenda, so those cannot disagree with each other.
            // Whole and Processed of the same produce are different products with
            // different targets, so the state belongs next to the name wherever a
            // project is linked. Unlinked projects show the bare name — nothing
            // knows their state.
            const projectsView = useMemo(() => {
                const byId = {};
                productIndex.forEach(p => { byId[p.id] = p; });
                return (manifest.projects || []).map(p => {
                    const prod = p.productId ? byId[p.productId] : null;
                    if (!prod) return { ...p, product: p.product || '' };
                    const state = prod.state === 'processed' ? t.stateProcessed : t.stateWhole;
                    return {
                        ...p,
                        product: productLabel(prod) + (state ? ' · ' + state : ''),
                        productState: prod.state
                    };
                });
            }, [manifest.projects, productIndex, t]);

            // An archived project stays in the manifest — it just stops being part
            // of the board, the agenda and the filter options. Newest first here:
            // the thing you archived by mistake is the thing you come looking for.
            const activeProjects = useMemo(() => projectsView.filter(p => !p.archivedAt), [projectsView]);
            const archivedProjects = useMemo(() => projectsView
                .filter(p => p.archivedAt)
                .sort((a, b) => String(b.archivedAt).localeCompare(String(a.archivedAt)) || compareProjects(a, b)),
                [projectsView]);

            const matches = (p) => {
                if (filters.client && p.client !== filters.client) return false;
                if (filters.product && p.product !== filters.product) return false;
                if (filters.commercial && p.commercial !== filters.commercial) return false;
                if (filters.productManager && p.productManager !== filters.productManager) return false;
                if (filters.q) {
                    const actionText = getActions(p).map(a => a.text).join(' ');
                    const hay = [p.title, p.client, p.product, p.commercial, p.productManager, p.nextAction, actionText].filter(Boolean).join(' ').toLowerCase();
                    if (!hay.includes(filters.q.toLowerCase())) return false;
                }
                return true;
            };
            const filtered = useMemo(() => activeProjects.filter(matches).sort(compareProjects), [activeProjects, filters]);

            // Always edit the STORED record, never the display view: `product`
            // there may be the resolved product name, and saving that back would
            // overwrite the value Pipedrive owns on CRM cards.
            const editProject = (p) => setEditing(currentProjects().find(x => x.id === p.id) || p);
            const activeFilterCount = (filters.q ? 1 : 0) + FILTER_FIELDS.filter(f => filters[f.key]).length;

            // ---- Render gates ----
            // NOT a component: a plain function that returns the page around
            // `children`. It used to be `const Shell = ({children}) => …` declared
            // here inside App, which gave React a BRAND NEW component type on
            // every App render — so every state change (a people write, a lock
            // poll landing, the sync stamp arriving) tore down the whole subtree
            // and rebuilt it. That silently reset the open edit modal to its
            // initial values, which is why picking a newly added commercial lead
            // or product manager appeared to do nothing. Calling it as a function
            // inlines the markup, so there is no component boundary to remount.
            const shell = (children) => (
                <div className="h-screen overflow-hidden flex flex-col brand-body">
                    {/* The white bar over a thin translucent-blue rule, and no
                        shadow, is how perfotec.com sets its own navigation. */}
                    <header className="bg-white border-b border-blue-600/40 py-3 shrink-0 z-30">
                        <div className="max-w-[1600px] mx-auto px-4 md:px-6 flex items-center justify-between gap-3 flex-wrap">
                            <div className="flex items-center gap-3 min-w-0">
                                <img src={BRAND.logo} alt="PerfoTec logo" className="h-8 shrink-0" />
                                <div className="h-8 border-l border-slate-200" aria-hidden="true"></div>
                                <div className="flex flex-col min-w-0">
                                    <h1 className="brand-heading text-lg md:text-xl tracking-tight truncate flex items-center gap-2" style={{ color: BRAND.black }}>
                                        <LayoutDashboard size={20} style={{ color: BRAND.blue }} />{t.title}
                                    </h1>
                                    <span className="text-[10px] font-bold tracking-widest uppercase" style={{ color: BRAND.green }}>{BRAND.tagline}</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {status === 'ready' && (
                                    <>
                                        {/* One folder holds both halves of the database — switch
                                            between the projects side and the products side. */}
                                        <div className="flex items-center gap-0.5 bg-slate-100 rounded-lg p-0.5" role="tablist">
                                            {[
                                                { key: 'board', label: t.viewBoard, icon: LayoutDashboard },
                                                { key: 'products', label: t.viewProducts, icon: Package },
                                                { key: 'archive', label: t.viewArchive, icon: Archive, count: archivedProjects.length }
                                            ].map(v => (
                                                <button key={v.key} type="button" role="tab" aria-selected={view === v.key} onClick={() => setView(v.key)}
                                                    className={`flex items-center gap-1.5 text-sm font-bold px-3 py-1.5 rounded-md transition-colors ${view === v.key ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500 hover:text-slate-700'}`}>
                                                    <v.icon size={15} style={view === v.key ? { color: BRAND.green } : {}} />
                                                    <span className="hidden sm:inline">{v.label}</span>
                                                    {v.count > 0 && <span className="text-[10px] font-bold text-slate-400 tabular-nums">{v.count}</span>}
                                                </button>
                                            ))}
                                        </div>
                                        {/* Only the two things you act on stay in the header: who
                                            you are, and who else is in here. Folder, backup and CRM
                                            sync are status — they moved into the info popover so the
                                            header reads at a glance. */}
                                        {dbFormat === 'cards' && (
                                            <>
                                                <button type="button" onClick={() => setShowName(true)} title={t.whoChange}
                                                    className="hidden md:flex items-center gap-1.5 text-xs font-bold text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 hover:bg-slate-100">
                                                    <User size={14} style={{ color: BRAND.blue }} /><span className="max-w-[110px] truncate">{userLabel || '—'}</span>
                                                </button>
                                                <div className="relative hidden md:block">
                                                    <button type="button" onClick={() => { setShowPresence(v => !v); setShowInfo(false); }} title={t.whoOnline}
                                                        className={`flex items-center gap-1.5 text-xs font-bold rounded-lg px-2.5 py-1.5 border transition-colors ${showPresence ? 'bg-slate-100 border-slate-300 text-slate-800' : 'text-slate-600 bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                        <Users size={14} style={{ color: BRAND.green }} />
                                                        <span className="tabular-nums">{new Set(presence.map(x => x.user)).size}</span>
                                                    </button>
                                                    {showPresence && <PresencePanel t={t} people={presence} userLabel={userLabel} onClose={() => setShowPresence(false)} />}
                                                </div>
                                            </>
                                        )}
                                        <div className="relative">
                                            <button type="button" onClick={() => { setShowInfo(v => !v); setShowPresence(false); }} title={t.infoTitle}
                                                className={`p-2 rounded-lg transition-colors ${showInfo ? 'bg-slate-100 text-slate-800' : 'text-slate-500 hover:bg-slate-100'}`}>
                                                <Info size={16} />
                                            </button>
                                            {showInfo && (
                                                <InfoPanel t={t} rootName={rootName} dbFormat={dbFormat}
                                                    backupState={backupState} backupBusy={backupBusy} syncState={syncState}
                                                    onChangeFolder={() => { setShowInfo(false); switchFolder(); }}
                                                    onOpenBackups={() => { setShowInfo(false); openBackups(); }}
                                                    onOpenTrash={() => { setShowInfo(false); setView('trash'); }}
                                                    onClose={() => setShowInfo(false)} />
                                            )}
                                        </div>
                                        <button type="button" onClick={loadManifest} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title={t.reload}><RefreshCw size={16} /></button>
                                        {/* Agenda, filter and "new project" act on projects only. */}
                                        {view === 'board' && (
                                            <>
                                                <button type="button" onClick={() => setShowAgenda(true)}
                                                    className="flex items-center gap-1.5 text-sm font-bold px-3 py-2 rounded-lg border text-slate-600 border-slate-200 hover:bg-slate-100" title={t.agenda}>
                                                    <Calendar size={15} /><span className="hidden sm:inline">{t.agenda}</span>
                                                </button>
                                                <div className="relative">
                                                    <button type="button" onClick={() => setShowFilter(v => !v)}
                                                        className={`flex items-center gap-1.5 text-sm font-bold px-3 py-2 rounded-lg border ${activeFilterCount ? 'text-white' : 'text-slate-600 border-slate-200 hover:bg-slate-100'}`}
                                                        style={activeFilterCount ? { backgroundColor: BRAND.blue, borderColor: BRAND.blue } : {}}>
                                                        <Filter size={15} />{t.filter}{activeFilterCount > 0 && <span className="ml-0.5">({activeFilterCount})</span>}
                                                    </button>
                                                    {showFilter && <FilterPanel t={t} projects={activeProjects} filters={filters} setFilters={setFilters} onClose={() => setShowFilter(false)} />}
                                                </div>
                                                <button type="button" onClick={() => setEditing(emptyProject())}
                                                    className="flex items-center gap-1.5 text-sm font-bold text-white px-3 py-2 rounded-lg" style={{ backgroundColor: BRAND.green }}>
                                                    <Plus size={16} />{t.newProject}
                                                </button>
                                            </>
                                        )}
                                    </>
                                )}
                                <LangSwitcher lang={lang} setLang={setLang} />
                            </div>
                        </div>
                    </header>
                    <main id="main-content" className="flex-1 min-h-0 overflow-auto w-full">{children}</main>
                </div>
            );

            if (status === 'loading') return shell(<p className="text-center text-slate-400 mt-20">Loading…</p>);
            if (status === 'unsupported') return shell(<CenterCard icon={AlertTriangle} color={BRAND.orange} title={t.unsupportedTitle} desc={t.unsupportedDesc} />);
            if (status === 'no-folder') return shell(<CenterCard icon={FolderOpen} color={BRAND.green} title={t.noFolderTitle} desc={t.noFolderDesc}
                action={<button type="button" onClick={chooseFolder} className="inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-lg" style={{ backgroundColor: BRAND.green }}><FolderOpen size={16} />{t.chooseFolder}</button>} />);
            if (status === 'needs-permission') return shell(<CenterCard icon={FolderOpen} color={BRAND.blue} title={t.needsPermTitle} desc={t.needsPermDesc}
                action={<div className="flex flex-col gap-2 items-center"><button type="button" onClick={grantAccess} className="inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-lg" style={{ backgroundColor: BRAND.blue }}><Check size={16} />{t.grantAccess}</button>
                    <button type="button" onClick={chooseFolder} className="text-xs font-bold text-slate-500 hover:text-slate-700">{t.changeFolder}</button></div>} />);

            return shell(
                <>
                    {error && (
                        <div className="px-4 md:px-6 pt-3">
                            <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-2 flex items-center gap-2"><AlertTriangle size={16} />{error}</div>
                        </div>
                    )}
                    {/* Still on the single-user format: offer the conversion, and say
                        why it matters before someone else joins this folder. */}
                    {dbFormat === 'legacy' && (
                        <Notice tone="blue" icon={Settings} title={t.migrateTitle}
                            action={<button type="button" onClick={runMigration} disabled={migrating}
                                className="shrink-0 text-xs font-bold text-white px-4 py-2 rounded-lg disabled:opacity-50"
                                style={{ backgroundColor: BRAND.blue }}>{migrating ? t.migrateBusy : t.migrateBtn}</button>}>
                            {t.migrateDesc}
                        </Notice>
                    )}
                    {/* Not an error: our write lost a race and the board was re-read. */}
                    {conflictNote && (
                        <Notice tone="amber" icon={AlertTriangle} title={t.conflictTitle}
                            action={<button type="button" onClick={() => setConflictNote(null)}
                                className="shrink-0 p-1.5 rounded-lg hover:bg-amber-100 text-amber-700"><X size={16} /></button>}>
                            {conflictNote} {t.conflictReloaded}
                        </Notice>
                    )}
                    {/* OneDrive could not merge: somebody's change may be missing. */}
                    {artefacts.length > 0 && (
                        <Notice tone="amber" icon={CloudOff} title={t.artefactTitle}>
                            {t.artefactDesc.replace('{names}', artefacts.join(', '))}
                        </Notice>
                    )}
                    {/* Phase conflicts the sync had to resolve by timestamp. Only
                        those since the last run are shown — older ones are history. */}
                    {(() => {
                        const recent = (syncState?.conflicts || []).filter(c => syncState.lastRunAt && c.at >= syncState.lastRunAt);
                        if (!recent.length) return null;
                        return (
                            <div className="px-4 md:px-6 pt-3">
                                <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg px-4 py-2 flex items-start gap-2">
                                    <AlertTriangle size={16} className="shrink-0 mt-0.5" />
                                    <div className="min-w-0">
                                        <p className="font-bold">{t.conflictWarn.replace('{n}', recent.length)}</p>
                                        <ul className="mt-0.5 text-xs space-y-0.5">
                                            {recent.slice(0, 5).map((c, i) => (
                                                <li key={i} className="truncate">
                                                    {c.label}: {c.boardPhase} ⇄ {c.pipedrivePhase} → <strong>{c.resolvedTo}</strong>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                    {view === 'trash' ? (
                        <TrashView t={t} trash={trash}
                            onRestoreCard={restoreCard} onRestoreProduct={restoreProduct}
                            onPurgeCard={purgeCard} onPurgeProduct={purgeProduct} />
                    ) : view === 'archive' ? (
                        <ArchiveView t={t} projects={archivedProjects}
                            onOpen={openArchived} onUnarchive={unarchiveProject} onDelete={deleteProject} />
                    ) : view === 'products' ? (
                        <div className="max-w-[1600px] mx-auto px-4 md:px-6 pt-6 pb-8">
                            {productIndex.length === 0 ? (
                                <p className="text-sm text-slate-400">{t.noProducts}</p>
                            ) : (
                                <div className="grid gap-4 sm:gap-5" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' }}>
                                    {productIndex.map(prod => (
                                        <ProductCard key={prod.id} t={t} product={prod}
                                            projectCount={manifest.projects.filter(p => p.productId === prod.id && !p.archivedAt).length}
                                            archivedCount={manifest.projects.filter(p => p.productId === prod.id && p.archivedAt).length}
                                            onOpen={openProductInDashboard} />
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : (
                    <>
                    {activeProjects.length === 0 && (
                        <p className="px-4 md:px-6 pt-4 text-xs text-slate-400">{t.noProjects}</p>
                    )}
                    <div className="px-4 md:px-6 pt-3 pb-8">
                        {/* w-max + mx-auto centres the columns when they fit, and
                            falls back to left-aligned horizontal scrolling when they
                            don't (e.g. narrow / mobile screens). */}
                        {/* onArchive is only wired up for the Dashboard column: a
                            project that reached the dashboard is the only one that
                            can be finished. Anywhere else, archiving would just
                            hide work that still has to happen. */}
                        <div className="w-max mx-auto flex gap-3 sm:gap-4 items-stretch">
                            {Board.PHASES.map(phase => (
                                <Column key={phase.key} t={t} phase={phase} locks={locks}
                                    projects={filtered.filter(p => p.phase === phase.key)}
                                    onDragStart={onDragStart} onDrop={onDrop} onHeaderClick={startNewInPhase}
                                    onOpen={openInTool} onEdit={editProject} onDelete={deleteProject}
                                    onArchive={phase.key === 'dashboard' ? archiveProject : null}
                                    onActionOpen={openAction} onActionToggle={toggleActionDone} />
                            ))}
                        </div>
                    </div>
                    </>
                    )}
                    {/* Keyed on the project: switching to another card must give a
                        fresh form, but a re-render of the SAME card must not — the
                        modal holds the user's unsaved edits. */}
                    {editing && <ProjectModal key={editing.id || 'new'} t={t} initial={editing} onSave={saveProject} onClose={() => setEditing(null)} people={people} productIndex={productIndex} onAddPerson={addPerson} onUpdatePerson={updatePerson} onRenamePerson={renamePerson} onDeletePerson={deletePerson} />}
                    {showAgenda && <AgendaModal t={t} lang={lang} projects={activeProjects} people={people} todayISO={todayISO} onActionOpen={openAction} onActionToggle={toggleActionDone} onClose={() => setShowAgenda(false)} />}
                    {/* Asked once on the shared store: an unattributed change history
                        is useless to a team. Also reachable from the header chip. */}
                    {(showName || (dbFormat === 'cards' && !userLabel)) && (
                        <NameModal t={t} initial={userLabel} onSave={saveUserLabel} onClose={() => setShowName(false)} />
                    )}
                    {showBackups && (
                        <BackupsModal t={t} state={backupState} list={backupList} busy={backupBusy}
                            onBackupNow={backupNow} onRestore={restoreBackup} onClose={() => setShowBackups(false)} />
                    )}
                </>
            );
        };

        document.documentElement.lang = getInitialLang();
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
