                        </NarrowFold>

                        {/* The reports behind this product, last: the panels above are
                            the product overview at a glance. */}
                        <NarrowFold title="Trials in the workflow">{renderWorkflowTrials()}</NarrowFold>

                    </div>
                );
            };

            // ══ COMMERCIAL PACKAGE ══════════════════════════════════════════════
            // What a salesperson sends a (prospective) client, built from this
            // product's data but never straight from the live numbers: a CLAIM is
            // drafted from one configuration's record, worded by a person and
            // approved by a PerfoTec product manager (decided 2026-10-28). Approved
            // claims are frozen snapshots; when the data moves on, the claim says so
            // and a new version is drafted — it never changes under a client's eyes.
            //
            // Stored in formData.commercial = { claims: [...], documents: [...] }.
            // Two rules from earlier decisions hold here: TV values and respiration
            // rates never reach a client document, and client names never do either.
            const COMMERCIAL_SECTIONS = [
                { id: '01', title: 'Product & technology', titleNl: 'Product & technologie', hint: 'How PerfoTec works for this product: the presentation, the brochure.' },
                { id: '02', title: 'Technical information', titleNl: 'Technische informatie', hint: 'The film technical data sheet (TDS), product specification, perforation and OTR class.' },
                { id: '03', title: 'Files to share', titleNl: 'Te delen bestanden', hint: 'Anonymised trial reports, photos, video, case studies.' },
                { id: '04', title: 'Pilot & commercial', titleNl: 'Pilot & commercieel', hint: 'Demo or pilot proposal, the information we need from the client, terms.' },
            ];
            // Words that would put a TV value or a respiration rate in front of a client.
            const INTERNAL_TERMS = /\b(TV|TVs)\b|transmission value|transmissiewaarde|respiration rate|respiratiesnelheid|ademhalingssnelheid|ml\s*\/\s*kg|mL\s*\/\s*kg\s*\/\s*h/i;

            // The shelf life a configuration can state: the longest one that at
            // least two of its rounds reached (the same two-round rule as "proven"),
            // one round only when there is no second.
            const claimHeadline = (cfg) => {
                const rs = [...(cfg.rounds || [])].sort((a, b) => b.days - a.days || (b.open ? 1 : 0) - (a.open ? 1 : 0));
                const pick = rs[1] || rs[0];
                return pick ? { days: pick.days, open: !!pick.open, rounds: rs.filter(r => r.days >= pick.days).length } : null;
            };
            const claimSnapshot = (cfg) => {
                const h = claimHeadline(cfg) || {};
                return {
                    material: cfg.material, type: cfg.type, condition: cfg.condition, tempBand: cfg.tempBand,
                    temp: cfg.temp, o2: cfg.o2, co2: cfg.co2, o2Typical: cfg.o2Typical, co2Typical: cfg.co2Typical,
                    roundCount: cfg.roundCount, compared: cfg.compared, better: cfg.better, equal: cfg.equal, worse: cfg.worse,
                    censoredTies: cfg.censoredTies, medianDays: cfg.medianDays, referenceMedianDays: cfg.referenceMedianDays,
                    varieties: cfg.varieties.length, headlineDays: h.days != null ? h.days : null, headlineOpen: !!h.open, headlineRounds: h.rounds || 0,
                    // The register films its trials were packed in, with the names
                    // they had when the claim was drafted.
                    films: cfg.films || [], filmNames: (cfg.films || []).map(id => (filmById(id) || {}).name).filter(Boolean),
                };
            };
            const tempRangeText = (t) => !t ? '' : (t.min === t.max ? `${t.min} °C` : `${t.min}–${t.max} °C`);
            // "O₂ 15–18% · CO₂ 6–9%": the middle half of a configuration's trials at
            // the end of the trial. That is what a configuration IS for the result —
            // the target in its name ("10% O2 target") is how it was designed, and
            // the packs did not settle there. `whole` rounds for client text.
            const atmosphereText = (o2, co2, whole) => {
                const f = (t) => {
                    if (!t) return null;
                    const r = (x) => whole ? Math.round(x) : x;
                    return r(t.low) === r(t.high) ? `${r(t.mid)}` : `${r(t.low)}–${r(t.high)}`;
                };
                const a = f(o2), b = f(co2);
                return [a != null ? `O₂ ${a}%` : '', b != null ? `CO₂ ${b}%` : ''].filter(Boolean).join(' · ');
            };
            // A first draft in plain words, EN and NL, from the record alone. The
            // median is only mentioned when it differs: with most rounds stopped
            // while both packs were fine, "21 vs 21 days" says nothing.
            const claimDraftText = (s, productName) => {
                const t = tempRangeText(s.temp);
                const ge = s.headlineOpen ? 'at least ' : '';
                const geNl = s.headlineOpen ? 'minstens ' : '';
                const type = String(s.type || '').toLowerCase();
                const medDiff = s.medianDays != null && s.referenceMedianDays != null && Math.abs(s.medianDays - s.referenceMedianDays) >= 3;
                const cult = s.varieties > 1 ? ` across ${s.varieties} cultivars` : '';
                const cultNl = s.varieties > 1 ? ` op ${s.varieties} rassen` : '';
                // Described by the atmosphere the packs reached, not by the variant's
                // name: "10% O2 target" packs settled at 15–18 % O₂.
                const span = (x) => !x ? null : (Math.round(x.low) === Math.round(x.high) ? `${Math.round(x.mid)}%` : `${Math.round(x.low)}–${Math.round(x.high)}%`);
                const o2 = span(s.o2Typical), co2 = span(s.co2Typical);
                const held = [o2 ? `O₂ at ${o2}` : '', co2 ? `CO₂ at ${co2}` : ''].filter(Boolean).join(' and ');
                const heldNl = [o2 ? `O₂ op ${o2}` : '', co2 ? `CO₂ op ${co2}` : ''].filter(Boolean).join(' en ');
                // The film by name when the configuration was packed in one film:
                // "PerfoTec BOPE MAP packaging that held …".
                const filmName = (s.filmNames || []).length === 1 ? s.filmNames[0] : '';
                const what = held ? `${filmName || 'PerfoTec'} ${s.condition} packaging that held ${held}` : `${s.material} (${s.condition})`;
                const whatNl = held ? `${filmName ? `${filmName}-${s.condition}-verpakking` : `PerfoTec-${s.condition}-verpakking`} die ${heldNl} hield` : `${s.material} (${s.condition})`;
                // Only the outcomes that happened: "as long in 0" says nothing.
                const parts = (b, e, w, words) => [b ? `${words[0]} in ${b}` : '', e ? `${words[1]} in ${e}` : '', w ? `${words[2]} in ${w}` : ''].filter(Boolean).join(', ');
                const tiesEn = s.censoredTies ? ` (in ${s.censoredTies} of the equal rounds both were still within specification when the trial ended)` : '';
                const tiesNl = s.censoredTies ? ` (in ${s.censoredTies} van de gelijke rondes waren beide nog binnen specificatie toen de proef stopte)` : '';
                const roundsEn = (n) => `${n} round${n !== 1 ? 's' : ''}`, roundsNl = (n) => `${n} ronde${n !== 1 ? 's' : ''}`;
                const en = `${productName} in a ${type} with ${what}${t ? ` at ${t}` : ''} stayed within specification for ${ge}${s.headlineDays} days in ${s.headlineRounds >= 2 ? 'at least two trial rounds' : 'one trial round'}.`
                    + (s.compared ? ` Against the client's current packaging in ${roundsEn(s.compared)}${cult}: ${parts(s.better, s.equal, s.worse, ['longer', 'as long', 'shorter'])}${tiesEn}.` : '')
                    + (medDiff ? ` Median shelf life ${s.medianDays} against ${s.referenceMedianDays} days.` : '');
                const nl = `${productName} in een ${type} met ${whatNl}${t ? ` bij ${t}` : ''} bleef ${geNl}${s.headlineDays} dagen binnen specificatie in ${s.headlineRounds >= 2 ? 'ten minste twee proefrondes' : 'één proefronde'}.`
                    + (s.compared ? ` Tegenover de huidige verpakking van de klant in ${roundsNl(s.compared)}${cultNl}: ${parts(s.better, s.equal, s.worse, ['langer', 'even lang', 'korter'])}${tiesNl}.` : '')
                    + (medDiff ? ` Mediane houdbaarheid ${s.medianDays} tegen ${s.referenceMedianDays} dagen.` : '');
                return { en, nl };
            };

            useEffect(() => {
                if (activeTab !== 'commercial' || peopleReg) return;
                const B = window.PerfoTecBoard;
                if (!B || !B.readPeople) { setPeopleReg({ productManagers: [], commercials: [] }); return; }
                B.readPeople().then(p => setPeopleReg(p || { productManagers: [] })).catch(() => setPeopleReg({ productManagers: [], commercials: [] }));
            }, [activeTab, peopleReg]);

            // Who is working: the server knows its user; the shared folder knows the
            // label chosen on the board, resolved against the people registry.
            const currentUserName = () => {
                const B = window.PerfoTecBoard;
                const serverUser = window.PERFOTEC_SERVER && window.PERFOTEC_SERVER.user && window.PERFOTEC_SERVER.user.name;
                const label = serverUser || (B && B.getUserLabel ? B.getUserLabel() : '');
                const pms = (peopleReg && peopleReg.productManagers) || [];
                return { label, name: B && B.resolvePersonName ? B.resolvePersonName(label, pms) : label, fromServer: !!serverUser };
            };
            // What the TV curve takes from the product: the slope of its predictive
            // respiration curve — the same regression the respiration chart draws —
            // and the product sheet's Q10 as the fallback. For a film it also needs
            // the product's limits: the O₂ it must not go below (ACP, the target
            // window's minimum), the CO₂ it tolerates, and its RQ (the measured
            // one, else CO₂ against O₂ respiration where both were logged, else 1).
            const tvCurveInputs = () => {
                const p1c1 = localFormData['p1-core-1'] || {}, p1c2 = localFormData['p1-core-2'] || {}, p1c3 = localFormData['p1-core-3'] || {};
                const hubRec = localFormData['hub-respiration'] || null;
                const reg = getRegressionCurve(p1c2, 'O2', hubRec) || getRegressionCurve(p1c2, 'CO2', hubRec);
                const q = parseFloat(p1c1.q10);
                const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };
                let rq = num(p1c1.rq);
                if (rq == null || rq < 0.5 || rq > 2) {
                    const ratios = [];
                    Object.keys(p1c2).forEach(k => {
                        const m = k.match(/^(target_)?temp(-?[\d.]+)_O2$/);
                        if (!m) return;
                        const o = num(p1c2[k]), c = num(p1c2[k.replace(/_O2$/, '_CO2')]);
                        if (o > 0 && c > 0) ratios.push(c / o);
                    });
                    ratios.sort((a, b) => a - b);
                    const mid = ratios.length ? ratios[Math.floor(ratios.length / 2)] : null;
                    rq = mid != null && mid >= 0.5 && mid <= 2 ? mid : 1;
                }
                const floors = [num(p1c1.acp), num(p1c3.targetO2Min)].filter(v => v != null && v > 0);
                return {
                    respSlope: reg ? reg.slope : undefined, q10: isFinite(q) ? q : undefined,
                    rq, o2Floor: floors.length ? Math.max(...floors) : undefined, co2Max: num(p1c1.critCO2) != null ? num(p1c1.critCO2) : undefined,
                    films: filmReg ? filmReg.films : [],
                };
            };

            // ── The film register ──
            // ── PerfoTec Hub catalogue ────────────────────────────────────────────
            // Imported as a file the Hub exports (format perfotec-hub-catalogue/1);
            // the same object an API of the Hub would return later. Read-only here:
            // the dashboard never writes to the Hub.
            // The Hub's respiration measurements the product on screen has stored
            // (formData['hub-respiration'], written by syncHubData).
            const hubRespirations = () => { const rec = localFormData['hub-respiration']; return rec && Array.isArray(rec.measurements) ? rec.measurements : []; };
            const hubRespSummary = () => {
                const ok = hubRespirations().filter(r => r.status !== 'NOK');
                return { n: ok.length, temps: [...new Set(ok.map(r => r.temperature))].sort((a, b) => a - b) };
            };
            // Bring what the Hub leads into the dashboard's own data (Luke 2026-11-13):
            //   * films — the register follows the Hub's name, thickness, OTR and
            //     CO2TR and gets the films it lacks; WVTR and the rest stay ours;
            //   * respiration — each product record gets the measurements of its
            //     Hub varieties (linked on name, variety and whole/processed) as
            //     data: RR O2, RR CO2, temperature, origin, date. Stored there,
            //     they drive the product's respiration curve when they cover
            //     enough temperatures, and its calculated Q10 with it.
            // Runs after an import and after a link changes. Never writes to the Hub.
            const syncHubData = async (hubState) => {
                const B = window.PerfoTecBoard;
                const hub = hubState || hubReg;
                if (!B || !hub || !hub.catalogue || !B.hubRespirationRecord) return '';
                const notes = [];
                try {
                    const reg = await B.readFilms();
                    const r = B.hubSyncFilms(reg.films, hub);
                    setFilmReg(r.added || r.updated ? await B.writeFilms({ ...reg, films: r.films }, reg.rev) : reg);
                    notes.push(r.added || r.updated ? `films: ${r.added} added, ${r.updated} brought up to date` : 'films up to date');
                } catch (e) { notes.push('films not synced (' + (e && e.message ? e.message : 'error') + ')'); }
                const sig = (rec) => rec ? JSON.stringify([rec.hubProductId, rec.varietyIds, rec.measurements]) : '';
                const now = new Date().toISOString();
                const next = new Map();
                let withData = 0, measurements = 0;
                products.filter(p => p && !p.isAverage).forEach(p => {
                    const fd = latestFormData(p.id) || {};
                    const rec = B.hubRespirationRecord(p, hub);
                    if (rec) { withData++; measurements += rec.measurements.length; }
                    if (sig(rec) === sig(fd['hub-respiration'])) return;
                    const out = { ...fd };
                    if (rec) out['hub-respiration'] = { ...rec, syncedAt: now }; else delete out['hub-respiration'];
                    Object.assign(out, withHistory(out, rec ? `Hub respiration synced: ${rec.measurements.length} measurement${rec.measurements.length !== 1 ? 's' : ''} of ${rec.hubProduct}` : 'Hub respiration removed (no longer linked)'));
                    // A calculated Q10 follows the curve; one from the sheet or typed stays.
                    const src = (out['p1-core-1'] || {}).q10Source || '';
                    const q10 = calculateQ10(out['p1-core-2'], out['hub-respiration']);
                    if (q10 && src !== 'sheet' && src !== 'manual') out['p1-core-1'] = { ...(out['p1-core-1'] || {}), q10, q10Source: 'calculated' };
                    next.set(p.id, out);
                });
                if (next.size) {
                    if (db) { for (const [id, fd] of next) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id), { formData: fd }); }
                    else setProducts(prev => prev.map(p => next.has(p.id) ? { ...p, formData: next.get(p.id) } : p));
                    if (next.has(activeProductId)) setLocalFormData(next.get(activeProductId));
                }
                notes.push(`respiration: ${measurements} measurement${measurements !== 1 ? 's' : ''} in ${withData} product${withData !== 1 ? 's' : ''}${next.size ? `, ${next.size} product${next.size !== 1 ? 's' : ''} updated` : ', nothing changed'}`);
                return notes.join(' · ');
            };
            const importHubCatalogue = async () => {
                const B = window.PerfoTecBoard;
                if (!B || !B.writeHub) return;
                try {
                    const [handle] = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'PerfoTec Hub catalogue', accept: { 'application/json': ['.json'] } }] });
                    const parsed = JSON.parse(await (await handle.getFile()).text());
                    if (!parsed || parsed.format !== B.HUB_FORMAT) { setHubMsg('This file is not a PerfoTec Hub catalogue export.'); return; }
                    const out = await B.writeHub({ catalogue: parsed });
                    setHubReg(out);
                    const c = out.catalogue;
                    const synced = await syncHubData(out);
                    setHubMsg(`✓ Hub catalogue imported: ${c.products.length} products, ${c.varieties.length} varieties, ${c.films.length} films, ${c.packages.length} packages, ${c.laserPrograms.length} laser programs, ${c.respirations.length} respiration measurements · ${synced}`);
                } catch (e) { if (!e || e.name !== 'AbortError') setHubMsg('The catalogue could not be imported: ' + (e && e.message ? e.message : 'unknown error')); }
            };
            // hubId: a Hub id, '' (deliberately not linked) or null (match on name again).
            const linkHub = async (kind, id, hubId) => {
                const B = window.PerfoTecBoard;
                if (!B || !B.writeHub) return;
                try {
                    const out = await B.writeHub({ links: { [kind]: { [id]: hubId } } });
                    setHubReg(out);
                    // A link decides which measurements and which film a record follows.
                    const synced = await syncHubData(out);
                    if (synced) setHubMsg('✓ Link saved · ' + synced);
                }
                catch (e) { setHubMsg('The link could not be saved: ' + (e && e.message ? e.message : 'unknown error')); }
            };

            const filmById = (id) => (filmReg && id ? filmReg.films.find(f => f.id === id) : null) || null;
            const filmNameTaken = (name, id) => !!(filmReg && filmReg.films.some(f => f.id !== id && f.name.trim().toLowerCase() === String(name).trim().toLowerCase()));
            // Saves one film (new or edited) and, from a trial row's "+ New film…",
            // links it to that row. Returns a promise the editor waits on.
            const saveFilm = (draft, row) => {
                const B = window.PerfoTecBoard;
                if (!B || !B.writeFilms) return Promise.reject(new Error('the shared folder is not connected'));
                const reg = filmReg || { rev: 0, films: [] };
                const now = new Date().toISOString();
                const film = B.normFilm({ ...draft, id: draft.id || B.newFilmId(), createdAt: draft.createdAt || now, updatedAt: now, updatedBy: B.getUserLabel ? B.getUserLabel() : '' });
                const films = reg.films.some(f => f.id === film.id) ? reg.films.map(f => f.id === film.id ? film : f) : [...reg.films, film];
                return B.writeFilms({ ...reg, films }, reg.rev).then(saved => {
                    setFilmReg(saved);
                    setFilmEdit(null);
                    if (row != null) handleFieldChange('p2-pack-master', `pack_opt_${row}_film`, film.id);
                    setFilmMsg(`✓ ${film.name} saved${row != null ? ` and linked to trial ${row + 1}` : ''}.`);
                    setTimeout(() => setFilmMsg(''), 6000);
                    return film;
                });
            };
            const setFilmArchived = (film, archived) => saveFilm({ ...film, archived }).catch(e => setFilmMsg(`⚠ Not saved: ${(e && e.message) || e}`));
            // PerfoTec's own films, added once with what is known for sure; polymer,
            // thickness, OTR and the TDS are filled in from the data sheets.
            const OWN_FILMS = [
                { name: 'PerfoTec BOPE', polymer: 'BOPE', format: 'Flowpack film', packTypes: ['Punnet', 'Flowpack'] },
                { name: 'PerfoTec Liner', format: 'Liner', packTypes: ['Crate/Box'] },
                { name: 'PerfoTec Pallet Cover', format: 'Pallet cover', packTypes: ['Pallet'] },
            ];
            const addOwnFilms = () => {
                const B = window.PerfoTecBoard;
                if (!B || !B.writeFilms) return;
                const reg = filmReg || { rev: 0, films: [] };
                const now = new Date().toISOString(), me = B.getUserLabel ? B.getUserLabel() : '';
                const missing = OWN_FILMS.filter(o => !filmNameTaken(o.name, null)).map(o => B.normFilm({ ...o, own: true, id: B.newFilmId(), createdAt: now, updatedAt: now, updatedBy: me }));
                if (!missing.length) return;
                B.writeFilms({ ...reg, films: [...reg.films, ...missing] }, reg.rev)
                    .then(saved => { setFilmReg(saved); setFilmMsg(`✓ Added ${missing.map(f => f.name).join(', ')} — fill in polymer, thickness, OTR and the TDS.`); })
                    .catch(e => setFilmMsg(`⚠ Not saved: ${(e && e.message) || e}`));
            };

            // A claim draft from one configuration's record — from the Commercial tab
            // or straight from the quality chart. An open draft for the same
            // configuration is reused rather than duplicated; `base` carries the text
            // of an approved claim into its next version.
            const draftClaimFor = (cfg, base) => {
                const com = localFormData.commercial || {};
                const claims = Array.isArray(com.claims) ? com.claims : [];
                const open = claims.find(c => c.key === cfg.key && c.status === 'draft');
                if (open) return open;
                const snapshot = claimSnapshot(cfg);
                const versions = claims.filter(c => c.key === cfg.key).map(c => c.version || 1);
                const who = currentUserName();
                const claim = {
                    id: `c_${Date.now().toString(36)}`, key: cfg.key, version: versions.length ? Math.max(...versions) + 1 : 1,
                    status: 'draft', createdAt: new Date().toISOString(), createdBy: who.name || who.label || '',
                    snapshot, text: base && base.text ? { ...base.text } : claimDraftText(snapshot, activeProduct ? activeProduct.name : 'This product'),
                };
                return patchTask('commercial', { claims: [...claims, claim] }) ? claim : null;
            };

            // ══ PRODUCT OVERVIEW ════════════════════════════════════════════════
            // The commercial status of the whole range: for one packaging, every
            // product's best result per temperature group (0 °C below 2.5, 5 °C from
            // 2.5 to 7.5, …) and pack size — what to pack, at which TV, how long it
            // held, and the report it comes from. Opened from the masthead.
            const OVERVIEW_DAYS = [0, 7, 14, 21, 28];
            const productLabelOf = (p) => [p.name, p.variety].filter(Boolean).join(' · ') + (p.state === 'processed' ? ' (processed)' : '');
            const goToProduct = (id, tab) => { setGlobalPage(null); setActiveProductId(id); setActiveTab(tab || 'dashboard'); window.scrollTo({ top: 0, behavior: 'instant' }); };
            // Fields of one product's trial table, through the same path as an edit
            // in the Database (buffer first for the product on screen).
            // `what`: the line this leaves in the product's change log.
            const patchProductMaster = async (productId, patch, what) => {
                const target = products.find(p => p.id === productId);
                if (!target || target.isAverage || !patch || (!Object.keys(patch).length && !what)) return false;
                let fd = JSON.parse(JSON.stringify(latestFormData(productId) || {}));
                fd['p2-pack-master'] = { ...(fd['p2-pack-master'] || {}), ...patch };
                if (what) fd = withHistory(fd, what);
                if (db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId), { formData: fd });
                else setProducts(prev => prev.map(p => p.id === productId ? { ...p, formData: fd } : p));
                if (productId === activeProductId) setLocalFormData(fd);
                return true;
            };
            // A proposal for a verification round: a card in Proposal on the board
            // with the winning settings filled in. Written only after a yes.
            const planVerification = async (item) => {
                const B = window.PerfoTecBoard;
                if (!B || !B.verificationProposal || !B.writePhaseFile || !B.writeManifest) return;
                const w = item.group.winner, label = [item.product.name, w.variety || item.product.variety].filter(Boolean).join(' ');
                if (!window.confirm(`Create a proposal for a verification round of ${label}?\n\n${item.type}${w.temp != null ? `, ${w.temp} °C` : ''}, ${w.shelfLife.open ? '≥ ' : ''}${w.shelfLife.days} days to reach. It is added to the board in Proposal, with the winning settings filled in.`)) return;
                const plan = B.verificationProposal(item.product, item.group, { films: filmReg ? filmReg.films : [], rows: item.rows, user: B.getUserLabel ? B.getUserLabel() : '' });
                if (!plan) return;
                try {
                    await B.writePhaseFile(plan.card.id, 'proposal', plan.doc);
                    const manifest = await B.readManifest();
                    manifest.projects = [...(manifest.projects || []), plan.card];
                    await B.writeManifest(manifest);
                    loadBoardCards();
                    await patchProductMaster(item.product.id, {}, `Verification round planned: ${item.type}${w.temp != null ? `, ${w.temp} °C` : ''}, ${w.shelfLife.open ? '≥ ' : ''}${w.shelfLife.days} days to reach`);
                    setWorkMsg({ text: `✓ Proposal created for the verification round of ${label}.`, href: 'proposal.html?boardProject=' + encodeURIComponent(plan.card.id) });
                } catch (e) { setWorkMsg({ text: 'The proposal could not be created: ' + (e && e.message ? e.message : 'unknown error') }); }
            };
            const acceptChecksFor = async (p) => {
                const B = window.PerfoTecBoard;
                const master = (latestFormData(p.id) || {})['p2-pack-master'] || {};
                const r = B.acceptDataChecks(master, [p.name, ...(p.aliases || [])].filter(Boolean), filmReg ? filmReg.films : []);
                if (!r.accepted) return;
                if (!window.confirm(`Apply ${r.accepted} suggestion${r.accepted !== 1 ? 's' : ''} to ${productLabelOf(p)}?\n\nVarieties read from report titles, packaging types read from variant names and films read from the register are written into the trial rows. You can review them one by one in the product instead.`)) return;
                if (await patchProductMaster(p.id, r.patch, `Accepted ${r.accepted} data-check suggestion${r.accepted !== 1 ? 's' : ''}`)) setWorkMsg({ text: `✓ ${r.accepted} suggestion${r.accepted !== 1 ? 's' : ''} applied to ${productLabelOf(p)}${r.open ? ` · ${r.open} still need a value typed` : ''}.` });
            };
            const applyBulk = async (p, report) => {
                const B = window.PerfoTecBoard;
                const d = bulkDraft[`${p.id}|${report.key}`] || {};
                const master = (latestFormData(p.id) || {})['p2-pack-master'] || {};
                const r = B.fillTrialFields(master, report.idxs, { film: d.film, perf: d.perf, flush: d.flush }, { perfotecOnly: d.scope !== 'all' });
                if (!r.filled) { setWorkMsg({ text: 'Nothing to fill: choose a value, or these rows already have one.' }); return; }
                if (await patchProductMaster(p.id, r.patch, `Filled ${r.filled} field${r.filled !== 1 ? 's' : ''} for the report ${report.pdf || report.date || 'without a name'}`)) {
                    setBulkDraft(prev => { const n = { ...prev }; delete n[`${p.id}|${report.key}`]; return n; });
                    setWorkMsg({ text: `✓ ${r.filled} field${r.filled !== 1 ? 's' : ''} filled in ${productLabelOf(p)}.` });
                }
            };

            // Trials under way on the board: so nobody starts the same test twice,
            // and sales can see what is coming.
            const renderRunningList = () => {
                const B = window.PerfoTecBoard;
                const phaseLabel = (c) => (B && B.phaseByKey && B.phaseByKey[c.phase] ? B.phaseByKey[c.phase].label : c.phase);
                const toolOf = (c) => (B && B.phaseByKey && B.phaseByKey[c.phase] ? B.phaseByKey[c.phase].tool : 'board.html') + '?boardProject=' + encodeURIComponent(c.id);
                const nProducts = Object.keys(runningNow.byProduct).length;
                const row = (c, product) => (
                    <div key={c.id} className="px-4 py-3 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-2">
                        <div className="flex-1 min-w-[220px]">
                            {product
                                ? <button type="button" onClick={() => goToProduct(product.id)} className="font-bold text-slate-900 hover:text-[#084BCD] text-left">{productLabelOf(product)}</button>
                                : <span className="font-bold text-amber-800">Not linked to a product{c.product ? <span className="font-normal text-slate-600"> — "{c.product}"</span> : ''}</span>}
                            <span className="block text-xs text-slate-500 break-words">{[c.title, c.client].filter(Boolean).join(' · ') || 'Untitled trial'}</span>
                        </div>
                        <span className="text-[10px] font-bold uppercase px-2 py-1 rounded bg-[#084BCD]/10 text-[#084BCD] whitespace-nowrap">{phaseLabel(c)}</span>
                        <span className="text-xs text-slate-600 whitespace-nowrap">{c.startDate ? `since ${fmtIsoDate(c.startDate)}` : 'no start date'}</span>
                        <span className="text-xs text-slate-600 whitespace-nowrap min-w-[110px]">{c.productManager || 'no product manager'}</span>
                        {!isCommercial && <a href={toolOf(c)} className="text-xs font-bold text-[#084BCD] hover:underline whitespace-nowrap">Open</a>}
                    </div>
                );
                return (
                    <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                        <div className="p-4 bg-slate-50 flex flex-wrap items-center gap-3">
                            <h3 className="font-spartan font-bold text-slate-900">Trials running now</h3>
                            <span className="text-xs text-slate-500">{boardCards === null ? 'Reading the board…' : (() => { const linked = runningNow.all.length - runningNow.unlinked.length, n = isCommercial ? linked : runningNow.all.length; return `${n} trial${n !== 1 ? 's' : ''}${isCommercial ? '' : ` — ${linked}`} for ${nProducts} product${nProducts !== 1 ? 's' : ''}${!isCommercial && runningNow.unlinked.length ? `, ${runningNow.unlinked.length} not linked to a product` : ''}`; })()}</span>
                            <p className="basis-full text-xs text-slate-500">On the board and not finished yet: intake, proposal, accepted or report. Their results reach the product when the trial moves to Dashboard.</p>
                        </div>
                        {boardCards !== null && runningNow.all.length - (isCommercial ? runningNow.unlinked.length : 0) === 0 && <p className="p-8 text-center text-sm text-slate-500">No trial is running at the moment.</p>}
                        {runningNow.unlinked.length > 0 && !isCommercial && (
                            <div className="border-t border-amber-200 bg-amber-50/60">
                                <p className="px-4 pt-3 text-xs font-bold text-amber-900">Link these to a product on the board, or their results will not reach a product. <a href="board.html" className="underline">Open the board</a></p>
                                {runningNow.unlinked.map(c => row(c, null))}
                            </div>
                        )}
                        {products.filter(p => p && !p.isAverage && runningNow.byProduct[p.id]).sort((a, b) => a.name.localeCompare(b.name)).flatMap(p => runningNow.byProduct[p.id].map(c => row(c, p)))}
                    </div>
                );
            };

            // Results that rest on one round, the longest shelf life first, each
            // with a button that turns it into a proposal for the second round.
            const renderVerifyList = () => {
                const inType = (workLists ? workLists.verify : []).filter(it => !verifyType || it.type === verifyType);
                const items = inType.filter(it => !it.reference), beaten = inType.filter(it => it.reference);
                const all = (workLists ? workLists.verify : []).filter(it => !it.reference);
                return (
                    <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                        <div className="p-4 bg-slate-50 flex flex-wrap items-center gap-3">
                            <h3 className="font-spartan font-bold text-slate-900">Results to verify</h3>
                            <span className="text-xs text-slate-500">{items.length} result{items.length !== 1 ? 's' : ''} in {new Set(items.map(it => it.product.id)).size} product{new Set(items.map(it => it.product.id)).size !== 1 ? 's' : ''}</span>
                            <div className="ml-auto flex flex-wrap rounded-lg border border-slate-200 bg-white p-1 gap-1">
                                {[['', 'All'], ['Punnet', 'Punnet'], ['Flowpack', 'Flowpack'], ['Crate/Box', 'Crate / Box'], ['Pallet', 'Pallet']].map(([id, label]) => (
                                    <button key={id} type="button" onClick={() => setVerifyType(id)} className={`px-3 py-1.5 rounded-md text-xs font-bold uppercase tracking-widest ${verifyType === id ? 'bg-[#084BCD] text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{label}{id ? ` ${all.filter(it => it.type === id).length}` : ''}</button>
                                ))}
                            </div>
                            <p className="basis-full text-xs text-slate-500">One round reached these. A second round at the same settings that reaches the same shelf life makes a result proven, and the product commercially ready. "Plan verification round" adds a proposal to the board with the product, packaging, weight, temperature, film, transmission and gas at packing of the winning variant filled in.</p>
                        </div>
                        {items.length === 0 && beaten.length === 0 && <p className="p-8 text-center text-sm text-slate-500">Nothing to verify{verifyType ? ' in this packaging' : ''}.</p>}
                        {[...items, ...beaten].map((it, n) => {
                            const w = it.group.winner, B = window.PerfoTecBoard;
                            const film = (filmReg ? filmReg.films : []).find(f => f.id === w.film);
                            const tv = B.plausibleTv ? B.plausibleTv(w.trans) : null;
                            const running = runningNow.byProduct[it.product.id] || [];
                            return (
                                <React.Fragment key={it.key}>
                                {it.reference && n === items.length && (
                                    <p className="px-4 py-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-600"><b className="text-slate-900">The current packaging did best here ({beaten.length}).</b> No PerfoTec variant has beaten it at this temperature and pack size yet: that asks for a new setting, not for a verification round.</p>
                                )}
                                <div className="px-4 py-3 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-2">
                                    <div className="flex-1 min-w-[220px]">
                                        <button type="button" onClick={() => goToProduct(it.product.id)} className="font-bold text-slate-900 hover:text-[#084BCD] text-left">{[it.product.name, w.variety || it.product.variety].filter(Boolean).join(' · ')}</button>
                                        <span className="block text-xs text-slate-500">{it.type === 'Crate/Box' ? 'Crate / Box' : it.type} · {w.temp != null ? `${w.temp} °C` : 'temperature ?'} · {w.weightKg ? packWeightText(w.weightKg) : 'weight ?'}{w.condition !== 'MAP' ? ` · ${w.condition}` : ''}{w.date ? ` · trial of ${fmtIsoDate(w.date)}` : ''}</span>
                                    </div>
                                    <span className="text-right min-w-[90px]"><span className="block font-bold text-[#008837] whitespace-nowrap">{w.shelfLife.open ? '≥ ' : ''}{w.shelfLife.days} day{w.shelfLife.days === 1 ? '' : 's'}</span><span className="block text-[11px] text-slate-500">within spec</span></span>
                                    <span className="text-xs text-slate-600 min-w-[180px] flex-1">{film ? film.name : w.material || '—'}{film && w.material ? <span className="block text-slate-400">{w.material}</span> : null}{tv != null ? <span className="block">TV {tv}</span> : null}{w.role === 'reference' ? <span className="block text-slate-400">current packaging</span> : null}</span>
                                    {running.length > 0 && <span className="text-[10px] font-bold uppercase px-2 py-1 rounded bg-[#084BCD]/10 text-[#084BCD] whitespace-nowrap" title={running.map(c => c.title || 'Untitled trial').join('\n')}>{running.length} trial{running.length !== 1 ? 's' : ''} running</span>}
                                    {!it.reference && <button type="button" onClick={() => planVerification(it)} disabled={folderState !== 'ready'} className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest bg-[#084BCD] text-white px-3.5 py-2 rounded-lg hover:opacity-90 disabled:opacity-40 whitespace-nowrap"><Plus size={14}/> Plan verification round</button>}
                                </div>
                                </React.Fragment>
                            );
                        })}
                    </div>
                );
            };

            // What the trial tables lack, the product with the most first: the
            // data check's proposals in one click, and a film, perforation or
            // flush system for a whole report at once.
            const renderDataList = () => {
                const list = workLists ? workLists.data : [];
                const sum = (k) => list.reduce((n, d) => n + d.gaps.missing[k], 0);
                const totalChecks = list.reduce((n, d) => n + d.gaps.checks.length, 0);
                const chips = (m, checks) => [[checks, 'data check'], [m.film, 'without film'], [m.tv, 'without TV'], [m.tvNotATv, 'TV is a perforation count'], [m.temperature, 'without temperature'], [m.date, 'without date'], [m.curve, 'without quality curve'], [m.packing, 'without packing details']]
                    .filter(([n]) => n > 0).map(([n, t], i) => <span key={t} className={`text-[11px] px-2 py-1 rounded whitespace-nowrap ${i === 0 && checks ? 'bg-amber-50 border border-amber-200 text-amber-800 font-bold' : 'bg-slate-100 text-slate-700'}`}>{n} {t}{t === 'data check' && n !== 1 ? 's' : ''}</span>);
                const sel = "p-2 text-xs border border-slate-200 rounded-lg bg-white";
                return (
                    <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                        <div className="p-4 bg-slate-50 flex flex-wrap items-center gap-3">
                            <h3 className="font-spartan font-bold text-slate-900">Data to complete</h3>
                            <span className="text-xs text-slate-500">{list.length} product{list.length !== 1 ? 's' : ''} · {totalChecks} data check{totalChecks !== 1 ? 's' : ''} · {sum('film')} rows without film · {sum('tv') + sum('tvNotATv')} without a usable TV</span>
                            <p className="basis-full text-xs text-slate-500">Results are compared per packaging, temperature and pack size, and the overview shows the film, perforation and gas flush of a result: a row without them cannot be compared or shown in full. Filling a report at once only writes where a row has no value yet.</p>
                        </div>
                        {list.length === 0 && <p className="p-8 text-center text-sm text-slate-500">Every trial table is complete.</p>}
                        {list.map(({ product: p, gaps, acceptable }) => {
                            const open = dataOpen === p.id;
                            return (
                                <div key={p.id} className="border-t border-slate-100">
                                    <div className="px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-2">
                                        <button type="button" onClick={() => setDataOpen(open ? null : p.id)} aria-expanded={open} className="flex items-center gap-2 min-w-[200px] text-left">
                                            <ChevronRight size={16} className={`shrink-0 text-slate-400 transition-transform ${open ? 'rotate-90' : ''}`}/>
                                            <span><span className="block font-bold text-slate-900">{productLabelOf(p)}</span><span className="block text-xs text-slate-500">{gaps.rows} trial{gaps.rows !== 1 ? 's' : ''} in {gaps.reports.length} report{gaps.reports.length !== 1 ? 's' : ''}</span></span>
                                        </button>
                                        <div className="flex-1 min-w-[220px] flex flex-wrap gap-1.5">{chips(gaps.missing, gaps.checks.length)}</div>
                                        {acceptable > 0 && <button type="button" onClick={() => acceptChecksFor(p)} className="text-xs font-bold font-spartan uppercase tracking-widest bg-[#084BCD] text-white px-3 py-2 rounded-lg hover:opacity-90 whitespace-nowrap">Accept {acceptable} suggestion{acceptable !== 1 ? 's' : ''}</button>}
                                        <button type="button" onClick={() => { setFoldOpen('trials', true); goToProduct(p.id, 'pipeline'); }} className="text-xs font-bold text-[#084BCD] hover:underline whitespace-nowrap">Open product</button>
                                    </div>
                                    {open && (
                                        <div className="bg-slate-50 border-t border-slate-100 px-4 py-3 space-y-3">
                                            {gaps.reports.map(r => {
                                                const key = `${p.id}|${r.key}`, d = bulkDraft[key] || {};
                                                const set = (k, v) => setBulkDraft(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [k]: v } }));
                                                const type = String(((latestFormData(p.id) || {})['p2-pack-master'] || {})[`pack_opt_${r.idxs[0]}_type`] || '');
                                                return (
                                                    <div key={r.key || '__unlinked'} className="bg-white border border-slate-200 rounded-lg p-3">
                                                        <div className="flex flex-wrap items-center gap-2 mb-2">
                                                            <span className="font-bold text-sm text-slate-900 break-words">{r.key ? `${r.date ? fmtIsoDate(r.date) : 'No date'} · ${r.pdf || 'Report'}` : 'Rows not linked to a report'}</span>
                                                            <span className="text-xs text-slate-500">{r.idxs.length} row{r.idxs.length !== 1 ? 's' : ''}, {r.perfotec.length} PerfoTec variant{r.perfotec.length !== 1 ? 's' : ''}</span>
                                                        </div>
                                                        <div className="flex flex-wrap gap-1.5 mb-3">{chips(r.missing, 0)}</div>
                                                        <div className="flex flex-wrap items-end gap-2">
                                                            <label className="flex flex-col gap-1 text-[11px] font-bold uppercase tracking-wide text-slate-500">Film
                                                                <FilmSelect value={d.film || ''} films={filmReg ? filmReg.films : null} type={type} onChange={v => set('film', v)} className={sel + ' max-w-[220px]'}/>
                                                            </label>
                                                            <label className="flex flex-col gap-1 text-[11px] font-bold uppercase tracking-wide text-slate-500">Perforation
                                                                <select className={sel} value={d.perf || ''} onChange={e => set('perf', e.target.value)}><option value="">—</option><option value="perfotec">PerfoTec laser</option><option value="other">Other</option><option value="none">None</option></select>
                                                            </label>
                                                            <label className="flex flex-col gap-1 text-[11px] font-bold uppercase tracking-wide text-slate-500">Flush system
                                                                <select className={sel} value={d.flush || ''} onChange={e => set('flush', e.target.value)}><option value="">—</option><option value="o2control">PerfoTec O2 Control</option><option value="other">Other system</option><option value="none">None (no flush)</option></select>
                                                            </label>
                                                            <label className="flex flex-col gap-1 text-[11px] font-bold uppercase tracking-wide text-slate-500">For
                                                                <select className={sel} value={d.scope || 'perfotec'} onChange={e => set('scope', e.target.value)}><option value="perfotec">PerfoTec variants ({r.perfotec.length})</option><option value="all">All rows ({r.idxs.length})</option></select>
                                                            </label>

                                                            </td>
                                                            <td className="p-3 text-slate-800">
                                                                {r.film ? <span className="font-bold text-green-800">{r.film}{r.filmOwn && <span className="ml-1.5 text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-[#008837]/10 text-[#008837]">PerfoTec film</span>}</span> : null}

                                                                <span className={`block text-[11px] ${r.perf === 'perfotec' ? 'font-semibold text-[#084BCD]' : r.perf ? 'text-slate-600' : 'text-slate-300'}`}>{perfText(r.perf) || 'Perforation not recorded'}</span>
                                                            </td>
                                                            <td className="p-3 whitespace-nowrap font-bold text-slate-900">{r.tv != null ? r.tv : <span className="font-normal text-slate-300" title={String(r.rawTv || '').trim() ? `${r.rawTv} is not a TV (probably the number of perforations)` : 'No TV logged'}>—</span>}</td>
                                                            {(() => { const fl = flushInfo(r.flush, r.startO2, r.startCO2); return (
                                                                <td className="p-3 whitespace-nowrap">
                                                                    {fl.label ? <span className={`font-semibold ${fl.o2control ? 'text-[#084BCD]' : 'text-slate-800'}`} title={fl.inferred ? 'Not recorded: read from the gas in the pack at packing' : ''}>{fl.label}{fl.inferred ? ' *' : ''}</span> : <span className="text-slate-300">Not recorded</span>}
                                                                    {fl.applied && fl.start && <span className="block text-[10px] text-slate-500">at packing: {fl.start}</span>}
                                                                </td>
                                                            ); })()}
                                                            <td className="p-3 whitespace-nowrap text-slate-800">{r.o2 != null || r.co2 != null ? <>{r.o2 != null ? `O₂ ${r.o2} %` : ''}{r.o2 != null && r.co2 != null ? ' · ' : ''}{r.co2 != null ? `CO₂ ${r.co2} %` : ''}</> : '—'}</td>
                                                            <td className="p-3 whitespace-nowrap">
                                                                <span className="font-bold text-[#008837]">{r.open ? '≥ ' : ''}{r.days} day{r.days === 1 ? '' : 's'}</span>
                                                                {r.belowDay != null && <span className="block text-[10px] text-slate-500" title="The first measurement below 7 during the trial">below spec on day {r.belowDay}{r.belowScore != null ? ` (score ${r.belowScore})` : ''}</span>}
                                                            </td>
                                                            <td className="p-3 min-w-[150px]">
                                                                <StatusChips status={resultStatus(r.proven, r.released)} proven={r.proven} rounds={r.rounds} released={r.released}/>
                                                            </td>
                                                            <td className="p-3 max-w-[220px]" onClick={e => e.stopPropagation()}>
                                                                {rep && rep.href
                                                                    ? <a href={rep.href} target="_blank" rel="noopener noreferrer" title={rep.title} className="inline-flex items-center gap-1 text-xs font-bold text-[#084BCD] hover:underline whitespace-nowrap"><FileText size={13}/> {rep.label}</a>
                                                                    : rep ? <span className="block truncate text-[11px] text-slate-500" title={`${rep.title}: ${rep.label}`}>{rep.label}</span> : <span className="text-slate-300">—</span>}
                                                                {r.date && <span className="block text-[10px] text-slate-400">{r.date}</span>}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    )
                                )}
                                {data.without.length > 0 && (
                                    <p className="px-4 py-3 text-xs text-slate-500 border-t border-slate-100" title={data.without.map(p => p.name + (p.variety ? ` (${p.variety})` : '')).join(', ')}>
                                        {(() => { const dev = data.without.filter(p => p.trialsOfType > 0), none = data.without.length - dev.length; return <>{dev.length > 0 && <><b className="text-blue-700">{dev.length} in development</b> ({typeName} trials, nothing within specification yet): {dev.map(p => p.name + (p.variety ? ` (${p.variety})` : '')).join(', ')}. </>}{none > 0 && <>{none} product{none !== 1 ? 's' : ''} not tested in {typeName} packaging.</>}{(() => { const inTest = data.without.filter(p => runningNow.byProduct[p.id]); return inTest.length ? <> <b className="text-[#084BCD]">A trial is running for {inTest.length} of them</b>: {inTest.map(p => p.name + (p.variety ? ` (${p.variety})` : '')).join(', ')}.</> : null; })()}</>; })()}
                                    </p>
                                )}
                            </div>
                            )}
                        </main>
                    </>
                );
            };

            const renderCommercialTab = () => {
                if (!activeProduct) return null;
                const B = window.PerfoTecBoard;
                const fd = localFormData;
                const com = fd.commercial || {};
                const claims = Array.isArray(com.claims) ? com.claims : [];
                const documents = Array.isArray(com.documents) ? com.documents : [];
                const pm = fd['p2-pack-master'] || {};
                const readOnly = !!activeProduct.isAverage;
                const productName = activeProduct.name || 'This product';

                // Who is working, and may they approve? people.json holds { name, … }
                // objects — compared as text they matched nobody, so the board's own
                // helpers read the names.
                const { label, name: me, fromServer } = currentUserName();
                const namesOf = (list) => B && B.personNames ? B.personNames(list) : [];
                const pms = namesOf(peopleReg && peopleReg.productManagers);
                const everyone = [...new Set([...pms, ...namesOf(peopleReg && peopleReg.commercials)])].sort((a, b) => a.localeCompare(b));
                const isPM = !!(B && B.isProductManager && B.isProductManager(label, peopleReg));
                // The list is changed by a product manager — or by anyone while it is
                // still empty, or nobody could ever start it.
                const canEditPMs = !!peopleReg && (isPM || pms.length === 0);

                const conf = B && B.trialConfigurations ? B.trialConfigurations(pm, {}) : { configs: [] };
                // The packaging this package is for (Luke 2026-10-29): a punnet
                // client gets the punnet claims, films, documents and overview —
                // never a pallet's. Claims stay stored together; this is a view.
                const PACKS = ['Punnet', 'Flowpack', 'Crate/Box', 'Pallet'];
                const packOf = (t) => /^liner$/i.test(String(t || '')) ? 'Crate/Box' : String(t || '');
                const packName = (t) => t === 'Crate/Box' ? 'Crate / Box' : t;
                const allCandidates = conf.configs.filter(c => c.roundCount > 0);
                const approvedAll = claims.filter(c => c.status === 'approved');
                const defaultType = (approvedAll[0] && packOf(approvedAll[0].snapshot && approvedAll[0].snapshot.type)) || (allCandidates[0] && packOf(allCandidates[0].type)) || 'Punnet';
                const ctype = PACKS.includes(commercialType) ? commercialType : (PACKS.includes(defaultType) ? defaultType : 'Punnet');
                const candidates = allCandidates.filter(c => packOf(c.type) === ctype);
                const typeClaims = claims.filter(c => packOf(c.snapshot && c.snapshot.type) === ctype);
                const typeRounds = conf.rows ? new Set(conf.rows.filter(r => packOf(r.type) === ctype).map(r => r.round)).size : 0;
                const companies = [...new Set(Array.from({ length: trialRowCountOf(pm) }, (_, i) => String(pm[`pack_opt_${i}_company`] || '').trim()).filter(c => c.length >= 3))];

                const save = (patch) => patchTask('commercial', patch);
                const flash = (msg) => { setCommercialMsg(msg); setTimeout(() => setCommercialMsg(m => m === msg ? '' : m), 9000); };
                const nowIso = () => new Date().toISOString();

                // Who you are: the board's name label (this browser remembers it),
                // stored as the registry's full name when it resolves to one.
                const saveMe = () => {
                    const typed = meDraft.replace(/\s+/g, ' ').trim();
                    if (!typed || !B || !B.setUserLabel) return;
                    const name = B.resolvePersonName ? B.resolvePersonName(typed, everyone) : typed;
                    B.setUserLabel(name);
                    setMeDraft(name);
                    setPeopleReg(p => p ? { ...p } : p); // the label lives outside React state
                    flash(`✓ Signed in as ${name}${B.isProductManager && B.isProductManager(name, peopleReg) ? ' — product manager' : ''}.`);
                };
                // The product managers live in people.json, the list the Project
                // Board's people fields use. writePeople merges by name when someone
                // else changed the file meanwhile — which can bring a removed name back,
                // so the result is checked.
                const writePMs = (names, done) => {
                    if (!B || !B.writePeople || !peopleReg) return;
                    const keep = {};
                    (peopleReg.productManagers || []).forEach(p => {
                        const entry = typeof p === 'string' ? { name: p, email: '', phone: '' } : p;
                        if (entry && entry.name) keep[entry.name.trim().toLowerCase()] = entry;
                    });
                    const list = names.map(n => keep[n.toLowerCase()] || { name: n, email: '', phone: '' });
                    B.writePeople({ ...peopleReg, productManagers: list }, peopleReg.rev)
                        .then(saved => { setPeopleReg(saved); done(namesOf(saved.productManagers)); })
                        .catch(e => flash(`⚠ The people list could not be saved: ${(e && e.message) || e}`));
                };
                const addPM = () => {
                    const typed = pmDraft.replace(/\s+/g, ' ').trim();
                    if (!typed) return;
                    const name = B && B.resolvePersonName ? B.resolvePersonName(typed, everyone) : typed;
                    if (pms.some(n => n.toLowerCase() === name.toLowerCase())) { flash(`⚠ ${name} is already a product manager.`); return; }
                    writePMs([...pms, name], () => { setPmDraft(''); flash(`✓ ${name} added as product manager.`); });
                };
                const removePM = (name) => {
                    const self = !!me && name.toLowerCase() === me.toLowerCase();
                    if (!window.confirm(`Remove ${name} as product manager? ${self ? 'You' : 'They'} will no longer be able to approve claims.`)) return;
                    writePMs(pms.filter(n => n !== name), (now) => flash(now.includes(name)
                        ? `⚠ Someone changed the people list at the same time and ${name} came back — remove again.`
                        : `✓ ${name} is no longer a product manager.`));
                };

                const draftFrom = (cfg, base) => draftClaimFor(cfg, base);
                const updateClaim = (id, patch) => save({ claims: claims.map(c => c.id === id ? { ...c, ...patch } : c) });
                const removeClaim = (id) => save({ claims: claims.filter(c => c.id !== id) });
                // Why a claim may not be approved, or '' when it may.
                const approvalBlock = (c) => {
                    if (!isPM) return pms.length ? `Only a product manager can approve (${pms.join(', ')}). You are signed in as "${label || 'unknown'}" — change it under "Change name · product managers" above.` : 'No product managers are registered yet — add them under "Change name · product managers" above.';
                    const txt = `${(c.text && c.text.en) || ''}\n${(c.text && c.text.nl) || ''}`;
                    if (!String((c.text && c.text.en) || '').trim()) return 'The English text is empty.';
                    const named = companies.find(co => new RegExp(`(^|[^\\w])${co.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?=$|[^\\w])`, 'i').test(txt));
                    if (named) return `The text names "${named}" — client names never go into a client document.`;
                    const internal = txt.match(INTERNAL_TERMS);
                    if (internal) return `The text mentions "${internal[0]}" — TV values and respiration rates stay internal.`;
                    if (c.snapshot && c.snapshot.headlineDays == null) return 'This configuration has no shelf life within specification to state.';
                    return '';
                };
                const approve = (c) => {
                    const why = approvalBlock(c);
                    if (why) { flash(`⚠ ${why}`); return; }
                    save({ claims: claims.map(x => x.id === c.id ? { ...x, status: 'approved', approvedAt: nowIso(), approvedBy: me } : (x.key === c.key && x.status === 'approved' ? { ...x, status: 'superseded' } : x)) });
                    flash(`✓ Claim v${c.version} approved by ${me}.`);
                };
                // An approved claim against today's numbers.
                const driftOf = (c) => {
                    const cur = conf.configs.find(x => x.key === c.key);
                    if (!cur) return 'The configuration is no longer in the trial table.';
                    const now = claimSnapshot(cur), was = c.snapshot || {};
                    const diffs = ['compared', 'better', 'equal', 'worse', 'headlineDays'].filter(k => now[k] !== was[k]);
                    return diffs.length ? `Since approval: ${now.compared} rounds compared, ${now.better} better · ${now.equal} equal · ${now.worse} worse, ${now.headlineOpen ? '≥ ' : ''}${now.headlineDays} days.` : '';
                };

                // The approved claims of THIS packaging feed the checklist and overview.
                const approvedClaims = typeClaims.filter(c => c.status === 'approved');
                // Their films: the configuration's films as they are linked now (a
                // film linked after approval still shows), else the claim's own.
                const claimFilmIds = (c) => { const cur = conf.configs.find(x => x.key === c.key); return (cur && cur.films && cur.films.length) ? cur.films : ((c.snapshot && c.snapshot.films) || []); };
                const overviewFilms = [...new Set(approvedClaims.flatMap(claimFilmIds))].map(filmById).filter(Boolean);
                const sheet = fd['product-sheet'];
                const hasSheet = !!(sheet && sheet.html);
                const p1c4 = fd['p1-core-4'] || {};
                const hasDefects = Array.from({ length: p1c4.defectCount || 7 }, (_, i) => p1c4[`defect_${i}_name`]).some(Boolean);
                // A document is for one packaging or for all (d.type '').
                const docsIn = (sec) => documents.filter(d => d.section === sec && (!d.type || d.type === ctype));
                const addDoc = (sec, name, url, lang, forAll) => save({ documents: [...documents, { id: `d_${Date.now().toString(36)}`, section: sec, name: name.trim(), url: url.trim(), lang, type: forAll ? '' : ctype }] });
                const removeDoc = (id) => save({ documents: documents.filter(d => d.id !== id) });
                const filmItem = (() => {
                    if (!approvedClaims.length) return { ok: false, text: 'The films of the approved claims, with their TDS, appear here' };
                    if (!overviewFilms.length) return { ok: false, text: 'No film linked to the trials of the approved claims — pick it in the trial table\'s Film column (Workflow)' };
                    const noTds = overviewFilms.filter(f => !/^https?:\/\//i.test(f.tdsUrl));
                    return { ok: !noTds.length, text: noTds.length ? `No TDS link for ${noTds.map(f => f.name).join(', ')} — add it under Database → Films` : `${overviewFilms.map(f => f.name).join(', ')} — with ${overviewFilms.length > 1 ? 'their' : 'its'} TDS` };
                })();
                const autoItems = {
                    '01': [{ ok: hasSheet, text: hasSheet ? `Product sheet attached (${sheet.fileName || 'HTML'})` : 'No product sheet attached — attach it on the Workflow tab' }, { ok: approvedClaims.length > 0, text: approvedClaims.length ? `${approvedClaims.length} approved ${packName(ctype).toLowerCase()} claim${approvedClaims.length !== 1 ? 's' : ''}` : `No approved ${packName(ctype).toLowerCase()} claim yet` }],
                    '02': [{ ok: hasSheet, text: 'Research values from the product sheet (atmosphere, temperature, humidity)' }, filmItem],
                    '03': [{ ok: hasDefects, text: hasDefects ? 'Defects & prevention matrix (in the overview)' : 'No defects matrix in the product data' }, { ok: candidates.length > 0, text: `${typeRounds} ${packName(ctype).toLowerCase()} trial round${typeRounds !== 1 ? 's' : ''} on file — share them as anonymised reports from the report tool` }],
                    '04': [{ ok: docsIn('04').length > 0, text: docsIn('04').length ? 'Pilot proposal / terms linked' : 'Pilot proposal and terms — link the proposal and the conditions below' }],
                };

                const openOverview = () => {
                    if (!approvedClaims.length) { flash(`⚠ Approve at least one ${packName(ctype).toLowerCase()} claim first — the overview only states approved claims.`); return; }
                    const html = buildCommercialOverview({ lang: overviewLang, product: activeProduct, fd, type: ctype, films: overviewFilms, claims: approvedClaims.map(c => ({ ...c, filmIds: claimFilmIds(c) })), documents: documents.filter(d => !d.type || d.type === ctype), sections: COMMERCIAL_SECTIONS, rounds: typeRounds });
                    // PRODUCT_DocumentType_LANG_vX_YYYYMMDD, the shared library's
                    // convention; the document type names the packaging.
                    const version = Math.max(...approvedClaims.map(c => c.version || 1));
                    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                    const fileName = `${String(activeProduct.name || 'Product').toUpperCase().replace(/[^A-Z0-9]+/g, '')}_Overview-${ctype.replace(/[^A-Za-z]/g, '')}_${overviewLang.toUpperCase()}_v${version}_${stamp}.html`;
                    setOverviewDoc({ html, fileName });
                };

                const statusPill = (c) => c.status === 'approved'
                    ? <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-green-100 text-green-800">Approved v{c.version}</span>
                    : c.status === 'superseded'
                        ? <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-500">Superseded v{c.version}</span>
                        : <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-amber-100 text-amber-800">Draft v{c.version}</span>;

                return (
                    <div className="animate-fadeIn space-y-8 pb-20">
                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-wrap items-center gap-4">
                            <Briefcase size={20} className="text-[#084BCD]"/>
                            <div className="flex-1 min-w-[260px]">
                                <p className="font-spartan font-bold text-slate-900">Commercial package — {productName}</p>
                                <p className="text-xs text-slate-500">Claims are drafted from the trial record and approved by a PerfoTec product manager. Only approved claims reach the client overview; TV values, respiration rates and client names never do.</p>
                            </div>
                            <div className="text-xs text-right">
                                <p className="text-slate-500">Signed in as <span className="font-bold text-slate-800">{label || 'unknown'}</span></p>
                                <p className={isPM ? 'text-green-700 font-bold' : 'text-slate-400'}>{peopleReg ? (isPM ? 'Product manager — may approve claims' : 'Not a product manager — can draft, not approve') : 'Loading people…'}</p>
                                <button type="button" onClick={() => { setPeopleEdit(v => !v); setMeDraft(label || ''); setPmDraft(''); }}
                                    className="mt-1 text-[11px] font-bold text-[#084BCD] hover:underline">{peopleEdit ? 'Close' : 'Change name · product managers'}</button>
                            </div>
                            {peopleEdit && (
                                <div className="basis-full border-t border-slate-100 pt-4 grid md:grid-cols-2 gap-6 text-sm">
                                    <div>
                                        <span className="block text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-500 mb-2">You are</span>
                                        {fromServer ? (
                                            <p className="text-slate-600">Signed in on the server as <b>{label}</b> — the server login decides who you are.</p>
                                        ) : (
                                            <form onSubmit={e => { e.preventDefault(); saveMe(); }} className="flex gap-2">
                                                <input list="pf-people-names" value={meDraft} onChange={e => setMeDraft(e.target.value)} placeholder="Your full name"
                                                    className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"/>
                                                <datalist id="pf-people-names">{everyone.map(n => <option key={n} value={n}/>)}</datalist>
                                                <button type="submit" disabled={!meDraft.trim()} className="px-4 py-2 rounded-lg bg-[#084BCD] hover:bg-blue-700 disabled:opacity-40 text-white text-xs font-bold uppercase tracking-widest">Save</button>
                                            </form>
                                        )}
                                        <p className="text-xs text-slate-500 mt-2">The same name label as on the Project Board; this browser remembers it. It is a label, not a login.</p>
                                    </div>
                                    <div>
                                        <span className="block text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-500 mb-2">Product managers — may approve claims</span>
                                        <div className="flex flex-wrap gap-1.5 mb-2">
                                            {pms.length === 0 && <span className="text-slate-400 text-xs">Nobody yet.</span>}
                                            {pms.map(n => (
                                                <span key={n} className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs font-semibold ${me && n.toLowerCase() === me.toLowerCase() ? 'border-green-300 bg-green-50 text-green-800' : 'border-slate-200 bg-white text-slate-700'}`}>
                                                    {n}
                                                    {canEditPMs && <button type="button" onClick={() => removePM(n)} title={`Remove ${n}`} className="text-slate-400 hover:text-red-600"><X size={12}/></button>}
                                                </span>
                                            ))}
                                        </div>
                                        {canEditPMs ? (
                                            <form onSubmit={e => { e.preventDefault(); addPM(); }} className="flex gap-2">
                                                <input list="pf-people-names" value={pmDraft} onChange={e => setPmDraft(e.target.value)} placeholder="Add a product manager"
                                                    className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"/>
                                                <button type="submit" disabled={!pmDraft.trim()} className="px-4 py-2 rounded-lg border border-[#084BCD] text-[#084BCD] hover:bg-blue-50 disabled:opacity-40 text-xs font-bold uppercase tracking-widest">Add</button>
                                            </form>
                                        ) : (
                                            <p className="text-xs text-slate-500">Only a product manager can change this list.</p>
                                        )}
                                        <p className="text-xs text-slate-500 mt-2">Kept in people.json in the database folder — the same list the Project Board uses.</p>
                                    </div>
                                </div>
                            )}
                        </div>
                        {commercialMsg && <div className={`text-sm font-bold rounded-lg px-4 py-2.5 border ${commercialMsg.startsWith('✓') ? 'bg-green-50 border-green-200 text-green-800' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>{commercialMsg}</div>}
                        {readOnly && <div className="text-sm bg-blue-50 border border-blue-200 text-blue-800 rounded-lg px-4 py-2.5">"All varieties" is a read-only overview — open a variety to draft or approve its claims.</div>}

                        {/* ── The packaging this package is for ── */}
                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-wrap items-center gap-2.5">
                            <span className="text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-500 mr-1">Package for</span>
                            {PACKS.map(t => {
                                const nCfg = allCandidates.filter(c => packOf(c.type) === t).length;
                                const nOk = approvedAll.filter(c => packOf(c.snapshot && c.snapshot.type) === t).length;
                                const on = t === ctype;
                                return (
                                    <button key={t} onClick={() => setCommercialType(t)} title={`${nCfg} configuration${nCfg !== 1 ? 's' : ''} on file · ${nOk} approved claim${nOk !== 1 ? 's' : ''}`}
                                        className={`px-4 py-2 rounded-lg border text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-colors ${on ? 'bg-[#084BCD] border-[#084BCD] text-white' : nCfg ? 'bg-white border-slate-200 text-slate-700 hover:border-[#084BCD]' : 'bg-white border-dashed border-slate-200 text-slate-400 hover:border-slate-300'}`}>
                                        {packName(t)}
                                        <span className={`text-[10px] normal-case tracking-normal font-semibold ${on ? 'text-white/80' : 'text-slate-400'}`}>{nOk ? `${nOk} approved` : `${nCfg} config${nCfg !== 1 ? 's' : ''}`}</span>
                                    </button>
                                );
                            })}
                            <span className="basis-full md:basis-auto md:ml-auto text-xs text-slate-500">Claims, films, documents and the client overview below are for <b>{packName(ctype).toLowerCase()}</b> packaging.</span>
                        </div>

                        {/* ── 1. Claims ── */}
                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm">
