                };

                let points = 0; Object.values(parsedData).forEach(task => { points += Object.keys(task).length; });

                return {
                    // The Dutch and Spanish names come straight in as alternatives:
                    // the same product, said in the other two languages the sheet is
                    // written in. cleanAliases drops whichever of them is identical to
                    // the English name, so a product called the same thing in all three
                    // languages gains nothing.
                    product: { name: cleanName, aliases: cleanAliases([psNames.nl, psNames.es], cleanName), variety: extractedVariety, state: extractedState, targets: defaultTargets, imageUrl: imgUrl, completedTaskIds: [], links: {}, createdAt: null, formData: parsedData },
                    points
                };
            };

            // `shown` is the cell as the sheet displays it. A cell formatted as a
            // percentage holds 5 % as 0.05; a plain 0.5 is 0.5 % O₂ (low-oxygen
            // trials read that), and it used to become 50 %.
            const parseGasValue = (val, shown) => {
                if (val === undefined || val === null || val === '') return '';
                if (typeof val === 'number') return (val < 1 && /%/.test(String(shown == null ? '' : shown))) ? String(Math.round(val * 1000) / 10) : String(val);
                const firstLine = String(val).split(/\r?\n/)[0];
                return firstLine.replace('%', '').replace(',', '.').trim();
            };

            // A JSON trial list has no cell formats. When every O₂ and CO₂ number
            // in the file is below 1, it stores fractions (0.05 = 5 %), as exports
            // of the old Excel sheet did; one value of 1 or more means percentages.
            const jsonGasIsFraction = (list) => {
                const vals = [];
                (list || []).forEach(r => ['O2', 'O2 (%)', 'CO2', 'CO2 (%)'].forEach(k => { if (r && typeof r[k] === 'number') vals.push(r[k]); }));
                return vals.length > 0 && vals.every(v => v >= 0 && v < 1) && vals.some(v => v > 0);
            };

            const processDataSheet = async (file) => {
                setImportStatus('parsing');
                if (!file) { setImportStatus('idle'); return; }
                setImportedFileName(file.name);
                const fileExt = file.name.split('.').pop().toLowerCase();

                try {
                    if (fileExt === 'json') {
                        const text = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsText(file); });
                        const parsed = JSON.parse(text);
                        
                        if (parsed.type === 'perfotec-workspace-backup' && parsed.products) {
                            const backupList = (parsed.products || []).filter(p => p && p.id && !p.isAverage).map(normalizeProductRecord).filter(Boolean);
                            if (db) {
                                for (const p of backupList) {
                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', p.id), p);
                                }
                            } else if (folderState === 'ready') {
                                // On the shared folder a backup brings back what is MISSING and
                                // nothing else. Loading it whole wrote every product back to
                                // the day of the backup over newer work, and moved every
                                // product made since to the recycle bin.
                                const have = new Set(productsRef.current.map(p => p.id));
                                const missing = backupList.filter(p => !have.has(p.id));
                                const when = parsed.timestamp ? new Date(parsed.timestamp).toLocaleString() : 'an unknown date';
                                const ok = window.confirm(`Backup of ${when} with ${backupList.length} product(s).\n\n`
                                    + (missing.length ? `${missing.length} of them ${missing.length === 1 ? 'is' : 'are'} not in the database now and will be added back.` : 'Every product in it is already in the database.')
                                    + `\nProducts already here stay as they are: a backup never overwrites newer work and never removes products.`
                                    + (missing.length ? '\n\nRestore the missing products?' : ''));
                                if (!ok || !missing.length) { resetModal(); return; }
                                setProducts(prev => [...prev, ...missing.filter(p => !prev.some(q => q.id === p.id))]);
                            } else {
                                setProducts(backupList);
                            }
                            setLoadedDataId(null); 
                            resetModal(); 
                            if (folderState !== 'ready' && parsed.products && parsed.products.length > 0) {
                                setActiveProductId(familyLandingId(parsed.products[0], parsed.products));
                                setActiveTab('dashboard');
                            }
                            return;
                        }

                        if (parsed.name && parsed.formData) {
                            setNewProductData({ name: parsed.name, aliases: parsed.aliases || [], variety: parsed.variety || "", state: parsed.state || "whole", targets: parsed.targets || [], imageUrl: parsed.imageUrl || "", completedTaskIds: parsed.completedTaskIds || [], links: parsed.links || {}, createdAt: parsed.createdAt || new Date().toISOString() });
                            setImportedFormData(parsed.formData);
                            let points = 0; Object.values(parsed.formData).forEach(task => { points += Object.keys(task).length; });
                            setParsedItemCount(points); setIsBackupRestore(true); setIsBulkImport(false); setImportStatus('success');
                            return;
                        } 
                        
                        // Trial export format: array of records with Product field
                        if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].Product !== undefined) {
                            const gasShown = jsonGasIsFraction(parsed) ? '%' : '';
                            const rows = parsed.map((r, i) => ({
                                _id: i,
                                product: String(r.Product || ''),
                                variety: String(r.Variety || r.variety || ''),
                                packaging: r.Packaging || r.Type || r['Packaging Type'] || 'Crate/Box',
                                material: String(r.Material || r.material || ''),
                                temp: r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : String(r.Temperature || ''),
                                weight: r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000))
                                      : r['Weight (g)'] !== undefined ? String(r['Weight (g)'])
                                      : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '',
                                tv: r.TV !== undefined ? String(r.TV) : '',
                                o2: parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)'], gasShown),
                                co2: parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)'], gasShown),
                                company: String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : '')),
                                country: String(r.Country || r.country || ''),
                                days: r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '',
                                rating: r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : ''),
                            })).filter(r => r.product);

                            const uniqueProducts = [...new Set(rows.map(r => r.product))];
                            const normalize = s => s.toLowerCase().replace(/[\s\-()\/]+/g, ' ').trim();
                            const mappings = {};
                            uniqueProducts.forEach(pName => {
                                const norm = normalize(pName);
                                const match = bestProductMatch(products, pName, (rows.find(r => r.product === pName) || {}).variety || '', '');
                                mappings[pName] = match ? match.id : 'new';
                            });

                            setTrialImportRows(rows);
                            setTrialProductMappings(mappings);
                            setParsedItemCount(rows.length);
                            setImportStatus('trial-preview');
                            return;
                        }

                        throw new Error("Invalid JSON structure");
                    }

                    if (['xlsx', 'xls', 'csv'].includes(fileExt)) {
                        const buffer = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsArrayBuffer(file); });
                        // Fetches SheetJS on first use; instant on every later import.
                        await ensureLib("XLSX");
                        const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                                                const json = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
                        // The same rows as displayed, for gas cells formatted as a percentage.
                        const shownRows = XLSX.utils.sheet_to_json(firstSheet, {defval: "", raw: false});
                        if (json.length === 0) throw new Error("No rows found in file");
                        const firstRow = json[0];

                        // Detect format: TV-per-product / trial list has Product + TV or weight columns
                        const isTrialFormat = ('Product' in firstRow || 'product' in firstRow) &&
                            ('TV' in firstRow || 'Gewicht (kg)' in firstRow || 'Weight (g)' in firstRow || 'TV per kg' in firstRow);

                        if (isTrialFormat) {
                            const rows = json.map((r, i) => ({
                                _id: i,
                                product: String(r.Product || r.product || ''),
                                variety: String(r.Variety || r.variety || ''),
                                packaging: r.Packaging || r.Type || r['Packaging Type'] || 'Crate/Box',
                                material: String(r.Material || r.material || ''),
                                temp: r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : r['Temperature'] !== undefined ? String(r['Temperature']) : '',
                                weight: r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000))
                                      : r['Weight (g)'] !== undefined ? String(r['Weight (g)'])
                                      : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '',
                                tv: r.TV !== undefined ? String(r.TV) : r['TV Req.'] !== undefined ? String(r['TV Req.']) : '',
                                o2: parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)'], (shownRows[i] || {})[r.O2 !== undefined ? 'O2' : 'O2 (%)']),
                                co2: parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)'], (shownRows[i] || {})[r.CO2 !== undefined ? 'CO2' : 'CO2 (%)']),
                                company: String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : '')),
                                country: String(r.Country || r.country || ''),
                                days: r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '',
                                rating: r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : ''),
                            })).filter(r => r.product);
                            if (rows.length === 0) throw new Error("No product rows found in file");
                            const uniqueProducts = [...new Set(rows.map(r => r.product))];
                            const normalize = s => s.toLowerCase().replace(/[\s\-()/]+/g, ' ').trim();
                            const mappings = {};
                            uniqueProducts.forEach(pName => {
                                const norm = normalize(pName);
                                const match = bestProductMatch(products, pName, (rows.find(r => r.product === pName) || {}).variety || '', '');
                                mappings[pName] = match ? match.id : 'new';
                            });
                            setTrialImportRows(rows);
                            setTrialProductMappings(mappings);
                            setParsedItemCount(rows.length);
                            setImportStatus('trial-preview');
                            return;
                        }

                        // Product-properties sheet format (Target O2, RR Temperature, etc.)
                        const extractedProducts = [];
                        let totalPoints = 0;

                        const parseExcelRange = (textVal) => {
                            if (!textVal) return { min: "", max: "" };
                            let cleanVal = String(textVal).replace(/°C/gi, '').replace(/%/g, '').trim();
                            const m = cleanVal.match(/(-?[\d.]+)\s*(?:-|to|tot|t\/m|–)\s*(-?[\d.]+)/i);
                            if (m) return { min: m[1], max: m[2] };
                            const single = cleanVal.match(/(-?[\d.]+)/);
                            if (single) return { min: single[1], max: single[1] };
                            return { min: "", max: "" };
                        };

                        json.forEach(row => {
                            const rawName = row['Subgroup'] || row['Product group'] || row['Product'] || row['Name'];
                            if (!rawName) return;
                            const name = String(rawName).charAt(0).toUpperCase() + String(rawName).slice(1);
                            const variety = String(row['Variety'] || "");
                            const o2Range = parseExcelRange(row['Target O2'] || row['target O2'] || row['O2 target'] || "");
                            const co2Range = parseExcelRange(row['Target CO2'] || row['Co2'] || row['Co2 '] || row['CO2 target'] || "");
                            const tempRange = parseExcelRange(row['Storage temperature'] || row['Storage temp'] || row['RR Temperature'] || "");
                            const acpRaw = String(row['ACP'] || row['O2 ACP'] || "");
                            const critCO2Raw = String(row['Crit CO2'] || row['Critical CO2'] || "");
                            const minTempRaw = String(row['Min Temp'] || row['Critical Temp'] || "");
                            const rhRange = parseExcelRange(row['Target RH'] || row['RH'] || "");
                            let ethyleneClass = "";
                            const ethSens = String(row['Ethylene sensitivity'] || row['Ethylene'] || "").trim();
                            if (/^H$/i.test(ethSens) || /high/i.test(ethSens)) ethyleneClass = "Type 1: Sensitive (Low prod / High sens.)";
                            else if (/^M$/i.test(ethSens) || /climacteric|medium/i.test(ethSens)) ethyleneClass = "Type 2: Climacteric (High prod / High sens.)";
                            else if (/^L$/i.test(ethSens) || /low|non/i.test(ethSens)) ethyleneClass = "Type 3: Non-Climacteric (Low prod / Low sens.)";
                            else if (ethSens) ethyleneClass = ethSens;
                            const rrData = {};
                            const rrTemp = parseFloat(row['RR Temperature'] || row['RR Temp'] || "");
                            if (!isNaN(rrTemp)) {
                                const o2Avg = parseFloat(row['RRO2 average'] || row['RR O2'] || "");
                                const co2Avg = parseFloat(row['RRCo2 average'] || row['RR CO2'] || "");
                                if (!isNaN(o2Avg)) rrData[`target_temp${rrTemp}_O2`] = o2Avg.toFixed(1);
                                if (!isNaN(co2Avg)) rrData[`target_temp${rrTemp}_CO2`] = co2Avg.toFixed(1);
                            }
                            const parsedData = {
                                'p1-core-1': { acp: acpRaw, minTemp: minTempRaw || tempRange.min, critCO2: critCO2Raw, rq: "1.0", q10: "", ethyleneClass, vpdSensitivity: row['VPD Sensitivity'] || "Medium" },
                                'p1-core-2': { ...rrData },
                                'p1-core-3': { targetO2Min: o2Range.min, targetO2Max: o2Range.max, targetCO2Min: co2Range.min, targetCO2Max: co2Range.max, storageTempMin: tempRange.min, storageTempMax: tempRange.max, targetRHMin: rhRange.min || "", targetRHMax: rhRange.max || "" },
                                'p1-core-4': { primaryThreat: "Discoloration / Browning", secondaryThreat: "None", condensationRisk: "Medium", defectCount: 7 }
                            };
                            Object.values(parsedData).forEach(task => { totalPoints += Object.keys(task).length; });
                            extractedProducts.push({ name, variety, state: "whole", targets: ['retail', 'liner', 'pallet'], imageUrl: "", completedTaskIds: [], links: {}, createdAt: new Date().toISOString(), formData: parsedData,
                                // Placeholders the sheet has no column for: fine for a new
                                // product, never written into an existing one.
                                inferred: { 'p1-core-1': ['rq'].concat(row['VPD Sensitivity'] ? [] : ['vpdSensitivity']), 'p1-core-4': true } });
                        });

                        if (extractedProducts.length > 0) {
                            setBulkProductsData(extractedProducts); setIsBulkImport(true); setIsBackupRestore(false); setParsedItemCount(totalPoints); setImportStatus('success');
                        } else throw new Error("No products found. If this is a trial results sheet, check that it has 'Product' and 'TV' columns.");
                        return;
                    }

                    if (fileExt === 'docx') {
                        const buffer = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsArrayBuffer(file); });
                        // Fetches Mammoth on first use; instant on every later import.
                        await ensureLib("mammoth");
                        const result = await mammoth.extractRawText({arrayBuffer: buffer});
                        const { product, points } = extractProductDataFromText(result.value, file.name);

                        setNewProductData({ name: product.name, aliases: product.aliases || [], variety: product.variety, state: product.state, targets: product.targets, imageUrl: product.imageUrl, completedTaskIds: [], links: {}, createdAt: null });
                        setImportedFormData(product.formData); setIsBulkImport(false); setIsBackupRestore(false); setParsedItemCount(points); setImportStatus('success');

                        const cleanPName = product.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                        setProducts(prevProducts => {
                            const match = bestProductMatch(prevProducts, product.name, product.variety, product.state);
                            setMergeTargetId(match ? match.id : "new");
                            return prevProducts;
                        });
                        return;
                    }

                    const text = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsText(file); });
                    const { product, points } = extractProductDataFromText(text, file.name);
                    
                    setNewProductData({ name: product.name, aliases: product.aliases || [], variety: product.variety, state: product.state, targets: product.targets, imageUrl: product.imageUrl, completedTaskIds: [], links: {}, createdAt: null });
                    setImportedFormData(product.formData); setIsBulkImport(false); setIsBackupRestore(false); setParsedItemCount(points); setImportStatus('success');

                    const cleanPName = product.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                    setProducts(prevProducts => {
                        const match = bestProductMatch(prevProducts, product.name, product.variety, product.state);
                        setMergeTargetId(match ? match.id : "new");
                        return prevProducts;
                    });

                } catch (err) { 
                    console.error("Error processing file", err); 
                    setImportStatus('idle'); 
                    alert("Error loading file: " + err.message); 
                }
            };

            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
            const handleDrop = (e) => {
                e.preventDefault(); setIsDragging(false);
                if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
                const file = e.dataTransfer.files[0];
                // For dropped .json databases, also capture a writable handle (Chromium)
                // so autosave can write back to the source file.
                const item = e.dataTransfer.items && e.dataTransfer.items[0];
                if (file.name.endsWith('.json') && item && item.getAsFileSystemHandle && folderState !== 'ready') {
                    item.getAsFileSystemHandle().then(h => {
                        if (h && h.kind === 'file') setDbFileHandle(h);
                    }).catch(() => {});
                }
                processDataSheet(file);
            };
            const handleFileInputChange = (e) => { if (e.target.files && e.target.files.length > 0) processDataSheet(e.target.files[0]); };

            const handleOpenFilePicker = async () => {
                if (window.showOpenFilePicker) {
                    try {
                        const [fileHandle] = await window.showOpenFilePicker({
                            types: [
                                { description: 'Database Files', accept: { 'application/json': ['.json'], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'], 'application/vnd.ms-excel': ['.xls'], 'text/csv': ['.csv'] } }
                            ],
                            multiple: false
                        });
                        const file = await fileHandle.getFile();
                        if (file.name.endsWith('.json') && folderState !== 'ready') {
                            // Only without the shared folder is a JSON file the database.
                            // Ask for write permission right away (still within the user gesture)
                            // so autosave can write back to this file without further prompts.
                            try { await fileHandle.requestPermission({ mode: 'readwrite' }); } catch (permErr) { console.warn(permErr); }
                            setDbFileHandle(fileHandle);
                        }
                        processDataSheet(file);
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error(err);
                            document.getElementById('db-upload').click();
                        }
                    }
                } else {
                    document.getElementById('db-upload').click();
                }
            };

            const handleGenerateFromImport = async () => {
                if (importStatus !== 'success') return;
                
                if (isBulkImport) {
                    const newProductsList = [];
                    for (const prod of bulkProductsData) {
                        const baseId = `${prod.name}-${prod.variety || 'base'}-${prod.state}`.toLowerCase().replace(/[^a-z0-9]/g, '-');
                        // The same product AND variety. By name alone, every variety's
                        // row of the sheet landed in whichever variety came first.
                        const sameName = products.filter(p => !p.isAverage && p.state === prod.state && productNames(p).some(n => normProductName(n) === normProductName(prod.name)));
                        const existing = sameName.find(p => normProductName(p.variety) === normProductName(prod.variety)) || (!prod.variety && sameName.length === 1 ? sameName[0] : null);
                        
                        if (existing) {
                            // Fill empty fields only: a re-import overwrote curated values
                            // with the sheet's, blanks and placeholders included, and gave
                            // the product every market.
                            const mergedFormData = JSON.parse(JSON.stringify(latestFormData(existing.id)));
                            const inferred = prod.inferred || {};
                            for (const key in prod.formData) {
                                if (inferred[key] === true) continue;
                                const cur = mergedFormData[key] = { ...(mergedFormData[key] || {}) };
                                for (const fk in prod.formData[key]) {
                                    const v = prod.formData[key][fk];
                                    if (v === undefined || v === null || String(v).trim() === '') continue;
                                    if (Array.isArray(inferred[key]) && inferred[key].includes(fk)) continue;
                                    if (String(cur[fk] == null ? '' : cur[fk]).trim() === '') cur[fk] = v;
                                }
                            }
                            const mergedDoc = { ...existing, aliases: cleanAliases([...aliasesOf(existing), ...aliasesOf(prod)], existing.name), formData: mergedFormData };
                            bufferFollows(existing.id, mergedFormData);
                            newProductsList.push(mergedDoc);
                            if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', existing.id), mergedDoc);
                        } else {
                            // Never the id of a record that is already there (a renamed
                            // product kept its old id): the map below replaced it whole.
                            const { inferred: _inferred, ...prodFields } = prod;
                            const productDoc = { id: products.some(p => p.id === baseId) || newProductsList.some(p => p.id === baseId) ? `${baseId}-${Date.now().toString(36)}` : baseId, ...prodFields };
                            newProductsList.push(productDoc);
                            if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productDoc.id), productDoc);
                        }
                    }
                    if (!db) {
                        setProducts(prev => {
                            const map = new Map(); prev.forEach(p => map.set(p.id, p));
                            newProductsList.forEach(p => map.set(p.id, p)); return Array.from(map.values());
                        });
                    }
                    setLoadedDataId(null); resetModal(); 
                    if (newProductsList.length > 0) {
                        setActiveProductId(newProductsList[0].id);
                        setActiveTab('dashboard');
                    }
                    return;
                }

                if (mergeTargetId !== "new") {
                    const existingRec = products.find(p => p.id === mergeTargetId);
                    const existing = existingRec ? { ...existingRec, formData: latestFormData(existingRec.id) } : null;
                    if (existing) {
                        const conflicts = detectConflicts(existing.formData, importedFormData);
                        if (conflicts.length > 0) {
                            setMergeConflictPending({ type: 'import', targetId: existing.id, sourceFD: importedFormData, newProdData: newProductData });
                            setConflictChoices({});
                            return;
                        }
                        const mergedFormData = buildMergedFD(existing.formData, importedFormData, {});
                        // A document imported under a different product name is folded
                        // in as an alternative name, so the name it arrived under still
                        // finds this product afterwards.
                        const mergedDoc = { ...existing, imageUrl: newProductData.imageUrl || existing.imageUrl, targets: Array.from(new Set([...existing.targets, ...newProductData.targets])), aliases: cleanAliases([...aliasesOf(existing), ...aliasesOf(newProductData), newProductData.name], existing.name), formData: mergedFormData };
                        if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', existing.id), mergedDoc);
                        else setProducts(prev => prev.map(p => p.id === existing.id ? mergedDoc : p));
                        setLoadedDataId(null); resetModal(); setActiveProductId(existing.id); setActiveStepId(1); setActiveTab('pipeline');
                        return;
                    }
                }
                const baseId = `${newProductData.name}-${newProductData.variety || 'base'}-${newProductData.state}`.toLowerCase().replace(/[^a-z0-9]/g, '-');
                const finalId = products.some(p => p.id === baseId) ? `${baseId}-${Date.now()}` : baseId;
                
                const newProduct = {
                    id: finalId, name: newProductData.name.trim(), variety: newProductData.variety.trim(), state: newProductData.state,
                    // Alternative names travel with the product through an export
                    // and back, or a restore would quietly unfindable it again.
                    aliases: cleanAliases(newProductData.aliases, newProductData.name),
                    targets: newProductData.targets, imageUrl: newProductData.imageUrl.trim(),
                    createdAt: isBackupRestore && newProductData.createdAt ? newProductData.createdAt : new Date().toISOString(),
                    completedTaskIds: isBackupRestore && newProductData.completedTaskIds ? newProductData.completedTaskIds : [], 
                    links: isBackupRestore && newProductData.links ? newProductData.links : {}, formData: importedFormData || {}
                };

                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', finalId), newProduct);
                } else {
                    setProducts(prev => [...prev, newProduct]);
                }
                
                setLoadedDataId(null); resetModal(); setActiveProductId(finalId); setActiveStepId(1); setActiveTab('pipeline');
            };

            // Inline trial import — used directly in Phase 02 pack-opt-master form
            // Import one or more trial JSON files (report.html exports or legacy flat arrays)
            // into the active product. Multiple files are processed as one batch: shared
            // duplicate detection, fill-if-empty baseline updates across all files, one write.
            // Core trial importer: takes an array of File objects and imports
            // their rows into the active product. Shared by the file-picker
            // button (handleInlineTrialJSON) and the Project Board auto-import.
            // Resolves { imported, skipped, baselineFilled, problems }.
            const importTrialFiles = async (files) => {
                const none = (problem) => ({ imported: 0, skipped: 0, baselineFilled: 0, problems: problem ? [problem] : [] });
                // The "All varieties" aggregate is a read-only overview — trials must be imported
                // into a specific variety so the data has a real home.
                if (activeProduct?.isAverage) {
                    setInlineTrialMsg('⚠ Select a specific variety first (top of the dashboard) — "All varieties" is a read-only overview.');
                    setTimeout(() => setInlineTrialMsg(''), 8000);
                    return none('"All varieties" is open, not one variety');
                }
                if (!files || !files.length) return none();
                try {
                    const master = { ...(localFormData['p2-pack-master'] || {}) };
                    let count = trialRowCountOf(master);
                    let importedCount = 0;
                    let updatedCount = 0;
                    let skippedCount = 0;
                    let baselineFilled = 0;
                    const wrongProduct = [];
                    const unreadable = [];
                    let fileCount = 0;

                    // Shared helpers for the whole batch
                    const normalize = s => String(s || '').toLowerCase().replace(/[\s\-()\/]+/g, ' ').trim();
                    const activeFull = normalize(activeProduct.name + (activeProduct.variety ? ' ' + activeProduct.variety : ''));
                    const activeBase = normalize(activeProduct.name);

                    // Baseline accumulators: fill-if-empty across ALL files in the batch,
                    // so curated values always win and the first file with a value fills a field.
                    const p1c1 = { ...(localFormData['p1-core-1'] || {}) };
                    const p1c2 = { ...(localFormData['p1-core-2'] || {}) };
                    const p1c3 = { ...(localFormData['p1-core-3'] || {}) };

                    for (const file of files) {
                        let parsed;
                        try {
                            parsed = JSON.parse(await file.text());
                        } catch (parseErr) {
                            unreadable.push(file.name);
                            continue;
                        }

                        if (parsed.isPerfoTecReport === true && Array.isArray(parsed.groups)) {
                            // ── Report format: full export from report.html ──
                            const proj = parsed.project || {};
                            // Product match: tolerant of plurals ("Blueberry" vs "Blueberries"),
                            // varieties and word order; the JSON file name counts as evidence too.
                            // Word stems tolerant of English plurals: berries→berry, boxes→box, grapes→grape
                            const stemWords = s => normalize(s).split(' ').map(w => w.replace(/ies$/, 'y').replace(/(es|s)$/, '')).filter(w => w.length >= 3);
                            const activeStems = [...new Set([...stemWords(activeProduct.name), ...stemWords(activeProduct.variety || '')])];
                            // Whole words of the product's name ("Pineapple" is not
                            // "Apple"; a shared variety word like "Red" is not enough). A
                            // report opened from the board names its product by id, and
                            // then the id decides. Anything else asks.
                            const candidateMatches = (candidate) => namesProduct(activeProduct, candidate);
                            const typeNorm = normalize(proj.type || '');
                            let isMatch = proj.productId ? String(proj.productId) === String(activeProduct.id) : !proj.productName ||
                                candidateMatches(proj.productName) ||
                                (typeNorm !== '' && candidateMatches(proj.type)) ||
                                candidateMatches(file.name.replace(/\.json$/i, ''));
                            // Manual override: never a dead end — the user can force the link
                            if (!isMatch) {
                                isMatch = window.confirm('"' + file.name + '" is for product "' + (proj.productName || '?') + (proj.type ? ' ' + proj.type : '') + '", but the open product is "' + activeProduct.name + (activeProduct.variety ? ' - ' + activeProduct.variety : '') + '".\n\nImport it into "' + activeProduct.name + '" anyway?');
                            }
                            if (!isMatch) {
                                wrongProduct.push(file.name + ' (' + (proj.productName || '?') + ')');
                                continue;
                            }
                            // Processing-state guard: a Whole trial must not silently land on a Processed product (or vice versa)
                            const projStateRaw = normalize(String(proj.processingType || proj.state || ''));
                            const projState = projStateRaw.includes('process') || projStateRaw.includes('cut') ? 'processed' : projStateRaw.includes('whole') ? 'whole' : '';
                            if (projState && activeProduct.state && projState !== activeProduct.state) {
                                const okState = window.confirm('"' + file.name + '" is a ' + projState.toUpperCase() + ' trial, but the open product "' + activeProduct.name + '" is ' + String(activeProduct.state).toUpperCase() + '.\n\nThe processing type does not match. Import anyway?');
                                if (!okState) { wrongProduct.push(file.name + ' (' + projState + ' \u2260 ' + activeProduct.state + ')'); continue; }
                            }
                            fileCount++;
                            // One report → one row per variant, plus the product's baseline
                            // properties that are still empty: board-db.js
                            // applyReportToProduct, the same converter the board uses when
                            // a card moves to Dashboard, so both write identical rows.
                            const r = window.PerfoTecBoard.applyReportToProduct({
                                ...localFormData,
                                'p2-pack-master': { ...master, packOptCount: count },
                                'p1-core-1': p1c1, 'p1-core-2': p1c2, 'p1-core-3': p1c3,
                            }, parsed);
                            if (r.imported || r.updated) {
                                Object.keys(master).forEach(k => { delete master[k]; });
                                Object.assign(master, r.formData['p2-pack-master']);
                                count = parseInt(r.formData['p2-pack-master'].packOptCount) || count;
                            }
                            if (r.baselineFilled) {
                                Object.assign(p1c1, r.formData['p1-core-1']);
                                Object.assign(p1c2, r.formData['p1-core-2']);
                                Object.assign(p1c3, r.formData['p1-core-3']);
                            }
                            importedCount += r.imported;
                            updatedCount += r.updated || 0;
                            skippedCount += r.skipped;
                            baselineFilled += r.baselineFilled;
                        } else if (Array.isArray(parsed)) {
                            // ── Legacy format: flat array [{Product, TV, O2, CO2, ...}] ──
                            // (count as the shared converter does: a filled first row is a row)
                            if (window.PerfoTecBoard && window.PerfoTecBoard.trialRowCount) count = Math.max(count, window.PerfoTecBoard.trialRowCount(master));
                            const matches = parsed.filter(r => namesProduct(activeProduct, String(r.Product || '') + ' ' + String(r.Variety || r.variety || '')));
                            // Rows already in the table (the same file imported twice) are
                            // skipped; they were added again on every import.
                            const legacyFps = new Set(extractPackRows({ ...master, packOptCount: count }).map(packOptFingerprint));
                            const legacyGasShown = jsonGasIsFraction(parsed) ? '%' : '';
                            if (matches.length === 0) {
                                wrongProduct.push(file.name + ' (no trials for ' + activeProduct.name + ')');
                                continue;
                            }
                            fileCount++;
                            matches.forEach(r => {
                                const before = count;
                                const idx = count++;
                                master['pack_opt_' + idx + '_type']    = r.Packaging || r.Type || 'Crate/Box';
                                master['pack_opt_' + idx + '_material'] = String(r.Material || '');
                                master['pack_opt_' + idx + '_temp']    = r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : String(r.Temperature || '');
                                master['pack_opt_' + idx + '_weight']  = r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000)) : r['Weight (g)'] !== undefined ? String(r['Weight (g)']) : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '';
                                master['pack_opt_' + idx + '_trans']   = r.TV !== undefined ? String(r.TV) : '';
                                master['pack_opt_' + idx + '_o2']      = parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)'], legacyGasShown);
                                master['pack_opt_' + idx + '_co2']     = parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)'], legacyGasShown);
                                master['pack_opt_' + idx + '_company'] = String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : ''));
                                master['pack_opt_' + idx + '_country'] = String(r.Country || r.country || '');
                                master['pack_opt_' + idx + '_days']    = r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '';
                                master['pack_opt_' + idx + '_rating']  = r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : '');
                                master['pack_opt_' + idx + '_condition'] = 'MAP';
                                const fp = packOptFingerprint(Object.fromEntries(PACK_FIELDS.map(f => [f, master['pack_opt_' + idx + '_' + f] || ''])));
                                if (legacyFps.has(fp)) {
                                    PACK_FIELDS.forEach(f => { delete master['pack_opt_' + idx + '_' + f]; });
                                    count = before; skippedCount++;
                                    return;
                                }
                                legacyFps.add(fp);
                                importedCount++;
                            });
                        } else {
                            unreadable.push(file.name);
                        }
                    }

                    // Compose the outcome message
                    const parts = [];
                    if (skippedCount > 0) parts.push(skippedCount + ' skipped (already in the database)');
                    if (wrongProduct.length > 0) parts.push(wrongProduct.length + ' file(s) for a different product: ' + wrongProduct.join(', '));
                    if (unreadable.length > 0) parts.push(unreadable.length + ' unreadable file(s): ' + unreadable.join(', '));

                    if (importedCount === 0 && updatedCount === 0 && baselineFilled === 0) {
                        setInlineTrialMsg('⚠ Nothing imported' + (parts.length ? ' — ' + parts.join('; ') : ' — unknown file format.'));
                        setTimeout(() => setInlineTrialMsg(''), 9000);
                        return { imported: 0, skipped: skippedCount, baselineFilled: 0, problems: parts };
                    }

                    master.packOptCount = count;
                    const baselineUpdates = baselineFilled > 0 ? { 'p1-core-1': p1c1, 'p1-core-2': p1c2, 'p1-core-3': p1c3 } : null;
                    const newFullFormData = { ...localFormData, 'p2-pack-master': master, ...(baselineUpdates || {}) };
                    setLocalFormData(newFullFormData);
                    if (db) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { formData: newFullFormData });
                    } else {
                        setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, formData: newFullFormData } : p));
                    }
                    let msg = '✓ ' + importedCount + ' trial(s) imported from ' + fileCount + ' file(s)' + (updatedCount ? ', ' + updatedCount + ' brought up to date' : '');
                    if (baselineUpdates) msg += ' + product properties updated';
                    if (parts.length) msg += ' — ' + parts.join('; ');
                    setInlineTrialMsg(msg);
                    setTimeout(() => setInlineTrialMsg(''), 8000);
                    return { imported: importedCount, updated: updatedCount, skipped: skippedCount, baselineFilled, problems: parts };
                } catch(err) {
                    console.error(err);
                    setInlineTrialMsg('✗ Import failed: ' + err.message);
                    setTimeout(() => setInlineTrialMsg(''), 5000);
                    return none(err.message);
                }
            };

            const handleInlineTrialJSON = async (e) => {
                e.stopPropagation();
                let files = [];
                try {
                    if (window.showOpenFilePicker) {
                        const handles = await window.showOpenFilePicker({
                            types: [{ description: 'Trial JSON', accept: { 'application/json': ['.json'] } }],
                            multiple: true
                        });
                        files = await Promise.all(handles.map(h => h.getFile()));
                    }
                } catch(err) {
                    if (err.name !== 'AbortError') console.error(err);
                    return;
                }
                await importTrialFiles(files);
            };

            // === PROJECT BOARD AUTO-IMPORT ===
            // Opened as ...?boardProject=<id>&autoImport=1 when a card is dragged
            // into the Dashboard column. Reads that project's report.json from the
            // bound folder, selects the matching product and imports the trial.
            // The one-click banner provides the user gesture the File System Access
            // API requires to (re)grant folder permission in this tab.
            const boardProjectId = new URLSearchParams(window.location.search).get('boardProject');
            const boardAutoImport = new URLSearchParams(window.location.search).get('autoImport') === '1';
            const [boardImport, setBoardImport] = useState(boardProjectId && boardAutoImport ? { status: 'ready' } : null);

            // Opened as ...?product=<id> from the board's products view: land
            // straight on that product. Runs once, after the products are loaded.
            const deepLinkProductId = new URLSearchParams(window.location.search).get('product');
            const deepLinkDoneRef = useRef(false);
            useEffect(() => {
                if (!deepLinkProductId || deepLinkDoneRef.current || products.length === 0) return;
                const target = products.find(p => p.id === deepLinkProductId);
                if (!target) return;
                deepLinkDoneRef.current = true;
                setActiveProductId(target.id);
            }, [deepLinkProductId, products]);


            // ── TRIALS FROM THE BOARD ─────────────────────────────────────────
            // A card moved to Dashboard on the board is imported right there, into
            // the product on disk (board-db importTrialIntoProduct). What still has
            // its note — a push that failed, or a card moved on an older board — is
            // tried here as well: at start and whenever this tab comes back into
            // view, one card at a time, through that same function. It writes the
            // product on disk and never this tab's memory: the import it replaces
            // raced this tab's reload-on-focus, cleared the note before the product
            // was saved, and switched the product on screen under the user.
            const pendingAttemptedRef = useRef(new Set());
            const [pendingTick, setPendingTick] = useState(0);
            // Set when a card was held back for this tab's unsaved work: the next
            // save that lands asks for another round.
            const pendingRetryRef = useRef(false);
            const pendingRetryTimerRef = useRef(null);
            const productConflictsRef = useRef([]);
            productConflictsRef.current = productConflicts;
            // Work on this product that is not on disk yet, anywhere in this tab: a
            // conflict waiting for a choice, a save still debouncing or writing, the
            // record in memory differing from what was last written, or the screen's
            // buffer. An import on disk would then meet that work as a conflict, and
            // either choice lost the trial or the edit.
            const hasLocalWork = (productId) => {
                const B = window.PerfoTecBoard;
                if (productConflictsRef.current.some(c => c.productId === productId)) return true;
                if (fileSaveTimerRef.current || autosaveTimerRef.current) return true;
                // (Not B.hasPendingWrites(): that counts every write, the presence
                // heartbeat included, and held every card for good. A product write
                // in flight shows as the record differing from lastWrittenRef below.)
                const mem = (productsRef.current || []).find(p => p.id === productId);
                if (mem && lastWrittenRef.current.has(productId) && lastWrittenRef.current.get(productId) !== JSON.stringify(mem)) return true;
                const act = activeProductRef.current;
                return !!(act && act.id === productId && !act.isAverage &&
                    JSON.stringify(localFormDataRef.current || {}) !== JSON.stringify(act.formData || {}));
            };

            // Clear the flag on ONE card. writeCard respects the rev rule, so this
            // cannot trample a change someone made to the rest of the card.
            const clearImportPending = async (projectId) => {
                if (!projectId) return;
                try {
                    const B = window.PerfoTecBoard;
                    if (!B || !B.readCard || !B.writeCard) return;   // legacy folder: no cards
                    const card = await B.readCard(projectId);
                    if (!card || !card.dashboardImportPending) return;
                    const next = { ...card };
                    delete next.dashboardImportPending;
                    await B.writeCard(next, { baseRev: card.rev });
                } catch (err) { console.warn('Could not clear the pending-import flag:', err); }
            };

            // A product just written on disk by an import: take that version here.
            // (hasLocalWork was checked before and after the import.)
            const syncProductFromDisk = async (productId) => {
                const B = window.PerfoTecBoard;
                const rec = normalizeProductRecord(await B.readProduct(productId));
                if (!rec || rec.deletedAt) return;
                setProducts(prev => prev.some(p => p.id === rec.id) ? prev.map(p => p.id === rec.id ? rec : p) : [...prev, rec]);
                lastWrittenRef.current.set(rec.id, JSON.stringify(rec));
                productRevsRef.current.set(rec.id, Number(rec.rev || 0));
                if (activeProductIdRef.current === rec.id) setLocalFormData(rec.formData || {});
                if (B.readProductStamps) diskStampsRef.current = await B.readProductStamps();
            };

            // What stands in the way, in words (the board's note says it in the
            // user's language and offers the fix).
            const boardReason = (r) => {
                const named = (x) => x ? ' ("' + x + '")' : '';
                switch (r && r.reason) {
                    case 'not-linked': return 'This project is not linked to a product yet' + named(r.productName) + '. Open its report, pick the product in the header, then retry.';
                    case 'no-report': return 'No report.json found for this project yet.';
                    case 'not-a-report': return 'The report file of this project is not a trial report.';
                    case 'product-missing': return 'The product this project is linked to' + named(r.productName) + ' is not in the database (any more).';
                    case 'state-mismatch': return 'The processing type differs: the report says "' + r.reportState + '", ' + (r.productName || 'the product') + ' is "' + r.productState + '". Check the link, or use "Add anyway" on the note of the card on the board.';
                    case 'no-trial-data': return 'The report has no variants with results yet.';
                    case 'busy': return 'Someone saved the product at the same moment. Retry.';
                    case 'no-card': return 'This project is no longer on the board.';
                    default: return (r && r.message) || 'Import failed.';
                }
            };

            // One card: into its product on disk, its note off the card, and this
            // tab brought up to date with the product.
            // Not while this tab has unsaved work on the product (checked before, by
            // the caller, and again after: the report read can take seconds). If work
            // appeared meanwhile, the card keeps its note and the user is told the
            // folder moved; a later round finds the trial there and clears the note.
            const importFromBoard = async (projectId) => {
                const B = window.PerfoTecBoard;
                const r = await B.importTrialIntoProduct(projectId);
                if (r.ok) {
                    if (r.productId && hasLocalWork(r.productId)) {
                        if (!r.alreadyThere) setStaleOnDisk(true);
                        pendingAttemptedRef.current.delete(projectId);
                        pendingRetryRef.current = true;
                        return { ...r, held: true };
                    }
                    await clearImportPending(projectId);
                    if (r.productId && !r.alreadyThere) await syncProductFromDisk(r.productId);
                }
                return r;
            };

            useEffect(() => {
                if (db || folderState !== 'ready' || products.length === 0 || boardJobRef.current || refreshBusyRef.current) return;
                const B = window.PerfoTecBoard;
                if (!B || !B.importTrialIntoProduct) return;
                boardJobRef.current = true;
                (async () => {
                    try {
                        const manifest = await B.readManifest();
                        const waiting = (manifest.projects || []).filter(p => p && p.dashboardImportPending && p.productId && !p.deletedAt && !pendingAttemptedRef.current.has(p.id));
                        let failed = 0, held = 0;
                        for (const p of waiting) {
                            // Unsaved work on its product here: leave the card for the round
                            // after that work is saved.
                            if (hasLocalWork(p.productId)) { pendingRetryRef.current = true; held++; continue; }
                            pendingAttemptedRef.current.add(p.id);
                            let r;
                            try { r = await importFromBoard(p.id); } catch (e) { r = { ok: false, reason: 'error', message: e.message || String(e) }; }
                            if (!r.ok) failed++;
                            else if (r.held) held++;
                        }
                        if (failed) setBoardImport(prev => (prev ? prev : { status: 'error', msg: failed + ' trial(s) moved to Dashboard on the board could not be imported. The orange note on the card in the board says why, and retries.' }));
                        // Held back for unsaved work: the save that lands retries them;
                        // this is the fallback should none come.
                        if (held && !pendingRetryTimerRef.current) pendingRetryTimerRef.current = setTimeout(() => { pendingRetryTimerRef.current = null; setPendingTick(n => n + 1); }, 5000);
                    } catch (err) { /* no folder / unreadable — nothing to do */ }
                    finally {
                        boardJobRef.current = false;
                        if (wakeDuringJobRef.current) {
                            wakeDuringJobRef.current = false;
                            Promise.resolve(refreshRef.current()).finally(() => setPendingTick(n => n + 1));
                        }
                    }
                })();
            }, [db, folderState, products.length, pendingTick]);

            // Opened as ...?boardProject=<id>&autoImport=1 (older boards did that on a
            // move to Dashboard): the same import, from the banner, whose click is the
            // user gesture a folder permission prompt may need.
            const runBoardImport = async () => {
                const B = window.PerfoTecBoard;
                if (!B || !boardProjectId) return;
                try {
                    setBoardImport({ status: 'working' });
                    if ((await B.permissionState()) !== 'granted') {
                        let ok = false;
                        try { ok = await B.requestAccess(); } catch (e) { ok = false; }
                        if (!ok) { setBoardImport({ status: 'need-perm' }); return; }
                    }
                    const target = ((await B.readManifest()).projects || []).find(p => p.id === boardProjectId);
                    if (target && target.productId && hasLocalWork(target.productId)) {
                        setBoardImport({ status: 'error', msg: 'This product has changes that are not saved yet. Let them save, then retry.' });
                        return;
                    }
                    pendingAttemptedRef.current.add(boardProjectId);
                    const r = await importFromBoard(boardProjectId);
                    if (r.held) { setBoardImport({ status: 'error', msg: 'The trial is in the product on disk, but this tab has unsaved changes to it. Reload from the folder banner, then retry.' }); return; }
                    if (!r.ok) { setBoardImport({ status: 'error', msg: boardReason(r) }); return; }
                    setBoardImport(null);
                    if (r.productId) setActiveProductId(r.productId);
                    setInlineTrialMsg(r.alreadyThere ? '✓ This trial was already in the product.' : r.imported ? '✓ ' + r.imported + ' trial(s) imported from the board.' + (r.updated ? ' ' + r.updated + ' brought up to date.' : '') : '✓ ' + (r.updated || 0) + ' trial(s) brought up to date with the report.');
                    setTimeout(() => setInlineTrialMsg(''), 8000);
                } catch (err) {
                    setBoardImport({ status: 'error', msg: err.message || String(err) });
                }
            };


            const handleImportTrials = async () => {
                const byProduct = {};
                trialImportRows.forEach(row => {
                    const targetId = trialProductMappings[row.product];
                    if (!targetId || targetId === 'skip') return;
                    if (!byProduct[targetId]) byProduct[targetId] = [];
                    byProduct[targetId].push(row);
                });

                for (const [productId, rows] of Object.entries(byProduct)) {
                    let product, updatedFormData;
                    if (productId === 'new') {
                        // Group by product name (multiple "new" entries may exist)
                        // handled below per unique product name
                        continue;
                    }
                    product = products.find(p => p.id === productId);
                    if (!product) continue;

                    const baseFD = latestFormData(product.id);
                    const master = { ...(baseFD['p2-pack-master'] || {}) };
                    let count = trialRowCountOf(master);
                    // A sheet imported again adds nothing twice.
                    const sheetFps = new Set(extractPackRows({ ...master, packOptCount: count }).map(packOptFingerprint));

                    rows.forEach(row => {
                        const fp = packOptFingerprint({ type: row.packaging, material: row.material, temp: row.temp, weight: row.weight, trans: row.tv, o2: row.o2, co2: row.co2, company: row.company, country: row.country, days: row.days, rating: row.rating, date: '' });
                        if (sheetFps.has(fp)) return;
                        sheetFps.add(fp);
                        const idx = count++;
                        master[`pack_opt_${idx}_type`] = row.packaging;
                        master[`pack_opt_${idx}_material`] = row.material;
                        master[`pack_opt_${idx}_temp`] = row.temp;
                        master[`pack_opt_${idx}_weight`] = row.weight;
                        master[`pack_opt_${idx}_trans`] = row.tv;
                        master[`pack_opt_${idx}_o2`] = row.o2;
                        master[`pack_opt_${idx}_co2`] = row.co2;
                        master[`pack_opt_${idx}_company`] = row.company;
                        master[`pack_opt_${idx}_country`] = row.country;
                        master[`pack_opt_${idx}_days`] = row.days;
                        master[`pack_opt_${idx}_rating`] = row.rating;
                    });
                    master.packOptCount = count;

                    updatedFormData = { ...baseFD, 'p2-pack-master': master };
                    if (db) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId), { formData: updatedFormData });
                    } else {
                        setProducts(prev => prev.map(p => p.id === productId ? { ...p, formData: updatedFormData } : p));
                    }
                    bufferFollows(productId, updatedFormData);
                }

                // Handle "new" products: group by product name
                const newByName = {};
                trialImportRows.forEach(row => {
                    if (trialProductMappings[row.product] !== 'new') return;
                    if (!newByName[row.product]) newByName[row.product] = [];
                    newByName[row.product].push(row);
                });

                for (const [pName, rows] of Object.entries(newByName)) {
                    const master = { packOptCount: rows.length };
                    rows.forEach((row, idx) => {
                        master[`pack_opt_${idx}_type`] = row.packaging;
                        master[`pack_opt_${idx}_material`] = row.material;
                        master[`pack_opt_${idx}_temp`] = row.temp;
                        master[`pack_opt_${idx}_weight`] = row.weight;
                        master[`pack_opt_${idx}_trans`] = row.tv;
                        master[`pack_opt_${idx}_o2`] = row.o2;
                        master[`pack_opt_${idx}_co2`] = row.co2;
                        master[`pack_opt_${idx}_company`] = row.company;
                        master[`pack_opt_${idx}_country`] = row.country;
                        master[`pack_opt_${idx}_days`] = row.days;
                        master[`pack_opt_${idx}_rating`] = row.rating;
                    });
                    const variety = rows[0].variety || '';
                    const baseId = `${pName}-${variety || 'base'}-whole`.toLowerCase().replace(/[^a-z0-9]/g, '-');
                    const finalId = products.some(p => p.id === baseId) ? `${baseId}-${Date.now()}` : baseId;
                    const newProd = {
                        id: finalId, name: pName, variety, state: 'whole', targets: ['liner'],
                        imageUrl: '', createdAt: new Date().toISOString(), completedTaskIds: [], links: {},
                        formData: { 'p2-pack-master': master }
                    };
                    if (db) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', finalId), newProd);
                    } else {
                        setProducts(prev => [...prev, newProd]);
                    }
                }

                resetModal();
            };


            // ── Merge helper utilities ────────────────────────────────────────────────
            // The full row schema. This used to stop at pdf, and buildMergedFD
            // rebuilds the pack block from scratch (nd = {}), so every merge —
            // the Merge Pipelines tool, conflict resolution, and accepting
            // "Merge with: <product>" on import — permanently dropped the trial
            // date, the variety tag, the conclusion notes and the whole
            // quality-over-time curve of every row it touched.
            const PACK_FIELDS = TRIAL_ROW_FIELDS;

            // Includes date: without it two genuinely separate trial rounds that
            // happened to share material, temp, weight, gas and rating counted as
            // the same row and one of them was discarded by the dedupe below.
            // notes and curve stay out on purpose — a differing conclusion or
            // curve should not turn one trial into two.
            const packOptFingerprint = row =>
                ['type','material','temp','weight','trans','o2','co2','company','country','days','rating','date']
                .map(f => String(row[f]||'').trim().toLowerCase()).join('|');

            const extractPackRows = master => {
                const n = trialRowCountOf(master); const rows = [];
                for (let i = 0; i < n; i++) { const r = {}; PACK_FIELDS.forEach(f => { r[f] = (master[`pack_opt_${i}_${f}`])||''; }); rows.push(r); }
                return rows;
            };

            const getFieldLabel = (tk, fk) => {
                const MAP = { acp:'ACP (%)', minTemp:'Min. Tolerance Temp (°C)', critCO2:'Max CO₂ (%)', rq:'RQ', q10:'Q10', ethyleneClass:'Ethylene Class', vpdSensitivity:'VPD Sensitivity', targetO2Min:'Target O₂ Min (%)', targetO2Max:'Target O₂ Max (%)', targetCO2Min:'Target CO₂ Min (%)', targetCO2Max:'Target CO₂ Max (%)', storageTempMin:'Storage Temp Min (°C)', storageTempMax:'Storage Temp Max (°C)', targetRHMin:'RH Min (%)', targetRHMax:'RH Max (%)', primaryThreat:'Primary Threat', secondaryThreat:'Secondary Threat', condensationRisk:'Condensation Risk' };
                if (MAP[fk]) return MAP[fk];
                const rm = fk.match(/^(?:target_)?temp(-?[\d.]+)_(O2|CO2)$/);
                if (rm) return `Respiration ${rm[1]}°C (${rm[2]})`;
                const TK = { 'p1-core-1':'FRM Baseline', 'p1-core-2':'Respiration Curves', 'p1-core-3':'MAP Conditions', 'p1-core-4':'Threats' };
                return `${TK[tk]||tk}: ${fk}`;
            };

            const detectConflicts = (targetFD, sourceFD) => {
                const SKIP_FIELDS = /^(defect_|defectCount|packOptCount|q10Source)/;
                const out = [];
                for (const tk in (sourceFD||{})) {
                    if (tk === 'p2-pack-master') continue;
                    const src = sourceFD[tk]||{}; const tgt = (targetFD||{})[tk]||{};
                    for (const fk in src) {
                        if (SKIP_FIELDS.test(fk)) continue;
                        const sv = String(src[fk]||'').trim(); const tv = String(tgt[fk]||'').trim();
                        if (sv && tv && sv !== tv) out.push({ tk, fk, sv, tv });
                    }
                }
                return out;
            };

            const buildMergedFD = (targetFD, sourceFD, choices) => {
                const result = {};
                const allKeys = new Set([...Object.keys(targetFD||{}), ...Object.keys(sourceFD||{})]);
                for (const tk of allKeys) {
                    const tgt = (targetFD||{})[tk]||{}; const src = (sourceFD||{})[tk]||{};
                    if (tk === 'p1-core-4') {
                        // Defects are a list, merged by name. Field by field, defect 2 of
                        // one product and defect 2 of the other became one row with the
                        // name of the first and the causes of the second.
                        const merged = { ...src };
                        Object.keys(tgt).forEach(k => { if (!/^defect_\d+_/.test(k) && String(tgt[k] == null ? '' : tgt[k]).trim() !== '') merged[k] = tgt[k]; });
                        Object.keys(merged).forEach(k => { if (/^defect_\d+_/.test(k)) delete merged[k]; });
                        Object.keys(merged).forEach(k => {
                            const ck = tk + '.' + k;
                            if (choices && choices[ck] === 'source' && src[k] !== undefined) merged[k] = src[k];
                            else if (choices && choices[ck] === 'target' && tgt[k] !== undefined) merged[k] = tgt[k];
                        });
                        const defects = [];
                        const seenNames = new Set();
                        [tgt, src].forEach(m => {
                            const n = Math.max(parseInt(m.defectCount, 10) || 0, ...Object.keys(m).map(k => { const x = k.match(/^defect_(\d+)_/); return x ? +x[1] + 1 : 0; }));
                            for (let i = 0; i < n; i++) {
                                const row = {}; let any = false;
                                ['name', 'cause', 'mhp', 'map'].forEach(f => { const v = m[`defect_${i}_${f}`]; if (v !== undefined && String(v).trim() !== '') { row[f] = v; any = true; } });
                                if (!any) continue;
                                const key = String(row.name || '').trim().toLowerCase();
                                if (key && seenNames.has(key)) continue;
                                if (key) seenNames.add(key);
                                defects.push(row);
                            }
                        });
                        defects.forEach((row, i) => Object.keys(row).forEach(f => { merged[`defect_${i}_${f}`] = row[f]; }));
                        merged.defectCount = Math.max(defects.length, 7);
                        result[tk] = merged;
                    } else if (tk === 'p2-pack-master') {
                        // Deduplicate pack-opt rows: all unique rows from both, exact match excl. pdf
                        const seen = new Set();
                        const rows = [...extractPackRows(tgt), ...extractPackRows(src)].filter(r => {
                            const k = packOptFingerprint(r); if (seen.has(k)) return false; seen.add(k); return true;
                        });
                        const nd = {};
                        [src, tgt].forEach(m => Object.keys(m).forEach(k => {
                            if (/^pack_opt_\d+_/.test(k) || k === 'packOptCount') return;
                            if (String(m[k] == null ? '' : m[k]).trim() !== '') nd[k] = m[k];
                        }));
                        rows.forEach((r, i) => PACK_FIELDS.forEach(f => { nd[`pack_opt_${i}_${f}`] = r[f]; }));
                        nd.packOptCount = rows.length;
                        result[tk] = nd;
                    } else {
                        // Field-level merge: start with source, override with target when non-empty
                        const merged = { ...src };
                        for (const fk in tgt) {
                            const ck = `${tk}.${fk}`;
                            if (choices && choices[ck] === 'source') { merged[fk] = src[fk]; }
                            else if (choices && choices[ck] === 'target') { merged[fk] = tgt[fk]; }
                            else if (String(tgt[fk]||'').trim() !== '') merged[fk] = tgt[fk]; // non-empty target wins
                            // else: target empty → source value stays in merged (fills in blank fields)
                        }
                        result[tk] = merged;
                    }
                }
                return result;
            };

            const applyMerge = async (target, source, sourceFD, choices) => {
                const targetFD = latestFormData(target.id);
                if (source && source.id === bufferOwnerRef.current) sourceFD = latestFormData(source.id);
                const mergedFormData = buildMergedFD(targetFD, sourceFD, choices);
                const mergedLinks = { ...(target.links||{}) };
                for (const step in (source?.links||{})) {
                    mergedLinks[step] = [...(target.links?.[step]||[]), ...(source.links[step]||[])];
                }
                const mergedDoc = {
                    ...target,
                    targets: Array.from(new Set([...target.targets, ...(source?.targets||[])])),
                    completedTaskIds: Array.from(new Set([...(target.completedTaskIds||[]), ...(source?.completedTaskIds||[])])),
                    // The record that disappears leaves its names behind. Merging
                    // a duplicate "Flat Beans" into Romano Beans is precisely how
                    // an alternative name gets discovered, and anyone still
                    // searching the old name has to land on the surviving product.
                    aliases: cleanAliases([...aliasesOf(target), ...aliasesOf(source), (source?.name || '')], target.name),
                    formData: mergedFormData, links: mergedLinks,
                    imageUrl: target.imageUrl || source?.imageUrl
                };
                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', target.id), mergedDoc);
                    if (source) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', source.id));
                } else {
                    setProducts(prev => {
                        const filtered = source ? prev.filter(p => p.id !== source.id && p.id !== target.id) : prev.filter(p => p.id !== target.id);
                        return [...filtered, mergedDoc];
                    });
                }
                // The board's cards that pointed at the merged-away product now
                // point at the one that stays; they lost their product before, and
                // with it the trials in the dashboard's "Trials in the workflow".
                if (!db && source && folderState === 'ready' && window.PerfoTecBoard && window.PerfoTecBoard.relinkProductCards) {
                    window.PerfoTecBoard.relinkProductCards(source.id, target.id, target.name).catch(err => console.error('Relinking the board cards failed:', err));
                }
                setLoadedDataId(null); setActiveProductId(target.id);
                setMergeConflictPending(null); setConflictChoices({});
                setShowMergeModal(false); setMergeSourceId(''); setMergeManualTargetId('');
            };

            const handleApplyConflictMerge = async () => {
                if (!mergeConflictPending) return;
                const { type, targetId, sourceId, sourceFD, newProdData } = mergeConflictPending;
                const targetRec = products.find(p => p.id === targetId);
                if (!targetRec) { setMergeConflictPending(null); return; }
                const target = { ...targetRec, formData: latestFormData(targetRec.id) };
                if (type === 'import') {
                    const mergedFormData = buildMergedFD(target.formData, sourceFD, conflictChoices);
                    const mergedDoc = { ...target, imageUrl: (newProdData?.imageUrl)||target.imageUrl, targets: Array.from(new Set([...target.targets, ...(newProdData?.targets||[])])), aliases: cleanAliases([...aliasesOf(target), ...aliasesOf(newProdData), (newProdData?.name || '')], target.name), formData: mergedFormData };
                    if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', target.id), mergedDoc);
                    else setProducts(prev => prev.map(p => p.id === target.id ? mergedDoc : p));
                    setLoadedDataId(null); resetModal(); setMergeConflictPending(null); setConflictChoices({}); setActiveProductId(target.id); setActiveStepId(1); setActiveTab('pipeline');
                } else {
                    const source = products.find(p => p.id === sourceId);
                    if (source) await applyMerge(target, source, sourceFD, conflictChoices);
                    else { setMergeConflictPending(null); setConflictChoices({}); }
                }
            };

            const handleManualMerge = async () => {
                if (!mergeSourceId || !mergeManualTargetId) return;
                const source = products.find(p => p.id === mergeSourceId);
                const target = products.find(p => p.id === mergeManualTargetId);
                if (!source || !target) return;
                const conflicts = detectConflicts(target.formData, source.formData);
                if (conflicts.length > 0) {
                    setMergeConflictPending({ type: 'manual', targetId: target.id, sourceId: source.id, sourceFD: source.formData });
                    setConflictChoices({});
                    return;
                }
                await applyMerge(target, source, source.formData, {});
            };

            const toggleTaskCompletion = async (taskId, e) => {
                if (e) e.stopPropagation(); if (!activeProduct || activeProduct.isAverage) return;
                const currentCompleted = activeProduct.completedTaskIds || [];
                let newCompleted = currentCompleted.includes(taskId) ? currentCompleted.filter(id => id !== taskId) : [...currentCompleted, taskId];
                if (db) {
                    const productRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id); await updateDoc(productRef, { completedTaskIds: newCompleted });
                } else { setProducts(prev => prev.map(p => p.id === activeProduct.id ? {...p, completedTaskIds: newCompleted} : p)); }
            };
