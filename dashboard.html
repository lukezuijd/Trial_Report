                            <div className="p-5 space-y-6">
                                <div>
                                    <span className="block text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-500 mb-2">Configurations on file — most consistent first</span>
                                    {candidates.length === 0 ? <p className="text-sm text-slate-400">No PerfoTec configuration in the trial table yet.</p> : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs text-left border-collapse">
                                                <thead className="text-[10px] font-spartan uppercase text-slate-500 bg-slate-50"><tr>
                                                    <th className="p-2 border-b border-slate-200" title="The atmosphere the packs reached at the end of the trial (middle half of the trials) — that, not the target in the variant's name, decided the result">Achieved atmosphere</th><th className="p-2 border-b border-slate-200">Packaging · conditions</th><th className="p-2 border-b border-slate-200">Rounds</th><th className="p-2 border-b border-slate-200" title="Against the best current packaging of the same round">Vs current packaging</th><th className="p-2 border-b border-slate-200">Statable shelf life</th><th className="p-2 border-b border-slate-200"></th>
                                                </tr></thead>
                                                <tbody>
                                                    {candidates.slice(0, 8).map((cfg, k) => {
                                                        const h = claimHeadline(cfg);
                                                        const has = claims.some(c => c.key === cfg.key && c.status !== 'superseded');
                                                        return (
                                                            <tr key={cfg.key} className={`border-b border-slate-100 ${k === 0 ? 'bg-green-50/50' : ''}`}>
                                                                <td className="p-2 text-slate-900"><span className="font-bold">{atmosphereText(cfg.o2Typical, cfg.co2Typical) || cfg.material}</span>{k === 0 && <span className="ml-1 text-[10px] font-bold text-[#008837]">most consistent</span>}<span className="block text-[10px] text-slate-400">variant: {cfg.material}</span></td>
                                                                <td className="p-2 text-slate-600">{cfg.type} · {cfg.condition} · {tempRangeText(cfg.temp) || '—'}{(cfg.films || []).length > 0 ? <span className="block text-[10px] font-bold text-green-800">{cfg.films.map(id => (filmById(id) || {}).name || 'unknown film').join(', ')}</span> : <span className="block text-[10px] text-amber-700">no film linked</span>}</td>
                                                                <td className="p-2 text-slate-600">{cfg.roundCount}{cfg.varieties.length ? ` · ${cfg.varieties.length} cultivars` : ''}</td>
                                                                <td className="p-2 text-slate-800">{cfg.compared ? `${recordTextOf(cfg)} (${cfg.compared})` : 'no current packaging tested'}{cfg.censoredTies ? <span className="text-slate-400"> · {cfg.censoredTies} ties stopped in spec</span> : null}</td>
                                                                <td className="p-2 text-slate-800">{h ? `${h.open ? '≥ ' : ''}${h.days} days (${h.rounds} round${h.rounds !== 1 ? 's' : ''})` : '—'}</td>
                                                                <td className="p-2 text-right">{!readOnly && <button onClick={() => draftFrom(cfg)} disabled={has} className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg border border-[#084BCD] text-[#084BCD] hover:bg-blue-50 disabled:opacity-30 disabled:cursor-not-allowed" title={has ? 'There is already an open claim for this configuration' : 'Draft a claim from this record'}>Draft claim</button>}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>

                                {typeClaims.length > 0 && (
                                    <div className="space-y-4">
                                        {[...typeClaims].sort((a, b) => (a.status === 'superseded') - (b.status === 'superseded') || String(b.createdAt).localeCompare(String(a.createdAt))).map(c => {
                                            const s = c.snapshot || {};
                                            const draft = c.status === 'draft';
                                            const drift = c.status === 'approved' ? driftOf(c) : '';
                                            const block = draft ? approvalBlock(c) : '';
                                            return (
                                                <div key={c.id} className={`border rounded-xl p-4 ${c.status === 'approved' ? 'border-green-300 bg-green-50/30' : c.status === 'superseded' ? 'border-slate-200 opacity-60' : 'border-amber-300 bg-amber-50/30'}`}>
                                                    <div className="flex flex-wrap items-center gap-2 mb-2">
                                                        {statusPill(c)}
                                                        <span className="font-bold text-slate-900 text-sm">{atmosphereText(s.o2Typical, s.co2Typical) || s.material}</span>
                                                        <span className="text-xs text-slate-500">{s.type} · {s.condition} · {tempRangeText(s.temp)}{(() => { const ids = claimFilmIds(c); return ids.length ? <> · film: <b className="text-green-800">{ids.map(id => (filmById(id) || {}).name || 'unknown').join(', ')}</b></> : ' · no film linked'; })()} · variant: {s.material}</span>
                                                        <span className="ml-auto text-[11px] text-slate-400">{c.status === 'approved' ? `Approved by ${c.approvedBy} · ${String(c.approvedAt || '').slice(0, 10)}` : `Drafted by ${c.createdBy || '—'} · ${String(c.createdAt || '').slice(0, 10)}`}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-600 mb-3">Frozen record: {s.compared} rounds compared — {s.better} better · {s.equal} equal · {s.worse} worse{s.censoredTies ? ` (${s.censoredTies} ties stopped in spec)` : ''} · statable shelf life {s.headlineOpen ? '≥ ' : ''}{s.headlineDays} days{s.varieties ? ` · ${s.varieties} cultivars` : ''}.</p>
                                                    {['en', 'nl'].map(l => (
                                                        <div key={l} className="mb-2">
                                                            <label className="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">{l === 'en' ? 'Claim (English)' : 'Claim (Nederlands)'}</label>
                                                            {draft && !readOnly
                                                                ? <textarea rows={3} className="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#084BCD] outline-none" value={(c.text && c.text[l]) || ''} onChange={e => updateClaim(c.id, { text: { ...(c.text || {}), [l]: e.target.value } })}/>
                                                                : <p className="text-sm text-slate-800 bg-white border border-slate-200 rounded-lg p-2.5">{(c.text && c.text[l]) || '—'}</p>}
                                                        </div>
                                                    ))}
                                                    {drift && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-2 py-1 mb-2 flex items-start gap-1.5"><AlertCircle size={13} className="shrink-0 mt-0.5"/>The data changed after approval. {drift} The approved text stays as it is until a new version is approved.</p>}
                                                    {!readOnly && (
                                                        <div className="flex flex-wrap items-center gap-2 mt-2">
                                                            {draft && <button onClick={() => approve(c)} disabled={!!block} title={block || 'Approve this claim for client documents'} className="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg bg-[#008837] text-white disabled:opacity-40 disabled:cursor-not-allowed">Approve</button>}
                                                            {draft && <button onClick={() => removeClaim(c.id)} className="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">Delete draft</button>}
                                                            {c.status === 'approved' && (() => { const cur = conf.configs.find(x => x.key === c.key); return cur ? <button onClick={() => draftFrom(cur, c)} disabled={claims.some(x => x.key === c.key && x.status === 'draft')} className="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg border border-[#084BCD] text-[#084BCD] hover:bg-blue-50 disabled:opacity-30">Draft new version</button> : null; })()}
                                                            {draft && block && <span className="text-[11px] text-slate-500">{block}</span>}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── 2. Package ── */}
                        <div className="bg-white border border-slate-200 rounded-xl shadow-sm">
                            <div className="p-4 border-b border-slate-200 bg-slate-50 flex flex-wrap items-center gap-3">
                                <h3 className="font-spartan font-bold text-lg text-slate-900 flex items-center gap-2"><FolderOpen size={18} className="text-[#084BCD]"/> Client package — {packName(ctype)}</h3>
                                <span className="ml-auto flex items-center gap-2">
                                    <select value={overviewLang} onChange={e => setOverviewLang(e.target.value)} className="text-xs font-bold border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
                                        <option value="en">English</option>
                                        <option value="nl">Nederlands</option>
                                    </select>
                                    <button onClick={openOverview} disabled={!approvedClaims.length} title={approvedClaims.length ? 'Open the commercial overview — print it to PDF or download it from there' : 'Approve a claim first'} className="flex items-center gap-2 text-xs font-bold uppercase tracking-widest bg-[#084BCD] text-white px-4 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed"><FileText size={14}/> Commercial overview</button>
                                    {!approvedClaims.length && <span className="text-[11px] text-slate-500">Needs an approved {packName(ctype).toLowerCase()} claim</span>}
                                </span>
                            </div>
                            <div className="p-5 grid grid-cols-1 lg:grid-cols-2 gap-5">
                                {COMMERCIAL_SECTIONS.map(sec => (
                                    <CommercialSection key={sec.id} sec={sec} items={autoItems[sec.id] || []} docs={docsIn(sec.id)} readOnly={readOnly} onAdd={addDoc} onRemove={removeDoc} typeName={packName(ctype)}/>
                                ))}
                            </div>
                            <p className="px-5 pb-5 text-[11px] text-slate-400">File names in the shared library: PRODUCT_DocumentType_LANG_vX_YYYYMMDD — e.g. {String(activeProduct.name || 'Product').toUpperCase().replace(/[^A-Z0-9]+/g, '')}_Overview-{ctype.replace(/[^A-Za-z]/g, '')}_EN_v1_{new Date().toISOString().slice(0, 10).replace(/-/g, '')}.pdf</p>
                        </div>
                    </div>
                );
            };
            const recordTextOf = (c) => `${c.better} better · ${c.equal} equal · ${c.worse} worse`;

            // The database as a page of its own, opened from the masthead: it spans
            // every product, so it is not one of a product's tabs. Picking a product
            // (or clicking the button again) goes back to the product view.
            const renderDatabasePage = () => (
                <>
                    <div className="pf-hero text-white relative overflow-hidden py-8">
                        <div className="max-w-[1600px] w-full mx-auto px-6 relative z-10 flex flex-wrap items-end justify-between gap-6">
                            <div>
                                <div className="pf-web-chip is-state is-green mb-4"><span className="flex items-center gap-2"><Database size={14}/> All products</span></div>
                                <h2 className="text-3xl md:text-4xl font-spartan font-extrabold mb-3 tracking-tight leading-[1.08] text-white">
                                    Database<br/><span className="pf-web-accent-dark">Every product, every trial.</span>
                                </h2>
                                <p className="text-sm text-white/75 max-w-3xl">Product properties, respiration and trial results of the whole range side by side, and the film register. Changes here are saved to the product they belong to.</p>
                            </div>
                            {activeProduct && (
                                <button type="button" onClick={() => { setGlobalPage(null); window.scrollTo({ top: 0, behavior: 'instant' }); }} className="pf-dark-btn flex items-center gap-2 px-3 py-2 text-sm font-bold font-spartan whitespace-nowrap">
                                    <ArrowRight size={15} className="rotate-180 text-[#7FB2FF]"/> Back to {activeProduct.name}{activeProduct.variety && !activeProduct.isAverage ? ` · ${activeProduct.variety}` : ''}
                                </button>
                            )}
                        </div>
                    </div>
                    <main className="max-w-[1600px] w-full mx-auto px-6 py-10 relative z-20 min-w-0">
                        <PanelBoundary name="Database" resetKey="database"><RenderPanel render={renderDatabaseTab}/></PanelBoundary>
                    </main>
                </>
            );

            const renderDatabaseTab = () => {
                const handleDbSort = (col) => {
                    if (dbSortCol === col) { setDbSortDir(dbSortDir === 'asc' ? 'desc' : 'asc'); }
                    else { setDbSortCol(col); setDbSortDir('asc'); }
                };
                const dbSortIcon = (col) => dbSortCol === col ? (dbSortDir === 'asc' ? ' ▲' : ' ▼') : '';

                const sortData = (data, col, dir) => {
                    if (!col) return data;
                    return [...data].sort((a, b) => {
                        let va = a[col] || '', vb = b[col] || '';
                        // Special handling for nested data if needed, but here they are flattened
                        if (col === 'name') { va = a.name; vb = b.name; }
                        // Dates as dates: parseFloat("2026-03-01") is 2026, so it sorted by year only.
                        if (col === 'date') {
                            const da = Date.parse(va) || 0, dbv = Date.parse(vb) || 0;
                            return dir === 'asc' ? da - dbv : dbv - da;
                        }
                        
                        const na = parseFloat(va), nb = parseFloat(vb);
                        if (!isNaN(na) && !isNaN(nb)) return dir === 'asc' ? na - nb : nb - na;
                        return dir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
                    });
                };

                const getFlattenedRespiration = () => {
                    const rows = [];
                    displayProducts.forEach(p => {
                        const rrData = p.formData?.['p1-core-2'] || {};
                        const temps = new Set();
                        Object.keys(rrData).forEach(k => { const m = k.match(/^(?:target_)?temp(-?[\d.]+)_/); if (m) temps.add(parseFloat(m[1])); });
                        temps.forEach(t => {
                            rows.push({
                                productId: p.id, name: p.name, state: p.state, variety: p.variety, isAverage: p.isAverage, temp: t,
                                tgtO2: rrData[`target_temp${t}_O2`] || '', tgtCO2: rrData[`target_temp${t}_CO2`] || '', actO2: rrData[`temp${t}_O2`] || '', actCO2: rrData[`temp${t}_CO2`] || ''
                            });
                        });
                    });
                    return rows;
                };

                const getFlattenedTrials = () => {
                    const rows = [];
                    // Not the "All varieties" view: its rows are the varieties' own,
                    // and every trial was listed twice.
                    displayProducts.filter(p => !p.isAverage).forEach(p => {
                        const packData = p.formData?.['p2-pack-master'] || {};
                        const count = trialRowCountOf(packData);
                        for (let i=0; i<count; i++) {
                            const hasAnyData = ['type', 'material', 'temp', 'weight', 'trans', 'o2', 'co2', 'company', 'country', 'days', 'rating', 'pdf', 'date', 'variety'].some(f => packData[`pack_opt_${i}_${f}`]);
                            if (!hasAnyData) continue;
                            rows.push({
                                productId: p.id, name: p.name, state: p.state, variety: (packData[`pack_opt_${i}_variety`] || p.variety), isAverage: p.isAverage, idx: i,
                                target: packData[`pack_opt_${i}_type`] || '', mat: packData[`pack_opt_${i}_material`] || '', film: packData[`pack_opt_${i}_film`] || '', filmName: (filmById(packData[`pack_opt_${i}_film`]) || {}).name || '', role: packData[`pack_opt_${i}_role`] || '', temp: packData[`pack_opt_${i}_temp`] || '', weight: packData[`pack_opt_${i}_weight`] || '', o2: packData[`pack_opt_${i}_o2`] || '', co2: packData[`pack_opt_${i}_co2`] || '', trans: packData[`pack_opt_${i}_trans`] || '', days: packData[`pack_opt_${i}_days`] || '', rating: packData[`pack_opt_${i}_rating`] || '', pdf: packData[`pack_opt_${i}_pdf`] || '', company: packData[`pack_opt_${i}_company`] || '', country: packData[`pack_opt_${i}_country`] || '', date: packData[`pack_opt_${i}_date`] || '', notes: packData[`pack_opt_${i}_notes`] || '',
                                perf: packData[`pack_opt_${i}_perf`] || '', flush: packData[`pack_opt_${i}_flush`] || '', startO2: packData[`pack_opt_${i}_startO2`] || '', startCO2: packData[`pack_opt_${i}_startCO2`] || ''
                            });
                        }
                    });
                    return rows;
                };

                const dbProductList = products.filter(p => !p.isAverage).sort((a,b) => a.name.localeCompare(b.name));

                // min-w-0: as a flex item this box grew to its widest table, and the
                // whole page scrolled sideways on a laptop screen; the tables scroll
                // inside their own frames instead.
                return (
                    <div className="animate-fadeIn pb-20 max-w-[1600px] mx-auto min-w-0 w-full">
                        {/* Tab nav in a solid white card so the blue hero gradient never bleeds through */}
                        <div className="bg-white rounded-xl shadow-sm px-6 mb-6">
                            <div className="flex gap-6 border-b border-slate-200 overflow-x-auto overflow-y-hidden whitespace-nowrap">
                                <button onClick={() => { setDbActiveTab('properties'); setDbSortCol(''); }} className={`py-4 text-sm font-bold uppercase tracking-widest transition-colors border-b-2 -mb-px ${dbActiveTab === 'properties' ? 'text-blue-600 border-blue-600' : 'text-slate-500 hover:text-slate-900 border-transparent'}`}>Product Properties</button>
                                <button onClick={() => { setDbActiveTab('respiration'); setDbSortCol(''); }} className={`py-4 text-sm font-bold uppercase tracking-widest transition-colors border-b-2 -mb-px ${dbActiveTab === 'respiration' ? 'text-blue-600 border-blue-600' : 'text-slate-500 hover:text-slate-900 border-transparent'}`}>Respiration Data</button>
                                <button onClick={() => { setDbActiveTab('trials'); setDbSortCol(''); }} className={`py-4 text-sm font-bold uppercase tracking-widest transition-colors border-b-2 -mb-px ${dbActiveTab === 'trials' ? 'text-blue-600 border-blue-600' : 'text-slate-500 hover:text-slate-900 border-transparent'}`}>Trial Results (Trials)</button>
                                <button onClick={() => { setDbActiveTab('films'); setDbSortCol(''); }} className={`py-4 text-sm font-bold uppercase tracking-widest transition-colors border-b-2 -mb-px ${dbActiveTab === 'films' ? 'text-blue-600 border-blue-600' : 'text-slate-500 hover:text-slate-900 border-transparent'}`}>Films</button>
                                <button onClick={() => { setDbActiveTab('hub'); setDbSortCol(''); }} className={`py-4 text-sm font-bold uppercase tracking-widest transition-colors border-b-2 -mb-px ${dbActiveTab === 'hub' ? 'text-blue-600 border-blue-600' : 'text-slate-500 hover:text-slate-900 border-transparent'}`}>Hub</button>
                            </div>
                        </div>

                        {dbActiveTab === 'hub' && (() => {
                            // The Hub's catalogue next to ours: which Hub product group and
                            // film each of ours is, and where the two disagree. Matched on
                            // name until a link is chosen; nothing here writes to the Hub.
                            const B = window.PerfoTecBoard;
                            const cat = hubReg && hubReg.catalogue;
                            const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
                            const range = (vals, unit) => { const v = vals.filter(x => x != null); if (!v.length) return '—'; const lo = Math.min(...v), hi = Math.max(...v); return (lo === hi ? `${lo}` : `${lo}–${hi}`) + unit; };
                            const HOW = { linked: ['Linked', 'bg-[#084BCD]/10 text-[#084BCD]'], name: ['Same name', 'bg-green-100 text-green-800'], part: ['Name contains it — check', 'bg-amber-100 text-amber-800'], unlinked: ['Not in the Hub', 'bg-slate-200 text-slate-600'], none: ['No match', 'bg-red-50 text-red-700'] };
                            const linkSelect = (kind, id, m, options) => (
                                <select className="w-full p-1.5 text-xs border border-slate-200 rounded-lg bg-white" value={m.how === 'linked' ? m.hub.id : m.how === 'unlinked' ? '__none' : ''}
                                    onChange={e => linkHub(kind, id, e.target.value === '' ? null : e.target.value === '__none' ? '' : e.target.value)}>
                                    <option value="">Match on name{(m.how === 'name' || m.how === 'part') && m.hub ? ` → ${m.hub.name}` : ''}</option>
                                    <option value="__none">Not in the Hub</option>
                                    {options.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                                </select>
                            );
                            const badge = (how) => <span className={`text-[10px] font-bold uppercase px-2 py-1 rounded whitespace-nowrap ${HOW[how][1]}`}>{HOW[how][0]}</span>;
                            const differs = (a, b) => a != null && b != null && Math.abs(a - b) > Math.max(0.05 * Math.abs(b), 0.01);
                            return (
                                <div className="space-y-6">
                                    <div className="bg-white border border-slate-200 shadow-sm rounded-xl p-5 flex flex-wrap items-center gap-4">
                                        <div className="flex-1 min-w-[260px]">
                                            <h3 className="font-spartan font-bold text-lg text-slate-900">PerfoTec Hub catalogue</h3>
                                            {cat
                                                ? <p className="text-sm text-slate-500 mt-1">Snapshot of {cat.exportedAt ? new Date(cat.exportedAt).toLocaleDateString() : 'unknown date'}{cat.source ? ` from ${cat.source.replace(/^https?:\/\//, '')}` : ''}: {cat.products.length} products, {cat.varieties.length} varieties, {cat.films.length} films, {cat.packages.length} packages, {cat.laserPrograms.length} laser programs.{hubReg.importedBy ? ` Imported by ${hubReg.importedBy}.` : ''}</p>
                                                : <p className="text-sm text-slate-500 mt-1">No Hub catalogue here yet. Export it in the Hub and import the file: products, films, packages and laser programs then link to the products, films and trials in this dashboard.</p>}
                                            {hubMsg && <p className="text-xs font-bold text-slate-700 mt-2">{hubMsg}</p>}
                                        </div>
                                        <button type="button" onClick={importHubCatalogue} disabled={!B || !B.writeHub || !folderName} title={folderName ? 'Pick the perfotec-hub-catalogue.json the Hub exported' : 'Link the shared folder first'}
                                            className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest bg-[#084BCD] text-white px-4 py-2.5 rounded-lg hover:opacity-90 disabled:opacity-40"><Upload size={14}/> Import Hub catalogue</button>
                                        {cat && <button type="button" onClick={async () => { const r = await syncHubData(); if (r) setHubMsg('✓ Synced · ' + r); }} title="Bring the films and the respiration measurements of this catalogue into the dashboard's own data again" className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest border border-slate-300 text-slate-700 px-4 py-2.5 rounded-lg hover:bg-slate-100"><RefreshCw size={14}/> Sync</button>}
                                    </div>
                                    {cat && (() => {
                                        const rows = dbProductList.map(p => {
                                            const hv = B.hubVarietiesOf(p, hubReg);
                                            const m = { hub: hv.hub, how: hv.how };
                                            const vars = hv.varieties, allVars = hv.hub ? cat.varieties.filter(v => v.productId === hv.hub.id) : [];
                                            const rec = (p.formData || {})['hub-respiration'] || null;
                                            const c3 = (p.formData && p.formData['p1-core-3']) || {}, c1 = (p.formData && p.formData['p1-core-1']) || {};
                                            return { p, m, hv, vars, allVars, rec, o2Min: num(c3.targetO2Min), o2Max: num(c3.targetO2Max), crit: num(c1.critCO2) };
                                        });
                                        const counts = rows.reduce((a, r) => { a[r.m.how] = (a[r.m.how] || 0) + 1; return a; }, {});
                                        return (
                                            <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                                                <div className="p-4 border-b border-slate-200 bg-slate-50 flex flex-wrap items-center gap-3">
                                                    <h4 className="font-spartan font-bold text-slate-900">Products</h4>
                                                    <span className="text-xs text-slate-500">{rows.length} here · {(counts.linked || 0) + (counts.name || 0)} matched · {counts.part || 0} to check · {counts.none || 0} without a match · {counts.unlinked || 0} not in the Hub</span>
                                                    <p className="basis-full text-xs text-slate-500">Products are linked on their name; within a product on the variety and on whole or processed, which are never mixed. The dashboard holds the product's real properties, the Hub the settings that work in practice: a difference is shown in blue and is information, not an error. The respiration measured in the Hub is stored with each product and drives its curve from {B.HUB_RR_MIN_TEMPS} temperatures on.</p>
                                                </div>
                                                <div className="overflow-x-auto">

                                                    <td><FastInput type="number" disabled={r.isAverage} value={r.actCO2} onValue={(v) => handleDatabaseChange(r.productId, 'p1-core-2', `temp${r.temp}_CO2`, v)} /></td>

                                </div>

                        {dbActiveTab === 'trials' && (() => {
                            const allTrials = getFlattenedTrials();
                            const q = trialSearch.toLowerCase().trim();
                            let filtered = allTrials.filter(t => {
                                if (trialFilter && t.target !== trialFilter && !(trialFilter === 'Crate/Box' && /^liner$/i.test(t.target))) return false;
                                // The "All varieties" view filters on its varieties.
                                if (dbProductFilter && t.productId !== dbProductFilter && !(((displayProducts.find(p => p.id === dbProductFilter) || {}).varietyIds) || []).includes(t.productId)) return false;
                                if (q) {
                                    const haystack = [t.name, t.variety, t.target, t.mat, t.filmName, t.company, t.country, t.pdf, t.date, t.temp, t.trans, t.notes].join(' ').toLowerCase();
                                    if (!q.split(/\s+/).every(term => haystack.includes(term))) return false;
                                }
                                return true;
                            });
                            filtered = sortData(filtered, dbSortCol, dbSortDir);

                            return (
                            <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-x-auto custom-scrollbar">
                                <div className="p-3 border-b border-slate-200 bg-slate-50 flex flex-wrap items-center gap-4">
                                    <Filter size={16} className="text-blue-600" />
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Product:</span>
                                        <select className="p-1 border border-slate-200 text-sm rounded-lg outline-none" value={dbProductFilter} onChange={(e) => setDbProductFilter(e.target.value)}>
                                            <option value="">All Products</option>
                                            {String(dbProductFilter).startsWith('avg-') && <option value={dbProductFilter}>{(displayProducts.find(p => p.id === dbProductFilter) || {}).name} - all varieties</option>}
                                            {dbProductList.map(p => <option key={p.id} value={p.id}>{p.name} - {p.variety || 'Base'}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Packaging:</span>
                                        <select className="p-1 border border-slate-200 text-sm rounded-lg outline-none" value={trialFilter} onChange={(e) => setTrialFilter(e.target.value)}>
                                            <option value="">All Types</option>
                                            <option value="Punnet">Punnet (Retail)</option>
                                            <option value="Flowpack">Flowpack (Retail)</option>
                                            <option value="Crate/Box">Crate / Box (Bulk)</option>
                                            <option value="Pallet">Pallet (Bulk)</option>
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-2 flex-1 min-w-[180px] max-w-[360px]">
                                        <FastInput type="text" value={trialSearch} onValue={(v) => setTrialSearch(v)}
                                            placeholder="Search trials — variant, film, company, date, product..."
                                            className="w-full p-1.5 px-3 border border-slate-200 text-sm rounded-lg outline-none focus:border-[#084BCD] focus:ring-1 focus:ring-[#084BCD]"/>
                                        {trialSearch && <button onClick={() => setTrialSearch('')} className="text-slate-400 hover:text-slate-700 shrink-0"><X size={14}/></button>}
                                    </div>
                                    <span className="ml-auto text-xs text-slate-500/60 font-medium">{filtered.length} results</span>
                                </div>
                                <table className="w-full text-left border-collapse excel-table min-w-[1500px]">
                                    <thead>
                                        <tr>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('name')}>Product{dbSortIcon('name')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('variety')}>Variety{dbSortIcon('variety')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('target')}>Packaging{dbSortIcon('target')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('mat')}>Variant{dbSortIcon('mat')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('filmName')}>Film{dbSortIcon('filmName')}</th>
                                            <th title="Reference (control) or PerfoTec variant. Automatic reads it from the name.">Role</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('temp')}>Temp{dbSortIcon('temp')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('weight')}>Weight{dbSortIcon('weight')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('trans')}>TV{dbSortIcon('trans')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('o2')}>O2{dbSortIcon('o2')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('co2')}>CO2{dbSortIcon('co2')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('perf')} title="How the pack was perforated">Perforation{dbSortIcon('perf')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('startO2')} title="O₂ in the pack at packing (P+0)">Start O2{dbSortIcon('startO2')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('startCO2')} title="CO₂ in the pack at packing (P+0)">Start CO2{dbSortIcon('startCO2')}</th>
                                            <th title={`Read from the gas at packing: O₂ below ${FLUSH_O2_BELOW} % and/or CO₂ above ${FLUSH_CO2_ABOVE} % is a gas flush. The system is the only part to pick.`}>Gas flush</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('company')}>Company{dbSortIcon('company')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('country')}>Country{dbSortIcon('country')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('days')}>Days{dbSortIcon('days')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('rating')}>Rating{dbSortIcon('rating')}</th>
                                            <th className="cursor-pointer select-none" onClick={() => handleDbSort('date')}>Trial Date{dbSortIcon('date')}</th>
                                            <th>Report</th>
                                            <th className="w-[64px]"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {/* The first rows at once, the rest as the list is scrolled
                                            to its end: every row is ~20 live fields, and building
                                            all of a full database (27,000 elements) froze the tab
                                            for seconds. Keys are the row itself — with its place
                                            in the filtered list in the key, every search rebuilt
                                            every row. */}
                                        {filtered.slice(0, dbTrialLimit).map((t) => (
                                            <tr key={`${t.productId}-${t.idx}`} className={t.isAverage ? 'bg-blue-50' : 'hover:bg-slate-50'}>
                                                <td className="p-2 px-3 font-medium text-xs whitespace-nowrap">{t.name} - {t.state === 'whole' ? 'Whole' : 'Processed'} {t.isAverage && <span className="ml-2 px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded text-[9px]">AVG</span>}</td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.variety || ''} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_variety`, v)} placeholder="Variety" /></td>
                                                <td>
                                                    <select disabled={t.isAverage} value={t.target} onChange={e => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_type`, e.target.value)}>
                                                        <option value=""></option><option value="Punnet">Punnet</option><option value="Flowpack">Flowpack</option><option value="Crate/Box">Crate/Box</option><option value="Pallet">Pallet</option>
                                                    </select>
                                                </td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.mat} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_material`, v)} placeholder="Variant name" /></td>
                                                <td><FilmSelect disabled={t.isAverage} value={t.film} films={filmReg ? filmReg.films : null} type={t.target} onChange={v => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_film`, v)} className="text-xs"/></td>
                                                <td><TrialRoleSelect disabled={t.isAverage} value={t.role} material={t.mat} onChange={v => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_role`, v)} className="font-bold text-xs"/></td>
                                                <td><FastInput type="number" disabled={t.isAverage} value={t.temp} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_temp`, v)} /></td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.weight} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_weight`, v)} /></td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.trans} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_trans`, v)} /></td>
                                                <td><FastInput type="number" step="0.1" disabled={t.isAverage} value={t.o2} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_o2`, v)} /></td>
                                                                                                 <td><FastInput type="number" step="0.1" disabled={t.isAverage} value={t.co2} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_co2`, v)} /></td>
                                                 <td><select disabled={t.isAverage} value={t.perf} onChange={(e) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_perf`, e.target.value)}><option value="">—</option><option value="perfotec">PerfoTec laser</option><option value="other">Other</option><option value="none">None</option></select></td>
                                                 <td><FastInput type="number" step="0.1" disabled={t.isAverage} value={t.startO2} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_startO2`, v)} /></td>
                                                 <td><FastInput type="number" step="0.1" disabled={t.isAverage} value={t.startCO2} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_startCO2`, v)} /></td>
                                                 <td className="whitespace-nowrap">{(() => { const fl = flushInfo(t.flush, t.startO2, t.startCO2); return (<>
                                                     <span className={`text-[10px] font-bold uppercase px-1.5 py-0.5 rounded mr-1 ${fl.applied === true ? 'bg-[#084BCD]/10 text-[#084BCD]' : fl.applied === false ? 'bg-slate-200 text-slate-600' : 'text-slate-300'}`}>{fl.applied === true ? 'Yes' : fl.applied === false ? 'No' : '?'}</span>
                                                     <select disabled={t.isAverage} value={t.flush} title="Flush system" onChange={(e) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_flush`, e.target.value)}><option value="">system —</option><option value="o2control">O2 Control</option><option value="other">Other</option><option value="none">None</option></select>
                                                 </>); })()}</td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.company} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_company`, v)} placeholder="Company" /></td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.country} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_country`, v)} placeholder="Country" /></td>
                                                <td><FastInput type="number" disabled={t.isAverage} value={t.days} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_days`, v)} /></td>
                                                <td><FastInput type="number" step="0.1" min="0" max="10" disabled={t.isAverage} value={t.rating} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_rating`, v)} placeholder="1-10" /></td>
                                                <td><FastInput type="date" disabled={t.isAverage} value={t.date} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_date`, v)} /></td>
                                                <td><FastInput type="text" disabled={t.isAverage} value={t.pdf} onValue={(v) => handleDatabaseChange(t.productId, 'p2-pack-master', `pack_opt_${t.idx}_pdf`, v)} className="text-blue-600" placeholder="URL / File" /></td>
                                                <td className="p-0 text-center">
                                                    <div className="flex items-center justify-center">
                                                        {t.notes && <span className="p-1.5 text-[#084BCD] cursor-help" title={t.notes}><StickyNote size={13}/></span>}
                                                        {!t.isAverage && <button onClick={() => handleDeleteTrialRow(t.productId, t.idx)} className="p-1.5 text-slate-500/40 hover:text-red-600 transition-colors" title="Delete trial"><Trash2 size={14}/></button>}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {filtered.length > dbTrialLimit && (
                                    <LoadMore onMore={() => setDbTrialLimit(n => n + DB_TRIAL_PAGE)}>
                                        Showing {dbTrialLimit} of {filtered.length} trials —
                                        <button onClick={() => setDbTrialLimit(n => n + DB_TRIAL_PAGE)} className="ml-1 font-bold text-[#084BCD] hover:underline">show {Math.min(DB_TRIAL_PAGE, filtered.length - dbTrialLimit)} more</button>
                                        <span className="mx-1">·</span>
                                        <button onClick={() => setDbTrialLimit(filtered.length)} className="font-bold text-[#084BCD] hover:underline">show all</button>
                                    </LoadMore>
                                )}
                                <div className="p-4 bg-slate-50 border-t border-slate-200">
                                    <div className="flex items-center gap-4">
                                        <select className="p-2 border outline-none text-sm" id="trial-add-select">
                                            <option value="">Select product for new trial...</option>
                                            {products.map(p => <option key={p.id} value={p.id}>{p.name} - {p.state === 'whole' ? 'Whole' : 'Processed'} ({p.variety || 'Base'})</option>)}
                                        </select>
                                        <button onClick={() => {const id=document.getElementById('trial-add-select').value; if(id) handleAddDatabaseRow(id, 'p2-trial');}} className="bg-blue-600 text-white px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg hover:bg-blue-700">Add Trial Row</button>
                                    </div>
                                </div>
                            </div>
                            );
                        })()}
                    </div>
                );
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-100 text-blue-600"><Loader2 className="animate-spin" size={48} /></div>;

            // ── Shared-folder gate ────────────────────────────────────────────
            // Same folder, same prompts as the Project Board: one database for
            // projects and products. Only shown when Firestore is not in play.
            const FolderGate = ({ icon: Icon, color, title, desc, children }) => (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
                        <div className="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5" style={{ backgroundColor: color + '15', color }}>
                            <Icon size={32} />
                        </div>
                        <h2 className="text-xl font-bold font-spartan mb-2 text-slate-900">{title}</h2>
                        <p className="text-slate-500 text-sm leading-relaxed mb-6">{desc}</p>
                        {children}
                        {/* These gate screens render INSTEAD of the header, so the header's
                            Board button is not on the page yet. Without this the first-run
                            dashboard has no way back — which is exactly the gap the old
                            floating bar used to cover. Nothing is loaded here, so there is
                            nothing to flush: a plain link is enough. */}
                        <a href="board.html" className="mt-6 inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors" title="Back to the Project Board">
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                            Board
                        </a>
                    </div>
                </div>
            );

            if (!db && folderState === 'unsupported' && !viewWithoutFolder) return (
                <FolderGate icon={AlertCircle} color="#EA580C" title="This browser cannot open the shared database"
                    desc="The dashboard reads and writes the PerfoTec database folder directly. That needs Microsoft Edge or Google Chrome on a computer; Firefox, Safari and phone browsers cannot. Open this page in Edge or Chrome. Here you can only look at a backup file, and nothing is saved.">
                    <button onClick={() => setViewWithoutFolder(true)} className="inline-flex items-center gap-2 text-sm font-bold text-slate-600 px-5 py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50">
                        View a backup file instead
                    </button>
                </FolderGate>
            );

            if (!db && folderState === 'no-folder') return (
                <FolderGate icon={FolderOpen} color="#008837" title="Choose the PerfoTec database folder"
                    desc="Products and projects share one folder. Pick the same folder the Project Board uses — the dashboard then remembers it, so you never have to open a database file again.">
                    <button onClick={chooseSharedFolder} className="inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-lg" style={{ backgroundColor: '#008837' }}>
                        <FolderOpen size={16} /> Choose folder
                    </button>
                </FolderGate>
            );

            if (!db && folderState === 'needs-permission') return (
                <FolderGate icon={FolderOpen} color="#084BCD" title="Allow access to the database folder"
                    desc={`The browser needs your confirmation before it may read and write "${folderName || 'the database folder'}" again in this session.`}>
                    <div className="flex flex-col gap-2 items-center">
                        <button onClick={grantSharedFolderAccess} className="inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-lg" style={{ backgroundColor: '#084BCD' }}>
                            <Check size={16} /> Allow access
                        </button>
                        <button onClick={chooseSharedFolder} className="text-xs font-bold text-slate-500 hover:text-slate-700">Choose another folder</button>
                    </div>
                </FolderGate>
            );

            // First run in a folder that has never held products: bring the old
            // single-file database across. The source file is only read.
            if (!db && folderState === 'ready' && needsProductMigration) return (
                <FolderGate icon={Database} color="#084BCD" title="Bring your product database across"
                    desc={`"${folderName}" does not hold any products yet. Select your existing PerfoTec_Database.json once and its products move into this folder, next to the board's projects. The file itself is left untouched as a backup.`}>
                    <div className="flex flex-col gap-3 items-center">
                        <button onClick={pickDatabaseFileToMigrate} disabled={migrateMsg === 'working'}
                            className="inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-lg disabled:opacity-60" style={{ backgroundColor: '#084BCD' }}>
                            {migrateMsg === 'working' ? <Loader2 size={16} className="animate-spin" /> : <Upload size={16} />}
                            {migrateMsg === 'working' ? 'Importing…' : 'Select database file'}
                        </button>
                        <input id="migrate-upload" type="file" accept=".json,application/json" className="hidden"
                            onClick={e => { e.target.value = null; }}
                            onChange={e => migrateDatabaseFile(e.target.files?.[0])} />
                        {migrateMsg === 'empty' && <span className="text-xs font-bold text-amber-600">No products found in that file.</span>}
                        {migrateMsg === 'error' && <span className="text-xs font-bold text-red-600">Could not read that file — check that it is a PerfoTec database export.</span>}
                        <button onClick={() => setNeedsProductMigration(false)} className="text-xs font-bold text-slate-500 hover:text-slate-700">
                            Start empty instead
                        </button>
                    </div>
                </FolderGate>
            );

            return (
                <div className="min-h-screen pf-web font-sans antialiased selection:bg-blue-200 selection:text-blue-900 text-slate-800">

                    {overviewDoc && <CommercialOverviewModal doc={overviewDoc} onClose={() => setOverviewDoc(null)} />}
                    {filmEdit && <FilmEditorModal film={filmEdit.film} nameTaken={filmNameTaken} onClose={() => setFilmEdit(null)} onSave={(f) => saveFilm(f, filmEdit.row)} />}

                    {/* DATA-INTEGRITY BANNERS
                        Everything here exists because the alternative is silence.
                        A lost edit that nobody is told about is indistinguishable
                        from one that never happened. */}
                    {productConflicts.length > 0 && (
                        <div className="sticky top-0 z-[90] bg-red-50 border-b-2 border-red-500 px-4 py-3">
                            <div className="max-w-6xl mx-auto flex flex-col gap-2">
                                <div className="flex items-start gap-2 text-red-800">
                                    <AlertCircle size={18} className="shrink-0 mt-0.5" />
                                    <p className="text-sm font-bold">
                                        {productConflicts.length === 1 ? 'A product was changed by someone else' : `${productConflicts.length} products were changed by someone else`} while you had them open.
                                        Your version is kept in the <span className="font-mono">_conflicts</span> folder — nothing was thrown away. "Keep mine" parks their version there too, and keeps trials the board added to theirs.
                                    </p>
                                </div>
                                {productConflicts.map(c => {
                                    const who = (c.theirs && c.theirs.updatedBy) || 'someone else';
                                    const when = c.theirs && c.theirs.updatedAt ? new Date(c.theirs.updatedAt).toLocaleString() : '';
                                    return (
                                        <div key={c.productId} className="flex flex-wrap items-center gap-2 pl-6 text-sm text-red-900">
                                            <span className="font-bold">{(c.mine && c.mine.name) || c.productId}</span>
                                            <span className="text-red-700">— saved by {who}{when && ` at ${when}`}.</span>
                                            <button onClick={() => takeTheirVersion(c.productId)}
                                                className="px-3 py-1 rounded-lg text-xs font-bold text-white bg-red-600 hover:bg-red-700">
                                                Load their version
                                            </button>
                                            <button onClick={() => keepMyVersion(c.productId)}
                                                className="px-3 py-1 rounded-lg text-xs font-bold text-red-700 border border-red-300 bg-white hover:bg-red-50">
                                                Keep mine
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                                {audience && <button type="button" onClick={() => setShowAudience(false)} className="mt-5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-900">Cancel</button>}
                            </div>
                        </div>
                    )}
                    {showOverview ? renderOverviewPage() : globalPage === 'database' && !isCommercial ? renderDatabasePage() : (<>
                    {/* Solid blue feature panel. The gradient, the dot-pattern
                        overlay and the blurred colour glow that used to sit here
                        were all retired by brand v2.0, and nothing else in the
                        workflow carries an effect like them. */}
                    <div className="pf-hero text-white relative overflow-hidden py-12">
                        <div className="max-w-[1600px] w-full mx-auto px-6 relative z-10">
                            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-8">
                                <div className="md:w-2/3">
                                    <div className="flex flex-wrap gap-3 mb-6">
                                        {activeProduct?.state && (
                                            <div className={`pf-web-chip is-state ${activeProduct.state === 'processed' ? 'is-blue' : 'is-green'}`}>
                                                <span className="flex items-center gap-2">
                                                    <Cpu size={14} className={activeProduct.state === 'processed' ? 'block' : 'hidden'}/>
                                                    <Leaf size={14} className={activeProduct.state === 'whole' ? 'block' : 'hidden'}/>
                                                    {activeProduct.state === 'whole' ? 'Whole' : 'Processed'} Product
                                                </span>
                                            </div>
                                        )}
                                        {safeTargets.map(t => (
                                            <div key={t} className="pf-web-chip">
                                                <span className="flex items-center gap-1.5"><TargetIcon target={t} size={12}/>{formatTargetName(t)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <h2 className="text-3xl md:text-5xl font-spartan font-extrabold mb-4 tracking-tight leading-[1.08] text-white">
                                        {activeProduct ? `${activeProduct.name} — ${activeProduct.state === 'whole' ? 'Whole' : 'Processed'}` : 'No Product Selected'}
                                        {activeProduct && !activeProduct.isAverage && activeProduct.variety ? <span className="text-white/60 font-bold text-2xl md:text-3xl"> · {activeProduct.variety}</span> : ''} <br/>
                                        {/* One tint for both states. The guide forbids green
                                            type on blue outright, and the state is already said
                                            twice above — in the badge and in the heading itself —
                                            so colour-coding this line carried nothing. */}
                                        <span className="pf-web-accent-dark">{shownTab === 'dashboard' ? 'Product Dashboard.' : shownTab === 'commercial' ? 'Commercial Package.' : 'Verification & Data.'}</span>
                                    </h2>
                                    {/* The trade names this product also goes by. Read-only here on
                                        purpose: the heading above is the name this product is known
                                        by in the dashboard, and these only ever help you find it.
                                        They are edited in Database → Product Properties. */}
                                    {activeProduct && aliasesOf(activeProduct).length > 0 && (
                                        <p className="-mt-2 mb-4 text-sm text-white/70 flex flex-wrap items-center gap-x-2 gap-y-1">
                                            <span className="font-spartan font-bold uppercase tracking-widest text-[10px] text-[#7FB2FF]">Also known as</span>
                                            {aliasesOf(activeProduct).map(a => (
                                                <span key={a} className="px-2 py-0.5 bg-white/10 border border-white/20 rounded-full text-[11px] font-medium">{a}</span>
                                            ))}
                                        </p>
                                    )}
                                    <div className="flex items-center gap-4 mt-6 text-sm font-spartan uppercase tracking-widest">
                                        <span className="text-[#7FB2FF] text-xs">Verification</span>
                                        <div className="flex-1 max-w-[250px] h-2 bg-white/10 rounded-full overflow-hidden">
                                            <div className="h-full rounded-full transition-all duration-700 relative pf-web-progress" style={{width: `${calculateOverallProgress()}%`}}></div>
                                        </div>
                                        <span className="font-bold text-white text-lg">{calculateOverallProgress()}%</span>
                                    </div>
                                </div>

                                {/* Product picture — the same image the board's products
                                    view shows. Read-only on the "All varieties" aggregate,
                                    which is a computed overview and owns no data. */}
                                {activeProduct && (
                                    <div className="md:w-1/3 w-full flex md:justify-end">
                                        <div className="relative group w-full max-w-[260px] aspect-square overflow-hidden pf-web-media">
                                            {activeProduct.imageUrl ? (
                                                <img src={activeProduct.imageUrl} alt={activeProduct.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="w-full h-full flex flex-col items-center justify-center text-white/50 gap-2">
                                                    <ImageIcon size={40} />
                                                    <span className="font-spartan font-bold uppercase tracking-widest text-[10px]">No picture</span>
                                                </div>
                                            )}
                                            {!activeProduct.isAverage && (
                                                <div className="absolute inset-0 flex items-center justify-center gap-2 bg-slate-900/70 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                                                    <label className="cursor-pointer flex items-center gap-1.5 text-[11px] font-bold font-spartan uppercase tracking-widest bg-white text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100">
                                                        <Upload size={13} />{activeProduct.imageUrl ? 'Replace' : 'Add picture'}
                                                        <input type="file" accept="image/*" className="hidden" onChange={handleProductImageUpload} />
                                                    </label>
                                                    {activeProduct.imageUrl && (
                                                        <button onClick={removeProductImage}
                                                            className="flex items-center gap-1.5 text-[11px] font-bold font-spartan uppercase tracking-widest bg-white/15 text-white px-3 py-2 rounded-lg hover:bg-white/25 border border-white/30">
                                                            <Trash2 size={13} />Remove
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <main className="max-w-[1600px] w-full mx-auto px-6 py-10 relative z-20">
                        {!activeProduct ? (
                            <div className="bg-white p-16 text-center border border-slate-200 shadow-sm rounded-xl">
                                <Target size={64} className="mx-auto text-slate-200 mb-6" />
                                <h3 className="text-2xl font-spartan font-bold text-slate-900">No Data Available</h3>
                                <p className="text-slate-500 mt-2 max-w-md mx-auto">Upload a new product data sheet via the navigation bar to generate the dashboard and GTM pipeline.</p>
                                <button onClick={() => { resetModal(); setShowCreateModal(true); }} className="mt-8 bg-blue-600 text-white px-8 py-3 font-spartan font-bold uppercase tracking-widest rounded-lg inline-block hover:bg-blue-700 transition-colors shadow-lg"><span className="block shape-80deg-reverse flex items-center gap-2"><UploadCloud size={18}/> Data Import</span></button>
                            </div>
                        ) : (
                            <div className="flex flex-col relative">
                                {/* The tabs live here, under the hero, at every width. They used to
                                    sit in the header on wide screens too, where they squeezed the
                                    product picker until its label ran into the search button. */}
                                {/* Sticky under the masthead (wide screens), so a tab is one click
                                    away from anywhere on the page. */}
                                <TabBar active={shownTab} onSelect={setActiveTab} tabs={isCommercial ? TABS.filter(t => t[0] !== 'pipeline') : TABS}/>

                                {shownTab === 'dashboard' && <PanelBoundary name="Dashboard" resetKey={'d|' + activeProductId}><RenderPanel render={renderDashboardTab}/></PanelBoundary>}
                                {shownTab === 'commercial' && <PanelBoundary name="Commercial" resetKey={'c|' + activeProductId}><RenderPanel render={renderCommercialTab}/></PanelBoundary>}

                                {shownTab === 'pipeline' && <PanelBoundary name="Workflow" resetKey={'w|' + activeProductId}><RenderPanel render={renderWorkflowTab}/></PanelBoundary>}
                            </div>
                        )}
                    </main>
                    </>)}
                </div>
            );
        }

        // A render error used to take the whole page to white — on top of a live
        // autosave, with no way to tell whether the last edit reached disk. React
        // unmounts the tree on an uncaught error, so without this the user is left
        // with nothing to read and nothing to click.
        // One tab that fails to draw (a value the code did not expect in one
        // product) shows a note in its place; the header, the other tabs and the
        // saving keep working. It resets when the product or the tab changes.
        class PanelBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null, key: props.resetKey }; }
            static getDerivedStateFromError(error) { return { error }; }
            static getDerivedStateFromProps(props, state) { return props.resetKey !== state.key ? { error: null, key: props.resetKey } : null; }
            componentDidCatch(error, info) { console.error('Dashboard panel "' + this.props.name + '" crashed:', error, info); }
            render() {
                if (!this.state.error) return this.props.children;
                return (
                    <div className="bg-white border border-red-200 border-l-4 border-l-red-500 rounded-xl p-6 my-4">
                        <p className="font-bold text-slate-900 mb-1">The {this.props.name} tab could not be drawn for this product</p>
                        <p className="text-sm text-slate-600 mb-3">The other tabs work, and the data is safe in the database folder. Switch product or tab, or try again.</p>
                        <pre className="text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-auto max-h-32 text-slate-700">{String(this.state.error && (this.state.error.message || this.state.error))}</pre>
                        <button onClick={() => this.setState({ error: null })} className="mt-3 px-4 py-2 rounded-lg text-sm font-bold text-white" style={{ backgroundColor: '#084BCD' }}>Try again</button>
                    </div>
                );
            }
        }
        // Calls a render function inside its own component, so a PanelBoundary
        // around it catches what it throws (an inline call throws in App itself).
        const RenderPanel = ({ render }) => render();

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) { console.error('Dashboard crashed:', error, info); }
            render() {
                if (!this.state.error) return this.props.children;
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6 font-sans">
                        <div className="bg-white rounded-2xl shadow-xl border-t-8 border-red-500 max-w-lg w-full p-8">
                            <h1 className="text-xl font-bold text-slate-900 mb-2">The dashboard stopped</h1>
                            <p className="text-sm text-slate-600 mb-4">
                                Something went wrong while drawing the page. Your data is in the database folder, not in this
                                tab — but anything typed in the last few seconds may not have been saved yet. Reload, then check
                                the product you were working on.
                            </p>
                            <pre className="text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-auto max-h-40 text-slate-700">
                                {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
                            </pre>
                            <div className="flex gap-2 mt-4">
                                <button onClick={() => window.location.reload()}
                                    className="px-4 py-2 rounded-lg text-sm font-bold text-white" style={{ backgroundColor: '#008837' }}>
                                    Reload
                                </button>
                                <button onClick={() => window.PerfoTecBoard && window.PerfoTecBoard.goToBoard && window.PerfoTecBoard.goToBoard()}
                                    className="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 border border-slate-300">
                                    Back to board
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
    <script>
        // Compile once, keep the result. Opened from the folder, this page was
        // compiled by Babel in the browser on EVERY load — 3–5 s on a laptop plus
        // a 3 MB download — while the published copy is compiled ahead of time
        // (publish.mjs). Now the compiled code is kept in IndexedDB under a hash
        // of the source: the next load runs it at once and does not even fetch
        // Babel. Any edit to the source gives another hash, so an old copy never
        // runs. In a published page the JSX is already compiled and this does
        // nothing.
        (function () {
            var el = document.querySelector('script[type="text/babel"][data-cache]');
            if (!el) return;
            var name = el.getAttribute('data-cache');
            el.type = 'text/x-jsx-source';
            var src = el.textContent;
            var h = 0x811c9dc5;
            for (var i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193); }
            var key = name + ':' + src.length + ':' + (h >>> 0).toString(36);
            var BABEL = 'https://unpkg.com/@babel/standalone@7.29.10/babel.min.js';
            var run = function (code) {
                var s = document.createElement('script');
                s.type = 'module';
                s.textContent = code + '\n//# sourceURL=' + name + '.jsx';
                document.body.appendChild(s);
            };
            var say = function (msg) { var n = document.querySelector('.pf-loading-note'); if (n) n.textContent = msg; };
            var compile = function (db) {
                var go = function () {
                    var code;
                    try {
                        code = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], sourceType: 'module', comments: false }).code;
                    } catch (e) { say('The dashboard could not be compiled: ' + e.message); throw e; }
                    if (db) {
                        try {
                            var store = db.transaction('pages', 'readwrite').objectStore('pages');
                            // One copy per page: older ones go.
                            store.openCursor().onsuccess = function (ev) {
                                var c = ev.target.result;
                                if (!c) return;
                                if (String(c.key).indexOf(name + ':') === 0 && c.key !== key) c.delete();
                                c.continue();
                            };
                            store.put(code, key);
                        } catch (e) { /* not kept: compiled again next time */ }
                    }
                    run(code);
                };
                if (window.Babel) return go();
                say('Preparing the dashboard (first start after an update)…');
                var s = document.createElement('script');
                s.src = BABEL;
                s.onload = go;
                s.onerror = function () { say('The page compiler (unpkg.com) could not be loaded. Check the internet connection and reload the page.'); };
                document.head.appendChild(s);
            };
            try {
                var req = indexedDB.open('perfotec-compiled-pages', 1);
                req.onupgradeneeded = function () { req.result.createObjectStore('pages'); };
                req.onerror = function () { compile(null); };
                req.onsuccess = function () {
                    var db = req.result;
                    try {
                        var get = db.transaction('pages').objectStore('pages').get(key);
                        get.onsuccess = function () { if (typeof get.result === 'string') run(get.result); else compile(db); };
                        get.onerror = function () { compile(db); };
                    } catch (e) { compile(db); }
                };
            } catch (e) { compile(null); }
        })();
    </script>
</body>
</html>
