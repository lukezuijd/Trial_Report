                            const acpRaw = String(row['ACP'] || row['O2 ACP'] || "");
                            const critCO2Raw = String(row['Crit CO2'] || row['Critical CO2'] || "");
                            const minTempRaw = String(row['Min Temp'] || row['Critical Temp'] || "");
                            const rhRange = parseExcelRange(row['Target RH'] || row['RH'] || "");
                            let ethyleneClass = "";
                            const ethSens = String(row['Ethylene sensitivity'] || row['Ethylene'] || "").trim();
                            if (/^H$/i.test(ethSens) || /high/i.test(ethSens)) ethyleneClass = "Type 1: Sensitive (Low prod / High sens.)";
                            else if (/^M$/i.test(ethSens) || /climacteric|medium/i.test(ethSens)) ethyleneClass = "Type 2: Climacteric (High prod / High sens.)";
                            else if (/^L$/i.test(ethSens) || /low|non/i.test(ethSens)) ethyleneClass = "Type 3: Non-Climacteric (Low prod / Low sens.)";
                            else if (ethSens) ethyleneClass = ethSens;
                            const rrData = {};
                            const rrTemp = parseFloat(row['RR Temperature'] || row['RR Temp'] || "");
                            if (!isNaN(rrTemp)) {
                                const o2Avg = parseFloat(row['RRO2 average'] || row['RR O2'] || "");
                                const co2Avg = parseFloat(row['RRCo2 average'] || row['RR CO2'] || "");
                                if (!isNaN(o2Avg)) rrData[`target_temp${rrTemp}_O2`] = o2Avg.toFixed(1);
                                if (!isNaN(co2Avg)) rrData[`target_temp${rrTemp}_CO2`] = co2Avg.toFixed(1);
                            }
                            const parsedData = {
                                'p1-core-1': { acp: acpRaw, minTemp: minTempRaw || tempRange.min, critCO2: critCO2Raw, rq: "1.0", q10: "", ethyleneClass, vpdSensitivity: row['VPD Sensitivity'] || "Medium" },
                                'p1-core-2': { ...rrData },
                                'p1-core-3': { targetO2Min: o2Range.min, targetO2Max: o2Range.max, targetCO2Min: co2Range.min, targetCO2Max: co2Range.max, storageTempMin: tempRange.min, storageTempMax: tempRange.max, targetRHMin: rhRange.min || "", targetRHMax: rhRange.max || "" },
                                'p1-core-4': { primaryThreat: "Discoloration / Browning", secondaryThreat: "None", condensationRisk: "Medium", defectCount: 7 }
                            };
                            Object.values(parsedData).forEach(task => { totalPoints += Object.keys(task).length; });
                            extractedProducts.push({ name, variety, state: "whole", targets: ['retail', 'liner', 'pallet'], imageUrl: "", completedTaskIds: [], links: {}, createdAt: new Date().toISOString(), formData: parsedData });
                        });

                        if (extractedProducts.length > 0) {
                            setBulkProductsData(extractedProducts); setIsBulkImport(true); setIsBackupRestore(false); setParsedItemCount(totalPoints); setImportStatus('success');
                        } else throw new Error("No products found. If this is a trial results sheet, check that it has 'Product' and 'TV' columns.");
                        return;
                    }

                    if (fileExt === 'docx') {
                        const buffer = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsArrayBuffer(file); });
                        if (!window.mammoth) throw new Error("Mammoth library not loaded");
                        const result = await mammoth.extractRawText({arrayBuffer: buffer});
                        const { product, points } = extractProductDataFromText(result.value, file.name);

                        setNewProductData({ name: product.name, variety: product.variety, state: product.state, targets: product.targets, imageUrl: product.imageUrl, completedTaskIds: [], links: {}, createdAt: null });
                        setImportedFormData(product.formData); setIsBulkImport(false); setIsBackupRestore(false); setParsedItemCount(points); setImportStatus('success');

                        const cleanPName = product.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                        setProducts(prevProducts => {
                            const match = prevProducts.find(p => {
                                const cleanExisting = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                                return p.state === product.state && (cleanExisting.includes(cleanPName) || cleanPName.includes(cleanExisting));
                            });
                            setMergeTargetId(match ? match.id : "new");
                            return prevProducts;
                        });
                        return;
                    }

                    const text = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsText(file); });
                    const { product, points } = extractProductDataFromText(text, file.name);
                    
                    setNewProductData({ name: product.name, variety: product.variety, state: product.state, targets: product.targets, imageUrl: product.imageUrl, completedTaskIds: [], links: {}, createdAt: null });
                    setImportedFormData(product.formData); setIsBulkImport(false); setIsBackupRestore(false); setParsedItemCount(points); setImportStatus('success');

                    const cleanPName = product.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                    setProducts(prevProducts => {
                        const match = prevProducts.find(p => {
                            const cleanExisting = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                            return p.state === product.state && (cleanExisting.includes(cleanPName) || cleanPName.includes(cleanExisting));
                        });
                        setMergeTargetId(match ? match.id : "new");
                        return prevProducts;
                    });

                } catch (err) { 
                    console.error("Error processing file", err); 
                    setImportStatus('idle'); 
                    alert("Error loading file: " + err.message); 
                }
            };

            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
            const handleDrop = (e) => {
                e.preventDefault(); setIsDragging(false);
                if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
                const file = e.dataTransfer.files[0];
                // For dropped .json databases, also capture a writable handle (Chromium)
                // so autosave can write back to the source file.
                const item = e.dataTransfer.items && e.dataTransfer.items[0];
                if (file.name.endsWith('.json') && item && item.getAsFileSystemHandle) {
                    item.getAsFileSystemHandle().then(h => {
                        if (h && h.kind === 'file') setDbFileHandle(h);
                    }).catch(() => {});
                }
                processDataSheet(file);
            };
            const handleFileInputChange = (e) => { if (e.target.files && e.target.files.length > 0) processDataSheet(e.target.files[0]); };

            const handleOpenFilePicker = async () => {
                if (window.showOpenFilePicker) {
                    try {
                        const [fileHandle] = await window.showOpenFilePicker({
                            types: [
                                { description: 'Database Files', accept: { 'application/json': ['.json'], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'], 'application/vnd.ms-excel': ['.xls'], 'text/csv': ['.csv'] } }
                            ],
                            multiple: false
                        });
                        const file = await fileHandle.getFile();
                        if (file.name.endsWith('.json')) {
                            // Ask for write permission right away (still within the user gesture)
                            // so autosave can write back to this file without further prompts.
                            try { await fileHandle.requestPermission({ mode: 'readwrite' }); } catch (permErr) { console.warn(permErr); }
                            setDbFileHandle(fileHandle);
                        }
                        processDataSheet(file);
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error(err);
                            document.getElementById('db-upload').click();
                        }
                    }
                } else {
                    document.getElementById('db-upload').click();
                }
            };

            const handleGenerateFromImport = async () => {
                if (importStatus !== 'success') return;
                
                if (isBulkImport) {
                    const newProductsList = [];
                    for (const prod of bulkProductsData) {
                        const baseId = `${prod.name}-${prod.variety || 'base'}-${prod.state}`.toLowerCase().replace(/[^a-z0-9]/g, '-');
                        const existing = products.find(p => p.name.toLowerCase() === prod.name.trim().toLowerCase() && p.state === prod.state);
                        
                        if (existing) {
                            const mergedFormData = { ...existing.formData };
                            for (const key in prod.formData) { mergedFormData[key] = { ...(existing.formData[key] || {}), ...prod.formData[key] }; }
                            const mergedDoc = { ...existing, targets: Array.from(new Set([...existing.targets, ...prod.targets])), formData: mergedFormData };
                            newProductsList.push(mergedDoc);
                            if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', existing.id), mergedDoc);
                        } else {
                            const productDoc = { id: baseId, ...prod };
                            newProductsList.push(productDoc);
                            if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', baseId), productDoc);
                        }
                    }
                    if (!db) {
                        setProducts(prev => {
                            const map = new Map(); prev.forEach(p => map.set(p.id, p));
                            newProductsList.forEach(p => map.set(p.id, p)); return Array.from(map.values());
                        });
                    }
                    setLoadedDataId(null); resetModal(); 
                    if (newProductsList.length > 0) {
                        setActiveProductId(newProductsList[0].id);
                        setActiveTab('dashboard');
                    }
                    return;
                }

                if (mergeTargetId !== "new") {
                    const existing = products.find(p => p.id === mergeTargetId);
                    if (existing) {
                        const conflicts = detectConflicts(existing.formData, importedFormData);
                        if (conflicts.length > 0) {
                            setMergeConflictPending({ type: 'import', targetId: existing.id, sourceFD: importedFormData, newProdData: newProductData });
                            setConflictChoices({});
                            return;
                        }
                        const mergedFormData = buildMergedFD(existing.formData, importedFormData, {});
                        const mergedDoc = { ...existing, imageUrl: newProductData.imageUrl || existing.imageUrl, targets: Array.from(new Set([...existing.targets, ...newProductData.targets])), formData: mergedFormData };
                        if (db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', existing.id), mergedDoc);
                        else setProducts(prev => prev.map(p => p.id === existing.id ? mergedDoc : p));
                        setLoadedDataId(null); resetModal(); setActiveProductId(existing.id); setActiveStepId(1); setActiveTab('pipeline');
                        return;
                    }
                }
                const baseId = `${newProductData.name}-${newProductData.variety || 'base'}-${newProductData.state}`.toLowerCase().replace(/[^a-z0-9]/g, '-');
                const finalId = products.some(p => p.id === baseId) ? `${baseId}-${Date.now()}` : baseId;
                
                const newProduct = {
                    id: finalId, name: newProductData.name.trim(), variety: newProductData.variety.trim(), state: newProductData.state,
                    targets: newProductData.targets, imageUrl: newProductData.imageUrl.trim(),
                    createdAt: isBackupRestore && newProductData.createdAt ? newProductData.createdAt : new Date().toISOString(),
                    completedTaskIds: isBackupRestore && newProductData.completedTaskIds ? newProductData.completedTaskIds : [], 
                    links: isBackupRestore && newProductData.links ? newProductData.links : {}, formData: importedFormData || {}
                };

                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', finalId), newProduct);
                } else {
                    setProducts(prev => [...prev, newProduct]);
                }
                
                setLoadedDataId(null); resetModal(); setActiveProductId(finalId); setActiveStepId(1); setActiveTab('pipeline');
            };

            // Inline trial import — used directly in Phase 02 pack-opt-master form
            // Import one or more trial JSON files (report.html exports or legacy flat arrays)
            // into the active product. Multiple files are processed as one batch: shared
            // duplicate detection, fill-if-empty baseline updates across all files, one write.
            // Core trial importer: takes an array of File objects and imports
            // their rows into the active product. Shared by the file-picker
            // button (handleInlineTrialJSON) and the Project Board auto-import.
            const importTrialFiles = async (files) => {
                // The "All varieties" aggregate is a read-only overview — trials must be imported
                // into a specific variety so the data has a real home.
                if (activeProduct?.isAverage) {
                    setInlineTrialMsg('⚠ Select a specific variety first (top of the dashboard) — "All varieties" is a read-only overview.');
                    setTimeout(() => setInlineTrialMsg(''), 8000);
                    return;
                }
                if (!files || !files.length) return;
                try {
                    const master = { ...(localFormData['p2-pack-master'] || {}) };
                    let count = parseInt(master.packOptCount) || 0;
                    let importedCount = 0;
                    let skippedCount = 0;
                    let baselineFilled = 0;
                    const wrongProduct = [];
                    const unreadable = [];
                    let fileCount = 0;

                    // Shared helpers for the whole batch
                    const normalize = s => String(s || '').toLowerCase().replace(/[\s\-()\/]+/g, ' ').trim();
                    // Extract numbers from report strings like '1% - 2%', '>15%', '3,0% - 5,0%', '0°C'
                    const nums = s => (String(s || '').replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/g) || []);
                    // Map free-text packaging names onto the table's fixed options (substring match)
                    const mapPackType = (raw) => {
                        const r = String(raw || '').toLowerCase();
                        if (r.includes('pallet')) return 'Pallet';
                        if (r.includes('punnet') || r.includes('tray') || r.includes('clamshell') || r.includes('topseal')) return 'Punnet';
                        if (r.includes('crate') || r.includes('box')) return 'Crate/Box';
                        if (r.includes('flow') || r.includes('bag') || r.includes('liner') || r.includes('pillow') || r.includes('pouch')) return 'Flowpack';
                        return 'Crate/Box';
                    };
                    const fillIfEmpty = (obj, key, val) => {
                        if (val != null && val !== '' && String(obj[key] ?? '').trim() === '') { obj[key] = String(val); return true; }
                        return false;
                    };
                    const activeFull = normalize(activeProduct.name + (activeProduct.variety ? ' ' + activeProduct.variety : ''));
                    const activeBase = normalize(activeProduct.name);

                    // Baseline accumulators: fill-if-empty across ALL files in the batch,
                    // so curated values always win and the first file with a value fills a field.
                    const p1c1 = { ...(localFormData['p1-core-1'] || {}) };
                    const p1c2 = { ...(localFormData['p1-core-2'] || {}) };
                    const p1c3 = { ...(localFormData['p1-core-3'] || {}) };

                    // Duplicate signatures: existing rows + rows added earlier in this batch,
                    // so files can't duplicate the database OR each other.
                    const existingSigs = new Set();
                    for (let i = 0; i < count; i++) {
                        existingSigs.add(`${master['pack_opt_' + i + '_pdf'] || ''}|${master['pack_opt_' + i + '_date'] || ''}|${master['pack_opt_' + i + '_material'] || ''}`.toLowerCase());
                    }

                    for (const file of files) {
                        let parsed;
                        try {
                            parsed = JSON.parse(await file.text());
                        } catch (parseErr) {
                            unreadable.push(file.name);
                            continue;
                        }

                        if (parsed.isPerfoTecReport === true && Array.isArray(parsed.groups)) {
                            // ── Report format: full export from report.html ──
                            const proj = parsed.project || {};
                            // Product match: tolerant of plurals ("Blueberry" vs "Blueberries"),
                            // varieties and word order; the JSON file name counts as evidence too.
                            // Word stems tolerant of English plurals: berries→berry, boxes→box, grapes→grape
                            const stemWords = s => normalize(s).split(' ').map(w => w.replace(/ies$/, 'y').replace(/(es|s)$/, '')).filter(w => w.length >= 3);
                            const activeStems = [...new Set([...stemWords(activeProduct.name), ...stemWords(activeProduct.variety || '')])];
                            const candidateMatches = (candidate) => {
                                const cStems = stemWords(candidate);
                                return cStems.some(c => activeStems.some(a => a === c || a.includes(c) || c.includes(a)));
                            };
                            const typeNorm = normalize(proj.type || '');
                            let isMatch = !proj.productName ||
                                candidateMatches(proj.productName) ||
                                (typeNorm !== '' && candidateMatches(proj.type)) ||
                                candidateMatches(file.name.replace(/\.json$/i, ''));
                            // Manual override: never a dead end — the user can force the link
                            if (!isMatch) {
                                isMatch = window.confirm('"' + file.name + '" is for product "' + (proj.productName || '?') + (proj.type ? ' ' + proj.type : '') + '", but the open product is "' + activeProduct.name + (activeProduct.variety ? ' - ' + activeProduct.variety : '') + '".\n\nImport it into "' + activeProduct.name + '" anyway?');
                            }
                            if (!isMatch) {
                                wrongProduct.push(file.name + ' (' + (proj.productName || '?') + ')');
                                continue;
                            }
                            // Processing-state guard: a Whole trial must not silently land on a Processed product (or vice versa)
                            const projStateRaw = normalize(String(proj.processingType || proj.state || ''));
                            const projState = projStateRaw.includes('process') || projStateRaw.includes('cut') ? 'processed' : projStateRaw.includes('whole') ? 'whole' : '';
                            if (projState && activeProduct.state && projState !== activeProduct.state) {
                                const okState = window.confirm('"' + file.name + '" is a ' + projState.toUpperCase() + ' trial, but the open product "' + activeProduct.name + '" is ' + String(activeProduct.state).toUpperCase() + '.\n\nThe processing type does not match. Import anyway?');
                                if (!okState) { wrongProduct.push(file.name + ' (' + projState + ' \u2260 ' + activeProduct.state + ')'); continue; }
                            }
                            fileCount++;
                            // Trial storage temperature = the dominant (most frequent) temperature in the
                            // supply chain stages — NOT proj.tempMin, which is the critical minimum temp.
                            const chainTempCounts = {};
                            (parsed.supplyChain || []).forEach(s => {
                                const v = nums(s.tempStart)[0];
                                if (v != null) chainTempCounts[v] = (chainTempCounts[v] || 0) + 1;
                            });
                            const chainTemp = Object.keys(chainTempCounts).length
                                ? Object.entries(chainTempCounts).sort((a, b) => b[1] - a[1])[0][0]
                                : (nums(proj.rrTemp)[0] || '');
                            const reportDate = String(proj.packingDate || proj.date || '');
                            // Trial Report column: the ORIGINAL source documents the data was extracted
                            // from (so the raw input stays findable), falling back to the report title.
                            // The same value feeds the dedup signature so both stay consistent.
                            const sourceDocs = Array.isArray(proj.sourceDocuments)
                                ? proj.sourceDocuments.filter(Boolean).join('; ')
                                : String(proj.sourceDocuments || '');
                            const reportRef = sourceDocs || String(proj.reportTitle || '');
                            parsed.groups.forEach(g => {
                                const variantName = g.name || String(g.specs && g.specs.material ? g.specs.material : '');
                                const sig = `${reportRef}|${reportDate}|${variantName}`.toLowerCase();
                                if (existingSigs.has(sig)) { skippedCount++; return; }
                                existingSigs.add(sig);
                                const packType = mapPackType(g.specs && g.specs.packaging);
                                const sortedMeas = (g.measurements || []).slice().sort((a, b) => (Number(a.day) || 0) - (Number(b.day) || 0));
                                const lastMeas = sortedMeas.length > 0 ? sortedMeas[sortedMeas.length - 1] : {};
                                const getLastValid = (field) => {
                                    const found = sortedMeas.slice().reverse().find(m => {
                                        const s = m.samples && m.samples[0] ? m.samples[0] : {};
                                        return s[field] != null && String(s[field]).trim() !== '';
                                    });
                                    return found ? String(found.samples[0][field]) : '';
                                };
                                const getFirstValid = (field) => {
                                    const found = sortedMeas.find(m => {
                                        const s = m.samples && m.samples[0] ? m.samples[0] : {};
                                        return s[field] != null && String(s[field]).trim() !== '';
                                    });
                                    return found ? String(found.samples[0][field]) : '';
                                };
                                const idx = count++;
                                master['pack_opt_' + idx + '_type']    = packType;
                                master['pack_opt_' + idx + '_material'] = variantName;
                                master['pack_opt_' + idx + '_variety']  = String(proj.type || proj.variety || '');
                                master['pack_opt_' + idx + '_temp']    = chainTemp;
                                // Pack weight: measured sample weight → project start weight → group spec (least reliable)
                                master['pack_opt_' + idx + '_weight']  = getFirstValid('weight') || String(proj.startWeight || '') || String(g.specs && g.specs.startWeight != null ? g.specs.startWeight : '');
                                // Transmission value = number of laser perforations ("holes"), NOT holeSize
                                master['pack_opt_' + idx + '_trans']   = String(g.specs && g.specs.holes != null && String(g.specs.holes).trim() !== '' ? g.specs.holes : '');
                                master['pack_opt_' + idx + '_o2']      = getLastValid('o2');
                                master['pack_opt_' + idx + '_co2']     = getLastValid('co2');
                                master['pack_opt_' + idx + '_company'] = String(proj.company || '');
                                master['pack_opt_' + idx + '_country'] = String(proj.country || '');
                                master['pack_opt_' + idx + '_days']    = lastMeas.day != null ? String(lastMeas.day) : '';
                                master['pack_opt_' + idx + '_rating']  = String(lastMeas.quality || '');
                                master['pack_opt_' + idx + '_date']    = reportDate;
                                master['pack_opt_' + idx + '_pdf']     = reportRef;
                                // Per-variant conclusion from the report analysis → trial notes,
                                // plus the source documents so the raw input stays traceable.
                                const variantConcl = String((parsed.analysis && parsed.analysis.variantConclusions ? parsed.analysis.variantConclusions[String(g.id)] : '') || '');
                                const sourceNote = sourceDocs ? 'Extracted from: ' + sourceDocs + (proj.reportTitle ? ' (trial: ' + proj.reportTitle + ')' : '') : '';
                                master['pack_opt_' + idx + '_notes']   = variantConcl + (sourceNote ? (variantConcl ? '\n\n' : '') + sourceNote : '');
                                // Full quality-over-time curve ("day:score|day:score|...") — rating and
                                // shelf life are one story; keep every measured point, not just the endpoint.
                                const curvePoints = sortedMeas
                                    .filter(m => m.quality != null && String(m.quality).trim() !== '')
                                    .map(m => `${Number(m.day) || 0}:${String(m.quality).trim()}`);
                                master['pack_opt_' + idx + '_curve']   = curvePoints.join('|');
                                const rawAtm = String(g.specs && g.specs.atmosphereStrategy ? g.specs.atmosphereStrategy : '').trim();
                                master['pack_opt_' + idx + '_condition'] = rawAtm === 'Open' ? 'OPEN' : rawAtm === 'MHP' ? 'MHP' : 'MAP';
                                importedCount++;
                            });

                            // ── Baseline product properties from the report ──
                            // Only fills fields that are still EMPTY: manually curated values stay the master.
                            const acpN = nums(proj.acpO2), co2MaxN = nums(proj.co2Max), tempN = nums(proj.tempMin);
                            const o2T = nums(proj.o2Target), co2T = nums(proj.co2Target);
                            if (fillIfEmpty(p1c1, 'acp', acpN[0])) baselineFilled++;
                            if (fillIfEmpty(p1c1, 'critCO2', co2MaxN[0])) baselineFilled++;
                            if (fillIfEmpty(p1c1, 'minTemp', tempN[0])) baselineFilled++;
                            if (fillIfEmpty(p1c3, 'targetO2Min', o2T[0])) baselineFilled++;
                            if (fillIfEmpty(p1c3, 'targetO2Max', o2T[1] != null ? o2T[1] : o2T[0])) baselineFilled++;
                            if (fillIfEmpty(p1c3, 'targetCO2Min', co2T[0])) baselineFilled++;
                            if (fillIfEmpty(p1c3, 'targetCO2Max', co2T[1] != null ? co2T[1] : co2T[0])) baselineFilled++;
                            // Respiration rates measured with the FRM → respiration matrix at the measured temperature
                            const rrTempN = nums(proj.rrTemp)[0];
                            if (rrTempN != null) {
                                if (fillIfEmpty(p1c2, `temp${rrTempN}_O2`, nums(proj.rrO2)[0])) baselineFilled++;
                                if (fillIfEmpty(p1c2, `temp${rrTempN}_CO2`, nums(proj.rrCO2)[0])) baselineFilled++;
                            }
                        } else if (Array.isArray(parsed)) {
                            // ── Legacy format: flat array [{Product, TV, O2, CO2, ...}] ──
                            const matches = parsed.filter(r => {
                                const rn = normalize(String(r.Product || ''));
                                return rn === activeFull || rn === activeBase || activeBase.includes(rn) || rn.includes(activeBase);
                            });
                            if (matches.length === 0) {
                                wrongProduct.push(file.name + ' (no trials for ' + activeProduct.name + ')');
                                continue;
                            }
                            fileCount++;
                            matches.forEach(r => {
                                const idx = count++;
                                master['pack_opt_' + idx + '_type']    = r.Packaging || r.Type || 'Crate/Box';
                                master['pack_opt_' + idx + '_material'] = String(r.Material || '');
                                master['pack_opt_' + idx + '_temp']    = r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : String(r.Temperature || '');
                                master['pack_opt_' + idx + '_weight']  = r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000)) : r['Weight (g)'] !== undefined ? String(r['Weight (g)']) : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '';
                                master['pack_opt_' + idx + '_trans']   = r.TV !== undefined ? String(r.TV) : '';
                                master['pack_opt_' + idx + '_o2']      = parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)']);
                                master['pack_opt_' + idx + '_co2']     = parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)']);
                                master['pack_opt_' + idx + '_company'] = String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : ''));
                                master['pack_opt_' + idx + '_country'] = String(r.Country || r.country || '');
                                master['pack_opt_' + idx + '_days']    = r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '';
                                master['pack_opt_' + idx + '_rating']  = r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : '');
                                master['pack_opt_' + idx + '_condition'] = 'MAP';
                                importedCount++;
                            });
                        } else {
                            unreadable.push(file.name);
                        }
                    }

                    // Compose the outcome message
                    const parts = [];
                    if (skippedCount > 0) parts.push(skippedCount + ' skipped (already in the database)');
                    if (wrongProduct.length > 0) parts.push(wrongProduct.length + ' file(s) for a different product: ' + wrongProduct.join(', '));
                    if (unreadable.length > 0) parts.push(unreadable.length + ' unreadable file(s): ' + unreadable.join(', '));

                    if (importedCount === 0 && baselineFilled === 0) {
                        setInlineTrialMsg('⚠ Nothing imported' + (parts.length ? ' — ' + parts.join('; ') : ' — unknown file format.'));
                        setTimeout(() => setInlineTrialMsg(''), 9000);
                        return;
                    }

                    master.packOptCount = count;
                    const baselineUpdates = baselineFilled > 0 ? { 'p1-core-1': p1c1, 'p1-core-2': p1c2, 'p1-core-3': p1c3 } : null;
                    const newFullFormData = { ...localFormData, 'p2-pack-master': master, ...(baselineUpdates || {}) };
                    setLocalFormData(newFullFormData);
                    if (db) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { formData: newFullFormData });
                    } else {
                        setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, formData: newFullFormData } : p));
                    }
                    let msg = '✓ ' + importedCount + ' trial(s) imported from ' + fileCount + ' file(s)';
                    if (baselineUpdates) msg += ' + product properties updated';
                    if (parts.length) msg += ' — ' + parts.join('; ');
                    setInlineTrialMsg(msg);
                    setTimeout(() => setInlineTrialMsg(''), 8000);
                } catch(err) {
                    console.error(err);
                    setInlineTrialMsg('✗ Import failed: ' + err.message);
                    setTimeout(() => setInlineTrialMsg(''), 5000);
                }
            };

            const handleInlineTrialJSON = async (e) => {
                e.stopPropagation();
                let files = [];
                try {
                    if (window.showOpenFilePicker) {
                        const handles = await window.showOpenFilePicker({
                            types: [{ description: 'Trial JSON', accept: { 'application/json': ['.json'] } }],
                            multiple: true
                        });
                        files = await Promise.all(handles.map(h => h.getFile()));
                    }
                } catch(err) {
                    if (err.name !== 'AbortError') console.error(err);
                    return;
                }
                await importTrialFiles(files);
            };

            // === PROJECT BOARD AUTO-IMPORT ===
            // Opened as ...?boardProject=<id>&autoImport=1 when a card is dragged
            // into the Dashboard column. Reads that project's report.json from the
            // bound folder, selects the matching product and imports the trial.
            // The one-click banner provides the user gesture the File System Access
            // API requires to (re)grant folder permission in this tab.
            const boardProjectId = new URLSearchParams(window.location.search).get('boardProject');
            const boardAutoImport = new URLSearchParams(window.location.search).get('autoImport') === '1';
            const [boardImport, setBoardImport] = useState(boardProjectId && boardAutoImport ? { status: 'ready' } : null);
            const [pendingBoardFile, setPendingBoardFile] = useState(null);

            // Opened as ...?product=<id> from the board's products view: land
            // straight on that product. Runs once, after the products are loaded.
            const deepLinkProductId = new URLSearchParams(window.location.search).get('product');
            const deepLinkDoneRef = useRef(false);
            useEffect(() => {
                if (!deepLinkProductId || deepLinkDoneRef.current || products.length === 0) return;
                const target = products.find(p => p.id === deepLinkProductId);
                if (!target) return;
                deepLinkDoneRef.current = true;
                setActiveProductId(target.id);
            }, [deepLinkProductId, products]);

            // Best-effort: activate a concrete product whose name matches `wantName`.
            const selectProductByName = (wantName) => {
                if (!wantName) return false;

            const extractPackRows = master => {

                if (MAP[fk]) return MAP[fk];

                    if (tk === 'p2-pack-master') continue;
                    const src = sourceFD[tk]||{}; const tgt = (targetFD||{})[tk]||{};
                    for (const fk in src) {
                        if (SKIP_FIELDS.test(fk)) continue;
                        const sv = String(src[fk]||'').trim(); const tv = String(tgt[fk]||'').trim();
                        if (sv && tv && sv !== tv) out.push({ tk, fk, sv, tv });
                    }
                }
                return out;
            };

            const buildMergedFD = (targetFD, sourceFD, choices) => {
                const result = {};
                const allKeys = new Set([...Object.keys(targetFD||{}), ...Object.keys(sourceFD||{})]);
                for (const tk of allKeys) {
                    const tgt = (targetFD||{})[tk]||{}; const src = (sourceFD||{})[tk]||{};
                    if (tk === 'p2-pack-master') {
                        // Deduplicate pack-opt rows: all unique rows from both, exact match excl. pdf
                        const seen = new Set();
                        const rows = [...extractPackRows(tgt), ...extractPackRows(src)].filter(r => {
                            const k = packOptFingerprint(r); if (seen.has(k)) return false; seen.add(k); return true;
                        });
                        const nd = {};
                        rows.forEach((r, i) => PACK_FIELDS.forEach(f => { nd[`pack_opt_${i}_${f}`] = r[f]; }));
                        nd.packOptCount = rows.length;
                        result[tk] = nd;
                    } else {
                        // Field-level merge: start with source, override with target when non-empty
                        const merged = { ...src };
                        for (const fk in tgt) {
                            const ck = `${tk}.${fk}`;
                            if (choices && choices[ck] === 'source') { merged[fk] = src[fk]; }
                            else if (choices && choices[ck] === 'target') { merged[fk] = tgt[fk]; }
                            else if (String(tgt[fk]||'').trim() !== '') merged[fk] = tgt[fk]; // non-empty target wins
                            // else: target empty → source value stays in merged (fills in blank fields)
                        }
                        result[tk] = merged;
                    }
                }

            // The product sheet (from the perfotec-product-sheet skill) is the outward-facing

            // Locate a syncable value node inside a parsed sheet document.
            // Sheet values live as plain text in .card-value or td.t-target (the trilingual
            // <span data-lang> pattern is only used for prose), so they are safe to rewrite.
            const psFindNode = (doc, field) => {
                const norm = s => (s || '').toLowerCase().replace(/\s+/g, ' ');
                if (field.card) {
                    for (const card of doc.querySelectorAll('.card')) {
                        const eyebrow = norm(card.querySelector('.card-eyebrow')?.textContent);
                        const valEl = card.querySelector('.card-value');
                        if (valEl && field.card.some(k => eyebrow.includes(k))) return valEl;
                    }
                }
                if (field.row) {
                    for (const row of doc.querySelectorAll('tr')) {
                        const p = norm(row.querySelector('td.t-param')?.textContent);
                        const target = row.querySelector('td.t-target');
                        if (!p || !target) continue;
                        if (field.row.every(k => p.includes(k))) return target;
                    }
                }
                return null;
            };

            // Some value cells mix a number with trilingual unit spans ("15+ dagendaysdías").
            // Read only the English rendering so comparisons and rewrites stay clean.
            const psNodeText = (node) => {
                if (!node) return '';
                const clone = node.cloneNode(true);
                clone.querySelectorAll('[data-lang]').forEach(el => { if (el.getAttribute('data-lang') !== 'en') el.remove(); });
                return clone.textContent.trim().replace(/\s+/g, ' ');
            };

            // Rewrite a value node while preserving its trilingual unit spans: replace only the
            // leading number, so "15+ dagen/days/días" becomes "21 dagen/days/días".
            const psSetNodeValue = (node, newText) => {
                const langSpans = node.querySelectorAll('[data-lang]');
                if (langSpans.length === 0) { node.textContent = newText; return; }
                // Replace the text nodes that sit before the first language span
                let replaced = false;
                Array.from(node.childNodes).forEach(child => {
                    if (child.nodeType === 3) { // text node
                        if (!replaced && child.textContent.trim() !== '') { child.textContent = newText + ' '; replaced = true; }
                        else child.textContent = '';
                    }
                });
                if (!replaced) node.insertBefore(node.ownerDocument.createTextNode(newText + ' '), node.firstChild);
            };

            // The fields the dashboard and the sheet share. `dash` reads the dashboard value,

            const PS_SYNC_FIELDS = [
                { key: 'acp', label: 'ACP (anaerobic threshold)', unit: '% O₂',
                  card: ['acp', 'anaerob'],
                  dash: fd => fd['p1-core-1']?.acp,

                { key: 'q10', label: 'Q₁₀ temperature sensitivity', unit: '×',
                  card: ['q₁₀', 'q10'],
                  dash: fd => fd['p1-core-1']?.q10,
                  fmt: v => `${v}×`,
                  apply: () => {} /* Q10 is calculated from respiration data — never overwritten */ },
                { key: 'storageTemp', label: 'Optimal storage temperature', unit: '°C',
                  card: ['optimal storage', 'optimale bewaring', 'almacenamiento'], row: ['temperat'],
                  dash: fd => { const a = fd['p1-core-3']?.storageTempMin, b = fd['p1-core-3']?.storageTempMax; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v} °C`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), storageTempMin: String(nums[0]), storageTempMax: String(nums[1] ?? nums[0]) }; } },
                { key: 'o2', label: 'O₂ steady-state target', unit: '%',
                  row: ['o₂', 'steady'],
                  dash: fd => { const a = fd['p1-core-3']?.targetO2Min, b = fd['p1-core-3']?.targetO2Max; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}%`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetO2Min: String(nums[0]), targetO2Max: String(nums[1] ?? nums[0]) }; } },
                { key: 'co2', label: 'CO₂ steady-state target', unit: '%',
                  row: ['co₂', 'steady'],
                  dash: fd => { const a = fd['p1-core-3']?.targetCO2Min, b = fd['p1-core-3']?.targetCO2Max; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}%`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetCO2Min: String(nums[0]), targetCO2Max: String(nums[1] ?? nums[0]) }; } },
                { key: 'rh', label: 'Relative humidity', unit: '%',
                  row: ['rh'],
                  dash: fd => { const a = fd['p1-core-3']?.targetRHMin, b = fd['p1-core-3']?.targetRHMax; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}% RH`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetRHMin: String(nums[0]), targetRHMax: String(nums[1] ?? nums[0]) }; } },
                { key: 'shelfLife', label: 'Shelf life (trial-validated)', unit: 'days',
                  card: ['shelf life', 'houdbaarheid', 'vida útil'],
                  dash: (fd, ctx) => ctx.validatedShelfLife ? String(ctx.validatedShelfLife) : '',
                  fmt: v => `${v}`,
                  apply: () => {} /* shelf life is proven by trials, never taken from the sheet */ }
            ];

            // Longest shelf life proven by trials (quality stayed ≥ 6) — the number the sheet
            // should carry once practice beats the original research estimate.
            const psValidatedShelfLife = (fd) => {
                const pm = fd['p2-pack-master'] || {};
                const n = pm.packOptCount || 0;
                let best = 0;
                for (let i = 0; i < n; i++) {
                    const curveRaw = pm[`pack_opt_${i}_curve`] || '';
                    const rating = parseFloat(pm[`pack_opt_${i}_rating`]) || 0;
                    const days = parseFloat(pm[`pack_opt_${i}_days`]) || 0;
                    if (curveRaw) {
                        const pts = String(curveRaw).split('|').map(s => { const p = s.split(':'); return { d: parseFloat(p[0]), q: parseFloat(p[1]) }; }).filter(p => !isNaN(p.d) && !isNaN(p.q));
                        const ok = pts.filter(p => p.q >= 6);
                        if (ok.length) best = Math.max(best, Math.max(...ok.map(p => p.d)));
                    } else if (rating >= 6 && days > 0) best = Math.max(best, days);
                }
                return best;
            };

            // Build the comparison rows: what the sheet says vs what the dashboard knows.
            const psBuildComparison = (sheetHtml, fd) => {
                const doc = new DOMParser().parseFromString(sheetHtml, 'text/html');
                const ctx = { validatedShelfLife: psValidatedShelfLife(fd) };
                const nums = s => (String(s || '').replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
                return PS_SYNC_FIELDS.map(f => {
                    const node = psFindNode(doc, f);
                    const sheetText = psNodeText(node);
                    const dashVal = String(f.dash(fd, ctx) ?? '').trim();
                    const sheetNums = nums(sheetText), dashNums = nums(dashVal);
                    const inSheet = !!node && sheetText !== '';
                    const inDash = dashVal !== '' && !dashVal.startsWith('? – ?');
                    // Compare on numbers so "0 – 4 °C" and "0 – 4" count as equal
                    const same = inSheet && inDash && sheetNums.length === dashNums.length && sheetNums.every((v, i) => Math.abs(v - dashNums[i]) < 0.05);
                    return { field: f, found: !!node, sheetText, dashVal, inSheet, inDash, same };
                });
            };

            // Push dashboard values into the sheet HTML and return the updated document.
            const psPushToSheet = (sheetHtml, fd, keys) => {
                const doc = new DOMParser().parseFromString(sheetHtml, 'text/html');
                const ctx = { validatedShelfLife: psValidatedShelfLife(fd) };
                const updated = [];
                PS_SYNC_FIELDS.forEach(f => {
                    if (keys && !keys.includes(f.key)) return;
                    const node = psFindNode(doc, f);
                    if (!node) return;
                    const val = String(f.dash(fd, ctx) ?? '').trim();
                    if (!val || val.includes('? – ?')) return;
                    const newText = f.fmt(val);
                    if (psNodeText(node) === newText) return;
                    psSetNodeValue(node, newText);
                    updated.push(`${f.label}: ${newText}`);
                });
                // Stamp the sheet so anyone opening the file sees it carries validated data
                const stamp = new Date().toISOString().slice(0, 10);
                let marker = doc.querySelector('[data-pt-sync]');
                if (!marker) {
                    marker = doc.createElement('div');
                    marker.setAttribute('data-pt-sync', '1');
                    marker.setAttribute('style', 'position:fixed;left:12px;bottom:12px;z-index:9999;background:#008837;color:#fff;font:700 10px/1.4 Montserrat,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.2)');
                    doc.body && doc.body.appendChild(marker);
                }
                marker.textContent = `Trial-validated · synced ${stamp}`;
                return { html: '<!DOCTYPE html>\n' + doc.documentElement.outerHTML, updated };
            };

            // ── Product sheet actions ─────────────────────────────────────────────
            const psWriteFormData = async (nextFormData) => {
                setLocalFormData(nextFormData);
                if (db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { formData: nextFormData });
                else setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, formData: nextFormData } : p));
            };

            const handleAttachSheet = async () => {
                if (activeProduct?.isAverage) { setSheetMsg('⚠ Select a specific variety first — "All varieties" is a read-only overview.'); setTimeout(() => setSheetMsg(''), 7000); return; }
                let file;
                try {
                    if (window.showOpenFilePicker) {
                        const [h] = await window.showOpenFilePicker({ types: [{ description: 'Product sheet (HTML)', accept: { 'text/html': ['.html', '.htm'] } }], multiple: false });
                        file = await h.getFile();
                    }
                } catch (err) { if (err.name !== 'AbortError') console.error(err); return; }
                if (!file) return;
                const html = await file.text();
                if (!/card-eyebrow|t-target|condition-block/i.test(html)) {
                    setSheetMsg('⚠ This does not look like a PerfoTec product sheet (no known sheet markup found).');
                    setTimeout(() => setSheetMsg(''), 8000); return;
                }
                const next = { ...localFormData, 'product-sheet': { html, fileName: file.name, attachedAt: new Date().toISOString(), lastSyncedAt: '' } };
                await psWriteFormData(next);
                setSheetMsg(`✓ "${file.name}" attached — compare and sync below.`);
                setTimeout(() => setSheetMsg(''), 6000);
            };

            const handleViewSheet = () => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html) return;
                const url = URL.createObjectURL(new Blob([sheet.html], { type: 'text/html' }));
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            };

            const handleDownloadSheet = () => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html) return;
                const url = URL.createObjectURL(new Blob([sheet.html], { type: 'text/html' }));
                const a = document.createElement('a');
                a.href = url; a.download = sheet.fileName || 'product-sheet.html';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Dashboard → sheet: write validated practice data into the sheet document.
            const handlePushToSheet = async (keys) => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html || activeProduct?.isAverage) return;
                const { html, updated } = psPushToSheet(sheet.html, localFormData, keys);
                if (updated.length === 0) { setSheetMsg('Nothing to update — the sheet already matches the dashboard.'); setTimeout(() => setSheetMsg(''), 6000); return; }
                const next = { ...localFormData, 'product-sheet': { ...sheet, html, lastSyncedAt: new Date().toISOString() } };
                await psWriteFormData(next);
                setSheetMsg(`✓ Sheet updated (${updated.length}): ${updated.join(' · ')} — use Download to save the new file.`);
                setTimeout(() => setSheetMsg(''), 12000);
            };

            // Sheet → dashboard: seed empty dashboard fields from the sheet's research values.
            const handlePullFromSheet = async (onlyEmpty = true) => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html || activeProduct?.isAverage) return;
                const rows = psBuildComparison(sheet.html, localFormData);
                const next = JSON.parse(JSON.stringify(localFormData));
                const nums = s => (String(s || '').replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
                const applied = [];
                rows.forEach(r => {
                    if (!r.inSheet || r.same) return;
                    if (onlyEmpty && r.inDash) return;      // curated dashboard values win
                    const before = JSON.stringify(next);
                    r.field.apply(next, nums(r.sheetText));
                    if (JSON.stringify(next) !== before) applied.push(r.field.label);
                });
                if (!applied.length) { setSheetMsg(onlyEmpty ? 'Nothing to pull — every dashboard field already has a value.' : 'Nothing to pull.'); setTimeout(() => setSheetMsg(''), 6000); return; }
                next['product-sheet'] = { ...sheet, lastSyncedAt: new Date().toISOString() };
                await psWriteFormData(next);
                setSheetMsg(`✓ Pulled into the dashboard (${applied.length}): ${applied.join(' · ')}`);
                setTimeout(() => setSheetMsg(''), 10000);
            };

            const handleRemoveSheet = async () => {
                if (!window.confirm('Detach the product sheet from this product? The stored copy will be removed.')) return;
                const next = { ...localFormData };
                delete next['product-sheet'];
                await psWriteFormData(next);
                setSheetMsg('Product sheet detached.');
                setTimeout(() => setSheetMsg(''), 5000);
            };

            // Product sheet panel — rendered in the dashboard (full) and workflow (compact).
            const renderProductSheetPanel = (compact = false) => {
                if (!activeProduct) return null;
                const sheet = localFormData['product-sheet'];
                const themeColorClass = activeProduct.state === 'processed' ? 'text-[#084BCD]' : 'text-[#008837]';

                if (!sheet?.html) {
                    return (
                        <div className="ps-card p-6">
                            <span className="ps-eyebrow block mb-1.5">Product sheet</span>
                            <h3 className="ps-subtitle mb-2">No sheet attached yet</h3>
                            <p className="text-sm text-slate-500 mb-4 max-w-2xl">Attach the product sheet generated with the PerfoTec product-sheet skill. The dashboard then compares its research values with your trial-validated data and can sync them both ways.</p>
                            <div className="flex flex-wrap items-center gap-3">
                                <button onClick={handleAttachSheet} className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest bg-[#084BCD] text-white px-4 py-2.5 rounded-lg hover:opacity-90 transition-opacity"><Upload size={14}/> Attach product sheet</button>
                                {sheetMsg && <span className="text-xs font-bold text-amber-600">{sheetMsg}</span>}
                            </div>
                        </div>
                    );
                }

                const rows = psBuildComparison(sheet.html, localFormData);
                const diffs = rows.filter(r => r.inSheet && r.inDash && !r.same);
                const pushable = rows.filter(r => r.inDash && !r.same).map(r => r.field.key);
                const pullable = rows.filter(r => r.inSheet && !r.inDash);
                const synced = sheet.lastSyncedAt ? new Date(sheet.lastSyncedAt).toLocaleDateString() : 'never';

                if (compact) {
                    return (
                        <div className="ps-card px-5 py-4 flex flex-wrap items-center gap-4">
                            <FileCheck size={18} className={themeColorClass}/>
                            <div className="min-w-0">
                                <span className="ps-eyebrow block">Product sheet</span>
                                <span className="text-sm font-bold text-slate-900 truncate block max-w-[320px]">{sheet.fileName}</span>
                            </div>
                            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${diffs.length ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-green-50 text-[#008837] border border-green-200'}`}>
                                {diffs.length ? `${diffs.length} value(s) differ from practice` : 'In sync with the dashboard'}
                            </span>
                            <span className="text-xs text-slate-400 font-medium">Last sync: {synced}</span>
                            <div className="ml-auto flex items-center gap-2">
                                <button onClick={handleViewSheet} className="text-xs font-bold uppercase tracking-widest text-[#084BCD] hover:underline">View</button>
                                <span className="text-slate-200">|</span>
                                <button onClick={() => setActiveTab('dashboard')} className="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-slate-900 hover:underline">Open sync panel</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="ps-card overflow-hidden">
                        <div className="px-6 py-5 border-b border-slate-200 flex flex-wrap items-start justify-between gap-4">
                            <div className="min-w-0">
                                <span className="ps-eyebrow block mb-1">Product sheet</span>
                                <h3 className="ps-subtitle flex items-center gap-2"><FileCheck size={18} className={themeColorClass}/> {sheet.fileName}</h3>
                                <p className="text-xs text-slate-400 font-medium mt-1">Attached {new Date(sheet.attachedAt).toLocaleDateString()} · Last sync: {synced}</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                <button onClick={handleViewSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-slate-100 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors"><Eye size={13}/> View</button>
                                <button onClick={handleDownloadSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-slate-100 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors"><Download size={13}/> Download</button>
                                <button onClick={handleAttachSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-slate-100 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors"><Upload size={13}/> Replace</button>
                                <button onClick={handleRemoveSheet} className="p-2 text-slate-400 hover:text-red-600 transition-colors" title="Detach sheet"><Trash2 size={14}/></button>
                            </div>
                        </div>

                        <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center gap-3">
                            <button onClick={() => handlePushToSheet(pushable)} disabled={!pushable.length || activeProduct.isAverage}
                                className={`flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest px-4 py-2.5 rounded-lg transition-opacity ${pushable.length && !activeProduct.isAverage ? 'bg-[#008837] text-white hover:opacity-90' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                title="Write the dashboard's trial-validated values into the sheet">
                                <RefreshCw size={13}/> Update sheet with practice data{pushable.length ? ` (${pushable.length})` : ''}
                            </button>
                            <button onClick={() => handlePullFromSheet(true)} disabled={!pullable.length || activeProduct.isAverage}
                                className={`flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest px-4 py-2.5 rounded-lg border transition-colors ${pullable.length && !activeProduct.isAverage ? 'border-[#084BCD] text-[#084BCD] hover:bg-blue-50' : 'border-slate-200 text-slate-400 cursor-not-allowed'}`}
                                title="Fill empty dashboard fields from the sheet's research values">
                                <Download size={13}/> Fill empty dashboard fields from sheet{pullable.length ? ` (${pullable.length})` : ''}
                            </button>
                            {sheetMsg && <span className="text-xs font-bold text-slate-700 flex-1 min-w-[200px]">{sheetMsg}</span>}
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left border-collapse ps-table">
                                <thead><tr><th>Parameter</th><th>Product sheet (research)</th><th>Dashboard (practice)</th><th>Status</th></tr></thead>
                                <tbody>
                                    {rows.map(r => {
                                        const status = !r.found ? { txt: 'Not in sheet', cls: 'text-slate-400' }
                                            : r.same ? { txt: '✓ In sync', cls: 'ps-good' }
                                            : (r.inSheet && r.inDash) ? { txt: '⚠ Differs', cls: 'ps-warn' }
                                            : r.inDash ? { txt: '→ Sheet empty', cls: 'ps-target' }
                                            : { txt: '← Dashboard empty', cls: 'ps-target' };
                                        return (
                                            <tr key={r.field.key}>
                                                <td className="font-bold text-slate-900">{r.field.label}</td>
                                                <td className={r.inSheet ? '' : 'text-slate-300'}>{r.inSheet ? r.sheetText : '—'}</td>
                                                <td className={r.inDash ? 'ps-target' : 'text-slate-300'}>{r.inDash ? `${r.dashVal} ${r.field.unit}` : '—'}</td>
                                                <td className={status.cls + ' whitespace-nowrap'}>{status.txt}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <p className="px-6 py-3 text-[11px] text-slate-400 italic border-t border-slate-200">Q₁₀ and shelf life are only ever written towards the sheet — they are proven by measurements and trials, never taken from research text.</p>
                    </div>
                );
            };

            const renderTrialRegister = () => {
                if (!activeProduct) return null;
                const taskData = localFormData['p2-pack-master'] || {};
                const count = taskData.packOptCount || 1;
                const themeBgClass = activeProduct.state === 'processed' ? 'bg-[#084BCD]' : 'bg-[#008837]';
                return (
                    <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <div className={`px-5 py-4 flex flex-wrap items-center justify-between gap-3 ${themeBgClass} text-white`}>
                            <div>
                                <h3 className="font-spartan font-bold text-lg flex items-center gap-2"><Package size={18}/> Trial Results & Optimization</h3>
                                <p className="text-xs text-white/75 mt-0.5">The heart of this dashboard — log every trial here, or import them from a report.html JSON export.</p>
                            </div>
                            <div className="flex items-center gap-3">
                                {inlineTrialMsg && <span className="text-xs font-bold bg-white/15 rounded-lg px-2.5 py-1.5">{inlineTrialMsg}</span>}
                                <button type="button" onClick={handleInlineTrialJSON} className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest bg-white text-[#084BCD] hover:bg-blue-50 px-4 py-2.5 rounded-lg transition-colors shadow-sm" title="Import trial results from report.html JSON exports — you can select multiple files at once"><Upload size={14}/> Import Trials from JSON</button>
                            </div>
                        </div>
                        <div className="p-4">
                            <div className="overflow-x-auto custom-scrollbar pb-2">
                                <table className="w-full text-sm text-left border-collapse table-fixed min-w-[1400px]">
                                    <thead className="bg-slate-50 text-[10px] font-spartan uppercase text-slate-500">
                                        <tr>
                                            <th className="p-2 border border-slate-200 w-[6%]">Condition</th>
                                            <th className="p-2 border border-slate-200 w-[8%]">Variety</th>
                                            <th className="p-2 border border-slate-200 w-[7%]">Packaging Type</th>
                                            <th className="p-2 border border-slate-200 w-[10%]">Material</th>
                                            <th className="p-2 border border-slate-200 w-[6%]">Temp (°C)</th>
                                            <th className="p-2 border border-slate-200 w-[6%]">Weight</th>
                                            <th className="p-2 border border-slate-200 w-[6%]">TV Req.</th>
                                            <th className="p-2 border border-slate-200 w-[6%]">O2 (%)</th>
                                            <th className="p-2 border border-slate-200 w-[6%]">CO2 (%)</th>
                                            <th className="p-2 border-l-2 border-l-blue-400 border-y border-slate-200 w-[9%] bg-blue-50 text-blue-700">Trial Company</th>
                                            <th className="p-2 border border-slate-200 w-[7%] bg-blue-50 text-blue-700">Country</th>
                                            <th className="p-2 border border-slate-200 w-[5%] bg-blue-50 text-blue-700">Days</th>
                                            <th className="p-2 border border-slate-200 w-[6%] bg-blue-50 text-blue-700">Rating (1-10)</th>
                                            <th className="p-2 border border-slate-200 w-[8%] bg-blue-50 text-blue-700">Trial Date</th>
                                            <th className="p-2 border border-slate-200 w-[10%] bg-blue-50 text-blue-700">Trial Report (PDF)</th>
                                            <th className="p-2 border border-slate-200 w-[3%]"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {Array.from({ length: count }).map((_, idx) => {
                                            const pType = taskData[`pack_opt_${idx}_type`] || '';
                                            const cond  = taskData[`pack_opt_${idx}_condition`] || 'MAP';
                                            const isMHP = cond === 'MHP';
                                            const wLabel = pType === 'Pallet' ? 'kg' : 'g';
                                            const rating = taskData[`pack_opt_${idx}_rating`];
                                            const trialNotes = taskData[`pack_opt_${idx}_notes`] || '';
                                            const notesOpen = openTrialNotes.has(idx);
                                            return (
                                            <React.Fragment key={idx}>
                                            <tr className="border-b border-slate-200 bg-white hover:bg-slate-50">
                                                <td className="p-0 border-r border-slate-200">
                                                    <select className={`w-full p-3 outline-none font-bold text-xs bg-transparent ${cond === 'MAP' ? 'text-green-700 focus:bg-green-50' : cond === 'MHP' ? 'text-violet-700 focus:bg-violet-50' : 'text-orange-700 focus:bg-orange-50'}`} value={cond} onChange={(e) => handleFieldChange('p2-pack-master', `pack_opt_${idx}_condition`, e.target.value)}>
                                                        <option value="MAP">MAP</option>
                                                        <option value="MHP">MHP</option>
                                                        <option value="OPEN">OPEN</option>
                                                    </select>
                                                </td>
                                                <td className="p-0 border-r border-slate-200"><input type="text" placeholder={activeProduct.variety || 'Variety'} className="w-full p-3 outline-none focus:bg-blue-50 font-medium text-slate-900 text-xs bg-transparent" value={taskData[`pack_opt_${idx}_variety`] || ''} onChange={(e) => handleFieldChange('p2-pack-master', `pack_opt_${idx}_variety`, e.target.value)}/></td>
                                                <td className="p-0 border-r border-slate-200">
                                                    <select className="w-full p-3 outline-none focus:bg-blue-50 font-medium text-slate-900 text-xs bg-transparent" value={pType} onChange={(e) => handleFieldChange('p2-pack-master', `pack_opt_${idx}_type`, e.target.value)}>
                                                        <option value="" disabled>Select...</option>
                                                        <option value="Punnet">Punnet</option>
                                                        <option value="Flowpack">Flowpack</option>
                                                        <option value="Crate/Box">Crate/Box</option>
                                                        <option value="Pallet">Pallet</option>

                                                    <td className="p-0 border border-slate-200"><input type="number" placeholder="Actual O2..." className="w-full p-3 outline-none focus:bg-slate-100 font-medium text-slate-900" value={taskData[`temp${temp}_O2`] || ''} onChange={(e) => handleFieldChange('p1-core-2', `temp${temp}_O2`, e.target.value)}/></td>

                            <div className="mt-3 flex items-center gap-2 p-2 bg-slate-50 border border-slate-200 rounded-lg"><input type="number" step="0.1" placeholder="New temp (°C)" className={`p-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-[${themeHex}]`} value={newTempInputs['p1-core-2'] || ''} onChange={e => setNewTempInputs(prev => ({...prev, 'p1-core-2': e.target.value}))} onClick={e => e.stopPropagation()}/><button type="button" onClick={e => handleAddTemp('p1-core-2', e)} className={`bg-[#084BCD] text-white px-4 py-2 text-xs font-bold font-spartan uppercase tracking-widest rounded-lg hover:opacity-90 transition-opacity`}>Add Temp</button></div>

            const renderDashboardTab = () => {

                        {/* ── Product sheet: the outward-facing spec document, kept in sync

                        {activeProduct.isAverage && (

                                    <p className="font-bold text-sm">Viewing Averaged Data</p>

                            </div>
                        )}

                        {/* ── KPI strip: the at-a-glance numbers for the commercial team.

                        {(() => {
                            const pm = localFormData['p2-pack-master'] || {};
                            const tCount = pm.packOptCount || 0;
                            const trials = [];
                            for (let i = 0; i < tCount; i++) {
                                if (!matchesVariety(i)) continue;
                                const hasData = ['type','material','o2','co2','days','rating'].some(f => pm[`pack_opt_${i}_${f}`]);

                                const curveRaw = pm[`pack_opt_${i}_curve`] || '';
                                const curve = curveRaw ? String(curveRaw).split('|').map(s => { const p = s.split(':'); return { d: parseFloat(p[0]), q: parseFloat(p[1]) }; }).filter(p => !isNaN(p.d) && !isNaN(p.q)).sort((a, b) => a.d - b.d) : [];
                                trials.push({ rating: parseFloat(pm[`pack_opt_${i}_rating`]) || 0, days: parseFloat(pm[`pack_opt_${i}_days`]) || 0, curve });

                            let sellable = null;

                                    const p2PackMaster = localFormData['p2-pack-master'] || {};
                                    const tCount = p2PackMaster.packOptCount || 1;
                                    const solTrials = [];
                                    for(let i=0; i<tCount; i++) {

                                                pdf: p2PackMaster[`pack_opt_${i}_pdf`]

                <FolderGate icon={FolderOpen} color="#008837" title="Choose the PerfoTec database folder"

            if (!db && folderState === 'ready' && needsProductMigration) return (

                                                    onClick={() => document.getElementById('sheet-upload').click()}>

                                                    <input type="file" id="sheet-upload" className="hidden" accept=".htm,.html,.pdf,.txt,.doc,.docx" onChange={handleFileInputChange} />
                                                </div>

                                                <div className={`border-2 border-dashed rounded-md p-8 text-center transition-colors cursor-pointer group ${isDragging ? 'border-green-500 bg-green-50' : 'border-slate-200 bg-slate-50 hover:border-green-400 hover:bg-green-50'}`}
