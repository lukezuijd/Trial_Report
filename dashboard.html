                                                <h3 className="font-spartan font-bold text-xs uppercase tracking-widest text-slate-500 mb-3">Step 2 — Review & edit trial data</h3>
                                                <div className="border border-slate-200 overflow-x-auto custom-scrollbar max-h-72">
                                                    <table className="w-full text-xs text-left border-collapse min-w-[1100px]">
                                                        <thead className="bg-slate-50 text-[10px] font-spartan uppercase text-slate-500 sticky top-0">
                                                            <tr>
                                                                <th className="p-2 border-b border-r border-slate-200">Product</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Packaging</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Material</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Temp</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Weight (g)</th>
                                                                <th className="p-2 border-b border-r border-slate-200">TV</th>
                                                                <th className="p-2 border-b border-r border-slate-200">O2 %</th>
                                                                <th className="p-2 border-b border-r border-slate-200">CO2 %</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Company</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Country</th>
                                                                <th className="p-2 border-b border-r border-slate-200">Days</th>
                                                                <th className="p-2 border-b border-slate-200">Rating</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {trialImportRows.map(row => {
                                                                const skipped = trialProductMappings[row.product] === 'skip';
                                                                const upd = (field, val) => setTrialImportRows(prev => prev.map(r => r._id === row._id ? {...r, [field]: val} : r));
                                                                return (
                                                                    <tr key={row._id} className={`border-b border-slate-200 ${skipped ? 'opacity-30 bg-slate-50' : 'hover:bg-slate-50'}`}>
                                                                        <td className="p-2 font-medium whitespace-nowrap">{row.product}</td>
                                                                        <td className="p-0 border-r border-slate-200">
                                                                            <select className="w-full p-2 outline-none bg-transparent text-[10px]" value={row.packaging} onChange={e => upd('packaging', e.target.value)} disabled={skipped}>
                                                                                <option>Crate/Box</option><option>Punnet</option><option>Flowpack</option><option>Pallet</option>
                                                                            </select>
                                                                        </td>
                                                                        <td className="p-0 border-r border-slate-200"><input className="w-full p-2 outline-none bg-transparent min-w-[70px]" value={row.material} onChange={e => upd('material', e.target.value)} disabled={skipped} placeholder="e.g. BOPP"/></td>
                                                                        <td className="p-2 text-right whitespace-nowrap">{row.temp ? `${row.temp}°C` : '—'}</td>
                                                                        <td className="p-2 text-right">{row.weight || '—'}</td>
                                                                        <td className="p-2 text-right font-mono">{row.tv || '—'}</td>
                                                                        <td className="p-2 text-right">{row.o2 ? `${row.o2}%` : '—'}</td>
                                                                        <td className="p-2 text-right">{row.co2 ? `${row.co2}%` : '—'}</td>
                                                                        <td className="p-2 whitespace-nowrap">{row.company || '—'}</td>
                                                                        <td className="p-0 border-r border-slate-200"><input className="w-full p-2 outline-none bg-transparent min-w-[70px]" value={row.country} onChange={e => upd('country', e.target.value)} disabled={skipped} placeholder="Country"/></td>
                                                                        <td className="p-0 border-r border-slate-200"><input type="number" className="w-full p-2 outline-none bg-transparent w-14 text-right" value={row.days} onChange={e => upd('days', e.target.value)} disabled={skipped} placeholder="—"/></td>
                                                                        <td className="p-0"><input type="number" min="1" max="10" className={`w-full p-2 outline-none bg-transparent w-12 text-right font-bold ${parseFloat(row.rating) >= 7 ? 'text-green-600' : ''}`} value={row.rating} onChange={e => upd('rating', e.target.value)} disabled={skipped} placeholder="1–10"/></td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <div className="flex justify-end gap-4 border-t border-slate-200 pt-6">
                                                <button onClick={resetModal} className="px-6 py-3 text-sm font-bold font-spartan text-slate-500 hover:bg-slate-100 transition-colors">Cancel</button>
                                                <button onClick={handleImportTrials} className="px-8 py-3 text-sm font-bold font-spartan rounded-lg bg-blue-600 text-white hover:bg-blue-700 shadow-lg">
                                                    <span className="block shape-80deg-reverse uppercase tracking-widest">Import {trialImportRows.filter(r => trialProductMappings[r.product] !== 'skip').length} Trials</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Global search overlay: find any product or trial result across the whole database ── */}
                    {showGlobalSearch && (() => {
                        const q = globalSearch.toLowerCase().trim();
                        const terms = q.split(/\s+/).filter(Boolean);
                        const matches = (haystack) => terms.every(term => haystack.includes(term));
                        const productHits = q ? displayProducts
                            .filter(p => matches(`${p.name || ''} ${p.variety || ''} ${p.state || ''}`.toLowerCase()))
                            .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                            .slice(0, 8) : [];
                        const trialHits = [];
                        if (q) {
                            for (const p of products) {
                                if (p.isAverage) continue;
                                const pd = p.formData?.['p2-pack-master'] || {};
                                const n = pd.packOptCount || 0;
                                for (let i = 0; i < n && trialHits.length < 10; i++) {
                                    const f = (k) => pd[`pack_opt_${i}_${k}`] || '';
                                    if (!['type','material','o2','co2','days','rating','company','date'].some(k => f(k))) continue;
                                    const hay = `${p.name} ${p.variety || ''} ${f('type')} ${f('material')} ${f('company')} ${f('country')} ${f('pdf')} ${f('date')} ${f('temp')} ${f('trans')} ${f('notes')}`.toLowerCase();
                                    if (matches(hay)) trialHits.push({ productId: p.id, productName: `${p.name}${p.variety ? ' — ' + p.variety : ''}`, mat: f('material'), type: f('type'), temp: f('temp'), rating: f('rating'), days: f('days'), date: f('date'), company: f('company') });
                                }
                            }
                        }
                        const close = () => { setShowGlobalSearch(false); setGlobalSearch(''); };
                        return (
                            <div className="fixed inset-0 z-[300] flex items-start justify-center pt-[12vh] px-4" onClick={close}>
                                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
                                <div className="relative bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                                    <div className="flex items-center gap-3 px-5 py-4 border-b border-slate-200">
                                        <Search size={18} className="text-[#084BCD] shrink-0"/>
                                        <input autoFocus type="text" value={globalSearch} onChange={e => setGlobalSearch(e.target.value)}
                                            onKeyDown={e => { if (e.key === 'Escape') close(); }}
                                            placeholder="Search all products & trials — e.g. R+701, broccolini, company, date..."
                                            className="flex-1 text-base outline-none text-slate-900 placeholder-slate-300 font-medium bg-transparent"/>
                                        <button onClick={close} className="text-slate-400 hover:text-slate-700 shrink-0"><X size={18}/></button>
                                    </div>
                                    <div className="max-h-[55vh] overflow-y-auto custom-scrollbar">
                                        {!q && <p className="p-6 text-sm text-slate-400 text-center">Type to search across every product and every trial result in the database.</p>}
                                        {q && productHits.length === 0 && trialHits.length === 0 && (
                                            <p className="p-6 text-sm text-slate-400 text-center">No products or trials found for "{globalSearch}" — this combination has not been tested yet.</p>
                                        )}
                                        {productHits.length > 0 && (
                                            <div>
                                                <p className="px-5 pt-4 pb-1.5 text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-400">Products</p>
                                                {productHits.map(p => (
                                                    <button key={p.id} onClick={() => { setActiveProductId(p.id); setActiveTab('dashboard'); close(); }} className="w-full flex items-center gap-3 px-5 py-2.5 hover:bg-blue-50/60 transition-colors text-left">
                                                        <Leaf size={15} className="text-[#008837] shrink-0"/>
                                                        <span className="text-sm font-bold text-slate-900">{p.name}{p.variety ? ` — ${p.variety}` : ''}</span>
                                                        <span className="text-xs text-slate-400">{p.state === 'whole' ? 'Whole' : 'Processed'}</span>
                                                        <ChevronRight size={14} className="ml-auto text-slate-300 shrink-0"/>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                        {trialHits.length > 0 && (
                                            <div className="pb-3">
                                                <p className="px-5 pt-4 pb-1.5 text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-400">Trial results</p>
                                                {trialHits.map((t, i) => (
                                                    <button key={`${t.productId}-${i}`} onClick={() => { setActiveProductId(t.productId); setActiveTab('database'); setDbActiveTab('trials'); setDbProductFilter(t.productId); setTrialFilter(''); setTrialSearch(globalSearch); close(); }} className="w-full flex items-center gap-3 px-5 py-2.5 hover:bg-blue-50/60 transition-colors text-left">
                                                        <TestTube size={15} className="text-[#084BCD] shrink-0"/>
                                                        <div className="min-w-0 flex-1">
                                                            <span className="block text-sm font-bold text-slate-900 truncate">{t.productName} · {t.mat || t.type || 'Trial'}</span>
                                                            <span className="block text-xs text-slate-400 truncate">{[t.type, t.temp && `${t.temp}°C`, t.rating && `★ ${t.rating}/10`, t.days && `${t.days} days`, t.date, t.company].filter(Boolean).join(' · ')}</span>
                                                        </div>
                                                        <ChevronRight size={14} className="ml-auto text-slate-300 shrink-0"/>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* PROJECT BOARD AUTO-IMPORT BANNER */}
                    {boardImport && (
                        <div className="w-full text-white text-sm px-4 py-2.5 flex items-center justify-center gap-3 flex-wrap" style={{ backgroundColor: '#084BCD' }}>
                            {boardImport.status === 'ready' && (<>
                                <span>📋 Project Board — import this project's trial results into the dashboard.</span>
                                <button onClick={runBoardImport} className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold">Import trial now</button>
                            </>)}
                            {boardImport.status === 'working' && <span>Connecting to the project folder…</span>}
                            {boardImport.status === 'importing' && <span>Importing trial{boardImport.wantName ? ` for ${boardImport.wantName}` : ''}…</span>}
                            {boardImport.status === 'need-perm' && (<>
                                <span>Folder access is needed to import this trial.</span>
                                <button onClick={runBoardImport} className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold">Grant access &amp; import</button>
                            </>)}
                            {boardImport.status === 'error' && (<>
                                <span>⚠ {boardImport.msg || 'Import failed.'}</span>
                                <button onClick={runBoardImport} className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold">Retry</button>
                            </>)}
                            <a href="board.html" className="underline opacity-80 hover:opacity-100">← Board</a>
                            <button onClick={() => setBoardImport(null)} className="opacity-70 hover:opacity-100 ml-1" aria-label="Dismiss">✕</button>
                        </div>
                    )}

                    <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-[1600px] w-full mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4 min-w-0 flex-1">

                                                                <div className="mt-auto">
                                                                    <div className="flex items-center justify-between text-xs font-spartan font-bold uppercase tracking-widest text-slate-500 mb-2"><span>Tasks Completed</span><span className={isFullyCompleted ? themeColorClass : ''}>{stepProgress.completed} / {stepProgress.total}</span></div>
                                                                    <div className="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden mb-4"><div className={`h-full transition-all duration-500 ${isFullyCompleted ? themeBgClass : 'bg-[#084BCD]'}`} style={{width: `${stepProgress.percentage}%`}}></div></div>
                                                                    <div className={`flex items-center text-xs font-bold font-spartan uppercase tracking-wide ${isActive ? 'text-slate-900' : themeColorClass}`}>{isActive ? 'Close Workspace' : 'Open Workspace'} <ChevronRight size={14} className={`ml-1 transform transition-transform ${isActive ? 'rotate-90' : ''}`} /></div>
                                                                </div>
                                                            </div>

                                                            {isActive && (
                                                                <div className="xl:w-[80%] flex flex-col bg-slate-50 animate-fadeIn">
                                                                    <div className="p-6 xl:p-8 border-b border-slate-200">
                                                                        <h4 className="font-spartan font-bold text-lg text-slate-900 flex items-center gap-2 mb-6"><ShieldCheck size={20} className={themeColorClass} /> Phase Execution & Data Capture</h4>
                                                                        <div className="space-y-6">
                                                                            {Object.entries(groupedTasks).map(([category, tasks]) => (
                                                                                <div key={category}>
                                                                                    <h5 className="text-xs font-spartan font-bold uppercase tracking-widest text-slate-500/60 mb-3 ml-1">{category}</h5>
                                                                                    <div className="space-y-4">
                                                                                        {tasks.map((task) => {
                                                                                            const isTaskDone = activeProduct.completedTaskIds?.includes(task.id); const hasDataForm = task.formGroups || task.customForm; const taskData = localFormData[task.id] || {}; const isCollapsed = !expandedTaskIds.has(task.id);

                                                                                            return (
                                                                                                <div key={task.id} className={`flex flex-col border rounded-xl transition-all ${isTaskDone ? 'bg-white shadow-md' : 'bg-white border-slate-200 hover:border-slate-400'}`} style={{ borderColor: isTaskDone ? `${themeHex}40` : '' }}>
                                                                                                    <div onClick={() => setExpandedTaskIds(prev => { const n = new Set(prev); n.has(task.id) ? n.delete(task.id) : n.add(task.id); return n; })} className="flex items-start gap-4 p-4 cursor-pointer hover:bg-black/5 transition-colors">
                                                                                                        <div onClick={(e) => { e.stopPropagation(); toggleTaskCompletion(task.id, e); }} className={`mt-0.5 shrink-0 hover:scale-110 transition-transform ${isTaskDone ? themeColorClass : 'text-slate-200'}`}>{isTaskDone ? <CheckSquare size={20} /> : <Square size={20} />}</div>
                                                                                                        <div className={`flex flex-col transition-colors ${isTaskDone ? 'opacity-70' : ''}`}><span className={`text-sm font-bold mb-1 ${isTaskDone ? `${themeColorClass} line-through` : 'text-slate-900'}`}>{task.title}</span><span className={`text-sm leading-relaxed ${isTaskDone ? `${themeColorClass} line-through` : 'text-slate-500'}`}>{task.detail}</span></div>
                                                                                                        <div className="ml-auto mt-0.5 flex items-center gap-1.5 shrink-0">
                                                                                                            {hasDataForm && Object.keys(taskData).length > 0 && <Database size={14} className={`${themeColorClass} opacity-40`} title="Data attached"/>}
                                                                                                            {hasDataForm && <ChevronRight size={14} className={`text-slate-400 transform transition-transform duration-200 ${isCollapsed ? '' : 'rotate-90'}`}/>}
                                                                                                        </div>
                                                                                                    </div>

                                                                                                    {hasDataForm && !isCollapsed && (
                                                                                                        <div className="border-t border-slate-200 bg-slate-50 p-5 animate-fadeIn" onClick={(e) => e.stopPropagation()}>
                                                                                                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5 pb-3 border-b border-slate-200">
                                                                                                                <span className={`text-xs font-spartan font-bold uppercase tracking-widest flex items-center gap-2 ${themeColorClass}`}><Database size={14}/> Data Collection</span>
                                                                                                                <span className={`flex items-center gap-1.5 text-xs font-bold ${autosaveState === 'error' ? 'text-red-600' : autosaveState === 'saved' ? 'text-green-600' : 'text-slate-400'}`}>
                                                                                                                    {autosaveState === 'pending' ? <><Loader2 size={12} className="animate-spin"/> Saving…</>
                                                                                                                    : autosaveState === 'error' ? <><AlertCircle size={12}/> Save failed — check connection</>
                                                                                                                    : autosaveState === 'saved' ? <><CheckCircle2 size={12}/> Saved</>
                                                                                                                    : <><CheckCircle2 size={12}/> Saves automatically</>}
                                                                                                                </span>
                                                                                                            </div>


                                                                                                            {task.formGroups && (
                                                                                                                <div className="space-y-6">
                                                                                                                    {task.formGroups.map((group, gIdx) => {
                                                                                                                        const GroupIconCmp = group.icon; const gridCols = group.fields.length === 6 ? 'lg:grid-cols-2' : 'lg:grid-cols-3';
                                                                                                                        return (
                                                                                                                            <div key={gIdx} className="bg-white p-4 border border-slate-200 rounded-xl">
                                                                                                                                <h6 className="flex items-center gap-2 text-xs font-spartan font-bold uppercase tracking-widest text-slate-900 mb-4">{GroupIconCmp && <GroupIconCmp size={14} className={themeColorClass}/>}{group.title}</h6>
                                                                                                                                <div className={`grid grid-cols-1 md:grid-cols-2 ${gridCols} gap-4`}>
                                                                                                                                    {group.fields.map(field => {
                                                                                                                                        const colSpanClass = field.colSpan === 2 ? 'md:col-span-2 lg:col-span-2' : field.type === 'text' || field.type === 'url' ? 'lg:col-span-2' : '';
                                                                                                                                        return (
                                                                                                                                            <div key={field.id} className={`flex flex-col justify-end ${colSpanClass}`}>
                                                                                                                                                <label className="block text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wide">{field.label}</label>
                                                                                                                                                {field.type === 'select' ? (
                                                                                                                                                    <select className={"w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 shadow-sm transition-all hover:bg-slate-100"} value={taskData[field.id] || ''} onChange={(e) => handleFieldChange(task.id, field.id, e.target.value)}><option value="" disabled>Select...</option>{field.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select>
                                                                                                                                                ) : (
                                                                                                                                                    <input type={field.type} placeholder={field.placeholder} readOnly={field.id === 'q10'} className={`w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 shadow-sm transition-all ${field.id === 'q10' ? 'opacity-60 cursor-not-allowed' : 'hover:bg-slate-100 focus:bg-white'}`} value={taskData[field.id] || ''} onChange={(e) => handleFieldChange(task.id, field.id, e.target.value)}/>
                                                                                                                                                )}
                                                                                                                                            </div>
                                                                                                                                        )
                                                                                                                                    })}
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        )
                                                                                                                    })}
                                                                                                                </div>
                                                                                                            )}


                                                                                                            {task.customForm === 'defect-matrix' && (
                                                                                                                <div className="bg-white border border-slate-200 mt-4 rounded-xl overflow-hidden">
                                                                                                                    <div className="p-4 border-b border-slate-200"><h6 className="flex items-center gap-2 text-xs font-spartan font-bold uppercase tracking-widest text-slate-900"><FileText size={14} className={themeColorClass}/>Defects & Prevention Matrix</h6></div>
                                                                                                                    <div className="overflow-x-auto">
                                                                                                                        <table className="w-full text-sm text-left border-collapse table-fixed">
                                                                                                                            <thead className="text-[10px] font-spartan uppercase"><tr><th className="p-3 border-r border-b border-slate-200 bg-slate-50 text-slate-500 w-[20%]">Defect</th><th className="p-3 border-r border-b border-slate-200 bg-slate-50 text-slate-500 w-[25%]">Physiological Cause</th><th className="p-3 border-r border-blue-400 bg-blue-400 text-white w-[25%]">MHP Effect (Moisture)</th><th className="p-3 border-green-700 bg-green-700 text-white w-[30%]">MAP Effect (Gas)</th></tr></thead>
                                                                                                                            <tbody>
                                                                                                                                {(() => {
                                                                                                                                    const count = taskData.defectCount || 7; const indices = Array.from({ length: count }, (_, i) => i);
                                                                                                                                    return indices.map(idx => (
                                                                                                                                        <tr key={idx} className="border-b last:border-0 border-slate-200 align-top">
                                                                                                                                            <td className="p-0 border-r border-slate-200"><textarea rows="3" className="w-full h-full p-3 text-slate-900 font-bold outline-none focus:bg-slate-50 bg-transparent block" placeholder="Defect name..." value={taskData[`defect_${idx}_name`] || ''} onChange={(e) => handleFieldChange(task.id, `defect_${idx}_name`, e.target.value)}/></td>
                                                                                                                                            <td className="p-0 border-r border-slate-200"><textarea rows="3" className="w-full h-full p-3 text-slate-500 outline-none focus:bg-slate-50 bg-transparent block" placeholder="Cause..." value={taskData[`defect_${idx}_cause`] || ''} onChange={(e) => handleFieldChange(task.id, `defect_${idx}_cause`, e.target.value)}/></td>
                                                                                                                                            <td className="p-0 border-r border-slate-200 bg-blue-50"><textarea rows="3" className="w-full h-full p-3 text-blue-700 font-medium outline-none bg-transparent focus:bg-white block" placeholder="MHP Effect..." value={taskData[`defect_${idx}_mhp`] || ''} onChange={(e) => handleFieldChange(task.id, `defect_${idx}_mhp`, e.target.value)}/></td>
                                                                                                                                            <td className="p-0 bg-green-50"><textarea rows="3" className="w-full h-full p-3 text-green-700 font-bold outline-none bg-transparent focus:bg-white block" placeholder="MAP Effect..." value={taskData[`defect_${idx}_map`] || ''} onChange={(e) => handleFieldChange(task.id, `defect_${idx}_map`, e.target.value)}/></td>
                                                                                                                                        </tr>
                                                                                                                                    ));
                                                                                                                                })()}
                                                                                                                            </tbody>
                                                                                                                        </table>
                                                                                                                    </div>
                                                                                                                </div>
                                                                                                            )}



                                                                                                        </div>
                                                                                                    )}
                                                                                                </div>
                                                                                            );
                                                                                        })}
                                                                                    </div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>

                                                                    {!step.noLinks && (<div className="p-6 xl:p-8 bg-white flex-1">
                                                                        <h4 className="font-spartan font-bold text-lg text-slate-900 flex items-center gap-2 mb-6"><FolderOpen size={20} className={themeColorClass} /> Linked Resources</h4>
                                                                        <div className="space-y-3 mb-8">
                                                                            {stepLinks.length === 0 ? (
                                                                                <div className="p-4 border border-dashed border-slate-200 bg-slate-50 text-center"><p className="text-sm text-slate-500 font-medium">No resources linked yet.</p><p className="text-xs text-slate-500/60 mt-1">Attach Pipedrive deals, Teams folders, Infographics, or internal files.</p></div>
                                                                            ) : (
                                                                                stepLinks.map((link, idx) => {
                                                                                    let LinkIconComponent = LinkIcon; let colorClass = "text-slate-500 bg-slate-700/10"; let hoverClass = "hover:border-slate-600/50";
                                                                                    if (link.type === 'teams') { LinkIconComponent = MessageSquare; colorClass = "text-[#6264A7] bg-[#6264A7]/10"; hoverClass = "hover:border-[#6264A7]/50"; } else if (link.type === 'pipedrive') { LinkIconComponent = Briefcase; colorClass = "text-green-500 bg-green-500/10"; hoverClass = "hover:border-green-500/50"; }
                                                                                    return (
                                                                                        <div key={idx} className={`flex items-center gap-4 bg-white p-3 border border-slate-200 transition-colors group ${hoverClass}`}>
                                                                                            <div className={`p-2 rounded shape-80deg shrink-0 ${colorClass}`}><div className="shape-80deg-reverse"><LinkIconComponent size={16} /></div></div>
                                                                                            <a href={link.url} target="_blank" rel="noreferrer" className="flex flex-col flex-1 min-w-0"><span className="text-xs font-bold uppercase tracking-widest text-slate-500/50 mb-0.5">{link.type}</span><span className="text-sm font-bold text-slate-900 group-hover:underline truncate">{link.title}</span></a>
                                                                                            <button onClick={() => deleteLink(step.id, idx)} className="p-2 text-slate-200 hover:text-red-500 transition-colors" title="Remove Resource"><X size={16} /></button>
                                                                                        </div>
                                                                                    )
                                                                                })
                                                                            )}
                                                                        </div>
                                                                        <form onSubmit={(e) => addLink(step.id, e)} className="bg-slate-50 p-5 border border-slate-200">
                                                                            <span className="block text-xs font-spartan font-bold uppercase tracking-widest text-slate-500 mb-4">Attach New Resource</span>
                                                                            <div className="flex flex-col gap-4">
                                                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                                    <select className={`border border-slate-200 p-2 text-sm outline-none focus:border-[${themeHex}] bg-white font-medium text-slate-500`} value={newLinkData.type} onChange={e => setNewLinkData({...newLinkData, type: e.target.value})}><option value="link">General Link / Document</option><option value="pipedrive">Pipedrive Deal</option><option value="teams">MS Teams Map/Chat</option></select>
                                                                                    <input type="text" placeholder="Description (e.g. Trial Report V1)" required className={`border border-slate-200 p-2 text-sm outline-none focus:border-[${themeHex}]`} value={newLinkData.title} onChange={e => setNewLinkData({...newLinkData, title: e.target.value})}/>
                                                                                </div>
                                                                                <div className="flex gap-2">
                                                                                    <input type="url" placeholder="Paste URL (https://...)" required className={`flex-1 border border-slate-200 p-2 text-sm outline-none focus:border-[${themeHex}]`} value={newLinkData.url} onChange={e => setNewLinkData({...newLinkData, url: e.target.value})}/>
                                                                                    <button type="submit" className={`bg-[#084BCD] text-white px-6 py-2 shape-80deg transition-colors hover:${themeBgClass}`}><span className="block shape-80deg-reverse text-sm font-spartan font-bold uppercase tracking-widest">Attach</span></button>
                                                                                </div>
                                                                            </div>
                                                                        </form>
                                                                    </div>)}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
