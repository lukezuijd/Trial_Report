            // File Handling State
            const [dbFileHandle, setDbFileHandle] = useState(null);
            const [fileSaveState, setFileSaveState] = useState(null); // null | 'pending' | 'saving' | 'saved' | 'needs-permission' | 'error'

            // Shared-folder store (board-db.js) — see the SHARED-FOLDER STORE block below
            const [folderState, setFolderState] = useState('checking'); // checking | unsupported | no-folder | needs-permission | ready
            const [viewWithoutFolder, setViewWithoutFolder] = useState(false);
            const [folderName, setFolderName] = useState(null);
            const [needsProductMigration, setNeedsProductMigration] = useState(false);
            const [migrateMsg, setMigrateMsg] = useState(''); // '' | 'working' | 'empty' | 'error' | 'done:<n>'

            // Upload & Import States
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [importStatus, setImportStatus] = useState('idle');
            const [isDragging, setIsDragging] = useState(false);
            const [importedFileName, setImportedFileName] = useState('');
            const [parsedItemCount, setParsedItemCount] = useState(0);
            const [isBackupRestore, setIsBackupRestore] = useState(false);
            
            // Bulk States
            const [isBulkImport, setIsBulkImport] = useState(false);
            const [bulkProductsData, setBulkProductsData] = useState([]);

            // Single Import State
            const [newProductData, setNewProductData] = useState({ name: "", aliases: [], variety: "", state: "whole", targets: [], imageUrl: "", completedTaskIds: [], links: {}, createdAt: null });
            const [importedFormData, setImportedFormData] = useState(null);
            const [mergeTargetId, setMergeTargetId] = useState("new");
            
            // Manual Post-Import Merge Tool State
            const [showMergeModal, setShowMergeModal] = useState(false);
            const [showProductPicker, setShowProductPicker] = useState(false);
            const [productSearch, setProductSearch] = useState('');
            const [pickerExpanded, setPickerExpanded] = useState(new Set()); // expanded product groups in the picker
            const [dashVarietyFilter, setDashVarietyFilter] = useState('all'); // dashboard variety view-filter (per-trial variety)
            const [sheetMsg, setSheetMsg] = useState(''); // product-sheet attach/sync feedback
            const [mergeSourceId, setMergeSourceId] = useState('');
            const [mergeManualTargetId, setMergeManualTargetId] = useState('');
            const [expandedTaskIds, setExpandedTaskIds] = useState(new Set()); // task forms are collapsed by default; click a task to open its form
            const [mergeConflictPending, setMergeConflictPending] = useState(null);   // {type,targetId,sourceId,sourceFD,newProdData}
            const [conflictChoices, setConflictChoices] = useState({});                    // {'tk.fk': 'target'|'source'}

            // The phase whose workspace is open under the workflow overview; none at
            // first — the overview says where the product stands and what is next.
            const [activeStepId, setActiveStepId] = useState(null);
            // Sections the user opened BY HAND. Auto-collapse must never close one
            // of these: typing the last missing value into a section you
            // deliberately opened should not yank it shut under the cursor.
            // Cleared when the product or the workflow step changes — that is the
            // "…or I navigate somewhere else" half of the rule.
            const manuallyOpenedRef = useRef(new Set());
            const selectStep = (id) => { manuallyOpenedRef.current = new Set(); setActiveStepId(id); };
            // Workflow tab sections folded or open (see FoldSection), remembered in
            // this browser.
            const [wfFolds, setWfFolds] = useState(() => { try { return JSON.parse(localStorage.getItem(WF_FOLD_KEY) || '{}') || {}; } catch (e) { return {}; } });
            const foldOpen = (id) => typeof wfFolds[id] === 'boolean' ? wfFolds[id] : WF_FOLD_DEFAULTS[id] !== false;
            const setFoldOpen = (id, open) => setWfFolds(prev => {
                const next = { ...prev, [id]: open };
                try { localStorage.setItem(WF_FOLD_KEY, JSON.stringify(next)); } catch (e) { /* private window: not remembered */ }
                return next;
            });
            // The trial table is grouped per report. Which reports are unfolded
            // (null = the default: the newest report and the rows not linked to one,
            // or all of them when there are few trials); the row being edited — it
            // keeps its group until it is left, or typing a report name would move
            // it from under the cursor (the state only re-renders the table when
            // the cursor leaves a row; which row holds it is read from the page);
            // the group each row sat in last time; and groups a row just moved
            // into, which open so the row stays in view.
            const [trialOpenGroups, setTrialOpenGroups] = useState(null);
            const [trialEditRow, setTrialEditRow] = useState(null);
            const isNarrow = useIsNarrow();
            const [trialCardOpen, setTrialCardOpen] = useState(null); // the trial whose fields are unfolded on a narrow screen
            const [trialReportsAll, setTrialReportsAll] = useState(false); // narrow screen: every report, not the newest eight
            const trialGroupMemoRef = useRef({ productId: null, count: 0, keys: {} });
            const trialMovedOpenRef = useRef(new Set());
            const [newLinkData, setNewLinkData] = useState({ title: '', url: '', type: 'link' });
            const [newTempInputs, setNewTempInputs] = useState({});

            const [localFormData, setLocalFormData] = useState({});
            const [loadedDataId, setLoadedDataId] = useState(null);

            // Autosave: form edits are written automatically ~1s after the last change
            const [autosaveState, setAutosaveState] = useState(null); // null | 'pending' | 'saved' | 'error'
            const localFormDataRef = useRef({});
            const bufferOwnerRef = useRef(null); // the product the editing buffer belongs to
            const autosaveTimerRef = useRef(null);
            useEffect(() => { localFormDataRef.current = localFormData; }, [localFormData]);

            // Trial JSON import state
            const [trialImportRows, setTrialImportRows] = useState([]);
            const [trialProductMappings, setTrialProductMappings] = useState({});
            const [inlineTrialMsg, setInlineTrialMsg] = useState('');

            useEffect(() => {
                if (!auth) { setLoading(false); return; }
                const initAuth = async () => {
                    try { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token); else await signInAnonymously(auth); } catch (err) { console.error(err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); });
                return () => unsubscribe();
            }, []);

            // When auto-selecting on load, land on the family's "All varieties" aggregate if the
            // product has siblings (multiple varieties), so the dashboard opens on the combined
            // overview by default rather than one arbitrary variety.
            // Opened for a specific project or product? Then auto-landing on the first
            // product in the list would show the wrong one — and if the real target
            // never resolves, leave the user sitting on it believing it is theirs.
            // Better to show nothing until the right product is known.
            const opensSomethingSpecific = () => {
                const q = new URLSearchParams(window.location.search);
                return !!(q.get('boardProject') || q.get('product'));
            };

            const familyLandingId = (prod, list) => {
                if (!prod) return null;
                const fam = (list || products).filter(p => p.name === prod.name && p.state === prod.state);
                return fam.length > 1 ? `avg-${prod.name}-${prod.state}` : prod.id;
            };

            useEffect(() => {
                if (!db) return; if (!user) return;
                const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                const unsubscribe = onSnapshot(productsRef, (snapshot) => {
                    const fetchedProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setProducts(fetchedProducts);
                    if (!activeProductId && fetchedProducts.length > 0 && !opensSomethingSpecific()) setActiveProductId(familyLandingId(fetchedProducts[0], fetchedProducts));
                    setLoading(false);
                }, (error) => { console.error(error); setLoading(false); });
                return () => unsubscribe();
            }, [user, activeProductId]);

            // ══ SHARED-FOLDER STORE ═════════════════════════════════════════════
            // Projects and products live in one database: the board's root folder,
            // bound once via the File System Access API and remembered in IndexedDB
            // (board-db.js). That handle survives reloads, so the dashboard no
            // longer needs a database file to be picked at the start of every
            // session — the old single-file flow is kept for backup and exchange.
            //
            // Firebase, when configured, still owns the data; the folder is the
            // local backend only.

            // What was last written per product, so a save only touches records
            // that actually changed rather than rewriting the whole store.
            const lastWrittenRef = useRef(new Map());

            // The rev each product was loaded at, kept OUT of React state on
            // purpose: a save bumps the rev on disk, and writing that back into
            // `products` would change every record's JSON and make the next diff
            // think everything changed. This map is the baseRev each write is
            // checked against — it is what turns a blind overwrite into a
            // detected conflict.
            const productRevsRef = useRef(new Map());
            // size:mtime per record file at the moment we last agreed with disk.
            const diskStampsRef = useRef({});

            // Products someone else changed while we were editing them.
            const [productConflicts, setProductConflicts] = useState([]);
            // The folder moved under us and we are holding unsaved work.
            const [staleOnDisk, setStaleOnDisk] = useState(false);
            // Sync conflict copies and the superseded index file.
            const [folderWarnings, setFolderWarnings] = useState([]);

            // Things in the folder that should not be there. Nothing used to look
            // for these on the product side, which is how a OneDrive copy sat in
            // this database unnoticed until someone opened the folder by hand.
            const scanFolderWarnings = async () => {
                const B = window.PerfoTecBoard;
                try {
                    const [rootArtefacts, legacyIndex] = await Promise.all([
                        B.scanRootArtefacts ? B.scanRootArtefacts() : Promise.resolve([]),
                        B.legacyProductIndexPresent ? B.legacyProductIndexPresent() : Promise.resolve(false)
                    ]);
                    const artefacts = (B.lastSyncArtefacts ? B.lastSyncArtefacts() : [])
                        .concat(rootArtefacts)
                        .filter((n, i, a) => a.indexOf(n) === i);
                    const out = artefacts.map(name => ({ kind: 'artefact', name }));
                    if (legacyIndex) out.push({ kind: 'legacy-index', name: B.PRODUCT_INDEX });
                    setFolderWarnings(out);
                } catch (err) { /* a warning that cannot be gathered is not an error */ }
            };

            // silent: refresh the list without touching what the user is looking
            // at (used by the focus check below, where a jump to another product
            // mid-session would be its own kind of data loss).
            const loadFromFolder = async ({ silent = false } = {}) => {
                const B = window.PerfoTecBoard;
                const [name, hasStore, rawRecords, stamps] = await Promise.all([
                    B.getRootName(), B.hasProductStore(), B.readAllProducts(),
                    B.readProductStamps ? B.readProductStamps() : Promise.resolve({})
                ]);
                const records = (rawRecords || []).map(normalizeProductRecord).filter(Boolean);
                setFolderName(name);
                setProducts(records);
                if (B.readFilms) B.readFilms().then(setFilmReg).catch(() => setFilmReg(null));
                if (B.readHub) B.readHub().then(setHubReg).catch(() => setHubReg(null));
                lastWrittenRef.current = new Map(records.map(r => [r.id, JSON.stringify(r)]));
                productRevsRef.current = new Map(records.map(r => [r.id, Number(r.rev || 0)]));
                diskStampsRef.current = stamps;
                setStaleOnDisk(false);
                setProductConflicts([]);
                scanFolderWarnings();
                if (silent) {
                    // Re-seed the editing buffer for the product on screen. Without
                    // this the refresh is worse than useless: `products` comes back
                    // fresh while localFormData still holds the snapshot taken when
                    // the product was opened, and the next keystroke flushes that
                    // snapshot wholesale over everything that just arrived. The
                    // caller only reaches here with a clean buffer, so this cannot
                    // discard anything the user typed.
                    const act = records.find(r => r.id === activeProductIdRef.current);
                    if (act) setLocalFormData(act.formData || {});
                }
                if (!silent) {
                    // An empty root that has never held products is a first run — offer
                    // to bring the existing database across instead of starting blank.
                    setNeedsProductMigration(!hasStore && records.length === 0);
                    setActiveProductId(prev => prev || ((records.length > 0 && !opensSomethingSpecific()) ? familyLandingId(records[0], records) : null));
                    setFolderState('ready');
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (db) return;                       // Firestore owns the data
                const B = window.PerfoTecBoard;
                if (!B || !B.isSupported()) { setFolderState('unsupported'); setLoading(false); return; }
                let cancelled = false;
                (async () => {
                    try {
                        const perm = await B.permissionState();
                        if (cancelled) return;
                        if (perm === 'none') { setFolderState('no-folder'); setLoading(false); return; }
                        if (perm !== 'granted') { setFolderState('needs-permission'); setLoading(false); return; }
                        await loadFromFolder();
                    } catch (err) {
                        if (cancelled) return;
                        console.error('Loading products from the shared folder failed:', err);
                        setFolderState(err && err.code === 'NEEDS_PERMISSION' ? 'needs-permission' : 'no-folder');
                        setLoading(false);
                    }
                })();
                return () => { cancelled = true; };
            }, [db]);

            const chooseSharedFolder = async () => {
                try {
                    await window.PerfoTecBoard.pickRootFolder();
                    setLoading(true);
                    await loadFromFolder();
                } catch (err) { if (err && err.name !== 'AbortError') console.error(err); }
            };

            const grantSharedFolderAccess = async () => {
                try {
                    const ok = await window.PerfoTecBoard.requestAccess();
                    if (!ok) return;
                    setLoading(true);
                    await loadFromFolder();
                } catch (err) { console.error(err); }
            };

            // One-time migration of PerfoTec_Database.json into the shared folder.
            // The source file is only read — it stays where it is as a backup.
            const migrateDatabaseFile = async (file) => {
                if (!file) return;
                try {
                    setMigrateMsg('working');
                    const backup = JSON.parse(await file.text());
                    const count = await window.PerfoTecBoard.importProductBackup(backup);
                    if (count === 0) { setMigrateMsg('empty'); return; }
                    await loadFromFolder();
                    setNeedsProductMigration(false);
                    setMigrateMsg(`done:${count}`);
                } catch (err) {
                    console.error('Migration failed:', err);
                    setMigrateMsg('error');
                }
            };

            const pickDatabaseFileToMigrate = async () => {
                try {
                    if (window.showOpenFilePicker) {
                        const [h] = await window.showOpenFilePicker({
                            types: [{ description: 'PerfoTec database (JSON)', accept: { 'application/json': ['.json'] } }],
                            multiple: false
                        });
                        await migrateDatabaseFile(await h.getFile());
                    } else {
                        document.getElementById('migrate-upload')?.click();
                    }
                } catch (err) { if (err && err.name !== 'AbortError') console.error(err); }
            };

            // Persist products to the folder: write only the records whose JSON
            // changed, drop files for products that were removed, then refresh the
            // index once. Every existing setProducts(...) call site stays as it is
            // — the diffing happens here, in the write layer.
            // Persist the records that changed, each one checked against the rev
            // it was loaded at. A product someone else has moved on is left alone
            // and reported rather than overwritten, and — importantly — one
            // contested product no longer blocks the save of all the others.
            //
            // There is no index write any more: the product list is derived from
            // the record files (board-db.js). Rebuilding it from this session's
            // in-memory list is what used to delete colleagues' products.
            const writeProductsToFolder = async () => {
                const B = window.PerfoTecBoard;
                const records = productsRef.current.filter(p => p && p.id && !p.isAverage);
                const seen = new Map(records.map(r => [r.id, JSON.stringify(r)]));
                const changed = records.filter(r => lastWrittenRef.current.get(r.id) !== seen.get(r.id));
                const removed = [...lastWrittenRef.current.keys()].filter(id => !seen.has(id));
                if (changed.length === 0 && removed.length === 0) { setFileSaveState(st => st === 'pending' ? 'saved' : st); return { conflicts: 0, failed: false }; }

                setFileSaveState('saving');
                const conflicts = [];
                let failed = null;
                for (const rec of changed) {
                    try {
                        const next = await B.writeProductRecord(rec, { baseRev: productRevsRef.current.get(rec.id) });
                        productRevsRef.current.set(rec.id, Number(next && next.rev) || 0);
                        lastWrittenRef.current.set(rec.id, seen.get(rec.id));
                    } catch (err) {
                        if (err && err.code === 'CONFLICT') {
                            // Deliberately do NOT mark this one as written: the
                            // edit is still pending and the banner offers the
                            // choice. Their version is on disk, ours is parked
                            // under _conflicts/.
                            conflicts.push({ productId: err.productId, theirs: err.theirs, mine: rec });
                        } else {
                            console.error('Saving products to the shared folder failed:', err);
                            failed = err;
                        }
                    }
                }
                for (const id of removed) {
                    try {
                        await B.deleteProduct(id);
                        lastWrittenRef.current.delete(id);
                        productRevsRef.current.delete(id);
                    } catch (err) { console.error('Deleting a product failed:', err); failed = err; }
                }

                if (conflicts.length > 0) {
                    setProductConflicts(prev => {
                        const byId = new Map(prev.map(c => [c.productId, c]));
                        conflicts.forEach(c => byId.set(c.productId, c));
                        return [...byId.values()];
                    });
                }
                // Our own writes must not read as someone else's change on the
                // next focus check.
                try { if (B.readProductStamps) diskStampsRef.current = await B.readProductStamps(); } catch (err) { /* probe only */ }
                if (failed) setFileSaveState(failed.code === 'NEEDS_PERMISSION' ? 'needs-permission' : 'error');
                else if (conflicts.length > 0) setFileSaveState('error');
                else {
                    setFileSaveState('saved');
                    // Board cards held back for this work can go now.
                    if (pendingRetryRef.current) { pendingRetryRef.current = false; setPendingTick(n => n + 1); }
                }
                return { conflicts: conflicts.length, failed: !!failed };
            };

            // ── Staleness check ────────────────────────────────────────────────
            // The dashboard loads once and holds its list for the whole session,
            // so on a shared folder it drifts out of date by the hour. Re-reading
            // blindly would throw away whatever the user has just typed, so:
            // nothing pending → refresh silently; work in flight → say so and let
            // them choose the moment.
            // The folder check and the board-import job (further down) never run at
            // once: a reload that read a product before an import wrote it could land
            // after, and put the product back without the trial. A wake during a job
            // is replayed when the job ends.
            const boardJobRef = useRef(false);
            const refreshBusyRef = useRef(false);
            const wakeDuringJobRef = useRef(false);
            const refreshIfFolderMoved = async () => {
                if (boardJobRef.current) { wakeDuringJobRef.current = true; return; }
                refreshBusyRef.current = true;
                try { await refreshIfFolderMovedNow(); } finally { refreshBusyRef.current = false; }
            };
            const refreshIfFolderMovedNow = async () => {
                const B = window.PerfoTecBoard;
                if (db || folderState !== 'ready' || !B || !B.readProductStamps) return;
                if (B.hasPendingWrites && B.hasPendingWrites()) return;
                try {
                    const stamps = await B.readProductStamps();
                    const before = diskStampsRef.current || {};
                    const ids = new Set([...Object.keys(before), ...Object.keys(stamps)]);
                    let moved = false;
                    ids.forEach(id => { if (before[id] !== stamps[id]) moved = true; });
                    if (!moved) return;

                    // Anything typed but not yet on disk makes an automatic reload
                    // unsafe. Two separate debounces stand between a keystroke and
                    // the folder — the form buffer (autosaveTimerRef, ~1s) and the
                    // folder write (fileSaveTimerRef, ~1.5s) — and beyond those the
                    // buffer itself is a whole-formData snapshot taken when the
                    // product was opened. If it has drifted from the record, the
                    // user has work in hand: say so and let them pick the moment.
                    const act = activeProductRef.current;

            const latestFormData = (productId) => {

            const writeDbToFile = async () => {
                if (!dbFileHandle) return;

` + (recoverable

            const parseRangeMatch = (matchOrString) => {
                if (!matchOrString) return { min: "", max: "" };
                let str = "";
                if (typeof matchOrString === 'string') str = matchOrString;
                else if (Array.isArray(matchOrString) || matchOrString.length) str = matchOrString[1] || matchOrString[0] || "";
                if (!str) return { min: "", max: "" };
                
                let cleanVal = str.replace(/°C/gi, '').replace(/%/g, '').trim();
                const m = cleanVal.match(/(-?[\d.,]+)\s*(?:-|to|tot|t\/m|–)\s*(-?[\d.,]+)/i);
                if (m) return { min: m[1].replace(',', '.'), max: m[2].replace(',', '.') };
                const single = cleanVal.match(/(-?[\d.,]+)/);
                if (single) return { min: single[1].replace(',', '.'), max: single[1].replace(',', '.') };

            };

            /* ══ 2026 product-sheet template — shared readers ═══════════════════════
             * A sheet from the perfotec-product-sheet skill reaches this dashboard by two
             * routes: dropped on the importer as a document (extractProductDataFromText,
             * which creates or merges a product) or attached in the "Product sheet & data
             * sync" panel (handlePullFromSheet, which seeds an existing one). Those routes
             * used to read different subsets of the same file, so the answer depended on
             * how the file arrived — the attach route pulled eight numbers and ignored the
             * defect grid and the entire respiration table sitting in the same document.
             * These readers are the single implementation both call.
             * ==================================================================== */

            // A sheet cell is trilingual: <span data-lang="nl">…</span><span data-lang="en">…
            // Reading textContent concatenates all three ("Optimale bewaringOptimal storage…"),
            // and <br> contributes nothing, so a three-line <h1> collapses into
            // "Green BeansWholeFlowpack Guide". Return the English rendering as real lines.
            const psLangLines = (el, lang, dropEm) => {
                if (!el) return [];
                const clone = el.cloneNode(true);
                clone.querySelectorAll('[data-lang]').forEach(s => { if (s.getAttribute('data-lang') !== lang) s.remove(); });
                // The sheet's <h1> ends in an italic descriptor ("Packaging Guide",
                // "Verpakkingsgids") that is never part of the product name.
                if (dropEm) clone.querySelectorAll('em').forEach(e => e.remove());
                clone.querySelectorAll('br').forEach(br => br.parentNode.replaceChild(br.ownerDocument.createTextNode('\n'), br));
                return clone.textContent.split('\n').map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean);
            };
            const psEnLines = (el) => psLangLines(el, 'en', false);
            const psEnText = (el) => psEnLines(el).join(' ');

            /* ── The product's name in each of the sheet's three languages ──────────
             * A 2026 product sheet titles itself in Dutch, English and Spanish:
             *   <h1><span data-lang="nl">Vers Gesneden<br>Broccoli Roosjes<br><em>…</em>
             *       <span data-lang="en">Fresh-Cut<br>Broccoli Florets<br><em>…</em>
             *       <span data-lang="es">Floretes de<br>Brócoli Frescos<br><em>…</em>
             * That makes the sheet the one place that states the same product's name in
             * every language it is sold under — so importing one settles the naming
             * question outright: English becomes the product's name, Dutch and Spanish
             * become alternative names, and a search in any of the three finds it.
             * -------------------------------------------------------------------- */

            // The processing state is said in the title too — "Fresh-Cut", "Vers
            // Gesneden", "Verwerkte" — and is carried by the product's own `state`
            // field, so it is never part of the name. All three languages are stripped
            // whatever language is being read: a title mixes them more often than not,
            // and no produce is called "whole", "vers" or "entero".
            // "fresh" on its own comes last in the alternation, so "Fresh-Cut" is
            // matched as the compound it is before this ever sees it.
            const PS_STATE_WORDS = /\b(?:fresh[\s-]?cut|freshcut|whole|processed|packaging guide|product guide|specification|fresh|vers\s?gesneden|versgesneden|verwerkte|verwerkt|verse|vers|hele|heel|onbewerkte|onbewerkt|verpakkingsgids|productgids|specificatie|frescos|frescas|fresco|fresca|enteros|enteras|entero|entera|procesados|procesadas|procesado|procesada|gu[ií]a de envasado|especificaci[óo]n)\b/gi;

            // How the product is CUT or presented — not what it is. "Broccoli Florets"
            // is broccoli, "Bloemkool Roosjes" is bloemkool. The cut is carried by the
            // state and the variety, so it is stripped out of every name a sheet
            // yields — the main name AND the alternative ones. An alternative name is
            // the same product said in another language, never the same product said
            // with its cut attached.
            const PS_FORM_WORDS = /\b(?:florets?|spears?|sticks?|batons?|julienne|slices?|sliced|rings?|cubes?|cubed|diced|chunks?|halves|halved|quarters|quartered|wedges|shredded|grated|chopped|trimmed|peeled|crowns?|kernels?|roosjes?|reepjes?|blokjes?|plakjes?|plakken|schijfjes?|stukjes?|stukken|snippers?|geraspte?|geschilde?|gehalveerde?|halve|kwarten|gepelde?|gewassen|gesneden|floretes?|tiras|bastones|cubos|dados|rodajas|rebanadas|trozos|mitades|cuartos|rallad[oa]s?|pelad[oa]s?|lavad[oa]s?|cortad[oa]s?|trocead[oa]s?)\b/gi;

            // A trailing clause like "Without Calyx" or "Zonder Kelk" describes how the
            // product is presented, not what it is called.
            const PS_QUALIFIER = /\s\b(?:without|with|zonder|met|sin|con)\b.*$/i;

            // Taking a word out of the middle of a phrase leaves the preposition that
            // held it there: "Floretes de Brócoli" → "de Brócoli".
            const PS_EDGE_WORDS = /^\s*(?:de|del|of|van|the|el|la|los|las|en|y|and)\b|\b(?:de|del|of|van|the|el|la|los|las|en|y|and)\s*$/gi;

            const psTrim = (s) => s.replace(/\s+/g, ' ').replace(/^[\s\-–—:,.]+|[\s\-–—:,.]+$/g, '').trim();

            // A sheet title reduced to the bare product: "Fresh-Cut Broccoli Florets"
            // and "Floretes de Brócoli Frescos" both come out as the produce alone.
            const psCleanName = (text) => {
                // The older titles carry the pack format in brackets — "Appel (Retail
                // Punnet)", "Blauwe Bessen (Bulk/Transport)". That is the target market,
                // which the product records under `targets`, and the legacy reader has
                // already split it off into the variety by the time it gets here.
                let s = psTrim(String(text || '')
                    .replace(/\([^)]*\)/g, ' ')
                    .replace(PS_STATE_WORDS, ' ')
                    .replace(PS_FORM_WORDS, ' ')
                    .replace(PS_QUALIFIER, ''));
                let prev;
                do { prev = s; s = psTrim(s.replace(PS_EDGE_WORDS, ' ')); } while (s !== prev);
                return s;
            };

            // The product as this sheet titles it in one language, or '' when the sheet
            // does not carry that language or the result is not a plausible name.
            //
            // Every line of the title is read as one phrase, because where the line
            // breaks fall is a matter of layout, not of grammar: English breaks
            // "Fresh-Cut / Broccoli Florets" between the state and the name, while
            // Spanish breaks the very same title mid-phrase, "Floretes de / Brócoli
            // Frescos". Joining first and stripping words after is the only reading
            // that survives both.
            const psProductName = (doc, lang) => {
                const h1 = doc && doc.querySelector('h1');
                // Only the trilingual template states the name per language. An older
                // sheet has a single-language <h1> — usually Dutch — and reading it
                // three times would file the product under a Dutch name in English and
                // then list that same name as its own Spanish alternative.
                if (!h1 || !h1.querySelector('[data-lang="' + lang + '"]')) return '';
                const name = psCleanName(psLangLines(h1, lang, true).join(' '));
                return name.length >= 2 && name.length <= 40 ? name : '';
            };

            /* ── The same three names, in the OLDER sheets ─────────────────────────
             * The pre-2026 sheets are just as trilingual, they only say it elsewhere:
             * the markup is written in one language and the other two sit in a
             *   const translations = { nl: {}, en: { mainTitle: "…" }, es: { … } }
             * object, addressed by each element's data-translate key. The language
             * whose block is EMPTY is the one the markup itself is written in.
             *
             * That object is read as data — scanned for one key — and never evaluated.
             * ------------------------------------------------------------------- */

            // One language's block out of the translations object, brace-matched so a
            // nested object cannot end it early. null when the sheet does not carry
            // that language at all, '' when it carries it empty.
            const psLegacyBlock = (text, lang) => {
                const open = /\btranslations\s*=\s*\{/.exec(text || '');
                if (!open) return null;
                const key = new RegExp('^["\']?' + lang + '["\']?\\s*:\\s*\\{');
                let depth = 1, inStr = null, esc = false, start = -1;
                for (let i = open.index + open[0].length; i < text.length && depth > 0; i++) {
                    const c = text[i];
                    if (esc) { esc = false; continue; }
                    if (c === '\\') { esc = true; continue; }
                    if (inStr) { if (c === inStr) inStr = null; continue; }
                    if (c === '"' || c === "'" || c === '`') { inStr = c; continue; }
                    // A language key is only a language key at the top level.
                    if (start === -1 && depth === 1 && /["'A-Za-z]/.test(c)) {
                        const m = key.exec(text.substr(i, lang.length + 40));
                        if (m) { i += m[0].length - 1; start = i + 1; depth++; continue; }
                    }
                    if (c === '{') depth++;
                    else if (c === '}') { depth--; if (start !== -1 && depth === 1) return text.slice(start, i); }
                }
                return null;
            };

            const psLegacyValue = (block, key) => {
                const m = new RegExp('(?:^|[,{])\\s*["\']?' + key + '["\']?\\s*:\\s*(["\'`])([\\s\\S]*?)\\1').exec(block || '');
                if (!m) return '';
                return m[2].replace(/<[^>]*>/g, ' ').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
            };

            const psLegacyTitle = (doc, text, lang) => {
                const h1 = doc && doc.querySelector('h1');
                const key = h1 && h1.getAttribute('data-translate');
                if (!key) return '';
                const block = psLegacyBlock(text, lang);
                if (block === null) return '';
                const value = psLegacyValue(block, key);
                if (value) return value;
                // An empty block means this language needs no translation — the page as
                // written IS this language.
                return block.trim() === '' ? (h1.textContent || '').replace(/\s+/g, ' ').trim() : '';
            };

            // One name per language, whichever of the two sheet generations this is.
            const psNameFor = (doc, text, lang) => {
                const fromSpans = psProductName(doc, lang);
                if (fromSpans) return fromSpans;
                const name = psCleanName(psLegacyTitle(doc, text, lang));
                return name.length >= 2 && name.length <= 40 ? name : '';
            };

            // The bare product name per language. English is what the product is filed
            // under; the other two become its alternative names.
            const psNamesByLang = (doc, text) => ({
                en: psNameFor(doc, text, 'en'),
                nl: psNameFor(doc, text, 'nl'),
                es: psNameFor(doc, text, 'es'),
            });

            const psIsNewFormat = (doc) =>
                doc.querySelectorAll('.card-eyebrow').length > 0 ||
                doc.querySelectorAll('.t-target').length > 0 ||
                doc.querySelectorAll('.resp-row').length > 0;

            // Respiration is quoted per HOUR, and the unit is not fixed across sheets:
            // "CO₂ ml/kg·hr" (Green Beans) but "CO₂ mg/kg·hr" + "O₂ mg/kg·hr" (Cape
            // Gooseberry). The dashboard's matrix is mL/kg/24h. Assuming ml and multiplying
            // by 24 made every mg sheet come out ~2x too high, so the unit and the gas are
            // read from the column header instead of assumed from the column position.
            // mg → mL uses the ideal-gas molar volume at 0 °C / 1 atm (22.414 L/mol).
            const PS_MG_PER_ML = { CO2: 44.01 / 22.414, O2: 32.00 / 22.414 };

            // "12,0 – 15,0" → 13.5 · "25" → 25 · "—" → null
            const psAvgNumber = (txt) => {
                const s = String(txt || '').replace(/,/g, '.');
                const range = s.match(/(-?[\d.]+)\s*(?:–|-|to)\s*(-?[\d.]+)/);
                if (range) return (parseFloat(range[1]) + parseFloat(range[2])) / 2;
                const one = s.match(/-?[\d.]+/);
                return one ? parseFloat(one[0]) : null;
            };

            // Classify a respiration column from its header: which gas, and which unit.
            // Returns null for the columns that are not a respiration rate (W/kg, W/ton,
            // kcal, Factor, Status) so they can never be mistaken for one.
            const psRespColumn = (header) => {
                const h = String(header || '').toLowerCase();
                if (/w\/kg|w\/ton|kcal|factor|status|temp/.test(h)) return null;
                if (!/\/\s*kg/.test(h)) return null;                 // must be a per-kg rate
                const gas = /co\s*₂|co\s*2/.test(h) ? 'CO2' : (/o\s*₂|o\s*2/.test(h) ? 'O2' : null);
                if (!gas) return null;
                const unit = /\bmg\b/.test(h) ? 'mg' : (/\bm+l\b|µl|ul/.test(h) ? 'ml' : null);
                if (!unit) return null;
                return { gas, unit };
            };

            const psToMlPerKgPerDay = (value, gas, unit) => {
                if (value == null || !(value > 0)) return null;
                const mlPerHour = unit === 'mg' ? value / PS_MG_PER_ML[gas] : value;
                return (mlPerHour * 24).toFixed(1);
            };

            /* Sheet section 2 (Respiration & Temperature) → target_temp{T}_O2 / _CO2.
             * The table is preferred over the .resp-row bar visual because it can carry
             * both gases; the bars only ever carry one and are used to fill gaps. */
            const psExtractRespiration = (doc) => {
                const out = {};
                const seen = new Set();

                doc.querySelectorAll('table').forEach(table => {
                    const headers = [...table.querySelectorAll('tr')][0]
                        ? [...[...table.querySelectorAll('tr')][0].children].map(c => psEnText(c) || c.textContent)
                        : [];
                    if (!headers.length) return;
                    const tempCol = headers.findIndex(h => /temp/i.test(h));
                    if (tempCol < 0) return;
                    const gasCols = headers.map((h, i) => (i === tempCol ? null : psRespColumn(h)));
                    if (!gasCols.some(Boolean)) return;

                    table.querySelectorAll('tr').forEach(row => {
                        const cells = [...row.querySelectorAll('td')];
                        if (!cells.length || !cells[tempCol]) return;
                        // "5,0 – 7,5 °C ★" → 5 : the row's lower bound is its identity in the matrix.
                        const tM = psEnText(cells[tempCol]).replace(/,/g, '.').match(/-?[\d.]+/);
                        if (!tM) return;
                        const temp = parseFloat(tM[0]);
                        gasCols.forEach((col, i) => {
                            if (!col || !cells[i]) return;
                            const rr = psToMlPerKgPerDay(psAvgNumber(psEnText(cells[i])), col.gas, col.unit);
                            if (!rr) return;
                            out[`target_temp${temp}_${col.gas}`] = rr;
                            seen.add(temp);
                        });
                    });
                });

                // Bar visual: "15,0 ml/kg·h" or "25 mg CO₂/kg·h" — the unit and gas live in
                // the value text here rather than in a header.
                doc.querySelectorAll('.resp-row').forEach(row => {
                    const tTxt = psEnText(row.querySelector('.resp-temp'));
                    const vTxt = psEnText(row.querySelector('.resp-val'));
                    if (!tTxt || !vTxt) return;
                    const tM = tTxt.replace(/,/g, '.').match(/-?[\d.]+/);
                    if (!tM) return;
                    const temp = parseFloat(tM[0]);
                    if (seen.has(temp)) return;                      // table already covered it
                    const unit = /\bmg\b/i.test(vTxt) ? 'mg' : 'ml';
                    const gas = /o\s*₂|o\s*2/i.test(vTxt) && !/co\s*₂|co\s*2/i.test(vTxt) ? 'O2' : 'CO2';
                    const rr = psToMlPerKgPerDay(psAvgNumber(vTxt), gas, unit);
                    if (rr) out[`target_temp${temp}_${gas}`] = rr;
                });

                // The matrix charts O₂ and CO₂ separately, but most sheets publish only one
                // gas. Mirror it rather than leave half the curve blank — an RQ of 1 is the
                // dashboard's own default assumption (p1-core-1.rq).
                //
                // Only when the other gas is absent EVERYWHERE, though. Cape Gooseberry
                // quotes O₂ at two of its four temperatures and "—" at the rest; filling
                // those gaps from CO₂ would hand calculateQ10 an O₂ curve made of two
                // measured points and two invented ones, and it regresses O₂ in preference
                // to CO₂ — so the headline Q₁₀ would be derived from numbers the sheet never
                // stated. A short honest curve beats a long fabricated one.
                const gasesPresent = { O2: false, CO2: false };
                Object.keys(out).forEach(k => {
                    const m = k.match(/^target_temp(-?[\d.]+)_(O2|CO2)$/);
                    if (m) gasesPresent[m[2]] = true;
                });
                if (gasesPresent.O2 !== gasesPresent.CO2) {
                    Object.keys(out).forEach(k => {
                        const m = k.match(/^target_temp(-?[\d.]+)_(O2|CO2)$/);
                        if (!m) return;
                        out[`target_temp${m[1]}_${m[2] === 'O2' ? 'CO2' : 'O2'}`] = out[k];
                    });
                }
                return out;
            };

            /* Sheet section 5 (Defects & PerfoTec prevention) → the p1-core-4 defect matrix.
             * Each .defect-card carries a name, a cause, and prevention rows tagged MHP or
             * MAP; the matrix keeps them as flat defect_{i}_* keys. */
            const psExtractDefects = (doc) => {
                const cards = doc.querySelectorAll('.defect-card');
                const data = {};
                cards.forEach((card, idx) => {
                    data[`defect_${idx}_name`] = psEnText(card.querySelector('.defect-name'));
                    data[`defect_${idx}_cause`] = psEnText(card.querySelector('.defect-cause'));
                    const mhp = [], map = [];
                    card.querySelectorAll('.prev-row').forEach(row => {
                        const tag = row.querySelector('.prev-tag');
                        const txt = psEnText(row.querySelector('.prev-text'));
                        if (!tag || !txt) return;
                        // The tag class is the reliable signal; its text is styled/localised.
                        const cls = tag.className || '';
                        if (/mhp/i.test(cls) || /mhp/i.test(tag.textContent)) mhp.push(txt);
                        else if (/map/i.test(cls) || /map/i.test(tag.textContent)) map.push(txt);
                    });
                    data[`defect_${idx}_mhp`] = mhp.join(' | ');
                    data[`defect_${idx}_map`] = map.join(' | ');
                });
                return { data, count: cards.length };
            };

            const extractProductDataFromText = (text, fileName) => {
                const getEnTranslation = (key, fallbackDOM) => {
                    if (!key) return fallbackDOM ? (fallbackDOM.innerText || fallbackDOM.textContent).trim() : "";
                    const regex = new RegExp(`${key}\\s*:\\s*(["'\`])([\\s\\S]*?)\\1`, 'i');
                    const match = text.match(regex);
                    if (match) return match[2].replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(?:b|i|strong|em|span|div|p|ul|li)[^>]*>/gi, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
                    return fallbackDOM ? (fallbackDOM.innerText || fallbackDOM.textContent).trim() : ""; 
                };

                const parser = new DOMParser(); 
                const doc = parser.parseFromString(text, 'text/html');

                let cleanName = fileName.replace(/\.[^/.]+$/, ""); 
                let extractedVariety = "";
                const mainTitleKey = doc.querySelector('h1')?.getAttribute('data-translate');
                const enMainTitle = getEnTranslation(mainTitleKey, doc.querySelector('h1')) || cleanName;
                
                let baseNameString = enMainTitle
                    .replace(/Product Sheet\s*-?/gi, '')
                    .replace(/Infographic Blueprint:?/gi, '')
                    .replace(/Logistiek, Business Case, Proces/gi, '')
                    .replace(/Whole /gi, '')
                    .replace(/Processed /gi, '')
                    .replace(/Verse /gi, '')
                    .replace(/Hele /gi, '')
                    .replace(/\(Retail\)/gi, '')
                    .replace(/\(Bulk\)/gi, '')
                    .replace(/\(Export\)/gi, '')
                    .replace(/\(sliced\)/gi, '')
                    .replace(/MAP Infographic/gi, '')
                    .replace(/Topseal/gi, '')
                    .replace(/Gesneden/gi, '')
                    .trim();

                const titleMatch = baseNameString.match(/(.*?)\s*\((.*?)\)/);
                if (titleMatch) { cleanName = titleMatch[1].trim(); extractedVariety = titleMatch[2]; } 
                else { cleanName = baseNameString.replace(/\(.*?\)/g, '').trim(); }
                // 2026 template: the <h1> is three <br>-separated lines inside one English
                // span — product / state / descriptor. textContent runs them together, and
                // the result ("Green BeansWholeFlowpack Guide", "Cape GooseberryWithout
                // Calyx") is under the 30-character soup threshold below, so it used to sail
                // through as the product name and then failed to match the existing product.
                // Read the lines and keep the first.
                const psH1Lines = psEnLines(doc.querySelector('h1'));
                if (psH1Lines.length > 1) {
                    const first = psH1Lines[0]
                        .replace(/Fresh.?Cut\s*/gi, '').replace(/Packaging Guide/gi, '')
                        .replace(/Product Guide/gi, '').replace(/Specification/gi, '').trim();
                    if (first.length >= 2 && first.length < 40) cleanName = first;
                }

                // A trilingual sheet names the product in all three languages, and the
                // English one is what the dashboard files it under — always, whatever
                // the filename or the earlier guesses said. The bare product name, not
                // the sheet's full title: "Broccoli", not "Fresh-Cut Broccoli Florets".
                // Every title it does carry is kept as an alternative name below.
                const psNames = psNamesByLang(doc, text);
                if (psNames.en) cleanName = psNames.en;

                // New-format: if cleanName looks like multilingual soup (mixed langs / too long),
                // extract from the English data-lang span of h1 or from the <title> tag
                if (cleanName.length > 30 || cleanName.match(/bleekselderij|apio\b|frais|gesneden|procesado/i)) {
                    const h1En = doc.querySelector('h1 [data-lang="en"]');
                    if (h1En) {
                        const h1Txt = h1En.textContent.trim().replace(/\s+/g, ' ')
                            .replace(/Fresh.?Cut\s*/gi, '').replace(/Packaging Guide/gi, '')
                            .replace(/Product Guide/gi, '').replace(/Specification/gi, '').trim();
                        if (h1Txt.length >= 2 && h1Txt.length < 40) cleanName = h1Txt;
                    }
                    if (cleanName.length > 30 || cleanName.match(/bleekselderij|apio\b|frais|gesneden|procesado/i)) {
                        const titleEl = doc.querySelector('title');
                        if (titleEl) {
                            const titleTxt = titleEl.textContent
                                .replace(/Fresh.?Cut\s*/gi, '')
                                .replace(/\s*[—|].*$/i, '').replace(/Product Specification/gi, '').trim();
                            if (titleTxt.length >= 2 && titleTxt.length < 40) cleanName = titleTxt;
                        }
                    }
                }
                // Whichever of the routes above produced the name, the product is filed
                // under the produce and not under how it was cut: "Bleekselderij", not
                // "Verwerkte Bleekselderij"; "Bloemkool", not "Bloemkool Roosjes". The
                // older single-language sheets go through here too — they never reach
                // the trilingual reader — and they are the ones that state the cut in
                // the title most often. A title that is NOTHING but a cut is left
                // alone; stripping it would leave the product with no name at all.
                const psBare = psCleanName(cleanName, true);
                if (psBare.length >= 2) cleanName = psBare;

                cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

                let extractedState = "whole";
                const domSubTitle = doc.querySelector('h2')?.textContent || "";
                const subTitleKey = doc.querySelector('h2')?.getAttribute('data-translate') || doc.querySelector('p.text-lg')?.getAttribute('data-translate');
                const enSubTitle = getEnTranslation(subTitleKey, doc.querySelector('h2') || doc.querySelector('p.text-lg'));

                if (enMainTitle.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    fileName.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    enSubTitle.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    doc.body.textContent.toLowerCase().match(/versgesneden/i)) {
                    extractedState = "processed";
                }
                
                const defaultTargets = extractedState === 'processed' ? ['retail', 'liner'] : ['retail', 'liner', 'pallet'];
                
                let imgUrl = ""; const imgEl = Array.from(doc.querySelectorAll('img')).find(img => !img.src.includes('logo') && !img.alt.toLowerCase().includes('logo'));
                if (imgEl) imgUrl = imgEl.getAttribute('src');

                let targetO2Text = "", targetCO2Text = "", storageTempText = "", targetRHText = "";
                let acp = "", critCO2 = "";
                let explicitQ10 = "";  // captured from new-format Q₁₀ card

                const conditionBlocks = Array.from(doc.querySelectorAll('.condition-block'));
                conditionBlocks.forEach(block => {
                    const titleKey = block.querySelector('.condition-title')?.getAttribute('data-translate') || "";
                    const titleEn = getEnTranslation(titleKey, block.querySelector('.condition-title'));
                    const valText = block.querySelector('.condition-value')?.textContent || "";
                    const fullBlockText = block.textContent || "";

                    if ((titleEn.includes('O₂') || titleEn.includes('Oxygen')) && !titleEn.includes('CO₂') && !titleEn.includes('Carbon')) {
                        targetO2Text = valText;
                        const m = fullBlockText.match(/(?:Afwijking|Deviation|Risk|Risico|Anaerobic|ACP)[^0-9<]*<?\s*([\d.,]+)\s*%/i) || fullBlockText.match(/<\s*([\d.,]+)\s*%/i);
                        if(m) acp = m[1].replace(',', '.');
                    } else if (titleEn.includes('CO₂') || titleEn.includes('Carbon')) {
                        targetCO2Text = valText;
                        const m = fullBlockText.match(/(?:Afwijking|Deviation|Risk|Risico|Kritisch|Critical|Max)[^0-9>]*>?\s*([\d.,]+)\s*%/i) || fullBlockText.match(/>\s*([\d.,]+)\s*%/i);
                        if(m) critCO2 = m[1].replace(',', '.');
                    } else if (titleEn.includes('Temp') || titleEn.includes('Chain')) {
                        storageTempText = valText;
                    } else if (titleEn.includes('RH') || titleEn.includes('Vocht') || titleEn.includes('Humidity')) {
                        targetRHText = valText;
                    }
                });

                // Raw-HTML fallbacks for when the DOM query finds the blocks but the title
                // matching logic misses them (e.g. a Dutch title that wasn't in the translation map).
                if (!storageTempText) {
                    // Look for data-translate="cond_temp_title" → nearby condition-value in raw HTML
                    const m = text.match(/data-translate="cond_temp_title"[\s\S]{1,500}?<div[^>]*class="[^"]*condition-value[^"]*">([^<]+)<\/div>/i);
                    if (m) storageTempText = m[1].trim();
                }
                if (!storageTempText) {
                    // Broader fallback: any condition-block whose title key contains "temp"
                    const m = text.match(/data-translate="cond_\w*temp\w*"[\s\S]{1,500}?<div[^>]*class="[^"]*condition-value[^"]*">([^<]+)<\/div>/i);
                    if (m) storageTempText = m[1].trim();
                }

                const fullSearchText = doc.body.textContent + " " + text;


                // ── New-format product-sheet detection ─────────────────────────────────
                // Fires when the file uses the new PerfoTec spec-sheet layout:
                //   .card-eyebrow / .card-value  (ACP, Q₁₀, optimal storage, …)
                //   td.t-param / td.t-target / td.t-warn  (parameters table)
                //   .resp-row / .resp-val  (respiration vs temperature visual)
                //   .defect-card  (defect-prevention grid)
                // These CSS classes do NOT appear in the older product-sheet format
                // (which uses .condition-block / data-translate), so the two paths
                // are mutually exclusive and cannot interfere with each other.
                const hasNewPSFormat =
                    doc.querySelectorAll('.card-eyebrow').length > 0 ||
                    doc.querySelectorAll('.t-target').length > 0   ||
                    doc.querySelectorAll('.resp-row').length > 0;

                // Helper: extract English text from a multilingual element
                // (first looks for a [data-lang="en"] child span, falls back to textContent)
                const getNewFmtEnText = el => {
                    if (!el) return '';
                    const en = el.querySelector('[data-lang="en"]');
                    return (en ? en.textContent : el.textContent).trim().replace(/\s+/g, ' ');
                };

                // Lower safe temperature as stated by the parameter table's own warning cell,
                // read below in preference to the prose regexes.
                let nfMinTempText = "";

                if (hasNewPSFormat) {
                    // 1. Card pairs (card-eyebrow → card-value)
                    doc.querySelectorAll('.card').forEach(card => {
                        const eyebrow = card.querySelector('.card-eyebrow');
                        const valEl   = card.querySelector('.card-value');
                        if (!eyebrow || !valEl) return;
                        const label = eyebrow.textContent.toLowerCase().replace(/\s+/g, ' ');
                        const val   = valEl.textContent.trim();
                        // ACP card: "0,5 – 1,0% O₂" → extract lower bound
                        if ((label.includes('acp') || label.includes('anaerob')) && !acp) {
                            const m = val.match(/([\d.,]+)/);
                            if (m) acp = m[1].replace(',', '.');
                        }
                        // Q₁₀ card: "3,7×" → "3.7"
                        if ((label.includes('q') && (label.includes('10') || label.includes('₁₀'))) && !explicitQ10) {
                            const m = val.match(/([\d.,]+)/);
                            if (m) explicitQ10 = m[1].replace(',', '.');
                        }
                        // Optimal storage card: "0 – 4 °C"
                        if ((label.includes('storage') || label.includes('bewaring') || label.includes('almacen') || label.includes('optimal')) && !storageTempText) {
                            const m = val.match(/([\d.,]+(?:\s*[-–]\s*[\d.,]+)?)\s*°C/i);
                            if (m) storageTempText = m[0].trim();
                        }
                        // Critical CO₂ card: ">15,0% CO₂". This is the sheet stating the
                        // tolerance limit outright, so it outranks anything inferred from a
                        // warning cell below.
                        if ((label.includes('critical co') || label.includes('kritieke co') || label.includes('kritische co') || label.includes('crítico')) && !critCO2) {
                            const m = val.match(/([\d.,]+)/);
                            if (m) critCO2 = m[1].replace(',', '.');
                        }
                    });

                    // 2. Parameters table (t-param / t-target / t-warn rows)
                    let nfCO2SteadyText = "", nfCO2BurstText = "";
                    doc.querySelectorAll('tr').forEach(row => {
                        const pCell = row.querySelector('td.t-param');
                        const tCell = row.querySelector('td.t-target');
                        const wCell = row.querySelector('td.t-warn');
                        if (!pCell || !tCell) return;
                        const pLow = pCell.textContent.toLowerCase().replace(/\s+/g, ' ');
                        const tTxt = tCell.textContent.replace(/\s+/g, ' ').trim();
                        const wTxt = wCell ? wCell.textContent : '';
                        // O₂ target
                        if ((pLow.includes('o₂') || pLow.includes('o2')) && !targetO2Text) {
                            targetO2Text = tTxt;
                            const acpM = wTxt.match(/(?:acp)[^0-9]*([\d.,]+)/i);
                            if (acpM && !acp) acp = acpM[1].replace(',', '.');
                        }
                        // CO₂ initial burst → a target range only.
                        if ((pLow.includes('co₂') || pLow.includes('co2')) && (pLow.includes('burst') || pLow.includes('initial') || pLow.includes('start') || pLow.includes('startburst'))) {
                            nfCO2BurstText = tTxt;
                        }
                        // CO₂ steady-state → preferred target
                        if ((pLow.includes('co₂') || pLow.includes('co2')) && pLow.includes('steady')) {
                            nfCO2SteadyText = tTxt;
                        }
                        // Critical CO₂ from a warning cell, but ONLY where the warning states
                        // an upper bound: "> 15,0% = internal browning". This used to take the
                        // first number in the burst row's warning, which in this template is
                        // timing text — "24–48 hours after packing" — so Green Beans imported a
                        // critical CO₂ of 24%. A "<" bound is the opposite claim (Cape
                        // Gooseberry's "<4,0% = inhibition lost" is where the effect stops, not
                        // where damage starts) and must not be read as a limit either.
                        if ((pLow.includes('co₂') || pLow.includes('co2')) && !critCO2) {
                            const upper = wTxt.replace(/,/g, '.').match(/>\s*([\d.]+)\s*%/);
                            if (upper) critCO2 = upper[1];
                        }
                        // RH
                        if ((pLow.includes(' rh') || pLow.includes('humidity') || pLow.includes('vochtig') || pLow.includes('relativ')) && !targetRHText) {
                            targetRHText = tTxt;
                        }
                        // Temperature
                        if (pLow.startsWith('temp') || pLow.includes('temperat')) {
                            if (!storageTempText) storageTempText = tTxt;
                            // "<5,0 °C = chilling injury · >7,5 °C = senescence" — the lower
                            // bound is the minimum safe temperature. The template writes the
                            // threshold BEFORE the words, which the keyword-then-number regex
                            // further down cannot see: it read forward from "chilling injury"
                            // and picked up the senescence figure instead (7,5 for Green Beans,
                            // 7 for Cape Gooseberry, where the answers are 5,0 and 4).
                            const lo = wTxt.replace(/,/g, '.').match(/<\s*(-?[\d.]+)\s*°?\s*C/i);
                            if (lo && !nfMinTempText) nfMinTempText = lo[1];
                        }
                    });
                    // Prefer steady-state CO₂ as the MAP target; fall back to burst range
                    if (!targetCO2Text) targetCO2Text = nfCO2SteadyText || nfCO2BurstText;
                }

                let o2Raw = targetO2Text || (fullSearchText.match(/(?:O2|Zuurstof)[^0-9]*?(?:doel|target|optimaal|MAP)[^0-9]*?([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/MAP\s*\([^0-9]*([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%\s*O[₂2])/i));
                const o2Range = parseRangeMatch(o2Raw);

                let co2Raw = targetCO2Text || (fullSearchText.match(/(?:CO2|Koolstofdioxide)[^0-9]*?(?:doel|target|optimaal|MAP)[^0-9]*?([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/MAP\s*\(.*?(?:,|;|en|and)\s*([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%\s*CO[₂2])/i));
                const co2Range = parseRangeMatch(co2Raw);

                let tempRaw = storageTempText
                    || fullSearchText.match(/(?:opslag|koeling|bewaren|temperatuur)[^0-9]*?(?:bij|tot|rond|circa|:)\s*([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*°?C)/i)
                    || fullSearchText.match(/(?:Temp(?:eratuur)?|Chain)\s*(?:\([^)]*\))?\s*(?:Target|Doel|Objetivo)?\s*[:\-]\s*(-?[\d.,]+(?:\s*(?:tot|-|–)\s*-?[\d.,]+)?\s*°?C)/i);
                const tempRange = parseRangeMatch(tempRaw);
                
                let rhRaw = targetRHText || fullSearchText.match(/(?:RH|Vocht|Humidity|Luchtvochtigheid)[^0-9]*?(?:doel|target|optimaal)[^0-9]*?([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*%)\s*(?:RH|Vocht|Humidity)/i);
                const rhRange = parseRangeMatch(rhRaw);

                if (!acp) {
                    let acpMatch = fullSearchText.match(/(?:Anaerobic Compensation Point|ACP|fermentation|anaeroob)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Afwijking|Deviation|Risico)[^0-9<]*<\s*([\d.,]+)\s*%/i) || fullSearchText.match(/<\s*([\d.,]+)\s*%\s*O[₂2]/i);
                    if (acpMatch) acp = acpMatch[1].replace(',', '.');
                }

                // The parameter table's own warning cell wins when the sheet has one: it is
                // the product's stated floor rather than a number scraped out of prose.
                let minTemp = nfMinTempText;
                // Only match explicit chilling-injury / cold-tolerance keywords — the old `<` alternative
                // caused false positives from HTML tags like `<strong>0°C` or `<p>Temp: 10-15°C`.
                // Fallback: use the lowest value of the storage target temp range.
                let minTempMatch = !minTemp && (
                    // Threshold stated BEFORE the words: "<5,0 °C = chilling injury". Anchored on
                    // "<" so it cannot match an HTML tag, and the gap is kept short so it cannot
                    // reach across a sentence into an unrelated figure.
                    // Character class deliberately ordered ">" before "<". In the other order
                    // the two brackets sit adjacent, which publish.mjs's tag-balance check
                    // reads as an opened JSX fragment and refuses the release over. Identical
                    // character set either way, so the order is the whole point — do not tidy.
                    fullSearchText.match(/<\s*(-?[\d.,]+)\s*°?\s*C[^.;><]{0,24}?(?:chilling injury|koudeschade|koudebederf)/i)
                    || fullSearchText.match(/(?:chilling injury|koudeschade|koudebederf|vriesschade|freezing)[^0-9]*([\d.,]+)(?:\s*(?:tot|-)\s*([\d.,]+))?\s*°?C/i)
                    || fullSearchText.match(/(?:onder de|below)\s*([\d.,]+)(?:\s*(?:tot|-)\s*([\d.,]+))?\s*°?C/i)
                );
                if (!minTemp && minTempMatch) minTemp = minTempMatch[1].replace(',', '.');
                else if (!minTemp && tempRange.min !== "") minTemp = tempRange.min;

                if (!critCO2) {
                    let critCO2Match = fullSearchText.match(/(?:Critical CO2|Max CO2|Kritische CO2|schade)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Afwijking|Deviation|Risico)[^0-9>]*>\s*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Too high CO2|Te hoge CO2)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/>\s*([\d.,]+)\s*%\s*(?:CO[₂2]|Veroorzaakt|causes|leidt)/i);
                    if (critCO2Match) critCO2 = critCO2Match[1].replace(',', '.');
                }

                let ethyleneClass = "";
                const ethSources = fullSearchText.toLowerCase();
                if (ethSources.match(/climacteri/)) {
                    if (ethSources.match(/non-?climacteri/)) ethyleneClass = "Type 3: Non-Climacteric (Low prod / Low sens.)";
                    else ethyleneClass = "Type 2: Climacteric (High prod / High sens.)";
                }
                else if (ethSources.includes('ethyleen') || ethSources.includes('ethylene')) {
                    if (ethSources.includes('gevoelig') || ethSources.includes('sensitive')) ethyleneClass = "Type 1: Sensitive (Low prod / High sens.)";
                    else ethyleneClass = "Type 4: Producers (High prod / Low sens.)";
                }
                
                // These two land in <select> fields, so the string has to be one of the options
                // that field renders or the value is simply not selectable and the field shows
                // blank — data extracted correctly and then thrown away at the last step.
                // Kept verbatim in sync with the p1-core-1 / p1-core-4 formGroups above.
                let vpdSens = "Medium";
                if (ethSources.match(/shrivel|uitdroging|turgor|dehydrat|verschrompel/i)) vpdSens = "Extreme (high shriveling risk)";
                else if (ethSources.match(/verwelk|droogte/i)) vpdSens = "High";

                let condRisk = "Medium";
                if (ethSources.match(/botrytis|penicillium|schimmel|mold|rot|condens/i)) condRisk = "High — use anti-fog or high-MVTR film";
                
                let primaryT = "Discoloration / Browning";
                let secondaryT = "None";
                if (ethSources.match(/shrivel|uitdroging/i)) secondaryT = "Dehydration / Shriveling";
                if (ethSources.match(/botrytis|schimmel|mold|rot/i)) {
                    if (secondaryT === "None") secondaryT = "Mold / Rot / Botrytis";
                    else if (!ethSources.match(/bruining|discolor/i)) { primaryT = "Mold / Rot / Botrytis"; secondaryT = "Dehydration / Shriveling"; }
                }

                const defectData = {}; let extractedDefectCount = 0;
                const dataTable = doc.querySelector('.data-table'); 
                if (dataTable) {
                    const rows = dataTable.querySelectorAll('tbody tr'); extractedDefectCount = rows.length; 
                    rows.forEach((row, idx) => {
                        const cells = row.querySelectorAll('td');
                        if (cells.length >= 4) {
                            defectData[`defect_${idx}_name`] = getEnTranslation(cells[0].getAttribute('data-translate'), cells[0]);
                            defectData[`defect_${idx}_cause`] = getEnTranslation(cells[1].getAttribute('data-translate'), cells[1]);
                            defectData[`defect_${idx}_mhp`] = getEnTranslation(cells[2].getAttribute('data-translate'), cells[2]);
                            defectData[`defect_${idx}_map`] = getEnTranslation(cells[3].getAttribute('data-translate'), cells[3]);
                        }
                    });
                }


                // ── New-format defects (.defect-card grid) ──────────────────────────────
                // Populates defectData only when the old .data-table path found nothing.
                // Shared with the attach/pull route via psExtractDefects, so a sheet yields
                // the same defect matrix however it reaches the dashboard.
                if (hasNewPSFormat && extractedDefectCount === 0) {
                    const nfDefects = psExtractDefects(doc);
                    if (nfDefects.count > 0) {
                        extractedDefectCount = nfDefects.count;
                        Object.assign(defectData, nfDefects.data);
                    }
                }

                const rrData = {};
                const resLists = [
                    getEnTranslation(doc.querySelector('[data-translate="res_list_1"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_1"]')),
                    getEnTranslation(doc.querySelector('[data-translate="res_list_2"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_2"]')),
                    getEnTranslation(doc.querySelector('[data-translate="res_list_3"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_3"]'))
                ];

                let foundRR = false;
                const TEMP_RE = /(-?\d+(?:[.,]\d+)?)\s*(?:(?:-|–|to|tot)\s*-?\d+(?:[.,]\d+)?\s*)?°\s*C/i;
                // The 2026 spec sheet's respiration table goes first: it names the gas and
                // the unit (ml or mg) per column. The free-text paths below assume ml and
                // matched stray text on those sheets before the table was ever read.
                if (hasNewPSFormat) {
                    const nfRR = psExtractRespiration(doc);
                    if (Object.keys(nfRR).length > 0) { foundRR = true; Object.assign(rrData, nfRR); }
                }
                // Path 1: bullet points with explicit ml values (e.g. "0°C: 4 - 8 ml/kg/h")
                if (!foundRR) resLists.forEach(listItem => {
                    if (!listItem) return;
                    const tempMatch = listItem.match(TEMP_RE);
                    if (tempMatch) {
                        const temp = parseFloat(tempMatch[1].replace(',', '.'));
                        const valRangeMatch = listItem.match(/:\s*[^0-9-]*([\d.,]+)\s*(?:-\s*([\d.,]+))?\s*ml/i);
                        let avg = 0;
                        if (valRangeMatch) avg = valRangeMatch[2] ? (parseFloat(valRangeMatch[1].replace(',', '.')) + parseFloat(valRangeMatch[2].replace(',', '.'))) / 2 : parseFloat(valRangeMatch[1].replace(',', '.'));
                        if (avg > 0) { foundRR = true; const rr24h = avg * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                });

                // Path 2: free text "X°C … Y-Z ml" patterns
                if (!foundRR) {
                    const rrMatches = fullSearchText.matchAll(/(-?\d+(?:[.,]\d+)?)\s*(?:(?:-|–|to|tot)\s*-?\d+(?:[.,]\d+)?\s*)?°\s*C.*?([\d.,]+)\s*(?:-|tot|to)\s*([\d.,]+)\s*ml/gi);
                    for (const match of rrMatches) {
                        foundRR = true;
                        const temp = parseFloat(match[1].replace(',', '.'));
                        const avg = match[3] ? (parseFloat(match[2].replace(',', '.')) + parseFloat(match[3].replace(',', '.'))) / 2 : parseFloat(match[2].replace(',', '.'));
                        if (avg > 0) { const rr24h = avg * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                }

                // Path 3: "respiration/ademhaling X°C … Y ml" single-value pattern
                if (!foundRR) {
                    const rrSingleMatches = fullSearchText.matchAll(/(?:respiration|ademhaling)[^0-9-]*(-?\d+(?:[.,]\d+)?)\s*(?:(?:-|–|to|tot)\s*-?\d+(?:[.,]\d+)?\s*)?°\s*C.*?([\d.,]+)\s*ml/gi);
                    for (const match of rrSingleMatches) {
                        const temp = parseFloat(match[1].replace(',', '.'));
                        const val = parseFloat(match[2].replace(',', '.'));
                        if (val > 0) { const rr24h = val * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                }

                // Path 4: Chart.js respirationRateChart data block (used when res_list items are
                // only descriptive text with no ml values, e.g. the Carrot product sheet).
                // Extracts the FIRST dataset (Air/21% O₂) and treats values as ml/kg/h → ×24 → ml/kg/24h.
                if (!foundRR) {
                    const chartIdx = text.indexOf('respirationRateChart = new Chart');
                    if (chartIdx !== -1) {
                        const chunk = text.slice(chartIdx, chartIdx + 1800);
                        const labelsM = chunk.match(/labels\s*:\s*\[([^\]]+)\]/);
                        const dataM   = chunk.match(/\bdata\s*:\s*\[([\d.,\s]+)\]/);
                        if (labelsM && dataM) {
                            const labelTemps = [...labelsM[1].matchAll(/([\d.]+)\s*°C/g)].map(m => parseFloat(m[1]));
                            const dataVals   = dataM[1].split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
                            if (labelTemps.length >= 2 && labelTemps.length === dataVals.length) {
                                foundRR = true;
                                labelTemps.forEach((temp, i) => {
                                    if (dataVals[i] > 0) {
                                        const rr24h = (dataVals[i] * 24).toFixed(1);
                                        rrData[`target_temp${temp}_CO2`] = rr24h;
                                        rrData[`target_temp${temp}_O2`]  = rr24h;
                                    }
                                });
                            }
                        }
                    }
                }


                // Path 5 (kept as the last resort for sheets that only partly follow the
                // 2026 layout): 2026 spec sheet — respiration table, with the .resp-row bar visual
                // filling any temperature the table does not cover. Shared with the
                // attach/pull route via psExtractRespiration, which reads the gas and the unit
                // from the column header: these sheets are not consistent about either
                // ("CO₂ ml/kg·hr" vs "CO₂ mg/kg·hr" plus "O₂ mg/kg·hr"), and the code this
                // replaced assumed ml and read the gas off the column position, so every mg
                // sheet imported at roughly twice its real rate.
                if (!foundRR && hasNewPSFormat) {
                    const nfRR = psExtractRespiration(doc);
                    if (Object.keys(nfRR).length > 0) {
                        foundRR = true;
                        Object.assign(rrData, nfRR);
                    }
                }

                const initialQ10 = calculateQ10(rrData);

                const parsedData = {
                    'p1-core-1': { acp: acp, minTemp: minTemp, critCO2: critCO2, rq: "1.0", q10: explicitQ10 || initialQ10, q10Source: explicitQ10 ? 'sheet' : (initialQ10 ? 'calculated' : ''), ethyleneClass: ethyleneClass, vpdSensitivity: vpdSens },
                    'p1-core-2': { ...rrData },
                    'p1-core-3': { targetO2Min: o2Range.min, targetO2Max: o2Range.max, targetCO2Min: co2Range.min, targetCO2Max: co2Range.max, storageTempMin: tempRange.min, storageTempMax: tempRange.max, targetRHMin: rhRange.min, targetRHMax: rhRange.max },
                    'p1-core-4': { primaryThreat: primaryT, secondaryThreat: secondaryT, condensationRisk: condRisk, ...defectData, defectCount: extractedDefectCount > 0 ? extractedDefectCount : 7 }
