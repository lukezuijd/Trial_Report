<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Named as the page names itself in its own hero, and as the rest of the
         workflow names its tabs. "GTM Intelligence Dashboard" was the only title
         in the suite that did not say what the board's last column links to. -->
    <title>PerfoTec Product Dashboard</title>
    <meta name="description" content="PerfoTec Product Dashboard — product research, trial results and validation across the freshness workflow.">
    <meta name="author" content="PerfoTec B.V.">
    <meta name="theme-color" content="#008837">

    <!-- Montserrat is the brand typeface. Preconnecting shaves the font
         waterfall so the first paint is already on-brand. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">

    <!-- Tailwind CSS for styling -->
    <!-- The Play CDN defines the global `tailwind` object, so the brand token
         overrides MUST be assigned AFTER it loads. They used to sit before it,
         which threw "tailwind is not defined" and silently discarded the whole
         PerfoTec palette — the dashboard then rendered in default Tailwind
         blue/green instead of #084BCD / #008837. -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- PerfoTec Brand 2.0 palette, type and radii for Tailwind. This used to be
         an inline copy covering only blue and green, which left the ~600 slate
         surfaces and borders on Tailwind's own neutrals — visibly cooler and
         greyer than the rest of the workflow. brand.js is now the one source
         the board and all four tools share, and it also carries the neutral
         ramp, Montserrat and the 8-12px radius cap. Same ordering rule as
         before: it must come AFTER the Play CDN, which defines `tailwind`. -->
    <script src="brand.js?v=e549b527"></script>

    <!-- Chart.js for graphs -->
    <!-- Pinned. This was an unversioned URL, so jsdelivr served whatever the
         latest chart.js happened to be — including, one day, the next major.
         The charts here are written against the v4 API; 4.5.1 is the version
         that was actually being served, so this freezes today's behaviour
         rather than changing it. Same path resolution, version added.
         xlsx (0.18.5), mammoth (1.6.0) and docx (8.5.0) were already pinned. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>

    <!-- SheetJS (Excel/CSV) and Mammoth (Word .docx) are NOT loaded here.
         Together they were 1.5 MB — 84% of everything this page downloaded — on
         every single load, to serve an importer that most sessions never open.
         They are fetched on first use instead by ensureLib() below, and the
         browser caches them from then on. Versions stay pinned; the URLs live in
         LAZY_LIBS. -->

    <!-- Babel (in-browser JSX compilation) is not loaded here any more: the
         compile-once loader after the app's script fetches it only when there
         is no compiled copy of this exact source yet. -->

    <!-- Project Board shared local-folder layer. The dashboard used to live in a
         sibling directory and reach this file through '../GitHub/', which meant it
         only shared the IndexedDB folder handle when the parent directory happened
         to be the thing being served — and broke outright on a flat static host.
         It now sits in the hub folder next to board.html, so this is an ordinary
         same-origin sibling and the shared handle follows by construction.
         The ?v= stamp is written by stamp-assets.mjs; do not set it by hand. -->
    <!-- This page renders its own Board button in the header, so the shared
         floating bar that board-db.js injects would be a second, redundant way back. -->
    <script>window.PERFOTEC_NO_BACK_BUTTON = true;</script>
    <script src="board-db.js?v=a318a158"></script>

    <!-- Import Maps for modern modules -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
        }
    }
    </script>

    <!-- The shared foundation the board and the four tools all load: the v2.0
         tokens, the .pf-* component layer, the a11y focus states, and the touch
         rules that give every control a 44px target on a phone. The dashboard
         used to carry a private copy of the tokens and none of the rest, which
         is most of why it read as a different product. Local rules below still
         win — this link deliberately sits above them. -->
    <link rel="stylesheet" href="style.css?v=df20be12">

    <style>
        /* Dashboard-specific styling only. Anything the whole workflow shares —
           brand tokens, body type, .pf-loading, focus rings — now comes from
           style.css above. */

        /* style.css hides everything but #print-content when printing, because
           intake, proposal and report all print through that wrapper. The
           dashboard has no print view, so on Ctrl+P it would have produced a
           blank page. Put it back to printing what is on screen. */
        @media print {
            body * { visibility: visible !important; }
        }

        /* Legacy font classes from the 2023 identity, redirected to Montserrat.
           Still on 94 call sites; the class names are the only thing left of
           League Spartan and Inter. */
        .font-spartan { font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.01em; }
        .font-inter   { font-family: var(--font-body); }

        /* Product hero — a solid blue feature panel, which is what the guide
           gives for one: `featurePanel: bg #084BCD, text #FFFFFF`. It was a
           three-stop diagonal gradient with a dot-pattern overlay, both of
           which v2.0 retired ("metal gradient / dot-pattern backgrounds →
           white / mist / blue-tint") and neither of which appears anywhere
           else in the workflow. */
        /* Oct 2026: the hero follows perfotec.com instead — see WEBSITE SKIN below. */
        .pf-hero {
            background:
                radial-gradient(1100px 620px at 82% 18%, rgba(8, 75, 205, .42), rgba(0, 0, 0, 0) 62%),
                radial-gradient(800px 520px at 8% 105%, rgba(0, 200, 230, .10), rgba(0, 0, 0, 0) 60%),
                linear-gradient(165deg, #04307F 0%, #022668 30%, #061A3A 62%, #04101F 100%);
            background-color: #04101F;
        }

        /* Remove skew — replace with rounded corners so buttons feel like the
           reference suite. 8px is the guide's button radius. */
        .shape-80deg         { transform: none !important; border-radius: var(--pf-radius); overflow: hidden; }
        .shape-80deg-reverse { transform: none !important; display: flex; align-items: center; justify-content: center; }

        /* Active-step lift, on the same shadow scale as the rest of the suite. */
        .confident-overlap { box-shadow: 0 6px 16px rgba(16, 24, 40, 0.10); z-index: 20; border-radius: var(--pf-radius-card); }
        /* Small print (9 and 10 px labels) is unreadable at arm's length: on a narrow
           screen and on any touch device it is at least 11 px. Screen only. */
        @media screen and (max-width: 899px), screen and (pointer: coarse) {
            .pf-web .text-\[9px\], .pf-web .text-\[10px\] { font-size: 11px; line-height: 1.35; }
        }
        /* Workflow sections scrolled to by a link land under the sticky masthead and tabs. */
        .pf-wf-anchor { scroll-margin-top: calc(var(--pf-masthead-h, 64px) + 84px); }

        /* Scrollbar — brand neutrals */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CFD9E6; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--pf-blue); }

        textarea { resize: vertical; min-height: 70px; }

        /* === PRODUCT-SHEET DESIGN SYSTEM ===================================
           Mirrors the PerfoTec product sheet (perfotec-product-sheet skill) so the
           dashboard and the sheet read as one document.

           Where the sheet template and the workflow suite disagreed, the suite
           now wins — the dashboard sits inside the workflow, and both derive
           from the same guide anyway. Two specs moved:
             - the card shadow, from a 16-40px blur to the one recipe
               perfotec.com uses under its cards and brand.js installs as
               Tailwind's `shadow`. The old blur made these cards float well
               above every other card in the workflow.
             - the eyebrow, onto the same 600 / .14em tracking as the field
               labels in intake, proposal and report (UI_CLASSES in config.js).
               An eyebrow is the most-repeated brand signature on a page; two
               versions of it read as two products. */
        .ps-card {
            background: var(--pf-white);
            border: 1px solid var(--pf-cool-gray);
            border-radius: var(--pf-radius-card);
            box-shadow: var(--pf-shadow);
            transition: transform .2s, box-shadow .2s;
        }
        .ps-card-hover:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 24, 40, 0.10); }
        .ps-eyebrow {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: .14em; color: var(--pf-blue);
        }
        .ps-title { font-size: 28px; font-weight: 800; color: var(--pf-ink); line-height: 1.2; letter-spacing: -0.01em; }
        .ps-subtitle { font-size: 20px; font-weight: 800; color: var(--pf-ink); line-height: 1.25; }
        .ps-value { font-size: 26px; font-weight: 800; color: var(--pf-ink); line-height: 1.1; }
        /* Sheet table chrome: solid blue head, zebra rows, blue targets — the
           same treatment .report-table now carries in style.css. */
        .ps-table thead tr { background: var(--pf-blue); color: var(--pf-white); }
        .ps-table thead th {
            padding: 12px 16px; font-weight: 600; text-align: left;
            font-size: 11px; text-transform: uppercase; letter-spacing: .14em; white-space: nowrap;
        }
        .ps-table tbody tr { border-bottom: 1px solid var(--pf-cool-gray); }
        .ps-table tbody tr:nth-child(even) { background: var(--pf-mist); }
        .ps-table tbody tr:hover { background: var(--pf-blue-tint); }
        .ps-table tbody td { padding: 12px 16px; vertical-align: top; }
        .ps-target { font-weight: 700; color: var(--pf-blue); }
        .ps-good   { font-weight: 700; color: var(--pf-green); }
        .ps-warn   { font-weight: 700; color: #B91C1C; }

        /* Excel-like data grid — on the brand neutrals rather than Tailwind's
           own slate, so it matches every other table in the workflow. */
        .excel-table th {
            background-color: var(--pf-mist); border: 1px solid var(--pf-cool-gray);
            padding: 8px 12px; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: .14em;
            color: var(--pf-muted); white-space: nowrap;
        }
        .excel-table td { border: 1px solid var(--pf-cool-gray); padding: 0; position: relative; }
        .excel-table input, .excel-table select {
            width: 100%; height: 100%; padding: 8px 12px; border: none; outline: none;
            background: transparent; font-size: 13px; color: var(--pf-charcoal);
            font-family: var(--font-body);
        }
        .excel-table input:focus, .excel-table select:focus {
            background-color: var(--pf-blue-tint);
            box-shadow: inset 0 0 0 2px var(--pf-blue);
        }

        /* === WEBSITE SKIN — perfotec.com (Oct 2026) ===========================
           The dashboard follows the new website: a navy masthead and hero with
           the reverse logo and a sky-blue accent line, light sections with a
           soft cyan/blue glow, and white cards on an 18px radius with a long,
           low shadow. Every value below was measured on perfotec.com. It is
           scoped to .pf-web (the dashboard's root), so the board and the tools
           keep their look until they follow. Where the site goes beyond the
           static v2.0 guide — 18px cards, accent gradients, the cyan tint — the
           site wins: it is the newer statement of the brand. */
        .pf-web {
            --web-navy: #04101F;
            --web-ink: #0E1726;
            --web-sky: #7FB2FF;
            --web-teal-ink: #0E7490;
            --web-line: #E4EBF3;
            --web-radius: 18px;
            --web-shadow: 0 22px 44px -28px rgba(14, 23, 38, .28);
            --web-accent: linear-gradient(92deg, #13AE67 0%, #10B981 40%, #00B3D6 75%, #084BCD 100%);
            --web-accent-dark: linear-gradient(92deg, #7FB2FF 0%, #8FD6FF 45%, #00F0FF 100%);
            --web-green: linear-gradient(92deg, #13AE67 0%, #0DB592 100%);
            background-color: #F3F9FC;
            isolation: isolate;
        }
        /* The light-section glow, on its own fixed layer behind the content:
           background-attachment: fixed repainted this long page on every
           scroll step. */
        .pf-web::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(900px 560px at 0 0, rgba(0, 179, 214, .12), rgba(0, 179, 214, 0) 62%),
                radial-gradient(820px 620px at 100% 35%, rgba(8, 75, 205, .10), rgba(8, 75, 205, 0) 62%),
                linear-gradient(#F1F8FB 0%, #F6F9FE 100%);
        }
        @media print { .pf-web::before { display: none; } }
        /* Masthead: the site's navy bar. */
        .pf-web-masthead {
            background: rgba(4, 16, 31, .97);
            -webkit-backdrop-filter: saturate(1.5) blur(16px);
            backdrop-filter: saturate(1.5) blur(16px);
            border-bottom: 1px solid rgba(127, 178, 255, .14);
        }
        .pf-dark-btn {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .18);
            color: rgba(255, 255, 255, .85);
            border-radius: 8px;
            transition: background .15s, border-color .15s, color .15s;
        }
        .pf-dark-btn:hover, .pf-dark-btn.is-active { background: rgba(255, 255, 255, .12); border-color: rgba(127, 178, 255, .45); color: #FFFFFF; }
        /* The site's button type: 12px, semibold, tracked capitals. */
        .pf-web-btn { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        /* Hero chips: translucent pills; the state chip leads with a dot, as the
           site's eyebrows do. */
        .pf-web-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 999px;
            background: rgba(255, 255, 255, .06); border: 1px solid rgba(127, 178, 255, .28);
            color: rgba(255, 255, 255, .9);
            font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        }
        .pf-web-chip.is-state::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: #7FB2FF; box-shadow: 0 0 0 4px rgba(127, 178, 255, .18);
        }
        .pf-web-chip.is-state.is-green::before { background: #13AE67; box-shadow: 0 0 0 4px rgba(19, 174, 103, .22); }
        .pf-web-chip.is-state svg { display: none; }
        /* The second heading line in the site's sky-to-cyan accent. */
        .pf-web-accent-dark { background: var(--web-accent-dark); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pf-web-progress { background: var(--web-accent); }
        .pf-web-media {
            border-radius: var(--web-radius);
            border: 1px solid rgba(127, 178, 255, .25);
            background: rgba(255, 255, 255, .06);
            box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6);
        }
        /* Tab bar: a white card, the active tab as the primary button. */
        .pf-web-tabs {
            display: flex; gap: 4px; padding: 5px;
            background: rgba(255, 255, 255, .86);
            border: 1px solid var(--web-line); border-radius: 14px;
            box-shadow: var(--web-shadow);
        }
        .pf-web-tab {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;
            padding: 10px 14px; border-radius: 10px;
            font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            color: #5F6B7D; transition: background .15s, color .15s;
        }
        .pf-web-tab:hover { color: var(--web-ink); background: #F1F6FF; }
        .pf-web-tab.is-active { background: #084BCD; color: #FFFFFF; box-shadow: 0 10px 20px -12px rgba(8, 75, 205, .7); }
        /* Section eyebrow: the site's white pill with a teal dot. */
        .pf-web-pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 14px 7px 10px; border-radius: 999px;
            background: #FFFFFF; border: 1px solid #CDEBF3;
            box-shadow: 0 6px 18px rgba(14, 116, 144, .08);
            color: var(--web-teal-ink);
            font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        }
        .pf-web-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #13AE67; box-shadow: 0 0 0 4px rgba(19, 174, 103, .15); }
        .pf-web-grad-green { background: var(--web-green); -webkit-background-clip: text; background-clip: text; color: transparent; }
        /* Headlines: the site's ink, extra-bold and slightly tight. */
        .pf-web .ps-title, .pf-web .ps-subtitle { color: var(--web-ink); letter-spacing: -0.02em; }
        .pf-web .ps-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
        /* Cards: white, 18px, hairline border, long low shadow. Applied to the
           card pattern the dashboard is built from (a rounded-xl box with a
           border), so every panel follows without being rewritten. */
        .pf-web main .rounded-xl.border, .pf-web .ps-card { border-radius: var(--web-radius); border-color: var(--web-line); }
        .pf-web main .rounded-xl.border.bg-white, .pf-web .ps-card { background-color: rgba(255, 255, 255, .92); }
        .pf-web main .rounded-xl.border.shadow-sm,
        .pf-web main .rounded-xl.border.shadow-md,
        .pf-web main .rounded-xl.border.shadow-lg,
        .pf-web .ps-card { box-shadow: var(--web-shadow); }
        .pf-web main .rounded-xl.border > :first-child { border-top-left-radius: var(--web-radius); border-top-right-radius: var(--web-radius); }
        /* A panel's grey title strip reads as part of the card, not a bar. */
        .pf-web main .rounded-xl.border > .bg-slate-50.border-b:first-child { background-color: transparent; }
        /* style.css paints every heading ink, which turned the titles on the
           coloured panel bars (text-white) dark. A heading takes its bar's
           colour; a colour class on the heading itself still wins. */
        body :where(.pf-web .text-white) :is(h1, h2, h3, h4, h5, h6) { color: inherit; }
        /* Narrow screens. The lockup with its tagline is 177px wide even at its
           smallest, so the masthead cannot hold logo, Board, the product picker
           and the three actions on one line: they ran into each other. Below
           md it breaks in two — logo and actions, then Board and the picker
           across the full width — and the four tabs sit two by two. */
        @media (max-width: 899px) { /* tablets too: at 768 px the product name got 45 px on one line */
            .pf-web-masthead-row { flex-wrap: wrap; row-gap: 0; }
            .pf-web-masthead-row > .pf-web-masthead-left { display: contents; }
            .pf-web-masthead-row > .pf-web-masthead-right { order: 1; margin-left: auto; }
            .pf-web-masthead-row::after { content: ''; flex-basis: 100%; order: 2; }
            .pf-web-masthead-left > :not(img) { order: 3; margin-top: 10px; }
            .pf-web-masthead-left > .pf-web-picker { flex: 1; }
            .pf-web-picker > button { flex: 1; justify-content: space-between; }
            .pf-web-picker > button span.truncate { max-width: 60vw; }
        }
        @media (max-width: 639px) {
            .pf-web-tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
            .pf-web-tab { letter-spacing: .5px; padding: 10px 4px; font-size: 11px; gap: 5px; }
        }
        /* The tab bar stays in reach while scrolling, just under the masthead
           (--pf-masthead-h is measured by the app). Wide screens only: on a
           phone the two-row masthead plus the tab row would cover a third of
           the screen. */
        @media (min-width: 768px) {
            .pf-web-tabs-sticky {
                position: sticky; top: calc(var(--pf-masthead-h, 64px) + 8px); z-index: 30;
                /* Over a table it must not let the rows show through. */
                background: rgba(255, 255, 255, .97);
                -webkit-backdrop-filter: saturate(1.4) blur(10px);
                backdrop-filter: saturate(1.4) blur(10px);
                /* The 8 px between masthead and bar is filled with the page colour,
                   so content does not scroll by in that slit. */
                box-shadow: 0 -9px 0 0 #F3F9FC, var(--web-shadow);
            }
        }
        .pf-web-tabs.is-pending { cursor: progress; }
        /* While the app loads its products. */
        @keyframes pf-shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
        .pf-skeleton { background: linear-gradient(90deg, #E9EEF5 0%, #F5F8FC 50%, #E9EEF5 100%); background-size: 800px 100%; animation: pf-shimmer 1.4s linear infinite; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="pf-loading" role="status">Loading the product dashboard…<span class="pf-loading-note" style="display:block;margin-top:8px;font-size:12px;opacity:.75"></span></div>
    </div>
    <script>
        // React, Babel, Tailwind and the charts come from the internet. When one of
        // them fails (offline, a firewall, a CDN outage) the page sat on "Loading…"
        // for good. Record what failed and, if the dashboard has not started after
        // 25 s, say so plainly.
        (function () {
            var failed = [];
            window.addEventListener('error', function (e) {
                var t = e && e.target;
                if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href);
                else if (e && e.message) failed.push(e.message);
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                failed.push(String((e && e.reason && (e.reason.message || e.reason)) || 'unknown error'));
            });
            setTimeout(function () {
                if (window.__dashboardMounted) return;
                var note = document.querySelector('.pf-loading-note');
                if (!note) return;
                note.textContent = 'The dashboard did not start. It needs an internet connection to load its parts '
                    + '(cdn.tailwindcss.com, unpkg.com, esm.sh, cdn.jsdelivr.net). Check the connection and reload the page.'
                    + (failed.length ? ' Failed: ' + failed.slice(0, 4).join(' · ') : '');
            }, 25000);
        })();
    </script>

    <script type="text/babel" data-type="module" data-presets="react" data-cache="dashboard">
        import React, { useState, useEffect, useRef, useMemo, useTransition, startTransition } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            FileText, Target, Users, Rocket, CheckCircle2, ChevronRight, Activity, 
            ShieldCheck, AlertCircle, X, Leaf, ShoppingCart, Box, Layers, Database, 
            Calculator, TestTube, ThermometerSnowflake, LineChart, Wind, UploadCloud, Check, FileCheck, Upload,
            Cpu, Link as LinkIcon, Plus, FolderOpen, Loader2, MessageSquare, Briefcase, CheckSquare, Square,
            Image as ImageIcon, Beaker, Globe, Download, LayoutDashboard, ListTodo, Eye, Table, RefreshCw, Merge, LayoutGrid, Filter, Package, Trash2, Search, StickyNote, Info, Archive, Trophy, ArrowRight
        } from 'lucide-react';
        
        // Firebase was once an alternative backend for this dashboard. It is not
        // wired up in this deployment: `db` is only assigned when the global
        // `__firebase_config` exists, and nothing anywhere in this repository
        // defines it — so every `if (db)` branch below is unreachable.
        //
        // The three module trees were nonetheless fetched from esm.sh on EVERY
        // load — 19 requests before the page could render — for code that cannot
        // run. The imports are gone.
        //
        // These bindings stay declared on purpose. The unreachable branches still
        // name them, and a declared-but-undefined binding is inert where a removed
        // one would be a ReferenceError if a branch were ever reached. To restore
        // the Firestore option: re-add the three imports below and the matching
        // importmap entries in <head>.
        let initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc;

        // --- Firebase Init ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
