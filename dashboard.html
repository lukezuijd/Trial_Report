            const addLink = async (stepId, e) => {
                e.preventDefault(); if (!activeProduct || activeProduct.isAverage || !newLinkData.title || !newLinkData.url) return;
                const currentLinks = activeProduct.links || {}; const stepLinks = currentLinks[stepId] || [];
                const updatedLinks = { ...currentLinks, [stepId]: [...stepLinks, { title: newLinkData.title, url: newLinkData.url, type: newLinkData.type }] };
                if (db) {
                    const productRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id); await updateDoc(productRef, { links: updatedLinks });
                } else { setProducts(prev => prev.map(p => p.id === activeProduct.id ? {...p, links: updatedLinks} : p)); }
                setNewLinkData({ title: '', url: '', type: 'link' });
            };

            // ── Product image ─────────────────────────────────────────────────
            // Products carry `imageUrl` (a data URL) and the board's products view
            // shows it, but until now it could only be set while creating or
            // importing a product. Scaled down on upload — it is stored inside the
            // product record and read back on every listing, so a full-size photo
            // would bloat both the record and the product index.
            const saveProductImage = async (dataUrl) => {
                if (!activeProduct || activeProduct.isAverage) return;
                if (db) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { imageUrl: dataUrl });
                } else {
                    setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, imageUrl: dataUrl } : p));
                }
            };

            const handleProductImageUpload = async (e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = null;
                if (!file) return;
                const dataUrl = await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = ev => resolve(ev.target.result);
                    r.onerror = reject;
                    r.readAsDataURL(file);
                });
                // Same scaler the board uses for its card images, so both sides
                // store comparably sized pictures.
                const scaled = window.PerfoTecBoard && window.PerfoTecBoard.scaleImage
                    ? await window.PerfoTecBoard.scaleImage(dataUrl, 480)
                    : dataUrl;
                await saveProductImage(scaled || dataUrl);
            };

            const removeProductImage = async () => {
                if (!window.confirm('Remove the picture from this product?')) return;
                await saveProductImage('');
            };

            const deleteLink = async (stepId, linkIndex) => {
                if (!activeProduct || activeProduct.isAverage) return;
                const currentLinks = activeProduct.links || {}; const stepLinks = currentLinks[stepId] || [];
                const updatedStepLinks = stepLinks.filter((_, idx) => idx !== linkIndex); const updatedLinks = { ...currentLinks, [stepId]: updatedStepLinks };
                if (db) {
                    const productRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id); await updateDoc(productRef, { links: updatedLinks });
                } else { setProducts(prev => prev.map(p => p.id === activeProduct.id ? {...p, links: updatedLinks} : p)); }
            };

            const handleAddTemp = (taskId, e) => {
                e.preventDefault(); e.stopPropagation(); if(activeProduct?.isAverage) return;
                const tempVal = parseFloat(newTempInputs[taskId]); if (isNaN(tempVal)) return;
                setLocalFormData(prev => { const currentTaskData = prev[taskId] || {}; return { ...prev, [taskId]: { ...currentTaskData, [`temp${tempVal}_O2`]: currentTaskData[`temp${tempVal}_O2`] || '', [`temp${tempVal}_CO2`]: currentTaskData[`temp${tempVal}_CO2`] || '' } }; });
                setNewTempInputs(prev => ({...prev, [taskId]: ''}));
                if (activeProduct) scheduleAutosave(activeProduct.id);
            };

            const handleFieldChange = (taskId, fieldId, value) => {
                if(activeProduct?.isAverage) return;
                setLocalFormData(prev => {
                    const newState = { ...prev, [taskId]: { ...(prev[taskId] || {}), [fieldId]: value } };
                    if (taskId === 'p1-core-2') {
                        const calculatedQ10 = calculateQ10(newState['p1-core-2'], newState['hub-respiration']);
                        // A Q10 from the product sheet or typed by hand stays; only a
                        // calculated one follows the respiration data. Every edit to the
                        // respiration table used to replace the sheet's value.
                        const src = (newState['p1-core-1'] || {}).q10Source || '';
                        if (calculatedQ10 && src !== 'sheet' && src !== 'manual') newState['p1-core-1'] = { ...(newState['p1-core-1'] || {}), q10: calculatedQ10, q10Source: 'calculated' };
                    }
                    if (taskId === 'p1-core-1' && fieldId === 'q10') {
                        newState['p1-core-1'] = { ...newState['p1-core-1'], q10Source: String(value || '').trim() ? 'manual' : '' };
                    }
                    return newState;
                });
                // ── MHP auto-set: lock O₂=20.9%, CO₂=0% when condition is MHP
                // OPEN: no auto-set (can record any atmosphere readings from the trial)
                const condMatch = fieldId.match(/^pack_opt_(\d+)_condition$/);
                if (condMatch && value === 'MHP') {
                    const oi = condMatch[1];
                    setLocalFormData(prev => ({ ...prev, [taskId]: { ...(prev[taskId]||{}), [`pack_opt_${oi}_o2`]: '20.9', [`pack_opt_${oi}_co2`]: '0' } }));
                }
                // ── Auto-complete: if all fillable fields in this task are now filled, mark done + collapse
                const task = currentStepsTemplate.flatMap(s => s.tasks).find(t => t.id === taskId);
                if (task && task.formGroups && activeProduct && !activeProduct.isAverage) {
                    const checkFields = task.formGroups.flatMap(g => g.fields).filter(f => f.id !== 'q10');
                    const updatedData = { ...(localFormData[taskId] || {}), [fieldId]: value };
                    const filled = (v) => { const t = String(v ?? '').trim(); return t !== '' && !t.startsWith('—'); };
                    const gateField = checkFields.find(f => /^gate\dDecision$/.test(f.id));
                    const allFilled = gateField ? filled(updatedData[gateField.id]) : (checkFields.length > 0 && checkFields.every(f => filled(updatedData[f.id])));
                    // A checkpoint set back to "no decision" is open again.
                    if (gateField && !allFilled && (activeProduct.completedTaskIds || []).includes(taskId)) {
                        const reopened = (activeProduct.completedTaskIds || []).filter(id => id !== taskId);
                        if (db) updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { completedTaskIds: reopened });
                        else setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, completedTaskIds: reopened } : p));
                    }
                    if (allFilled) {
                        const alreadyDone = (activeProduct.completedTaskIds || []).includes(taskId);
                        // Collapsing belongs to the MOMENT a section becomes complete,
                        // not to the state of being complete. It used to run on every
                        // keystroke while allFilled stayed true, so changing one value
                        // in a finished section (an ACP % under an already-filled
                        // "Measure product respiration", say) closed it again on every
                        // key. Both guards below have to hold:
                        //   - alreadyDone: the section was already complete, so nothing
                        //     just happened worth reacting to.
                        //   - manuallyOpenedRef: the user opened this themselves and
                        //     is working in it; it closes when they close it.
                        if (!alreadyDone) {
                            const newCompleted = [...(activeProduct.completedTaskIds || []), taskId];
                            if (db) updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { completedTaskIds: newCompleted });
                            else setProducts(prev => prev.map(p => p.id === activeProduct.id ? {...p, completedTaskIds: newCompleted} : p));
                            if (!manuallyOpenedRef.current.has(taskId)) {
                                setExpandedTaskIds(prev => { const n = new Set(prev); n.delete(taskId); return n; });
                            }
                        }
                    }
                }
                if (activeProduct) scheduleAutosave(activeProduct.id);
            };

            // Several fields of one task at once (the data check's accepted proposals,
            // a claim being drafted or approved), through the same buffer and autosave
            // as a typed edit — never around them.
            const patchTask = (taskId, patch) => {
                if (activeProduct?.isAverage) return false;
                setLocalFormData(prev => ({ ...prev, [taskId]: { ...(prev[taskId] || {}), ...patch } }));
                if (activeProduct) scheduleAutosave(activeProduct.id);
                return true;
            };

            // Debounced autosave: persist the full formData ~1s after the last edit
            const scheduleAutosave = (productId) => {
                if (autosaveTimerRef.current) clearTimeout(autosaveTimerRef.current);
                setAutosaveState('pending');
                autosaveTimerRef.current = setTimeout(async () => {
                    autosaveTimerRef.current = null;
                    if (bufferOwnerRef.current !== productId) return; // flushed when the product changed
                    try {
                        if (db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId), { formData: localFormDataRef.current });
                        else setProducts(prev => prev.map(p => p.id === productId ? { ...p, formData: localFormDataRef.current } : p));
                        setAutosaveState('saved');
                        setTimeout(() => setAutosaveState(s => s === 'saved' ? null : s), db ? 2000 : 6000);
                    } catch (error) { console.error(error); setAutosaveState('error'); }
                }, 1000);
            };

            // ── Continuous data registers ─────────────────────────────────────────
            // These live OUTSIDE the workflow phases: they are the primary, always-
            // growing data entry points (trial results + respiration readings) and
            // are rendered at the top of the workflow tab.

            // ══ PRODUCT SHEET ═══════════════════════════════════════════════════
            // The product sheet (from the perfotec-product-sheet skill) is the outward-facing
            // spec document. The dashboard holds the validated practice data. Keeping them in
            // sync in BOTH directions is what turns the sheet from a snapshot into a living
            // document: pull seeds the dashboard from research, push writes trial-validated
            // reality back into the sheet.

            // Locate a syncable value node inside a parsed sheet document.
            // Sheet values live as plain text in .card-value or td.t-target (the trilingual
            // <span data-lang> pattern is only used for prose), so they are safe to rewrite.
            const psFindNode = (doc, field) => {
                const norm = s => (s || '').toLowerCase().replace(/\s+/g, ' ');
                if (field.card) {
                    for (const card of doc.querySelectorAll('.card')) {
                        const eyebrow = norm(card.querySelector('.card-eyebrow')?.textContent);
                        const valEl = card.querySelector('.card-value');
                        if (valEl && field.card.some(k => eyebrow.includes(k))) return valEl;
                    }
                }
                if (field.row) {
                    for (const row of doc.querySelectorAll('tr')) {
                        const p = norm(row.querySelector('td.t-param')?.textContent);
                        const target = row.querySelector('td.t-target');
                        if (!p || !target) continue;
                        // Each key may offer alternatives separated by "|": the parameter is
                        // labelled "Relative humidity" in this template but plain "RH" in
                        // older sheets, and subscripts are not dependable either ("O₂" vs
                        // "O2"). Every key must match; a key matches on any of its variants.
                        if (field.row.every(k => k.split('|').some(v => p.includes(v)))) return target;
                    }
                }
                return null;
            };

            // Some value cells mix a number with trilingual unit spans ("15+ dagendaysdías").
            // Read only the English rendering so comparisons and rewrites stay clean.
            const psNodeText = (node) => {
                if (!node) return '';
                const clone = node.cloneNode(true);
                clone.querySelectorAll('[data-lang]').forEach(el => { if (el.getAttribute('data-lang') !== 'en') el.remove(); });
                return clone.textContent.trim().replace(/\s+/g, ' ');
            };

            // Rewrite a value node while preserving its trilingual unit spans: replace only the
            // leading number, so "15+ dagen/days/días" becomes "21 dagen/days/días".
            const psSetNodeValue = (node, newText) => {
                const langSpans = node.querySelectorAll('[data-lang]');
                if (langSpans.length === 0) { node.textContent = newText; return; }
                // Replace the text nodes that sit before the first language span
                let replaced = false;
                Array.from(node.childNodes).forEach(child => {
                    if (child.nodeType === 3) { // text node
                        if (!replaced && child.textContent.trim() !== '') { child.textContent = newText + ' '; replaced = true; }
                        else child.textContent = '';
                    }
                });
                if (!replaced) node.insertBefore(node.ownerDocument.createTextNode(newText + ' '), node.firstChild);
            };

            // The fields the dashboard and the sheet share. `dash` reads the dashboard value,
            // `apply` writes a pulled sheet value back into the dashboard form data.
            const PS_SYNC_FIELDS = [
                { key: 'acp', label: 'ACP (anaerobic threshold)', unit: '% O₂',
                  card: ['acp', 'anaerob'],
                  dash: fd => fd['p1-core-1']?.acp,
                  fmt: v => `${v}% O₂`,
                  apply: (fd, nums) => { if (nums[0] != null) fd['p1-core-1'] = { ...(fd['p1-core-1']||{}), acp: String(nums[0]) }; } },
                { key: 'critCO2', label: 'Critical CO₂', unit: '%',
                  card: ['critical co', 'kritische co', 'kritiek co'],
                  dash: fd => fd['p1-core-1']?.critCO2,
                  fmt: v => `>${v}% CO₂`,
                  apply: (fd, nums) => { if (nums[0] != null) fd['p1-core-1'] = { ...(fd['p1-core-1']||{}), critCO2: String(nums[0]) }; } },
                { key: 'q10', label: 'Q₁₀ temperature sensitivity', unit: '×',
                  card: ['q₁₀', 'q10'],
                  dash: fd => fd['p1-core-1']?.q10,
                  fmt: v => `${v}×`,
                  apply: () => {} /* Q10 is calculated from respiration data — never overwritten */ },
                { key: 'storageTemp', label: 'Optimal storage temperature', unit: '°C',
                  card: ['optimal storage', 'optimale bewaring', 'almacenamiento'], row: ['temperat|temp'],
                  dash: fd => { const a = fd['p1-core-3']?.storageTempMin, b = fd['p1-core-3']?.storageTempMax; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v} °C`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), storageTempMin: String(nums[0]), storageTempMax: String(nums[1] ?? nums[0]) }; } },
                { key: 'o2', label: 'O₂ steady-state target', unit: '%',
                  row: ['o₂|o2', 'steady'],
                  dash: fd => { const a = fd['p1-core-3']?.targetO2Min, b = fd['p1-core-3']?.targetO2Max; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}%`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetO2Min: String(nums[0]), targetO2Max: String(nums[1] ?? nums[0]) }; } },
                { key: 'co2', label: 'CO₂ steady-state target', unit: '%',
                  row: ['co₂|co2', 'steady'],
                  dash: fd => { const a = fd['p1-core-3']?.targetCO2Min, b = fd['p1-core-3']?.targetCO2Max; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}%`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetCO2Min: String(nums[0]), targetCO2Max: String(nums[1] ?? nums[0]) }; } },
                { key: 'rh', label: 'Relative humidity', unit: '%',
                  row: ['rh|humid|vochtig'],
                  dash: fd => { const a = fd['p1-core-3']?.targetRHMin, b = fd['p1-core-3']?.targetRHMax; return (a || b) ? `${a ?? '?'} – ${b ?? '?'}` : ''; },
                  fmt: v => `${v}% RH`,
                  apply: (fd, nums) => { if (nums.length) fd['p1-core-3'] = { ...(fd['p1-core-3']||{}), targetRHMin: String(nums[0]), targetRHMax: String(nums[1] ?? nums[0]) }; } },
                { key: 'shelfLife', label: 'Shelf life (trial-validated)', unit: 'days',
                  card: ['shelf life', 'houdbaarheid', 'vida útil'],
                  // "≥ 30", not "30": a trial that stopped while still in spec says
                  // "at least". The temperature goes in the note psPushToSheet adds.
                  dash: (fd, ctx) => ctx.validatedShelfLife ? `${ctx.validatedShelfLife.open ? '≥ ' : ''}${ctx.validatedShelfLife.days}` : '',
                  fmt: v => `${v}`,
                  apply: () => {} /* shelf life is proven by trials, never taken from the sheet */ }
            ];

            // The shelf life the sheet may carry once practice beats the research
            // estimate: the PROVEN best practice (two rounds reached it, measured
            // curves, score ≥ 7 until the first day below — trialBestPractice). It
            // used to take the latest day with a 6 from any row, control or
            // temperature: longer than the client's own report said.
            //
            // An APPROVED claim (Commercial tab) goes first: the sheet is a client
            // document, and a product manager signed that number off. Without one,
            // the proven best practice as decided. Either way the result carries
            // whether it is open-ended and the temperature it was reached at: "30"
            // used to land in a card that says "@ 5 °C under MAP" when the trials
            // ran at 18 °C.
            const psValidatedShelfLife = (fd) => {
                const approved = ((fd.commercial || {}).claims || []).filter(c => c.status === 'approved' && c.snapshot && c.snapshot.headlineDays != null);
                if (approved.length) {
                    const c = approved[approved.length - 1], s = c.snapshot;
                    return { days: s.headlineDays, open: !!s.headlineOpen, tempMin: s.temp ? s.temp.min : null, tempMax: s.temp ? s.temp.max : null, rounds: s.compared, source: 'claim', version: c.version };
                }
                const B = window.PerfoTecBoard;
                if (!B || !B.trialBestPractice) return null;
                const g = B.trialBestPractice(fd['p2-pack-master'] || {}).groups.find(x => x.proven && x.winner && !x.winner.legacy);
                return g ? { days: g.winner.shelfLife.days, open: !!g.winner.shelfLife.open, tempMin: g.tempMin, tempMax: g.tempMax, rounds: g.rounds, source: 'best-practice' } : null;
            };

            // Build the comparison rows: what the sheet says vs what the dashboard knows.
            const psBuildComparison = (sheetHtml, fd) => {
                const doc = new DOMParser().parseFromString(sheetHtml, 'text/html');
                const ctx = { validatedShelfLife: psValidatedShelfLife(fd) };
                const nums = s => (String(s || '').replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
                return PS_SYNC_FIELDS.map(f => {
                    const node = psFindNode(doc, f);
                    const sheetText = psNodeText(node);
                    const dashVal = String(f.dash(fd, ctx) ?? '').trim();
                    const sheetNums = nums(sheetText), dashNums = nums(dashVal);
                    const inSheet = !!node && sheetText !== '';
                    const inDash = dashVal !== '' && !dashVal.startsWith('? – ?');
                    // Compare on numbers so "0 – 4 °C" and "0 – 4" count as equal
                    const same = inSheet && inDash && sheetNums.length === dashNums.length && sheetNums.every((v, i) => Math.abs(v - dashNums[i]) < 0.05);
                    return { field: f, found: !!node, sheetText, dashVal, inSheet, inDash, same };
                });
            };

            // Push dashboard values into the sheet HTML and return the updated document.
            // Under the pushed shelf life, in the sheet's own three languages: where it
            // was proven. The card's research note ("@ 5 °C under MAP") stays — it
            // is research — but the trial number no longer stands under it unexplained.
            // Replaced on every push, never duplicated.
            const psSetShelfLifeNote = (valueNode, v) => {
                const docu = valueNode.ownerDocument;
                const card = valueNode.parentElement;
                if (!card) return;
                const t = v.tempMin == null ? '' : (v.tempMin === v.tempMax ? `${v.tempMin} °C` : `${v.tempMin}–${v.tempMax} °C`);
                const claim = v.source === 'claim';
                const lines = {
                    nl: `Bevestigd in proeven${t ? ` bij ${t}` : ''} · ${v.rounds} ronde${v.rounds !== 1 ? 's' : ''}${v.open ? ' · nog binnen specificatie toen de proef stopte' : ''}${claim ? ` · goedgekeurde claim v${v.version}` : ''}`,
                    en: `Trial-validated${t ? ` at ${t}` : ''} · ${v.rounds} round${v.rounds !== 1 ? 's' : ''}${v.open ? ' · still within specification when the trial stopped' : ''}${claim ? ` · approved claim v${v.version}` : ''}`,
                    es: `Validado en pruebas${t ? ` a ${t}` : ''} · ${v.rounds} ronda${v.rounds !== 1 ? 's' : ''}${v.open ? ' · aún dentro de especificación al terminar la prueba' : ''}${claim ? ` · declaración aprobada v${v.version}` : ''}`,
                };
                let note = card.querySelector('[data-pt-sync-note="shelfLife"]');
                if (!note) {
                    note = docu.createElement('div');
                    note.setAttribute('data-pt-sync-note', 'shelfLife');
                    note.setAttribute('style', 'margin-top:4px;font-size:11px;font-weight:600;color:#008837');
                    valueNode.insertAdjacentElement('afterend', note);
                }
                note.textContent = '';
                ['nl', 'en', 'es'].forEach(l => { const s = docu.createElement('span'); s.setAttribute('data-lang', l); s.textContent = lines[l]; note.appendChild(s); });
            };

            const psPushToSheet = (sheetHtml, fd, keys) => {
                const doc = new DOMParser().parseFromString(sheetHtml, 'text/html');
                const ctx = { validatedShelfLife: psValidatedShelfLife(fd) };
                const updated = [];
                PS_SYNC_FIELDS.forEach(f => {
                    if (keys && !keys.includes(f.key)) return;
                    const node = psFindNode(doc, f);
                    if (!node) return;
                    const val = String(f.dash(fd, ctx) ?? '').trim();
                    if (!val || val.includes('? – ?')) return;
                    const newText = f.fmt(val);
                    if (f.key === 'shelfLife' && ctx.validatedShelfLife) psSetShelfLifeNote(node, ctx.validatedShelfLife);
                    if (psNodeText(node) === newText) return;
                    psSetNodeValue(node, newText);
                    updated.push(`${f.label}: ${newText}`);
                });
                // Stamp the sheet so anyone opening the file sees it carries validated data
                const stamp = new Date().toISOString().slice(0, 10);
                let marker = doc.querySelector('[data-pt-sync]');
                if (!marker) {
                    marker = doc.createElement('div');
                    marker.setAttribute('data-pt-sync', '1');
                    marker.setAttribute('style', 'position:fixed;left:12px;bottom:12px;z-index:9999;background:#008837;color:#fff;font:700 10px/1.4 Montserrat,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.2)');
                    doc.body && doc.body.appendChild(marker);
                }
                marker.textContent = `Trial-validated · synced ${stamp}`;
                return { html: '<!DOCTYPE html>\n' + doc.documentElement.outerHTML, updated };
            };

            // ── Product sheet actions ─────────────────────────────────────────────
            const psWriteFormData = async (nextFormData) => {
                setLocalFormData(nextFormData);
                if (db) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', activeProduct.id), { formData: nextFormData });
                else setProducts(prev => prev.map(p => p.id === activeProduct.id ? { ...p, formData: nextFormData } : p));
            };

            const handleAttachSheet = async () => {
                if (activeProduct?.isAverage) { setSheetMsg('⚠ Select a specific variety first — "All varieties" is a read-only overview.'); setTimeout(() => setSheetMsg(''), 7000); return; }
                let file;
                try {
                    if (window.showOpenFilePicker) {
                        const [h] = await window.showOpenFilePicker({ types: [{ description: 'Product sheet (HTML)', accept: { 'text/html': ['.html', '.htm'] } }], multiple: false });
                        file = await h.getFile();
                    }
                } catch (err) { if (err.name !== 'AbortError') console.error(err); return; }
                if (!file) return;
                const html = await file.text();
                if (!/card-eyebrow|t-target|condition-block/i.test(html)) {
                    setSheetMsg('⚠ This does not look like a PerfoTec product sheet (no known sheet markup found).');
                    setTimeout(() => setSheetMsg(''), 8000); return;
                }
                const next = { ...localFormData, 'product-sheet': { html, fileName: file.name, attachedAt: new Date().toISOString(), lastSyncedAt: '' } };
                await psWriteFormData(next);

                // The sheet names this product in Dutch and Spanish as well. Attaching
                // it says "this sheet is about this product", so those two names are a
                // statement about the product and are adopted as alternative names —
                // the English name it is filed under does not move.
                let namesMsg = '';
                if (activeProduct && !activeProduct.isAverage) {
                    const psDocNames = new DOMParser().parseFromString(html, 'text/html');
                    const psNames = psNamesByLang(psDocNames, html);
                    // The product keeps the name it is filed under; what the sheet adds
                    // is the other ways to find it.
                    const added = cleanAliases([psNames.en, psNames.nl, psNames.es], activeProduct.name)
                        .filter(n => !aliasesOf(activeProduct).some(a => normProductName(a) === normProductName(n)));
                    if (added.length) {
                        await handleAliasesChange(activeProduct.id, aliasesOf(activeProduct).concat(added));
                        namesMsg = ` Also known as: ${added.join(' · ')}.`;
                    }
                }
                setSheetMsg(`✓ "${file.name}" attached — compare and sync below.${namesMsg}`);
                setTimeout(() => setSheetMsg(''), 8000);
            };

            const handleViewSheet = () => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html) return;
                const url = URL.createObjectURL(new Blob([sheet.html], { type: 'text/html' }));
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            };

            const handleDownloadSheet = () => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html) return;
                const url = URL.createObjectURL(new Blob([sheet.html], { type: 'text/html' }));
                const a = document.createElement('a');
                a.href = url; a.download = sheet.fileName || 'product-sheet.html';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Dashboard → sheet: write validated practice data into the sheet document.
            const handlePushToSheet = async (keys) => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html || activeProduct?.isAverage) return;
                const { html, updated } = psPushToSheet(sheet.html, localFormData, keys);
                if (updated.length === 0) { setSheetMsg('Nothing to update — the sheet already matches the dashboard.'); setTimeout(() => setSheetMsg(''), 6000); return; }
                const next = { ...localFormData, 'product-sheet': { ...sheet, html, lastSyncedAt: new Date().toISOString() } };
                await psWriteFormData(next);
                setSheetMsg(`✓ Sheet updated (${updated.length}): ${updated.join(' · ')} — use Download to save the new file.`);
                setTimeout(() => setSheetMsg(''), 12000);
            };

            // Sheet → dashboard: seed empty dashboard fields from the sheet's research values.
            const handlePullFromSheet = async (onlyEmpty = true) => {
                const sheet = localFormData['product-sheet'];
                if (!sheet?.html || activeProduct?.isAverage) return;
                const rows = psBuildComparison(sheet.html, localFormData);
                const next = JSON.parse(JSON.stringify(localFormData));
                const nums = s => (String(s || '').replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
                const applied = [];
                rows.forEach(r => {
                    if (!r.inSheet || r.same) return;
                    if (onlyEmpty && r.inDash) return;      // curated dashboard values win
                    const before = JSON.stringify(next);
                    r.field.apply(next, nums(r.sheetText));
                    if (JSON.stringify(next) !== before) applied.push(r.field.label);
                });

                // The eight numbers above are not everything the sheet knows. Its defect grid
                // and its respiration-vs-temperature table are exactly what the p1-core-4
                // matrix and the p1-core-2 register are for, and attaching a sheet used to
                // leave both untouched — the data was sitting in the file the whole time and
                // only the upload route ever read it. Same readers as that route.
                const psDoc = new DOMParser().parseFromString(sheet.html, 'text/html');

                const sheetDefects = psExtractDefects(psDoc);
                if (sheetDefects.count > 0) {
                    const c4 = { ...(next['p1-core-4'] || {}) };
                    // Fill per row, so a matrix that already carries curated defects keeps them
                    // and only genuinely empty rows are seeded.
                    let seeded = 0;
                    for (let i = 0; i < sheetDefects.count; i++) {
                        if ((c4[`defect_${i}_name`] || '').trim() && onlyEmpty) continue;
                        ['name', 'cause', 'mhp', 'map'].forEach(part => {
                            const v = sheetDefects.data[`defect_${i}_${part}`];
                            if (v) c4[`defect_${i}_${part}`] = v;
                        });
                        seeded++;
                    }
                    if (seeded > 0) {
                        c4.defectCount = Math.max(parseInt(c4.defectCount, 10) || 0, sheetDefects.count);
                        next['p1-core-4'] = c4;
                        applied.push(`Defect matrix (${seeded} row${seeded === 1 ? '' : 's'})`);
                    }
                }

                const sheetRR = psExtractRespiration(psDoc);
                const rrKeys = Object.keys(sheetRR);
                if (rrKeys.length > 0) {
                    const c2 = { ...(next['p1-core-2'] || {}) };
                    let seeded = 0;
                    rrKeys.forEach(k => {
                        // These are target_* keys: the sheet is research, so it never overwrites
                        // a measured temp*_ value, and a curated target stands unless the user
                        // asked for a full overwrite.
                        if (onlyEmpty && String(c2[k] ?? '').trim()) return;
                        c2[k] = sheetRR[k];
                        seeded++;
                    });
                    if (seeded > 0) {
                        next['p1-core-2'] = c2;
                        applied.push(`Respiration targets (${seeded} value${seeded === 1 ? '' : 's'})`);
                    }
                }

                if (!applied.length) { setSheetMsg(onlyEmpty ? 'Nothing to pull — every dashboard field already has a value.' : 'Nothing to pull.'); setTimeout(() => setSheetMsg(''), 6000); return; }
                next['product-sheet'] = { ...sheet, lastSyncedAt: new Date().toISOString() };
                await psWriteFormData(next);
                setSheetMsg(`✓ Pulled into the dashboard (${applied.length}): ${applied.join(' · ')}`);
                setTimeout(() => setSheetMsg(''), 10000);
            };

            const handleRemoveSheet = async () => {
                if (activeProduct?.isAverage) { setSheetMsg('⚠ Select a specific variety first — "All varieties" is a read-only overview.'); setTimeout(() => setSheetMsg(''), 7000); return; }
                if (!window.confirm('Detach the product sheet from this product? The stored copy will be removed.')) return;
                const next = { ...localFormData };
                delete next['product-sheet'];
                await psWriteFormData(next);
                setSheetMsg('Product sheet detached.');
                setTimeout(() => setSheetMsg(''), 5000);
            };

            // Product sheet panel — on the Validation (workflow) tab.
            const renderProductSheetPanel = () => {
                if (!activeProduct) return null;
                const sheet = localFormData['product-sheet'];
                const themeColorClass = activeProduct.state === 'processed' ? 'text-[#084BCD]' : 'text-[#008837]';

                if (!sheet?.html) {
                    return (
                        <div className="p-6">
                            <p className="text-sm text-slate-500 mb-4 max-w-2xl">Attach the product sheet generated with the PerfoTec product-sheet skill. The dashboard then compares its research values with your trial-validated data and can sync them both ways.</p>
                            <div className="flex flex-wrap items-center gap-3">
                                <button onClick={handleAttachSheet} className="flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest bg-[#084BCD] text-white px-4 py-2.5 rounded-lg hover:opacity-90 transition-opacity"><Upload size={14}/> Attach product sheet</button>
                                {sheetMsg && <span className="text-xs font-bold text-amber-600">{sheetMsg}</span>}
                            </div>
                        </div>
                    );
                }

                const rows = psBuildComparison(sheet.html, localFormData);
                const pushable = rows.filter(r => r.inDash && !r.same).map(r => r.field.key);
                const pullable = rows.filter(r => r.inSheet && !r.inDash);
                // The comparison table covers the eight shared numbers, but the pull also seeds
                // the defect matrix and the respiration targets. Count those as pullable or the
                // button sits disabled on a sheet whose only remaining offer is its defect grid.
                const psSheetDoc = new DOMParser().parseFromString(sheet.html, 'text/html');
                const extraPullable = (() => {
                    const c4 = localFormData['p1-core-4'] || {}, c2 = localFormData['p1-core-2'] || {};
                    const d = psExtractDefects(psSheetDoc);
                    let n = 0;
                    for (let i = 0; i < d.count; i++) if (!(c4[`defect_${i}_name`] || '').trim()) n++;
                    Object.keys(psExtractRespiration(psSheetDoc)).forEach(k => { if (!String(c2[k] ?? '').trim()) n++; });
                    return n;
                })();
                const pullCount = pullable.length + extraPullable;
                return (
                    <div className="overflow-hidden">
                        <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center gap-3">
                            <button onClick={() => handlePushToSheet(pushable)} disabled={!pushable.length || activeProduct.isAverage}
                                className={`flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest px-4 py-2.5 rounded-lg transition-opacity ${pushable.length && !activeProduct.isAverage ? 'bg-[#008837] text-white hover:opacity-90' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                title="Write the dashboard's trial-validated values into the sheet">
                                <RefreshCw size={13}/> Update sheet with practice data{pushable.length ? ` (${pushable.length})` : ''}
                            </button>
                            <button onClick={() => handlePullFromSheet(true)} disabled={!pullCount || activeProduct.isAverage}
                                className={`flex items-center gap-2 text-xs font-bold font-spartan uppercase tracking-widest px-4 py-2.5 rounded-lg border transition-colors ${pullCount && !activeProduct.isAverage ? 'border-[#084BCD] text-[#084BCD] hover:bg-blue-50' : 'border-slate-200 text-slate-400 cursor-not-allowed'}`}
                                title="Fill empty dashboard fields from the sheet's research values">
                                <Download size={13}/> Fill empty dashboard fields from sheet{pullCount ? ` (${pullCount})` : ''}
                            </button>
                            {sheetMsg && <span className="text-xs font-bold text-slate-700 flex-1 min-w-[200px]">{sheetMsg}</span>}
                            <div className="flex flex-wrap items-center gap-2 ml-auto">
                                <button onClick={handleViewSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-white border border-slate-200 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors"><Eye size={13}/> View</button>
                                <button onClick={handleDownloadSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-white border border-slate-200 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors"><Download size={13}/> Download</button>
                                <button onClick={handleAttachSheet} className="flex items-center gap-1.5 text-xs font-bold font-spartan uppercase tracking-widest bg-white border border-slate-200 text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors"><Upload size={13}/> Replace</button>
                                <button onClick={handleRemoveSheet} className="p-2 text-slate-400 hover:text-red-600 transition-colors" title="Detach sheet"><Trash2 size={14}/></button>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left border-collapse ps-table">
                                <thead><tr><th>Parameter</th><th>Product sheet (research)</th><th>Dashboard (practice)</th><th>Status</th></tr></thead>
                                <tbody>
                                    {rows.map(r => {
                                        const status = !r.found ? { txt: 'Not in sheet', cls: 'text-slate-400' }
                                            : r.same ? { txt: '✓ In sync', cls: 'ps-good' }
                                            : (r.inSheet && r.inDash) ? { txt: '⚠ Differs', cls: 'ps-warn' }
                                            : r.inDash ? { txt: '→ Sheet empty', cls: 'ps-target' }
                                            : { txt: '← Dashboard empty', cls: 'ps-target' };
                                        return (
                                            <tr key={r.field.key}>
                                                <td className="font-bold text-slate-900">{r.field.label}</td>
                                                <td className={r.inSheet ? '' : 'text-slate-300'}>{r.inSheet ? r.sheetText : '—'}</td>
                                                <td className={r.inDash ? 'ps-target' : 'text-slate-300'}>{r.inDash ? `${r.dashVal} ${r.field.unit}` : '—'}</td>
                                                <td className={status.cls + ' whitespace-nowrap'}>{status.txt}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <p className="px-6 py-3 text-[11px] text-slate-400 italic border-t border-slate-200">Q₁₀ and shelf life are only ever written towards the sheet — they are proven by measurements and trials, never taken from research text.</p>
                    </div>
                );
            };

            // The trial table's model, built once per render of the Workflow tab:
            // the rows grouped per report (rows not linked to a report on top, then
            // the newest report first), the data-check proposals, and the counts
            // the folded section header shows.
            const trialRegisterModel = () => {
                const taskData = localFormData['p2-pack-master'] || {};
                const count = Math.max(1, trialRowCountOf(taskData));
                const B = window.PerfoTecBoard;
                const tr = B && B.trialRows ? B.trialRows(taskData) : [];
                const rowByI = new Map(tr.map(r => [r.i, r]));
                // Proposals only (board-db trialDataChecks), see the data check below.
                const names = [activeProduct.name, ...(activeProduct.aliases || [])].filter(Boolean);
                const checks = B && B.trialDataChecks && !activeProduct.isAverage ? B.trialDataChecks(taskData, names, filmReg ? filmReg.films : null) : [];
                // The row being edited — the one holding the cursor, read from the
                // page as FastInput does — keeps the group it had (same product,
                // same number of rows); a row that has moved opens its new group.
                const ae = document.activeElement;
                const aeRow = ae && ae.closest ? ae.closest('[data-trial-row]') : null;
                const editRow = aeRow ? Number(aeRow.getAttribute('data-trial-row')) : null;
                const memo = trialGroupMemoRef.current;
                const same = memo.productId === activeProduct.id && memo.count === count;
                const keys = {}, byKey = new Map();
                for (let i = 0; i < count; i++) {
                    const key = same && i === editRow && memo.keys[i] !== undefined ? memo.keys[i] : trialReportKey(taskData, i);
                    if (same && memo.keys[i] !== undefined && memo.keys[i] !== key) trialMovedOpenRef.current.add(key);
                    keys[i] = key;
                    if (!byKey.has(key)) byKey.set(key, []);
                    byKey.get(key).push(i);
                }
                trialGroupMemoRef.current = { productId: activeProduct.id, count, keys };
                const f = (i, k) => String(taskData[`pack_opt_${i}_${k}`] ?? '').trim();
                const uniq = (vals) => [...new Set(vals.filter(Boolean))];
                const groups = [...byKey.entries()].map(([key, idxs]) => {
                    const dates = uniq(idxs.map(i => f(i, 'date'))).sort();
                    const scored = idxs.map(i => rowByI.get(i)).filter(r => r && r.shelfLife);
                    scored.sort((a, b) => (b.shelfLife.days - a.shelfLife.days) || ((b.shelfLife.open ? 1 : 0) - (a.shelfLife.open ? 1 : 0)) || ((b.shelfLife.score || 0) - (a.shelfLife.score || 0)));
                    return {
                        key, idxs,
                        date: dates[dates.length - 1] || '',
                        pdf: idxs.map(i => f(i, 'pdf')).find(Boolean) || '',
                        project: idxs.map(i => f(i, 'project')).find(Boolean) || '',
                        tags: [...uniq(idxs.map(i => f(i, 'type'))), ...uniq(idxs.map(i => f(i, 'temp'))).sort((a, b) => parseFloat(a) - parseFloat(b)).map(t => `${t} °C`), ...uniq(idxs.map(i => f(i, 'variety')))],
                        trials: idxs.filter(i => rowByI.has(i)).length,
                        best: scored[0] || null,
                        r2: idxs.some(i => parseInt(f(i, 'round'), 10) > 1),
                        checks: checks.filter(c => idxs.includes(c.i)).length,
                    };
                }).sort((a, b) => (!a.key !== !b.key) ? (!a.key ? -1 : 1) : (a.date !== b.date ? (a.date < b.date ? 1 : -1) : a.idxs[0] - b.idxs[0]));
                const reports = groups.filter(g => g.key);
                const defaultOpen = new Set(tr.length <= 12 ? groups.map(g => g.key) : ['', ...reports.slice(0, 1).map(g => g.key)]);
                const openSet = trialOpenGroups || defaultOpen;
                const isOpen = (key) => openSet.has(key) || trialMovedOpenRef.current.has(key);
                const latest = reports.map(g => g.date).filter(Boolean).sort().pop() || '';
                return { taskData, count, tr, checks, groups, reports, defaultOpen, isOpen, latest };
            };
            const toggleTrialGroup = (tm, key) => {
                const open = tm.isOpen(key);
                trialMovedOpenRef.current.delete(key);
                setTrialOpenGroups(prev => { const n = new Set(prev || tm.defaultOpen); if (open) n.delete(key); else n.add(key); return n; });
            };
            // Bring the rows that came from the trial workflow up to date with their
            // reports as they are now: results scored since, and fields the rows
            // did not have when they were imported (the gas at packing, the
            // perforation and flush). Only reports that already have rows here; a
            // field corrected by hand stays (board-db applyReportToProduct).
            const refreshFromReports = async () => {
                const B = window.PerfoTecBoard;
                if (!B || !B.readProjectData || !B.applyReportToProduct || !activeProduct || activeProduct.isAverage) return;
                const productId = activeProduct.id;
                let fd = latestFormData(productId);
                const master = fd['p2-pack-master'] || {};
                const n = trialRowCountOf(master);
                const ids = new Set(); let fromFiles = 0;
                for (let i = 0; i < n; i++) {
                    const id = String(master[`pack_opt_${i}_project`] || '').trim();
                    if (id) ids.add(id); else if (String(master[`pack_opt_${i}_pdf`] || '').trim()) fromFiles++;
                }
                setInlineTrialMsg(ids.size ? `Reading ${ids.size} report${ids.size !== 1 ? 's' : ''}…` : '');
                let updated = 0, failed = 0, changed = false;
                for (const id of ids) {
                    try {
                        const report = await B.readProjectData(id, 'report');
                        if (!report || report.isPerfoTecReport !== true || !Array.isArray(report.groups)) { failed++; continue; }
                        const r = B.applyReportToProduct(fd, report, { projectId: id });
                        if (r.imported || r.updated) { fd = r.formData; updated += (r.updated || 0) + (r.imported || 0); changed = true; }
                    } catch (e) { failed++; }
                }
                if (changed && activeProductIdRef.current === productId) { setLocalFormData(withHistory(fd, `Refreshed from reports: ${updated} row${updated !== 1 ? 's' : ''} brought up to date`)); scheduleAutosave(productId); }
                const parts = [ids.size ? `✓ ${updated} row${updated !== 1 ? 's' : ''} brought up to date from ${ids.size - failed} report${ids.size - failed !== 1 ? 's' : ''}` : 'No rows here are linked to a report in the trial workflow',
                    failed ? `${failed} report${failed !== 1 ? 's' : ''} could not be read` : '',
                    fromFiles ? `${fromFiles} row${fromFiles !== 1 ? 's' : ''} came from files: import those JSON files again to update them` : ''].filter(Boolean);
                setInlineTrialMsg(parts.join(' · '));
                setTimeout(() => setInlineTrialMsg(''), 12000);
            };
            const addTrialRow = (tm) => {
                if (activeProduct?.isAverage) return;
                handleFieldChange('p2-pack-master', 'packOptCount', tm.count + 1);
                setTrialOpenGroups(prev => prev ? new Set([...prev, '']) : prev);
                setFoldOpen('trials', true);
            };

            // ── Verification ──────────────────────────────────────────────────────
            // What used to be worked through step by step is read from the data
            // (Luke 2026-11-11): the sheet, the properties, the respiration, the
            // trials and what they proved. Only two things stay a decision of
            // product management: releasing the product and parking it (stored
            // where the market-ready check always was, p4-confirm-1.gate4Decision).
            const RELEASE_VALUE = 'MARKET-READY — validated, ready for the market';
            const PARK_VALUE = 'PARK — stop this product (document reason)';
            const verificationChecks = (fd, hubResp) => {
                const B = window.PerfoTecBoard;
                const has = (v) => String(v ?? '').trim() !== '';
                const bp = B && B.trialBestPractice ? B.trialBestPractice(fd['p2-pack-master'] || {}) : { groups: [], best: null, rows: [] };
                const best = bp.best;
                const rounds = new Set(bp.rows.map(r => r.round).filter(Boolean)).size;

                                                <span className="text-4xl font-spartan font-bold text-slate-900">{advisedTV !== null ? advisedTV : '-'}</span>
                                                {recipe && (
                                                    <div className="mt-3 text-xs text-slate-600 space-y-1 text-left">
                                                        <p>Range TV {recipe.min}–{recipe.max} for this weight ({adj && adj.betaSource === 'tds' ? "from the film's TDS ratio up to a pack that behaves like the calibrated one" : 'the spread of the calibration trials'}).</p>
                                                        {adj && adj.factor != null && (
                                                            <div className={`my-2 p-2.5 rounded-lg border space-y-1 ${recipe.film ? 'bg-green-50 border-green-200 text-green-900' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                                                                {recipe.film && <p><span className="font-bold">Film: {recipe.film.name}.</span> {recipe.calibratedOn === 'film' ? `Calibrated on its own trials with a real TV.` : 'No real TV with this film yet: the level of the calibrated configuration, moved to this film.'}</p>}
                                                                <p>CO₂ : O₂ of the pack <span className="font-bold">{adj.beta.toFixed(2)}</span> — {BETA_SOURCE[adj.betaSource]}{adj.betaN ? ` (${adj.betaN} trial${adj.betaN !== 1 ? 's' : ''})` : ''}{recipe.calibratedOn !== 'film' && adj.betaSource !== 'reference' ? `; the calibrated pack ${adj.betaR.toFixed(2)}` : ''}.</p>
                                                                <p>Expected atmosphere: <span className="font-bold">O₂ ≈ {pct(adj.o2)}% · CO₂ ≈ {pct(adj.co2)}%</span>{adj.capped === 'o2-floor' ? ` — as deep as the product's O₂ floor (${pct(adj.floor)}%)` : adj.capped === 'co2-ceiling' ? ` — held at CO₂ ${pct(adj.ceiling)}%, the most the product tolerates or the trials proved` : ''}.</p>
                                                                {recipe.referenceTv != null && Math.abs(recipe.referenceTv - recipe.tv) >= 1 && <p className="text-slate-500">The calibrated configuration ({recipe.material}) packs TV {recipe.referenceTv} at this temperature and weight.</p>}
                                                                {adj.betaSource === 'polymer' && <p className="text-amber-800">No trial with this film itself yet — {adj.betaFrom.join(', ')} stand{adj.betaFrom.length === 1 ? 's' : ''} in. Confirm with a trial.</p>}
                                                                {adj.betaSource === 'tds' && <p className="text-amber-800 font-bold">Estimate: the TDS ratio is the film body alone; laser holes pull a pack's ratio down, so the real TV lies within the range. Confirm with a trial.</p>}
                                                            </div>
                                                        )}
                                                        {adj && adj.factor == null && (
                                                            <p className="my-2 p-2.5 rounded-lg border bg-amber-50 border-amber-200 text-amber-900">
                                                                {adj.reason === 'no-ratio'
                                                                    ? `Nothing known yet about how a pack of ${recipe.film ? recipe.film.name : 'this film'} behaves — no trial with it or another film of its polymer, and no OTR/CO₂TR in the register. The advice is the calibrated configuration's; fill in the film's OTR and CO₂TR (Database → Films) for an estimate.`
                                                                    : 'The calibrated configuration has no O₂/CO₂ logged, so a film cannot be compared with it. The advice is that configuration\'s own.'}
                                                            </p>
                                                        )}
                                                        <p><span className="font-bold">Temperature:</span> follows {TV_CURVE_SOURCE[recipe.source]} (Q₁₀ {recipe.q10.toFixed(2)}).</p>
                                                        <p><span className="font-bold">Level:</span> {recipe.n} trial{recipe.n !== 1 ? 's' : ''} with a real TV of the configuration that achieved {atmosphereText(recipe.o2, recipe.co2) || 'its atmosphere'} ({recipe.type}, {recipe.condition}; variant {recipe.material}) at {recipe.temps.min === recipe.temps.max ? `${recipe.temps.min}` : `${recipe.temps.min}–${recipe.temps.max}`} °C.</p>
                                                        <p className="text-slate-500">That configuration vs current packaging: {recipe.record.better} better · {recipe.record.equal} equal · {recipe.record.worse} worse ({recipe.record.compared} rounds).</p>
                                                        {recipe.extrapolated && <p className="text-amber-700 font-bold flex items-start gap-1"><AlertCircle size={13} className="shrink-0 mt-0.5"/>Estimate: {calcTemp} °C lies outside the tested temperatures, so the advice follows the curve there. Confirm with a trial.</p>}
                                                        {recipe.source === 'default' && <p className="text-amber-700 flex items-start gap-1"><AlertCircle size={13} className="shrink-0 mt-0.5"/>No respiration data: a typical Q₁₀ of 2 is used. Log respiration rates (Workflow) to make the curve this product's own.</p>}
                                                    </div>
                                                )}
                                                {advice && !recipe && advice.reason !== 'no-input' && (
                                                    <p className="mt-3 text-xs text-amber-800 text-left">No advice: {TV_CURVE_REASON[advice.reason] ? TV_CURVE_REASON[advice.reason].charAt(0).toLowerCase() + TV_CURVE_REASON[advice.reason].slice(1) : 'there is nothing to calibrate the curve on.'}</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                        </NarrowFold>

                        <NarrowFold title="Defects & prevention">
                        <div className="bg-white border border-slate-200 shadow-sm rounded-xl">
                            <div className={`p-4 border-b border-slate-200 bg-slate-50`}><h3 className={`font-spartan font-bold text-lg flex items-center gap-2 text-slate-900`}><FileText size={18} className={themeColorClass} /> Defects & Prevention Matrix</h3></div>
                            <div className="p-0 overflow-x-auto">
                                <table className="w-full text-sm text-left border-collapse table-fixed min-w-[800px]">
                                    <thead className="text-[10px] font-spartan uppercase bg-white">
                                        <tr><th className="p-4 border-r border-b border-slate-200 text-slate-500 w-[20%]">Defect</th><th className="p-4 border-r border-b border-slate-200 text-slate-500 w-[25%]">Physiological Cause</th><th className="p-4 border-r border-blue-400 bg-blue-400 text-white w-[25%]">MHP Effect (Moisture)</th><th className="p-4 border-green-700 bg-green-700 text-white w-[30%]">MAP Effect (Gas)</th></tr>
                                    </thead>
                                    <tbody>
                                        {(() => {
                                            const count = p1Core4.defectCount || 7; const indices = Array.from({ length: count }, (_, i) => i); let hasData = false;
                                            const rows = indices.map(idx => {
                                                const name = p1Core4[`defect_${idx}_name`]; const cause = p1Core4[`defect_${idx}_cause`]; const mhp = p1Core4[`defect_${idx}_mhp`]; const map = p1Core4[`defect_${idx}_map`];
                                                if (name || cause || mhp || map) hasData = true; if (!name && !cause && !mhp && !map) return null;
                                                return (
                                                    <tr key={idx} className="border-b last:border-0 border-slate-200 align-top bg-white">
                                                        <td className="p-4 border-r border-slate-200 font-bold text-slate-900">{name || '-'}</td>
                                                        <td className="p-4 border-r border-slate-200 text-slate-500">{cause || '-'}</td>
                                                        <td className="p-4 border-r border-slate-200 bg-blue-50 text-blue-700 font-medium">{mhp || '-'}</td>
                                                        <td className="p-4 bg-green-50 text-green-700 font-bold">{map || '-'}</td>
                                                    </tr>
                                                );
                                            }).filter(Boolean);
                                            if (!hasData) return <tr><td colSpan="4" className="p-8 text-center text-slate-500 bg-slate-50">No defects defined in R&D Data.</td></tr>;

                                        })()}

                                </table>
