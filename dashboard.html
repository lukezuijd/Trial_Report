    <!-- Tailwind CSS for styling -->

         overrides MUST be assigned AFTER it loads. They used to sit before it,
         which threw "tailwind is not defined" and silently discarded the whole

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PerfoTec Brand 2.0 Tailwind token overrides -->

    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    blue: {
                        50:'#F1F6FF', 100:'#e3ecff', 200:'#c3d5f7',
                        300:'#91b0f0', 400:'#5a85e7', 500:'#2c5fd8',
                        600:'#084BCD', 700:'#073da6', 800:'#062e7e', 900:'#042057'
                    },
                    green: {

                        300:'#66cc90', 400:'#2db565', 500:'#00a346',

                    }
                }

        }
    }

    </script>

    <style>
        /* === PERFOTEC BRAND FONTS === */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        /* === PerfoTec Brand 2.0 tokens — source: perfotec-brand-tokens.json v2.0 === */
        :root {
            /* Core palette */
            --pf-green:      #008837;  /* PerfoTec Green — brand, contact, sustainability */
            --pf-blue:       #084BCD;  /* PerfoTec Blue  — primary action, data, features */
            --pf-charcoal:   #333333;  /* Body & heading text */
            --pf-ink:        #1A1B1F;  /* Display headlines, dark backgrounds */
            --pf-mist:       #F7F7F7;  /* Section/card backgrounds */
            --pf-blue-tint:  #F1F6FF;  /* Soft tech section backgrounds */
            --pf-cool-gray:  #E4EBF3;  /* Borders, dividers, UI surfaces */
            /* Legacy aliases (keep for Tailwind arbitrary values still in JSX) */
            --brand-green:      #008837;
            --brand-blue:       #084BCD;
            --brand-dark-blue:  #063aaa;
            --font-heading: 'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif;
            --font-body:    'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        body { font-family: 'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif; background-color: #F7F7F7; color: #333333; }

        /* Redirect legacy font classes to Montserrat */
        .font-spartan { font-family: 'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif; font-weight: 800; letter-spacing: -0.01em; }
        .font-inter   { font-family: 'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif; }

        /* Hero banner: clean blue instead of dark metal */
        .bg-metal-gradient { background: linear-gradient(135deg, #084BCD 0%, #063aaa 55%, #052e85 100%); }

        /* Remove skew — replace with rounded corners so buttons feel like the reference suite */
        .shape-80deg         { transform: none !important; border-radius: 0.625rem; overflow: hidden; }
        .shape-80deg-reverse { transform: none !important; display: flex; align-items: center; justify-content: center; }

        /* Active-step shadow — softer, no horizontal offset */
        .confident-overlap { box-shadow: 0 4px 24px rgba(8, 75, 205, 0.10); z-index: 20; border-radius: 0.75rem; }

        /* Dot pattern — subtle blue tint to match blue hero */
        .dot-pattern { background-image: radial-gradient(rgba(255,255,255,0.15) 1.5px, transparent 1.5px); background-size: 24px 24px; }

        /* Scrollbar — slate tones */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #084BCD; }

        textarea { resize: vertical; min-height: 70px; }

        /* === PRODUCT-SHEET DESIGN SYSTEM ===================================
           Mirrors the PerfoTec product sheet (perfotec-product-sheet skill) so the
           dashboard and the sheet read as one document: same card, same eyebrow,
           same type scale. Tokens copied verbatim from the sheet template. */
        .ps-card {
            background: #FFFFFF;
            border: 1px solid var(--pf-cool-gray);
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,.08);
            transition: transform .2s, box-shadow .2s;
        }
        .ps-card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,0,0,.14); }
        .ps-eyebrow {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .08em; color: var(--pf-blue);
        }
        .ps-title { font-size: 28px; font-weight: 800; color: var(--pf-ink); line-height: 1.2; letter-spacing: -0.01em; }
        .ps-subtitle { font-size: 20px; font-weight: 800; color: var(--pf-ink); line-height: 1.25; }
        .ps-value { font-size: 26px; font-weight: 800; color: var(--pf-ink); line-height: 1.1; }
        /* Sheet table chrome: solid blue head, zebra rows, blue targets */
        .ps-table thead tr { background: var(--pf-blue); color: #fff; }
        .ps-table thead th {
            padding: 12px 16px; font-weight: 700; text-align: left;

        }
        .ps-table tbody tr { border-bottom: 1px solid var(--pf-cool-gray); }
        .ps-table tbody tr:nth-child(even) { background: var(--pf-mist); }
        .ps-table tbody tr:hover { background: var(--pf-blue-tint); }
        .ps-table tbody td { padding: 12px 16px; vertical-align: top; }
        .ps-target { font-weight: 700; color: var(--pf-blue); }
        .ps-good   { font-weight: 700; color: var(--pf-green); }
        .ps-warn   { font-weight: 700; color: #c0392b; }

        /* Focus ring — matches reference suite */
        *:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; }

        /* Excel-like table — slate palette */
        .excel-table th { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; font-weight: 700; font-size: 11px; text-transform: uppercase; color: #64748b; white-space: nowrap; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 0; position: relative; }
        .excel-table input, .excel-table select { width: 100%; height: 100%; padding: 8px 12px; border: none; outline: none; background: transparent; font-size: 13px; color: #1e293b; font-family: 'Montserrat', sans-serif; }
        .excel-table input:focus, .excel-table select:focus { background-color: #F1F6FF; box-shadow: inset 0 0 0 2px #084BCD; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            FileText, Target, Users, Rocket, CheckCircle2, ChevronRight, Activity, 
            ShieldCheck, AlertCircle, X, Leaf, ShoppingCart, Box, Layers, Database, 
            Calculator, TestTube, ThermometerSnowflake, LineChart, Wind, UploadCloud, Check, FileCheck, Upload,
            Cpu, Link as LinkIcon, Plus, FolderOpen, Loader2, MessageSquare, Briefcase, CheckSquare, Square,
            Image as ImageIcon, Beaker, Globe, Download, LayoutDashboard, ListTodo, Eye, Table, RefreshCw, Merge, LayoutGrid, Filter, Package, Trash2, Search, StickyNote
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from 'firebase/firestore';

        // --- Firebase Init ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'perfotec-gtm-app';
        
        let app, auth, db;
        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        }

        // --- Regression Math Helper ---
        const getRegressionCurve = (taskData, type = 'O2') => {
            if (!taskData) return null;
            const actualPoints = []; const targetPoints = [];
            const temps = new Set();
            Object.keys(taskData).forEach(k => { const match = k.match(/^(?:target_)?temp(-?[\d.]+)_/); if (match) temps.add(parseFloat(match[1])); });

            temps.forEach(t => {
                const actVal = parseFloat(taskData[`temp${t}_${type}`]);
                if (!isNaN(actVal) && actVal > 0) actualPoints.push({ t, lnR: Math.log(actVal), rate: actVal });

                const tgtVal = parseFloat(taskData[`target_temp${t}_${type}`]);
                if (!isNaN(tgtVal) && tgtVal > 0) targetPoints.push({ t, lnR: Math.log(tgtVal), rate: tgtVal });
            });

            const isActual = actualPoints.length >= 3; const usePoints = isActual ? actualPoints : targetPoints;
            if (usePoints.length >= 3) {
                const n = usePoints.length; let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                usePoints.forEach(p => { sumX += p.t; sumY += p.lnR; sumXY += p.t * p.lnR; sumXX += p.t * p.t; });
                const denominator = (n * sumXX - sumX * sumX);
                if (denominator !== 0) { const slope = (n * sumXY - sumX * sumY) / denominator; const intercept = (sumY - slope * sumX) / n; return { slope, intercept, points: usePoints, isActual }; }
            }
            return null;
        };

        const calculateQ10 = (taskData) => { const reg = getRegressionCurve(taskData, 'O2') || getRegressionCurve(taskData, 'CO2'); if (reg) return Math.exp(10 * reg.slope).toFixed(2); return ""; };

        // --- Dual Predictive Chart Component ---
        const PredictiveChart = ({ taskData }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);

            useEffect(() => {
                if (!taskData || !chartRef.current || !window.Chart) return;
                
                const regO2 = getRegressionCurve(taskData, 'O2');
                const regCO2 = getRegressionCurve(taskData, 'CO2');

                const datasets = [];

                if (regO2) {
                    const predO2 = []; for (let t = 0; t <= 25; t += 1) predO2.push({ x: t, y: Math.exp(regO2.slope * t + regO2.intercept).toFixed(2) });
                    const scatO2 = regO2.points.map(p => ({ x: p.t, y: p.rate }));
                    datasets.push({ type: 'line', label: 'Pred. O2 Curve', data: predO2, borderColor: '#084BCD', backgroundColor: 'rgba(8, 75, 205, 0.1)', borderWidth: 2, tension: 0.4, fill: false, pointRadius: 0 });
                    datasets.push({ type: 'scatter', label: regO2.isActual ? 'Actual O2' : 'Target O2', data: scatO2, backgroundColor: '#084BCD', borderColor: '#084BCD', pointRadius: 6 });
                }

                if (regCO2) {
                    const predCO2 = []; for (let t = 0; t <= 25; t += 1) predCO2.push({ x: t, y: Math.exp(regCO2.slope * t + regCO2.intercept).toFixed(2) });
                    const scatCO2 = regCO2.points.map(p => ({ x: p.t, y: p.rate }));
                    datasets.push({ type: 'line', label: 'Pred. CO2 Curve', data: predCO2, borderColor: '#008837', backgroundColor: 'rgba(0, 136, 55, 0.1)', borderWidth: 2, tension: 0.4, fill: false, pointRadius: 0 });
                    datasets.push({ type: 'scatter', label: regCO2.isActual ? 'Actual CO2' : 'Target CO2', data: scatCO2, backgroundColor: '#008837', borderColor: '#008837', pointRadius: 6, pointStyle: 'triangle' });
                }

                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'scatter',
                    data: { datasets },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'linear', title: { display: true, text: 'Temperature (°C)' }, min: 0, max: 25, ticks: { stepSize: 5 } }, y: { title: { display: true, text: 'Respiration Rate (mL/kg/24h)' }, beginAtZero: true } }, plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } } }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [taskData]);

            return (
                <div className="mt-8 pt-6 border-t border-slate-200">
                    <h6 className="flex items-center gap-2 text-xs font-spartan font-bold uppercase tracking-widest text-slate-900 mb-4"><LineChart size={14} className="text-blue-600"/> Predictive Respiration Curve</h6>
                    <div className="h-[300px] w-full relative"><canvas ref={chartRef}></canvas></div>
                </div>
            );
        };

        // Quality-over-time curves per trial: shows how the score declines over the days,
        // with the sellable limit (score 6). Rating and shelf life are one linked story —
        // a trial stopped at day 14 scores higher than the same trial measured to day 28.
        const QualityCurveChart = ({ taskData, selected }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            const count = parseInt(taskData.packOptCount) || 0;
            let curveCount = 0;
            for (let i = 0; i < count; i++) if (taskData[`pack_opt_${i}_curve`]) curveCount++;
            const selectedKey = selected ? [...selected].sort((a, b) => a - b).join(',') : 'all';

            useEffect(() => {
                if (!chartRef.current || !window.Chart) return;
                const n = parseInt(taskData.packOptCount) || 0;
                const series = [];
                for (let i = 0; i < n; i++) {
                    if (selected && !selected.has(i)) continue;
                    const curve = taskData[`pack_opt_${i}_curve`];
                    if (!curve) continue;
                    const pts = String(curve).split('|').map(s => { const parts = s.split(':'); return { x: parseFloat(parts[0]), y: parseFloat(parts[1]) }; }).filter(p => !isNaN(p.x) && !isNaN(p.y)).sort((a, b) => a.x - b.x);
                    if (pts.length < 2) continue;
                    const mat = taskData[`pack_opt_${i}_material`] || '';
                    const label = [mat || taskData[`pack_opt_${i}_type`] || `Trial ${i + 1}`, taskData[`pack_opt_${i}_date`]].filter(Boolean).join(' · ');
                    series.push({ label, pts, isControl: /control|bopp|standard/i.test(mat) });
                }
                if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; }
                if (series.length === 0) return;
                const palette = ['#008837', '#084BCD', '#7c3aed', '#0891b2', '#f59e0b', '#dc2626'];
                let ci = 0;
                const maxDay = Math.max(...series.flatMap(s => s.pts.map(p => p.x)));
                const datasets = series.map(s => {
                    const color = s.isControl ? '#94a3b8' : palette[(ci++) % palette.length];
                    return { type: 'line', label: s.label, data: s.pts, borderColor: color, backgroundColor: color, borderWidth: 2.5, tension: 0.3, pointRadius: 4, borderDash: s.isControl ? [6, 4] : [] };
                });
                datasets.push({ type: 'line', label: 'Sellable limit (score 6)', data: [{ x: 0, y: 6 }, { x: maxDay, y: 6 }], borderColor: '#dc2626', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 });
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'line',
                    data: { datasets },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'linear', title: { display: true, text: 'Days after packing' }, min: 0 }, y: { title: { display: true, text: 'Quality score' }, min: 0, max: 10, ticks: { stepSize: 2 } } }, plugins: { legend: { position: 'top' }, tooltip: { mode: 'nearest', intersect: false } } }
                });
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [taskData, selectedKey]);

            if (curveCount === 0) return (
                <div className="h-[120px] flex items-center justify-center text-sm text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-lg">
                    Quality curves appear here after importing a trial report (JSON) — every measured day is kept, not just the end score.
                </div>
            );
            if (selected && selected.size === 0) return (
                <div className="h-[120px] flex items-center justify-center text-sm text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-lg">
                    No trials selected — pick one or more trials above to plot their quality curves.
                </div>
            );
            return <div className="h-[320px] w-full relative"><canvas ref={chartRef}></canvas></div>;
        };

        const PackPredictiveChart = ({ taskData, targetO2 }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            const O2_AMBIENT = 20.9;
            const [stats, setStats] = useState(null);

            useEffect(() => {
                if (!chartRef.current || !window.Chart) return;

                const count = parseInt(taskData.packOptCount) || 0;
                const tgtO2 = parseFloat(targetO2);
                const hasTarget = !isNaN(tgtO2) && tgtO2 > 0 && tgtO2 < O2_AMBIENT;

                // ── Collect all valid data points ──────────────────────────────────────
                const allPoints = [];
                for (let i = 0; i < count; i++) {
                    const t         = parseFloat(taskData[`pack_opt_${i}_temp`]);
                    const w         = parseFloat(taskData[`pack_opt_${i}_weight`]);
                    const tv        = parseFloat(taskData[`pack_opt_${i}_trans`]);
                    const pType     = taskData[`pack_opt_${i}_type`] || '';
                    const measO2    = parseFloat(taskData[`pack_opt_${i}_o2`]);
                    const rating    = parseFloat(taskData[`pack_opt_${i}_rating`]);
                    const condition = taskData[`pack_opt_${i}_condition`] || 'MAP';
                    if (isNaN(t) || isNaN(w) || w <= 0 || isNaN(tv) || tv <= 0) continue;
                    const weightKg = (pType === 'Pallet') ? w : (w / 1000);
                    let tvPerKg = tv / weightKg;
                    let normalized = false;
                    let inEqRange = false;
                    let hasO2 = false;
                    // inEqRange and normalization only apply for MAP condition
                    if (condition === 'MAP') {
                        if (!isNaN(measO2) && measO2 > 0 && measO2 < O2_AMBIENT) {
                            hasO2 = true;
                            inEqRange = measO2 >= 1 && measO2 <= 10;
                            if (hasTarget) {
                                const cf = (O2_AMBIENT - measO2) / (O2_AMBIENT - tgtO2);
                                tvPerKg *= cf;
                                normalized = true;
                            }
                        }
                    }
                    const r = isNaN(rating) ? 0 : Math.max(0, Math.min(10, rating));
                    allPoints.push({ t, tvPerKg, measO2, rating: r, normalized, inEqRange, hasO2, condition, id: i });
                }

                if (allPoints.length < 2) {
                    if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; }
                    setStats(null); return;
                }

                // ── Filter for regression: MAP points in equilibrium O₂ range 1–10% only ──
                // Points with O₂ > 10% come from over-perforated experiments and
                // are unreliable predictors of steady-state MAP behaviour (Fonseca 2002).
                // MHP and OPEN conditions are excluded from regression entirely.
                const regrPoints = allPoints.filter(p => p.condition === 'MAP' && p.inEqRange);

                let A = null, bSlope = null, q10 = null, r2 = null, mseLn = null, xwMean = null, Sxx = null;
                if (regrPoints.length >= 2) {
                    // Weighted OLS in log-space:  ln(TV/kg) = ln(A) + b·T
                    // Q10 = exp(10·b),  weight = rating² (unrated rows → 0.25)
                    const pts = regrPoints.map(p => ({
                        x: p.t,
                        y: Math.log(p.tvPerKg),
                        w: p.rating > 0 ? p.rating * p.rating : 0.25
                    }));
                    const W     = pts.reduce((s, p) => s + p.w, 0);
                    const xwM   = pts.reduce((s, p) => s + p.w * p.x, 0) / W;
                    const ywM   = pts.reduce((s, p) => s + p.w * p.y, 0) / W;
                    const Sxx_  = pts.reduce((s, p) => s + p.w * (p.x - xwM) ** 2, 0);
                    const Sxy   = pts.reduce((s, p) => s + p.w * (p.x - xwM) * (p.y - ywM), 0);
                    if (Sxx_ > 0) {
                        bSlope = Sxy / Sxx_;
                        const aInt = ywM - bSlope * xwM;
                        A = Math.exp(aInt);
                        const rawQ10 = Math.exp(10 * bSlope);
                        // Clamp Q10 to physically realistic range for fresh produce (literature: 1.3–5.0)
                        q10 = Math.max(1.3, Math.min(5.0, rawQ10));
                        if (Math.abs(rawQ10 - q10) > 0.0001) {
                            bSlope = Math.log(q10) / 10;
                            A = Math.exp(ywM - bSlope * xwM);
                        }
                        const lnA   = Math.log(A);
                        const SStot = pts.reduce((s, p) => s + p.w * (p.y - ywM) ** 2, 0);
                        const SSres = pts.reduce((s, p) => s + p.w * (p.y - (lnA + bSlope * p.x)) ** 2, 0);
                        r2     = SStot > 0 ? Math.max(0, 1 - SSres / SStot) : null;
                        mseLn  = regrPoints.length > 2 ? SSres / (regrPoints.length - 2) : SSres;
                        xwMean = xwM;
                        Sxx    = Sxx_;
                    }
                }

                // ── Build prediction curve + ±1σ confidence band ──────────────────────
                const minT = -2, maxT = 35;
                const lineData = [], upperData = [], lowerData = [];
                if (A !== null && bSlope !== null) {
                    const lnA = Math.log(A);
                    const n   = regrPoints.length;
                    for (let t = minT; t <= maxT; t += 0.5) {
                        const yPred = lnA + bSlope * t;
                        const se = (mseLn && Sxx && n > 0)
                            ? Math.sqrt(mseLn * (1 / n + (t - xwMean) ** 2 / Sxx))
                            : 0;
                        lineData.push({ x: t, y: Math.exp(yPred) });
                        upperData.push({ x: t, y: Math.exp(yPred + se) });
                        lowerData.push({ x: t, y: Math.exp(yPred - se) });
                    }
                }

                // ── Classify scatter points by tier ───────────────────────────────────
                const tierExcl = [], tierGrey = [], tierRed = [], tierBlue = [], tierGreen = [];
                const tierMHP = [], tierOpen = [];
                for (const p of allPoints) {
                    const pt = { x: p.t, y: p.tvPerKg };
                    if (p.condition === 'MHP') {
                        tierMHP.push(pt);
                    } else if (p.condition === 'OPEN') {
                        tierOpen.push(pt);
                    } else {
                        // MAP condition: existing rating-tier logic based on inEqRange
                        if (!p.inEqRange) { tierExcl.push(pt); continue; }
                        if (p.rating >= 8) tierGreen.push(pt);
                        else if (p.rating >= 5) tierBlue.push(pt);
                        else if (p.rating > 0) tierRed.push(pt);
                        else tierGrey.push(pt);
                    }
                }

                const datasets = [];
                // Confidence band: lower (transparent border) filled by upper
                // Array order = draw order: band first (behind), scatter last (on top)
                if (upperData.length > 0) {
                    datasets.push({ type: 'line', label: '_lower', data: lowerData, borderColor: 'transparent', backgroundColor: 'transparent', borderWidth: 0, pointRadius: 0, fill: false, tension: 0 });

                }
                if (lineData.length > 0) {
                    const predLabel = hasTarget ? ('Prediction → ' + tgtO2 + '% O₂') : 'Prediction (raw TV/kg)';

                }
                if (tierExcl.length > 0)  datasets.push({ type: 'scatter', label: 'O₂ outside 1–10% (excl.)', data: tierExcl,  backgroundColor: 'rgba(148,163,184,0.3)', borderColor: 'rgba(148,163,184,0.5)', pointRadius: 5, borderWidth: 1   });

                if (tierRed.length > 0)   datasets.push({ type: 'scatter', label: 'Rating <5',                    data: tierRed,   backgroundColor: 'rgba(220,38,38,0.7)',   borderColor: '#dc2626',              pointRadius: 7, borderWidth: 1.5 });
                if (tierBlue.length > 0)  datasets.push({ type: 'scatter', label: 'Rating 5–7',              data: tierBlue,  backgroundColor: 'rgba(37,99,235,0.7)',   borderColor: '#2563eb',              pointRadius: 7, borderWidth: 1.5 });

                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');

                    type: 'scatter',
                    data: { datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: {
                            x: { type: 'linear',      title: { display: true, text: 'Storage Temperature (°C)', font: { size: 11 } }, min: minT, max: maxT, grid: { color: 'rgba(0,0,0,0.06)' } },
                            y: { type: 'logarithmic', title: { display: true, text: yAxisTitle, font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { callback: v => v >= 1 ? Math.round(v) : v.toFixed(1) } }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { usePointStyle: true, padding: 10, font: { size: 10 }, filter: item => !item.text.startsWith('_') } },

                        }
                    }
                });
                setStats({ q10, r2, n: regrPoints.length, totalN: allPoints.length });
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [taskData, targetO2]);

            const count = parseInt(taskData.packOptCount) || 0;

            for (let i = 0; i < count; i++) {

            function calculateOverallProgress() {

                currentStepsTemplate.forEach(step => { step.tasks.forEach(task => { totalTasks++; if (completedIds.includes(task.id)) completedTasks++; }); });

            /* ══ 2026 product-sheet template — shared readers ═══════════════════════

            // A sheet cell is trilingual: <span data-lang="nl">…</span><span data-lang="en">…
            // Reading textContent concatenates all three ("Optimale bewaringOptimal storage…"),
            // and <br> contributes nothing, so a three-line <h1> collapses into
            // "Green BeansWholeFlowpack Guide". Return the English rendering as real lines.
            const psEnLines = (el) => {
                if (!el) return [];
                const clone = el.cloneNode(true);
                clone.querySelectorAll('[data-lang]').forEach(s => { if (s.getAttribute('data-lang') !== 'en') s.remove(); });
                clone.querySelectorAll('br').forEach(br => br.parentNode.replaceChild(br.ownerDocument.createTextNode('\n'), br));
                return clone.textContent.split('\n').map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean);

            const psEnText = (el) => psEnLines(el).join(' ');

            const psIsNewFormat = (doc) =>
                doc.querySelectorAll('.card-eyebrow').length > 0 ||

            // Respiration is quoted per HOUR, and the unit is not fixed across sheets:
            // "CO₂ ml/kg·hr" (Green Beans) but "CO₂ mg/kg·hr" + "O₂ mg/kg·hr" (Cape
            // Gooseberry). The dashboard's matrix is mL/kg/24h. Assuming ml and multiplying
            // by 24 made every mg sheet come out ~2x too high, so the unit and the gas are
            // read from the column header instead of assumed from the column position.
            // mg → mL uses the ideal-gas molar volume at 0 °C / 1 atm (22.414 L/mol).
            const PS_MG_PER_ML = { CO2: 44.01 / 22.414, O2: 32.00 / 22.414 };

            // "12,0 – 15,0" → 13.5 · "25" → 25 · "—" → null
            const psAvgNumber = (txt) => {
                const s = String(txt || '').replace(/,/g, '.');
                const range = s.match(/(-?[\d.]+)\s*(?:–|-|to)\s*(-?[\d.]+)/);
                if (range) return (parseFloat(range[1]) + parseFloat(range[2])) / 2;
                const one = s.match(/-?[\d.]+/);
                return one ? parseFloat(one[0]) : null;
            };

            // Classify a respiration column from its header: which gas, and which unit.
            // Returns null for the columns that are not a respiration rate (W/kg, W/ton,
            // kcal, Factor, Status) so they can never be mistaken for one.
            const psRespColumn = (header) => {
                const h = String(header || '').toLowerCase();
                if (/w\/kg|w\/ton|kcal|factor|status|temp/.test(h)) return null;
                if (!/\/\s*kg/.test(h)) return null;                 // must be a per-kg rate
                const gas = /co\s*₂|co\s*2/.test(h) ? 'CO2' : (/o\s*₂|o\s*2/.test(h) ? 'O2' : null);
                if (!gas) return null;
                const unit = /\bmg\b/.test(h) ? 'mg' : (/\bm+l\b|µl|ul/.test(h) ? 'ml' : null);
                if (!unit) return null;
                return { gas, unit };
            };

            const psToMlPerKgPerDay = (value, gas, unit) => {
                if (value == null || !(value > 0)) return null;
                const mlPerHour = unit === 'mg' ? value / PS_MG_PER_ML[gas] : value;
                return (mlPerHour * 24).toFixed(1);
            };

            /* Sheet section 2 (Respiration & Temperature) → target_temp{T}_O2 / _CO2.
             * The table is preferred over the .resp-row bar visual because it can carry
             * both gases; the bars only ever carry one and are used to fill gaps. */
            const psExtractRespiration = (doc) => {
                const out = {};
                const seen = new Set();

                doc.querySelectorAll('table').forEach(table => {
                    const headers = [...table.querySelectorAll('tr')][0]
                        ? [...[...table.querySelectorAll('tr')][0].children].map(c => psEnText(c) || c.textContent)
                        : [];
                    if (!headers.length) return;
                    const tempCol = headers.findIndex(h => /temp/i.test(h));
                    if (tempCol < 0) return;
                    const gasCols = headers.map((h, i) => (i === tempCol ? null : psRespColumn(h)));
                    if (!gasCols.some(Boolean)) return;

                    table.querySelectorAll('tr').forEach(row => {
                        const cells = [...row.querySelectorAll('td')];
                        if (!cells.length || !cells[tempCol]) return;
                        // "5,0 – 7,5 °C ★" → 5 : the row's lower bound is its identity in the matrix.
                        const tM = psEnText(cells[tempCol]).replace(/,/g, '.').match(/-?[\d.]+/);
                        if (!tM) return;
                        const temp = parseFloat(tM[0]);
                        gasCols.forEach((col, i) => {
                            if (!col || !cells[i]) return;
                            const rr = psToMlPerKgPerDay(psAvgNumber(psEnText(cells[i])), col.gas, col.unit);
                            if (!rr) return;
                            out[`target_temp${temp}_${col.gas}`] = rr;
                            seen.add(temp);
                        });
                    });
                });

                // Bar visual: "15,0 ml/kg·h" or "25 mg CO₂/kg·h" — the unit and gas live in
                // the value text here rather than in a header.
                doc.querySelectorAll('.resp-row').forEach(row => {
                    const tTxt = psEnText(row.querySelector('.resp-temp'));
                    const vTxt = psEnText(row.querySelector('.resp-val'));
                    if (!tTxt || !vTxt) return;
                    const tM = tTxt.replace(/,/g, '.').match(/-?[\d.]+/);
                    if (!tM) return;
                    const temp = parseFloat(tM[0]);
                    if (seen.has(temp)) return;                      // table already covered it
                    const unit = /\bmg\b/i.test(vTxt) ? 'mg' : 'ml';
                    const gas = /o\s*₂|o\s*2/i.test(vTxt) && !/co\s*₂|co\s*2/i.test(vTxt) ? 'O2' : 'CO2';
                    const rr = psToMlPerKgPerDay(psAvgNumber(vTxt), gas, unit);
                    if (rr) out[`target_temp${temp}_${gas}`] = rr;
                });

                // The matrix charts O₂ and CO₂ separately, but most sheets publish only one
                // gas. Mirror it rather than leave half the curve blank — an RQ of 1 is the
                // dashboard's own default assumption (p1-core-1.rq).
                //
                // Only when the other gas is absent EVERYWHERE, though. Cape Gooseberry
                // quotes O₂ at two of its four temperatures and "—" at the rest; filling
                // those gaps from CO₂ would hand calculateQ10 an O₂ curve made of two
                // measured points and two invented ones, and it regresses O₂ in preference
                // to CO₂ — so the headline Q₁₀ would be derived from numbers the sheet never
                // stated. A short honest curve beats a long fabricated one.
                const gasesPresent = { O2: false, CO2: false };
                Object.keys(out).forEach(k => {
                    const m = k.match(/^target_temp(-?[\d.]+)_(O2|CO2)$/);
                    if (m) gasesPresent[m[2]] = true;
                });
                if (gasesPresent.O2 !== gasesPresent.CO2) {
                    Object.keys(out).forEach(k => {
                        const m = k.match(/^target_temp(-?[\d.]+)_(O2|CO2)$/);
                        if (!m) return;
                        out[`target_temp${m[1]}_${m[2] === 'O2' ? 'CO2' : 'O2'}`] = out[k];
                    });
                }
                return out;
            };

            /* Sheet section 5 (Defects & PerfoTec prevention) → the p1-core-4 defect matrix.
             * Each .defect-card carries a name, a cause, and prevention rows tagged MHP or
             * MAP; the matrix keeps them as flat defect_{i}_* keys. */
            const psExtractDefects = (doc) => {
                const cards = doc.querySelectorAll('.defect-card');
                const data = {};
                cards.forEach((card, idx) => {
                    data[`defect_${idx}_name`] = psEnText(card.querySelector('.defect-name'));
                    data[`defect_${idx}_cause`] = psEnText(card.querySelector('.defect-cause'));
                    const mhp = [], map = [];
                    card.querySelectorAll('.prev-row').forEach(row => {
                        const tag = row.querySelector('.prev-tag');
                        const txt = psEnText(row.querySelector('.prev-text'));
                        if (!tag || !txt) return;
                        // The tag class is the reliable signal; its text is styled/localised.
                        const cls = tag.className || '';
                        if (/mhp/i.test(cls) || /mhp/i.test(tag.textContent)) mhp.push(txt);
                        else if (/map/i.test(cls) || /map/i.test(tag.textContent)) map.push(txt);
                    });
                    data[`defect_${idx}_mhp`] = mhp.join(' | ');
                    data[`defect_${idx}_map`] = map.join(' | ');
                });
                return { data, count: cards.length };
            };

            const extractProductDataFromText = (text, fileName) => {
                const getEnTranslation = (key, fallbackDOM) => {
                    if (!key) return fallbackDOM ? (fallbackDOM.innerText || fallbackDOM.textContent).trim() : "";
                    const regex = new RegExp(`${key}\\s*:\\s*(["'\`])([\\s\\S]*?)\\1`, 'i');
                    const match = text.match(regex);
                    if (match) return match[2].replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(?:b|i|strong|em|span|div|p|ul|li)[^>]*>/gi, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
                    return fallbackDOM ? (fallbackDOM.innerText || fallbackDOM.textContent).trim() : ""; 
                };

                const parser = new DOMParser(); 
                const doc = parser.parseFromString(text, 'text/html');

                let cleanName = fileName.replace(/\.[^/.]+$/, ""); 
                let extractedVariety = "";
                const mainTitleKey = doc.querySelector('h1')?.getAttribute('data-translate');
                const enMainTitle = getEnTranslation(mainTitleKey, doc.querySelector('h1')) || cleanName;
                
                let baseNameString = enMainTitle
                    .replace(/Product Sheet\s*-?/gi, '')
                    .replace(/Infographic Blueprint:?/gi, '')
                    .replace(/Logistiek, Business Case, Proces/gi, '')
                    .replace(/Whole /gi, '')
                    .replace(/Processed /gi, '')
                    .replace(/Verse /gi, '')
                    .replace(/Hele /gi, '')
                    .replace(/\(Retail\)/gi, '')
                    .replace(/\(Bulk\)/gi, '')
                    .replace(/\(Export\)/gi, '')
                    .replace(/\(sliced\)/gi, '')
                    .replace(/MAP Infographic/gi, '')
                    .replace(/Topseal/gi, '')
                    .replace(/Gesneden/gi, '')
                    .trim();

                const titleMatch = baseNameString.match(/(.*?)\s*\((.*?)\)/);
                if (titleMatch) { cleanName = titleMatch[1].trim(); extractedVariety = titleMatch[2]; } 
                else { cleanName = baseNameString.replace(/\(.*?\)/g, '').trim(); }
                // 2026 template: the <h1> is three <br>-separated lines inside one English
                // span — product / state / descriptor. textContent runs them together, and
                // the result ("Green BeansWholeFlowpack Guide", "Cape GooseberryWithout
                // Calyx") is under the 30-character soup threshold below, so it used to sail
                // through as the product name and then failed to match the existing product.
                // Read the lines and keep the first.
                const psH1Lines = psEnLines(doc.querySelector('h1'));
                if (psH1Lines.length > 1) {
                    const first = psH1Lines[0]
                        .replace(/Fresh.?Cut\s*/gi, '').replace(/Packaging Guide/gi, '')
                        .replace(/Product Guide/gi, '').replace(/Specification/gi, '').trim();
                    if (first.length >= 2 && first.length < 40) cleanName = first;
                }

                // New-format: if cleanName looks like multilingual soup (mixed langs / too long),
                // extract from the English data-lang span of h1 or from the <title> tag
                if (cleanName.length > 30 || cleanName.match(/bleekselderij|apio\b|frais|gesneden|procesado/i)) {
                    const h1En = doc.querySelector('h1 [data-lang="en"]');
                    if (h1En) {
                        const h1Txt = h1En.textContent.trim().replace(/\s+/g, ' ')
                            .replace(/Fresh.?Cut\s*/gi, '').replace(/Packaging Guide/gi, '')
                            .replace(/Product Guide/gi, '').replace(/Specification/gi, '').trim();
                        if (h1Txt.length >= 2 && h1Txt.length < 40) cleanName = h1Txt;
                    }
                    if (cleanName.length > 30 || cleanName.match(/bleekselderij|apio\b|frais|gesneden|procesado/i)) {
                        const titleEl = doc.querySelector('title');
                        if (titleEl) {
                            const titleTxt = titleEl.textContent
                                .replace(/Fresh.?Cut\s*/gi, '')
                                .replace(/\s*[—|].*$/i, '').replace(/Product Specification/gi, '').trim();
                            if (titleTxt.length >= 2 && titleTxt.length < 40) cleanName = titleTxt;
                        }
                    }
                }
                cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

                let extractedState = "whole";
                const domSubTitle = doc.querySelector('h2')?.textContent || "";
                const subTitleKey = doc.querySelector('h2')?.getAttribute('data-translate') || doc.querySelector('p.text-lg')?.getAttribute('data-translate');
                const enSubTitle = getEnTranslation(subTitleKey, doc.querySelector('h2') || doc.querySelector('p.text-lg'));

                if (enMainTitle.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    fileName.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    enSubTitle.toLowerCase().match(/processed|gesneden|sliced|cut/i) || 
                    doc.body.textContent.toLowerCase().match(/versgesneden/i)) {
                    extractedState = "processed";
                }
                
                const defaultTargets = extractedState === 'processed' ? ['retail', 'liner'] : ['retail', 'liner', 'pallet'];
                
                let imgUrl = ""; const imgEl = Array.from(doc.querySelectorAll('img')).find(img => !img.src.includes('logo') && !img.alt.toLowerCase().includes('logo'));
                if (imgEl) imgUrl = imgEl.getAttribute('src');

                let targetO2Text = "", targetCO2Text = "", storageTempText = "", targetRHText = "";
                let acp = "", critCO2 = "";
                let explicitQ10 = "";  // captured from new-format Q₁₀ card

                const conditionBlocks = Array.from(doc.querySelectorAll('.condition-block'));
                conditionBlocks.forEach(block => {
                    const titleKey = block.querySelector('.condition-title')?.getAttribute('data-translate') || "";
                    const titleEn = getEnTranslation(titleKey, block.querySelector('.condition-title'));
                    const valText = block.querySelector('.condition-value')?.textContent || "";
                    const fullBlockText = block.textContent || "";

                    if ((titleEn.includes('O₂') || titleEn.includes('Oxygen')) && !titleEn.includes('CO₂') && !titleEn.includes('Carbon')) {
                        targetO2Text = valText;
                        const m = fullBlockText.match(/(?:Afwijking|Deviation|Risk|Risico|Anaerobic|ACP)[^0-9<]*<?\s*([\d.,]+)\s*%/i) || fullBlockText.match(/<\s*([\d.,]+)\s*%/i);
                        if(m) acp = m[1].replace(',', '.');
                    } else if (titleEn.includes('CO₂') || titleEn.includes('Carbon')) {
                        targetCO2Text = valText;
                        const m = fullBlockText.match(/(?:Afwijking|Deviation|Risk|Risico|Kritisch|Critical|Max)[^0-9>]*>?\s*([\d.,]+)\s*%/i) || fullBlockText.match(/>\s*([\d.,]+)\s*%/i);
                        if(m) critCO2 = m[1].replace(',', '.');
                    } else if (titleEn.includes('Temp') || titleEn.includes('Chain')) {
                        storageTempText = valText;
                    } else if (titleEn.includes('RH') || titleEn.includes('Vocht') || titleEn.includes('Humidity')) {
                        targetRHText = valText;
                    }
                });

                // Raw-HTML fallbacks for when the DOM query finds the blocks but the title
                // matching logic misses them (e.g. a Dutch title that wasn't in the translation map).
                if (!storageTempText) {
                    // Look for data-translate="cond_temp_title" → nearby condition-value in raw HTML
                    const m = text.match(/data-translate="cond_temp_title"[\s\S]{1,500}?<div[^>]*class="[^"]*condition-value[^"]*">([^<]+)<\/div>/i);
                    if (m) storageTempText = m[1].trim();
                }
                if (!storageTempText) {
                    // Broader fallback: any condition-block whose title key contains "temp"
                    const m = text.match(/data-translate="cond_\w*temp\w*"[\s\S]{1,500}?<div[^>]*class="[^"]*condition-value[^"]*">([^<]+)<\/div>/i);
                    if (m) storageTempText = m[1].trim();
                }

                const fullSearchText = doc.body.textContent + " " + text;


                // ── New-format product-sheet detection ─────────────────────────────────
                // Fires when the file uses the new PerfoTec spec-sheet layout:
                //   .card-eyebrow / .card-value  (ACP, Q₁₀, optimal storage, …)
                //   td.t-param / td.t-target / td.t-warn  (parameters table)
                //   .resp-row / .resp-val  (respiration vs temperature visual)
                //   .defect-card  (defect-prevention grid)
                // These CSS classes do NOT appear in the older product-sheet format
                // (which uses .condition-block / data-translate), so the two paths
                // are mutually exclusive and cannot interfere with each other.
                const hasNewPSFormat =
                    doc.querySelectorAll('.card-eyebrow').length > 0 ||
                    doc.querySelectorAll('.t-target').length > 0   ||
                    doc.querySelectorAll('.resp-row').length > 0;

                // Helper: extract English text from a multilingual element
                // (first looks for a [data-lang="en"] child span, falls back to textContent)
                const getNewFmtEnText = el => {
                    if (!el) return '';
                    const en = el.querySelector('[data-lang="en"]');
                    return (en ? en.textContent : el.textContent).trim().replace(/\s+/g, ' ');
                };

                if (hasNewPSFormat) {
                    // 1. Card pairs (card-eyebrow → card-value)
                    doc.querySelectorAll('.card').forEach(card => {
                        const eyebrow = card.querySelector('.card-eyebrow');
                        const valEl   = card.querySelector('.card-value');
                        if (!eyebrow || !valEl) return;
                        const label = eyebrow.textContent.toLowerCase().replace(/\s+/g, ' ');
                        const val   = valEl.textContent.trim();
                        // ACP card: "0,5 – 1,0% O₂" → extract lower bound
                        if ((label.includes('acp') || label.includes('anaerob')) && !acp) {
                            const m = val.match(/([\d.,]+)/);
                            if (m) acp = m[1].replace(',', '.');
                        }
                        // Q₁₀ card: "3,7×" → "3.7"
                        if ((label.includes('q') && (label.includes('10') || label.includes('₁₀'))) && !explicitQ10) {
                            const m = val.match(/([\d.,]+)/);
                            if (m) explicitQ10 = m[1].replace(',', '.');
                        }
                        // Optimal storage card: "0 – 4 °C"
                        if ((label.includes('storage') || label.includes('bewaring') || label.includes('almacen') || label.includes('optimal')) && !storageTempText) {
                            const m = val.match(/([\d.,]+(?:\s*[-–]\s*[\d.,]+)?)\s*°C/i);
                            if (m) storageTempText = m[0].trim();
                        }
                    });

                    // 2. Parameters table (t-param / t-target / t-warn rows)
                    let nfCO2SteadyText = "", nfCO2BurstText = "";
                    doc.querySelectorAll('tr').forEach(row => {
                        const pCell = row.querySelector('td.t-param');
                        const tCell = row.querySelector('td.t-target');
                        const wCell = row.querySelector('td.t-warn');
                        if (!pCell || !tCell) return;
                        const pLow = pCell.textContent.toLowerCase().replace(/\s+/g, ' ');
                        const tTxt = tCell.textContent.replace(/\s+/g, ' ').trim();
                        const wTxt = wCell ? wCell.textContent : '';
                        // O₂ target
                        if ((pLow.includes('o₂') || pLow.includes('o2')) && !targetO2Text) {
                            targetO2Text = tTxt;
                            const acpM = wTxt.match(/(?:acp)[^0-9]*([\d.,]+)/i);
                            if (acpM && !acp) acp = acpM[1].replace(',', '.');
                        }
                        // CO₂ initial burst → use for critCO2 warning threshold
                        if ((pLow.includes('co₂') || pLow.includes('co2')) && (pLow.includes('burst') || pLow.includes('initial') || pLow.includes('start') || pLow.includes('startburst'))) {
                            nfCO2BurstText = tTxt;
                            // Extract FIRST number in the warning (e.g. ">10–15%" → "10", the onset of damage)
                            const co2WM = wTxt.match(/([\d.,]+)/);
                            if (co2WM && !critCO2) critCO2 = co2WM[1].replace(',', '.');
                        }
                        // CO₂ steady-state → preferred target
                        if ((pLow.includes('co₂') || pLow.includes('co2')) && pLow.includes('steady')) {
                            nfCO2SteadyText = tTxt;
                        }
                        // RH
                        if ((pLow.includes(' rh') || pLow.includes('humidity') || pLow.includes('vochtig') || pLow.includes('relativ')) && !targetRHText) {
                            targetRHText = tTxt;
                        }
                        // Temperature
                        if ((pLow.startsWith('temp') || pLow.includes('temperat')) && !storageTempText) {
                            storageTempText = tTxt;
                        }
                    });
                    // Prefer steady-state CO₂ as the MAP target; fall back to burst range
                    if (!targetCO2Text) targetCO2Text = nfCO2SteadyText || nfCO2BurstText;
                }

                let o2Raw = targetO2Text || (fullSearchText.match(/(?:O2|Zuurstof)[^0-9]*?(?:doel|target|optimaal|MAP)[^0-9]*?([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/MAP\s*\([^0-9]*([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%\s*O[₂2])/i));
                const o2Range = parseRangeMatch(o2Raw);

                let co2Raw = targetCO2Text || (fullSearchText.match(/(?:CO2|Koolstofdioxide)[^0-9]*?(?:doel|target|optimaal|MAP)[^0-9]*?([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/MAP\s*\(.*?(?:,|;|en|and)\s*([\d.,]+(?:\s*-\s*[\d.,]+)?\s*%\s*CO[₂2])/i));
                const co2Range = parseRangeMatch(co2Raw);

                let tempRaw = storageTempText
                    || fullSearchText.match(/(?:opslag|koeling|bewaren|temperatuur)[^0-9]*?(?:bij|tot|rond|circa|:)\s*([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*°?C)/i)
                    || fullSearchText.match(/(?:Temp(?:eratuur)?|Chain)\s*(?:\([^)]*\))?\s*(?:Target|Doel|Objetivo)?\s*[:\-]\s*(-?[\d.,]+(?:\s*(?:tot|-|–)\s*-?[\d.,]+)?\s*°?C)/i);
                const tempRange = parseRangeMatch(tempRaw);
                
                let rhRaw = targetRHText || fullSearchText.match(/(?:RH|Vocht|Humidity|Luchtvochtigheid)[^0-9]*?(?:doel|target|optimaal)[^0-9]*?([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*%)/i) || fullSearchText.match(/([\d.,]+(?:\s*(?:tot|-)\s*[\d.,]+)?\s*%)\s*(?:RH|Vocht|Humidity)/i);
                const rhRange = parseRangeMatch(rhRaw);

                if (!acp) {
                    let acpMatch = fullSearchText.match(/(?:Anaerobic Compensation Point|ACP|fermentation|anaeroob)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Afwijking|Deviation|Risico)[^0-9<]*<\s*([\d.,]+)\s*%/i) || fullSearchText.match(/<\s*([\d.,]+)\s*%\s*O[₂2]/i);
                    if (acpMatch) acp = acpMatch[1].replace(',', '.');
                }

                let minTemp = "";
                // Only match explicit chilling-injury / cold-tolerance keywords — the old `<` alternative
                // caused false positives from HTML tags like `<strong>0°C` or `<p>Temp: 10-15°C`.
                // Fallback: use the lowest value of the storage target temp range.
                let minTempMatch = fullSearchText.match(/(?:chilling injury|koudeschade|koudebederf|vriesschade|freezing)[^0-9]*([\d.,]+)(?:\s*(?:tot|-)\s*([\d.,]+))?\s*°?C/i) || fullSearchText.match(/(?:onder de|below)\s*([\d.,]+)(?:\s*(?:tot|-)\s*([\d.,]+))?\s*°?C/i);
                if (minTempMatch) minTemp = minTempMatch[1].replace(',', '.');
                else if (tempRange.min !== "") minTemp = tempRange.min;

                if (!critCO2) {
                    let critCO2Match = fullSearchText.match(/(?:Critical CO2|Max CO2|Kritische CO2|schade)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Afwijking|Deviation|Risico)[^0-9>]*>\s*([\d.,]+)\s*%/i) || fullSearchText.match(/(?:Too high CO2|Te hoge CO2)[^0-9]*([\d.,]+)\s*%/i) || fullSearchText.match(/>\s*([\d.,]+)\s*%\s*(?:CO[₂2]|Veroorzaakt|causes|leidt)/i);
                    if (critCO2Match) critCO2 = critCO2Match[1].replace(',', '.');
                }

                let ethyleneClass = "";
                const ethSources = fullSearchText.toLowerCase();
                if (ethSources.match(/climacteri/)) {
                    if (ethSources.match(/non-?climacteri/)) ethyleneClass = "Type 3: Non-Climacteric (Low prod / Low sens.)";
                    else ethyleneClass = "Type 2: Climacteric (High prod / High sens.)";
                }
                else if (ethSources.includes('ethyleen') || ethSources.includes('ethylene')) {
                    if (ethSources.includes('gevoelig') || ethSources.includes('sensitive')) ethyleneClass = "Type 1: Sensitive (Low prod / High sens.)";
                    else ethyleneClass = "Type 4: Producers (High prod / Low sens.)";
                }
                
                let vpdSens = "Medium";
                if (ethSources.match(/shrivel|uitdroging|turgor|dehydrat|verschrompel/i)) vpdSens = "Extreme (Shriveling Risk)";
                else if (ethSources.match(/verwelk|droogte/i)) vpdSens = "High";
                
                let condRisk = "Medium";
                if (ethSources.match(/botrytis|penicillium|schimmel|mold|rot|condens/i)) condRisk = "High (Requires Anti-Fog/High MVTR)";
                
                let primaryT = "Discoloration / Browning";
                let secondaryT = "None";
                if (ethSources.match(/shrivel|uitdroging/i)) secondaryT = "Dehydration / Shriveling";
                if (ethSources.match(/botrytis|schimmel|mold|rot/i)) {
                    if (secondaryT === "None") secondaryT = "Mold / Rot / Botrytis";
                    else if (!ethSources.match(/bruining|discolor/i)) { primaryT = "Mold / Rot / Botrytis"; secondaryT = "Dehydration / Shriveling"; }
                }

                const defectData = {}; let extractedDefectCount = 0;
                const dataTable = doc.querySelector('.data-table'); 
                if (dataTable) {
                    const rows = dataTable.querySelectorAll('tbody tr'); extractedDefectCount = rows.length; 
                    rows.forEach((row, idx) => {
                        const cells = row.querySelectorAll('td');
                        if (cells.length >= 4) {
                            defectData[`defect_${idx}_name`] = getEnTranslation(cells[0].getAttribute('data-translate'), cells[0]);
                            defectData[`defect_${idx}_cause`] = getEnTranslation(cells[1].getAttribute('data-translate'), cells[1]);
                            defectData[`defect_${idx}_mhp`] = getEnTranslation(cells[2].getAttribute('data-translate'), cells[2]);
                            defectData[`defect_${idx}_map`] = getEnTranslation(cells[3].getAttribute('data-translate'), cells[3]);
                        }
                    });
                }


                // ── New-format defects (.defect-card grid) ──────────────────────────────
                // Populates defectData only when the old .data-table path found nothing.
                if (hasNewPSFormat && extractedDefectCount === 0) {
                    const nfDefectCards = doc.querySelectorAll('.defect-card');
                    if (nfDefectCards.length > 0) {
                        extractedDefectCount = nfDefectCards.length;
                        nfDefectCards.forEach((card, idx) => {
                            defectData[`defect_${idx}_name`]  = getNewFmtEnText(card.querySelector('.defect-name'));
                            defectData[`defect_${idx}_cause`] = getNewFmtEnText(card.querySelector('.defect-cause'));
                            const mhpLines = [], mapLines = [];
                            card.querySelectorAll('.prev-row').forEach(row => {
                                const tag = row.querySelector('.prev-tag');
                                const txt = getNewFmtEnText(row.querySelector('.prev-text'));
                                if (!tag || !txt) return;
                                const tagLbl = tag.textContent.trim().toUpperCase();
                                if (tagLbl === 'MHP') mhpLines.push(txt);
                                else if (tagLbl === 'MAP') mapLines.push(txt);
                            });
                            defectData[`defect_${idx}_mhp`] = mhpLines.join(' | ');
                            defectData[`defect_${idx}_map`] = mapLines.join(' | ');
                        });
                    }
                }

                const rrData = {};
                const resLists = [
                    getEnTranslation(doc.querySelector('[data-translate="res_list_1"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_1"]')),
                    getEnTranslation(doc.querySelector('[data-translate="res_list_2"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_2"]')),
                    getEnTranslation(doc.querySelector('[data-translate="res_list_3"]')?.getAttribute('data-translate'), doc.querySelector('[data-translate="res_list_3"]'))
                ];

                let foundRR = false;
                // Path 1: bullet points with explicit ml values (e.g. "0°C: 4 - 8 ml/kg/h")
                resLists.forEach(listItem => {
                    if (!listItem) return;
                    const tempMatch = listItem.match(/(-?[\d.,]+)\s*°C/i);
                    if (tempMatch) {
                        const temp = parseFloat(tempMatch[1].replace(',', '.'));
                        const valRangeMatch = listItem.match(/:\s*[^0-9-]*([\d.,]+)\s*(?:-\s*([\d.,]+))?\s*ml/i);
                        let avg = 0;
                        if (valRangeMatch) avg = valRangeMatch[2] ? (parseFloat(valRangeMatch[1].replace(',', '.')) + parseFloat(valRangeMatch[2].replace(',', '.'))) / 2 : parseFloat(valRangeMatch[1].replace(',', '.'));
                        if (avg > 0) { foundRR = true; const rr24h = avg * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                });

                // Path 2: free text "X°C … Y-Z ml" patterns
                if (!foundRR) {
                    const rrMatches = fullSearchText.matchAll(/([\d.,]+)\s*°C.*?([\d.,]+)\s*(?:-|tot|to)\s*([\d.,]+)\s*ml/gi);
                    for (const match of rrMatches) {
                        foundRR = true;
                        const temp = parseFloat(match[1].replace(',', '.'));
                        const avg = match[3] ? (parseFloat(match[2].replace(',', '.')) + parseFloat(match[3].replace(',', '.'))) / 2 : parseFloat(match[2].replace(',', '.'));
                        if (avg > 0) { const rr24h = avg * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                }

                // Path 3: "respiration/ademhaling X°C … Y ml" single-value pattern
                if (!foundRR) {
                    const rrSingleMatches = fullSearchText.matchAll(/(?:respiration|ademhaling)[^0-9]*([\d.,]+)\s*°C.*?([\d.,]+)\s*ml/gi);
                    for (const match of rrSingleMatches) {
                        const temp = parseFloat(match[1].replace(',', '.'));
                        const val = parseFloat(match[2].replace(',', '.'));
                        if (val > 0) { const rr24h = val * 24; rrData[`target_temp${temp}_CO2`] = rr24h.toFixed(1); rrData[`target_temp${temp}_O2`] = rr24h.toFixed(1); }
                    }
                }

                // Path 4: Chart.js respirationRateChart data block (used when res_list items are
                // only descriptive text with no ml values, e.g. the Carrot product sheet).
                // Extracts the FIRST dataset (Air/21% O₂) and treats values as ml/kg/h → ×24 → ml/kg/24h.
                if (!foundRR) {
                    const chartIdx = text.indexOf('respirationRateChart = new Chart');
                    if (chartIdx !== -1) {
                        const chunk = text.slice(chartIdx, chartIdx + 1800);
                        const labelsM = chunk.match(/labels\s*:\s*\[([^\]]+)\]/);
                        const dataM   = chunk.match(/\bdata\s*:\s*\[([\d.,\s]+)\]/);
                        if (labelsM && dataM) {
                            const labelTemps = [...labelsM[1].matchAll(/([\d.]+)\s*°C/g)].map(m => parseFloat(m[1]));
                            const dataVals   = dataM[1].split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
                            if (labelTemps.length >= 2 && labelTemps.length === dataVals.length) {
                                foundRR = true;
                                labelTemps.forEach((temp, i) => {
                                    if (dataVals[i] > 0) {
                                        const rr24h = (dataVals[i] * 24).toFixed(1);
                                        rrData[`target_temp${temp}_CO2`] = rr24h;
                                        rrData[`target_temp${temp}_O2`]  = rr24h;
                                    }
                                });
                            }
                        }
                    }
                }


                // Path 5: New-format spec sheet — .resp-row visual bars and respiration table
                // The new format lists respiration as ml/kg·h; multiply × 24 → ml/kg/24h.
                if (!foundRR && hasNewPSFormat) {
                    // 5a. Visual bar rows (.resp-row / .resp-val) — most reliable source
                    doc.querySelectorAll('.resp-row').forEach(row => {
                        const tempEl = row.querySelector('.resp-temp');
                        const valEl  = row.querySelector('.resp-val');
                        if (!tempEl || !valEl) return;
                        const tM = tempEl.textContent.match(/([\d.,]+)/);
                        if (!tM) return;
                        const temp  = parseFloat(tM[1].replace(',', '.'));
                        const vTxt  = valEl.textContent.trim();
                        const rrM   = vTxt.match(/([\d.,]+)\s*(?:–|-)\s*([\d.,]+)/) || vTxt.match(/([\d.,]+)/);
                        if (!rrM) return;
                        const low  = parseFloat(rrM[1].replace(',', '.'));
                        const high = rrM[2] ? parseFloat(rrM[2].replace(',', '.')) : low;
                        const avg  = (low + high) / 2;
                        if (avg > 0 && avg < 500) {          // sanity: ml/kg·h range
                            foundRR = true;
                            const rr24h = (avg * 24).toFixed(1);
                            rrData[`target_temp${temp}_O2`]  = rr24h;
                            rrData[`target_temp${temp}_CO2`] = rr24h;
                        }
                    });
                    // 5b. Tabular respiration data (first col = temp °C, second col = O₂ ml/kg·h)
                    if (!foundRR) {
                        doc.querySelectorAll('table tbody tr').forEach(row => {
                            const cells = row.querySelectorAll('td');
                            if (cells.length < 2) return;
                            const tM = cells[0].textContent.match(/([\d.,]+)\s*°C/);
                            if (!tM) return;
                            const temp = parseFloat(tM[1].replace(',', '.'));
                            if (rrData[`target_temp${temp}_O2`]) return; // already set by 5a
                            const rrTxt = cells[1].textContent.trim();
                            const rrM   = rrTxt.match(/([\d.,]+)\s*(?:–|-)\s*([\d.,]+)/) || rrTxt.match(/([\d.,]+)/);
                            if (!rrM) return;
                            const low  = parseFloat(rrM[1].replace(',', '.'));
                            const high = rrM[2] ? parseFloat(rrM[2].replace(',', '.')) : low;
                            const avg  = (low + high) / 2;
                            if (avg > 0 && avg < 500) {
                                foundRR = true;
                                const rr24h = (avg * 24).toFixed(1);
                                rrData[`target_temp${temp}_O2`]  = rr24h;
                                rrData[`target_temp${temp}_CO2`] = rr24h;
                            }
                        });
                    }
                }

                const initialQ10 = calculateQ10(rrData);

                const parsedData = {
                    'p1-core-1': { acp: acp, minTemp: minTemp, critCO2: critCO2, rq: "1.0", q10: explicitQ10 || initialQ10, ethyleneClass: ethyleneClass, vpdSensitivity: vpdSens },
                    'p1-core-2': { ...rrData },
                    'p1-core-3': { targetO2Min: o2Range.min, targetO2Max: o2Range.max, targetCO2Min: co2Range.min, targetCO2Max: co2Range.max, storageTempMin: tempRange.min, storageTempMax: tempRange.max, targetRHMin: rhRange.min, targetRHMax: rhRange.max },
                    'p1-core-4': { primaryThreat: primaryT, secondaryThreat: secondaryT, condensationRisk: condRisk, ...defectData, defectCount: extractedDefectCount > 0 ? extractedDefectCount : 7 }
                };

                let points = 0; Object.values(parsedData).forEach(task => { points += Object.keys(task).length; });

                return {
                    product: { name: cleanName, variety: extractedVariety, state: extractedState, targets: defaultTargets, imageUrl: imgUrl, completedTaskIds: [], links: {}, createdAt: null, formData: parsedData },
                    points
                };
            };

            const parseGasValue = (val) => {
                if (val === undefined || val === null || val === '') return '';
                if (typeof val === 'number') return val < 1 ? (val * 100).toFixed(1) : String(val);
                const firstLine = String(val).split(/\r?\n/)[0];
                return firstLine.replace('%', '').replace(',', '.').trim();
            };

            const processDataSheet = async (file) => {
                setImportStatus('parsing');
                if (!file) { setImportStatus('idle'); return; }
                setImportedFileName(file.name);
                const fileExt = file.name.split('.').pop().toLowerCase();

                try {
                    if (fileExt === 'json') {
                        const text = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsText(file); });
                        const parsed = JSON.parse(text);
                        
                        if (parsed.type === 'perfotec-workspace-backup' && parsed.products) {
                            if (db) {
                                for (const p of parsed.products) {
                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', p.id), p);
                                }
                            } else {
                                setProducts(parsed.products);
                            }
                            setLoadedDataId(null); 
                            resetModal(); 
                            if (parsed.products && parsed.products.length > 0) {
                                setActiveProductId(familyLandingId(parsed.products[0], parsed.products));
                                setActiveTab('dashboard');
                            }
                            return;
                        }

                        if (parsed.name && parsed.formData) {
                            setNewProductData({ name: parsed.name, variety: parsed.variety || "", state: parsed.state || "whole", targets: parsed.targets || [], imageUrl: parsed.imageUrl || "", completedTaskIds: parsed.completedTaskIds || [], links: parsed.links || {}, createdAt: parsed.createdAt || new Date().toISOString() });
                            setImportedFormData(parsed.formData);
                            let points = 0; Object.values(parsed.formData).forEach(task => { points += Object.keys(task).length; });
                            setParsedItemCount(points); setIsBackupRestore(true); setIsBulkImport(false); setImportStatus('success');
                            return;
                        } 
                        
                        // Trial export format: array of records with Product field
                        if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].Product !== undefined) {
                            const rows = parsed.map((r, i) => ({
                                _id: i,
                                product: String(r.Product || ''),
                                variety: String(r.Variety || r.variety || ''),
                                packaging: r.Packaging || r.Type || r['Packaging Type'] || 'Crate/Box',
                                material: String(r.Material || r.material || ''),
                                temp: r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : String(r.Temperature || ''),
                                weight: r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000))
                                      : r['Weight (g)'] !== undefined ? String(r['Weight (g)'])
                                      : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '',
                                tv: r.TV !== undefined ? String(r.TV) : '',
                                o2: parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)'] ),
                                co2: parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)']),
                                company: String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : '')),
                                country: String(r.Country || r.country || ''),
                                days: r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '',
                                rating: r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : ''),
                            })).filter(r => r.product);

                            const uniqueProducts = [...new Set(rows.map(r => r.product))];
                            const normalize = s => s.toLowerCase().replace(/[\s\-()\/]+/g, ' ').trim();
                            const mappings = {};
                            uniqueProducts.forEach(pName => {
                                const norm = normalize(pName);
                                const match = products.find(p => {
                                    const pNorm = normalize(p.name + (p.variety ? ' ' + p.variety : ''));
                                    const nameNorm = normalize(p.name);
                                    return nameNorm === norm || pNorm === norm || nameNorm.includes(norm) || norm.includes(nameNorm);
                                });
                                mappings[pName] = match ? match.id : 'new';
                            });

                            setTrialImportRows(rows);
                            setTrialProductMappings(mappings);
                            setParsedItemCount(rows.length);
                            setImportStatus('trial-preview');
                            return;
                        }

                        throw new Error("Invalid JSON structure");
                    }

                    if (['xlsx', 'xls', 'csv'].includes(fileExt)) {
                        const buffer = await new Promise((res, rej) => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.onerror = e => rej(e); reader.readAsArrayBuffer(file); });
                        if (!window.XLSX) throw new Error("XLSX library not loaded");
                        const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                                                const json = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
                        if (json.length === 0) throw new Error("No rows found in file");
                        const firstRow = json[0];

                        // Detect format: TV-per-product / trial list has Product + TV or weight columns
                        const isTrialFormat = ('Product' in firstRow || 'product' in firstRow) &&
                            ('TV' in firstRow || 'Gewicht (kg)' in firstRow || 'Weight (g)' in firstRow || 'TV per kg' in firstRow);

                        if (isTrialFormat) {
                            const rows = json.map((r, i) => ({
                                _id: i,
                                product: String(r.Product || r.product || ''),
                                variety: String(r.Variety || r.variety || ''),
                                packaging: r.Packaging || r.Type || r['Packaging Type'] || 'Crate/Box',
                                material: String(r.Material || r.material || ''),
                                temp: r['Temp (°C)'] !== undefined ? String(r['Temp (°C)']) : r['Temperature'] !== undefined ? String(r['Temperature']) : '',
                                weight: r['Gewicht (kg)'] !== undefined ? String(Math.round(r['Gewicht (kg)'] * 1000))
                                      : r['Weight (g)'] !== undefined ? String(r['Weight (g)'])
                                      : r['Weight (kg)'] !== undefined ? String(Math.round(r['Weight (kg)'] * 1000)) : '',
                                tv: r.TV !== undefined ? String(r.TV) : r['TV Req.'] !== undefined ? String(r['TV Req.']) : '',
                                o2: parseGasValue(r.O2 !== undefined ? r.O2 : r['O2 (%)']),
                                co2: parseGasValue(r.CO2 !== undefined ? r.CO2 : r['CO2 (%)']),
                                company: String(r.Company || r.company || (r.Tested ? String(r.Tested).split(/\r?\n/)[0].trim() : '')),
                                country: String(r.Country || r.country || ''),
                                days: r.Days !== undefined ? String(r.Days) : r['Shelf Life (days)'] !== undefined ? String(r['Shelf Life (days)']) : '',
                                rating: r.Rating !== undefined ? String(r.Rating) : (r['Best Product Results'] === '✓' ? '7' : ''),
                            })).filter(r => r.product);
                            if (rows.length === 0) throw new Error("No product rows found in file");
                            const uniqueProducts = [...new Set(rows.map(r => r.product))];
                            const normalize = s => s.toLowerCase().replace(/[\s\-()/]+/g, ' ').trim();
                            const mappings = {};
                            uniqueProducts.forEach(pName => {
                                const norm = normalize(pName);
                                const match = products.find(p => {
                                    const pNorm = normalize(p.name + (p.variety ? ' ' + p.variety : ''));
                                    const nameNorm = normalize(p.name);
                                    return nameNorm === norm || pNorm === norm || nameNorm.includes(norm) || norm.includes(nameNorm);
                                });
                                mappings[pName] = match ? match.id : 'new';
                            });
                            setTrialImportRows(rows);
                            setTrialProductMappings(mappings);
                            setParsedItemCount(rows.length);
                            setImportStatus('trial-preview');
                            return;
                        }

                        // Product-properties sheet format (Target O2, RR Temperature, etc.)
                        const extractedProducts = [];
                        let totalPoints = 0;

                        const parseExcelRange = (textVal) => {
                            if (!textVal) return { min: "", max: "" };
                            let cleanVal = String(textVal).replace(/°C/gi, '').replace(/%/g, '').trim();
                            const m = cleanVal.match(/(-?[\d.]+)\s*(?:-|to|tot|t\/m|–)\s*(-?[\d.]+)/i);
                            if (m) return { min: m[1], max: m[2] };
                            const single = cleanVal.match(/(-?[\d.]+)/);
                            if (single) return { min: single[1], max: single[1] };
                            return { min: "", max: "" };
                        };

                        json.forEach(row => {
                            const rawName = row['Subgroup'] || row['Product group'] || row['Product'] || row['Name'];
                            if (!rawName) return;
                            const name = String(rawName).charAt(0).toUpperCase() + String(rawName).slice(1);
                            const variety = String(row['Variety'] || "");
                            const o2Range = parseExcelRange(row['Target O2'] || row['target O2'] || row['O2 target'] || "");
                            const co2Range = parseExcelRange(row['Target CO2'] || row['Co2'] || row['Co2 '] || row['CO2 target'] || "");
                            const tempRange = parseExcelRange(row['Storage temperature'] || row['Storage temp'] || row['RR Temperature'] || "");
