        // --- Lazy library loader ---
        // The two file parsers the importer needs, fetched the first time they are
        // actually needed rather than on page load. Version pins match what the
        // <script> tags used to carry, so nothing about the parsing changes.
        const LAZY_LIBS = {
            XLSX:    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
            mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js',
        };
        const _libLoads = {};
        const ensureLib = (name) => {
            // Already there (loaded earlier, or the browser cached it): done.
            if (window[name]) return Promise.resolve(window[name]);
            // In flight: hand back the same promise so two imports started at once
            // do not inject the script twice.
            if (_libLoads[name]) return _libLoads[name];
            _libLoads[name] = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = LAZY_LIBS[name];
                s.async = true;
                s.onload = () => window[name]
                    ? resolve(window[name])
                    : reject(new Error(name + ' loaded but did not register itself.'));
                s.onerror = () => {
                    // Drop the cached rejection so a retry can actually retry —
                    // the usual cause is a dropped connection, not a bad URL.
                    delete _libLoads[name];
                    reject(new Error('Could not load the ' + name + ' library. Check your internet connection and try the import again.'));
                };
                document.head.appendChild(s);
            });
            return _libLoads[name];
        };

        // --- Regression Math Helper ---
        // `hub`: the product's Hub respiration record (formData['hub-respiration']).
        // Its measurements drive the curve once they cover enough temperatures
        // (board-db hubRespirationCurve: three, the median per temperature); until
        // then the dashboard's own points do, as before. `source` says which:
        // 'hub' | 'measured' | 'target'.
        const getRegressionCurve = (taskData, type = 'O2', hub = null) => {
            if (!taskData && !hub) return null;
            taskData = taskData || {};
            const B = window.PerfoTecBoard;
            const hubCurve = hub && B && B.hubRespirationCurve ? B.hubRespirationCurve(hub) : null;
            const hubPoints = hubCurve && hubCurve.drives ? hubCurve.points.map(p => ({ t: p.t, rate: type === 'O2' ? p.rrO2 : p.rrCO2 })).filter(p => p.rate > 0).map(p => ({ ...p, lnR: Math.log(p.rate) })) : [];
            const actualPoints = []; const targetPoints = [];
            const temps = new Set();
            Object.keys(taskData).forEach(k => { const match = k.match(/^(?:target_)?temp(-?[\d.]+)_/); if (match) temps.add(parseFloat(match[1])); });

            temps.forEach(t => {
                const actVal = parseFloat(taskData[`temp${t}_${type}`]);
                if (!isNaN(actVal) && actVal > 0) actualPoints.push({ t, lnR: Math.log(actVal), rate: actVal });

                const tgtVal = parseFloat(taskData[`target_temp${t}_${type}`]);
                if (!isNaN(tgtVal) && tgtVal > 0) targetPoints.push({ t, lnR: Math.log(tgtVal), rate: tgtVal });
            });

            const fromHub = hubPoints.length >= 3;
            const isActual = fromHub || actualPoints.length >= 3; const usePoints = fromHub ? hubPoints : isActual ? actualPoints : targetPoints;
            if (usePoints.length >= 3) {
                const n = usePoints.length; let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                usePoints.forEach(p => { sumX += p.t; sumY += p.lnR; sumXY += p.t * p.lnR; sumXX += p.t * p.t; });
                const denominator = (n * sumXX - sumX * sumX);
                if (denominator !== 0) { const slope = (n * sumXY - sumX * sumY) / denominator; const intercept = (sumY - slope * sumX) / n; return { slope, intercept, points: usePoints, isActual, source: fromHub ? 'hub' : isActual ? 'measured' : 'target' }; }
            }
            return null;
        };

        const calculateQ10 = (taskData, hub = null) => { const reg = getRegressionCurve(taskData, 'O2', hub) || getRegressionCurve(taskData, 'CO2', hub); if (reg) return Math.exp(10 * reg.slope).toFixed(2); return ""; };

        // --- Dual Predictive Chart Component ---
        // hubPoints: [{ temp, rrO2, rrCO2 }] — respiration measured in the PerfoTec
        // Hub (FRM), drawn as open markers next to the dashboard's own points.
        // hub: the product's Hub respiration record; it draws the curve when it may.
        const PredictiveChart = ({ taskData, hubPoints, hub }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            const hubKey = (hubPoints || []).map(p => `${p.temp}:${p.rrO2}:${p.rrCO2}`).join('|') + (hub ? `#${(hub.measurements || []).length}|${hub.catalogueOf || ''}|${hub.syncedAt || ''}` : '');

            useEffect(() => {
                if ((!taskData && !hub) || !chartRef.current || !window.Chart) return;
                
                const regO2 = getRegressionCurve(taskData, 'O2', hub);
                const regCO2 = getRegressionCurve(taskData, 'CO2', hub);
                const pointLabel = (reg, gas) => reg.source === 'hub' ? `Hub median ${gas}` : reg.isActual ? `Actual ${gas}` : `Target ${gas}`;

                const datasets = [];

                if (regO2) {
                    const predO2 = []; for (let t = 0; t <= 25; t += 1) predO2.push({ x: t, y: Math.exp(regO2.slope * t + regO2.intercept).toFixed(2) });
                    const scatO2 = regO2.points.map(p => ({ x: p.t, y: p.rate }));
                    datasets.push({ type: 'line', label: 'Pred. O2 Curve', data: predO2, borderColor: '#084BCD', backgroundColor: 'rgba(8, 75, 205, 0.1)', borderWidth: 2, tension: 0.4, fill: false, pointRadius: 0 });
                    datasets.push({ type: 'scatter', label: pointLabel(regO2, 'O2'), data: scatO2, backgroundColor: '#084BCD', borderColor: '#084BCD', pointRadius: 6 });
                }

                if (regCO2) {
                    const predCO2 = []; for (let t = 0; t <= 25; t += 1) predCO2.push({ x: t, y: Math.exp(regCO2.slope * t + regCO2.intercept).toFixed(2) });
                    const scatCO2 = regCO2.points.map(p => ({ x: p.t, y: p.rate }));
                    datasets.push({ type: 'line', label: 'Pred. CO2 Curve', data: predCO2, borderColor: '#008837', backgroundColor: 'rgba(0, 136, 55, 0.1)', borderWidth: 2, tension: 0.4, fill: false, pointRadius: 0 });
                    datasets.push({ type: 'scatter', label: pointLabel(regCO2, 'CO2'), data: scatCO2, backgroundColor: '#008837', borderColor: '#008837', pointRadius: 6, pointStyle: 'triangle' });
                }

                const drawn = hubPoints || [];
                const hubO2 = drawn.filter(p => p.rrO2 != null).map(p => ({ x: p.temp, y: p.rrO2 })), hubCO2 = drawn.filter(p => p.rrCO2 != null).map(p => ({ x: p.temp, y: p.rrCO2 }));
                if (hubO2.length) datasets.push({ type: 'scatter', label: 'Hub O2 (measured)', data: hubO2, backgroundColor: 'rgba(8, 75, 205, 0.12)', borderColor: '#084BCD', borderWidth: 1.5, pointRadius: 4 });
                if (hubCO2.length) datasets.push({ type: 'scatter', label: 'Hub CO2 (measured)', data: hubCO2, backgroundColor: 'rgba(0, 136, 55, 0.12)', borderColor: '#008837', borderWidth: 1.5, pointRadius: 4, pointStyle: 'triangle' });

                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'scatter',
                    data: { datasets },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'linear', title: { display: true, text: 'Temperature (°C)' }, min: 0, max: 25, ticks: { stepSize: 5 } }, y: { title: { display: true, text: 'Respiration Rate (mL/kg/24h)' }, beginAtZero: true } }, plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } } }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [taskData, hubKey]);

            return (
                <div className="mt-8 pt-6 border-t border-slate-200">
                    <h6 className="flex items-center gap-2 text-xs font-spartan font-bold uppercase tracking-widest text-slate-900 mb-4"><LineChart size={14} className="text-blue-600"/> Predictive Respiration Curve</h6>
                    <div className="h-[300px] w-full relative"><canvas ref={chartRef}></canvas></div>
                </div>
            );
        };

        // Quality-over-time curves per trial: shows how the score declines over the days,
        // with the specification limit (score 7, the report's rule). Rating and shelf life are one linked story —
        // a trial stopped at day 14 scores higher than the same trial measured to day 28.
        // Per-day median of several curves, kept only on days at least half of them
        // were scored: a day-30 median from the three trials that ran that long is
        // the survivors talking, not the setting.
        const medianCurve = (curves) => {
            const byDay = new Map();
            curves.forEach(pts => pts.forEach(p => { if (!byDay.has(p.x)) byDay.set(p.x, []); byDay.get(p.x).push(p.y); }));
            const need = Math.max(2, Math.ceil(curves.length / 2));
            const med = (v) => { const s = [...v].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
            return [...byDay.entries()].filter(([, v]) => v.length >= need).sort((a, b) => a[0] - b[0]).map(([x, v]) => ({ x, y: Math.round(med(v) * 10) / 10 }));
        };

        // Quality score over time for the selected trials, against the specification
        // limit (score 7). Lines are straight between the days actually scored: the
        // smoothed curves drew dips and recoveries between inspections that nobody
        // measured. Two markers carry what a line cannot:
        //   ▲ the last point of a trial that was still in spec when it stopped (its
        //     shelf life is "≥", not known);
        //   ✕ a score that rose again by more than a point — quality does not recover,
        //     so the report needs checking.
        // `emphasis` ({ configRows, refRows, configLabel }) draws one configuration
        // over all its rounds against the current packaging of those rounds: thin
        // lines per round, bold medians on top. `labelOf(i)` names a row.
        const QualityCurveChart = ({ taskData, selected, emphasis, labelOf }) => {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            const count = trialRowCountOf(taskData);
            let curveCount = 0;
            for (let i = 0; i < count; i++) if (taskData[`pack_opt_${i}_curve`]) curveCount++;
            const selectedKey = selected ? [...selected].sort((a, b) => a - b).join(',') : 'all';
            const emphasisKey = emphasis ? `${emphasis.configLabel}|${[...emphasis.configRows].join(',')}|${[...emphasis.refRows].join(',')}` : '';
            // What the chart draws, as text: it is rebuilt when that changes, not
            // whenever the trial table does (the TV advisor's inputs live there too,
            // and every key typed there used to redraw this chart).
            const dataKey = Array.from({ length: count }, (_, i) => taskData[`pack_opt_${i}_curve`]
                ? [taskData[`pack_opt_${i}_curve`], taskData[`pack_opt_${i}_role`], labelOf ? labelOf(i) : [taskData[`pack_opt_${i}_material`], taskData[`pack_opt_${i}_type`], taskData[`pack_opt_${i}_date`]].join('~')].join('~')
                : '').join('|');

            useEffect(() => {
                if (!chartRef.current || !window.Chart) return;
                const n = trialRowCountOf(taskData);
                const series = [];
                for (let i = 0; i < n; i++) {
                    if (selected && !selected.has(i)) continue;
                    const curve = taskData[`pack_opt_${i}_curve`];
                    if (!curve) continue;
                    const pts = String(curve).split('|').map(s => { const parts = s.split(':'); return { x: parseFloat(parts[0]), y: parseFloat(String(parts[1] || '').replace(',', '.')) }; }).filter(p => !isNaN(p.x) && !isNaN(p.y)).sort((a, b) => a.x - b.x);
                    if (pts.length < 2) continue;
                    const mat = taskData[`pack_opt_${i}_material`] || '';
                    const label = labelOf ? labelOf(i) : [mat || taskData[`pack_opt_${i}_type`] || `Trial ${i + 1}`, taskData[`pack_opt_${i}_date`]].filter(Boolean).join(' · ');
                    const isControl = window.PerfoTecBoard && window.PerfoTecBoard.trialRowRole ? window.PerfoTecBoard.trialRowRole(taskData, i) === 'reference' : /control|bopp|standard/i.test(mat);
                    series.push({ i, label, pts, isControl });
                }
                if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; }
                if (series.length === 0) return;
                // Per-point markers: ▲ still in spec at the stop, ✕ a score that rose.
                const markers = (pts, color, baseRadius) => {
                    let low = Infinity;
                    const style = [], radius = [], fill = [];
                    pts.forEach((p, k) => {
                        const rose = k > 0 && p.y > low + 1;
                        low = Math.min(low, p.y);
                        const last = k === pts.length - 1;
                        if (rose) { style.push('crossRot'); radius.push(7); fill.push('#dc2626'); }
                        else if (last && p.y >= 7 && p.x > 0) { style.push('triangle'); radius.push(baseRadius + 3); fill.push(color); }
                        else { style.push('circle'); radius.push(baseRadius); fill.push(color); }
                    });
                    return { pointStyle: style, pointRadius: radius, pointBackgroundColor: fill, pointBorderColor: fill.map(c => c === '#dc2626' ? c : color) };
                };
                // Same series order as CHART_COLORS in config.js, so a shelf-life
                // curve here and one in the report tool colour their trials
                // identically. The current packaging stays muted grey and dashed.
                const palette = ['#008837', '#084BCD', '#1A1B1F', '#5A85E7', '#00A346', '#EA580C'];
                const GREEN = '#008837', GREY = '#8A97AD';
                let ci = 0;
                const maxDay = Math.max(...series.flatMap(s => s.pts.map(p => p.x)));
                const datasets = [];
                if (emphasis) {
                    const cfg = series.filter(s => emphasis.configRows.has(s.i));
                    const ref = series.filter(s => emphasis.refRows.has(s.i));
                    const thin = (s, color, dashed) => ({ type: 'line', label: s.label, data: s.pts, borderColor: color + '59', backgroundColor: color + '59', borderWidth: 1.5, tension: 0, borderDash: dashed ? [5, 4] : [], ...markers(s.pts, color + '99', 2), _detail: true });
                    ref.forEach(s => datasets.push(thin(s, GREY, true)));
                    cfg.forEach(s => datasets.push(thin(s, GREEN, false)));
                    if (ref.length) datasets.push({ type: 'line', label: `Current packaging — median of the same ${ref.length} rounds`, data: medianCurve(ref.map(s => s.pts)), borderColor: GREY, backgroundColor: GREY, borderWidth: 3.5, tension: 0, borderDash: [7, 5], pointRadius: 3 });
                    if (cfg.length) datasets.push({ type: 'line', label: `${emphasis.configLabel} — median of ${cfg.length} rounds`, data: medianCurve(cfg.map(s => s.pts)), borderColor: GREEN, backgroundColor: GREEN, borderWidth: 4, tension: 0, pointRadius: 3.5 });
                } else {
                    series.forEach(s => {
                        const color = s.isControl ? GREY : palette[(ci++) % palette.length];
                        datasets.push({ type: 'line', label: s.label, data: s.pts, borderColor: color, backgroundColor: color, borderWidth: 2.5, tension: 0, borderDash: s.isControl ? [6, 4] : [], ...markers(s.pts, color, 4) });
                    });
                }
                datasets.push({ type: 'line', label: 'Within specification (score 7)', data: [{ x: 0, y: 7 }, { x: maxDay, y: 7 }], borderColor: '#dc2626', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 });
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'line',
                    data: { datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: { x: { type: 'linear', title: { display: true, text: 'Days after packing' }, min: 0 }, y: { title: { display: true, text: 'Quality score' }, min: 0, max: 10, ticks: { stepSize: 2 } } },
                        plugins: {
                            // With one configuration over all its rounds, the legend names
                            // the two medians; the thin per-round lines speak in the tooltip.
                            legend: { position: 'top', labels: { filter: (item, data) => !(data.datasets[item.datasetIndex] || {})._detail } },
                            tooltip: { mode: 'nearest', intersect: false }
                        }
                    }
                });
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [dataKey, selectedKey, emphasisKey]);

            if (curveCount === 0) return (
                <div className="h-[120px] flex items-center justify-center text-sm text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-lg">
                    Quality curves appear here after importing a trial report (JSON) — every measured day is kept, not just the end score.
                </div>
            );
            if (selected && selected.size === 0) return (
                <div className="h-[120px] flex items-center justify-center text-sm text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-lg">
                    No trials selected — pick one or more trials above to plot their quality curves.
                </div>
            );
            return (
                <div>
                    <div className="h-[340px] w-full relative"><canvas ref={chartRef}></canvas></div>
                    <p className="mt-2 text-[11px] text-slate-500 flex flex-wrap gap-x-4 gap-y-1">
                        <span><span className="font-bold">▲</span> still within specification when the trial stopped — its shelf life is at least this long</span>
                        <span><span className="font-bold text-red-600">✕</span> the score rose again by more than a point — check the report</span>
                        <span>Lines join the days that were scored; nothing is drawn in between.</span>
                    </p>
                </div>
            );
        };

        // One part of the client package: what the tool already has (ticked or not)
        // and the documents linked from the shared library. Links only http(s) —
        // a SharePoint or website address, never a script.
        // Workflow status per product record (see getProductWorkflowStatus).
        const WORKFLOW_STATUS_CACHE = new WeakMap();

        // Only the best result per temperature group and weight class (Luke
        // 2026-11-02): trialBestPractice still keeps varieties and conditions
        // (MAP / OPEN / MHP) apart; the overviews show the first — best — of them.
        // The groups come proven first, then by their winner, so first is best.
        const bestPerTempAndSize = (groups) => {
            const seen = new Set();
            return (groups || []).filter(g => {
                if (!g.winner) return false;
                const k = `${g.tempBand}|${g.size ? g.size.index : '?'}`;
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
            });
        };

        // A weight class (board-db packSizeBand, the upper bound excluded) as
        // text: "< 75 g", "150–249 g", "750–1399 g", "1.4–2 kg", "7.5–12.5 kg".
        // packWeightText: one pack's weight in kg.
        const packWeightText = (kg) => !(kg > 0) ? '—' : kg >= 1 ? `${Math.round(kg * 10) / 10} kg` : `${Math.round(kg * 1000)} g`;
        const packSizeText = (size) => {
            if (!size) return 'weight unknown';
            const lo = Math.round(size.minKg * 1000), hi = Math.round(size.maxKg * 1000);
            if (lo === 0) return `< ${hi} g`;
            if (lo < 1000) return `${lo}–${hi - 1} g`;
            return `${lo / 1000}–${hi / 1000} kg`;
        };

        // ══ COMMERCIAL STATUS ════════════════════════════════════════════════
        // Derived, never typed (Luke 2026-11-11). A result is commercially ready
        // when two or more rounds reached it (proven) and/or product management
        // released the product (the market-ready check); both are shown side by
        // side. One round only: to be verified. A product with trials but nothing
        // within specification is in development; a PARK at its last checkpoint
        // parks it.
        const COMMERCIAL_STATUS = {
            ready: ['Commercially ready', 'bg-green-100 text-green-800'],
            verify: ['To be verified', 'bg-amber-100 text-amber-800'],
            development: ['In development', 'bg-blue-50 text-blue-700'],
            parked: ['Parked', 'bg-slate-200 text-slate-600'],
            none: ['Not tested', 'bg-slate-100 text-slate-400'],
        };
        const resultStatus = (proven, released) => proven || released ? 'ready' : 'verify';
        const productCommercialStatus = ({ parked, released, best, trials }) =>
            parked ? 'parked' : best ? resultStatus(best.proven, released) : released ? 'ready' : trials ? 'development' : 'none';
        const StatusChips = ({ status, proven, rounds, released }) => (
            <span className="inline-flex flex-wrap items-center gap-1">
                <span className={`text-[10px] font-bold uppercase px-2 py-1 rounded whitespace-nowrap ${COMMERCIAL_STATUS[status][1]}`}>{COMMERCIAL_STATUS[status][0]}</span>
                {proven && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded border border-green-200 text-green-800 whitespace-nowrap" title={`${rounds} rounds reached this shelf life`}>Proven · {rounds} rounds</span>}
                {released && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded border border-[#084BCD]/30 text-[#084BCD] whitespace-nowrap" title="Product management released this product (market-ready check)">Released by PM</span>}
            </span>
        );
        // How a pack was perforated and flushed, in words. Whether it was flushed
        // is decided by the gas in the pack at packing (P+0) when that is known
        // (Luke 2026-11-11): O2 below 18 % and/or CO2 above 1 % means a flush was
        // applied, otherwise the pack started at ambient. Ambient is 20.9 % and
        // 0.04 %; the margin keeps measuring noise from reading as a flush. Which system did it (O2 Control or another) cannot be read
        // from the gas: that comes from the recorded field only. Without start
        // values the recorded field decides.
        const FLUSH_O2_BELOW = 18, FLUSH_CO2_ABOVE = 1;
        const perfText = (perf) => ({ perfotec: 'PerfoTec laser perforation', other: 'Other perforation', none: 'No perforation' })[perf] || '';
        const flushInfo = (flush, startO2, startCO2) => {
            const o2 = parseFloat(String(startO2 ?? '').replace(',', '.')), co2 = parseFloat(String(startCO2 ?? '').replace(',', '.'));
            const start = [isFinite(o2) ? `O₂ ${o2} %` : '', isFinite(co2) ? `CO₂ ${co2} %` : ''].filter(Boolean).join(' · ');
            const known = isFinite(o2) || isFinite(co2);
            const applied = known ? ((isFinite(o2) && o2 < FLUSH_O2_BELOW) || (isFinite(co2) && co2 > FLUSH_CO2_ABOVE))
                : flush === 'o2control' || flush === 'other' ? true : flush === 'none' ? false : null;
            const system = flush === 'o2control' ? ' · O2 Control' : flush === 'other' ? ' · other system' : '';
            const label = applied === null ? '' : applied ? `Gas flush: yes${system}` : 'Gas flush: no';
            return { applied, label, inferred: false, start, o2control: applied === true && flush === 'o2control' };
        };

        // ══ A LINK THAT OPENS THE SAME VIEW ══════════════════════════════════
        // The address carries where you are — the page, the product and its tab,
        // the overview's list, packaging and filters — so a link sent to a
        // colleague opens what you were looking at. Read once on loading.
        const urlParam = (k) => { try { return new URLSearchParams(window.location.search).get(k); } catch (e) { return null; } };
        const LAST_SEEN_KEY = 'perfotec-dashboard-last-seen';

        // ══ NARROW SCREENS ═══════════════════════════════════════════════════
        // Below 768 px (a phone, or a window pulled narrow) wide tables are
        // replaced by cards, and the lower blocks of the Dashboard tab fold to a
        // heading: nine screens of scrolling is not "at a glance".
        const NARROW_QUERY = '(max-width: 767px)';
        const useIsNarrow = () => {
            const [narrow, setNarrow] = useState(() => !!(window.matchMedia && window.matchMedia(NARROW_QUERY).matches));
            useEffect(() => {
                if (!window.matchMedia) return;
                const mq = window.matchMedia(NARROW_QUERY);
                const on = () => setNarrow(mq.matches);
                mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
                return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
            }, []);
            return narrow;
        };
        // Always open on a wide screen; on a narrow one a heading that opens it.
        const NarrowFold = ({ title, children }) => {
            const [open, setOpen] = useState(false);
            return (
                <div>
                    <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open} className="md:hidden w-full flex items-center gap-3 bg-white border border-slate-200 rounded-xl shadow-sm px-4 py-3.5 text-left">
                        <ChevronRight size={18} className={`shrink-0 text-slate-400 transition-transform ${open ? 'rotate-90' : ''}`}/>
                        <span className="font-spartan font-bold text-slate-900">{title}</span>
                    </button>
                    <div className={open ? 'mt-3 md:mt-0' : 'hidden md:block'}>{children}</div>
                </div>
            );
        };

        // A card whose header folds it; open unless this browser folded it before.
        const FoldCard = ({ storeKey, header, children }) => {
            const [open, setOpen] = useState(() => { try { return localStorage.getItem(storeKey) !== '0'; } catch (e) { return true; } });
            const toggle = () => setOpen(o => { try { localStorage.setItem(storeKey, o ? '0' : '1'); } catch (e) {} return !o; });
            return (
                <div className="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                    <button type="button" onClick={toggle} aria-expanded={open} className={`w-full px-4 py-2.5 bg-slate-50 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-left ${open ? 'border-b border-slate-200' : ''}`}>
                        <ChevronRight size={16} className={`shrink-0 text-slate-400 transition-transform ${open ? 'rotate-90' : ''}`}/>
                        {header}
                    </button>
                    {open && children}
                </div>
            );
        };

        // "2026-08-28" → "28-08-2026"; anything else as it is.
        const fmtIsoDate = (iso) => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : String(iso || ''); };

        // ══ WORKFLOW TAB — foldable sections ═════════════════════════════════
        // Trial results, respiration and the product sheet fold down to a header
        // that keeps a one-line summary, so a folded section still says what is
        // in it. A product with forty trials was a long scroll before the rest of
        // the workflow came into view (Luke 2026-11-05). Open or folded is
        // remembered per section in this browser.
        const WF_FOLD_KEY = 'perfotec-dashboard-workflow-folds';
        const WF_FOLD_DEFAULTS = { trials: true, respiration: false, sheet: false, properties: false };
        const FoldSection = ({ id, open, onToggle, icon: Icon, title, summary, badge, actions, children }) => (
            <section id={`wf-${id}`} className="pf-wf-anchor bg-white border border-slate-200 rounded-xl shadow-sm">
                <div className="flex flex-wrap items-center gap-x-4 gap-y-3 px-5 py-4">
                    <button type="button" onClick={onToggle} aria-expanded={open} className="group flex items-center gap-3 flex-1 min-w-[240px] text-left">
                        <ChevronRight size={18} className={`shrink-0 text-slate-400 group-hover:text-[#084BCD] transition-transform ${open ? 'rotate-90' : ''}`}/>
                        <span className="w-9 h-9 rounded-lg bg-[#F1F6FF] flex items-center justify-center shrink-0"><Icon size={17} className="text-[#084BCD]"/></span>
                        <span className="min-w-0">
                            <span className="flex flex-wrap items-center gap-2 font-spartan font-bold text-base text-slate-900 leading-tight">{title}{badge}</span>
                            {summary && <span className="block text-xs text-slate-500 mt-0.5">{summary}</span>}
                        </span>
                    </button>
                    {actions && <div className="flex flex-wrap items-center gap-2">{actions}</div>}
                </div>
                {open && <div className="border-t border-slate-200">{children}</div>}
            </section>
        );

        // The report a trial row belongs to, as the trial table groups it: the
        // report's name and date (board-db trialRows' round, without the R2
        // suffix — a verification round stays with its report), else the board
        // project; '' for a row not linked to a report yet.
        const trialReportKey = (master, i) => {
            const f = (k) => String(master[`pack_opt_${i}_${k}`] ?? '').trim();
            if (f('pdf') || f('date')) return `r|${f('pdf').toLowerCase()}|${f('date')}`;
            return f('project') ? `p|${f('project')}` : '';
        };
        // Short form of a checkpoint decision ("PASS — move forward" → "PASS");
        // '' when nothing is decided ("— No decision yet —").
        const decisionWord = (v) => { const s = String(v || '').trim(); return !s || s.startsWith('—') ? '' : s.split(' — ')[0]; };
        const DECISION_TONE = { PASS: 'bg-[#008837]/10 text-[#008837]', 'MARKET-READY': 'bg-[#008837]/10 text-[#008837]', RELEASED: 'bg-[#008837]/10 text-[#008837]', ITERATE: 'bg-amber-50 text-amber-700', PARK: 'bg-slate-200 text-slate-600' };
        const DecisionChip = ({ label, value }) => {
            const w = decisionWord(value);
            return (
                <span className={`inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md ${w ? (DECISION_TONE[w] || 'bg-slate-100 text-slate-600') : 'bg-slate-100 text-slate-400'}`} title={value || 'No decision yet'}>
                    {label}: {w || 'open'}
                </span>
            );
        };

        // The tab bar, a component of its own: a click lights the tab (with a
        // spinner while it is built) without re-rendering the whole dashboard
        // first. The switch itself is a transition — the old tab stays usable
        // while the new one is built (Workflow and Database hold thousands of
        // fields) instead of the page freezing. Sticky under the masthead.
        // Two environments (Luke 2026-11-11), chosen when the dashboard opens and
        // remembered in this browser: 'commercial' — what was achieved per product
        // and packaging, read-only, starting on the Product Overview — and 'pm'
        // (product management), which adds the Workflow tab, the Database and
        // importing. No login: it is a view, not a lock.
        const AUDIENCE_KEY = 'perfotec-dashboard-audience';
        const readAudience = () => { try { const v = localStorage.getItem(AUDIENCE_KEY); return v === 'commercial' || v === 'pm' ? v : null; } catch (e) { return null; } };
        const TABS = [['pipeline', ListTodo, 'Verification & data'], ['dashboard', Eye, 'Dashboard'], ['commercial', Briefcase, 'Commercial']];
        const TabBar = ({ active, onSelect, tabs = TABS }) => {
            const [pending, startSwitch] = useTransition();
            const [target, setTarget] = useState(null);
            const ref = useRef(null);
            const shown = pending && target ? target : active;
            const go = (id) => {
                if (id === active && !pending) return;
                setTarget(id);
                startSwitch(() => onSelect(id));
                // Scrolled down into a tab: the next one starts at its top, just
                // under the sticky bar, not halfway down.
                const bar = ref.current;
                if (bar && bar.parentElement) {
                    const mast = document.querySelector('.pf-web-masthead');
                    const top = bar.parentElement.getBoundingClientRect().top + window.scrollY - (mast ? mast.offsetHeight : 0) - 12;
                    if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'instant' });
                }
            };
            return (
                <div ref={ref} className={`pf-web-tabs pf-web-tabs-sticky mb-6 ${pending ? 'is-pending' : ''}`}>
                    {tabs.map(([id, Icon, label]) => (
                        <button key={id} onClick={() => go(id)} className={`pf-web-tab ${shown === id ? 'is-active' : ''}`}>
                            {pending && target === id ? <Loader2 size={14} className="animate-spin"/> : <Icon size={14}/>} {label}
                        </button>
                    ))}
                </div>
            );
        };

        // Long lists build one page at a time; this row asks for the next page
        // when it scrolls into view (and offers buttons for the impatient).
        const DB_TRIAL_PAGE = 100;
        const LoadMore = ({ onMore, children }) => {
            const ref = useRef(null);
            const more = useRef(onMore);
            more.current = onMore;
            useEffect(() => {
                const el = ref.current;
                if (!el || !window.IntersectionObserver) return;
                const io = new IntersectionObserver(entries => { if (entries.some(e => e.isIntersecting)) startTransition(() => more.current()); }, { rootMargin: '600px 0px' });
                io.observe(el);
                return () => io.disconnect();
            }, []);
            return <div ref={ref} className="px-4 py-3 text-xs text-slate-500 border-t border-slate-200 bg-white">{children}</div>;
        };

        // ══ FAST INPUT ════════════════════════════════════════════════════════
        // A field that answers the keyboard at once. The dashboard is one large
        // component, and a typed key used to re-render all of it — every trial
        // row, the data check, the charts — before the key even showed: 0.3–1 s
        // a key with a full database. This field keeps what is typed itself and
        // hands it up as a React transition: the page catches up in the
        // background, and the next key interrupts that work instead of queueing
        // behind it. A value changed from outside (an import, the data check, a
        // side effect of another field) shows at once, unless the field is being
        // typed in or something it sent is still on its way — then on blur, or
        // when that arrives. The check runs while rendering, not in an effect:
        // an effect left over from the previous key could run AFTER the next key
        // and put the old text back.
        // as="textarea" for multi-line fields; every other prop passes through.
        const FastInput = ({ value, onValue, as, onBlur, ...rest }) => {
            const outer = value == null ? '' : String(value);
            const [local, setLocal] = useState(outer);
            const [adopted, setAdopted] = useState(outer);   // the outside value last taken over
            const [pending, startSend] = useTransition();
            const el = useRef(null);
            const editing = () => !!el.current && el.current === document.activeElement;
            if (outer !== adopted && !pending && !editing()) { setAdopted(outer); setLocal(outer); }
            const Tag = as || 'input';
            return <Tag {...rest} ref={el} value={local}
                onBlur={e => { if (!pending && local !== outer) { setAdopted(outer); setLocal(outer); } if (onBlur) onBlur(e); }}
                onChange={e => { const v = e.target.value; setLocal(v); startSend(() => onValue(v)); }}/>;
        };

        // ══ FILMS — the material register (board-db films.json) ══════════════
        // A trial row points at a film by id. The select lists PerfoTec's own
        // films first; a film that does not fit the row's packaging is still
        // listed (not every film is tagged), an archived one only while a row
        // still points at it. "+ New film…" opens the editor and links the new
        // film to the row.
        const FilmSelect = ({ value, films, type, disabled, onChange, onNew, className, title }) => {
            const list = films || [];
            const cur = list.find(f => f.id === value);
            const usable = list.filter(f => !f.archived || f.id === value);
            const fits = (f) => !type || !f.packTypes.length || f.packTypes.includes(type === 'Liner' ? 'Crate/Box' : type);
            const opt = (f) => <option key={f.id} value={f.id}>{f.name}{f.thicknessUm ? ` · ${f.thicknessUm} µm` : ''}{fits(f) ? '' : ` (not for ${type})`}{f.archived ? ' (archived)' : ''}</option>;
            const byName = (a, b) => (fits(b) - fits(a)) || a.name.localeCompare(b.name);
            return (
                <select value={value || ''} disabled={disabled || !films} title={title || (cur ? cur.name : '')} className={className}
                    onChange={e => e.target.value === '__new' ? onNew && onNew() : onChange(e.target.value)}>
                    <option value="">{films ? '—' : 'No register'}</option>
                    {value && !cur && <option value={value}>Unknown film ({value})</option>}
                    {usable.some(f => f.own) && <optgroup label="PerfoTec films">{usable.filter(f => f.own).sort(byName).map(opt)}</optgroup>}
                    {usable.some(f => !f.own) && <optgroup label="Other films">{usable.filter(f => !f.own).sort(byName).map(opt)}</optgroup>}
                    {onNew && films && <option value="__new">+ New film…</option>}
                </select>
            );
        };

        // Create or edit one film. OTR and CO₂TR are the TDS values of the
        // UNPERFORATED film; their ratio is what the TV advisor falls back on when
        // no trial shows yet how a pack of this film behaves.
        const FilmEditorModal = ({ film, onSave, onClose, nameTaken }) => {
            const B = window.PerfoTecBoard || {};
            const [f, setF] = useState(() => ({ name: '', own: false, polymer: '', thicknessUm: '', format: '', packTypes: [], otr: '', co2tr: '', wvtr: '', tdsUrl: '', aliases: '', notes: '', ...film }));
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);
            const name = String(f.name || '').trim();
            const taken = !!name && nameTaken(name, f.id);
            const okUrl = !String(f.tdsUrl || '').trim() || /^https?:\/\/\S+$/i.test(String(f.tdsUrl).trim());
            const ratio = B.filmTdsRatio ? B.filmTdsRatio(f) : null;
            const can = !!name && !taken && okUrl && !busy;
            const save = () => {
                if (!can) return;
                setBusy(true); setError('');
                Promise.resolve(onSave(f)).catch(e => { setError(`Not saved: ${(e && e.message) || e}`); setBusy(false); });
            };
            const input = 'w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-200';
            const label = 'block text-[10px] font-spartan font-bold uppercase tracking-widest text-slate-500 mb-1';
            return (
                <div className="fixed inset-0 z-[210] bg-slate-900/60 backdrop-blur-sm flex items-start md:items-center justify-center p-3 overflow-y-auto" role="dialog" aria-label="Film">
                    <form onSubmit={e => { e.preventDefault(); save(); }} className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl my-6">
                        <div className="px-6 py-4 border-b border-slate-200 flex items-center gap-2">
                            <Layers size={18} className="text-[#084BCD]"/>
                            <h3 className="font-spartan font-bold text-lg text-slate-900 mr-auto">{f.id ? 'Edit film' : 'New film'}</h3>
                            <button type="button" onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-900 rounded-lg" title="Close (Esc)"><X size={16}/></button>
                        </div>
                        <div className="p-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div className="sm:col-span-2">
                                <label className={label}>Name *</label>
                                <input autoFocus={!f.hubId} disabled={!!f.hubId} value={f.name} onChange={e => set('name', e.target.value)} placeholder="e.g. PerfoTec BOPE 30" className={`${input} ${taken ? 'border-red-300' : ''} ${f.hubId ? 'bg-slate-100 text-slate-500' : ''}`}/>
                                {f.hubId && <p className="text-[11px] text-[#084BCD] mt-1">Managed in the PerfoTec Hub: name, thickness, OTR and CO₂TR follow the Hub. WVTR and the other fields are kept here.</p>}
                                {taken && <p className="text-[11px] text-red-600 mt-1">A film with this name already exists.</p>}
                            </div>
                            <label className="flex items-center gap-2 text-sm font-bold text-slate-800 sm:mt-5 cursor-pointer">
                                <input type="checkbox" checked={!!f.own} onChange={e => set('own', e.target.checked)}/> PerfoTec film
                            </label>
                            <div>
                                <label className={label}>Polymer</label>
                                <select value={f.polymer} onChange={e => set('polymer', e.target.value)} className={input}>
                                    <option value="">—</option>{(B.FILM_POLYMERS || []).map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className={label}>Thickness (µm)</label>
                                <input type="number" min="0" step="any" disabled={!!f.hubId} value={f.thicknessUm} onChange={e => set('thicknessUm', e.target.value)} className={`${input} ${f.hubId ? 'bg-slate-100 text-slate-500' : ''}`}/>
                            </div>
                            <div>
                                <label className={label}>Format</label>
                                <select value={f.format} onChange={e => set('format', e.target.value)} className={input}>
                                    <option value="">—</option>{(B.FILM_FORMATS || []).map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div className="sm:col-span-3">
                                <label className={label}>Used for packaging</label>
                                <div className="flex flex-wrap gap-2">
                                    {(B.FILM_PACK_TYPES || []).map(t => {
                                        const on = (f.packTypes || []).includes(t);
                                        return <button type="button" key={t} onClick={() => set('packTypes', on ? f.packTypes.filter(x => x !== t) : [...(f.packTypes || []), t])}
                                            className={`px-3 py-1.5 rounded-full border text-xs font-bold ${on ? 'bg-[#084BCD] border-[#084BCD] text-white' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>{t === 'Crate/Box' ? 'Crate / Box' : t}</button>;
                                    })}
                                </div>
                            </div>
                            <div>
                                <label className={label} title="Oxygen transmission rate of the unperforated film, cc/m²·24h at 23 °C (from the TDS)">OTR (cc/m²·day)</label>
                                <input type="number" min="0" step="any" disabled={!!f.hubId} value={f.otr} onChange={e => set('otr', e.target.value)} className={`${input} ${f.hubId ? 'bg-slate-100 text-slate-500' : ''}`}/>
                            </div>
                            <div>
                                <label className={label} title="CO₂ transmission rate of the unperforated film, cc/m²·24h at 23 °C (from the TDS)">CO₂TR (cc/m²·day)</label>
                                <input type="number" min="0" step="any" disabled={!!f.hubId} value={f.co2tr} onChange={e => set('co2tr', e.target.value)} className={`${input} ${f.hubId ? 'bg-slate-100 text-slate-500' : ''}`}/>
                            </div>
                            <div>
                                <label className={label} title="Water vapour transmission rate, g/m²·24h (from the TDS)">WVTR (g/m²·day)</label>
                                <input type="number" min="0" step="any" value={f.wvtr} onChange={e => set('wvtr', e.target.value)} className={input}/>
                            </div>
                            <p className="sm:col-span-3 -mt-2 text-[11px] text-slate-500">
                                TDS values of the unperforated film. {ratio != null ? <>CO₂ : O₂ = <b>{ratio.toFixed(1)}</b> — the TV advisor uses this until trials with this film show how its packs behave.</> : 'With OTR and CO₂TR the TV advisor can estimate this film before its first trial.'}
                            </p>
                            <div className="sm:col-span-3">
                                <label className={label}>Technical data sheet (link)</label>
                                <input value={f.tdsUrl} onChange={e => set('tdsUrl', e.target.value)} placeholder="https://… (SharePoint link)" className={`${input} ${okUrl ? '' : 'border-red-300'}`}/>
                                <p className="text-[11px] text-slate-500 mt-1">Shared with clients in the commercial overview, next to the film's name, polymer and thickness.</p>
                            </div>
                            <div className="sm:col-span-3">
                                <label className={label}>Also written as</label>
                                <input value={f.aliases} onChange={e => set('aliases', e.target.value)} placeholder="e.g. C+, C+500 — comma separated" className={input}/>
                                <p className="text-[11px] text-slate-500 mt-1">Words in variant names or report film specs that mean this film; the trial table's data check proposes the link from them.</p>
                            </div>
                            <div className="sm:col-span-3">
                                <label className={label}>Notes (internal)</label>
                                <textarea rows={2} value={f.notes} onChange={e => set('notes', e.target.value)} className={input}/>
                            </div>
                        </div>
                        <div className="px-6 py-4 border-t border-slate-200 flex items-center gap-3">
                            {error && <span className="text-xs font-bold text-red-600">{error}</span>}
                            <button type="button" onClick={onClose} className="ml-auto px-4 py-2 rounded-lg border border-slate-300 text-slate-700 text-xs font-bold uppercase tracking-widest hover:bg-slate-50">Cancel</button>
                            <button type="submit" disabled={!can} className="px-5 py-2 rounded-lg bg-[#084BCD] text-white text-xs font-bold uppercase tracking-widest disabled:opacity-40">{busy ? 'Saving…' : 'Save film'}</button>
                        </div>
                    </form>
                </div>
            );
        };

        // A document is linked for the packaging on screen (typeName) or for all.
        const CommercialSection = ({ sec, items, docs, readOnly, onAdd, onRemove, typeName }) => {
            const [name, setName] = useState('');
            const [url, setUrl] = useState('');
            const [lang, setLang] = useState('EN');
            const [forAll, setForAll] = useState(false);
            const okUrl = /^https?:\/\/\S+$/i.test(url.trim());
            return (
                <div className="border border-slate-200 rounded-xl p-4 bg-slate-50/50">
                    <p className="font-spartan font-bold text-slate-900"><span className="text-[#084BCD] mr-1.5">{sec.id}</span>{sec.title}</p>
                    <p className="text-xs text-slate-500 mb-3">{sec.hint}</p>
                    <ul className="space-y-1 mb-3">
                        {items.map((it, k) => <li key={k} className="flex items-start gap-2 text-xs">{it.ok ? <CheckCircle2 size={14} className="text-[#008837] shrink-0 mt-px"/> : <Square size={14} className="text-slate-300 shrink-0 mt-px"/>}<span className={it.ok ? 'text-slate-800' : 'text-slate-500'}>{it.text}</span></li>)}
                    </ul>
                    {docs.length > 0 && (
                        <ul className="space-y-1 mb-3">
                            {docs.map(d => (
                                <li key={d.id} className="flex items-center gap-2 text-xs bg-white border border-slate-200 rounded-lg px-2 py-1.5">
                                    <LinkIcon size={12} className="text-[#084BCD] shrink-0"/>
                                    <a href={d.url} target="_blank" rel="noopener noreferrer" className="flex-1 min-w-0 truncate text-[#084BCD] font-semibold hover:underline" title={d.url}>{d.name}</a>
                                    <span className="text-[10px] font-bold text-slate-400" title={d.type ? `Only in the ${d.type} package` : 'In every packaging\'s package'}>{d.type ? d.type : 'all'} · {d.lang}</span>
                                    {!readOnly && <button onClick={() => onRemove(d.id)} className="text-slate-300 hover:text-red-600" title="Remove link"><X size={12}/></button>}
                                </li>
                            ))}
                        </ul>
                    )}
                    {!readOnly && (
                        <div className="flex flex-wrap items-center gap-1.5">
                            <input value={name} onChange={e => setName(e.target.value)} placeholder="Document name" className="flex-1 min-w-[120px] text-xs p-1.5 border border-slate-300 rounded-lg bg-white"/>
                            <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://… (SharePoint link)" className={`flex-[2] min-w-[160px] text-xs p-1.5 border rounded-lg bg-white ${url && !okUrl ? 'border-red-300' : 'border-slate-300'}`}/>
                            <select value={lang} onChange={e => setLang(e.target.value)} className="text-xs p-1.5 border border-slate-300 rounded-lg bg-white">{['EN', 'NL', 'ES', 'DE', 'FR'].map(l => <option key={l}>{l}</option>)}</select>
                            {typeName && <select value={forAll ? 'all' : 'type'} onChange={e => setForAll(e.target.value === 'all')} className="text-xs p-1.5 border border-slate-300 rounded-lg bg-white" title="Which packaging's package this document belongs to"><option value="type">{typeName} only</option><option value="all">All packaging</option></select>}
                            <button disabled={!name.trim() || !okUrl} onClick={() => { onAdd(sec.id, name, url, lang, forAll); setName(''); setUrl(''); }} className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1.5 rounded-lg bg-[#084BCD] text-white disabled:opacity-30"><Plus size={12} className="inline -mt-px"/> Add</button>
                        </div>
                    )}
                </div>
            );
        };

        // The overview shown over the dashboard in a frame of its own. It used to
        // open as a pop-up from a blob address, which browsers do not reliably
        // allow — nothing appeared, and window.open(…, 'noopener') returns null by
        // design, so the page even claimed a pop-up blocker every time. A frame
        // cannot be blocked; it prints on its own (Print = save as PDF) and the
        // same document downloads as a file.
        const CommercialOverviewModal = ({ doc, onClose }) => {
            const frameRef = useRef(null);
            const print = () => { const w = frameRef.current && frameRef.current.contentWindow; if (w) { w.focus(); w.print(); } };
            const download = () => {
                const url = URL.createObjectURL(new Blob([doc.html], { type: 'text/html' }));
                const a = document.createElement('a'); a.href = url; a.download = doc.fileName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            };
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);
            return (
                <div className="fixed inset-0 z-[200] bg-slate-900/70 backdrop-blur-sm flex flex-col p-3 md:p-6" role="dialog" aria-label="Commercial overview">
                    <div className="bg-white rounded-t-xl border-b border-slate-200 px-4 py-3 flex flex-wrap items-center gap-2">
                        <FileText size={16} className="text-[#084BCD]"/>
                        <span className="font-spartan font-bold text-sm text-slate-900 mr-auto truncate">{doc.fileName}</span>
                        <button onClick={print} className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest bg-[#084BCD] text-white px-3 py-2 rounded-lg hover:opacity-90"><FileCheck size={14}/> Print / save as PDF</button>
                        <button onClick={download} className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest border border-slate-300 text-slate-700 px-3 py-2 rounded-lg hover:bg-slate-50"><Download size={14}/> Download</button>
                        <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-lg" title="Close (Esc)"><X size={16}/></button>
                    </div>
                    <iframe ref={frameRef} srcDoc={doc.html} title="Commercial overview" className="flex-1 w-full bg-white rounded-b-xl border-0"/>
                </div>
            );
        };

        // The client-facing "Commercial overview": a standalone, printable page in
        // the PerfoTec house style (brand v2.0 — Montserrat, #008837 / #084BCD,
        // 8–12 px radii, the full logo lockup). Built ONLY from approved claims and

        const PackPredictiveChart = ({ taskData, match, respSlope, q10, type, ...filmOpts }) => {

                <div className="mt-6 pt-4 border-t border-slate-200">

                        <span className={`text-[10px] font-bold px-2 py-1 rounded ${curve.source === 'respiration' ? 'text-blue-700 bg-blue-100' : 'text-amber-700 bg-amber-50'}`}>Q₁₀ {curve.q10.toFixed(2)} from {curve.source === 'respiration' ? 'the respiration curve' : curve.source === 'sheet' ? 'the product sheet' : 'a typical value'}</span>

        // The complete schema of one trial row, as stored under

        const TRIAL_ROW_FIELDS = [

            'role', 'round',
            // What the report said at the last import (board-db applyReportToProduct):
            // a re-import follows the report's changes, not over hand corrections.
            'src',
        ];

        // Reference or PerfoTec variant. Blank = automatic: read from the name
        // ("Control", "testigo", "standard", ...) by PerfoTecBoard.trialRowRole.
        // Used to mark the reference and for the gain over it; a reference still
        // competes for best practice (a standard film perforated well is a
        // PerfoTec result too).
        const TrialRoleSelect = ({ value, material, disabled, onChange, className }) => {
            const B = window.PerfoTecBoard;
            const auto = B && B.trialRowRole ? B.trialRowRole({ pack_opt_0_material: material || '' }, 0) : 'perfotec';
            const shown = value || auto;
            return (

                    title={value ? 'Set by hand (or in the report tool)' : 'Automatic, from the name'}
                    className={`${className || ''} ${shown === 'reference' ? 'text-slate-500' : 'text-[#008837]'}`}>

        // A product record as the screens expect it. A hand-edited or half-synced
        // file (no name, a list where an object belongs) stopped the whole
        // dashboard at the first .toLowerCase(). Only the copy in memory is
        // shaped; the file stays as it is until someone edits the product.
        const normalizeProductRecord = (r) => {
            if (!r || typeof r !== 'object' || Array.isArray(r) || !r.id) return null;
            const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
            const fd = isObj(r.formData) ? { ...r.formData } : {};
            Object.keys(fd).forEach(k => { if (fd[k] == null) fd[k] = {}; });
            return {
                ...r,
                name: String(r.name || r.id),
                variety: r.variety == null ? '' : String(r.variety),
                state: /process|cut/i.test(String(r.state || '')) ? 'processed' : 'whole',
                targets: Array.isArray(r.targets) ? r.targets.filter(t => typeof t === 'string') : [],
                aliases: Array.isArray(r.aliases) ? r.aliases.filter(a => typeof a === 'string') : [],
                completedTaskIds: Array.isArray(r.completedTaskIds) ? r.completedTaskIds : [],
                links: isObj(r.links) ? r.links : {},
                imageUrl: typeof r.imageUrl === 'string' ? r.imageUrl : '',
                formData: fd,
            };
        };

        // How many rows the trial table holds (PerfoTecBoard.trialRowCount): a
        // hand-typed first row never set packOptCount, so "packOptCount || 0"
        // called a filled table empty. An import then wrote its first trial
        // over that row, and the row could not be deleted.
        const trialRowCountOf = (master) => {
            const B = window.PerfoTecBoard;
            return B && B.trialRowCount ? B.trialRowCount(master || {}) : (parseInt((master || {}).packOptCount) || 0);
        };

        /* ── ALTERNATIVE PRODUCT NAMES ────────────────────────────────────────
         * One product, several names in the trade: Romano Beans is also Flat
         * Beans and Italian Green Beans. Each product record carries an
         * `aliases` list, and everything that SEARCHES — the header search, the
         * product picker, the forms in the workflow — searches those names too.
         * Nothing DISPLAYS them in place of the product: the main name is what
         * every heading, table and document keeps saying.
         * ------------------------------------------------------------------ */
        const normProductName = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

        // Trimmed, no blanks, no duplicates, never a repeat of the main name.
        const cleanAliases = (list, ownName) => {
            const seen = new Set();
            const own = normProductName(ownName);
            if (own) seen.add(own);
            return (Array.isArray(list) ? list : []).map(a => String(a || '').trim()).filter(a => {
                const k = normProductName(a);
                if (!k || seen.has(k)) return false;
                seen.add(k);
                return true;
            });
        };

        const aliasesOf = (p) => cleanAliases(p && p.aliases, p && p.name);

        // Every name a product answers to, main name first.
        const productNames = (p) => [(p && p.name) || ''].concat(aliasesOf(p)).filter(Boolean);

        // Words of a name, accents off and English plurals folded (berries →
        // berry, peaches → peach, grapes → grape), for matching imported names.
        const nameStems = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .split(/[^a-z0-9]+/).filter(Boolean)
            .map(w => w.length > 3 && /ies$/.test(w) ? w.slice(0, -3) + 'y'
                : w.length > 3 && /(ch|sh|x|ss|o)es$/.test(w) ? w.slice(0, -2)
                : w.length > 3 && /[^s]s$/.test(w) ? w.slice(0, -1) : w);
        // Whether `text` names product `p`: every word of its name, or of one of
        // its alternative names, is in the text as a whole word. Substrings never
        // count: an import for "Pineapple" was offered (and written) to "Apple".
        const namesProduct = (p, text) => {
            const words = new Set(nameStems(text));
            return productNames(p).some(n => { const st = nameStems(n); return st.length > 0 && st.every(w => words.has(w)); });
        };
        // The product an imported name belongs to: whole-word name match, same
        // state, the same variety first, then the most specific name.
        const bestProductMatch = (list, name, variety, state) => {
            let best = null, bestScore = -1;
            (list || []).forEach(p => {
                if (!p || p.isAverage || (state && p.state && p.state !== state)) return;
                if (!namesProduct(p, name + ' ' + (variety || ''))) return;
                const sameVariety = !!variety && !!p.variety && normProductName(p.variety) === normProductName(variety);
                const score = nameStems(p.name).length + (sameVariety ? 100 : 0) + (!variety && !p.variety ? 50 : 0);
                if (score > bestScore) { best = p; bestScore = score; }
            });
            return best;
        };

        // Which alternative name did this search text hit? '' when the main name
        // matched, so a caller can show "also known as …" only when it helps.
        const aliasHit = (query, p) => {
            const q = String(query || '').toLowerCase().trim();
            if (!q || normProductName(p && p.name).includes(normProductName(q))) return '';
            return aliasesOf(p).find(a => a.toLowerCase().includes(q)) || '';
        };

        // The chips editor for those names. Each name is its own chip rather than
        // one comma-separated string, so a name that legitimately contains a
        // comma survives and there is nothing to parse. Commits on Enter, comma
        // or blur; the typed text is never left hanging unsaved.
        const AliasEditor = ({ names, mainName, disabled, onChange }) => {
            const [draft, setDraft] = useState('');
            const list = names || [];

            const commit = () => {
                const typed = draft.trim();
                setDraft('');
                if (!typed) return;
                const next = cleanAliases(list.concat([typed]), mainName);
                if (next.length !== list.length) onChange(next);
            };
            const remove = (name) => onChange(list.filter(a => a !== name));

            if (disabled) {
                return <span className="block p-2 text-[11px] text-slate-400">{list.join(' · ') || '—'}</span>;
            }
            return (
                <div className="flex flex-wrap items-center gap-1 p-1.5">
                    {list.map(a => (
                        <span key={a} className="inline-flex items-center gap-1 pl-2 pr-1 py-0.5 bg-slate-100 border border-slate-200 rounded-full text-[11px] font-medium text-slate-700">
                            {a}
                            <button onClick={() => remove(a)} className="text-slate-400 hover:text-red-600 transition-colors" title={`Remove "${a}"`}><X size={11}/></button>
                        </span>
                    ))}
                    <input
                        type="text"
                        value={draft}
                        onChange={e => {
                            // A typed comma ends a name — the way people write lists.
                            if (e.target.value.includes(',')) {
                                const parts = e.target.value.split(',');
                                setDraft(parts.pop());
                                const next = cleanAliases(list.concat(parts), mainName);
                                if (next.length !== list.length) onChange(next);
                                return;
                            }
                            setDraft(e.target.value);
                        }}
                        onKeyDown={e => {
                            if (e.key === 'Enter') { e.preventDefault(); commit(); }
                            if (e.key === 'Backspace' && !draft && list.length) remove(list[list.length - 1]);
                        }}
                        onBlur={commit}
                        placeholder={list.length ? '+ name' : '+ other name'}
                        className="flex-1 min-w-[80px] px-1 py-0.5 text-[11px] bg-transparent outline-none focus:bg-blue-50 rounded placeholder-slate-300"
                    />
                </div>
            );
        };

            const [overviewDoc, setOverviewDoc] = useState(null); // { html, fileName } shown over the page
            const [commercialMsg, setCommercialMsg] = useState('');
            const [showGlobalSearch, setShowGlobalSearch] = useState(false); // header search overlay

            const [globalSearch, setGlobalSearch] = useState('');

            // ── Product overview (the masthead's "Product Overview"): every
            // product's best result for one packaging, per temperature group of
            // 5 °C and pack size (board-db trialBestPractice) — the commercial
            // status of the whole range on one page. Built only while it is open,

            // The masthead's cross-product pages: null (the product view), 'overview'
            // or 'database' (Luke 2026-11-05: the database spans every product, so it

            const [audience, setAudience] = useState(readAudience);
            const [showAudience, setShowAudience] = useState(false);

            const [bpType, setBpType] = useState(() => ['Punnet', 'Flowpack', 'Crate/Box', 'Pallet'].includes(urlParam('pack')) ? urlParam('pack') : 'Flowpack');
            const [bpSort, setBpSort] = useState({ col: 'product', dir: 'asc' });
            const [bpFilter, setBpFilter] = useState(() => ({ product: urlParam('fp') || '', temp: urlParam('ft') != null && urlParam('ft') !== '' && isFinite(Number(urlParam('ft'))) ? Number(urlParam('ft')) : '', status: ['ready', 'verify'].includes(urlParam('fs')) ? urlParam('fs') : 'all', days: Number(urlParam('fd')) || 0 }));
            // Picking a product (here or in the header picker) goes to that product.
            // (Not the first product the dashboard selects by itself on loading.)
            const pickedProductRef = useRef(null);
            useEffect(() => {
                const first = pickedProductRef.current == null;

                if (!first) setGlobalPage(null);
            }, [activeProductId]);
            const bestPracticeRows = useMemo(() => {
                if (!showOverview) return null;
                const B = window.PerfoTecBoard;
                if (!B || !B.trialBestPractice) return { rows: [], without: [] };
                const films = filmReg ? filmReg.films : [];
                const rows = [], without = [];
                products.filter(p => p && !p.isAverage).forEach(p => {
                    const pm = (p.formData && p.formData['p2-pack-master']) || {};
                    const bp = B.trialBestPractice(pm, { type: bpType });
                    const found = bestPerTempAndSize(bp.groups);
                    const released = /^MARKET/.test(String(p.formData?.['p4-confirm-1']?.gate4Decision || '')) || /^RELEASED/.test(String(p.formData?.['p5-blueprint-1']?.gate5Decision || ''));
                    if (!found.length) { without.push({ ...p, trialsOfType: bp.rows.length }); return; }
                    found.forEach(g => {
                        const w = g.winner;
                        const num = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; };
                        const film = films.find(f => f.id === w.film);
                        rows.push({
                            key: `${p.id}|${g.key}`, productId: p.id, product: p.name || '', state: p.state, variety: w.variety || p.variety || '',
                            condition: w.condition, role: w.role,
                            temp: w.temp, tempGroup: g.tempBand, sizeKg: g.size ? g.size.minKg : null, size: g.size, weightKg: w.weightKg || null,
                            tv: B.plausibleTv ? B.plausibleTv(w.trans) : num(w.trans), rawTv: w.trans,
                            o2: num(w.o2), co2: num(w.co2), material: w.material || '', film: film ? film.name : '', filmOwn: !!(film && film.own),
                            perf: w.perf || '', flush: w.flush || '', startO2: w.startO2 || '', startCO2: w.startCO2 || '', released,
                            days: w.shelfLife.days, open: !!w.shelfLife.open, proven: g.proven, rounds: g.rounds, date: w.date,
                            belowDay: w.shelfLife.belowDay != null ? w.shelfLife.belowDay : null, belowScore: w.shelfLife.belowScore != null ? w.shelfLife.belowScore : null,
                            project: w.project || '', pdf: w.pdf || '',
