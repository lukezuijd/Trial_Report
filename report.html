<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerfoTec Official Report Tool</title>
    <meta name="description" content="PerfoTec Official Report Tool — Process trial data into professional reports with charts and conclusions.">
    <meta name="author" content="PerfoTec B.V.">
    <meta name="theme-color" content="#008837">

    <!-- Preconnect speeds up the Google Fonts waterfall so Montserrat is
         ready before the user clicks Download PDF. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Eagerly load Montserrat so the browser has the font cached before print -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">

    <!-- Tailwind CSS. An exact version: the bare URL follows whatever the Play
         CDN serves next, and the whole report layout (and the PDF) depends
         on it. 3.4.17 is what the bare URL served when this was pinned. -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- PerfoTec Brand 2.0 palette, type and radii for Tailwind. Must load
         AFTER the Play CDN, which is what defines the global `tailwind`. -->
    <script src="brand.js?v=e549b527"></script>

    <!-- Babel compiler for in-browser React (JSX) -->
    <!-- Pinned to an exact Babel 7. v8 (released 2026-05) changed React preset's
         default runtime to "automatic", which emits `import "react/jsx-runtime"`
         — a bare specifier the browser cannot resolve, breaking ESM imports.
         "@7" alone still followed every new 7.x release; 7.29.10 is what it
         served when this was pinned. -->
    <script src="https://unpkg.com/@babel/standalone@7.29.10/babel.min.js"></script>

    <!-- LOAD CENTRAL STYLING & CONFIGURATION -->
    <link rel="stylesheet" href="style.css?v=df20be12">
    <script src="config.js?v=7b34913e"></script>
    <!-- This page renders its own Board button in the header, so the shared
         floating bar that board-db.js injects would be a second, redundant way
         back. Pages WITHOUT a header button (the Product Dashboard) still get it. -->
    <script>window.PERFOTEC_NO_BACK_BUTTON = true;</script>
    <script src="board-db.js?v=00b92723"></script>
    <script src="product-tools.js?v=5916a60f"></script>
</head>
<body class="bg-slate-50 text-slate-700 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root">
        <div class="pf-loading" role="status">
            Loading the report tool…
            <span class="pf-loading-note">If this stays put, check that style.css and config.js sit in the same folder.</span>
        </div>
    </div>
    <script>
        // The tool loads React, Babel and Tailwind from the internet. When one of
        // them fails (offline, a firewall, a CDN outage) the page used to sit on
        // "Loading…" with a hint about local files. Record what failed and, if
        // the editor has not started after 25 s, say so plainly.
        (function () {
            var failed = [];
            window.addEventListener('error', function (e) {
                var t = e && e.target;
                if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href);
                else if (e && e.message) failed.push(e.message);
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                failed.push(String((e && e.reason && (e.reason.message || e.reason)) || 'unknown error'));
            });
            setTimeout(function () {
                if (window.__reportMounted) return;
                var note = document.querySelector('.pf-loading-note');
                if (!note) return;
                note.textContent = 'The report tool did not start. It needs an internet connection to load its parts '
                    + '(cdn.tailwindcss.com, unpkg.com, esm.sh). Check the connection and reload the page.'
                    + (failed.length ? ' Failed: ' + failed.slice(0, 4).join(' · ') : '');
            }, 25000);
        })();
    </script>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useRef, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { createPortal } from 'https://esm.sh/react-dom@18.2.0';
        
        import { 
          Printer, FileText, Activity, Settings, Layout, MessageSquare, 
          CheckCircle, AlertTriangle, ArrowRight, Copy, Trash2, Plus, 
          Edit3, Scale, X, Upload, Truck, Thermometer, Clock, Camera, 
          ClipboardList, Image as ImageIcon, BarChart2, ChevronRight, 
          Save, Download, FolderOpen, LineChart, Tractor, Ship, Plane, 
          Warehouse, Store, Utensils, Factory, ArrowDown, ArrowUp, ChevronUp, ChevronDown,
          Bold, Italic, Underline, List, FileArchive, Globe, AlertCircle, Building2, Target, Beaker, Package, PackagePlus,
          Check, ChevronLeft
        } from 'https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0';
        // ?deps: lucide-react asks for react@^18.3.1, which loaded a second React
        // next to the app's 18.2.0. Pinned to the app's own React.

        // --- BRAND CONFIGURATION ---
        const globalConfig = window.PERFOTEC_CONFIG || {};

        // Rich text is rendered through dangerouslySetInnerHTML below, which does
        // no sanitising of its own: React just assigns innerHTML on a live node, so
        // <img src=x onerror=...> and <details open ontoggle=...> execute (verified).
        // Proposal/report JSON sits in a SHARED OneDrive folder, so a payload written
        // there by anyone with access runs in the next colleague-s browser - one that
        // holds a File System Access handle to the whole database folder.
        //
        // Sanitising happens on READ rather than on write, deliberately: the editor
        // stores whatever execCommand produced, and in some browsers that is
        // <span style="font-weight:bold">. Stripping attributes on the way IN would
        // silently drop the user-s bold. On the way out every payload is inert and no
        // formatting the toolbar can make is lost. It also disarms documents that
        // already carry a payload from before this fix.
        // proposal-s Word export reads the RENDERED DOM (#print-content), so it
        // inherits this automatically.
        const cleanRich = (html) => {
          const fn = globalConfig.sanitizeRichText;
          if (fn) return fn.call(globalConfig, html);
          // config.js missing: degrade to plain text rather than to raw markup.
          if (html == null || html === '') return '';
          const d = new DOMParser().parseFromString(String(html), 'text/html');
          return (d.body.textContent || '');
        };

        // Unit conversion helper sourced from config; falls back to identity
        // so the report still functions if config is unavailable.
        const convertValue = globalConfig.convertValue
          ? globalConfig.convertValue.bind(globalConfig)
          : ((value) => value);

        const BRAND = {
          colors: { 
            green: globalConfig.BRAND?.colors?.primary?.green || '#008837', 
            blue: globalConfig.BRAND?.colors?.primary?.blue || '#084BCD', 
            black: globalConfig.BRAND?.colors?.neutral?.black || '#1A1B1F' 
          },
          logos: {
            default: globalConfig.BRAND?.logos?.default || 'https://cdn.prod.website-files.com/68b594c756c22085ddc6c1ea/68b59ba2f027bfeecd25261b_PerfoTec%20logo.png'
          },
          fonts: {
            heading: '"Montserrat", sans-serif',
            body: '"Montserrat", sans-serif'
          }
        };

        const CHART_COLORS = globalConfig.CHART_COLORS || [
          { stroke: '#084BCD', fill: '#F1F6FF', name: 'PerfoTec Blue' },    
          { stroke: '#008837', fill: '#EDF8F2', name: 'PerfoTec Green' },     
          { stroke: '#1A1B1F', fill: '#F2F5F9', name: 'PerfoTec Ink' },   
          { stroke: '#ea580c', fill: '#ffedd5', name: 'Orange' },  
          { stroke: '#5A85E7', fill: '#E0EAFF', name: 'Light Blue Accent' }   
        ];

        // Many variants (30 in one report): a table with a column per variant, or
        // one chart with a line or bar for each, shrank every column to a sliver
        // (names wrapped letter by letter, numbers ran into each other) and
        // repeated each colour six times. So these take at most VARIANTS_PER_BLOCK
        // variants each and continue in the next one below. One per chart colour:
        // a variant's colour is picked by its place in the list (index % colours),
        // so consecutive variants in one block never share a colour and each keeps
        // the colour it has everywhere else in the report.
        const VARIANTS_PER_BLOCK = Math.max(1, CHART_COLORS.length);
        const chunkVariants = (list) => {
          const out = [];
          for (let i = 0; i < (list || []).length; i += VARIANTS_PER_BLOCK) out.push(list.slice(i, i + VARIANTS_PER_BLOCK));
          return out.length ? out : [[]];
        };
        const variantsRange = (blockIdx, block, total) =>
          `Variants ${blockIdx * VARIANTS_PER_BLOCK + 1}–${blockIdx * VARIANTS_PER_BLOCK + block.length} of ${total}`;

        // i18n arrays are the single source; flat arrays are derived from them
        // so option order and content stay in sync across all tools.
        const PACKAGING_TYPES_I18N = globalConfig.PACKAGING_TYPES_I18N || [];
        const TRANSPORT_MODES_I18N = globalConfig.TRANSPORT_MODES_I18N || [];
        const DEFAULT_CRITERIA_I18N = globalConfig.DEFAULT_CRITERIA_I18N || [];
        const PERFOTEC_TECHNOLOGIES_I18N = globalConfig.PERFOTEC_TECHNOLOGIES_I18N || [];
        const PACKAGING_TYPES = PACKAGING_TYPES_I18N.map(x => x.value);
        const TRANSPORT_MODES = TRANSPORT_MODES_I18N.map(x => x.value);
        // i18n label lookup — sourced from config (v2.1); local fallback returns value.
        const getI18nLabel = globalConfig.getI18nLabel
          ? globalConfig.getI18nLabel.bind(globalConfig)
          : ((arr, value) => value);

        const DEFAULT_CRITERIA = DEFAULT_CRITERIA_I18N.map(x => x.value);
        const PERFOTEC_TECHNOLOGIES = PERFOTEC_TECHNOLOGIES_I18N.map(x => x.value);

        const DEFAULT_SUPPLY_CHAIN = globalConfig.DEFAULT_SUPPLY_CHAIN || [
          { stage: 'Farm / Harvest', tempStart: '15', tempEnd: '', daysStart: '0.5', daysEnd: '', action: 'none' },
          { stage: 'Packing House', tempStart: '12', tempEnd: '', daysStart: '1', daysEnd: '', action: 'pack' },
          { stage: 'Transport by road', tempStart: '6', tempEnd: '', daysStart: '2', daysEnd: '', action: 'none' },
          { stage: 'Importer / Processor', tempStart: '8', tempEnd: '', daysStart: '1', daysEnd: '', action: 'none' },
          { stage: 'Retail Store', tempStart: '18', tempEnd: '', daysStart: '4', daysEnd: '', action: 'none' },
          { stage: 'Consumer (Open Pack)', tempStart: '20', tempEnd: '', daysStart: '2', daysEnd: '', action: 'unpack' }
        ];

        // The supply-chain transport step is recognised by its stage label
        // (any language), never by its position — so it can be moved, renamed
        // via the dropdown, or removed like any other step.
        const TRANSPORT_STAGE_LABELS = ['transport', 'transporte', 'transport by road', 'road transport', 'wegtransport', 'transporte terrestre', 'seafreight', 'sea freight', 'zeevracht', 'transporte marítimo', 'airfreight', 'air freight', 'luchtvracht', 'transporte aéreo', 'storage', 'opslag', 'almacenamiento'];
        const isTransportStage = (stage) => TRANSPORT_STAGE_LABELS.includes((stage || '').trim().toLowerCase());

        const SCORES = globalConfig.SCORES || [
          [10, 'excellent – exceptionally appealing quality, exceptional good'],
          [9, 'very good – natural quality of the product, full strong characteristic quality attributes'],
          [8, 'good – natural quality, with few specimens with slightly light impairment'],
          [7, 'commendable – natural quality, with several specimens with light impairment'],
          [6, 'satisfactory – slightly reduced quality attributes'],
          [5, 'unacceptable – impairment of natural quality attributes'],
          [4, 'beyond unacceptable – clear impairment of quality attributes'],
          [3, 'poor – generally severe loss of quality, no longer appealing'],
          [2, 'bad – strong and severe quality loss, strongly unpleasant'],
          [1, 'very bad – complete quality decay, spoiled and repulsive']
        ];
        
        const MINI_SCORES = globalConfig.MINI_SCORES || [
          [10, 'Excellent', 'text-green-700'], [8, 'Good', 'text-green-600'],
          [6, 'Satisfactory', 'text-yellow-600'], [4, 'Unacceptable', 'text-red-600'], [1, 'Very Bad', 'text-red-800']
        ];

        // --- HELPER CLASSES ---
        const inputClass = (globalConfig.UI_CLASSES && globalConfig.UI_CLASSES.input) || "w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm transition-all hover:bg-slate-100 focus:bg-white";
        const narrowInputClass = "w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block py-2.5 px-1 text-center shadow-sm transition-all hover:bg-slate-100 focus:bg-white [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none [-moz-appearance:textfield] min-w-0";
        const labelClass = (globalConfig.UI_CLASSES && globalConfig.UI_CLASSES.label) || "block mb-2 text-xs font-bold tracking-wide text-slate-600 uppercase";

        // --- HELPER FUNCTIONS ---
        // One measured value, or NaN if there is nothing usable there.
        //
        // The measurement inputs are type="number", so the browser already turns
        // a comma, a space or letters into "" before it reaches state. Values
        // that skip that path — an imported report JSON, a hand-edited file, a
        // round-trip that wrote null for an unmeasured sample — do not get that
        // protection, which is what this guards.
        //
        // Number() rather than parseFloat(): parseFloat("5,5") returns 5 and
        // would quietly count a comma-typed 5.5 as 5. Number("5,5") is NaN, so
        // such a value is left out instead of silently altering the average —
        // the same thing that happened before this change.
        // A decimal comma (an imported "245,5") is a decimal point: parseFloat
        // read it as 245, Number() as nothing.
        const sampleNumber = (v) => {
          if (v === null || v === undefined) return NaN;
          const s = String(v).trim().replace(/^(-?\d*),(\d+)$/, '$1.$2');
          if (s === '') return NaN;
          return Number(s);
        };

        const getAverage = (samples, key) => {
          if (!samples || samples.length === 0) return 0;
          // Filter on the PARSED value. The old test was
          // `s[key] !== '' && !isNaN(s[key])`, and both isNaN(null) and
          // isNaN(' ') are false — so a null or whitespace cell passed the
          // filter and then turned the sum into NaN at parseFloat. A single
          // such sample printed the average as the literal text "NaN" in a
          // customer-facing report.
          const values = samples.map(s => sampleNumber(s[key])).filter(n => !isNaN(n));
          if (values.length === 0) return 0;
          const sum = values.reduce((acc, n) => acc + n, 0);
          // Still a string with one decimal: the reports show "4.0", and
          // returning a bare number would drop that decimal everywhere.
          // round1, like the quality scores: toFixed alone shows avg(0, 0.7) as
          // "0.3" and avg(1.4, 1.5) as "1.4" (binary halves round down).
          return round1(sum / values.length).toFixed(1);
        };

        // A day's average of one gas, or null when that gas was not measured
        // that day (a day with only weights or quality scores). getAverage
        // answers 0 for "nothing entered", which a chart would plot as a real
        // 0% reading.
        // A gas can be neither below 0 % nor above 100 % of the air in a pack, and
        // O₂ and CO₂ together cannot pass 100 % either: such a reading is a typing
        // error, not a measurement. Returns what is wrong with one sample, or null.
        const GAS_MAX = 100;
        const gasSampleIssue = (smp) => {
          const o2 = sampleNumber(smp && smp.o2), co2 = sampleNumber(smp && smp.co2);
          if (!isNaN(o2) && (o2 < 0 || o2 > GAS_MAX)) return 'o2';
          if (!isNaN(co2) && (co2 < 0 || co2 > GAS_MAX)) return 'co2';
          if (!isNaN(o2) && !isNaN(co2) && o2 + co2 > GAS_MAX) return 'sum';
          return null;
        };
        // Top of a gas chart's %-axis. 25 % while everything fits — the usual
        // case, and the scale these charts always had — otherwise the next round
        // step above the highest value, and never past 100 %.
        const gasAxisMax = (values) => {
          const top = Math.max(0, ...(values || []).filter(v => isFinite(v)));
          if (top <= 25) return 25;
          if (top <= 50) return Math.ceil(top / 10) * 10;
          return Math.min(GAS_MAX, Math.ceil(top / 20) * 20);
        };
        const gasAxisTicks = (max) => {
          const step = max <= 25 ? 5 : max <= 50 ? 10 : 20;
          const out = [];
          for (let v = 0; v <= max + 1e-9; v += step) out.push(v);
          return out;
        };

        const gasReading = (samples, key) =>
          (samples || []).some(s => !isNaN(sampleNumber(s[key]))) ? getAverage(samples, key) : null;

        // Round to one decimal without floating-point noise. 0.25+0.5+0.2+0.6
        // is 1.5499999999999998 in binary; read as the 1.55 it is, it rounds to
        // 1.6 instead of 1.5 (toPrecision(12) drops the noise before rounding).
        const round1 = (n) => Math.round(Number((n * 10).toPrecision(12))) / 10;

        // Last day on a chart's time axis: the last measured day. It used to run
        // on to the planned length of the test, so a 15-day test measured until
        // P+10 drew every chart with an empty P+10..P+15 (October 2026); before
        // that a 5-day floor squeezed a 2-day trial into the left 40%.
        const axisEndDay = (dataDays) => {
          const end = Math.max(0, ...(dataDays || []).filter(d => isFinite(d)));
          return end > 0 ? end : 1;
        };

        // Quality of one measurement day. The rule lives in board-db.js
        // (measurementQuality) because the dashboard's trial import applies it
        // too: the mean of the criterion scores entered via the pencil, one
        // decimal, blank criteria not counted, and nothing when evaluation is
        // switched off for that day. A row from before this rule can instead
        // carry the overall score picked in the former per-row dropdown (or
        // brought in by an import); that comes back with `legacy: true`.
        // Returns { value, legacy, count } or null.
        const measQuality = (m) => {
          const B = window.PerfoTecBoard;
          return B && B.measurementQuality ? B.measurementQuality(m) : null;
        };
        // "6.1", or '' when there is none — the shape `quality` is exported in.
        const qualityValue = (m) => { const q = measQuality(m); return q ? q.value.toFixed(1) : ''; };

        // ---- Units: stored metric, shown in the chosen system ------------------
        // Every value is stored in metric (mm, or cm for bulk packaging; g, or kg
        // for bulk; °C). Imperial changes only what a field shows and what the
        // report prints. The old toggle rewrote the stored values (rounded to two
        // decimals, so switching back and forth turned 150 mm into 150.11),
        // skipped the net weight and the sample weights, and left °C and mm
        // labels on converted numbers.
        const isNumStr = (v) => v !== '' && v !== null && v !== undefined && !isNaN(parseFloat(v));
        const shownValue = (v, kind, bulk, sys) => sys === 'imperial' && isNumStr(v) ? convertValue(v, kind, !!bulk, true) : (v == null ? '' : v);
        const metricValue = (v, kind, bulk, sys) => sys === 'imperial' && isNumStr(v) ? convertValue(v, kind, !!bulk, false) : v;
        const unitOf = (kind, bulk, sys) => (globalConfig.getUnitLabel && globalConfig.getUnitLabel(kind, sys, !!bulk))
          || ({ length: bulk ? 'cm' : 'mm', weight: bulk ? 'kg' : 'g', temp: '°C' })[kind] || '';
        // "Wt. (g)" → "Wt. (oz)": the unit in a label follows the chosen system.
        const withUnit = (label, unit) => String(label || '').replace(/\((g|kg|mm|cm|°C)\)/, '(' + unit + ')');
        const isBulkPack = (type) => type === 'Cube crate' || type === 'Pallet';

        // A criterion score is 1..10 (a decimal comma is fine). Anything else is
        // left out of the average, so it must not be saved or exported unnoticed.
        const scoreIsOutOfRange = (v) => { const t = String(v == null ? '' : v).trim().replace(',', '.'); if (!t) return false; const n = Number(t); return !(isFinite(n) && n >= 1 && n <= 10); };

        // Notes the tool itself used to write into new rows: labels, not
        // observations. Never evidence that a day was measured, never shown to
        // the client as "the observation".
        const SEED_NOTES = new Set(['Start', 'Start (Round 2)', 'End Packing', 'Retail Simulation (Open)']);
        const ownNote = (n) => { const t = String(n == null ? '' : n).trim(); return SEED_NOTES.has(t) ? '' : t; };
        // Does a measurement row hold anything somebody entered? Planned criteria
        // with empty scores, the ambient P+0 seed and label notes do not count.
        const measurementHasData = (m) => {
          if (!m) return false;
          if (Array.isArray(m.images) && m.images.length) return true;
          if (ownNote(m.notes)) return true;
          if (Array.isArray(m.qualityParams) && m.qualityParams.some(q => q &&
              (String(q.score == null ? '' : q.score).trim() !== '' || String(q.notes == null ? '' : q.notes).trim() !== ''))) return true;
          return (m.samples || []).some(s => {
            if (!s) return false;
            const v = (k) => String(s[k] == null ? '' : s[k]).trim();
            if (parseFloat(m.day) === 0 && v('o2') === '20.9' && v('co2') === '0.03' && !v('weight') && !v('initialWeight')) return false;
            return (v('weight') && parseFloat(v('weight')) > 0) || (v('initialWeight') && parseFloat(v('initialWeight')) > 0) ||
              (v('o2') && parseFloat(v('o2')) !== 0) || (v('co2') && parseFloat(v('co2')) !== 0);
          });
        };

        // ---- Anonymised report --------------------------------------------------
        // A copy of the report data with the client taken out, for a version that
        // can be shared commercially. Only the PREVIEW gets this copy — and the
        // PDF and the Word file are both built from the preview — so the saved
        // report keeps every client detail and nothing downstream changes.
        //   * company, address, website, contacts and logo: emptied;
        //   * every mention of the client in free text (title, conclusions, notes,
        //     captions, variant and stage names...) replaced by an alias. Looked
        //     for: the company name, its distinctive words ("Trent" out of "Trent
        //     Hypermarket Private Limited"), contact names, e-mail addresses, phone
        //     numbers, the website and e-mail domain, street and postcode, and any
        //     extra words the user adds — a trade name the text uses, say;
        //   * the trial location, unless the user keeps it.
        // Words of the product, its variety and origin and the client's city and
        // country are never treated as the client: "Acme Rose Farms" is replaced as a
        // whole in a rose trial, but "rose" on its own is not.
        // Photos cannot be checked by code; the editor lists them for a look by eye.
        const ANON_LEGAL = new Set(['bv', 'b.v', 'nv', 'n.v', 'ltd', 'limited', 'private', 'pvt', 'inc', 'llc', 'llp', 'gmbh', 'sa', 's.a', 'sac', 's.a.c', 'srl', 'sl', 'spa', 'ag', 'co', 'corp', 'plc', 'pty', 'bvba', 'vof']);
        const ANON_GENERIC = new Set(['the', 'and', 'of', 'de', 'van', 'der', 'den', 'het', 'en', 'y', 'la', 'el', 'los', 'las', 'company', 'corporation', 'group', 'holding', 'holdings', 'international', 'intl', 'trading', 'fresh', 'fruit', 'fruits', 'food', 'foods', 'farm', 'farms', 'produce', 'export', 'exports', 'import', 'imports', 'agro', 'global', 'retail', 'market', 'markets', 'supermarket', 'supermarkets', 'hypermarket', 'distribution', 'logistics', 'packaging', 'industries', 'enterprises', 'solutions', 'services', 'partners', 'brothers', 'bros', 'sons', 'products', 'growers', 'nursery', 'kwekerij']);
        const ANON_MAIL_HOSTS = new Set(['gmail', 'googlemail', 'hotmail', 'outlook', 'live', 'yahoo', 'icloud', 'me', 'msn', 'proton', 'protonmail', 'aol', 'gmx', 'ziggo', 'kpnmail', 'planet', 'home']);
        const ANON_IMAGE_KEYS = new Set(['url', 'logo', 'clientLogo', 'coverImage', 'startImage', 'predictedImage', 'imageUrl', 'image', 'photo', 'temperatureImages', 'images']);
        // Never scrubbed: codes and enum values, and every measured number. A
        // client postcode of "1000" turned a 1000 g sample into "Client" and took
        // it out of the weight loss. ('packaging' is scrubbed: an imported
        // report can carry free text there.)
        const ANON_FIXED_KEYS = new Set(['id', 'action', 'category', 'atmosphereStrategy', 'role', 'processingType', 'packagingType', 'evaluate', 'measure', 'open', 'score', 'productId',
          'day', 'o2', 'co2', 'weight', 'initialWeight', 'startWeight', 'length', 'width', 'height', 'holes', 'holeSize', 'sampleCount', 'filmThickness',
          'tempStart', 'tempEnd', 'daysStart', 'daysEnd', 'quality', 'legacyQuality', 'originalQuality', 'rrO2', 'rrCO2', 'rrTemp',
          'totalDuration', 'retailOpenDays', 'packingDate', 'date', 'auto', 'round', 'verificationOf', 'w', 'h', 'bytes', 'x', 'y']);
        // Words of a place name that say nothing about which place it is.
        const ANON_PLACE_GENERIC = new Set(['dc', 'warehouse', 'storage', 'store', 'depot', 'hub', 'centre', 'center', 'port', 'airport', 'terminal', 'cold', 'site', 'plant', 'facility', 'unit', 'area', 'zone', 'park', 'north', 'south', 'east', 'west', 'city', 'district', 'region', 'state', 'province']);
        const ANON_CLIENT_KEYS = ['company', 'street', 'houseNumber', 'addressExtra', 'zipCode', 'city', 'country', 'website', 'contactName', 'contactRole', 'contactEmail', 'contactPhone', 'phone', 'email', 'phoneDirect', 'phoneWork', 'role', 'clientLogo'];

        const anonWords = (s) => String(s || '').split(/[\s,;:()\/|]+/)
          .map(w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean);

        // The strings that identify the client, longest first (a full name must
        // be replaced before its words).
        const anonTerms = (clientInfo, project, opts) => {
          const ci = clientInfo || {}, p = project || {}, o = opts || {};
          const keep = new Set(['perfotec', ...[p.productName, p.type, p.origin, ci.city, ci.country, o.alias]
            .flatMap(anonWords).map(w => w.toLowerCase())]);
          const out = [];
          // Distinctive words left alone because the product, variety, origin or
          // city uses them too ("rose" in a rose trial). Listed in the editor:
          // when such a word IS the client (a brand in the product name, a grower
          // as origin), adding it as an extra word replaces it.
          const kept = [];
          // force: the user's own extra words and the full company name are
          // never vetoed. A short all-digit term (a postcode like "1000") would
          // only rewrite numbers in the texts, so it is skipped.
          const add = (t, force) => {
            t = String(t == null ? '' : t).replace(/\s+/g, ' ').trim();
            if (t.length < 2) return;
            if (/^[\d\s]+$/.test(t) && t.replace(/\s/g, '').length < 6) return;
            if (!force && keep.has(t.toLowerCase())) return;
            if (!out.some(x => x.toLowerCase() === t.toLowerCase())) out.push(t);
          };
          const distinctive = (w) => {
            if (w.length < 3 || /^\d+$/.test(w) || ANON_LEGAL.has(w.toLowerCase().replace(/\.$/, '')) || ANON_GENERIC.has(w.toLowerCase())) return false;
            if (keep.has(w.toLowerCase())) { if (!kept.includes(w)) kept.push(w); return false; }
            return true;
          };
          const stem = (host) => {
            const h = String(host || '').trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/^www\./, '').split(/[\/?#]/)[0];
            const s = h.split('.')[0];
            return h && s.length >= 4 && !ANON_MAIL_HOSTS.has(s) ? [h, s] : [];
          };
          const company = ci.companyName || p.company || '';
          add(company, true);
          const companyWords = anonWords(company).filter(w => !ANON_LEGAL.has(w.toLowerCase().replace(/\.$/, '')));
          add(companyWords.join(' '), true);
          // Without a leading "The", and the initials of a name of three or more
          // words ("The Fresh Produce Company" → "Fresh Produce Company", "FPC").
          const noThe = /^the$/i.test(companyWords[0] || '') ? companyWords.slice(1) : companyWords;
          if (noThe.length !== companyWords.length) add(noThe.join(' '), true);
          // The name without its generic tail ("Rose Valley Farms" → "Rose
          // Valley"), so a text that drops "Farms" is not left as "Rose Client".
          // A single word left over goes through the usual product-word check.
          const core = [...noThe];
          while (core.length > 1 && ANON_GENERIC.has(core[core.length - 1].toLowerCase())) core.pop();
          if (core.length < noThe.length) add(core.join(' '), core.length >= 2);
          [companyWords, noThe].forEach(ws => { if (ws.length >= 3) add(ws.map(w => w.charAt(0).toUpperCase()).join(''), true); });
          anonWords(company).filter(distinctive).forEach(t => add(t));
          [ci.website, p.website].forEach(w => stem(w).forEach(add));
          const people = [
            ...(Array.isArray(ci.contacts) ? ci.contacts : []),
            { name: ci.contactName, email: ci.email, phone: ci.phone, phoneDirect: ci.phoneDirect, phoneWork: ci.phoneWork },
            { name: p.contactName, email: p.contactEmail, phone: p.contactPhone }
          ];
          people.forEach(c => {
            if (!c) return;
            add(c.name);
            anonWords(c.name).filter(distinctive).forEach(add);
            if (c.email) { add(c.email); stem(String(c.email).split('@')[1]).forEach(add); }
            [c.phone, c.phoneDirect, c.phoneWork].forEach(ph => { if (ph && String(ph).replace(/\D/g, '').length >= 6) add(ph); });
          });
          if (String(ci.street || '').trim().length >= 4) { add([ci.street, ci.houseNumber].filter(Boolean).join(' ')); add(ci.street); }
          if (String(ci.zipCode || '').replace(/\s/g, '').length >= 4) add(ci.zipCode);
          String(o.extraTerms || '').split(/[,;\n]+/).forEach(t => add(t, true));
          const sorted = out.sort((a, b) => b.length - a.length);
          sorted.kept = kept.filter(w => !out.some(x => x.toLowerCase() === w.toLowerCase()));
          return sorted;
        };

        // How a term may be written in the texts: any case, with or without
        // accents ("Frutec" for "Frutéc"), a curly or straight apostrophe, a
        // hyphen, a space or nothing between its parts ("Agri Fresh",
        // "AgriFresh"), a possessive ("Bloomfield’s", "Bloomfields") and, in rich
        // text, & written as &amp;.
        const ANON_ACCENTS = { a: 'aàáâãäåāăą', c: 'cçćč', e: 'eèéêëēėęě', i: 'iìíîïīįı', n: 'nñńň', o: 'oòóôõöøō', u: 'uùúûüūůű', y: 'yýÿ', s: 'sśšşß', z: 'zźżž', g: 'gğ', l: 'lł', r: 'rř', d: 'dď', t: 'tť' };
        const anonTermPattern = (t) => {
          const base = String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’‘`]s$/i, '');
          const parts = base.split(/[\s\u00a0\-‐–—]+/).filter(Boolean);
          const piece = (w) => [...w].map(ch => {
            const lc = ch.toLowerCase();
            if (ANON_ACCENTS[lc]) return '[' + ANON_ACCENTS[lc] + ']';
            if (/['’‘`]/.test(ch)) return "['’‘`]";
            if (ch === '&') return '(?:&amp;|&)';
            return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }).join('');
          return parts.map(piece).join('(?:[\\s\\u00a0\\-‐–—]|&nbsp;)*') + "(?:['’]?s)?";
        };
        // Real markup only (what the rich-text editor writes): "O2 < 3% ...
        // CO2 > 15%" in a plain note is text, and was skipped as if it were a tag.
        // (\x3c is "<": written plainly next to ">" it reads as a JSX fragment to
        // publish.mjs's tag balance check.)
        const ANON_TAG = /(<\/?(?:p|div|br|b|strong|i|em|u|s|ul|ol|li|span|h[1-6]|blockquote|sub|sup)\b[^\x3c>]*>)/i;

        // Returns the cleaned copy plus what was found, for the editor's summary.
        const anonymiseReport = ({ clientInfo, project, groups, analysis, supplyChain }, opts) => {
          const o = opts || {};
          const alias = String(o.alias || '').trim() || 'Client';
          const terms = anonTerms(clientInfo, project, o);
          const re = terms.length
            ? new RegExp('(?<![\\p{L}\\p{N}])(?:' + terms.map(anonTermPattern).join('|') + ')(?![\\p{L}\\p{N}])', 'giu')
            : null;
          // With the location hidden, the place goes from the texts as well
          // ("DC Northgate"), removed rather than given the client's alias.
          const pr = project || {}, cl = clientInfo || {};
          const productWords = new Set([pr.productName, pr.type, pr.origin, cl.country].flatMap(anonWords).map(w => w.toLowerCase()));
          // The whole place, each comma-separated part of it ("Northgate DC
          // Riverton, Westshire" → "Westshire") and its distinctive words
          // ("Riverton"): a text rarely repeats the location exactly as typed.
          const placeParts = [pr.testLocation, pr.testLocationTo, cl.city].flatMap(t => {
            const whole = String(t || '').replace(/\s+/g, ' ').trim();
            if (!whole) return [];
            const parts = whole.split(/\s*[,;]\s*/).filter(Boolean);
            const words = anonWords(whole).filter(w => w.length >= 4 && !/^\d+$/.test(w)
              && !ANON_PLACE_GENERIC.has(w.toLowerCase()) && !ANON_GENERIC.has(w.toLowerCase()));
            return [whole, ...parts, ...words];
          });
          const locationTerms = o.hideLocation === false ? [] : [...new Set(placeParts)]
            .filter(t => t.length >= 3 && !productWords.has(t.toLowerCase())).sort((a, b) => b.length - a.length);
          const reLoc = locationTerms.length
            ? new RegExp('(?<![\\p{L}\\p{N}])(?:' + locationTerms.map(anonTermPattern).join('|') + ')(?![\\p{L}\\p{N}])', 'giu')
            : null;
          let hits = 0;
          const areas = new Set();
          // Rich-text fields are HTML: replace in the text between tags only.
          // Texts are compared in composed form (a pasted "é" can be two code
          // points).
          const scrub = (str, area) => {
            if (!re && !reLoc) return str;
            return str.normalize('NFC').split(ANON_TAG).map((part, i) => {
              if (i % 2 === 1) return part;
              let out = re ? part.replace(re, () => { hits++; areas.add(area); return alias; }) : part;
              if (reLoc) {
                let removed = false;
                out = out.replace(reLoc, () => { hits++; areas.add(area); removed = true; return ''; });
                if (removed) out = out.replace(/\(\s*\)/g, '').replace(/[ \t\u00a0]{2,}/g, ' ').replace(/[ \t\u00a0]+([,.;:!?)])/g, '$1');
              }
              return out;
            }).join('');
          };
          // A plain-text field may now end in the space before a removed place.
          const scrubField = (str, area) => { const out = scrub(str, area); return out !== str && !/[><]/.test(out) ? out.trim() : out; };
          const walk = (v, key, area) => {
            if (typeof v === 'string') {
              // Only an actual data URL is skipped: a note that starts with
              // "Data:" is text.
              if (ANON_IMAGE_KEYS.has(key) || ANON_FIXED_KEYS.has(key) || /^data:[a-z]+\/[\w.+-]+[;,]/i.test(v) || /^blob:/i.test(v)) return v;
              return scrubField(v, area);
            }
            if (Array.isArray(v)) return v.map(x => walk(x, key, area));
            if (v && typeof v === 'object') {
              const out = {};
              Object.keys(v).forEach(k => { out[k] = walk(v[k], k, area); });
              return out;
            }
            return v;
          };
          const proj = {};
          Object.keys(project || {}).forEach(k => { proj[k] = walk(project[k], k, 'project.' + k); });
          ANON_CLIENT_KEYS.forEach(k => { if (k in proj) proj[k] = k === 'clientLogo' ? null : ''; });
          if (o.hideLocation !== false) { proj.testLocation = ''; proj.testLocationTo = ''; }
          // The cover's logo slot can hold a co-branded or client logo and is not
          // in the image check: the anonymised version always prints PerfoTec's.
          proj.logo = BRAND.logos.default;
          const an = {};
          Object.keys(analysis || {}).forEach(k => { an[k] = walk(analysis[k], k, 'analysis.' + k); });
          return {
            clientInfo: { companyName: '', street: '', houseNumber: '', addressExtra: '', zipCode: '', city: '', country: '', website: '',
              contactName: '', role: '', email: '', phone: '', phoneDirect: '', phoneWork: '', contacts: [], logo: null },
            project: proj,
            groups: (groups || []).map(g => walk(g, '', 'groups')),
            analysis: an,
            supplyChain: (supplyChain || []).map(s => walk(s, '', 'supplyChain')),
            alias, terms, kept: terms.kept || [], locationTerms, hits, areas: [...areas]
          };
        };

        // ---- Images in the anonymised report --------------------------------
        // Code can scrub text, not pixels: a sticker with the client's name on a
        // box is just part of the photo. So every image the report prints gets a
        // decision by eye in the editor (analysis.anonymise.images): shown, left
        // out, or shown with areas covered. Decisions are keyed by the image's
        // content, so a replaced photo needs a new look and a moved one keeps its
        // own decision.
        const anonImageKeyCache = new Map();
        const anonImageKey = (url) => {
          if (!url || typeof url !== 'string') return '';
          let key = anonImageKeyCache.get(url);
          if (!key) {
            let h = 0x811c9dc5; // FNV-1a over the whole data URL
            for (let i = 0; i < url.length; i++) { h ^= url.charCodeAt(i); h = Math.imul(h, 0x01000193); }
            key = 'img-' + (h >>> 0).toString(36) + '-' + url.length.toString(36);
            if (anonImageKeyCache.size > 500) anonImageKeyCache.clear();
            anonImageKeyCache.set(url, key);
          }
          return key;
        };

        // Every image the printed report can show, in report order. A picture
        // used twice (the start photo doubling as the cover) is one entry.
        const anonImageList = ({ project, groups, analysis }, names = {}) => {
          const out = [], seen = new Set();
          const add = (url, label) => {
            const key = anonImageKey(url);
            if (!key || seen.has(key)) return;
            seen.add(key);
            out.push({ key, url, label });
          };
          const p = project || {};
          add(p.coverImage, names.cover || 'Cover photo');
          add(p.startImage, names.start || 'Picture 1 · P+0');
          (groups || []).forEach(g => (g.measurements || []).forEach(m => (m.images || []).forEach(img =>
            add(typeof img === 'string' ? img : img && img.url, `${g.name || 'Variant'} · P+${m.day}`))));
          // HUB charts print only inside the gas section, for MAP variants, with
          // predictions on: the rule PrintPreview applies (showGas, showAnyHubPrediction).
          // One that does not print needs no look, and swap() empties it anyway.
          const a = analysis || {};
          const mapGroups = (groups || []).filter(g => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP');
          const autoGas = mapGroups.some(g => (g.measurements || []).some(m => parseFloat(m.day) > 0 && (m.samples || []).some(s => s.o2 !== '' && s.o2 !== undefined && s.o2 !== null)));
          const showHub = (a.showGasSection ?? autoGas) && (a.showHubPredictions ?? mapGroups.some(g => !!g.predictedImage));
          if (showHub) mapGroups.forEach(g => add(g.predictedImage, `${names.hub || 'HUB prediction'} · ${g.name || 'Variant'}`));
          getTempImages(analysis).forEach((u, i) => add(u, `${names.temp || 'Temperature logger'} ${i + 1}`));
          return out;
        };

        // Covered areas are burnt into the pixels: a block laid OVER the picture
        // would leave the untouched photo underneath in the PDF and Word file.
        // Drawing through a canvas also re-encodes the image, which drops the
        // camera's metadata (EXIF: GPS position, time, device) on the way.
        const ANON_COVER = '#3F4552';
        // 4096 px is the largest canvas every browser draws (iOS Safari's area
        // limit); a bigger photo is scaled down, the areas are fractions anyway.
        const ANON_MAX_EDGE = 4096;
        const anonRenderImage = async (url, boxes) => {
          const blob = await (await fetch(url)).blob();
          const src = globalConfig.decodeImage ? await globalConfig.decodeImage(blob) : await createImageBitmap(blob);
          const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
          if (!sw || !sh) { if (src.close) src.close(); throw new Error('empty image'); }
          const scale = Math.min(1, ANON_MAX_EDGE / Math.max(sw, sh));
          const w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const g = c.getContext('2d');
          if (!g) { if (src.close) src.close(); throw new Error('no canvas'); }
          // Screenshots and drawings (logger printouts, HUB charts) stay PNG and
          // keep their sharp edges; photos become JPEG on white.
          const lossless = /png|gif|svg|webp/i.test(blob.type || '');
          if (!lossless) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); }
          g.drawImage(src, 0, 0, w, h);
          if (src.close) src.close();
          g.fillStyle = ANON_COVER;
          (boxes || []).forEach(b => {
            const x = Math.max(0, Math.floor(b.x * w)), y = Math.max(0, Math.floor(b.y * h));
            g.fillRect(x, y, Math.min(w - x, Math.ceil(b.w * w) + 2), Math.min(h - y, Math.ceil(b.h * h) + 2));
          });
          const out = c.toDataURL(lossless ? 'image/png' : 'image/jpeg', 0.9);
          // A canvas the browser could not allocate still answers, with 'data:,'.
          if (!/^data:image\/(png|jpeg);base64,/.test(out) || out.length < 200) throw new Error('canvas not drawn');
          return out;
        };

        // The anonymised copy (from anonymiseReport) with its images decided:
        // left-out ones dropped, every other one rendered by anonRenderImage.
        // Fails closed: an image that cannot be read or drawn is left out, never
        // passed on as it was. One image at a time — decoding a whole report's
        // photos at once would take gigabytes. Rendered images are cached per
        // decision, so opening the preview again is instant.
        const anonRenderCache = new Map();
        const anonymiseImages = async (copy, decisions, onProgress) => {
          const dec = decisions || {};
          const list = anonImageList(copy);
          const report = { total: list.length, unchecked: 0, hidden: 0, covered: 0, failed: 0 };
          const rendered = new Map(); // image key -> data URL, or null when left out
          const keep = new Map();
          for (let i = 0; i < list.length; i++) {
            const it = list[i];
            const d = dec[it.key] || {};
            if (!d.checked) report.unchecked++;
            if (d.hide) {
              report.hidden++;
              rendered.set(it.key, null);
            } else {
              if ((d.boxes || []).length) report.covered++;
              const sig = it.key + '|' + JSON.stringify(d.boxes || []);
              let out = anonRenderCache.get(sig) || null;
              if (!out) {
                try { out = await anonRenderImage(it.url, d.boxes); }
                catch (e) { out = null; report.failed++; }
              }
              if (out) keep.set(sig, out);
              rendered.set(it.key, out);
            }
            if (onProgress) onProgress(i + 1, list.length);
          }
          anonRenderCache.clear();
          keep.forEach((v, k) => anonRenderCache.set(k, v));
          // Anything not on the list is not an image the report shows as such;
          // an image field it did not know is emptied rather than kept.
          const swap = (url) => {
            if (!url || typeof url !== 'string') return null;
            const key = anonImageKey(url);
            return rendered.has(key) ? rendered.get(key) : null;
          };
          const pr = copy.project || {};
          return {
            ...copy,
            project: { ...pr, coverImage: swap(pr.coverImage), startImage: swap(pr.startImage) },
            groups: (copy.groups || []).map(g => ({
              ...g,
              predictedImage: swap(g.predictedImage),
              measurements: (g.measurements || []).map(m => ({
                ...m,
                images: (m.images || []).map(img => {
                  const out = swap(typeof img === 'string' ? img : img && img.url);
                  return !out ? null : typeof img === 'string' ? out : { ...img, url: out };
                }).filter(Boolean),
              })),
            })),
            analysis: { ...(copy.analysis || {}), temperatureImages: getTempImages(copy.analysis).map(swap).filter(Boolean), temperatureImage: null },
            imageReport: report,
          };
        };


        // Weight loss per sample. Samples unpacked at different evaluation
        // moments are usually different physical units, so each sample can
        // carry its own `initialWeight` (weight of that unit at packing).
        // When present it takes precedence; otherwise fall back to the
        // index-matched day-0 sample weight (legacy behaviour).
        // Average weight loss (%) of a day's samples against their start weight
        // (the sample's own Initial Wt., else the P+0 sample in the same
        // position), or null when nothing that day was weighed: "not weighed"
        // printed as 0.0 % loss.
        const getWeightLoss = (samples, day0Samples) => {
            if (!samples || samples.length === 0) return null;
            let totalLoss = 0, count = 0;
            samples.forEach((s, idx) => {
                const ownStart = sampleNumber(s.initialWeight);
                const startW = (!isNaN(ownStart) && ownStart > 0)
                  ? ownStart
                  : (day0Samples && day0Samples[idx] ? sampleNumber(day0Samples[idx].weight) : 0);
                const currentW = sampleNumber(s.weight);
                if (startW > 0 && !isNaN(currentW)) { totalLoss += ((startW - currentW) / startW) * 100; count++; }
            });
            return count > 0 ? round1(totalLoss / count).toFixed(1) : null;
        };
        // When samples are removed or reordered, the samples that relied on the
        // P+0 sample in their position keep that start weight as their own
        // Initial Wt. — otherwise they slide onto another pack's start weight
        // (a true loss of 1.9 % read as 5.6 %). `oldBase` is the P+0 list as
        // it was; `keep(j)` tells which positions to pin.
        const pinStartWeights = (samples, oldBase, keep) => (samples || []).map((s, j) => {
          if (!s || !keep(j)) return s;
          if (String(s.initialWeight == null ? '' : s.initialWeight).trim() !== '') return s;
          const w = oldBase && oldBase[j] ? parseFloat(oldBase[j].weight) : NaN;
          return w > 0 ? { ...s, initialWeight: String(oldBase[j].weight) } : s;
        });

        const getStageIcon = (name) => {
          const n = name?.toLowerCase() || '';
          if (n.includes('farm') || n.includes('harvest')) return <Tractor size={14} color={BRAND.colors.black} />;
          if (n.includes('sea')) return <Ship size={14} color={BRAND.colors.black} />;
          if (n.includes('air')) return <Plane size={14} color={BRAND.colors.black} />;
          if (n.includes('storage') || n.includes('dc') || n.includes('distribution')) return <Warehouse size={14} color={BRAND.colors.black} />;
          if (n.includes('store') || n.includes('retail')) return <Store size={14} color={BRAND.colors.black} />;
          if (n.includes('consumer') || n.includes('eat')) return <Utensils size={14} color={BRAND.colors.black} />;
          if (n.includes('pack') && !n.includes('transport')) return <Factory size={14} color={BRAND.colors.black} />;
          return <Truck size={14} color={BRAND.colors.black} />;
        };

        const formatRange = (start, end, unit) => (start && end && start !== end) ? `${start}-${end}${unit}` : start ? `${start}${unit}` : `-`;
        const formatDay = (day) => `P+${day}`;
        
        // Date-only arithmetic on "YYYY-MM-DD", done in UTC: new Date('2026-03-05')
        // is UTC midnight, so local setDate() put dates a day early west of UTC
        // and, after the spring clock change, a day early in Europe as well.
        const isoDayPlus = (iso, days) => {
          const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
          if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + (days || 0)));
          const d = new Date(iso);
          return isNaN(d.getTime()) ? null : new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate() + (days || 0)));
        };
        const utcDDMMYYYY = (d) => d ? `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}` : '-';
        // Today as YYYY-MM-DD in the user's own time zone (toISOString gave
        // yesterday's date before 02:00 in the Netherlands).
        const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };

        const formatDateToDDMMYYYY = (dateStr) => {
          if (!dateStr) return '-';
          const parts = dateStr.split('-');
          if (parts.length !== 3) return dateStr;
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        };

        const calcUnpackingDate = (project) => {
          const baseDate = project.packingDate || project.date;
          const duration = parseInt(project.totalDuration) || 0;
          return baseDate && duration ? utcDDMMYYYY(isoDayPlus(baseDate, duration)) : '-';
        };
        
        const calcRetailDate = (project) => {
          const baseDate = project.packingDate || project.date;
          const duration = parseInt(project.totalDuration) || 0;
          const retailDays = parseInt(project.retailOpenDays) || 0;
          return baseDate && (duration || retailDays) ? utcDDMMYYYY(isoDayPlus(baseDate, duration + retailDays)) : '-';
        };

        // Resolve the temperature-logger images as an array. Supports the new
        // multi-image field (temperatureImages[]) and stays backward compatible
        // with older reports that stored a single temperatureImage.
        const getTempImages = (analysis) => {
          if (Array.isArray(analysis?.temperatureImages)) return analysis.temperatureImages.filter(Boolean);
          if (analysis?.temperatureImage) return [analysis.temperatureImage];
          return [];
        };

        // ---- Native Word (.docx) export -----------------------------------
        // Converts the rendered report DOM into real Word content: editable
        // paragraphs, headings and tables, with photos/charts embedded as
        // pictures. Layout containers (CSS grid / flex rows) become borderless
        // tables so side-by-side content stays side-by-side in Word, and the
        // report's .page-break sections map to real Word page breaks — content
        // flows naturally within each section, matching the PDF's pagination.
        const domToDocx = async (root, docx, opts = {}) => {
          const { onProgress, supplyChain, scores, tempUnit = '°C' } = opts;
          const { Paragraph, TextRun, ImageRun, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle, VerticalAlign, TableOfContents, HeadingLevel, TableLayoutType } = docx;
          // Printable A4 area at 96dpi with 12mm margins (~186 x 273 mm).
          const MAX_W = 690, MAX_H = 940;
          const CONTENT_DXA = 10546; // usable page width in twips (A4 minus 12mm margins)
          const ctx = { pendingBreak: false, tableDepth: 0, imgCount: 0, inCell: false, keepNext: false, failedImages: 0 };

          const colorHex = (css) => {
            const m = (css || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m || (m[4] !== undefined && parseFloat(m[4]) === 0)) return null;
            // Word has no transparency: a 10 % green tint came out solid green
            // behind green text. Blend it with white, as it looks on paper.
            const a = m[4] === undefined ? 1 : Math.max(0, Math.min(1, parseFloat(m[4])));
            return [m[1], m[2], m[3]].map(n => Math.round(+n * a + 255 * (1 - a)).toString(16).padStart(2, '0')).join('').toUpperCase();
          };
          const skip = (el) => {
            const cs = getComputedStyle(el);
            return cs.display === 'none' || cs.visibility === 'hidden' || el.classList.contains('no-print');
          };
          const alignOf = (el) => {
            const cs = getComputedStyle(el);
            if (cs.textAlign === 'center' || (cs.display === 'flex' && cs.justifyContent === 'center')) return AlignmentType.CENTER;
            if (cs.textAlign === 'right') return AlignmentType.RIGHT;
            return AlignmentType.LEFT;
          };
          const mkPara = (o) => {
            const p = new Paragraph({
              ...o,
              pageBreakBefore: (ctx.pendingBreak || o.pageBreakBefore) || undefined,
              keepNext: (ctx.keepNext || o.keepNext) || undefined,
            });
            ctx.pendingBreak = false;
            return p;
          };
          // Flush a pending page break before content that cannot carry the
          // flag itself (tables) — otherwise the break would land INSIDE it.
          const flushBreak = (out) => {
            if (ctx.pendingBreak) { out.push(new Paragraph({ pageBreakBefore: true, spacing: { after: 0 } })); ctx.pendingBreak = false; }
          };

          const baseStyle = (el) => {
            const cs = getComputedStyle(el);
            return {
              bold: parseInt(cs.fontWeight, 10) >= 600,
              italics: cs.fontStyle === 'italic',
              underline: (cs.textDecorationLine || '').includes('underline'),
              color: colorHex(cs.color) || '000000',
              size: Math.max(2, Math.round(parseFloat(cs.fontSize) * 1.5)), // px -> half-points
            };
          };
          const mkRun = (text, st) => new TextRun({
            text,
            bold: st.bold || undefined,
            italics: st.italics || undefined,
            underline: st.underline ? {} : undefined,
            color: st.color,
            size: st.size,
          });
          // Text of `nodes` (children of `parent`) as runs. In a pre-wrap field
          // (observations, process description) a typed line break is a line
          // break in Word too; it used to run all lines into one paragraph.
          const runsOfNodes = (nodes, parent) => {
            const st = baseStyle(parent);
            const keepLines = /^pre/.test(getComputedStyle(parent).whiteSpace || '');
            const runs = [];
            for (const n of nodes) {
              if (n.nodeType === 3) {
                if (keepLines && n.textContent.includes('\n')) {
                  n.textContent.split('\n').forEach((line, i) => {
                    if (i > 0) runs.push(new TextRun({ text: '', break: 1 }));
                    const t = line.replace(/[ \t]+/g, ' ');
                    if (t.trim()) runs.push(mkRun(t, st));
                  });
                  continue;
                }
                const text = n.textContent.replace(/\s+/g, ' ');
                if (text.trim()) runs.push(mkRun(text, st));
              } else if (n.nodeType === 1) {
                if (n.tagName === 'BR') { runs.push(new TextRun({ text: '', break: 1 })); continue; }
                if (n.tagName === 'IMG' || n.tagName.toLowerCase() === 'svg' || skip(n)) continue;
                runs.push(...runsOf(n));
              }
            }
            return runs;
          };
          const runsOf = (el) => runsOfNodes(el.childNodes, el);
          const hasText = (nodes) => nodes.some(n => (n.textContent || '').trim());

          const imgCache = new Map();
          const loadImg = (src) => {
            if (imgCache.has(src)) return imgCache.get(src);
            const p = (async () => {
              try {
                const res = await fetch(src, src.startsWith('data:') ? undefined : { mode: 'cors' });
                const blob = await res.blob();
                const type = (blob.type || '').toLowerCase();
                const url = URL.createObjectURL(blob);
                try {
                  const im = new Image();
                  await new Promise((ok, err) => { im.onload = ok; im.onerror = err; im.src = url; });
                  const w = im.naturalWidth, h = im.naturalHeight;
                  let buf;
                  if (type !== 'image/png' && type !== 'image/jpeg') {
                    // Word only reliably embeds PNG/JPEG — transcode anything else.
                    const c = document.createElement('canvas'); c.width = w; c.height = h;
                    c.getContext('2d').drawImage(im, 0, 0);
                    buf = Uint8Array.from(atob(c.toDataURL('image/png').split(',')[1]), (ch) => ch.charCodeAt(0));
                  } else {
                    buf = new Uint8Array(await blob.arrayBuffer());
                  }
                  return { buf, w, h };
                } finally { URL.revokeObjectURL(url); }
              } catch (e) { return null; }
            })();
            imgCache.set(src, p);
            return p;
          };

          const imgPara = async (imgEl) => {
            const rect = imgEl.getBoundingClientRect();
            if (rect.width < 24 || rect.height < 24) return null; // UI icon, not content
            const data = await loadImg(imgEl.currentSrc || imgEl.src);
            if (!data || !data.w || !data.h) { ctx.failedImages++; return null; }
            ctx.imgCount++;
            if (onProgress && ctx.imgCount % 5 === 0) onProgress('Embedding photo ' + ctx.imgCount + '...');
            // Fit natural aspect into the on-screen box, then into the page.
            let scale = Math.min(rect.width / data.w, rect.height / data.h);
            let w = data.w * scale, h = data.h * scale;
            const cap = Math.min(MAX_W / w, MAX_H / h, 1);
            w = Math.round(w * cap); h = Math.round(h * cap);
            return mkPara({
              children: [new ImageRun({ data: data.buf, transformation: { width: w, height: h } })],
              alignment: alignOf(imgEl.parentElement || imgEl),
              spacing: { after: 80 },
            });
          };

          const svgPara = async (svgEl) => {
            const rect = svgEl.getBoundingClientRect();
            if (rect.width < 60 || rect.height < 40) return null; // inline icon
            try {
              // Inline the computed text styles: serialized SVG loses page CSS.
              const clone = svgEl.cloneNode(true);
              const src = svgEl.querySelectorAll('text, tspan');
              const dst = clone.querySelectorAll('text, tspan');
              src.forEach((t, i) => {
                const cs = getComputedStyle(t);
                dst[i].setAttribute('font-size', cs.fontSize);
                dst[i].setAttribute('font-family', 'Arial, sans-serif');
                dst[i].setAttribute('font-weight', cs.fontWeight);
                if (!dst[i].getAttribute('fill')) dst[i].setAttribute('fill', cs.fill);
              });
              clone.setAttribute('width', rect.width);
              clone.setAttribute('height', rect.height);
              clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
              const xml = new XMLSerializer().serializeToString(clone);
              const im = new Image();
              await new Promise((ok, err) => { im.onload = ok; im.onerror = err; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml); });
              const SC = 2; // 2x raster for print sharpness
              const c = document.createElement('canvas');
              c.width = Math.round(rect.width * SC); c.height = Math.round(rect.height * SC);
              const g = c.getContext('2d');
              g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
              g.drawImage(im, 0, 0, c.width, c.height);
              const buf = Uint8Array.from(atob(c.toDataURL('image/png').split(',')[1]), (ch) => ch.charCodeAt(0));
              let w = rect.width, h = rect.height;
              const cap = Math.min(MAX_W / w, MAX_H / h, 1);
              w = Math.round(w * cap); h = Math.round(h * cap);
              return mkPara({
                children: [new ImageRun({ data: buf, transformation: { width: w, height: h } })],
                alignment: AlignmentType.CENTER,
                spacing: { after: 80 },
              });
            } catch (e) { return null; }
          };

          const borders = (visible) => {
            const s = visible
              ? { style: BorderStyle.SINGLE, size: 4, color: 'E4EBF3' }
              : { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
            return { top: s, bottom: s, left: s, right: s };
          };

          const cellOf = async (el, { span = 1, pct, visible, keepNext = false }) => {
            const kids = [];
            const prevCell = ctx.inCell, prevKeep = ctx.keepNext;
            ctx.inCell = true; ctx.keepNext = keepNext;
            await walkInto(el, kids);
            ctx.inCell = prevCell; ctx.keepNext = prevKeep;
            if (!kids.length) kids.push(new Paragraph({ children: [] }));
            const bg = colorHex(getComputedStyle(el).backgroundColor);
            return new TableCell({
              children: kids,
              columnSpan: span > 1 ? span : undefined,
              width: pct ? { size: pct, type: WidthType.PERCENTAGE } : undefined,
              shading: bg && bg !== 'FFFFFF' ? { fill: bg } : undefined,
              borders: borders(visible),
              verticalAlign: VerticalAlign.CENTER,
              margins: { top: 40, bottom: 40, left: 80, right: 80 },
            });
          };

          const realTable = async (tableEl) => {
            const rowEls = Array.from(tableEl.rows || []);
            if (!rowEls.length) return null;
            const tRect = tableEl.getBoundingClientRect();
            // Fixed column widths (taken from the rendered layout) stop Word
            // from re-flowing columns and wrapping cell text over many lines.
            const colWidths = Array.from(rowEls[0].cells || []).map((td) =>
              Math.max(300, Math.round((td.getBoundingClientRect().width / (tRect.width || 1)) * CONTENT_DXA))
            );
            const rows = [];
            // A table that may run over pages in the PDF (print-flow) does so in
            // Word too, with its header row repeated; a group of rows kept
            // together in print (tbody.print-keep: a variant and its
            // observation) stays together. Other tables stay in one piece.
            const flow = tableEl.classList.contains('print-flow');
            for (let ri = 0; ri < rowEls.length; ri++) {
              const tr = rowEls[ri];
              const cells = [];
              const inHead = !!(tr.parentElement && tr.parentElement.tagName === 'THEAD');
              const group = tr.parentElement && tr.parentElement.classList && tr.parentElement.classList.contains('print-keep') ? tr.parentElement : null;
              const keepNext = flow
                ? (inHead || (!!group && tr !== group.rows[group.rows.length - 1]))
                : ri < rowEls.length - 1;
              for (const td of Array.from(tr.cells || [])) {
                const pct = tRect.width > 0
                  ? Math.max(2, Math.round((td.getBoundingClientRect().width / tRect.width) * 100))
                  : undefined;
                cells.push(await cellOf(td, { span: td.colSpan || 1, pct, visible: true, keepNext }));
              }
              if (cells.length) rows.push(new TableRow({ children: cells, cantSplit: true, tableHeader: (flow && inHead) || undefined }));
            }
            if (!rows.length) return null;
            return new Table({ rows, width: { size: 100, type: WidthType.PERCENTAGE }, layout: TableLayoutType.FIXED, columnWidths: colWidths });
          };

          const layoutTable = async (rowsSpec, cols) => {
            const rows = [];
            for (const rowEls of rowsSpec) {
              const cells = [];
              for (const { el, span, pct } of rowEls) {
                cells.push(await cellOf(el, { span, pct: pct || Math.round((span / cols) * 100), visible: false }));
              }
              rows.push(new TableRow({ children: cells, cantSplit: true }));
            }
            return new Table({ rows, width: { size: 100, type: WidthType.PERCENTAGE } });
          };

          const gridSpanOf = (el, cols) => {
            const gc = getComputedStyle(el).gridColumnStart || '';
            const m = gc.match(/span\s+(\d+)/);
            return m ? Math.min(cols, parseInt(m[1], 10)) : 1;
          };

          // --- data-docx special blocks --------------------------------------

          // The contents written out, as in the PDF. A Word TOC field stays
          // empty until Word refreshes it: blank in Word Online, Outlook's
          // preview or Google Docs, and blank when someone declines the
          // "update fields" question. The headings keep their Word styles, so
          // the navigation pane still works.
          const buildToc = (el, out) => {
            out.push(mkPara({
              children: [mkRun('Contents', { bold: true, color: '1A1B1F', size: 56 })],
              spacing: { after: 300 },
            }));
            for (const li of Array.from(el.querySelectorAll('li'))) {
              if (skip(li)) continue;
              const text = (li.textContent || '').replace(/\s+/g, ' ').trim();
              if (!text) continue;
              const sub = !!li.querySelector('.pl-6');
              out.push(mkPara({
                children: [mkRun(text, { bold: !sub, color: sub ? '4A4F59' : '1A1B1F', size: sub ? 22 : 26 })],
                indent: sub ? { left: 480 } : undefined,
                spacing: { after: 100 },
              }));
            }
          };

          const fmtRange = (a, b, unit) => {
            const as = (a === 0 ? '0' : (a || '')).toString().trim();
            const bs = (b === 0 ? '0' : (b || '')).toString().trim();
            if (!as && !bs) return '-';
            if (!bs || as === bs) return `${as}${unit}`;
            return `${as} - ${bs}${unit}`;
          };
          const txtCell = (text, { bold, color = '333333', fill, size = 18, align = AlignmentType.CENTER, pct } = {}) => new TableCell({
            children: [new Paragraph({ alignment: align, spacing: { after: 0 }, children: [mkRun(text, { bold, color, size })] })],
            shading: fill ? { fill } : undefined,
            width: pct ? { size: pct, type: WidthType.PERCENTAGE } : undefined,
            borders: borders(true),
            verticalAlign: VerticalAlign.CENTER,
            margins: { top: 50, bottom: 50, left: 80, right: 80 },
          });

          // Clean bordered table for the supply chain — the tiny on-screen
          // flow boxes don't translate to Word.
          const buildSupplyChain = (out) => {
            const widths = [6, 28, 17, 15, 17, 17]; // percent per column
            const header = ['#', 'Stage', 'Temperature', 'Duration', 'Total Elapsed', 'Action'];
            const rows = [new TableRow({
              children: header.map((h, i) => txtCell(h, { bold: true, color: 'FFFFFF', fill: '084BCD', size: 16, pct: widths[i], align: i === 1 ? AlignmentType.LEFT : AlignmentType.CENTER })),
              cantSplit: true, tableHeader: true,
            })];
            let cMin = 0, cMax = 0;
            supplyChain.forEach((s, i) => {
              const dMin = parseFloat(s.daysStart) || 0;
              const dMax = s.daysEnd ? (parseFloat(s.daysEnd) || dMin) : dMin;
              cMin += dMin; cMax += dMax;
              const fill = i % 2 ? 'F7F7F7' : undefined;
              const action = s.action === 'pack' ? 'PACKED' : s.action === 'unpack' ? 'OPENED' : '';
              rows.push(new TableRow({
                cantSplit: true,
                children: [
                  txtCell(String(i + 1), { bold: true, color: '8A97AD', fill, pct: widths[0] }),
                  txtCell(s.stage || '-', { bold: true, fill, pct: widths[1], align: AlignmentType.LEFT }),
                  txtCell(fmtRange(s.tempStart, s.tempEnd, tempUnit), { fill, pct: widths[2] }),
                  txtCell(fmtRange(s.daysStart, s.daysEnd, ' d'), { fill, pct: widths[3] }),
                  txtCell(round1(cMin) === round1(cMax) ? `${round1(cMin)} d` : `${round1(cMin)} - ${round1(cMax)} d`, { color: '084BCD', fill, pct: widths[4] }),
                  txtCell(action, { bold: true, color: s.action === 'pack' ? '008837' : 'DC2626', fill, pct: widths[5] }),
                ],
              }));
            });
            out.push(new Table({
              rows,
              width: { size: 100, type: WidthType.PERCENTAGE },
              layout: TableLayoutType.FIXED,
              columnWidths: widths.map((w) => Math.round((w / 100) * CONTENT_DXA)),
            }));
            out.push(new Paragraph({ children: [], spacing: { after: 80 } }));
          };

          // Score scale: "10  excellent – ..." in two tidy columns, number first.
          const buildScoreScale = (out) => {
            const rows = [];
            for (let i = 0; i < scores.length; i += 2) {
              const cells = scores.slice(i, i + 2).map(([num, desc]) => {
                const col = num >= 7 ? '008837' : num >= 5 ? 'EA580C' : 'DC2626';
                return new TableCell({
                  children: [new Paragraph({
                    spacing: { after: 20 },
                    children: [mkRun(String(num), { bold: true, color: col, size: 20 }), mkRun('   ' + desc, { color: '333333', size: 16 })],
                  })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  borders: borders(false),
                  margins: { top: 30, bottom: 30, left: 60, right: 60 },
                });
              });
              while (cells.length < 2) cells.push(new TableCell({ children: [new Paragraph({ children: [] })], borders: borders(false) }));
              rows.push(new TableRow({ children: cells, cantSplit: true }));
            }
            out.push(new Table({ rows, width: { size: 100, type: WidthType.PERCENTAGE } }));
            out.push(new Paragraph({ children: [], spacing: { after: 80 } }));
          };

          // Photo grids become bordered tables: photo on top, caption below.
          const buildPhotoGrid = async (el, out) => {
            const cs = getComputedStyle(el);
            const cols = Math.max(1, (cs.gridTemplateColumns || '').split(' ').filter(Boolean).length);
            const cards = Array.from(el.children).filter((c) => !skip(c));
            if (!cards.length) return;
            const rows = [];
            for (let i = 0; i < cards.length; i += cols) {
              const slice = cards.slice(i, i + cols);
              const cells = [];
              for (const card of slice) {
                const kids = [];
                const img = card.querySelector('img');
                if (img) { const p = await imgPara(img); if (p) kids.push(p); }
                const lines = (card.innerText || '').split('\n').map((s) => s.trim()).filter(Boolean);
                let badge = null;
                if (lines.length > 1 && lines[0].length <= 8) badge = lines.shift();
                lines.forEach((line, li) => kids.push(new Paragraph({
                  alignment: AlignmentType.CENTER,
                  spacing: { before: li === 0 ? 60 : 0, after: 0 },
                  children: [
                    mkRun(line, li === 0 ? { bold: true, color: '1A1B1F', size: 16 } : { color: '4A4F59', size: 15 }),
                    ...((li === 0 && badge) ? [mkRun('  (' + badge + ')', { color: '8A97AD', size: 14 })] : []),
                  ],
                })));
                if (!kids.length) kids.push(new Paragraph({ children: [] }));
                cells.push(new TableCell({
                  children: kids,
                  width: { size: Math.floor(100 / cols), type: WidthType.PERCENTAGE },
                  borders: borders(true),
                  verticalAlign: VerticalAlign.CENTER,
                  margins: { top: 60, bottom: 60, left: 60, right: 60 },
                }));
              }
              while (cells.length < cols) cells.push(new TableCell({ children: [new Paragraph({ children: [] })], borders: borders(true), width: { size: Math.floor(100 / cols), type: WidthType.PERCENTAGE } }));
              rows.push(new TableRow({ children: cells, cantSplit: true }));
            }
            out.push(new Table({
              rows,
              width: { size: 100, type: WidthType.PERCENTAGE },
              layout: TableLayoutType.FIXED,
              columnWidths: Array.from({ length: cols }, () => Math.round(CONTENT_DXA / cols)),
            }));
            out.push(new Paragraph({ children: [], spacing: { after: 120 } }));
          };

          const walkEl = async (el, out) => {
            if (skip(el)) return;
            if (el.classList.contains('page-break')) ctx.pendingBreak = true;

            // Special-cased blocks, marked with data-docx in the report JSX.
            const special = el.getAttribute && el.getAttribute('data-docx');
            if (special === 'toc') { flushBreak(out); buildToc(el, out); return; }
            if (special === 'supply-chain' && Array.isArray(supplyChain) && supplyChain.length) { flushBreak(out); buildSupplyChain(out); return; }
            if (special === 'score-scale' && Array.isArray(scores) && scores.length) { flushBreak(out); buildScoreScale(out); return; }
            if (special === 'photo-grid') { flushBreak(out); await buildPhotoGrid(el, out); return; }

            const tag = el.tagName;
            const cs = getComputedStyle(el);

            if (/^H[1-6]$/.test(tag)) {
              // Numbered section headings get real Word heading styles: they
              // form the outline the native (clickable) TOC is generated from.
              const t = (el.textContent || '').trim();
              let heading;
              if (tag === 'H2' && (/^\d+\.\s/.test(t) || /^Annex\b/i.test(t))) heading = HeadingLevel.HEADING_1;
              else if (tag === 'H3' && /^\d+\.\d+/.test(t)) heading = HeadingLevel.HEADING_2;
              const runs = runsOf(el);
              if (runs.length) out.push(mkPara({ children: runs, heading, keepNext: true, alignment: alignOf(el), spacing: { before: 200, after: 160 } }));
              return;
            }
            if (tag === 'TABLE') {
              flushBreak(out);
              const t = await realTable(el);
              if (t) { out.push(t); out.push(new Paragraph({ children: [], spacing: { after: 80 } })); }
              return;
            }
            if (tag === 'IMG') { const p = await imgPara(el); if (p) out.push(p); return; }
            if (tag.toLowerCase() === 'svg') { const p = await svgPara(el); if (p) out.push(p); return; }
            if (tag === 'UL' || tag === 'OL') {
              for (const li of Array.from(el.children)) {
                if (li.tagName !== 'LI' || skip(li)) continue;
                const runs = runsOf(li);
                if (runs.length) out.push(mkPara({ children: runs, bullet: { level: 0 }, spacing: { after: 60 } }));
              }
              return;
            }

            // Leaf block (inline content only) -> one paragraph.
            if (!el.querySelector('div, p, table, ul, ol, img, svg, h1, h2, h3, h4, h5, h6, li')) {
              const runs = runsOf(el);
              if (runs.length) out.push(mkPara({ children: runs, alignment: alignOf(el), spacing: { after: ctx.inCell ? 20 : 100 } }));
              return;
            }

            const children = Array.from(el.children).filter((c) => !skip(c));

            // CSS grid -> borderless layout table (respecting col-span).
            if (cs.display === 'grid' && ctx.tableDepth < 2) {
              const cols = (cs.gridTemplateColumns || '').split(' ').filter(Boolean).length;
              if (cols >= 2 && children.length >= 2) {
                flushBreak(out);
                ctx.tableDepth++;
                const rowsSpec = [];
                let row = [], used = 0;
                for (const c of children) {
                  const span = gridSpanOf(c, cols);
                  if (used + span > cols && row.length) { rowsSpec.push(row); row = []; used = 0; }
                  row.push({ el: c, span }); used += span;
                  if (used >= cols) { rowsSpec.push(row); row = []; used = 0; }
                }
                if (row.length) rowsSpec.push(row);
                // Every block as wide as the grid (chapter 5: one block per photo
                // category): one table row per block, each unsplittable, left
                // half-empty pages. Just write them one after the other.
                if (rowsSpec.every(r => r.length === 1 && r[0].span >= cols)) {
                  ctx.tableDepth--;
                  for (const c of children) await walkEl(c, out);
                  return;
                }
                const t = await layoutTable(rowsSpec, cols);
                ctx.tableDepth--;
                out.push(t);
                out.push(new Paragraph({ children: [], spacing: { after: 80 } }));
                return;
