                                 className="mt-2 w-full h-11 px-3 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500"
                                 value={param.notes || ''} onChange={e => updateParam(i, 'notes', e.target.value)} placeholder={rt?.thNotes || 'Notes'} />
                             </div>
                           ))}
                         </div>
                         )}

                         <div className="flex-1 overflow-y-auto pr-2 rounded-xl border border-slate-200 bg-white">
                           <table className="w-full text-sm">
                             <thead className="text-left text-slate-500 sticky top-0 bg-slate-100 border-b border-slate-200 shadow-sm">
                               <tr className="uppercase tracking-wider text-[10px] font-bold">
                                 <th className="p-3">{rt?.thCriterion || 'Criterion'}</th>
                                 <th className="p-3 text-center w-20">{rt?.thScore || 'Score'}</th>
                                 <th className="p-3">{rt?.thNotes || 'Notes'}</th>
                               </tr>
                             </thead>
                             <tbody className="divide-y divide-slate-100">
                               {qualityParams.length === 0 && <tr><td colSpan="3" className="text-center italic text-slate-400 py-8">{rt?.noCriteriaModal || 'No criteria selected in Global Settings.'}</td></tr>}
                               {qualityParams.map((param, i) => (
                                 <tr key={i} className="hover:bg-slate-50 transition-colors">
                                   <td className="p-3 text-slate-800 font-bold">{param.name}</td>
                                   <td className="p-3">
                                      <input type="number" min="1" max="10" className="w-full p-2 border border-slate-300 rounded-lg text-center font-extrabold text-blue-900 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={param.score || ''} onChange={e => updateParam(i, 'score', e.target.value)} placeholder="-" />
                                   </td>
                                   <td className="p-3">
                                      <input type="text" className="w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={param.notes || ''} onChange={e => updateParam(i, 'notes', e.target.value)} placeholder="..." />
                                   </td>
                                 </tr>
                               ))}
                             </tbody>
                           </table>
                         </div>

                         {/* Legend */}
                         <div className="mt-6 pt-6 border-t border-slate-200 shrink-0">
                           <p className="text-[10px] font-extrabold text-slate-400 mb-3 uppercase tracking-widest">{rt?.scoreScale || 'Score Scale (1-10)'}</p>
                           <div className="flex flex-wrap gap-2 text-xs text-slate-600 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                             {MINI_SCORES.map(s => <div key={s[0]} className="flex items-center gap-1.5 shrink-0"><strong className={`${s[2]} bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100 text-[11px] leading-none`}>{s[0]}</strong><span className="font-medium text-[11px] leading-none">{s[1]}</span></div>)}
                           </div>
                         </div>
                       </div>
                     ) : (
                       <div className="flex flex-col items-center justify-center flex-1 text-center text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                         <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                            <AlertTriangle size={32} className="text-slate-300"/>
                         </div>
                         <p className="text-sm font-medium max-w-[250px]">{rt?.evalDisabled || 'Quality scoring is currently disabled.'}<br/>{rt?.evalDisabledHint || "Check 'Enable Evaluation' to fill in."}</p>
                       </div>
                     )}
                  </div>
                </div>

                {/* Save must be reachable with one thumb and never scroll away:
                    shrink-0 keeps it pinned while the middle scrolls, and on a
                    phone it takes the full width because that is the one action
                    you came here for. */}
                <div className="bg-slate-100 p-4 md:p-6 border-t border-slate-200 flex gap-3 md:gap-4 md:justify-end shrink-0"
                     style={{ paddingBottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
                  <button onClick={onClose} className="px-5 md:px-6 py-3.5 md:py-3 text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl font-bold transition-all shadow-sm shrink-0">{rt?.cancel || 'Cancel'}</button>
                  <button onClick={handleSave} className="flex-1 md:flex-none px-8 py-3.5 md:py-3 text-white font-bold rounded-xl shadow-lg shadow-green-500/30 hover:shadow-green-500/50 md:hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2" style={{ backgroundColor: BRAND.colors.green }}><Save size={18}/> {rt?.saveData || 'Save Data'}</button>
                </div>
              </div>
            </div>
          );
        };

        /* ==========================================================================
         * Panel — a form section that is collapsed on a phone and always open on a
         * desktop.
         *
         * The Setup tab is five full-height panels. On a 375px screen that is a lot
         * of scrolling to reach one field, and you cannot see what else exists.
         * Collapsed, the whole form fits on one screen as a list of headings you
         * tap into.
         *
         * Desktop is deliberately left exactly as it was: there the fields sit two
         * and three across and collapsing them would only add clicks. So the phone
         * gets the accordion and the desktop keeps the plain heading — same markup,
         * one branch.
         *
         * The `open` state is kept even while the desktop branch renders, so
         * rotating a tablet does not reset which panels you had unfolded.
         * ========================================================================== */
        const usePhoneLayout = () => {
          // Width alone is the wrong test. A laptop with DevTools docked to the
          // right, or a half-screen window, is under 768px and would get the phone
          // layout — panels collapsed, the day table reflowed somewhere else — which
          // is not what a desktop user asked for and made the measurement inputs
          // look lost. `pointer: coarse` is what actually separates a touch device
          // from a narrow mouse window, so both must hold.
          const query = '(max-width: 767px) and (pointer: coarse)';
          const [isPhone, setIsPhone] = useState(() =>
            typeof window.matchMedia === 'function' ? window.matchMedia(query).matches : false);
          useEffect(() => {
            if (typeof window.matchMedia !== 'function') return;
            const mq = window.matchMedia(query);
            // Both signals: the media-query change event is the right one, but it
            // does not fire in every environment (it did not under viewport
            // emulation), and being wrong here means the whole measurement layout
            // is wrong. `resize` re-reads mq.matches, so the two cannot disagree.
            const sync = () => setIsPhone(mq.matches);
            mq.addEventListener('change', sync);
            window.addEventListener('resize', sync);
            sync();
            return () => {
              mq.removeEventListener('change', sync);
              window.removeEventListener('resize', sync);
            };
          }, []);
          return isPhone;
        };

        /* `chip` is the smaller variant used by the panels inside the Variant tab:
         * a plain white box with a label-sized heading and a coloured icon square,
         * instead of a full section with an accent bar. Same collapse behaviour. */
        const Panel = ({ title, icon: Icon, accent, iconBg, badge, children, bodyClass = '', defaultOpen = false, chip = false, chipClass = '', fill = false }) => {
          const isPhone = usePhoneLayout();
          const [open, setOpen] = useState(defaultOpen);
          const showBody = !isPhone || open;

          if (chip) {
            return (
              // `fill` (height:100%) is OPT-IN, and must stay that way. It is right
              // for panels that sit side by side in a grid and should match heights,
              // and catastrophic for one stacked above a sibling: height:100% of a
              // STRETCHED grid item resolves against a height that already includes
              // that sibling, so the panel grows to fill the whole column and pushes
              // the sibling past the bottom edge — where the column's overflow-hidden
              // deletes it. That is what made the whole Measurements panel disappear
              // on screens wide enough for the lg: grid to apply, while everything
              // above it rendered normally.
              <div className={`bg-white p-4 sm:p-8 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col ${fill ? 'h-full' : ''}`}>
                {isPhone ? (
                  <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
                    className={`w-full flex items-center gap-2.5 text-left ${open ? 'border-b border-slate-100 pb-3 mb-3' : ''}`}>
                    {Icon && <div className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${chipClass}`}><Icon size={18}/></div>}
                    <span className="flex-1 min-w-0 font-extrabold text-slate-800 leading-tight">{title}</span>
                    <ChevronDown size={20} className="shrink-0 text-slate-400 transition-transform" style={{ transform: open ? 'rotate(180deg)' : 'none' }} />
                  </button>
                ) : (
                  <label className="block mb-2 font-extrabold text-slate-800 text-lg border-b border-slate-100 pb-3 flex items-center gap-2">
                    {Icon && <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${chipClass}`}><Icon size={16}/></div>}
                    {title}
                  </label>
                )}
                {showBody && (bodyClass ? <div className={bodyClass}>{children}</div> : children)}
              </div>
            );
          }

          return (
            <section className="bg-white p-4 sm:p-8 md:p-10 rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1" style={{ backgroundColor: accent }}></div>
              {isPhone ? (
                <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
                  className={`w-full flex items-center gap-3 text-left ${open ? 'border-b-2 border-slate-100 pb-4 mb-5' : ''}`}>
                  {Icon && (
                    <div className="p-2.5 rounded-xl shrink-0" style={{ backgroundColor: iconBg || (accent + '1a') }}>
                      <Icon size={22} color={accent} />
                    </div>
                  )}
                  <span className="flex-1 min-w-0 font-extrabold text-base text-slate-800 leading-tight">{title}</span>
                  <ChevronDown size={22} className="shrink-0 text-slate-400 transition-transform" style={{ transform: open ? 'rotate(180deg)' : 'none' }} />
                </button>
              ) : (
                <div className="flex flex-wrap items-center justify-between gap-4 border-b-2 border-slate-100 pb-6 mb-8">
                  <div className="flex items-center gap-4">
                    {Icon && (
                      <div className="p-3 rounded-xl" style={{ backgroundColor: iconBg || (accent + '1a') }}>
                        <Icon size={28} color={accent} />
                      </div>
                    )}
                    <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">{title}</h2>
                  </div>
                  {badge}
                </div>
              )}
              {/* A badge (e.g. the metric/imperial switch) sits beside the title on a
                  desktop. On a phone there is no room next to a title and a chevron,
                  so it drops into the body as its own row — visible once you open the
                  panel, which is also when it is relevant. */}
              {isPhone && badge && open && <div className="mb-4 flex">{badge}</div>}
              {showBody && (bodyClass ? <div className={bodyClass}>{children}</div> : children)}
            </section>
          );
        };

        const DetailsModal = ({ isOpen, onClose, data, onSave, rt }) => {
          if (!isOpen) return null;
          const initialImages = (data.images || []).map(img => typeof img === 'string' ? {url: img, caption: '', category: 'External Quality'} : { ...img, category: img.category || 'External Quality' });
          const [images, setImages] = useState(initialImages);

          // Measurement photos are where a report's weight comes from: one real
          // trial measured 62.5 MB for 21 photos, 100% of the file. Downscale on
          // the way in (see readImageFile) instead of storing the camera original,
          // and keep the pixel size so the print layout does not have to decode
          // the image to know its aspect.
          const [imgBusy, setImgBusy] = useState(0);
          // Same signal the touch CSS uses: a coarse pointer means a phone or
          // tablet, which has a camera worth offering. Deliberately not UA
          // sniffing, and not `navigator.mediaDevices` — a desktop webcam exists
          // but nobody photographs a pallet with it.
          const hasCamera = typeof window.matchMedia === 'function'
            && window.matchMedia('(pointer: coarse)').matches;
          const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            e.target.value = null;                 // allow re-picking the same file
            setImgBusy(n => n + files.length);
            for (const file of files) {
              try {
                const r = await globalConfig.readImageFile(file);
                setImages(prev => [...prev, {
                  url: r.dataUrl, caption: '', category: 'External Quality',
                  w: r.width, h: r.height, bytes: r.bytes
                }]);
              } catch (err) {
                // Losing the photo is worse than storing it big.
                const reader = new FileReader();
                reader.onloadend = () => setImages(prev => [...prev, { url: reader.result, caption: '', category: 'External Quality' }]);
                reader.readAsDataURL(file);
              } finally {
                setImgBusy(n => Math.max(0, n - 1));
              }
            }
          };

          const removeImage = (idx) => setImages(images.filter((_, i) => i !== idx));
          const updateImageField = (idx, field, value) => {
            const newImgs = [...images];
            newImgs[idx][field] = value;
            setImages(newImgs);
          };

          const handleSave = () => { onSave({ ...data, images }); onClose(); };

          return (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 font-sans print:hidden">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden border border-slate-200 flex flex-col max-h-[90vh]">
                <div className="p-6 flex justify-between items-center text-white" style={{ background: `linear-gradient(90deg, ${BRAND.colors.black} 0%, #423B3B 50%, ${BRAND.colors.black} 100%)` }}>
                  <h3 className="font-extrabold text-xl flex items-center gap-3" style={{ fontFamily: BRAND.fonts.heading }}><Camera size={20}/> {rt?.managePhotos || 'Manage Photos'}</h3>
                  <button onClick={onClose} className="hover:text-red-300 transition bg-white/10 p-2 rounded-full"><X size={20}/></button>
                </div>
                
                <div className="p-8 overflow-y-auto bg-slate-50">
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-4">
                    {images.map((img, idx) => (
                      <div key={idx} className="relative group border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm flex flex-col hover:shadow-md transition-shadow">
                        <div className="aspect-square relative bg-slate-100 flex items-center justify-center p-2">
                           <img src={img.url} className="max-w-full max-h-full object-contain rounded-lg" />
                           <button onClick={() => removeImage(idx)} className="absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all shadow-lg hover:bg-red-600 hover:scale-110"><Trash2 size={16}/></button>
                        </div>
                        <div className="p-3 border-t border-slate-100 flex flex-col gap-2">
                          <select className="w-full p-2 text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" value={img.category || 'External Quality'} onChange={e => updateImageField(idx, 'category', e.target.value)}>
                              {[
                                ['External Quality', rt?.catExternalQuality || 'External Quality'],
                                ['Internal Quality', rt?.catInternalQuality || 'Internal Quality'],
                                ['Loose Produce',    rt?.catLooseProduce    || 'Loose Produce'],
                                ['Box/Crate',        rt?.catBoxCrate        || 'Box/Crate'],
                                ['Weight measurement', rt?.catWeightMeas    || 'Weight measurement'],
                                ['Gas measurement',  rt?.catGasMeas         || 'Gas measurement'],
                                ['Other',            rt?.catOther           || 'Other']
                              ].map(([val, label]) => <option key={val} value={val}>{label}</option>)}
                          </select>
                          <input type="text" className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-shadow placeholder:text-slate-400" placeholder={rt?.captionPlaceholder || 'Caption / Description...'} value={img.caption || ''} onChange={e => updateImageField(idx, 'caption', e.target.value)} />
                        </div>
                      </div>
                    ))}
                    {/* Two separate inputs on a phone, not one. `capture` opens the
                        camera directly, which is what you want standing in front of
                        the pallet — but it also takes the gallery away, so a photo
                        shot earlier could no longer be attached. Shown on coarse
                        pointers only: on a desktop "Take photo" would just open the
                        same file dialog and read as a bug. */}
                    {hasCamera && (
                      <label className="border-4 border-dashed rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all aspect-square min-h-[200px] shadow-sm group"
                             style={{ borderColor: BRAND.colors.green, backgroundColor: BRAND.colors.green + '0d' }}>
                         <div className="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            {imgBusy > 0
                              ? <svg className="animate-spin h-7 w-7" style={{ color: BRAND.colors.green }} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                              : <Camera size={28} style={{ color: BRAND.colors.green }}/>}
                         </div>
                         <span className="text-sm font-extrabold" style={{ color: BRAND.colors.green }}>
                           {imgBusy > 0 ? (rt?.photoProcessing || 'Processing…') + ' (' + imgBusy + ')' : (rt?.takePhoto || 'Take photo')}
                         </span>
                         <span className="text-xs text-slate-400 mt-1">{rt?.photoResizeHint || 'Resized automatically'}</span>
                         <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                      </label>
                    )}
                    <label className="border-4 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all aspect-square min-h-[200px] shadow-sm group">
                       <div className="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                          {imgBusy > 0
                            ? <svg className="animate-spin h-7 w-7 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                            : <Upload size={28} className="text-blue-500"/>}
                       </div>
                       <span className="text-sm text-slate-600 font-extrabold">
                         {imgBusy > 0 ? (rt?.photoProcessing || 'Processing…') + ' (' + imgBusy + ')' : (hasCamera ? (rt?.chooseExisting || 'Choose existing') : (rt?.uploadPhotos || 'Upload Photos'))}
                       </span>
                       <span className="text-xs text-slate-400 mt-1">{rt?.photoResizeHint || 'Resized automatically'}</span>
                       <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload} />
                    </label>
                  </div>
                </div>
                
                <div className="bg-white p-6 border-t border-slate-200 flex justify-end gap-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                   <button onClick={onClose} className="px-6 py-3 text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl font-bold transition-all shadow-sm">{rt?.done || 'Done'}</button>
                   <button onClick={handleSave} className="px-8 py-3 text-white font-bold rounded-xl shadow-lg shadow-green-500/30 hover:shadow-green-500/50 hover:-translate-y-0.5 transition-all flex items-center gap-2" style={{ backgroundColor: BRAND.colors.green }}><Save size={18}/> {rt?.savePhotos || 'Save Photos'}</button>
                </div>
              </div>
            </div>
          );
        };

        const PrintPreview = ({ clientInfo, project, groups, analysis, supplyChain, onBack, unitSystem = 'metric', lang = 'en' }) => {
          // Recognised stage labels are re-translated to the report language at
          // render time, so a chain entered in another language (e.g. Spanish)
          // never leaks untranslated into the report. Free text passes through.
          const displayChain = (supplyChain || []).map(s => globalConfig.retranslateStage
            ? { ...s, stage: globalConfig.retranslateStage(s.stage, lang) }
            : s);
          const [isPrinting, setIsPrinting] = useState(false);
          const [isWordExporting, setIsWordExporting] = useState(false);
          const [wordProgress, setWordProgress] = useState('');
          // Only use temperatures from the 'pack' stage up to (not including) the 'unpack' stage.
          // Pre-packaging steps like harvest and transport are excluded so the report shows
          // the temperature the product was actually packed and stored at.
          const _packIdx   = (supplyChain || []).findIndex(s => s.action === 'pack');
          const _unpackIdx = (supplyChain || []).findIndex((s, i) => i > _packIdx && s.action === 'unpack');
          const _packedStages = _packIdx >= 0
            ? (_unpackIdx > _packIdx
                ? (supplyChain || []).slice(_packIdx, _unpackIdx)
                : (supplyChain || []).slice(_packIdx))
            : (supplyChain || []); // fallback: all stages when no explicit 'pack' action is set
          let allTemps = [];
          _packedStages.forEach(s => {
              const ts = parseFloat(s.tempStart); if(!isNaN(ts)) allTemps.push(ts);
              const te = parseFloat(s.tempEnd);   if(!isNaN(te)) allTemps.push(te);
          });
          const minTemp = allTemps.length > 0 ? Math.min(...allTemps) : null;
          const maxTemp = allTemps.length > 0 ? Math.max(...allTemps) : null;
          const tempString = allTemps.length > 0 ? (minTemp === maxTemp ? `${minTemp}°C` : `${minTemp}°C - ${maxTemp}°C`) : '-°C';
          const totalDays = project.totalDuration || (supplyChain || []).reduce((acc,s) => acc + parseFloat(s.daysStart || 0), 0);

          // Unit-aware weight label: bulk packaging (Pallet / Cube crate) uses kg or lb; retail uses g or oz.
          const projIsBulk = (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail') === 'Cube crate' || (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail') === 'Pallet';
          const isImperial = unitSystem === 'imperial';
          const weightUnit = isImperial ? (projIsBulk ? 'lb' : 'oz') : (projIsBulk ? 'kg' : 'g');

          const allPhotos = groups.flatMap(g => (g.measurements || []).flatMap(m => (m.images || []).map(img => ({ groupName: g.name, day: m.day, url: typeof img === 'string' ? img : img.url, caption: typeof img === 'string' ? '' : img.caption, category: (typeof img === 'object' && img.category) ? img.category : 'Other' }))));
          const photosByCat = {};
          allPhotos.forEach(p => { if (!photosByCat[p.category]) photosByCat[p.category] = []; photosByCat[p.category].push(p); });
          const catsPresent = ['External Quality', 'Internal Quality', 'Loose Produce', 'Box/Crate', 'Weight measurement', 'Gas measurement', 'Other'].filter(c => photosByCat[c] && photosByCat[c].length > 0);

          // Auto-detect which optional sections have data to render.
          const mapGroupsList = groups.filter(g => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP');
          const autoShowGas = mapGroupsList.some(g =>
            (g.measurements || []).some(m =>
              parseFloat(m.day) > 0 &&
              (m.samples || []).some(s => s.o2 !== '' && s.o2 !== undefined && s.o2 !== null)
            )
          );
          const autoShowHub = mapGroupsList.some(g => !!g.predictedImage);
          const autoShowWeight = groups.some(g => {
            const daysWithWeight = (g.measurements || []).filter(m =>
              (m.samples || []).some(s => s.weight !== '' && s.weight !== undefined && s.weight !== null && parseFloat(s.weight) > 0)
            );
            return daysWithWeight.length >= 2;
          });

          // Effective values — null/undefined = "auto", true/false = manual override.
          // Use ?? (nullish coalescing) so that both null AND undefined (old JSON files) fall through to auto.
          const showGas = analysis.showGasSection ?? autoShowGas;
          const showAnyHubPrediction = analysis.showHubPredictions ?? autoShowHub;
          const showWeight = analysis.showWeightLoss ?? autoShowWeight;

          // Dynamic section numbering for 4.x — depends on which optional sections are visible.
          const sec4Nums = (() => {
            let n = 0;
            return {
              gas:      showGas                   ? ++n : null,
              temp:     getTempImages(analysis).length > 0 ? ++n : null,
              weight:   showWeight                ? ++n : null,
              visual:   ++n,
              detailed: ++n,
              score:    ++n,
            };
          })();

          const reportTitleClass = "text-3xl font-extrabold uppercase mb-6 brand-heading";
          const reportTitleStyle = { color: BRAND.colors.green, borderBottom: `3px solid ${BRAND.colors.gray}`, paddingBottom: '0.75rem', marginTop: '2rem' };

          // Builds a genuine .docx (via the `docx` library) from the rendered
          // report DOM: fully editable text, native Word tables and headings.
          // Only photos and charts are embedded as pictures. Page breaks occur
          // exactly at the report's .page-break sections; everything else
          // flows naturally, so pagination tracks the PDF.
          const handleWordExport = async () => {
              const root = document.getElementById('print-content');
              if (!root || isWordExporting) return;
              setIsWordExporting(true);
              setWordProgress('Loading Word engine...');
              try {
                  await document.fonts.ready;
                  // jsDelivr serves the package's own prebuilt browser bundle;
                  // esm.sh's re-bundle of docx has a broken Packer that hangs.
                  const docx = await import('https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm');
                  setWordProgress('Converting report...');
                  const children = await domToDocx(root, docx, { onProgress: setWordProgress, supplyChain, scores: SCORES });
                  setWordProgress('Assembling document...');
                  const doc = new docx.Document({
                      styles: {
                          default: {
                              document: { run: { font: 'Montserrat' } },
                              // Brand heading styles: without these Word's own
                              // Heading 1/2 (blue Calibri Light) would restyle
                              // the section titles used for the TOC outline.
                              heading1: { run: { font: 'Montserrat', color: '1A1B1F', bold: true } },
                              heading2: { run: { font: 'Montserrat', color: '333333', bold: true } },
                          },
                      },
                      // Refresh fields on open so the TOC gets page numbers
                      // and clickable links straight away.
                      features: { updateFields: true },
                      sections: [{
                          properties: {
                              page: {
                                  size: { width: 11906, height: 16838 },     // A4 portrait (twips)
                                  margin: { top: 680, right: 680, bottom: 680, left: 680 }, // 12mm
                              },
                          },
                          footers: {
                              default: new docx.Footer({
                                  children: [new docx.Paragraph({
                                      alignment: docx.AlignmentType.CENTER,
                                      children: [new docx.TextRun({ children: [docx.PageNumber.CURRENT], size: 16, color: '8A97AD', font: 'Montserrat' })],
                                  })],
                              }),
                          },
                          children,
                      }],
                  });

        /* ==========================================================================
         * MEASUREMENT SHEET — printable worksheet of every planned measurement.
         *
         * Printed BEFORE the trial is executed, so every cell is blank by default;
         * the "show entered values" toggle turns the same sheet into a filled record.
         *
         * Row order deliberately follows the flow as filled in — never a re-sort:
         *   1. Day     — the evaluation days in the order they appear in the editor
         *   2. Variant — the variant list order (Groups tab, movable with ↑/↓)
         *   3. ID      — sample number inside that variant
         *
         * Gas columns mirror the editor table: dropped entirely when no variant
         * uses MAP, and blanked per row for MHP/Open variants and for days after
         * the pack has been opened (retail simulation).
         * ========================================================================== */
        const MeasurementSheet = ({ clientInfo, project, groups, onBack, unitSystem = 'metric', lang = 'en', rt = {} }) => {
          const [isPrinting, setIsPrinting] = useState(false);
          const [showValues, setShowValues] = useState(false);

          const isMAPGroup = (g) => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP';
          const anyMAP = (groups || []).some(isMAPGroup);
          const totalDuration = parseFloat(project.totalDuration);
          const retailDays = parseFloat(project.retailOpenDays) || 0;
          const openDay = isNaN(totalDuration) ? NaN : totalDuration + retailDays;
          // After the pack is opened the atmosphere is ambient — no gas to measure.
          const isOpenedDay = (day) => !isNaN(totalDuration) && parseFloat(day) > totalDuration;

          const projIsBulk = ['Cube crate', 'Pallet'].includes(project.packagings?.[0]?.packagingType || project.packagingType || 'Retail');
          const weightUnit = globalConfig.getUnitLabel
            ? globalConfig.getUnitLabel('weight', unitSystem, projIsBulk)
            : (projIsBulk ? 'kg' : 'g');

          // Day list in entry order, de-duplicated across variants. Days that only
          // exist on a later variant are appended where they are first met.
          const dayList = [];
          (groups || []).forEach(g => (g.measurements || []).forEach(m => {
            const d = parseFloat(m.day);
            if (!isNaN(d) && !dayList.includes(d)) dayList.push(d);
          }));

          const baseDate = project.packingDate || project.date;
          const dateFor = (d) => {
            if (!baseDate) return '';
            const dt = new Date(baseDate);
            if (isNaN(dt.getTime())) return '';
            dt.setDate(dt.getDate() + d);
            return `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`;
          };
          const dayBadge = (d) => {
            if (d === 0) return rt.sheetDayPacking || 'Packing';
            if (retailDays > 0 && d === openDay) return rt.sheetDayRetail || 'Retail simulation (opened)';
            if (!isNaN(totalDuration) && d === totalDuration) return rt.sheetDayEnd || 'End of packed period';
            return '';
          };

          // Criteria come from the measurement itself when present (they may have
          // been edited per day); otherwise from the global assessment criteria.
          const criteriaFor = (m) => {
            const params = (m.qualityParams || []).filter(p => p && p.name);
            const source = params.length ? params : (project.criteria || []).map(c => ({ name: c, score: '', notes: '' }));
            return source.map(p => ({
              label: getI18nLabel(DEFAULT_CRITERIA_I18N, p.name, lang) || p.name,
              score: p.score,
              notes: p.notes
            }));
          };

          const samplesOf = (g, m) => (m.samples && m.samples.length)
            ? m.samples
            : Array.from({ length: g.specs?.sampleCount || 3 }, () => ({}));

          const rt = RT[lang] || RT['en'];

          // Layout switch for the measurement screens. A hook, so it must live at

          // --- DATA STATE ---

            companyName: '', street: '', houseNumber: '', addressExtra: '', zipCode: '', city: '', country: '', website: '',

          const [project, setProject] = useState({

            productName: '', productId: '', processingType: 'Whole', type: '', origin: '', company: '', contactName: '', contactEmail: '', contactRole: '', contactPhone: '', street: '', houseNumber: '', addressExtra: '', zipCode: '', city: '', country: '', employee: '', trialTarget: '', currentChallenge: '',
            rrO2: '', rrCO2: '', rrTemp: '', startWeight: '',

            packagings: [{ id: 1, packagingType: 'Retail', material: '', length: '', width: '', height: '', startWeight: '' }],
            // Product Characteristics (Section 3 in print preview / DEEL 6 editor)
            // — additive, do not affect existing flows when empty.

            date: new Date().toISOString().split('T')[0], packingDate: new Date().toISOString().split('T')[0],
            logo: BRAND.logos.default, clientLogo: null, startImage: null, coverImage: null,

            defectsMatrix: []

          const [supplyChain, setSupplyChain] = useState(JSON.parse(JSON.stringify(DEFAULT_SUPPLY_CHAIN)).map(s => ({...s, stage: (globalConfig.translateLabel ? globalConfig.translateLabel(s.stage, lang) : s.stage)})));

          useEffect(() => {
            if (globalConfig.retranslateStage) {
              setSupplyChain(prev => prev.map(s => ({ ...s, stage: globalConfig.retranslateStage(s.stage, lang) })));
            }

          const [groups, setGroups] = useState([
            {
              id: 1, name: 'Control',
              specs: { packaging: 'Punnets', material: 'BOPP', length: '', width: '', height: '', holes: '2', holeSize: '6000', startWeight: '', sampleCount: 3 },
              measurements: [{ day: 0, samples: [{id:1,o2:'20.9',co2:'0.03',weight:''}, {id:2,o2:'20.9',co2:'0.03',weight:''}, {id:3,o2:'20.9',co2:'0.03',weight:''}], quality: 10, notes: 'Start quality excellent', images: [], qualityParams: [], evaluateQuality: true }],
              predictedImage: null
            }
          ]);

          // That seed row is a PLACEHOLDER: ambient air (20.9 / 0.03) and an
          // example note, prefilled so a new report opens with something sensible.
          // It is not a measurement anybody took, and the board-autosave below
          // must never report it as one — doing so stamped a single
          // "Measurement P+0, done" action on the card, which the board renders as
          // "all measurements done" for a trial where nothing has been measured.
          // A measurements fingerprint (measurements only, NOT specs) tells the
          // two apart: applying an intake product rewrites specs and must not
          // count, while loading a real report or typing a measurement must.
          const measurementsFingerprint = (gs) => JSON.stringify((gs || []).map(g => g.measurements || []));
          const seedMeasurementsRef = useRef(null);
          const reportHasMeasurementsRef = useRef(false);
          useEffect(() => {
            if (seedMeasurementsRef.current === null) { seedMeasurementsRef.current = measurementsFingerprint(groups); return; }
            if (!reportHasMeasurementsRef.current && measurementsFingerprint(groups) !== seedMeasurementsRef.current) {
              reportHasMeasurementsRef.current = true;
            }
          }, [groups]);

          // Keep the selected variant pointing at a variant that actually exists.
          // activeGroupId is seeded with 1 on the assumption that the built-in
          // "Control" group is always there, but a LOADED report can start at any
          // id — delete the first variant once (here or in the proposal) and the
          // saved ids begin at 2. Nothing reconciled the two, and the entire
          // right-hand column of Variant Results is behind
          // `const activeG = groups.find(g => g.id === activeGroupId); if (!activeG) return null;`
          // So the variant list on the left kept listing the variants while the
          // panel next to it — packaging specs, the Measurements heading, Add day,
          // the measurement table with its "enter measurement" and "add photos"
          // buttons, even the friendly "no measurement days yet" notice — rendered
          // as an empty white card, with no error to explain it. Clicking a variant
          // fixed it, which is what made this look intermittent.
          useEffect(() => {
            if (!groups.length) return;
            if (!groups.some(g => g.id === activeGroupId)) setActiveGroupId(groups[0].id);
          }, [groups, activeGroupId]);

          const [analysis, setAnalysis] = useState({ graphNotes: '', conclusion: '', variantConclusions: {}, recommendation: 'retest', nextSteps: [], temperatureImages: [], temperatureLabel: '', showGasSection: null, showHubPredictions: null, showWeightLoss: null, generalObservations: '', targetAchieved: null, targetEvaluation: '' });
          const [newStep, setNewStep] = useState('');
          const [newStepVariant, setNewStepVariant] = useState('general');
          const [newCriteria, setNewCriteria] = useState('');

          const calcUnpackingDate = () => {
            const baseDate = project.packingDate || project.date;
            const duration = parseInt(project.totalDuration) || 0;
            if (baseDate && duration) {
               const d = new Date(baseDate);
               d.setDate(d.getDate() + duration);
               const day = String(d.getDate()).padStart(2, '0');
               const month = String(d.getMonth() + 1).padStart(2, '0');
               const year = d.getFullYear();
               return `${day}/${month}/${year}`; 
            }
            return '-';
          };
          
          const calcRetailDate = () => {
            const baseDate = project.packingDate || project.date;
            const duration = parseInt(project.totalDuration) || 0;
            const retailDays = parseInt(project.retailOpenDays) || 0;
            if (baseDate && (duration || retailDays)) {
               const d = new Date(baseDate);
               d.setDate(d.getDate() + duration + retailDays);
               const day = String(d.getDate()).padStart(2, '0');
               const month = String(d.getMonth() + 1).padStart(2, '0');
               const year = d.getFullYear();
               return `${day}/${month}/${year}`; 
            }
            return '-';
          };

          // --- HANDLERS ---
          const handleClientChange = (field, value) => { setClientInfo(prev => ({ ...prev, [field]: value })); };

          // Multi-contact helpers — mirror intake/proposal so the same

          //
          // When editing the primary contact (contacts[0]), keep the legacy
          // flat shadow fields (`contactName`, `role`, `email`, `phone`,
          // `phoneDirect`, `phoneWork`) in sync. The print/PDF preview rendering
          // and legacy `project.contact*` export fields still read those flats,
          // so without this sync they would show stale data after an edit.
          const syncFlatFromPrimaryContact = (prev, primary) => {
             if (!primary) return prev;
             return {
                ...prev,
                contactName: primary.name || '',
                role: primary.role || '',
                email: primary.email || '',
                phone: primary.phoneDirect || primary.phoneWork || '',
                phoneDirect: primary.phoneDirect || '',
                phoneWork: primary.phoneWork || ''
             };
          };

          const handleContactChange = (id, field, value) => {
             setClientInfo(prev => {
                const newContacts = (prev.contacts || []).map(c => c.id === id ? { ...c, [field]: value } : c);
                const primaryEdited = prev.contacts && prev.contacts[0] && prev.contacts[0].id === id;
                const next = { ...prev, contacts: newContacts };
                return primaryEdited ? syncFlatFromPrimaryContact(next, newContacts[0]) : next;
             });
          };

          const addContact = () => {
             setClientInfo(prev => ({
                 ...prev,
                 contacts: [...(prev.contacts || []), { id: Date.now(), name: '', role: '', email: '', phoneDirect: '', phoneWork: '' }]
             }));
          };

          const removeContact = (id) => {
             setClientInfo(prev => {
                const newContacts = (prev.contacts || []).filter(c => c.id !== id);
                const primaryRemoved = prev.contacts && prev.contacts[0] && prev.contacts[0].id === id;
                const next = { ...prev, contacts: newContacts };
                // Promote the new primary into the flat shadow fields.
                return primaryRemoved ? syncFlatFromPrimaryContact(next, newContacts[0]) : next;
             });
          };

          // Metric/Imperial toggle — converts startWeight (project & per-group)
          // and supply chain temperatures so visible values stay correct.
          const handleUnitToggle = () => {
            const toImperial = unitSystem === 'metric';
            const newSys = toImperial ? 'imperial' : 'metric';
            setProject(p => ({
              ...p,
              startWeight: convertValue(p.startWeight, 'weight', false, toImperial)
            }));
            setSupplyChain(chain => chain.map(s => ({
              ...s,
              tempStart: convertValue(s.tempStart, 'temp', false, toImperial),
              tempEnd:   convertValue(s.tempEnd,   'temp', false, toImperial)
            })));
            setGroups(gs => gs.map(g => {
              const isBulk = g.specs?.packaging === 'Cube crate' || g.specs?.packaging === 'Pallet';

                specs: {

                }
              };
            }));
            setUnitSystem(newSys);
          };

          const handleImgUpload = async (e, field, isGroup = false) => {
            const f = e.target.files[0];
            e.target.value = null;
            if (!f) return;
            const { dataUrl } = await globalConfig.readImageFile(f);
            if (isGroup) setGroups(p => p.map(g => g.id === activeGroupId ? { ...g, predictedImage: dataUrl } : g));
            else if (field === 'clientLogo') setClientInfo(c => ({ ...c, logo: dataUrl }));
            else setProject(p => ({ ...p, [field]: dataUrl }));
          };

          const handlePredictedImageUpload = async (e, groupId) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const { dataUrl } = await globalConfig.readImageFile(file);
            const group = groups.find(g => g.id === groupId);
            if (group && group.predictedImage) {
              setPendingImageReplace({ groupId: groupId, result: dataUrl });
            } else {
              setGroups(prev => prev.map(g => g.id === groupId ? { ...g, predictedImage: dataUrl } : g));
            }

            const p = parseInt(packedStr) || 0;
            const o = parseInt(openStr) || 0;
            return currentGroups.map(g => {
              const newM = [...g.measurements];
              const sCount = g.specs.sampleCount || 3;
              const createMeas = (day, notes) => ({
                 day, samples: Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: '', co2: '', weight: '', initialWeight: '' })), quality: 9, notes: notes, images: [], qualityParams: [], evaluateQuality: true
              });
              
              if (p > 0 && !newM.find(m => parseFloat(m.day) === p)) {
                 newM.push(createMeas(p, 'End Packing'));
              }
              if (p > 0 && o > 0) {
                 const openDay = p + o;
                 if (!newM.find(m => parseFloat(m.day) === openDay)) {
                    newM.push(createMeas(openDay, 'Retail Simulation (Open)'));
                 }
              }
              newM.sort((a,b) => parseFloat(a.day) - parseFloat(b.day));

            // Rebuild canonical contacts[] so report exports round-trip cleanly.
            const normalizedClientInfo = globalConfig.buildContactsArray

            const primaryContact = (normalizedClientInfo.contacts && normalizedClientInfo.contacts[0]) || {};

            return {
              isPerfoTecReport: true,
              schemaVersion: globalConfig.SCHEMA_VERSION || '2.1',
              appVersion: globalConfig.APP_VERSION || '',
              exportDate: new Date().toISOString(),
              language: lang,
              unitSystem: unitSystem,
              project: { ...project, company: clientInfo.companyName, street: clientInfo.street, houseNumber: clientInfo.houseNumber, addressExtra: clientInfo.addressExtra, zipCode: clientInfo.zipCode, city: clientInfo.city, country: clientInfo.country, contactName: primaryContact.name || '', contactRole: primaryContact.role || '', contactEmail: primaryContact.email || '', contactPhone: primaryContact.phoneDirect || primaryContact.phoneWork || '' },
              clientInfo: normalizedClientInfo, supplyChain, groups, analysis
            };
          };

          const exportData = async () => {
            const data = buildExportData();
            const jsonString = JSON.stringify(data, null, 2);
            const defaultName = `perfotec_report_${project.productName ? project.productName.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 'data'}.json`;
            if (globalConfig.exportJSON) {
                globalConfig.exportJSON(data, defaultName);
            } else {
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

            }
          };

          // multi-product modal flow (declared at component scope so they can
          // be invoked from confirmProductSelection too).
          const reportExtractPrimaryContact = globalConfig.extractPrimaryContact
            ? globalConfig.extractPrimaryContact.bind(globalConfig)
