              }
            }

            // Horizontal flex holding visual blocks -> one borderless row
            // (keeps e.g. the two cover logos side by side).
            if (cs.display === 'flex' && (cs.flexDirection === 'row' || cs.flexDirection === 'row-reverse') && ctx.tableDepth < 2) {
              const complex = children.length >= 2 && children.some((c) => c.tagName === 'IMG' || c.querySelector('img, svg, table'));
              if (complex) {
                flushBreak(out);
                ctx.tableDepth++;
                // Each cell as wide as its block is on screen: a chart beside
                // a narrow table no longer gets half the page.
                const total = children.reduce((sum, c) => sum + c.getBoundingClientRect().width, 0) || 1;
                const t = await layoutTable([children.map((c) => ({ el: c, span: 1, pct: Math.max(5, Math.round((c.getBoundingClientRect().width / total) * 100)) }))], children.length);
                ctx.tableDepth--;
                out.push(t);
                out.push(new Paragraph({ children: [], spacing: { after: 80 } }));
                return;
              }
            }

            await walkInto(el, out);
          };

          // Consecutive text and inline elements form ONE paragraph: "We found
          // <b>good</b> results" came out as three paragraphs.
          const INLINE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'SPAN', 'A', 'SUB', 'SUP', 'SMALL', 'MARK', 'CODE', 'BR', 'LABEL', 'FONT']);
          const BLOCK_INSIDE = 'div, p, table, ul, ol, img, svg, h1, h2, h3, h4, h5, h6, li';
          const isInlineNode = (n) => n.nodeType === 3 || (n.nodeType === 1 && INLINE_TAGS.has(n.tagName) && !n.querySelector(BLOCK_INSIDE));
          const walkInto = async (el, out) => {
            let line = [];
            const flushLine = () => {
              if (line.length && hasText(line)) {
                const runs = runsOfNodes(line, el);
                if (runs.length) out.push(mkPara({ children: runs, spacing: { after: ctx.inCell ? 20 : 60 } }));
              }
              line = [];
            };
            for (const n of el.childNodes) {
              if (isInlineNode(n)) { if (n.nodeType !== 1 || !skip(n)) line.push(n); continue; }
              flushLine();
              if (n.nodeType === 1) await walkEl(n, out);
            }
            flushLine();
          };

          const out = [];
          await walkInto(root, out);
          out.failedImages = ctx.failedImages;
          return out;
        };

        // The report format this version writes. A file with a higher number was
        // written by a newer version: this page shows it but does not autosave it
        // (colleagues can run an older copy of the tool).
        const REPORT_FORMAT = 3;
        // This page's own mark in the revisions it writes (see runSave).
        const SESSION_ID = Math.random().toString(36).slice(2, 8);

        // The Word library, fetched once per page and shared. The preview starts
        // it when it opens, so a blocked or failing CDN is known before someone
        // clicks "Download Word" at a deadline; a failed fetch can be retried.
        const DOCX_URL = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm';
        let docxPromise = null;
        const loadDocx = () => docxPromise || (docxPromise = import(DOCX_URL).catch(err => { docxPromise = null; throw err; }));

        // The data of the last editor render, for the error screen (set by App).
        let latestReportExport = null;

        // --- COMPONENTS ---

        // A field that applies its value only when the user is done with it
        // (blur or Enter), never per keystroke. Fields whose change adds or
        // removes measurement rows must not act on the "" or "1" on the way to
        // typing "14". Escape puts the stored value back; the mouse wheel and
        // the arrow keys do not step the number.
        const CommitInput = ({ value, onCommit, ...rest }) => {
          const stored = value == null ? '' : String(value);
          const [draft, setDraft] = useState(null);
          const commit = () => {
            if (draft === null) return;
            const v = draft;
            setDraft(null);
            if (v !== stored) onCommit(v);
          };
          return (
            <input {...rest} value={draft !== null ? draft : stored}
              onChange={e => setDraft(e.target.value)}
              onBlur={commit}
              onWheel={e => e.currentTarget.blur()}
              onKeyDown={e => {
                if (e.key === 'Enter') { e.preventDefault(); commit(); }
                else if (e.key === 'Escape') setDraft(null);
                else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
              }} />
          );
        };

        // Shows `value` (stored metric) in the chosen unit system and hands back
        // metric. While the field has focus it shows what is typed, so "5." can
        // become "5.5". A field nobody edits is never converted, so it cannot drift.
        const UnitInput = ({ value, onValue, kind, bulk = false, unitSystem = 'metric', ...rest }) => {
          const [draft, setDraft] = useState(null);
          const shown = String(shownValue(value, kind, bulk, unitSystem));
          return (
            <input {...rest} type="text" inputMode="decimal" value={draft !== null ? draft : shown}
              onFocus={() => setDraft(shown)}
              onBlur={() => setDraft(null)}
              onChange={e => {
                const raw = e.target.value.replace(/,/g, '.');
                setDraft(raw);
                onValue(metricValue(raw.trim(), kind, bulk, unitSystem));
              }} />
          );
        };

        const RichTextEditor = ({ value, onChange, placeholder }) => {
          const editorRef = useRef(null);

          useEffect(() => {
            if (editorRef.current && value !== editorRef.current.innerHTML) {
              editorRef.current.innerHTML = value || '';
            }
          }, [value]);

          const handleInput = () => {
            if (editorRef.current) onChange(editorRef.current.innerHTML);
          };

          const execCmd = (cmd) => {
            document.execCommand(cmd, false, null);
            editorRef.current.focus();
            handleInput();
          };

          return (
            <div className="border border-slate-300 rounded-xl overflow-hidden bg-white focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/50 transition flex flex-col h-full min-h-[140px] shadow-sm">
              <div className="bg-slate-50 border-b border-slate-200 p-1.5 flex gap-1.5 shrink-0">
                <button type="button" onClick={() => execCmd('bold')} className="p-2 hover:bg-slate-200 rounded-lg text-slate-700 w-9 flex justify-center items-center transition-colors"><Bold size={18}/></button>
                <button type="button" onClick={() => execCmd('italic')} className="p-2 hover:bg-slate-200 rounded-lg text-slate-700 w-9 flex justify-center items-center transition-colors"><Italic size={18}/></button>
                <button type="button" onClick={() => execCmd('underline')} className="p-2 hover:bg-slate-200 rounded-lg text-slate-700 w-9 flex justify-center items-center transition-colors"><Underline size={18}/></button>
                <div className="w-px bg-slate-300 mx-1 my-1"></div>
                <button type="button" onClick={() => execCmd('insertUnorderedList')} className="p-2 hover:bg-slate-200 rounded-lg text-slate-700 w-9 flex justify-center items-center transition-colors"><List size={18}/></button>
              </div>
              <div
                ref={editorRef}
                contentEditable
                onInput={handleInput}
                onBlur={handleInput}
                className="p-5 outline-none rich-text-editor text-sm font-sans flex-1 overflow-y-auto min-h-[100px] leading-relaxed pdf-rich-text"
                data-placeholder={placeholder}
              />
            </div>
          );
        };

        const SupplyChainFlow = ({ chain, tempUnit = '°C' }) => {
          if (!chain || chain.length === 0) return null;
          let cumMin = 0, cumMax = 0;
          
          const chunkSize = 6;
          const rows = [];
          for (let i = 0; i < chain.length; i += chunkSize) {
            rows.push(chain.slice(i, i + chunkSize));
          }

          return (
            <div className="flex flex-col w-full font-sans">
              {rows.map((row, rowIdx) => (
                <div key={rowIdx} className="flex w-full gap-1 items-start justify-start mt-4 mb-2 pb-2">
                  {row.map((step, idx) => {
                    const globalIdx = rowIdx * chunkSize + idx;
                    const minD = parseFloat(step.daysStart) || 0;
                    const maxD = step.daysEnd ? parseFloat(step.daysEnd) : minD;
                    cumMin += minD; cumMax += maxD;
                    const shownMin = round1(cumMin), shownMax = round1(cumMax);
                    const cumStr = shownMin === shownMax ? `${shownMin}` : `${shownMin}-${shownMax}`;

                    return (
                      <React.Fragment key={globalIdx}>
                        {idx > 0 && <div className="h-20 flex items-center justify-center shrink-0 w-2 lg:w-4"><ChevronRight size={16} className="text-gray-300" /></div>}
                        <div className="flex flex-col items-center flex-1 min-w-0" style={{ maxWidth: '16%', flexBasis: '16%' }}>
                          <div className="w-full flex flex-col items-center bg-white border border-gray-200 rounded-lg shadow-sm p-1.5 relative min-h-[5.5rem]">
                             <div className="absolute top-0 left-0 w-full h-1" style={{backgroundColor: globalIdx % 2 === 0 ? BRAND.colors.green : BRAND.colors.blue}}></div>
                             <div className="bg-gray-50 p-1.5 rounded-full mb-1 flex-shrink-0 mt-1">{getStageIcon(step.stage || '')}</div>
                             <div className="text-[8px] font-bold text-center uppercase mb-1 flex-grow flex items-center justify-center leading-tight w-full break-words px-1 overflow-hidden text-ellipsis line-clamp-2">{step.stage || '-'}</div>
                             <div className="w-full border-t border-dotted border-gray-200 my-0.5"></div>
                             <div className="flex flex-col justify-center w-full text-[8px] gap-0.5">
                                <span className="flex items-center justify-center gap-0.5 font-bold text-gray-700 whitespace-nowrap"><Thermometer size={8} className="text-red-500"/>{formatRange(step.tempStart, step.tempEnd, tempUnit)}</span>
                                <span className="flex items-center justify-center gap-0.5 text-gray-500 whitespace-nowrap"><Clock size={8}/>{formatRange(step.daysStart, step.daysEnd, 'd')}</span>
                             </div>
                             <div className="mt-1 bg-blue-50 text-blue-700 border border-blue-100 text-[7px] font-bold px-1 rounded whitespace-nowrap w-full text-center">∑ {cumStr}d</div>
                          </div>
                          <div className="h-8 w-full flex justify-center items-start mt-1 relative">
                              {step.action === 'pack' && <div className="flex flex-col items-center"><div className="bg-green-100 text-green-700 rounded-full p-0.5 border border-green-200"><ArrowDown size={12} /></div><span className="text-[7px] font-bold text-green-700 uppercase mt-0.5">Packed</span></div>}
                              {step.action === 'unpack' && <div className="flex flex-col items-center"><div className="bg-red-100 text-red-700 rounded-full p-0.5 border border-red-200"><ArrowUp size={12} /></div><span className="text-[7px] font-bold text-red-700 uppercase mt-0.5">Opened</span></div>}
                          </div>
                        </div>
                      </React.Fragment>
                    )
                  })}
                </div>
              ))}
            </div>
          );
        };

        // showCaption: the explanation is the same for every variant, so the list
        // of charts carries it once, under the last one.
        const VariantGasChart = ({ group, packedDays, sharedMaxDay, sharedMaxY, showCaption = true, valuesBelow = false }) => {
          if (!group || !group.measurements) return null;
          // The plot keeps its size; the frame around it is tight. Top: just room
          // for the highest label; bottom: the day labels; right: half a label.
          const width = 350; const padding = 30; const padTop = 10; const padBottom = 24; const padRight = 18;
          const height = 140 + padTop + padBottom;

          const pDays = parseFloat(packedDays);
          const filteredMeasurements = isNaN(pDays) || pDays === 0 ? (group.measurements || []) : (group.measurements || []).filter(m => parseFloat(m.day) <= pDays);
          const data = [...filteredMeasurements].sort((a,b) => parseFloat(a.day) - parseFloat(b.day));

          // One series per gas, from the days on which that gas was measured.
          // A day without a reading used to be plotted as 0%, so the line fell
          // to the axis after the last measurement (or dipped between two real
          // ones); it now ends at the last reading.
          const series = (key) => data.map(d => ({ day: d.day, value: gasReading(d.samples, key) })).filter(p => p.value !== null);
          const o2 = series('o2'), co2 = series('co2');

          if(o2.length === 0 && co2.length === 0) return <div className="no-print flex-1 border border-slate-200 rounded-2xl bg-slate-50 p-6 font-sans w-full h-full flex flex-col items-center justify-center text-slate-400 text-sm italic shadow-sm">No packed gas data: {group.name || 'Variant'}</div>;

          // A shared x-domain (max day across ALL variants) keeps every gas
          // chart on an identical time scale, so charts can be compared
          // side by side. Falls back to this variant's own range.
          const maxDay = sharedMaxDay || axisEndDay([...o2, ...co2].map(p => parseFloat(p.day) || 0));
          // The %-axis fits the data (see gasAxisMax); shared across the variants
          // like the time axis, so the charts stay comparable. A reading outside
          // 0-100 % is a typing error (flagged above the charts) and is drawn at
          // the edge rather than off the chart.
          const maxY = sharedMaxY || gasAxisMax([...o2, ...co2].map(p => parseFloat(p.value)));
          const getX = (day) => padding + (parseFloat(day) / maxDay) * (width - padding - padRight);
          const getY = (val) => height - padBottom - (Math.min(maxY, Math.max(0, parseFloat(val))) / maxY) * (height - padTop - padBottom);
          const pointsOf = (pts) => pts.map(p => `${getX(p.day)},${getY(p.value)}`).join(' ');
          const pointsO2 = pointsOf(o2);
          const pointsCO2 = pointsOf(co2);

          // X-axis labels at evenly spaced "nice" intervals (max ~7 ticks)
          // instead of one label per data point — dense measurement schedules
          // (P+0, P+1, P+2, ...) would otherwise overlap and become unreadable.
          const tickStep = [1, 2, 5, 7, 10, 14, 21, 30, 60, 90].find(s => maxDay / s <= 7) || Math.ceil(maxDay / 7);
          const xTicks = [];
          for (let t = 0; t <= maxDay; t += tickStep) xTicks.push(t);

          // The measured values beside the chart, so one card holds the whole
          // story of a variant and no separate overview table is needed: the same
          // averages the lines plot, one row per measured day.
          const readings = data
            .map(d => ({ day: parseFloat(d.day), o2: gasReading(d.samples, 'o2'), co2: gasReading(d.samples, 'co2') }))
            .filter(r => !isNaN(r.day) && (r.o2 !== null || r.co2 !== null));
          const dense = readings.length > 12;
          // In print tighter rows, so the table is no taller than the chart and
          // three cards still fit on a page.
          const cellY = dense ? 'py-px' : 'py-[3px] print:py-px';
          const valuesTable = (
            <table className={`border-collapse leading-tight ${dense ? 'text-[9px]' : 'text-[10px]'}`}>
              <thead>
                <tr className="text-[9px] uppercase tracking-wider text-slate-500 border-b border-slate-200">
                  <th className="text-left py-1 print:py-0.5 pr-2 font-bold">Day</th>
                  <th className="text-right py-1 print:py-0.5 px-1.5 font-bold" style={{ color: BRAND.colors.blue }}>O₂ %</th>
                  <th className="text-right py-1 print:py-0.5 pl-1.5 font-bold" style={{ color: BRAND.colors.green }}>CO₂ %</th>
                </tr>
              </thead>
              <tbody>
                {readings.map(r => (
                  <tr key={r.day} className="border-b border-slate-100">
                    <td className={`${cellY} pr-2 font-bold text-slate-600 whitespace-nowrap`}>{formatDay(r.day)}</td>
                    <td className={`${cellY} px-1.5 text-right font-bold tabular-nums`} style={{ color: BRAND.colors.blue }}>{r.o2 ?? '–'}</td>
                    <td className={`${cellY} pl-1.5 text-right font-bold tabular-nums`} style={{ color: BRAND.colors.green }}>{r.co2 ?? '–'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          );
          // Beside a HUB prediction the card is half as wide: the values go below
          // the chart instead, a row per gas, eight days per line.
          const valuesRows = [];
          for (let i = 0; i < readings.length; i += 8) valuesRows.push(readings.slice(i, i + 8));
          const valuesBelowTable = (
            <div className="mt-2 space-y-1">
              {valuesRows.map((part, pi) => (
                <table key={pi} className="w-full table-fixed border-collapse text-[9px]">
                  <tbody>
                    <tr className="text-slate-500 font-bold border-b border-slate-100">
                      <td className="w-10 pr-1 uppercase tracking-wider">Day</td>
                      {part.map(r => <td key={r.day} className="text-center whitespace-nowrap">{formatDay(r.day)}</td>)}
                    </tr>
                    <tr className="font-bold" style={{ color: BRAND.colors.blue }}>
                      <td className="pr-1">O₂ %</td>
                      {part.map(r => <td key={r.day} className="text-center tabular-nums">{r.o2 ?? '–'}</td>)}
                    </tr>
                    <tr className="font-bold" style={{ color: BRAND.colors.green }}>
                      <td className="pr-1">CO₂ %</td>
                      {part.map(r => <td key={r.day} className="text-center tabular-nums">{r.co2 ?? '–'}</td>)}
                    </tr>
                  </tbody>
                </table>
              ))}
            </div>
          );

          return (
            <div className="flex-1 border border-slate-200 rounded-2xl bg-white px-5 pt-4 pb-3 shadow-sm font-sans w-full h-full flex flex-col">
              <h5 className="text-center font-extrabold text-sm mb-2 text-slate-800 border-b border-slate-100 pb-2">Actual Atmosphere Development: {group.name || 'Variant'}</h5>
              <div className={valuesBelow ? '' : 'flex items-center gap-5'}>
                <div className={valuesBelow ? '' : 'flex-1 min-w-0'}>
                  {/* In print at most 210 px high, so three cards fit on a page;
                      the drawing keeps its proportions, on screen nothing changes. */}
                  <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto print:max-h-[210px]">
                    {gasAxisTicks(maxY).map(val => (
                      <g key={val}>
                        <line x1={padding} y1={getY(val)} x2={width - padRight} y2={getY(val)} stroke="#F2F5F9" strokeWidth="1.5" />
                        <text x={padding - 5} y={getY(val) + 3} textAnchor="end" fontSize="9" fill="#8A97AD" fontWeight="600">{val}%</text>
                      </g>
                    ))}
                    {xTicks.map(t => (
                      <g key={`tick-${t}`}>
                        <line x1={getX(t)} y1={height - padBottom} x2={getX(t)} y2={height - padBottom + 4} stroke="#CFD9E6" strokeWidth="1.5" />
                        <text x={getX(t)} y={height - 6} textAnchor="middle" fontSize="10" fill="#66707F" fontWeight="bold">{formatDay(t)}</text>
                      </g>
                    ))}
                    <polyline points={pointsO2} fill="none" stroke={BRAND.colors.blue} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                    <polyline points={pointsCO2} fill="none" stroke={BRAND.colors.green} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                    {o2.map((p, i) => <circle key={'o2-' + i} cx={getX(p.day)} cy={getY(p.value)} r="4" fill="#ffffff" stroke={BRAND.colors.blue} strokeWidth="2" />)}
                    {co2.map((p, i) => <circle key={'co2-' + i} cx={getX(p.day)} cy={getY(p.value)} r="4" fill="#ffffff" stroke={BRAND.colors.green} strokeWidth="2" />)}
                  </svg>
                  <div className="flex justify-center gap-6 mt-1.5 text-xs">
                    <span className="flex items-center gap-1.5 font-extrabold" style={{color: BRAND.colors.blue}}><div className="w-3 h-3 rounded-full" style={{backgroundColor: BRAND.colors.blue}}></div> O₂</span>
                    <span className="flex items-center gap-1.5 font-extrabold" style={{color: BRAND.colors.green}}><div className="w-3 h-3 rounded-full" style={{backgroundColor: BRAND.colors.green}}></div> CO₂</span>
                  </div>
                </div>
                {valuesBelow ? valuesBelowTable : <div className="shrink-0 w-[30%]">{valuesTable}</div>}
              </div>
              {showCaption && <p className="text-[10px] text-slate-500 mt-2 leading-relaxed text-center italic">Average measured O₂ (blue) and CO₂ (green) concentrations inside the packaging over time, with the measured values per day beside each chart. A stable atmosphere within the product's optimal window shows the perforation is matched to the product's respiration rate. Time axis: days after packing (P+X), identical scale for all variants, up to the last measured day.</p>}
            </div>
          );
        };

        // groups: the variants this chart draws (a block of them when there are
        // many); axisGroups: all variants, so every block shares the days, the
        // scale and each variant's colour. part: "Variants 6–10 of 30".
        const WeightLossChart = ({ groups, axisGroups, part = '', showCaption = true, placeholder = true }) => {
          if (!groups || groups.length === 0) return null;
          const scaleGroups = axisGroups && axisGroups.length ? axisGroups : groups;
          const colorOf = (g, i) => { const gi = scaleGroups.indexOf(g); return CHART_COLORS[(gi >= 0 ? gi : i) % CHART_COLORS.length].stroke; };
          const width = 600; const height = 250; const padding = 40;
          const allDays = Array.from(new Set(scaleGroups.flatMap(g => (g.measurements || []).map(m => parseFloat(m.day))))).sort((a,b) => a-b);
          const lossOf = (g, d) => {
            const meas = (g.measurements || []).find(m => parseFloat(m.day) === d);
            const day0 = (g.measurements || []).find(m => parseFloat(m.day) === 0);
            return getWeightLoss(meas?.samples, day0?.samples);
          };
          // Only days on which something was weighed: an unweighed day drew an
          // empty slot that read as 0 % loss.
          const days = allDays.filter(d => !isNaN(d) && d > 0 && scaleGroups.some(g => lossOf(g, d) !== null));
          if (days.length === 0) return placeholder ? <div className="no-print text-center text-slate-400 italic p-8 bg-slate-50 border border-slate-200 rounded-3xl shadow-sm">No weight loss data available yet.</div> : null;

          const maxLoss = Math.max(...scaleGroups.flatMap(g => days.map(d => parseFloat(lossOf(g, d)) || 0)), 1); 
          
          const yAxisMax = Math.ceil(maxLoss * 1.2); 
          const slotWidth = (width - 2 * padding) / days.length;
          const barGroupWidth = slotWidth * 0.6;
          const barWidth = barGroupWidth / groups.length;
          const getX = (dayIndex) => padding + (dayIndex * slotWidth);
          const getY = (val) => height - padding - (val / yAxisMax) * (height - 2 * padding);

          return (
            <div className="w-full border border-slate-200 rounded-3xl bg-white p-8 font-sans shadow-sm">
              <h4 className="text-center font-extrabold mb-6 uppercase text-sm tracking-wider text-slate-800 border-b border-slate-100 pb-4">Weight Loss per Variant (%){part ? ' · ' + part : ''}</h4>
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto mt-2">
                {[0, Math.max(yAxisMax/2, 0.1), Math.max(yAxisMax, 0.2)].map(val => (
                   <g key={val}>
                     <line x1={padding} y1={getY(val)} x2={width-padding} y2={getY(val)} stroke="#F2F5F9" strokeWidth="2" strokeDasharray="4"/>
                     <text x={padding - 10} y={getY(val) + 4} textAnchor="end" fontSize="11" fill="#8A97AD" fontWeight="600">{val.toFixed(1)}%</text>
                   </g>
                ))}
                {days.map((day, dayIdx) => (
                  <g key={day}>
                    <text x={getX(dayIdx) + (slotWidth / 2)} y={height - 10} textAnchor="middle" fontSize="12" fill="#4A4F59" fontWeight="bold">{formatDay(day)}</text>
                    {groups.map((g, grpIdx) => {
                       const raw = lossOf(g, day);
                       if (raw === null) return null;
                       // A gain (negative loss) has no bar; it is flagged before export.
                       const loss = Math.max(0, parseFloat(raw) || 0);
                       
                       const groupStartX = getX(dayIdx) + (slotWidth - barGroupWidth) / 2;
                       return (
                         <rect 
                            key={grpIdx}
                            x={groupStartX + (grpIdx * barWidth)}
                            y={getY(loss)}
                            width={Math.max(barWidth - Math.min(4, barWidth * 0.25), 2)}
                            height={height - padding - getY(loss)}
                            fill={colorOf(g, grpIdx)}
                            rx="4"
                         />
                       );
                    })}
                  </g>
                ))}
              </svg>
              <div className="flex flex-wrap justify-center gap-6 mt-8">
                {groups.map((g, idx) => (
                  <div key={g.id} className="flex items-center gap-2 text-sm font-extrabold text-slate-700">
                    <span className="text-lg leading-none" style={{ color: colorOf(g, idx) }}>{'● '}</span>
                    {g.name || 'Variant'}
                  </div>
                ))}
              </div>
              {showCaption && <p className="text-[10px] text-slate-500 mt-4 leading-relaxed text-center italic">Average weight loss per variant at each evaluation day, relative to the initial weight of the measured samples. Lower weight loss means less dehydration and more saleable weight at the end of the chain. Time axis: days after packing (P+X), consistent with the atmosphere charts.{part ? ' With many variants the chart is split into groups on one scale.' : ''}</p>}
            </div>
          );
        };

        // Line chart of the AVERAGE quality per variant over time: per day the
        // mean of the scored criteria (measQuality — the same number the
        // measurement table, the summary table and the export carry). Same
        // variant colours and day-based time axis as the other report charts; the
        // dashed line at score 7 marks the acceptance limit from the score scale.
        //
        // Variants often score identically: they come from one batch, so day 0
        // usually matches, and on a 1-10 scale two treatments can match exactly.
        // Drawn one over the other, the later line covered the earlier one
        // completely — that is how Control vanished while the legend still
        // listed it. Every point stays where it is; a segment shared by k variants
        // is drawn as k alternating dashes, one colour each, and a shared point as
        // concentric rings. Markers go in two passes (discs, then rings) so no
        // marker can cover another. Presentation attributes only, so the Word
        // export's SVG serialisation keeps all of it.
        // groups: the variants this chart draws (a block when there are many);
        // axisGroups: all variants, so every block shares one time axis and each
        // variant keeps its colour. part: "Variants 6–10 of 30".
        const QualityLineChart = ({ groups, axisGroups, part = '', showCaption = true, criteriaBelow = true }) => {
          const width = 600; const height = 260; const padding = 40;
          // The right margin holds the acceptance-limit label, beside the plot:
          // drawn inside it, the label ran through the lines of the last days.
          const padRight = 80;
          const plotRight = width - padRight;
          const scaleGroups = axisGroups && axisGroups.length ? axisGroups : groups;
          const toSeries = (g, i) => {
            const gi = scaleGroups.indexOf(g);
            const idx = gi >= 0 ? gi : i;
            return {
              name: g.name || 'Variant', idx,
              color: CHART_COLORS[idx % CHART_COLORS.length].stroke,
              points: (g.measurements || [])
                .map(m => { const q = measQuality(m); return { day: parseFloat(m.day), score: q ? q.value : null, legacy: !!(q && q.legacy) }; })
                .filter(p => p.score !== null && !isNaN(p.day))
                .sort((a, b) => a.day - b.day)
            };
          };
          const series = groups.map(toSeries).filter(s => s.points.length > 0);
          if (series.length === 0) return null;

          const axisSeries = scaleGroups === groups ? series : scaleGroups.map(toSeries);
          const maxDay = axisEndDay(axisSeries.flatMap(s => s.points.map(p => p.day)));
          const getX = (day) => padding + (day / maxDay) * (plotRight - padding);
          const getY = (score) => height - padding - (score / 10) * (height - 2 * padding);
          const tickStep = [1, 2, 5, 7, 10, 14, 21, 30, 60, 90].find(s => maxDay / s <= 7) || Math.ceil(maxDay / 7);
          const xTicks = [];
          for (let t = 0; t <= maxDay; t += tickStep) xTicks.push(t);

          // Which variants share each point and each stretch of line. Every line
          // is cut at every plotted day of ANY variant: a variant that skipped a
          // day (evaluation off, criteria left blank) otherwise ran one long
          // segment straight over another variant's two, and hid it just the same.
          const DASH = 8, R0 = 4, RING = 2.5;
          const r6 = (n) => Math.round(n * 1e6) / 1e6; // interpolated scores: no float noise in the key
          const ptKey = (p) => p.day + '|' + r6(p.score);
          const segKey = (a, b) => ptKey(a) + '>' + ptKey(b);
          const allDays = [...new Set(series.flatMap(s => s.points.map(p => p.day)))].sort((x, y) => x - y);
          const pieces = (s) => s.points.slice(1).flatMap((b, i) => {
            const a = s.points[i];
            if (!(b.day > a.day)) return [[a, b]];
            const cuts = [a, ...allDays.filter(d => d > a.day && d < b.day)
              .map(d => ({ day: d, score: a.score + (b.score - a.score) * (d - a.day) / (b.day - a.day) })), b];
            return cuts.slice(1).map((q, j) => [cuts[j], q]);
          });
          const ptOwners = {}, segOwners = {};
          const own = (map, key, idx) => { const list = map[key] || (map[key] = []); if (!list.includes(idx)) list.push(idx); };
          series.forEach(s => {
            s.points.forEach(p => own(ptOwners, ptKey(p), s.idx));
            pieces(s).forEach(([a, b]) => own(segOwners, segKey(a, b), s.idx));
          });
          const segments = series.flatMap(s => pieces(s).map(([a, b], i) => {
            const owners = segOwners[segKey(a, b)];
            return { key: 'l-' + s.idx + '-' + i, color: s.color, a, b, k: owners.length, rank: owners.indexOf(s.idx) };
          }));
          const markers = series.flatMap(s => s.points.map((p, i) => {
            const owners = ptOwners[ptKey(p)];
            return { key: s.idx + '-' + i, color: s.color, p, legacy: p.legacy, r: R0 + RING * (owners.length - 1 - owners.indexOf(s.idx)) };
          }));
          // Rings of several variants that share a day-0 score reach left past
          // the axis; move the y labels out so a '10' never reads as '1'.
          const day0Edge = Math.max(0, ...markers.filter(mk => mk.p.day === 0).map(mk => mk.r + 1));
          const yLabelX = padding - Math.min(Math.max(10, day0Edge + 2), 26);
          // Likewise on the right: clear of the rings on the last day.
          const lastEdge = Math.max(0, ...markers.filter(mk => mk.p.day === maxDay).map(mk => mk.r + 1));
          const limitLabelX = plotRight + Math.min(Math.max(6, lastEdge + 3), 14);

          return (
            <div className="w-full border border-slate-200 rounded-3xl bg-white p-8 font-sans shadow-sm">
              <h4 className="text-center font-extrabold mb-6 uppercase text-sm tracking-wider text-slate-800 border-b border-slate-100 pb-4">Average Quality Development per Variant{part ? ' · ' + part : ''}</h4>
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto mt-2">
                {[0, 2, 4, 6, 8, 10].map(val => (
                  <g key={val}>
                    <line x1={padding} y1={getY(val)} x2={plotRight} y2={getY(val)} stroke="#F2F5F9" strokeWidth="2" strokeDasharray="4" />
                    <text x={yLabelX} y={getY(val) + 4} textAnchor="end" fontSize="11" fill="#8A97AD" fontWeight="600">{val}</text>
                  </g>
                ))}
                {/* Acceptance limit: scores >= 7 are within specification */}
                <line x1={padding} y1={getY(7)} x2={plotRight} y2={getY(7)} stroke="#f97316" strokeWidth="1.5" strokeDasharray="6 4" />
                {xTicks.map(t => (
                  <g key={`tick-${t}`}>
                    <line x1={getX(t)} y1={height - padding} x2={getX(t)} y2={height - padding + 4} stroke="#CFD9E6" strokeWidth="1.5" />
                    <text x={getX(t)} y={height - 14} textAnchor="middle" fontSize="10" fill="#66707F" fontWeight="bold">{formatDay(t)}</text>
                  </g>
                ))}
                {segments.map(({ key, color, a, b, k, rank }) => (
                  <line key={key} x1={getX(a.day)} y1={getY(a.score)} x2={getX(b.day)} y2={getY(b.score)}
                    stroke={color} strokeWidth="3" strokeLinecap={k > 1 ? 'butt' : 'round'}
                    strokeDasharray={k > 1 ? DASH + ' ' + DASH * (k - 1) : undefined}
                    strokeDashoffset={k > 1 ? ((k - rank) % k) * DASH : undefined} />
                ))}
                {markers.map(({ key, p, r }) => <circle key={'d-' + key} cx={getX(p.day)} cy={getY(p.score)} r={r} fill="#ffffff" />)}
                {markers.map(({ key, color, p, r, legacy }) => <circle key={'r-' + key} cx={getX(p.day)} cy={getY(p.score)} r={r} fill="none" stroke={color} strokeWidth="2" strokeDasharray={legacy ? '2 1.5' : undefined} />)}
                {/* In the right margin, two lines centred on the dashed line. */}
                <text y={getY(7) - 1.8} fontSize="9" fill="#f97316" fontWeight="700">
                  <tspan x={limitLabelX}>Acceptance</tspan>
                  <tspan x={limitLabelX} dy="10">limit (7)</tspan>
                </text>
              </svg>
              {/* A coloured glyph rather than an empty coloured div: the Word
                  export copies text runs with their colour, and an empty div
                  left the legend there as bare names without a colour key. */}
              <div className="flex flex-wrap justify-center gap-6 mt-6">
                {series.map(s => (
                  <div key={s.idx} className="flex items-center gap-2 text-sm font-extrabold text-slate-700">
                    <span className="text-lg leading-none" style={{ color: s.color }}>{'● '}</span>
                    {s.name}
                  </div>
                ))}
              </div>
              {showCaption && <p className="text-[10px] text-slate-500 mt-4 leading-relaxed text-center italic">Average quality score per variant at each evaluation moment: the mean of the criteria scored that day (scale 1-10, one decimal; criteria without a score are not counted). Scores of 7 and higher (on or above the dashed line) are within specification{criteriaBelow ? '; the individual criteria are listed in the tables below' : ''}. Where variants score the same, their lines alternate colour and their points show as concentric rings.{markers.some(mk => mk.legacy) ? ' Dotted markers: an earlier overall score, recorded without criterion scores.' : ''} Time axis: days after packing (P+X), consistent with the other charts.{part ? ' With many variants the chart is split into groups on one time axis.' : ''}</p>}
            </div>
          );
        };

        // ---- Quality per variant ---------------------------------------------------
        // One row per variant, everything about its quality at one glance: the
        // average score on every evaluation day of the trial, its shelf life
        // against the acceptance limit, its weight loss and the observation of
        // its last day. A coloured table rather than lines: past about five
        // series a line chart turns into crossing spaghetti, and the guides
        // (CDC, EU data visualisation guide) advise a heatmap or small multiples;
        // the numbers stay in the cells, so nothing depends on colour alone. It
        // replaces the separate visual-quality table, the day-by-day overview that
        // put the last days in a second table, and with many variants the line
        // charts per five. Opaque colours: the Word export copies a cell's
        // background as it is.
        const QUALITY_LIMIT = 7;
        const qualityBand = (q) => !q ? null
          : q.legacy ? { backgroundColor: '#F2F5F9', color: '#8A97AD', fontStyle: 'italic' }
          : q.value >= QUALITY_LIMIT ? { backgroundColor: '#E3F4E8', color: '#15803D' }
          : q.value >= 5 ? { backgroundColor: '#FFEBD9', color: '#C2410C' }
          : { backgroundColor: '#FBE1E1', color: '#B91C1C' };
        // Shelf life: the last evaluation day on which the variant was still within
        // specification, before its first day below the limit. `open`: it never
        // dropped below, so it was still within specification at its last
        // evaluation (reported as "≥", as shelf-life tables do for a limit that was
        // not reached during the test).
        // `below` is the first evaluated day under the limit (null: never).
        const shelfLifeOf = (byDay) => {
          let ok = null;
          for (const d of [...byDay.keys()].sort((a, b) => a - b)) {
            if (byDay.get(d).value >= QUALITY_LIMIT) ok = d;
            else return { day: ok, open: false, below: d };
          }
          return { day: ok, open: true, below: null };
        };
        const QualityPerVariantTable = ({ groups }) => {
          const rows = groups.map((g, idx) => {
            const meas = (g.measurements || []).filter(m => !isNaN(parseFloat(m.day)));
            const byDay = new Map(meas.map(m => [parseFloat(m.day), measQuality(m)]).filter(([, q]) => q));
            const last = [...meas].sort((a, b) => parseFloat(a.day) - parseFloat(b.day)).pop() || {};
            const day0 = meas.find(m => parseFloat(m.day) === 0) || {};
            // The last day that was weighed — the last day of all is often the
            // retail day without weights, which printed as 0.0 %.
            const weighed = meas.filter(m => parseFloat(m.day) > 0)
              .map(m => ({ day: parseFloat(m.day), loss: getWeightLoss(m.samples, day0.samples) }))
              .filter(x => x.loss !== null).sort((a, b) => a.day - b.day);
            const lastW = weighed[weighed.length - 1];
            const loss = lastW ? parseFloat(lastW.loss) : NaN;
            return { g, idx, byDay, shelf: byDay.size ? shelfLifeOf(byDay) : null, loss, lossDay: lastW ? lastW.day : null, note: ownNote(last.notes) };
          }).filter(r => r.byDay.size > 0 || r.note);
          if (rows.length === 0) return null;
          const days = [...new Set(rows.flatMap(r => [...r.byDay.keys()]))].sort((a, b) => a - b);
          const showLoss = rows.some(r => isFinite(r.loss) && r.loss !== 0);
          const anyLegacy = rows.some(r => [...r.byDay.values()].some(q => q.legacy));
          const anyNote = rows.some(r => r.note);
          const span = days.length + (showLoss ? 3 : 2);
          // A day column is never wider than a score needs: with few days the
          // name column takes the rest instead of stretching the cells into bars.
          const dayW = Math.min(8, (showLoss ? 52 : 60) / days.length).toFixed(2) + '%';
          // Only P+0 scored says nothing yet ("≥ 0 days" did); within
          // specification at P+0 and below it at the next evaluation reads
          // "< 10 days", not "0 days".
          const days_ = (n) => n + (n === 1 ? ' day' : ' days');
          const shelfText = (s) => {
            if (!s) return '–';
            if (s.open) return s.day === null || s.day === 0 ? '–' : '≥ ' + days_(s.day);
            if (s.day === null) return s.below === 0 ? days_(0) : '< ' + days_(s.below);
            if (s.day === 0 && s.below > 0) return '< ' + days_(s.below);
            return days_(s.day);
          };
          return (
            <div className="mb-8">
              <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm">
                {/* print-flow: a long list runs on over pages between variants, the
                    header repeats; a variant and its observation stay together
                    (one tbody each, print-keep). */}
                <table className="w-full bg-white table-fixed border-collapse print-flow">
                  <colgroup>
                    <col />
                    {days.map(d => <col key={d} style={{ width: dayW }} />)}
                    <col style={{ width: '11%' }} />
                    {showLoss && <col style={{ width: '9%' }} />}
                  </colgroup>
                  <thead className="bg-slate-100 border-b border-slate-200">
                    <tr className="text-slate-600 uppercase tracking-wider text-[9px] font-bold">
                      <th className="px-2.5 py-2 text-left">Variant</th>
                      {days.map(d => <th key={d} className="px-0 py-2 text-center whitespace-nowrap">{formatDay(d)}</th>)}
                      <th className="px-1 py-2 text-center">Shelf life</th>
                      {showLoss && <th className="px-1 py-2 text-center">Weight loss</th>}
                    </tr>
                  </thead>
                    {rows.map(r => {
                      const bar = { borderLeft: `4px solid ${CHART_COLORS[r.idx % CHART_COLORS.length].stroke}` };
                      return (
                        <tbody key={r.g.id != null ? r.g.id : r.idx} className="print-keep">
                          <tr className="border-t border-slate-200">
                            <td className="px-2.5 py-1.5 text-xs font-bold text-slate-800 break-words leading-tight" style={bar}>{r.g.name || 'Variant'}</td>
                            {days.map(d => {
                              const q = r.byDay.get(d);
                              return <td key={d} className={`py-1.5 text-center font-extrabold tabular-nums ${days.length > 14 ? 'text-[9px]' : 'text-[10px]'}`}
                                style={{ ...(qualityBand(q) || {}), borderLeft: '2px solid #ffffff' }}>{q ? q.value.toFixed(1) : ''}</td>;
                            })}
                            <td className="px-1 py-1.5 text-center text-xs font-extrabold whitespace-nowrap"
                              style={{ color: r.shelf && r.shelf.open && r.shelf.day !== null ? '#15803D' : '#1A1B1F' }}>{shelfText(r.shelf)}</td>
                            {showLoss && <td className="px-1 py-1.5 text-center text-xs font-bold text-slate-600">{isFinite(r.loss) ? <>{r.loss.toFixed(1) + '%'}<span className="block text-[9px] font-medium text-slate-400 leading-tight">P+{r.lossDay}</span></> : '–'}</td>}
                          </tr>
                          {r.note && (
                            <tr>
                              <td colSpan={span} className="px-2.5 pb-2 pt-0.5 text-[10px] italic text-slate-500 leading-snug" style={bar}>{r.note}</td>
                            </tr>
                          )}
                        </tbody>
                      );
                    })}
                </table>
              </div>
              <p className="text-[10px] text-slate-500 mt-2 italic leading-relaxed">Average quality score per variant on each evaluation day (the mean of the criteria scored that day; blank: not assessed that day). Green: {QUALITY_LIMIT} or higher, within specification; orange: 5 to 6.9; red: below 5. Shelf life: the last evaluation day on which the variant was still within specification; ≥ means it was still within specification at its last evaluation; &lt; means it was below specification at the first evaluation after that.{showLoss ? ' Weight loss: on the last day the variant was weighed (shown below the value).' : ''}{anyNote ? ' Below each variant: the observation of its last evaluation day.' : ''}{anyLegacy ? ' Grey italic: an earlier overall score, recorded without criterion scores.' : ''}</p>
            </div>
          );
        };

        // The score of every criterion per variant and evaluation day: one compact
        // table per variant, criteria as rows, that variant's days as columns.
        // In section 4 with a few variants; with many, an annex at the end keeps
        // section 4 readable.
        const QualityCriteriaTables = ({ groups, criteria }) => {
          const allEvalDays = Array.from(new Set(
            groups.flatMap(g =>
              (g.measurements || []).filter(m => m.evaluateQuality || m.qualityParams?.length > 0).map(m => parseFloat(m.day))
            )
          )).sort((a, b) => a - b);

          // Not gated on the global criteria list: the rows come from the criteria
          // the days were actually scored on, plus the average.
          if (allEvalDays.length === 0) {
            return <p className="text-base italic text-slate-500 bg-slate-50 p-4 rounded-xl border border-slate-200">No specific criteria were evaluated during this test.</p>;
          }

          const variantInfos = groups.map((g, idx) => ({
            g, idx,
            days: (g.measurements || []).filter(m => m.evaluateQuality).map(m => parseFloat(m.day)).filter(d => !isNaN(d)).sort((a, b) => a - b)
          })).filter(v => v.days.length > 0);

          if (variantInfos.length === 0) {
            return <p className="text-base italic text-slate-500 bg-slate-50 p-4 rounded-xl border border-slate-200">No specific criteria were evaluated during this test.</p>;
          }

          const scoreCell = (g, day, crit) => {
            const meas = (g.measurements || []).find(m => parseFloat(m.day) === day);
            const param = (Array.isArray(meas?.qualityParams) ? meas.qualityParams : []).find(p => p && p.name === crit);
            return param && param.score ? (
              <div>
                <span className="font-extrabold text-base leading-none" style={{color: BRAND.colors.green}}>{param.score}</span>
                {param.notes && <div className="text-[9px] italic text-slate-500 leading-tight mt-0.5">{param.notes}</div>}
              </div>
            ) : <span className="text-slate-300">-</span>;
          };

          // Small tables (few evaluation days) pair up in two columns to save
          // vertical space; wide ones go full width.
          const compactGrid = variantInfos.every(v => v.days.length <= 4);
          return (
            <div className={compactGrid ? 'grid grid-cols-1 md:grid-cols-2 gap-5 items-start' : 'space-y-5'}>
              {variantInfos.map(({ g, idx, days }) => (
                <div key={g.id} className="break-inside-avoid overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div className="px-3 py-2.5 bg-slate-100 border-b border-slate-200 font-extrabold text-sm text-slate-800" style={{ borderLeft: `4px solid ${CHART_COLORS[idx % CHART_COLORS.length].stroke}` }}>{g.name || 'Variant'}</div>
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-200 text-[9px] uppercase tracking-wider font-bold text-slate-600">
                        <th className="px-3 py-2 text-left w-[40%]">Criterion</th>
                        {days.map(d => <th key={d} className="px-2 py-2 text-center border-l border-slate-100 whitespace-nowrap">Day {d}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {[...new Set([...(criteria || []), ...(g.measurements || [])
                          .filter(m => days.includes(parseFloat(m.day)))
                          .flatMap(m => (Array.isArray(m.qualityParams) ? m.qualityParams : [])
                            .filter(p => p && p.name && String(p.score == null ? '' : p.score).trim() !== '').map(p => p.name))])].map((crit, i) => (
                        <tr key={i}>
                          <td className="px-3 py-2 font-bold text-slate-700 break-words border-r border-slate-100 text-xs">{crit}</td>
                          {days.map(d => (
                            <td key={d} className="px-2 py-2 text-center align-middle border-l border-slate-100">{scoreCell(g, d, crit)}</td>
                          ))}
                        </tr>
                      ))}
                      <tr className="bg-slate-50">
                        <td className="px-3 py-2 font-extrabold text-slate-800 border-r border-slate-100 text-xs">Ø Average</td>
                        {days.map(d => {
                          const q = measQuality((g.measurements || []).find(m => parseFloat(m.day) === d));
                          return <td key={d} className={`px-2 py-2 text-center align-middle border-l border-slate-100 font-extrabold ${q && q.legacy ? 'italic text-slate-400' : ''}`} style={q && !q.legacy ? { color: BRAND.colors.green } : undefined}>{q ? q.value.toFixed(1) : <span className="text-slate-300">-</span>}</td>;
                        })}
                      </tr>
                    </tbody>
                  </table>
                </div>
              ))}
            </div>
          );
        };

        const SampleModal = ({ isOpen, onClose, data, onSave, startWeight, day0Samples: day0Metric, projectCriteria, isEvaluationDay, isDayEditable, projectTotalDuration, isMAP = true, rt, onChooseCriteria, otherDays = [], unitSystem = 'metric' }) => {
          if (!isOpen) return null;
          // In imperial the dialog works in ounces throughout (its samples, the
          // P+0 start weights it compares with) and saves grams. A weight nobody
          // changed keeps its stored grams exactly.
          const imperialW = unitSystem === 'imperial';
          const wUnit = unitOf('weight', false, unitSystem);
          const wShown = (v) => shownValue(v, 'weight', false, unitSystem);
          const [samples, setSamples] = useState(() => (data.samples || []).map(s => imperialW && s ? { ...s, weight: wShown(s.weight), initialWeight: wShown(s.initialWeight) } : s));
          const day0Samples = imperialW && Array.isArray(day0Metric) ? day0Metric.map(s => s ? { ...s, weight: wShown(s.weight) } : s) : day0Metric;
          const samplesInGrams = () => !imperialW ? samples : samples.map(s => {
            if (!s) return s;
            const orig = (data.samples || []).find(o => o && o.id === s.id);
            const back = (k) => orig && String(wShown(orig[k])) === String(s[k] == null ? '' : s[k]) ? orig[k] : metricValue(s[k], 'weight', false, 'imperial');
            return { ...s, weight: back('weight'), initialWeight: back('initialWeight') };
          });
          const [day, setDay] = useState(data.day === 0 ? 0 : (data.day || ''));
          const [notes, setNotes] = useState(data.notes || '');
          const [evaluateQuality, setEvaluateQuality] = useState(data.evaluateQuality !== undefined ? data.evaluateQuality : false);
          const [qualityParams, setQualityParams] = useState(() => {
            const own = Array.isArray(data.qualityParams) ? data.qualityParams : [];
            if (own.length === 0) return own;
            const have = new Set(own.map(p => p && p.name));
            return [...own, ...(projectCriteria || []).filter(c => !have.has(c)).map(c => ({ name: c, score: '', notes: '' }))];
          });
          // An overall score from before quality became the average of the
          // criteria (former dropdown, or an import). Kept until criteria are
          // scored or it is removed here — never thrown away unasked.
          const [legacyQuality, setLegacyQuality] = useState(window.PerfoTecBoard && window.PerfoTecBoard.measurementLegacyQuality ? window.PerfoTecBoard.measurementLegacyQuality(data) : (data.legacyQuality || ''));

          useEffect(() => {
            if (evaluateQuality && projectCriteria?.length > 0 && qualityParams.length === 0) {
              setQualityParams(projectCriteria.map(c => ({ name: c, score: '', notes: '' })));
            }
          }, [evaluateQuality, projectCriteria, qualityParams]);

          const addSample = () => setSamples([...samples, { id: Date.now(), o2: '', co2: '', weight: '', initialWeight: '' }]);
          // Copy the row, never write into it: these objects are the saved
          // measurement's own, so an in-place edit survived Cancel — and the
          // row's quality average would show scores that were never saved.
          // Text fields with a decimal keypad: a comma is a point, nothing else
          // but digits, one point and a leading minus is kept.
          const numText = (v) => String(v == null ? '' : v).replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
          const updateSample = (index, field, value) => {
            setSamples(prev => prev.map((s, i) => i === index ? { ...s, [field]: numText(value) } : s));
          };
          const removeSample = (index) => {
            const s = samples[index] || {};
            const filled = ['o2', 'co2', 'weight', 'initialWeight'].some(k => String(s[k] == null ? '' : s[k]).trim() !== '');
            if (filled && !window.confirm((rt?.confirmRemoveSample || 'Delete sample {i} and its readings?').replace('{i}', index + 1))) return;
            // After P+0, the samples below the removed one keep the start weight
            // they were compared with (see pinStartWeights).
            const pinned = parseFloat(day) > 0 ? pinStartWeights(samples, day0Samples, j => j > index) : samples;
            setSamples(pinned.filter((_, i) => i !== index));
          };

          const updateParam = (index, field, value) => {
            const v = field === 'score' ? numText(value) : value;
            setQualityParams(prev => prev.map((p, i) => i === index ? { ...p, [field]: v } : p));
          };

          // `quality` is derived from the scores, never entered on its own.
          const liveQuality = measQuality({ evaluateQuality, qualityParams, legacyQuality });
          const scoreOutOfRange = scoreIsOutOfRange;
          const anyOutOfRange = qualityParams.some(p => scoreOutOfRange(p && p.score));
          // Once criteria carry real scores the average has replaced the older
          // overall score for good; keeping it would bring it back the moment
          // someone cleared those scores.
          const hasValidScore = qualityParams.some(p => p && String(p.score == null ? '' : p.score).trim() !== '' && !scoreOutOfRange(p.score));
          // A score outside 1-10 is not counted, but used to be saved and then
          // printed in the criteria table: save only once it is corrected.
          // A day of 0 or more that this variant does not have yet: a cleared
          // field saved as a second P+0, and a repeated day hid one of the two
          // rows in the report.
          const dayNum = parseFloat(String(day == null ? '' : day).replace(',', '.'));
          const dayProblem = !isDayEditable ? null
            : !(dayNum >= 0) ? (rt?.dayInvalid || 'Enter a day of 0 or more.')
            : otherDays.includes(dayNum) ? (rt?.dayDuplicate || 'P+{day} already exists for this variant.').replace('{day}', dayNum)
            : null;
          const handleSave = () => {
            if (anyOutOfRange || dayProblem) return;
            if (onSave({ ...data, day: isDayEditable ? dayNum : (parseFloat(day) || 0), notes, samples: samplesInGrams(), qualityParams, evaluateQuality, legacyQuality: hasValidScore ? '' : legacyQuality }) === false) return;
            onClose();
          };

          // Pick the layout in JS, not with `hidden md:block` / `md:hidden`.
          // Those utilities are generated at runtime by the Tailwind CDN, and the
          // two halves of the switch are complementary: if `md:block` fails to
          // generate while `hidden` does, the table stays display:none AND the
          // cards are hidden — the only way to enter a measurement disappears with
          // nothing on screen to explain it. Rendering one branch cannot fail that
          // way, and it does not depend on the CDN at all.
          const isPhone = usePhoneLayout();
          // Side by side, the quality card is as tall as the left column and its
          // criteria scroll inside it. Stacked (narrow window, tablet, phone) it
          // must take its own full height: a card that clips gets only the space
          // the left column leaves, which hid every criterion out of reach. One
          // switch for both, for the same reason as isPhone above.
          const sideBySide = useMediaQuery('(min-width: 1024px)');

          const avgWeight = getAverage(samples, 'weight');
          // Per-sample loss: uses each sample's own initial weight when filled,
          // falling back to the index-matched day-0 sample (see getWeightLoss).
          const weightLoss = parseFloat(day) > 0 ? getWeightLoss(samples, day0Samples) : null;
          
          const isOpened = projectTotalDuration && parseFloat(day) > parseFloat(projectTotalDuration);

          return (
            /* Full-bleed on a phone: a centred dialog with a margin and rounded
               corners wastes the little width there is, and max-h-[90vh] put the
               Save button below the fold with a keyboard open. On a phone this is
               a screen, not a dialog — header and footer stay put, the middle
               scrolls. From md up it is the dialog it always was. */
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-stretch md:items-center justify-center z-50 p-0 md:p-4 font-sans print:hidden">
              <div className="bg-white rounded-none md:rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col h-full md:h-auto md:max-h-[90vh]">
                <div className="px-4 py-3 md:p-6 flex justify-between items-center text-white shrink-0" style={{ background: `linear-gradient(90deg, ${BRAND.colors.black} 0%, #423B3B 50%, ${BRAND.colors.black} 100%)` }}>
                  <h3 className="font-extrabold text-base md:text-xl flex items-center gap-2 md:gap-3 min-w-0" style={{ fontFamily: BRAND.fonts.heading }}>
                    <Edit3 size={18} className="shrink-0"/>
                    <span className="truncate">{rt?.measDay || 'Day'} {formatDay(day)}</span>
                  </h3>
                  <button onClick={onClose} aria-label={rt?.cancel || 'Close'} className="hover:text-red-300 transition bg-white/10 p-2.5 rounded-full shrink-0"><X size={20}/></button>
                </div>

                <div className={`p-4 md:p-8 overflow-y-auto grid flex-1 ${sideBySide ? 'grid-cols-2 gap-10' : 'grid-cols-1 gap-6'}`}>
                  <div>
                    <h4 className="hidden md:block font-extrabold text-lg text-slate-800 border-b-2 border-slate-100 pb-3 mb-6">{isMAP ? 'Atmosphere & Weight' : 'Weight Only (Ambient)'}</h4>
                    {/* Running averages first on a phone: it is the sanity check you
                        glance at while typing, so it belongs above the fields. */}
                    <div className="flex flex-wrap justify-between items-center mb-5 md:mb-6 bg-slate-50 p-3 md:p-4 rounded-xl border border-slate-200 text-sm gap-3 md:gap-4 shadow-sm">
                      <div className="flex items-center gap-3">
                         <label className="font-extrabold text-slate-600 uppercase tracking-wider text-xs">{rt?.measDay || 'Day'}:</label>
                         <input
                           type="text"
                           inputMode="numeric"
                           value={day || ''}
                           disabled={!isDayEditable}
                           onChange={e => setDay(e.target.value)}
                           className={`w-20 p-2 border border-slate-300 rounded-lg text-center font-bold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 ${!isDayEditable ? 'bg-slate-200 cursor-not-allowed text-slate-500' : 'bg-white'} ${dayProblem ? 'border-red-500 ring-2 ring-red-200' : ''}`}
                         />
                         {dayProblem && <span className="text-xs font-bold text-red-600">{dayProblem}</span>}
                      </div>
                      <div className="flex flex-wrap gap-2 md:gap-6 md:text-right">
                         {parseFloat(day) > 0 && <div className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm" style={{ color: weightLoss > 3 ? '#dc2626' : BRAND.colors.green, fontWeight: 'bold' }}>Ø {rt?.lossLabel || 'Loss'} {weightLoss === null ? '–' : weightLoss + '%'}</div>}
                         <div className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm text-slate-700">Ø <strong className="text-blue-900">{avgWeight}{wUnit}</strong></div>
                      </div>
                    </div>
                    {/* ---- PHONE: one card per sample -------------------------------
                     * The table below is 600px wide and on a 375px screen 359px of
                     * it sat behind a horizontal scroll — you saw 40% of your own
                     * data. Its narrowest number box measured 27px, which you
                     * cannot type "20.9" into standing at a pallet. So the phone
                     * gets a different shape rather than a squeezed table: one card
                     * per sample, two fields per row, and the weight loss computed
                     * next to the field so an implausible entry shows up on the
                     * spot instead of back at the desk.
                     * -------------------------------------------------------------- */}
                    {isPhone && (
                    <div className="space-y-3 mb-5">
                      {samples.map((s, i) => {
                        const ownStart = parseFloat(s.initialWeight);
                        const fallbackStart = day0Samples && day0Samples[i] ? parseFloat(day0Samples[i].weight) : NaN;
                        const startW = !isNaN(ownStart) && ownStart > 0 ? ownStart : fallbackStart;
                        const nowW = parseFloat(s.weight);
                        const loss = (startW > 0 && !isNaN(nowW)) ? ((startW - nowW) / startW) * 100 : null;
                        return (
                          <div key={i} className="rounded-2xl border-2 border-slate-200 bg-white p-4 shadow-sm">
                            <div className="flex items-center justify-between mb-3">
                              <span className="flex items-center gap-2.5 font-extrabold text-slate-800">
                                <span className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-sm">{i + 1}</span>
                                {rt?.sampleLabel || 'Sample'} {i + 1}
                              </span>
                              <button onClick={() => removeSample(i)} aria-label={rt?.removeSample || 'Remove sample'}

                            <div className="grid grid-cols-2 gap-3">
                              {isMAP && (
                                <label className="block">
                                  <span className="block text-[11px] font-extrabold uppercase tracking-wider mb-1" style={{color: BRAND.colors.blue}}>O₂ (%)</span>
                                  {isOpened
                                    ? <div className="h-12 flex items-center justify-center rounded-xl bg-slate-50 border border-slate-200 font-bold text-slate-300">—</div>
                                    : <input type="text" inputMode="decimal" className={"w-full h-12 px-3 border-2 border-slate-300 rounded-xl text-center text-lg font-bold text-blue-900 outline-none focus:border-blue-500" + (gasSampleIssue(s) === 'o2' || gasSampleIssue(s) === 'sum' ? ' !border-red-500 !bg-red-50' : '')}
                                        value={s.o2 === 0 ? 0 : (s.o2 || '')} onChange={e => updateSample(i, 'o2', e.target.value)} />}
                                </label>
                              )}
                              {isMAP && (
                                <label className="block">
                                  <span className="block text-[11px] font-extrabold uppercase tracking-wider mb-1" style={{color: BRAND.colors.green}}>CO₂ (%)</span>
