                                <div key={i} className="text-sm bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3 hover:border-slate-300 transition-colors">
                                  <div className="flex flex-col shrink-0">
                                    <button onClick={() => moveNextStep(i, 'up')} disabled={i === 0} className="p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700 rounded disabled:opacity-30 transition-colors" title={rt.moveUp || 'Move up'}><ChevronUp size={16}/></button>
                                    <button onClick={() => moveNextStep(i, 'down')} disabled={i === analysis.nextSteps.length - 1} className="p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700 rounded disabled:opacity-30 transition-colors" title={rt.moveDown || 'Move down'}><ChevronDown size={16}/></button>
                                  </div>
                                  <select
                                    className="text-[10px] font-extrabold uppercase bg-slate-100 text-slate-600 px-2 py-1.5 rounded-md border border-slate-200 shrink-0 outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer max-w-[130px]"
                                    value={String(stepObj.variantId ?? 'general')}
                                    onChange={e => updateNextStep(i, 'variantId', e.target.value)}
                                  >
                                    <option value="general">{rt.general}</option>
                                    {groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                  </select>
                                  <input
                                    type="text"
                                    className="flex-1 text-slate-800 font-medium bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-400 focus:bg-slate-50 rounded-lg px-2 py-1.5 outline-none transition-colors min-w-0"
                                    value={stepObj.text || ''}
                                    onChange={e => updateNextStep(i, 'text', e.target.value)}
                                  />
                                  <button onClick={() => removeNextStep(i)} className="text-red-400 hover:text-red-600 shrink-0 bg-red-50 p-2 rounded-lg hover:bg-red-100 transition-colors"><Trash2 size={16}/></button>
                                </div>
                              );
                           })}
                           {(!analysis.nextSteps || analysis.nextSteps.length === 0) && (
                               <div className="text-sm italic text-slate-400 py-2 text-center">{rt.noConclusions}</div>
                           )}
                         </div>
                       </div>

                       {/* Trial Target evaluation — references the target defined in Setup
                           and records whether it was achieved, with an explanation. */}
                       <div className="md:col-span-2 bg-green-50/40 p-8 rounded-3xl border border-green-200 shadow-sm mt-4">
                         <label className={`${labelClass} text-sm mb-3 flex items-center gap-2`}><Target size={16} className="text-green-700"/> {rt.targetEval}</label>
                         {project.trialTarget ? (
                           <div className="bg-white p-4 rounded-xl border border-slate-200 mb-5 text-sm text-slate-700 italic shadow-sm">
                             <span className="text-[10px] font-extrabold uppercase tracking-widest text-green-700 not-italic block mb-1">{rt.trialTarget}</span>
                             {project.trialTarget}
                           </div>
                         ) : (
                           <div className="bg-white p-4 rounded-xl border border-dashed border-slate-300 mb-5 text-sm text-slate-400 italic">{rt.noTrialTarget}</div>
                         )}
                         <div className="flex flex-wrap gap-3 mb-5">
                           {[
                             ['achieved',    rt.targetAchievedOpt,    'bg-green-600 border-green-700 ring-green-600/20'],
                             ['partial',     rt.targetPartialOpt,     'bg-orange-500 border-orange-600 ring-orange-500/20'],
                             ['notAchieved', rt.targetNotAchievedOpt, 'bg-red-600 border-red-700 ring-red-600/20']
                           ].map(([val, label, activeCls]) => (
                             <button key={val} type="button"
                               onClick={() => setAnalysis(prev => ({ ...prev, targetAchieved: prev.targetAchieved === val ? null : val }))}
                               className={`px-5 py-2.5 rounded-xl text-sm font-bold transition-all border shadow-sm ${analysis.targetAchieved === val ? `${activeCls} text-white ring-4 transform scale-[1.02]` : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                               {label}
                             </button>
                           ))}
                         </div>
                         <textarea rows="3" className={`${inputClass} resize-y`} placeholder={rt.targetEvalPlaceholder} value={analysis.targetEvaluation || ''} onChange={e => setAnalysis(prev => ({ ...prev, targetEvaluation: e.target.value }))} />
                       </div>

                       {/* General observations — trial-level notes independent from samples. */}
                       <div className="md:col-span-2 mt-4">
                         <label className={`${labelClass} text-sm mb-3`}>{rt.generalObs}</label>
                         <textarea rows="4" className={`${inputClass} resize-y`} placeholder={rt.generalObsPlaceholder} value={analysis.generalObservations || ''} onChange={e => setAnalysis(prev => ({ ...prev, generalObservations: e.target.value }))} />
                       </div>

                       <div className="md:col-span-1 mt-6">
                           <label className={`${labelClass} text-sm mb-3`}>{rt.gasAnalysis}</label>
                           <RichTextEditor 
                              value={analysis.graphNotes || ''} 
                              onChange={(val) => setAnalysis(prev => ({...prev, graphNotes: val}))} 
                              placeholder={rt.gasAnalysisPlaceholder}
                           />
                       </div>

                       <div className="md:col-span-1 mt-6">
                         <div className="flex items-center gap-2 mb-2">
                           <input
                             type="text"
                             className="flex-1 text-xs font-bold tracking-wide uppercase bg-transparent border-b border-dashed border-slate-400 outline-none focus:border-blue-500 py-0.5 text-slate-600 placeholder-slate-400 transition-colors"
                             placeholder={rt.temperatureLabelPlaceholder}
                             value={analysis.temperatureLabel || ''}
                             onChange={e => setAnalysis(prev => ({...prev, temperatureLabel: e.target.value}))}
                           />
                           <span className="text-[9px] text-slate-400 italic shrink-0">(optional)</span>
                         </div>
                         {getTempImages(analysis).length > 0 && (
                           <div className="grid grid-cols-2 gap-3 mb-3">
                               {getTempImages(analysis).map((img, i) => (
                                 <div key={i} className="relative group border border-slate-200 rounded-xl p-2 bg-white flex items-center justify-center min-h-[100px]">
                                     <img src={img} className="max-w-full max-h-40 object-contain rounded-lg shadow-sm" />
                                     <button onClick={(e) => { e.preventDefault(); if (!window.confirm(rt.confirmRemoveImage || 'Remove this image from the report?')) return; setAnalysis(prev => ({...prev, temperatureImages: getTempImages(prev).filter((_, idx) => idx !== i)})); }} className="hover-reveal absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all shadow-lg hover:bg-red-600 hover:scale-110 z-20"><Trash2 size={16}/></button>
                                 </div>
                               ))}
                           </div>
                         )}
                         <div className="border-2 border-dashed border-slate-300 rounded-2xl p-6 flex flex-col items-center justify-center text-center bg-slate-50 hover:bg-blue-50 hover:border-blue-300 transition-all cursor-pointer relative overflow-hidden shadow-sm group min-h-[120px]">
                           <input type="file" accept="image/*" multiple className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={async (e) => {
                               const files = Array.from(e.target.files || []);
                               e.target.value = '';
                               // Sequential, not forEach: each await has to settle
                               // before the next setAnalysis reads getTempImages,
                               // otherwise parallel reads overwrite each other.
                               for (const file of files) {
                                 const { dataUrl } = await globalConfig.readImageFile(file);
                                 setAnalysis(prev => ({ ...prev, temperatureImages: [...getTempImages(prev), dataUrl] }));
                               }
                           }} />
                           <div className="flex flex-col items-center">
                               <div className="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                   <Upload size={28} className="text-blue-500"/>
                               </div>
                               <span className="font-extrabold text-sm text-slate-700 block">{rt.uploadTempGraph}</span>
                           </div>
                         </div>
                       </div>

                       <div className="md:col-span-1 mt-6">
                         <label className={`${labelClass} text-sm mb-1`}>{rt.sectionVisibility}</label>
                         <p className="text-xs text-slate-400 mb-3">{rt.sectionVisibilityHint}</p>
                         <div className="flex flex-col gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                           <label className="flex items-center gap-3 cursor-pointer select-none">
                             <input type="checkbox" checked={analysis.showGasSection ?? autoShowGas} onChange={e => setAnalysis(prev => ({...prev, showGasSection: e.target.checked}))} className="w-4 h-4 accent-green-600 shrink-0" />
                             <span className="text-sm font-medium text-slate-700">{rt.showGasSection}</span>
                             {(analysis.showGasSection === null) && <span className="text-[10px] text-slate-400 italic ml-auto">auto</span>}
                           </label>
                           <label className="flex items-center gap-3 cursor-pointer select-none">
                             <input type="checkbox" checked={analysis.showHubPredictions ?? autoShowHub} onChange={e => setAnalysis(prev => ({...prev, showHubPredictions: e.target.checked}))} className="w-4 h-4 accent-green-600 shrink-0" />
                             <span className="text-sm font-medium text-slate-700">{rt.showHubPredictions}</span>
                             {(analysis.showHubPredictions === null) && <span className="text-[10px] text-slate-400 italic ml-auto">auto</span>}
                           </label>
                           <label className="flex items-center gap-3 cursor-pointer select-none">
                             <input type="checkbox" checked={analysis.showWeightLoss ?? autoShowWeight} onChange={e => setAnalysis(prev => ({...prev, showWeightLoss: e.target.checked}))} className="w-4 h-4 accent-green-600 shrink-0" />
                             <span className="text-sm font-medium text-slate-700">{rt.showWeightLoss}</span>
                             {(analysis.showWeightLoss === null) && <span className="text-[10px] text-slate-400 italic ml-auto">auto</span>}
                           </label>
                           <label className="flex items-center gap-3 cursor-pointer select-none">
                             <input type="checkbox" checked={analysis.showCriteriaScores ?? true} onChange={e => setAnalysis(prev => ({...prev, showCriteriaScores: e.target.checked}))} className="w-4 h-4 accent-green-600 shrink-0" />
                             <span className="text-sm font-medium text-slate-700">{criteriaInAnnex ? rt.showCriteriaAnnex : rt.showCriteriaScores}</span>
                             {(analysis.showCriteriaScores == null) && <span className="text-[10px] text-slate-400 italic ml-auto">auto</span>}
                           </label>
                           {/* Once clicked a box stayed manual for good, so a section
                               switched off early stayed off when its data arrived. */}
                           {[analysis.showGasSection, analysis.showHubPredictions, analysis.showWeightLoss, analysis.showCriteriaScores].some(v => v != null) && (
                             <button type="button" onClick={() => setAnalysis(prev => ({ ...prev, showGasSection: null, showHubPredictions: null, showWeightLoss: null, showCriteriaScores: null }))}
                               className="self-start text-xs font-bold text-blue-700 hover:underline">{rt.visibilityAuto || 'Back to automatic'}</button>
                           )}
                         </div>
                       </div>
                       {/* Anonymised report: a copy for commercial sharing. Only the
                           preview/PDF/Word get the cleaned data (see anonymiseReport). */}
                       {(() => {
                         const anon = { enabled: false, alias: '', extraTerms: '', hideLocation: true, ...(analysis.anonymise || {}) };
                         const setAnon = (patch) => setAnalysis(prev => ({ ...prev, anonymise: { enabled: false, alias: '', extraTerms: '', hideLocation: true, ...(prev.anonymise || {}), ...patch } }));
                         const result = anon.enabled ? anonymiseReport({ clientInfo, project, groups, analysis, supplyChain }, anon) : null;
                         const anonImages = anon.enabled ? anonImageList({ project, groups, analysis }, { cover: rt.anonImgCover, start: rt.anonImgStart, hub: rt.anonImgHub, temp: rt.anonImgTemp }) : [];
                         const anonDecisions = anon.images || {};
                         return (
                           <div className="md:col-span-1 mt-6">
                             <label className={`${labelClass} text-sm mb-1`}>{rt.anonTitle}</label>
                             <p className="text-xs text-slate-400 mb-3">{rt.anonHint}</p>
                             <div className={`flex flex-col gap-3 p-4 rounded-2xl border ${anon.enabled ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200'}`}>
                               <label className="flex items-center gap-3 cursor-pointer select-none">
                                 <input type="checkbox" checked={!!anon.enabled} onChange={e => setAnon({ enabled: e.target.checked })} className="w-4 h-4 accent-green-600 shrink-0" />
                                 <span className="text-sm font-bold text-slate-700">{rt.anonEnable}</span>
                               </label>
                               {anon.enabled && (<>
                                 <div>
                                   <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 mb-1">{rt.anonAlias}</label>
                                   <input type="text" className={inputClass} value={anon.alias} placeholder="Client" onChange={e => setAnon({ alias: e.target.value })} />
                                 </div>
                                 <div>
                                   <label className="block text-[11px] font-bold uppercase tracking-wide text-slate-500 mb-1">{rt.anonExtra}</label>
                                   <input type="text" className={inputClass} value={anon.extraTerms} placeholder={rt.anonExtraPlaceholder} onChange={e => setAnon({ extraTerms: e.target.value })} />
                                 </div>
                                 <label className="flex items-center gap-3 cursor-pointer select-none">
                                   <input type="checkbox" checked={anon.hideLocation !== false} onChange={e => setAnon({ hideLocation: e.target.checked })} className="w-4 h-4 accent-green-600 shrink-0" />
                                   <span className="text-sm font-medium text-slate-700">{rt.anonHideLocation}</span>
                                 </label>
                                 <div className="text-xs text-slate-700 bg-white rounded-xl border border-slate-200 p-3 space-y-2">
                                   <div className="font-bold">{rt.anonRemoved}</div>
                                   {result.terms.length ? (
                                     <div className="flex flex-wrap gap-1.5">{result.terms.map(t => <span key={t} className="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 font-medium">{t}</span>)}</div>
                                   ) : <div className="italic text-slate-400">{rt.anonNothingFound}</div>}
                                   {result.locationTerms.length > 0 && (
                                     <div className="flex flex-wrap items-center gap-1.5"><span className="font-bold">{rt.anonLocationRemoved}</span>{result.locationTerms.map(t => <span key={t} className="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 font-medium">{t}</span>)}</div>
                                   )}
                                   {result.kept.length > 0 && (
                                     <div className="text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5">{(rt.anonKeptWords || '').replace('{words}', result.kept.join(', '))}</div>
                                   )}
                                   <div>{(rt.anonReplaced || '').replace('{n}', result.hits).replace('{alias}', result.alias)}</div>
                                 </div>
                                 {anonImages.length > 0 && (() => {
                                   const unchecked = anonImages.filter(it => !(anonDecisions[it.key] || {}).checked).length;
                                   const firstOpen = anonImages.findIndex(it => !(anonDecisions[it.key] || {}).checked);
                                   return (
                                     <div className={`text-xs rounded-xl border p-3 space-y-2 ${unchecked ? 'bg-amber-100 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-700'}`}>
                                       <div className="flex items-center justify-between gap-2">
                                         <span className="font-bold">{rt.anonImagesTitle}</span>
                                         <span className={`font-bold ${unchecked ? '' : 'text-[#008837]'}`}>{unchecked ? rt.anonImagesTodo.replace('{u}', unchecked).replace('{n}', anonImages.length) : rt.anonImagesDone.replace('{n}', anonImages.length)}</span>
                                       </div>
                                       <p>{rt.anonImagesHint}</p>
                                       <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 items-start">
                                         {anonImages.map((it, i) => {
                                           const dd = anonDecisions[it.key] || {};
                                           return (
                                             <button key={it.key} type="button" onClick={() => setAnonReview(i)} title={it.label}
                                               className={`relative block rounded-lg overflow-hidden border-2 bg-white ${dd.hide ? 'border-slate-300' : dd.checked ? 'border-[#008837]/60' : 'border-amber-500'}`}>
                                               <img src={it.url} alt={it.label} loading="lazy" decoding="async" className="block w-full h-auto" style={{ opacity: dd.hide ? 0.3 : 1 }} />
                                               {!dd.hide && (dd.boxes || []).map((b, j) => <span key={j} className="absolute" style={{ left: b.x * 100 + '%', top: b.y * 100 + '%', width: b.w * 100 + '%', height: b.h * 100 + '%', background: ANON_COVER }} />)}
                                               <span className={`absolute bottom-0 inset-x-0 text-[9px] leading-tight font-bold px-1 py-0.5 text-center ${dd.hide ? 'bg-slate-600 text-white' : dd.checked ? 'bg-[#008837] text-white' : 'bg-amber-500 text-white'}`}>
                                                 {dd.hide ? rt.anonHiddenBadge : dd.checked ? '✓' : '!'}
                                               </span>
                                             </button>
                                           );
                                         })}
                                       </div>
                                       <button type="button" onClick={() => setAnonReview(firstOpen >= 0 ? firstOpen : 0)}
                                         className={`w-full rounded-xl py-2.5 font-bold text-sm transition ${unchecked ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-50'}`}>
                                         {unchecked ? rt.anonImagesStart : rt.anonImagesAgain}
                                       </button>
                                     </div>
                                   );
                                 })()}
                               </>)}
                             </div>
                           </div>
                         );
                       })()}
                    </Panel>
                  </div>
                )}
              </main>
              {/* The anonymisation check, opened from the Analysis tab. Rendered here
                  rather than inside its panel, which collapses on a phone: the
                  reviewer would vanish and later reopen by itself. */}
              {anonReview !== null && anonOn && (() => {
                const items = anonImageList({ project, groups, analysis }, { cover: rt.anonImgCover, start: rt.anonImgStart, hub: rt.anonImgHub, temp: rt.anonImgTemp });
                return items[anonReview] ? createPortal(
                  <AnonImageReviewer items={items} decisions={analysis.anonymise.images || {}} index={anonReview} onIndex={setAnonReview}
                    onChange={setAnonImage} onClose={() => setAnonReview(null)} rt={rt} />,
                  document.body) : null;
              })()}
            </div>
          );
        };

        // ---- When the editor itself fails ---------------------------------------
        // A render error used to unmount everything: a white page, and the same
        // for every colleague who opened that report. Show what went wrong and
        // offer the data of the last screen that did render. Nothing is saved
        // from here: after an error the state cannot be trusted.
        class ReportErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { error: null }; }
          static getDerivedStateFromError(error) { return { error }; }
          componentDidCatch(error, info) { try { console.error('Report tool error:', error, info && info.componentStack); } catch (e) { /* console unavailable */ } }
          download() {
            try {
              const data = latestReportExport ? latestReportExport() : null;
              if (!data) return;
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'report-recovered-' + new Date().toISOString().slice(0, 10) + '.json';
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (e) { alert('The data could not be exported: ' + (e && e.message ? e.message : e)); }
          }
          render() {
            if (!this.state.error) return this.props.children;
            const err = this.state.error;
            const text = String((err && (err.stack || err.message)) || err);
            const btn = { padding: '10px 18px', borderRadius: 12, fontWeight: 700, border: '1px solid #cbd5e1', background: '#fff', cursor: 'pointer' };
            return (
              <div style={{ maxWidth: 760, margin: '48px auto', padding: 24, fontFamily: 'Montserrat, Arial, sans-serif', color: '#1e293b' }}>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: '#b91c1c', marginBottom: 12 }}>The report tool ran into an error</h1>
                <p style={{ marginBottom: 8 }}>Changes made in the last seconds before the error may not have been saved. Download the data of the last screen that worked, then reload the page.</p>
                <p style={{ marginBottom: 16, fontSize: 13, color: '#475569' }}>Please send the text below to whoever maintains the tool.</p>
                <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
                  {latestReportExport && <button style={{ ...btn, background: '#008837', color: '#fff', borderColor: '#008837' }} onClick={() => this.download()}>Download data (JSON)</button>}
                  <button style={btn} onClick={() => window.location.reload()}>Reload</button>
                </div>
                <pre style={{ whiteSpace: 'pre-wrap', fontSize: 12, background: '#f1f5f9', padding: 12, borderRadius: 8, maxHeight: 320, overflow: 'auto' }}>{text}</pre>
              </div>
            );
          }
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<ReportErrorBoundary><App /></ReportErrorBoundary>);
    </script>
</body>
</html>
