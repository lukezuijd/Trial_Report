                    </div>

          const [clientInfo, setClientInfo] = useState({
            companyName: '', street: '', houseNumber: '', addressExtra: '', zipCode: '', city: '', country: '', website: '',

            productName: '', productId: '', processingType: 'Whole', type: '', origin: '', company: '', contactName: '', contactEmail: '', contactRole: '', contactPhone: '', street: '', houseNumber: '', addressExtra: '', zipCode: '', city: '', country: '', employee: '', trialTarget: '', currentChallenge: '',

          useEffect(() => {

          const [groups, setGroups] = useState([
            {

              predictedImage: null

          // That seed row is a PLACEHOLDER: ambient air (20.9 / 0.03) and an
          // example note, prefilled so a new report opens with something sensible.
          // It is not a measurement anybody took, and the board-autosave below
          // must never report it as one — doing so stamped a single
          // "Measurement P+0, done" action on the card, which the board renders as
          // "all measurements done" for a trial where nothing has been measured.
          // A measurements fingerprint (measurements only, NOT specs) tells the
          // two apart: applying an intake product rewrites specs and must not
          // count, while loading a real report or typing a measurement must.
          const measurementsFingerprint = (gs) => JSON.stringify((gs || []).map(g => g.measurements || []));
          const seedMeasurementsRef = useRef(null);
          const reportHasMeasurementsRef = useRef(false);

          }, [groups]);

          // activeGroupId is seeded with 1 on the assumption that the built-in
          // "Control" group is always there, but a LOADED report can start at any
          // id — delete the first variant once (here or in the proposal) and the
          // saved ids begin at 2. Nothing reconciled the two, and the entire
          // right-hand column of Variant Results is behind
          // `const activeG = groups.find(g => g.id === activeGroupId); if (!activeG) return null;`
          // So the variant list on the left kept listing the variants while the
          // panel next to it — packaging specs, the Measurements heading, Add day,
          // the measurement table with its "enter measurement" and "add photos"
          // buttons, even the friendly "no measurement days yet" notice — rendered
          // as an empty white card, with no error to explain it. Clicking a variant
          // fixed it, which is what made this look intermittent.
          useEffect(() => {
            if (!groups.length) return;
            if (!groups.some(g => g.id === activeGroupId)) setActiveGroupId(groups[0].id);
          }, [groups, activeGroupId]);

          const [analysis, setAnalysis] = useState({ graphNotes: '', conclusion: '', variantConclusions: {}, recommendation: 'retest', nextSteps: [], temperatureImages: [], temperatureLabel: '', showGasSection: null, showHubPredictions: null, showWeightLoss: null, showCriteriaScores: null, generalObservations: '', targetAchieved: null, targetEvaluation: '', anonymise: null });
          const [newStep, setNewStep] = useState('');
          const [newStepVariant, setNewStepVariant] = useState('general');
          const [newCriteria, setNewCriteria] = useState('');

          const calcUnpackingDate = () => {
            const baseDate = project.packingDate || project.date;
            const duration = parseInt(project.totalDuration) || 0;
            return baseDate && duration ? utcDDMMYYYY(isoDayPlus(baseDate, duration)) : '-';
          };

          const calcRetailDate = () => {
            const baseDate = project.packingDate || project.date;
            const duration = parseInt(project.totalDuration) || 0;
            const retailDays = parseInt(project.retailOpenDays) || 0;

          };

          // --- HANDLERS ---
          const handleClientChange = (field, value) => { setClientInfo(prev => ({ ...prev, [field]: value })); };

          // Multi-contact helpers — mirror intake/proposal so the same
          // clientInfo.contacts[] array round-trips across all three tools.
          //
          // When editing the primary contact (contacts[0]), keep the legacy
          // flat shadow fields (`contactName`, `role`, `email`, `phone`,
          // `phoneDirect`, `phoneWork`) in sync. The print/PDF preview rendering
          // and legacy `project.contact*` export fields still read those flats,
          // so without this sync they would show stale data after an edit.
          const syncFlatFromPrimaryContact = (prev, primary) => {
             // No contact left: the flat copies go too, or the export rebuilt the
             // removed contact from them.
             if (!primary) return { ...prev, contactName: '', role: '', email: '', phone: '', phoneDirect: '', phoneWork: '' };
             return {
                ...prev,
                contactName: primary.name || '',
                role: primary.role || '',
                email: primary.email || '',
                phone: primary.phoneDirect || primary.phoneWork || '',
                phoneDirect: primary.phoneDirect || '',
                phoneWork: primary.phoneWork || ''
             };
          };

          const handleContactChange = (id, field, value) => {
             setClientInfo(prev => {
                const newContacts = (prev.contacts || []).map(c => c.id === id ? { ...c, [field]: value } : c);
                const primaryEdited = prev.contacts && prev.contacts[0] && prev.contacts[0].id === id;
                const next = { ...prev, contacts: newContacts };
                return primaryEdited ? syncFlatFromPrimaryContact(next, newContacts[0]) : next;
             });
          };

          const addContact = () => {
             setClientInfo(prev => ({
                 ...prev,
                 contacts: [...(prev.contacts || []), { id: Date.now(), name: '', role: '', email: '', phoneDirect: '', phoneWork: '' }]
             }));
          };

          const removeContact = (id) => {
             const c = (clientInfo.contacts || []).find(x => x.id === id) || {};
             const filled = ['name', 'email', 'phone', 'role'].some(k => String(c[k] == null ? '' : c[k]).trim() !== '');
             if (filled && !window.confirm((rt.confirmRemoveContact || 'Remove contact "{name}"?').replace('{name}', c.name || c.email || ''))) return;
             setClientInfo(prev => {
                const newContacts = (prev.contacts || []).filter(c => c.id !== id);
                const primaryRemoved = prev.contacts && prev.contacts[0] && prev.contacts[0].id === id;
                const next = { ...prev, contacts: newContacts };
                // Promote the new primary into the flat shadow fields.
                return primaryRemoved ? syncFlatFromPrimaryContact(next, newContacts[0]) : next;
             });
          };

          // Metric/Imperial toggle — converts startWeight (project & per-group)
          // and supply chain temperatures so visible values stay correct.
          // Metric or imperial changes what is shown; the stored values stay
          // metric (see shownValue / UnitInput).
          const handleUnitToggle = () => setUnitSystem(s => s === 'metric' ? 'imperial' : 'metric');

          // Every image entering the report goes through readImageFile, which
          // downscales it. Logos and other small files pass through untouched.
          const handleImgUpload = async (e, field, isGroup = false) => {
            const f = e.target.files[0];
            e.target.value = null;
            if (!f) return;
            const { dataUrl } = await globalConfig.readImageFile(f);
            if (isGroup) setGroups(p => p.map(g => g.id === activeGroupId ? { ...g, predictedImage: dataUrl } : g));
            else if (field === 'clientLogo') setClientInfo(c => ({ ...c, logo: dataUrl }));
            else setProject(p => ({ ...p, [field]: dataUrl }));
          };

          const handlePredictedImageUpload = async (e, groupId) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const { dataUrl } = await globalConfig.readImageFile(file);
            const group = groups.find(g => g.id === groupId);
            if (group && group.predictedImage) {
              setPendingImageReplace({ groupId: groupId, result: dataUrl });
            } else {
              setGroups(prev => prev.map(g => g.id === groupId ? { ...g, predictedImage: dataUrl } : g));
            }
          };

          // Whether the title was typed in this session: only then does clearing it
          // clear the card's title too (a document that merely arrives without one,
          // from an import or an intake, must not wipe a title set elsewhere).
          const titleEdited = useRef(false);
          // The packing date is typed here OR moved on the board. The report writes
          // it to the card only when it was changed here (or the card has none):
          // re-asserting it on every save undid a date the board had postponed.
          const packingEdited = useRef(false);
          const [boardStartDate, setBoardStartDate] = useState('');
          const handleProjectChange = (f, v) => { if (f === 'reportTitle') titleEdited.current = true; if (f === 'packingDate') packingEdited.current = true; setProject(p => ({...p, [f]: v})); };
          
          // The last packed day and the retail day follow Total days / Retail
          // days. The rows this creates are marked `auto` (older reports: the
          // label note); while still empty they move with the numbers instead
          // of staying behind. A row that holds anything is never removed.
          const syncMeasurements = (currentGroups, packedStr, openStr) => {
            const p = parseInt(packedStr) || 0;
            const o = parseInt(openStr) || 0;
            const wanted = new Set([0, p, p > 0 && o > 0 ? p + o : 0]);
            const isAutoRow = (m) => !!m.auto || (String(m.notes || '').trim() !== '' && !ownNote(m.notes));
            return currentGroups.map(g => {
              const newM = (g.measurements || []).filter(m =>
                !(isAutoRow(m) && !wanted.has(parseFloat(m.day)) && !measurementHasData(m)));
              const sCount = g.specs.sampleCount || 3;
              const createMeas = (day, auto) => ({
                 day, auto, samples: Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i+Math.random(), o2: '', co2: '', weight: '', initialWeight: '' })), quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: true
              });
              if (p > 0 && !newM.find(m => parseFloat(m.day) === p)) newM.push(createMeas(p, 'end'));
              if (p > 0 && o > 0 && !newM.find(m => parseFloat(m.day) === p + o)) newM.push(createMeas(p + o, 'open'));
              newM.sort((a,b) => parseFloat(a.day) - parseFloat(b.day));
              return { ...g, measurements: newM };
            });
          };

          // Called with the finished value (CommitInput), never per keystroke:

          const handleDurationChange = (val) => {

          const handleSampleCountChange = (groupId, raw) => {
            const num = parseInt(raw, 10);
            if (isNaN(num) || num < 1) return;
            const c = Math.min(50, num);
            const target = groups.find(g => g.id === groupId);
            if (!target) return;
            // A P+0 row still holding the ambient seed (20.9 / 0.03) is not a
            // reading; anything else typed into a sample is.
            const isSeed = (m, s) => parseFloat(m.day) === 0 && String(s.o2) === '20.9' && String(s.co2) === '0.03';
            const holdsData = (m, s) => !!s && (
              ['weight', 'initialWeight'].some(k => String(s[k] == null ? '' : s[k]).trim() !== '') ||
              (!isSeed(m, s) && ['o2', 'co2'].some(k => String(s[k] == null ? '' : s[k]).trim() !== '')));
            const lost = (target.measurements || []).reduce((n, m) =>
              n + (m.samples || []).slice(c).filter(s => holdsData(m, s)).length, 0);
            if (lost > 0 && !window.confirm((rt.confirmSampleTrim || 'Lowering the count to {c} removes {n} sample(s) with readings, on every day of this variant. Continue?')
                .replace('{c}', c).replace('{n}', lost))) return;
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const newM = g.measurements.map(m => {
                let smpls = [...(m.samples || [])];
                if (smpls.length > c) smpls = smpls.slice(0, c);
                // New samples are blank, except on a P+0 that is still the ambient
                // seed: an extra ambient sample next to flushed readings would
                // pull the P+0 average towards air.
                const ambient = smpls.length > 0 && smpls.every(s => isSeed(m, s));
                while (smpls.length < c) {
                  smpls.push({ id: Date.now() + smpls.length + Math.random(), o2: ambient ? '20.9' : '', co2: ambient ? '0.03' : '', weight: '', initialWeight: '' });
                }
                return { ...m, samples: smpls };
              });
              return { ...g, specs: { ...g.specs, sampleCount: c }, measurements: newM };
            }));
          };

          const buildExportData = () => {

            const primaryContact = (normalizedClientInfo.contacts && normalizedClientInfo.contacts[0]) || {};

            return {
              isPerfoTecReport: true,
              schemaVersion: globalConfig.SCHEMA_VERSION || '2.1',
              // + the published build (publish.mjs), so a file says which copy of
              // the tool wrote it.
              appVersion: (globalConfig.APP_VERSION || '') + (window.PERFOTEC_BUILD ? '+' + window.PERFOTEC_BUILD : ''),
              exportDate: new Date().toISOString(),

              unitStorage: 'metric',

              // `legacyQuality` is always written (possibly empty): its presence is

              groups: groups.map(g => ({ ...g, measurements: (g.measurements || []).map(m => ({ ...m, quality: qualityValue(m), legacyQuality: m.legacyQuality != null ? m.legacyQuality : '' })) })),
              analysis
            };
          };

          const exportData = async () => {
            const data = buildExportData();
            const jsonString = JSON.stringify(data, null, 2);
            const defaultName = `perfotec_report_${project.productName ? project.productName.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 'data'}.json`;
            if (globalConfig.exportJSON) {
                globalConfig.exportJSON(data, defaultName);
            } else {
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = defaultName; a.click(); URL.revokeObjectURL(url);
            }
          };

          // Shared helpers used by both the direct import path and the
          // multi-product modal flow (declared at component scope so they can
          // be invoked from confirmProductSelection too).
          const reportExtractPrimaryContact = globalConfig.extractPrimaryContact
            ? globalConfig.extractPrimaryContact.bind(globalConfig)
            : (c) => ({ contactName: '', role: '', email: '', phone: '', phoneDirect: '', phoneWork: '', contacts: [] });

          // Ensure clientInfo.contacts[] always has at least one seed card so
          // the multi-contact UI renders consistently after legacy imports.
          const reportSeedContacts = (data) => {
            if (!data || !Array.isArray(data.contacts) || data.contacts.length === 0) {
              return {
                ...data,
                contacts: [{ id: Date.now(), name: '', role: '', email: '', phoneDirect: '', phoneWork: '' }]
              };
            }
            return data;
          };

          // Apply a single intake product (from a migrated intake payload) to
          // report state. Extracted so the import flow can call it both
          // directly (1 product) and after the user picks one in the modal
          // (>1 products).
          const loadIntakeProduct = (d, prod) => {
            const client = d.client || {};
            const p = prod || {};
            const contactData = reportSeedContacts(reportExtractPrimaryContact(client));
            // The intake keeps its packaging as products[i].packagings[] (with
            // `weight`); older intakes had one flat set of fields on the product.
            // Reading only the flat fields is what emptied type, material and all
            // three dimensions when a card went from Intake straight to Report.
            // Same mapping as proposal.html's intake import.
            const pkgs = Array.isArray(p.packagings) && p.packagings.length > 0
              ? p.packagings.map(({ weight, ...pkg }, i) => ({ ...pkg, id: pkg.id != null ? pkg.id : i + 1, startWeight: weight || pkg.startWeight || '' }))
              : (p.packagingType || p.length || p.width || p.height || p.weight
                  ? [{ id: 1, packagingType: p.packagingType || 'Retail', material: p.material || '', length: p.length || '', width: p.width || '', height: p.height || '', startWeight: p.weight || '' }]
                  : null);
            const firstPkg = (pkgs && pkgs[0]) || {};

            setClientInfo({
              companyName: client.companyName || '',
              street: client.street || '',
              houseNumber: client.houseNumber || '',
              addressExtra: client.addressExtra || '',
              zipCode: client.zipCode || '',
              city: client.city || '',
              country: client.country || '',
              website: client.website || '',
              ...contactData,
              logo: client.logo || null
            });
            setProject(prev => ({ ...prev,
              productName: p.name || '',
              // The product link the intake chose. Without it the report opened
              // unlinked and its autosave re-linked the card to whatever product
              // the name happened to match.
              productId: p.productId || '',
              // Leaving a linked product for one without a link: its target window and
              // defects must go with it, as when the name is changed by hand.
              ...(!p.productId && prev.productId && window.PerfoTecProduct ? window.PerfoTecProduct.emptyTargetPatch() : {}),
              processingType: p.processingType || 'Whole',
              type: p.type || '',
              origin: p.origin || '',
              maturityStage: p.maturityStage || '',
              postHarvestTreatment: p.postHarvestTreatment || '',
              currentChallenge: p.currentChallenge || '',
              trialTarget: p.trialTarget || p.targetGoal || '',
              transportMode: p.transportMode || (p.transportModes?.[0] || ''),
              criteria: p.qualityCriteria || [],
              startImage: p.photo || null,
              startWeight: firstPkg.startWeight || prev.startWeight,

                // Local aliases for the helpers declared at component scope above.

                         role: d.project.contactRole || d.project.role || '',
                         email: d.project.contactEmail || d.project.email || '',
                         phoneDirect: d.project.phoneDirect || '',
                         phoneWork: d.project.phoneWork || d.project.contactPhone || d.project.phone || ''

                         street: d.project.street || '',
                         houseNumber: d.project.houseNumber || '',
                         addressExtra: d.project.addressExtra || '',
                         zipCode: d.project.zipCode || '',
                         city: d.project.city || '',
                         country: d.project.country || '',
                         website: d.project.website || '',
                         contactName: d.project.contactName || '',
                         role: d.project.contactRole || d.project.role || '',
                         email: d.project.contactEmail || d.project.email || '',
                         phone: d.project.contactPhone || d.project.phone || '',

                     if (!proj) return proj;

                     transportMode: d.project.transportMode || '',
                     technologies: d.project.technologies || [],
                     logo: d.project.logo || BRAND.logos.default

                   if(d.groups) setGroups(d.groups.map(g => ({
                     ...g,
                     measurements: (g.measurements || []).map(m => {
                       // `quality` is derived from the criterion scores and written

                         : (!unnormalised ? String(m.legacyQuality).trim() : (typeof m.quality === 'string' ? m.quality.trim() : ''));

                   if(d.analysis) setAnalysis({ ...d.analysis, graphNotes: d.analysis.graphNotes||'', conclusion: d.analysis.conclusion||'', variantConclusions: d.analysis.variantConclusions||{}, recommendation: d.analysis.recommendation||'retest', nextSteps: d.analysis.nextSteps||[], temperatureImages: getTempImages(d.analysis), temperatureLabel: d.analysis.temperatureLabel||'', showGasSection: d.analysis.showGasSection ?? null, showHubPredictions: d.analysis.showHubPredictions ?? null, showWeightLoss: d.analysis.showWeightLoss ?? null, showCriteriaScores: d.analysis.showCriteriaScores ?? null, generalObservations: d.analysis.generalObservations||'', targetAchieved: d.analysis.targetAchieved||null, targetEvaluation: d.analysis.targetEvaluation||'', anonymise: d.analysis.anonymise || null });

          useEffect(() => {

              pendingBoardSave.current = null;
              if (saveStateRef.current !== 'conflict') markSave('saving');

                const B = window.PerfoTecBoard;
                if (B.readPhaseFileHead && !forceSaveRef.current) {
                  const head = await B.readPhaseFileHead(boardProjectId, 'report', 2048);
                  const m = head && head.match(/"docRev"\s*:\s*"([^"]*)"/);
                  const onDisk = m ? m[1] : null;
                  if (head !== null && onDisk !== knownRevRef.current) {
                    const e = new Error('conflict'); e.conflict = true; throw e;
                  }
                }
                forceSaveRef.current = false;
                const rev = Date.now().toString(36) + '-' + SESSION_ID;
                // docRev first: the next save reads it from the file's first bytes.
                await B.writePhaseFile(boardProjectId, 'report', { docRev: rev, ...buildExportData() });
                knownRevRef.current = rev;
                const manifest = await B.readManifest();
                const idx = (manifest.projects || []).findIndex(p => p.id === boardProjectId);
                if (idx >= 0) {
                  const p = manifest.projects[idx];
                  const patch = { files: { ...(p.files || {}), report: true }, updatedAt: new Date().toISOString() };
                  if (!p.client && clientInfo.companyName) patch.client = clientInfo.companyName;
                  if (!p.product && project.productName) patch.product = project.productName;
                  // The product LINK is board-owned and always mirrored, unlike the
                  // product NAME, which Pipedrive owns on CRM projects and is
                  // therefore only filled when the board has nothing yet.
                  if (project.productId && p.productId !== project.productId) patch.productId = project.productId;
                  // The project title is typed here (the board has no field for it),
                  // so it is mirrored, like the product link: the tiles show it. The
                  // tool's placeholder is no title; a title the user cleared is cleared.
                  const projectTitle = B.projectTitle ? B.projectTitle(project.reportTitle) : String(project.reportTitle || '').replace(/\s+/g, ' ').trim();

                  // employee (= product manager on the board).
