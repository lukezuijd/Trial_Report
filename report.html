                                    ? <div className="h-12 flex items-center justify-center rounded-xl bg-slate-50 border border-slate-200 font-bold text-slate-300">—</div>
                                    : <input type="text" inputMode="decimal" className={"w-full h-12 px-3 border-2 border-slate-300 rounded-xl text-center text-lg font-bold text-green-900 outline-none focus:border-green-500" + (gasSampleIssue(s) === 'co2' || gasSampleIssue(s) === 'sum' ? ' !border-red-500 !bg-red-50' : '')}
                                        value={s.co2 === 0 ? 0 : (s.co2 || '')} onChange={e => updateSample(i, 'co2', e.target.value)} />}
                                </label>
                              )}
                              {parseFloat(day) > 0 && (
                                <label className="block">
                                  <span className="block text-[11px] font-extrabold uppercase tracking-wider mb-1 text-amber-700">{withUnit(rt?.thInitialWeight || 'Initial Wt.', wUnit)}</span>
                                  <input type="text" inputMode="decimal" className="w-full h-12 px-3 border-2 border-amber-300 bg-amber-50/50 rounded-xl text-center text-lg font-bold text-amber-900 outline-none focus:border-amber-500"
                                    value={s.initialWeight === 0 ? 0 : (s.initialWeight || '')} onChange={e => updateSample(i, 'initialWeight', e.target.value)}
                                    placeholder={day0Samples?.[i]?.weight ? 'P+0: ' + day0Samples[i].weight : wUnit} title={rt?.initialWeightHint || 'Empty: compared with the P+0 sample in the same position.'} />
                                </label>
                              )}
                              <label className="block">
                                <span className="block text-[11px] font-extrabold uppercase tracking-wider mb-1 text-slate-600">
                                  {rt?.thWeightPlain || 'Weight'} {parseFloat(day) === 0 && '(start)'}
                                </span>
                                <input type="text" inputMode="decimal" className="w-full h-12 px-3 border-2 border-slate-300 rounded-xl text-center text-lg font-bold outline-none focus:border-slate-500"
                                  value={s.weight === 0 ? 0 : (s.weight || '')} onChange={e => updateSample(i, 'weight', e.target.value)} placeholder={wUnit} />
                              </label>
                            </div>
                            {/* Not on P+0: there the weight IS the start weight, so a
                                loss row would always read 0.0% and mean nothing. */}
                            {loss !== null && parseFloat(day) > 0 && (
                              <div className="mt-3 text-xs font-bold flex items-center gap-1.5" style={{ color: loss > 3 ? '#dc2626' : BRAND.colors.green }}>
                                <Scale size={13}/> {rt?.lossLabel || 'Loss'}: {loss.toFixed(1)}%
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    )}

                    {/* Unconditional, same reasoning as the day table: these are the
                        O₂ / CO₂ / weight inputs, so if they can vanish the tool is
                        unusable. On a phone the cards above are the nicer way in and
                        this stays below as the guaranteed one. */}
                    <div className="overflow-x-auto w-full rounded-xl border border-slate-200 shadow-sm mb-6">
                      <table className="w-full text-sm">
                        <thead className="bg-slate-100 border-b border-slate-200">
                          <tr className="text-left text-slate-600 uppercase tracking-wider text-[10px] font-bold">
                            <th className="p-3 text-center">#</th>
                            {isMAP && <th className="p-3" style={{color: BRAND.colors.blue}}>O₂ (%)</th>}
                            {isMAP && <th className="p-3" style={{color: BRAND.colors.green}}>CO₂ (%)</th>}
                            {parseFloat(day) > 0 && <th className="p-3 text-amber-700">{withUnit(rt?.thInitialWeight || 'Initial Wt.', wUnit)}</th>}
                            <th className="p-3">{rt?.thWeightPlain || 'Weight'} ({wUnit}) {parseFloat(day)===0 && '(Start)'}</th>
                            <th className="p-3"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {samples.map((s, i) => (
                            <tr key={i} className="hover:bg-slate-50 transition-colors bg-white">
                              <td className="p-3 font-extrabold text-slate-400 text-center">{i + 1}</td>
                              {isMAP && (
                                <td className="p-3">
                                   {isOpened ? <div className="text-center font-bold text-slate-300 w-full">-</div> : <input type="text" inputMode="decimal" className={"w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-center font-bold text-blue-900" + (gasSampleIssue(s) === 'o2' || gasSampleIssue(s) === 'sum' ? ' !border-red-500 !bg-red-50' : '')} value={s.o2 === 0 ? 0 : (s.o2 || '')} onChange={e => updateSample(i, 'o2', e.target.value)} />}
                                </td>
                              )}
                              {isMAP && (
                                <td className="p-3">
                                   {isOpened ? <div className="text-center font-bold text-slate-300 w-full">-</div> : <input type="text" inputMode="decimal" className={"w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-green-500 text-center font-bold text-green-900" + (gasSampleIssue(s) === 'co2' || gasSampleIssue(s) === 'sum' ? ' !border-red-500 !bg-red-50' : '')} value={s.co2 === 0 ? 0 : (s.co2 || '')} onChange={e => updateSample(i, 'co2', e.target.value)} />}
                                </td>
                              )}
                              {parseFloat(day) > 0 && (
                                <td className="p-3"><input type="text" inputMode="decimal" className="w-full p-2 border border-amber-300 bg-amber-50/50 rounded-lg outline-none focus:ring-2 focus:ring-amber-500 text-center font-bold text-amber-900" value={s.initialWeight === 0 ? 0 : (s.initialWeight || '')} onChange={e => updateSample(i, 'initialWeight', e.target.value)} placeholder={day0Samples?.[i]?.weight ? 'P+0: ' + day0Samples[i].weight : wUnit} title={rt?.initialWeightHint || 'Empty: compared with the P+0 sample in the same position.'} /></td>
                              )}
                              <td className="p-3"><input type="text" inputMode="decimal" className="w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-slate-500 text-center font-bold" value={s.weight === 0 ? 0 : (s.weight || '')} onChange={e => updateSample(i, 'weight', e.target.value)} placeholder={wUnit} /></td>
                              <td className="p-3 text-center"><button onClick={() => removeSample(i)} className="text-red-400 hover:text-red-600 bg-red-50 p-2 rounded-lg hover:bg-red-100 transition-colors"><Trash2 size={16}/></button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {isMAP && samples.some(smp => gasSampleIssue(smp)) && (
                      <div className="-mt-3 mb-6 rounded-xl border-2 border-red-300 bg-red-50 text-red-900 px-4 py-3 text-sm font-bold flex items-start gap-2">
                        <AlertTriangle size={16} className="shrink-0 mt-0.5"/>
                        <span>{(rt?.gasInvalid || 'Check the gas readings of sample {list}: O₂ and CO₂ each lie between 0 and 100 %, and together cannot exceed 100 %.')
                          .replace('{list}', samples.map((smp, i) => gasSampleIssue(smp) ? i + 1 : null).filter(Boolean).join(', '))}</span>
                      </div>
                    )}
                    <button onClick={addSample} className="w-full md:w-auto text-sm flex items-center justify-center gap-2 font-bold px-4 py-3.5 md:py-2 bg-green-50 text-green-700 rounded-xl md:rounded-lg hover:bg-green-100 active:bg-green-100 transition-colors mb-5 md:mb-6 border-2 md:border border-green-200"><Plus size={18}/> {rt?.addSampleBtn || 'Add Sample'}</button>

                    <label className="block mb-2 text-xs font-bold tracking-wide text-slate-500 uppercase">{rt?.generalObs || 'General Observations'}</label>
                    <textarea className="w-full p-4 border border-slate-300 rounded-xl text-sm h-24 md:h-28 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm resize-y" value={notes || ''} onChange={e => setNotes(e.target.value)} placeholder="..." />
                  </div>

                  <div className={`bg-slate-50 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200 shadow-inner flex flex-col ${sideBySide ? 'h-full overflow-hidden' : ''}`}>
                     <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-200 pb-4 mb-5 md:mb-6">
                       <h4 className="font-extrabold text-base md:text-lg text-slate-800 flex items-center gap-3">
                         {rt?.qualityEval || 'Quality Evaluation'}
                         {liveQuality && !liveQuality.legacy && (
                           <span className="text-sm font-extrabold px-2.5 py-1 rounded-lg bg-white border border-slate-200 shadow-sm" style={{ color: BRAND.colors.green }} title={rt?.qualityAvgHint || ''}>Ø {liveQuality.value.toFixed(1)}</span>
                         )}
                       </h4>
                       <label className="flex items-center gap-3 text-sm bg-white border border-slate-300 px-4 py-3 md:py-2 rounded-xl md:rounded-lg cursor-pointer shadow-sm hover:bg-slate-50 transition-colors">
                         <input type="checkbox" checked={evaluateQuality} onChange={e => setEvaluateQuality(e.target.checked)} className="accent-green-600 w-5 h-5" />
                         <span className="font-bold text-slate-700">{rt?.enableEval || 'Enable Evaluation'}</span>
                       </label>
                     </div>

                     {liveQuality && liveQuality.legacy && (
                       <div className="mb-4 flex flex-wrap items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
                         <span className="flex-1 min-w-[12rem]">{(rt?.legacyQualityNote || 'Earlier overall score: {v}. It counts until you score the criteria below.').replace('{v}', liveQuality.value.toFixed(1))}</span>
                         <button type="button" onClick={() => setLegacyQuality('')} className="shrink-0 font-bold px-3 py-1.5 rounded-lg bg-white border border-amber-300 text-amber-800 hover:bg-amber-100">{rt?.legacyQualityRemove || 'Remove'}</button>
                       </div>
                     )}
                     {evaluateQuality ? (
                       <div className={`flex flex-col ${sideBySide ? 'flex-1 min-h-0 overflow-hidden' : ''}`}>
                         {/* ---- PHONE: one card per criterion ----------------------
                          * Criterion / score / notes as three table columns leaves a
                          * score box too narrow to tap and a notes field too narrow
                          * to read. Stacked, the score sits next to its name where
                          * you can hit it, and the note gets the full width.
                          * -------------------------------------------------------- */}
                         {isPhone && (
                         <div className="space-y-2.5">
                           {qualityParams.length === 0 && (
                             <p className="text-center italic text-slate-400 py-6 text-sm">{rt?.noCriteriaModal || 'No criteria selected in Global Settings.'}</p>
                           )}
                           {qualityParams.map((param, i) => (
                             <div key={i} className="bg-white rounded-xl border border-slate-200 p-3">
                               <div className="flex items-center gap-3">
                                 <span className="flex-1 font-bold text-slate-800 text-sm leading-tight">{param.name}</span>
                                 <input type="text" inputMode="decimal"
                                   className={`w-16 h-12 border-2 rounded-xl text-center text-lg font-extrabold text-blue-900 outline-none focus:border-blue-500 shrink-0 ${scoreOutOfRange(param.score) ? 'border-red-400 bg-red-50' : 'border-slate-300'}`}
                                   value={param.score || ''} onChange={e => updateParam(i, 'score', e.target.value)} placeholder="–" />
                               </div>
                               <input type="text"
                                 className="mt-2 w-full h-11 px-3 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500"
                                 value={param.notes || ''} onChange={e => updateParam(i, 'notes', e.target.value)} placeholder={rt?.thNotes || 'Notes'} />
                             </div>
                           ))}
                         </div>
                         )}

                         <div className={`rounded-xl border border-slate-200 bg-white ${sideBySide ? 'flex-1 min-h-0 overflow-y-auto pr-2' : 'overflow-x-auto'}`}>
                           <table className="w-full text-sm">
                             <thead className="text-left text-slate-500 sticky top-0 bg-slate-100 border-b border-slate-200 shadow-sm">
                               <tr className="uppercase tracking-wider text-[10px] font-bold">
                                 <th className="p-3">{rt?.thCriterion || 'Criterion'}</th>
                                 <th className="p-3 text-center w-20">{rt?.thScore || 'Score'}</th>
                                 <th className="p-3">{rt?.thNotes || 'Notes'}</th>
                               </tr>
                             </thead>
                             <tbody className="divide-y divide-slate-100">
                               {qualityParams.length === 0 && <tr><td colSpan="3" className="text-center italic text-slate-400 py-8">
                                 {rt?.noCriteriaModal || 'No criteria selected in Global Settings.'}
                                 {onChooseCriteria && <div className="mt-3 not-italic"><button type="button" onClick={() => { handleSave(); onChooseCriteria(); }} className="font-bold px-4 py-2 rounded-lg text-white shadow-sm" style={{ backgroundColor: BRAND.colors.blue }}>{rt?.chooseCriteria || 'Choose criteria'}</button></div>}
                               </td></tr>}
                               {qualityParams.map((param, i) => (
                                 <tr key={i} className="hover:bg-slate-50 transition-colors">
                                   <td className="p-3 text-slate-800 font-bold">{param.name}</td>
                                   <td className="p-3">
                                      <input type="text" inputMode="decimal" className={`w-full p-2 border rounded-lg text-center font-extrabold text-blue-900 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm ${scoreOutOfRange(param.score) ? 'border-red-400 bg-red-50' : 'border-slate-300'}`} value={param.score || ''} onChange={e => updateParam(i, 'score', e.target.value)} placeholder="-" />
                                   </td>
                                   <td className="p-3">
                                      <input type="text" className="w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={param.notes || ''} onChange={e => updateParam(i, 'notes', e.target.value)} placeholder="..." />
                                   </td>
                                 </tr>
                               ))}
                             </tbody>
                           </table>
                         </div>
                         {anyOutOfRange && <p className="mt-2 text-xs font-bold text-red-600">{rt?.scoreOutOfRangeBlock || 'Correct the scores outside 1-10 first.'}</p>}

                         {/* Legend */}
                         <div className="mt-6 pt-6 border-t border-slate-200 shrink-0">
                           <p className="text-[10px] font-extrabold text-slate-400 mb-3 uppercase tracking-widest">{rt?.scoreScale || 'Score Scale (1-10)'}</p>
                           <div className="flex flex-wrap gap-2 text-xs text-slate-600 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                             {MINI_SCORES.map(s => <div key={s[0]} className="flex items-center gap-1.5 shrink-0"><strong className={`${s[2]} bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100 text-[11px] leading-none`}>{s[0]}</strong><span className="font-medium text-[11px] leading-none">{s[1]}</span></div>)}
                           </div>
                         </div>
                       </div>
                     ) : (
                       <div className="flex flex-col items-center justify-center flex-1 py-8 px-4 text-center text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                         <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                            <AlertTriangle size={32} className="text-slate-300"/>
                         </div>
                         <p className="text-sm font-medium max-w-[250px]">{rt?.evalDisabled || 'Quality scoring is currently disabled.'}<br/>{rt?.evalDisabledHint || "Tick 'Score quality' to fill it in."}</p>
                       </div>
                     )}
                  </div>
                </div>

                {/* Save must be reachable with one thumb and never scroll away:
                    shrink-0 keeps it pinned while the middle scrolls, and on a
                    phone it takes the full width because that is the one action
                    you came here for. */}
                <div className="bg-slate-100 p-4 md:p-6 border-t border-slate-200 flex gap-3 md:gap-4 md:justify-end shrink-0"
                     style={{ paddingBottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
                  <button onClick={onClose} className="px-5 md:px-6 py-3.5 md:py-3 text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl font-bold transition-all shadow-sm shrink-0">{rt?.cancel || 'Cancel'}</button>
                  <button onClick={handleSave} disabled={anyOutOfRange || !!dayProblem} title={dayProblem ? dayProblem : anyOutOfRange ? (rt?.scoreOutOfRangeBlock || 'Correct the scores outside 1-10 first.') : undefined} className="flex-1 md:flex-none px-8 py-3.5 md:py-3 text-white font-bold rounded-xl shadow-lg shadow-green-500/30 hover:shadow-green-500/50 md:hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0" style={{ backgroundColor: BRAND.colors.green }}><Save size={18}/> {rt?.saveData || 'Save Data'}</button>
                </div>
              </div>
            </div>
          );
        };

        /* ==========================================================================
         * Panel — a form section that is collapsed on a phone and always open on a
         * desktop.
         *
         * The Setup tab is five full-height panels. On a 375px screen that is a lot
         * of scrolling to reach one field, and you cannot see what else exists.
         * Collapsed, the whole form fits on one screen as a list of headings you
         * tap into.
         *
         * Desktop is deliberately left exactly as it was: there the fields sit two
         * and three across and collapsing them would only add clicks. So the phone
         * gets the accordion and the desktop keeps the plain heading — same markup,
         * one branch.
         *
         * The `open` state is kept even while the desktop branch renders, so
         * rotating a tablet does not reset which panels you had unfolded.
         * ========================================================================== */
        const useMediaQuery = (query) => {
          const [matches, setMatches] = useState(() =>
            typeof window.matchMedia === 'function' ? window.matchMedia(query).matches : false);
          useEffect(() => {
            if (typeof window.matchMedia !== 'function') return;
            const mq = window.matchMedia(query);
            // Both signals: the media-query change event is the right one, but it
            // does not fire in every environment (it did not under viewport
            // emulation), and being wrong here means the whole measurement layout
            // is wrong. `resize` re-reads mq.matches, so the two cannot disagree.
            const sync = () => setMatches(mq.matches);
            mq.addEventListener('change', sync);
            window.addEventListener('resize', sync);
            sync();
            return () => {
              mq.removeEventListener('change', sync);
              window.removeEventListener('resize', sync);
            };
          }, [query]);
          return matches;
        };

        // Width alone is the wrong test. A laptop with DevTools docked to the
        // right, or a half-screen window, is under 768px and would get the phone
        // layout — panels collapsed, the day table reflowed somewhere else — which
        // is not what a desktop user asked for and made the measurement inputs
        // look lost. `pointer: coarse` is what actually separates a touch device
        // from a narrow mouse window, so both must hold.
        const usePhoneLayout = () => useMediaQuery('(max-width: 767px) and (pointer: coarse)');

        /* `chip` is the smaller variant used by the panels inside the Variant tab:
         * a plain white box with a label-sized heading and a coloured icon square,
         * instead of a full section with an accent bar. Same collapse behaviour. */
        const Panel = ({ title, icon: Icon, accent, iconBg, badge, children, bodyClass = '', defaultOpen = false, chip = false, chipClass = '', fill = false, openSignal = 0 }) => {
          const isPhone = usePhoneLayout();
          const [open, setOpen] = useState(defaultOpen);
          // Bumping openSignal opens a collapsed panel, e.g. to point someone at it.
          useEffect(() => { if (openSignal) setOpen(true); }, [openSignal]);
          const showBody = !isPhone || open;

          if (chip) {
            return (
              // `fill` (height:100%) is OPT-IN, and must stay that way. It is right
              // for panels that sit side by side in a grid and should match heights,
              // and catastrophic for one stacked above a sibling: height:100% of a
              // STRETCHED grid item resolves against a height that already includes
              // that sibling, so the panel grows to fill the whole column and pushes
              // the sibling past the bottom edge — where the column's overflow-hidden
              // deletes it. That is what made the whole Measurements panel disappear
              // on screens wide enough for the lg: grid to apply, while everything
              // above it rendered normally.
              <div className={`bg-white p-4 sm:p-8 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col ${fill ? 'h-full' : ''}`}>
                {isPhone ? (
                  <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
                    className={`w-full flex items-center gap-2.5 text-left ${open ? 'border-b border-slate-100 pb-3 mb-3' : ''}`}>
                    {Icon && <div className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${chipClass}`}><Icon size={18}/></div>}
                    <span className="flex-1 min-w-0 font-extrabold text-slate-800 leading-tight">{title}</span>
                    <ChevronDown size={20} className="shrink-0 text-slate-400 transition-transform" style={{ transform: open ? 'rotate(180deg)' : 'none' }} />
                  </button>
                ) : (
                  <label className="block mb-2 font-extrabold text-slate-800 text-lg border-b border-slate-100 pb-3 flex items-center gap-2">
                    {Icon && <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${chipClass}`}><Icon size={16}/></div>}
                    {title}
                  </label>
                )}
                {showBody && (bodyClass ? <div className={bodyClass}>{children}</div> : children)}
              </div>
            );
          }

          return (
            <section className="bg-white p-4 sm:p-8 md:p-10 rounded-2xl sm:rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1" style={{ backgroundColor: accent }}></div>
              {isPhone ? (
                <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
                  className={`w-full flex items-center gap-3 text-left ${open ? 'border-b-2 border-slate-100 pb-4 mb-5' : ''}`}>
                  {Icon && (
                    <div className="p-2.5 rounded-xl shrink-0" style={{ backgroundColor: iconBg || (accent + '1a') }}>
                      <Icon size={22} color={accent} />
                    </div>
                  )}
                  <span className="flex-1 min-w-0 font-extrabold text-base text-slate-800 leading-tight">{title}</span>
                  <ChevronDown size={22} className="shrink-0 text-slate-400 transition-transform" style={{ transform: open ? 'rotate(180deg)' : 'none' }} />
                </button>
              ) : (
                <div className="flex flex-wrap items-center justify-between gap-4 border-b-2 border-slate-100 pb-6 mb-8">
                  <div className="flex items-center gap-4">
                    {Icon && (
                      <div className="p-3 rounded-xl" style={{ backgroundColor: iconBg || (accent + '1a') }}>
                        <Icon size={28} color={accent} />
                      </div>
                    )}
                    <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">{title}</h2>
                  </div>
                  {badge}
                </div>
              )}
              {/* A badge (e.g. the metric/imperial switch) sits beside the title on a
                  desktop. On a phone there is no room next to a title and a chevron,
                  so it drops into the body as its own row — visible once you open the
                  panel, which is also when it is relevant. */}
              {isPhone && badge && open && <div className="mb-4 flex">{badge}</div>}
              {showBody && (bodyClass ? <div className={bodyClass}>{children}</div> : children)}
            </section>
          );
        };

        const DetailsModal = ({ isOpen, onClose, data, onSave, rt }) => {
          if (!isOpen) return null;
          const initialImages = (data.images || []).map(img => typeof img === 'string' ? {url: img, caption: '', category: 'External Quality'} : { ...img, category: img.category || 'External Quality' });
          const [images, setImages] = useState(initialImages);

          // Measurement photos are where a report's weight comes from: one real
          // trial measured 62.5 MB for 21 photos, 100% of the file. Downscale on
          // the way in (see readImageFile) instead of storing the camera original,
          // and keep the pixel size so the print layout does not have to decode
          // the image to know its aspect.
          const [imgBusy, setImgBusy] = useState(0);
          // Anything added, removed or edited since the dialog opened.
          const [changed, setChanged] = useState(false);
          // Same signal the touch CSS uses: a coarse pointer means a phone or
          // tablet, which has a camera worth offering. Deliberately not UA
          // sniffing, and not `navigator.mediaDevices` — a desktop webcam exists
          // but nobody photographs a pallet with it.
          const hasCamera = typeof window.matchMedia === 'function'
            && window.matchMedia('(pointer: coarse)').matches;
          const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            e.target.value = null;                 // allow re-picking the same file
            setImgBusy(n => n + files.length);
            if (files.length) setChanged(true);
            for (const file of files) {
              try {
                const r = await globalConfig.readImageFile(file);
                setImages(prev => [...prev, {
                  url: r.dataUrl, caption: '', category: 'External Quality',
                  w: r.width, h: r.height, bytes: r.bytes
                }]);
              } catch (err) {
                // Losing the photo is worse than storing it big.
                const reader = new FileReader();
                reader.onloadend = () => setImages(prev => [...prev, { url: reader.result, caption: '', category: 'External Quality' }]);
                reader.readAsDataURL(file);
              } finally {
                setImgBusy(n => Math.max(0, n - 1));
              }
            }
          };

          const removeImage = (idx) => { setImages(images.filter((_, i) => i !== idx)); setChanged(true); };
          const updateImageField = (idx, field, value) => {
            setImages(images.map((img, i) => i === idx ? { ...img, [field]: value } : img));
            setChanged(true);
          };

          // Save only once every photo has been read: photos still being
          // processed used to finish into a closed dialog and vanish.
          const handleSave = () => { if (imgBusy > 0) return; onSave({ ...data, images }); onClose(); };
          // Closing without saving throws the changes away, so ask first.
          const discard = () => {
            if ((changed || imgBusy > 0) && !window.confirm(rt?.confirmDiscardPhotos || 'Close without saving the changes to these photos?')) return;
            onClose();
          };

          return (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 font-sans print:hidden">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden border border-slate-200 flex flex-col max-h-[90vh]">
                <div className="p-6 flex justify-between items-center text-white" style={{ background: `linear-gradient(90deg, ${BRAND.colors.black} 0%, #423B3B 50%, ${BRAND.colors.black} 100%)` }}>
                  <h3 className="font-extrabold text-xl flex items-center gap-3" style={{ fontFamily: BRAND.fonts.heading }}><Camera size={20}/> {rt?.managePhotos || 'Manage Photos'}</h3>
                  <button onClick={discard} className="hover:text-red-300 transition bg-white/10 p-2 rounded-full"><X size={20}/></button>
                </div>
                
                <div className="p-8 overflow-y-auto bg-slate-50">
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-4">
                    {images.map((img, idx) => (
                      <div key={idx} className="relative group border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm flex flex-col hover:shadow-md transition-shadow">
                        <div className="aspect-square relative bg-slate-100 flex items-center justify-center p-2">
                           <img src={img.url} className="max-w-full max-h-full object-contain rounded-lg" />
                           <button onClick={() => removeImage(idx)} className="hover-reveal absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all shadow-lg hover:bg-red-600 hover:scale-110"><Trash2 size={16}/></button>
                        </div>
                        <div className="p-3 border-t border-slate-100 flex flex-col gap-2">
                          <select className="w-full p-2 text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" value={img.category || 'External Quality'} onChange={e => updateImageField(idx, 'category', e.target.value)}>
                              {[
                                ['External Quality', rt?.catExternalQuality || 'External Quality'],
                                ['Internal Quality', rt?.catInternalQuality || 'Internal Quality'],
                                ['Loose Produce',    rt?.catLooseProduce    || 'Loose Produce'],
                                ['Box/Crate',        rt?.catBoxCrate        || 'Box/Crate'],
                                ['Weight measurement', rt?.catWeightMeas    || 'Weight measurement'],
                                ['Gas measurement',  rt?.catGasMeas         || 'Gas measurement'],
                                ['Other',            rt?.catOther           || 'Other']
                              ].map(([val, label]) => <option key={val} value={val}>{label}</option>)}
                          </select>
                          <input type="text" className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-shadow placeholder:text-slate-400" placeholder={rt?.captionPlaceholder || 'Caption / Description...'} value={img.caption || ''} onChange={e => updateImageField(idx, 'caption', e.target.value)} />
                        </div>
                      </div>
                    ))}
                    {/* Two separate inputs on a phone, not one. `capture` opens the
                        camera directly, which is what you want standing in front of
                        the pallet — but it also takes the gallery away, so a photo
                        shot earlier could no longer be attached. Shown on coarse
                        pointers only: on a desktop "Take photo" would just open the
                        same file dialog and read as a bug. */}
                    {hasCamera && (
                      <label className="border-4 border-dashed rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all aspect-square min-h-[200px] shadow-sm group"
                             style={{ borderColor: BRAND.colors.green, backgroundColor: BRAND.colors.green + '0d' }}>
                         <div className="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            {imgBusy > 0
                              ? <svg className="animate-spin h-7 w-7" style={{ color: BRAND.colors.green }} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                              : <Camera size={28} style={{ color: BRAND.colors.green }}/>}
                         </div>
                         <span className="text-sm font-extrabold" style={{ color: BRAND.colors.green }}>
                           {imgBusy > 0 ? (rt?.photoProcessing || 'Processing…') + ' (' + imgBusy + ')' : (rt?.takePhoto || 'Take photo')}
                         </span>
                         <span className="text-xs text-slate-400 mt-1">{rt?.photoResizeHint || 'Resized automatically'}</span>
                         <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                      </label>
                    )}
                    <label className="border-4 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all aspect-square min-h-[200px] shadow-sm group">
                       <div className="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                          {imgBusy > 0
                            ? <svg className="animate-spin h-7 w-7 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                            : <Upload size={28} className="text-blue-500"/>}
                       </div>
                       <span className="text-sm text-slate-600 font-extrabold">
                         {imgBusy > 0 ? (rt?.photoProcessing || 'Processing…') + ' (' + imgBusy + ')' : (hasCamera ? (rt?.chooseExisting || 'Choose existing') : (rt?.uploadPhotos || 'Upload Photos'))}
                       </span>
                       <span className="text-xs text-slate-400 mt-1">{rt?.photoResizeHint || 'Resized automatically'}</span>
                       <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload} />
                    </label>
                  </div>
                </div>
                
                <div className="bg-white p-6 border-t border-slate-200 flex justify-end gap-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                   {/* "Done" here used to close WITHOUT saving: it is Cancel. */}
                   <button onClick={discard} className="px-6 py-3 text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl font-bold transition-all shadow-sm">{rt?.cancel || 'Cancel'}</button>
                   <button onClick={handleSave} disabled={imgBusy > 0} className="px-8 py-3 text-white font-bold rounded-xl shadow-lg shadow-green-500/30 hover:shadow-green-500/50 hover:-translate-y-0.5 transition-all flex items-center gap-2 disabled:opacity-60 disabled:cursor-wait disabled:hover:translate-y-0" style={{ backgroundColor: BRAND.colors.green }}><Save size={18}/> {imgBusy > 0 ? (rt?.photosBusy || 'Processing photos…') : (rt?.savePhotos || 'Save Photos')}</button>
                </div>
              </div>
            </div>
          );
        };

        // Editor: look at every image of the anonymised report in turn. Drag
        // across a sticker, label or logo to cover it, or leave the image out;
        // "Checked" records that someone looked. Only the anonymised version
        // changes (see anonymiseImages) — the saved report keeps the original.
        const AnonImageReviewer = ({ items, decisions, index, onIndex, onChange, onClose, rt }) => {
          const item = items[index];
          const d = (item && decisions[item.key]) || {};
          const boxes = d.boxes || [];
          const last = items.length - 1;
          const [draft, setDraft] = useState(null); // { a, b } while dragging
          const surface = useRef(null);
          // Zoomed: the image at its own pixel size (at least twice the fitted
          // size) in a scrolling area. A label readable in the PDF must be
          // readable here. Areas are stored as fractions, so they stay put.
          const imgRef = useRef(null);
          const [zoomW, setZoomW] = useState(0);
          useEffect(() => { setZoomW(0); }, [index]);
          const toggleZoom = () => {
            if (zoomW) { setZoomW(0); return; }
            const img = imgRef.current;
            if (!img) return;
            setZoomW(Math.max(img.naturalWidth || 0, Math.round(img.getBoundingClientRect().width * 2)));
          };
          // Merged into the stored decision by the parent, so two changes in one
          // frame (a new area, then Enter) cannot overwrite each other.
          const set = (patch) => onChange(item.key, patch);
          const checkedNext = () => { set({ checked: true }); if (index < last) onIndex(index + 1); else onClose(); };
          // The key handler is bound once; it reads the current actions here.
          const act = useRef(null);
          act.current = { checkedNext, onClose, prev: () => { if (index > 0) onIndex(index - 1); }, next: () => { if (index < last) onIndex(index + 1); } };
          const root = useRef(null);
          // When the image now on screen appeared: Enter confirms only an image
          // that has been shown for a moment.
          const shownAt = useRef(0);
          useEffect(() => { shownAt.current = Date.now(); }, [index]);
          useEffect(() => {
            // Focus moves into the reviewer (and back when it closes), and Tab
            // stays inside it: keys never reach the editor behind the overlay.
            const opener = document.activeElement;
            if (root.current) root.current.focus();
            const onKey = (e) => {
              if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
              const a = act.current;
              const inside = root.current && e.target instanceof Node && root.current.contains(e.target);
              if (e.key === 'Escape') { e.preventDefault(); a.onClose(); }
              else if (e.key === 'ArrowLeft') a.prev();
              else if (e.key === 'ArrowRight') a.next();
              else if (e.key === 'Tab' && root.current) {
                const buttons = [...root.current.querySelectorAll('button')];
                if (!buttons.length) return;
                e.preventDefault();
                const i = buttons.indexOf(document.activeElement);
                buttons[e.shiftKey ? (i <= 0 ? buttons.length - 1 : i - 1) : (i < 0 || i === buttons.length - 1 ? 0 : i + 1)].focus();
              } else if (e.key === 'Enter') {
                // A focused button (reached with Tab) does its own job: Enter on
                // 'Leave this image out' leaves it out.
                if (inside && e.target.closest('button')) return;
                e.preventDefault();
                // A held key, or a press before the image is on screen, never
                // marks an image as looked at.
                if (e.repeat || Date.now() - shownAt.current < 250) return;
                a.checkedNext();
              }
            };
            window.addEventListener('keydown', onKey);
            const overflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
            return () => {
              window.removeEventListener('keydown', onKey);
              document.body.style.overflow = overflow;
              if (opener && opener.focus && document.body.contains(opener)) opener.focus();
            };
          }, []);
          if (!item) return null;

          const clamp = (v) => Math.min(1, Math.max(0, v));
          const at = (e) => {
            const r = surface.current.getBoundingClientRect();
            return { x: clamp((e.clientX - r.left) / r.width), y: clamp((e.clientY - r.top) / r.height) };
          };
          const rect = (dr) => ({ x: Math.min(dr.a.x, dr.b.x), y: Math.min(dr.a.y, dr.b.y), w: Math.abs(dr.a.x - dr.b.x), h: Math.abs(dr.a.y - dr.b.y) });
          const r4 = (n) => Math.round(n * 10000) / 10000;
          const down = (e) => {
            if (d.hide || (e.pointerType === 'mouse' && e.button !== 0)) return;
            e.preventDefault();
            // Keeps the drag when the pointer leaves the image; never worth failing over.
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* not an active pointer */ }
            const p = at(e);
            setDraft({ a: p, b: p });
          };
          const move = (e) => { if (draft) setDraft({ a: draft.a, b: at(e) }); };
          const up = () => {
            if (!draft) return;
            const b = rect(draft);
            setDraft(null);
            // A click without a drag is not an area.
            if (b.w > 0.008 && b.h > 0.008) set({ boxes: [...boxes, { x: r4(b.x), y: r4(b.y), w: r4(b.w), h: r4(b.h) }] });
          };
          const pct = (b) => ({ left: b.x * 100 + '%', top: b.y * 100 + '%', width: b.w * 100 + '%', height: b.h * 100 + '%' });
          const navBtn = 'absolute top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center transition';
          const ghostBtn = 'px-4 py-2.5 rounded-xl font-bold border border-white/30 text-white hover:bg-white/10 transition';
          return (
            <div ref={root} tabIndex={-1} className="fixed inset-0 z-[100] flex flex-col select-none font-sans outline-none" style={{ background: 'rgba(8, 12, 20, 0.95)' }} role="dialog" aria-modal="true" aria-label={item.label}
              /* A mouse click must not leave focus on a button, or the next Enter
                 would press that button again instead of 'Checked · next'. */
              onMouseDown={(e) => { if (e.target.closest && e.target.closest('button')) e.preventDefault(); }}>
              <div className="flex items-center justify-between gap-3 px-5 py-3 text-white">
                <div className="min-w-0">
                  <div className="font-bold truncate">{item.label}</div>
                  <div className="text-xs text-white/60">{index + 1} / {items.length} · {d.hide ? rt.anonHiddenBadge : d.checked ? rt.anonChecked : rt.anonNotChecked}</div>
                </div>
                <button type="button" onClick={onClose} aria-label="Close" className="w-10 h-10 shrink-0 rounded-full hover:bg-white/15 text-white flex items-center justify-center"><X size={22}/></button>
              </div>
              <div className={zoomW ? 'flex-1 min-h-0 relative overflow-auto px-3 sm:px-16' : 'flex-1 min-h-0 relative flex items-center justify-center px-3 sm:px-16'}>
                <div className="relative inline-block">
                  <img ref={imgRef} src={item.url} alt={item.label} draggable={false} className={zoomW ? 'block max-w-none rounded bg-white' : 'block max-w-[calc(100vw-1.5rem)] sm:max-w-[calc(100vw-9rem)] max-h-[calc(100vh-220px)] rounded bg-white'} style={{ opacity: d.hide ? 0.25 : 1, ...(zoomW ? { width: zoomW + 'px', maxWidth: 'none', maxHeight: 'none' } : {}) }} />
                  <div ref={surface} className={'absolute inset-0 ' + (d.hide ? '' : 'cursor-crosshair')} style={{ touchAction: 'none' }}
                    onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={() => setDraft(null)}>
                    {!d.hide && boxes.map((b, i) => (
                      <div key={i} className="absolute" style={{ ...pct(b), background: ANON_COVER, outline: '2px solid #FBBF24' }}>
                        <button type="button" aria-label={rt.anonRemoveArea} title={rt.anonRemoveArea}
                          onPointerDown={(e) => e.stopPropagation()} onClick={() => set({ boxes: boxes.filter((_, j) => j !== i) })}
                          className="absolute -top-3 -right-3 w-6 h-6 rounded-full bg-white text-slate-800 shadow flex items-center justify-center"><X size={14}/></button>
                      </div>
                    ))}
                    {draft && <div className="absolute border-2 border-amber-300" style={{ ...pct(rect(draft)), background: 'rgba(63, 69, 82, 0.6)' }} />}
                    {d.hide && <div className="absolute inset-0 flex items-center justify-center p-4"><span className="bg-white text-slate-800 font-bold px-4 py-2 rounded-full text-sm text-center">{rt.anonHiddenLabel}</span></div>}
                  </div>
                </div>
                {!zoomW && index > 0 && <button type="button" aria-label="Previous" className={navBtn + ' left-2 sm:left-4'} onClick={() => onIndex(index - 1)}><ChevronLeft size={26}/></button>}
                {!zoomW && index < last && <button type="button" aria-label="Next" className={navBtn + ' right-2 sm:right-4'} onClick={() => onIndex(index + 1)}><ChevronRight size={26}/></button>}
              </div>
              <div className="px-5 pt-3 pb-5 flex flex-wrap items-center justify-center gap-3 text-sm">
                <p className="w-full text-center text-white/70 text-xs">{rt.anonReviewHelp}</p>
                <button type="button" className={ghostBtn} onClick={toggleZoom}>{zoomW ? rt.anonZoomOut : rt.anonZoomIn}</button>
                <button type="button" className={ghostBtn} onClick={() => set({ hide: !d.hide, checked: true })}>{d.hide ? rt.anonShowAgain : rt.anonHideImage}</button>
                {!d.hide && boxes.length > 0 && <button type="button" className={ghostBtn} onClick={() => set({ boxes: [] })}>{rt.anonClearAreas}</button>}
                <button type="button" className="px-5 py-2.5 rounded-xl font-bold text-white shadow transition hover:opacity-90" style={{ background: BRAND.colors.green }} onClick={checkedNext}>
                  <Check size={16} className="inline -mt-0.5 mr-1"/>{index < last ? rt.anonCheckedNext : rt.anonCheckedDone}
                </button>
              </div>
            </div>
          );
        };

        // Full-screen view of one report photo, on screen only (no-print, and
        // outside #print-content, so neither the PDF nor the Word export sees
        // it). Arrow keys or a swipe move through the photos, Esc closes.
        const PhotoLightbox = ({ photos, index, onClose, onIndex }) => {
          const item = photos[index];
          const last = photos.length - 1;
          const step = (d) => onIndex(i => Math.min(last, Math.max(0, i + d)));
          useEffect(() => {
            const onKey = (e) => {
              if (e.key === 'Escape') onClose();
              else if (e.key === 'ArrowRight') step(1);
              else if (e.key === 'ArrowLeft') step(-1);
            };
            window.addEventListener('keydown', onKey);
            const overflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
            return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = overflow; };
          }, [last]);
          const touch = useRef(null);
          if (!item) return null;
          const stop = (e) => e.stopPropagation();
          const navBtn = 'absolute top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center transition';
          return (
            <div className="fixed inset-0 z-[100] flex flex-col no-print select-none" style={{ background: 'rgba(8, 12, 20, 0.95)' }} role="dialog" aria-modal="true" aria-label={item.label + ' ' + item.text}
              onClick={onClose}
              onTouchStart={(e) => { touch.current = e.touches[0].clientX; }}
              onTouchEnd={(e) => { const dx = e.changedTouches[0].clientX - (touch.current ?? e.changedTouches[0].clientX); if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); }}>
              <div className="flex items-center justify-between px-5 py-3 text-white/70 text-sm" onClick={stop}>
                <span className="font-bold">{index + 1} / {photos.length}</span>
                <span className="hidden sm:inline text-xs">Esc to close · ← → to browse</span>
                <button type="button" onClick={onClose} aria-label="Close" className="w-10 h-10 rounded-full hover:bg-white/15 text-white flex items-center justify-center"><X size={22}/></button>
              </div>
              <div className="flex-1 min-h-0 relative flex items-center justify-center px-3 sm:px-20">
                <img src={item.url} alt={item.label + ' ' + item.text} onClick={stop} className="max-w-full max-h-full object-contain rounded-lg shadow-2xl bg-white" />
                {index > 0 && <button type="button" aria-label="Previous photo" className={navBtn + ' left-2 sm:left-5'} onClick={(e) => { stop(e); step(-1); }}><ChevronLeft size={28}/></button>}
                {index < last && <button type="button" aria-label="Next photo" className={navBtn + ' right-2 sm:right-5'} onClick={(e) => { stop(e); step(1); }}><ChevronRight size={28}/></button>}
              </div>
              <div className="px-5 py-4 text-center text-white" onClick={stop}>
                <div className="font-bold text-sm sm:text-base">{item.label} {item.text}</div>
                {item.category && <div className="text-xs text-white/60 mt-0.5">{item.category}</div>}
                {item.caption && <div className="italic text-sm text-white/80 mt-1 max-w-3xl mx-auto">{item.caption}</div>}
              </div>
            </div>
          );
        };

        const PrintPreview = ({ clientInfo, project, groups, analysis, supplyChain, onBack, unitSystem = 'metric', lang = 'en', anonymised = false, anonImages = null }) => {
          // Recognised stage labels are re-translated to the report language at
          // render time, so a chain entered in another language (e.g. Spanish)
          // never leaks untranslated into the report. Free text passes through.
          // The report itself is always English: translating to `lang` (the
          // editor's language) printed "Boerderij / Oogst → Verpakkingshuis" in
          // an English report for a colleague working in Dutch.
          // ...and its temperatures in the chosen unit (the PDF flow and Word).
          const tempUnit = unitOf('temp', false, unitSystem);
          const displayChain = (supplyChain || []).map(s => ({
            ...(globalConfig.retranslateStage ? { ...s, stage: globalConfig.retranslateStage(s.stage, 'en') } : s),
            tempStart: shownValue(s.tempStart, 'temp', false, unitSystem),
            tempEnd: shownValue(s.tempEnd, 'temp', false, unitSystem),
          }));
          const [isPrinting, setIsPrinting] = useState(false);
          const [isWordExporting, setIsWordExporting] = useState(false);
          const [wordProgress, setWordProgress] = useState('');
          // 'loading' | 'ready' | 'failed': the Word library, fetched on open.
          const [wordLib, setWordLib] = useState('loading');
          useEffect(() => {
            let live = true;
            loadDocx().then(() => { if (live) setWordLib('ready'); }, () => { if (live) setWordLib('failed'); });
            return () => { live = false; };
          }, []);
          const [lightbox, setLightbox] = useState(null); // index into photoList, or null
          // ---- Before a file goes to the client ---------------------------------
          // Everything that would put an impossible number or an unfinished text
          // in front of the client. Listed above the report (screen only) and
          // asked about before a PDF or Word file is made. On-screen warnings
          // alone were exported straight past.
          const exportIssues = (() => {
            const list = [];
            const vname = (g) => g.name || 'Variant';
            const isMapGroup = (g) => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP';
            groups.forEach(g => {
              const seen = new Map();
              (g.measurements || []).forEach(m => {
                const d = String(m.day).trim();
                seen.set(d, (seen.get(d) || 0) + 1);
                if (isMapGroup(g)) (m.samples || []).forEach((smp, i) => {
                  if (gasSampleIssue(smp)) list.push(`${vname(g)} · P+${m.day} · sample ${i + 1}: impossible gas reading (O₂ ${smp.o2 === '' || smp.o2 == null ? '–' : smp.o2} %, CO₂ ${smp.co2 === '' || smp.co2 == null ? '–' : smp.co2} %)`);
                });
                (Array.isArray(m.qualityParams) ? m.qualityParams : []).forEach(q => {
                  if (q && scoreIsOutOfRange(q.score)) list.push(`${vname(g)} · P+${m.day}: score "${q.score}" for ${q.name || 'a criterion'} is outside 1-10`);
                });
              });
              seen.forEach((n, d) => { if (n > 1) list.push(`${vname(g)}: day P+${d === '' ? '?' : d} appears ${n} times`); });
              // A weight in kg against a start in g, or a typo: a loss above 30 %
              // or a gain of more than 2 % is almost always an entry error.
              const d0 = (g.measurements || []).find(m => parseFloat(m.day) === 0);
              (g.measurements || []).forEach(m => {
                if (!(parseFloat(m.day) > 0)) return;
                const l = getWeightLoss(m.samples, d0 && d0.samples);
                if (l !== null && (parseFloat(l) > 30 || parseFloat(l) < -2)) list.push(`${vname(g)} · P+${m.day}: weight loss of ${l} % looks wrong (check the weights)`);
              });
            });
            if (!String(project.productName || '').trim()) list.push('The product name is empty (cover page).');
            if (!cleanRich(analysis.conclusion)) list.push('The main conclusion is empty (section 2).');
            if (!(project.packagings?.[0]?.startWeight || project.startWeight)) list.push('The net weight is missing (section 3).');
            const isNumV = (v) => v !== '' && v !== null && v !== undefined && !isNaN(parseFloat(v));
            if ((project.technologies || []).some(t => /FRM|Respiration/i.test(t || '')) && !isNumV(project.rrO2) && !isNumV(project.rrCO2))
              list.push('FRM is selected, but the respiration data is missing (section 3).');
            // "Achieved" while no variant stayed within specification until its
            // last evaluation is worth a second look before the client reads it.
            if (analysis.targetAchieved === 'achieved') {
              const anyKept = groups.some(g => {
                const byDay = new Map((g.measurements || []).filter(m => !isNaN(parseFloat(m.day))).map(m => [parseFloat(m.day), measQuality(m)]).filter(([, q]) => q));
                return byDay.size > 1 && shelfLifeOf(byDay).open;
              });
              if (!anyKept && groups.some(g => (g.measurements || []).some(m => measQuality(m))))
                list.push('The target is marked "Achieved", but no variant stayed within specification (7 or higher) until its last evaluation.');
            }
            if (anonymised && anonImages && anonImages.unchecked) list.push(`${anonImages.unchecked} of ${anonImages.total} images have not been checked for client details (stickers, labels, logos).`);
            return list;
          })();
          const confirmExport = () => !exportIssues.length || window.confirm(
            'Before this file goes to the client, check:\n\n• ' + exportIssues.slice(0, 12).join('\n• ')
            + (exportIssues.length > 12 ? `\n… and ${exportIssues.length - 12} more` : '') + '\n\nMake the file anyway?');
          // Ctrl+P skips the buttons: an anonymised report with unchecked images
          // prints a notice instead of the report (style.css, .print-blocked),
          // unless the PDF button just asked and was told to go ahead.
          const printBlocked = !!(anonymised && anonImages && anonImages.unchecked);
          // Only use temperatures from the 'pack' stage up to (not including) the 'unpack' stage.
          // Pre-packaging steps like harvest and transport are excluded so the report shows
          // the temperature the product was actually packed and stored at.
          const _packIdx   = (supplyChain || []).findIndex(s => s.action === 'pack');
          const _unpackIdx = (supplyChain || []).findIndex((s, i) => i > _packIdx && s.action === 'unpack');
          const _packedStages = _packIdx >= 0
            ? (_unpackIdx > _packIdx
                ? (supplyChain || []).slice(_packIdx, _unpackIdx)
                : (supplyChain || []).slice(_packIdx))
            : (supplyChain || []); // fallback: all stages when no explicit 'pack' action is set
          let allTemps = [];
          _packedStages.forEach(s => {
              const ts = parseFloat(s.tempStart); if(!isNaN(ts)) allTemps.push(ts);
              const te = parseFloat(s.tempEnd);   if(!isNaN(te)) allTemps.push(te);
          });
          const minTemp = allTemps.length > 0 ? Math.min(...allTemps) : null;
          const maxTemp = allTemps.length > 0 ? Math.max(...allTemps) : null;
          const tShown = (t) => shownValue(t, 'temp', false, unitSystem);
          const tempString = allTemps.length > 0 ? (minTemp === maxTemp ? `${tShown(minTemp)}${tempUnit}` : `${tShown(minTemp)}${tempUnit} - ${tShown(maxTemp)}${tempUnit}`) : '-' + tempUnit;
          // Without Total days: the packed stages only, as for the temperature
          // (the sum of every stage counted harvest and transport before packing).
          const totalDays = project.totalDuration || round1(_packedStages.reduce((acc,s) => acc + parseFloat(s.daysStart || 0), 0));

          // Unit-aware weight label: bulk packaging (Pallet / Cube crate) uses kg or lb; retail uses g or oz.
          const projIsBulk = (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail') === 'Cube crate' || (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail') === 'Pallet';
          const isImperial = unitSystem === 'imperial';
          const weightUnit = isImperial ? (projIsBulk ? 'lb' : 'oz') : (projIsBulk ? 'kg' : 'g');

          const allPhotos = groups.flatMap(g => (g.measurements || []).flatMap(m => (m.images || []).map(img => ({ groupName: g.name, day: m.day, url: typeof img === 'string' ? img : img.url, caption: typeof img === 'string' ? '' : img.caption, category: (typeof img === 'object' && img.category) ? img.category : 'Other' }))));
          const photosByCat = {};
          allPhotos.forEach(p => { if (!photosByCat[p.category]) photosByCat[p.category] = []; photosByCat[p.category].push(p); });
          const catsPresent = ['External Quality', 'Internal Quality', 'Loose Produce', 'Box/Crate', 'Weight measurement', 'Gas measurement', 'Other'].filter(c => photosByCat[c] && photosByCat[c].length > 0);

          // Section 5 in reading order, each photo with its place `n` in
          // photoList: the grid and the on-screen lightbox read the same list,
          // so the arrows in the lightbox step through the photos as printed.
          const photoList = [];
          if (project.startImage) photoList.push({ n: 0, url: project.startImage, label: 'Picture 1.', text: 'P+0 - Initial product quality', caption: '', category: '' });
          const photoSections = catsPresent.map(category => {
            const catPhotos = photosByCat[category];
            const groupsInCat = Array.from(new Set(catPhotos.map(p => p.groupName)));
            return {
              category,
              variants: groupsInCat.map(gName => ({
                gName,
                photos: catPhotos.filter(p => p.groupName === gName).sort((a, b) => parseFloat(a.day) - parseFloat(b.day)).map((photo, idx) => {
                  // Numbered through the chapter ("Picture 2." appeared once per variant).
                  const item = { ...photo, n: photoList.length, label: `Picture ${photoList.length + 1}.`, text: `${gName} at Day ${photo.day}.` };
                  photoList.push(item);
                  return item;
                }),
              })),
            };
          });
          // Click (or Enter on) a photo in chapter 5 to open it large. Screen
          // only: a PDF or Word file cannot pop a picture up, and the photos
          // themselves print exactly as before.
          const zoomProps = (item) => ({
            role: 'button', tabIndex: 0, title: 'Click to enlarge',
            onClick: () => setLightbox(item.n),
            onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setLightbox(item.n); } },
          });

          // Auto-detect which optional sections have data to render.
          const mapGroupsList = groups.filter(g => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP');
          const autoShowGas = mapGroupsList.some(g =>
            (g.measurements || []).some(m =>
              parseFloat(m.day) > 0 &&
              (m.samples || []).some(s => s.o2 !== '' && s.o2 !== undefined && s.o2 !== null)
            )
          );
          const autoShowHub = mapGroupsList.some(g => !!g.predictedImage);
          const autoShowWeight = groups.some(g => {
            const daysWithWeight = (g.measurements || []).filter(m =>
              (m.samples || []).some(s => s.weight !== '' && s.weight !== undefined && s.weight !== null && parseFloat(s.weight) > 0)
            );
            return daysWithWeight.length >= 2;
          });

          // Effective values — null/undefined = "auto", true/false = manual override.
          // Use ?? (nullish coalescing) so that both null AND undefined (old JSON files) fall through to auto.
          // Ticked by hand, but no MAP variant left: the body renders no gas
          // section, so neither may the contents and the numbering.
          const showGas = (analysis.showGasSection ?? autoShowGas) && mapGroupsList.length > 0;
          const showAnyHubPrediction = analysis.showHubPredictions ?? autoShowHub;
          const showWeight = analysis.showWeightLoss ?? autoShowWeight;

          // Dynamic section numbering for 4.x — depends on which optional sections are visible.
          const sec4Nums = (() => {
            let n = 0;
            return {
              gas:      showGas                   ? ++n : null,
              temp:     getTempImages(analysis).length > 0 ? ++n : null,
              weight:   showWeight                ? ++n : null,
              quality:  ++n,
              score:    ++n,
            };
          })();
          // More scored variants than one chart holds: the per-variant table
          // replaces the line chart and the scores per criterion go to an annex.
          const manyQualityVariants = groups.filter(g => (g.measurements || []).some(m => measQuality(m))).length > VARIANTS_PER_BLOCK;
          // The scores per criterion, in section 4 or as the annex: shown unless
          // unchecked under Section Visibility (null = auto = shown).
          const showCriteria = analysis.showCriteriaScores ?? true;
          const showCriteriaAnnex = manyQualityVariants && showCriteria;

          const reportTitleClass = "text-3xl font-extrabold uppercase mb-6 brand-heading";
          const reportTitleStyle = { color: BRAND.colors.green, borderBottom: `3px solid ${BRAND.colors.gray}`, paddingBottom: '0.75rem', marginTop: '2rem' };

          // Builds a genuine .docx (via the `docx` library) from the rendered
          // report DOM: fully editable text, native Word tables and headings.
          // Only photos and charts are embedded as pictures. Page breaks occur
          // exactly at the report's .page-break sections; everything else
          // flows naturally, so pagination tracks the PDF.
          const handleWordExport = async () => {
              const root = document.getElementById('print-content');
              if (!root || isWordExporting) return;
              if (!confirmExport()) return;
              setIsWordExporting(true);
              setWordProgress('Loading Word engine...');
              try {
                  await document.fonts.ready;
                  // jsDelivr serves the package's own prebuilt browser bundle;
                  // esm.sh's re-bundle of docx has a broken Packer that hangs.
                  const docx = await loadDocx();
                  setWordLib('ready');
                  setWordProgress('Converting report...');
                  const children = await domToDocx(root, docx, { onProgress: setWordProgress, supplyChain: displayChain, tempUnit, scores: SCORES });
                  setWordProgress('Assembling document...');
                  const doc = new docx.Document({
                      styles: {
                          default: {
                              document: { run: { font: 'Montserrat' } },
                              // Brand heading styles: without these Word's own
                              // Heading 1/2 (blue Calibri Light) would restyle
                              // the section titles used for the TOC outline.
                              heading1: { run: { font: 'Montserrat', color: '1A1B1F', bold: true } },
                              heading2: { run: { font: 'Montserrat', color: '333333', bold: true } },
                          },
                      },
                      sections: [{
                          properties: {
                              page: {
                                  size: { width: 11906, height: 16838 },     // A4 portrait (twips)
                                  margin: { top: 680, right: 680, bottom: 680, left: 680 }, // 12mm
                              },
                          },
                          footers: {
                              default: new docx.Footer({
                                  children: [new docx.Paragraph({
                                      alignment: docx.AlignmentType.CENTER,
                                      children: [new docx.TextRun({ children: [docx.PageNumber.CURRENT], size: 16, color: '8A97AD', font: 'Montserrat' })],
                                  })],
                              }),
                          },
                          children,
                      }],
                  });
                  const blob = await docx.Packer.toBlob(doc);
                  const a = document.createElement('a');
                  document.body.appendChild(a);
                  const url = URL.createObjectURL(blob);
                  a.href = url;
                  a.download = (project.reportTitle || 'Report') + (anonymised ? ' - anonymised' : '') + '.docx';
                  a.click();
                  document.body.removeChild(a);
                  // A .docx with every chart and photo embedded is the biggest
                  // blob this app makes, and an un-revoked object URL keeps it in
                  // memory for the rest of the session. The two other object URLs
                  // in this file already revoke — this one was the exception.
                  URL.revokeObjectURL(url);
                  // An image that could not be read used to be left out silently.
                  if (children.failedImages) alert(`${children.failedImages} image(s) could not be read and are missing from the Word file. The PDF may still show them; check the photos in the editor.`);
              } catch (e) {
                  alert('Word export failed: ' + ((e && e.message) ? e.message : e));
              } finally {
                  setIsWordExporting(false);
                  setWordProgress('');
              }
          };

          return (
            <div className={'min-h-screen bg-slate-600 p-0 sm:p-8 overflow-y-auto font-sans print:p-0 print:bg-white no-print-bg' + (printBlocked ? ' print-blocked' : '')}>
              {printBlocked && <div className="print-blocked-note p-12 text-xl font-bold text-slate-800">This anonymised report has images that were not checked for client details. Print it with the Download PDF button in the preview.</div>}
              {anonymised && (
                <div className="fixed top-6 right-8 no-print z-50 bg-amber-100 text-amber-900 border border-amber-300 px-4 py-2 rounded-full shadow font-bold text-sm">Anonymised version: client details removed</div>
              )}
              <div className="fixed bottom-8 right-8 flex gap-4 no-print z-50">
                <button onClick={onBack} className="bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-bold transition hover:bg-slate-900 flex items-center gap-2"><Edit3 size={18}/> Edit</button>
                <button onClick={handleWordExport} disabled={isWordExporting} className="bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg font-bold flex items-center gap-2 hover:bg-blue-700 transition disabled:opacity-70 disabled:cursor-wait">
                  {isWordExporting

                  {showGas && (() => {

        const MeasurementSheet = ({ clientInfo, project, groups, onBack, unitSystem = 'metric', lang = 'en', rt = {} }) => {
          const [isPrinting, setIsPrinting] = useState(false);
          const [showValues, setShowValues] = useState(false);

          const isMAPGroup = (g) => !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP';

          const totalDuration = parseFloat(project.totalDuration);
          const retailDays = parseFloat(project.retailOpenDays) || 0;
          const openDay = isNaN(totalDuration) ? NaN : totalDuration + retailDays;
          // After the pack is opened the atmosphere is ambient — no gas to measure.
          const isOpenedDay = (day) => !isNaN(totalDuration) && parseFloat(day) > totalDuration;

          const projIsBulk = ['Cube crate', 'Pallet'].includes(project.packagings?.[0]?.packagingType || project.packagingType || 'Retail');
          const weightUnit = globalConfig.getUnitLabel
            ? globalConfig.getUnitLabel('weight', unitSystem, projIsBulk)
            : (projIsBulk ? 'kg' : 'g');

          // Day list in entry order, de-duplicated across variants. Days that only
          // exist on a later variant are appended where they are first met.
          const dayList = [];
          (groups || []).forEach(g => (g.measurements || []).forEach(m => {
            const d = parseFloat(m.day);
            if (!isNaN(d) && !dayList.includes(d)) dayList.push(d);
          }));

          const baseDate = project.packingDate || project.date;
          const dateFor = (d) => {
            if (!baseDate) return '';
            const dt = isoDayPlus(baseDate, d);

          };
          const dayBadge = (d) => {
            if (d === 0) return rt.sheetDayPacking || 'Packing';
            if (retailDays > 0 && d === openDay) return rt.sheetDayRetail || 'Retail simulation (opened)';
            if (!isNaN(totalDuration) && d === totalDuration) return rt.sheetDayEnd || 'End of packed period';
            return '';
          };

          // Criteria come from the measurement itself when present (they may have
          // been edited per day); otherwise from the global assessment criteria.
          const criteriaFor = (m) => {
            const params = (Array.isArray(m.qualityParams) ? m.qualityParams : []).filter(p => p && p.name);
            const source = params.length ? params : (project.criteria || []).map(c => ({ name: c, score: '', notes: '' }));

              label: getI18nLabel(DEFAULT_CRITERIA_I18N, p.name, lang) || p.name,

              notes: p.notes

            ? m.samples
            : Array.from({ length: g.specs?.sampleCount || 3 }, () => ({}));

          const val = (v) => (v === 0 || v === '0') ? '0' : (v || '');
          const anyQuality = (groups || []).some(g => (g.measurements || []).some(m => m.evaluateQuality));
          const colCount = 3 + (anyMAP ? 2 : 0);

          const blankCell = 'border border-slate-300 px-2 py-1.5 text-center text-slate-900 font-bold';
          const naCell = 'border border-slate-300 px-2 py-1.5 text-center text-slate-300 bg-slate-50';
          const headCell = 'border border-slate-300 px-2 py-2 text-center font-extrabold uppercase tracking-wider text-[10px]';

            if (globalConfig.printWithFilename) globalConfig.printWithFilename(suggested);
            else window.print();
            setIsPrinting(false);
          };

          const MetaCell = ({ label, value }) => (
            <div className="border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
              <div className="text-[8px] font-extrabold uppercase tracking-widest text-slate-500">{label}</div>
              <div className="text-xs font-bold text-slate-800 truncate">{value || '—'}</div>

            <div className="min-h-screen bg-slate-600 p-0 sm:p-8 overflow-y-auto font-sans print:p-0 print:bg-white no-print-bg">
              <style>{`

                     variant block (samples + its quality strip) stays together

                  <MetaCell label={rt.packingDate || 'Packing date'} value={formatDateToDDMMYYYY(project.packingDate || project.date)} />

                  <MetaCell label={rt.totalDays || 'Days packed'} value={project.totalDuration} />
                  <MetaCell label={rt.retailSim || 'Retail simulation'} value={retailDays > 0 ? `+${retailDays}` : '—'} />
                  <MetaCell label={rt.testLocation || 'Location'} value={project.testLocation} />
                  <MetaCell label={rt.sheetTotalRows || 'Measurements'} value={String(
                    dayList.reduce((acc, d) => acc + (groups || []).reduce((a, g) => {
                      const m = (g.measurements || []).find(mm => parseFloat(mm.day) === d);
                      return a + (m ? samplesOf(g, m).length : 0);
                    }, 0), 0)
                  )} />
                </div>

                      <tr className="bg-slate-100">

                        <th className={`${headCell} text-left`}>{rt.packagingType || 'Packaging'}</th>
                        <th className={headCell}>{rt.atmosphereStrategy || 'Strategy'}</th>
                        <th className={`${headCell} text-left`}>{rt.transmissionValue || 'Transmission'}</th>
                        <th className={headCell}>{rt.samplesPerMeasurement || 'Samples'}</th>

                    </thead>
                    <tbody>

                            </span>

                          <td className={cellClass}>{getI18nLabel(PACKAGING_TYPES_I18N, g.specs?.packaging, lang) || g.specs?.packaging || '—'}</td>

                          <td className={cellClass}>{g.specs?.holes || '—'}</td>
                          <td className={`${cellClass} text-center font-bold`}>{samplesOf(g, (g.measurements || [])[0] || {}).length}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                        <th className={headCell} style={{ width: '8%' }}>{rt.sheetColId || 'ID'}</th>
                        {anyMAP && <th className={headCell} style={{ width: '15%' }}>O₂ (%)</th>}
                        {anyMAP && <th className={headCell} style={{ width: '15%' }}>CO₂ (%)</th>}
                        <th className={headCell}>{rt.sheetColWeight || 'Weight'} <span className="normal-case">({weightUnit})</span></th>
                      </tr>
                    </thead>

                    {dayList.map(d => {
                      const rowsForDay = (groups || [])

                      const badge = dayBadge(d);
                      const dateStr = dateFor(d);

                      return rowsForDay.map(({ g, gIdx, m }, blockIdx) => {
                        const gasCells = anyMAP && isMAPGroup(g) && !opened;
                        const samples = samplesOf(g, m);
                        const crit = m.evaluateQuality ? criteriaFor(m) : [];

                        return (
                          <tbody key={`${d}-${g.id}`}>
                            {/* Day band — stays glued to the first variant of that day */}
                            {blockIdx === 0 && (
                              <tr>

                                      <span className="text-[9px] font-bold text-slate-400 uppercase">{g.specs?.atmosphereStrategy || 'MAP'}</span>
                                    </span>
                                  </td>

                                    <span className="text-[9px] font-extrabold uppercase tracking-widest" style={{ color: BRAND.colors.green }}>
                                      {rt.sheetQuality || 'Quality evaluation'}
