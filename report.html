          // the multi-contact UI renders consistently after legacy imports.
          const reportSeedContacts = (data) => {
            if (!data || !Array.isArray(data.contacts) || data.contacts.length === 0) {
              return {
                ...data,
                contacts: [{ id: Date.now(), name: '', role: '', email: '', phoneDirect: '', phoneWork: '' }]
              };
            }
            return data;
          };

          // Apply a single intake product (from a migrated intake payload) to
          // report state. Extracted so the import flow can call it both
          // directly (1 product) and after the user picks one in the modal
          // (>1 products).
          const loadIntakeProduct = (d, prod) => {
            const client = d.client || {};
            const p = prod || {};
            const contactData = reportSeedContacts(reportExtractPrimaryContact(client));

            setClientInfo({
              companyName: client.companyName || '',
              street: client.street || '',
              houseNumber: client.houseNumber || '',
              addressExtra: client.addressExtra || '',
              zipCode: client.zipCode || '',
              city: client.city || '',
              country: client.country || '',
              website: client.website || '',
              ...contactData,
              logo: client.logo || null
            });
            setProject(prev => ({ ...prev,
              productName: p.name || '',
              processingType: p.processingType || 'Whole',
              type: p.type || '',
              origin: p.origin || '',
              maturityStage: p.maturityStage || '',
              postHarvestTreatment: p.postHarvestTreatment || '',
              currentChallenge: p.currentChallenge || '',
              trialTarget: p.trialTarget || p.targetGoal || '',
              transportMode: p.transportMode || (p.transportModes?.[0] || ''),
              criteria: p.qualityCriteria || [],
              startImage: p.photo || null,
              startWeight: p.weight || prev.startWeight,
              technologies: p.technologies || prev.technologies || [],
              packagingType: p.packagingType || prev.packagingType || 'Retail',
              material: p.material || prev.material || '',
              length: p.length || prev.length || '',
              width: p.width || prev.width || '',
              height: p.height || prev.height || ''
            }));
            if (p.supplyChain) setSupplyChain(p.supplyChain);
            setGroups(prev => {
              const ug = [...prev];
              if (ug[0]) {
                ug[0].specs = {
                  ...ug[0].specs,
                  packaging: p.packagingType || 'Retail',
                  material: p.material || '',
                  length: p.length || '',
                  width: p.width || '',
                  height: p.height || '',
                  startWeight: p.weight || ''
                };
              }
              return ug;
            });
          };

          // Confirm handler for the multi-product picker modal.
          const confirmProductSelection = (productIdx) => {
            if (!pendingProductSelection) return;
            const { raw, products } = pendingProductSelection;
            const chosen = products[productIdx] || products[0] || {};
            loadIntakeProduct(raw, chosen);
            setPendingProductSelection(null);
          };

          // Apply a parsed report/intake/proposal payload to component state.
          // Lifted to component scope (was nested in importData as processData)
          // so both the file <input> importer and the Project Board deep-link
          // loader (?boardProject=) can reuse the exact same logic.
          const applyReportData = (raw) => {
            // A newly loaded document must be re-checked against the product
            // database, even when it carries the same product id as the last one.
            setDocLoadSeq(n => n + 1);
                // Local aliases for the helpers declared at component scope above.
                const extractPrimaryContact = reportExtractPrimaryContact;
                const seedContacts = reportSeedContacts;
                // Normalise legacy shapes (flat contacts, targetGoal alias, missing
                // schemaVersion) before we read from the payload.
                const d = globalConfig.migrateSchema ? globalConfig.migrateSchema(raw) : raw;
                // Apply language from source if present
                if (d.language && ['en','nl','es'].includes(d.language)) {
                   setLang(d.language);
                   if (globalConfig.setLanguage) globalConfig.setLanguage(d.language);
                }
                // Apply unit system from source if present
                if (d.unitSystem) setUnitSystem(d.unitSystem);
                
                if(d.isPerfoTecIntake) {
                   // === INTAKE IMPORT ===
                   // Report works with one product per session. If the intake
                   // JSON carries multiple products, defer the import and let
                   // the user pick which one to load via the modal below.
                   const products = Array.isArray(d.products) ? d.products : [];
                   if (products.length > 1) {
                     setPendingProductSelection({ raw: d, products });
                   } else {
                     loadIntakeProduct(d, products[0] || {});
                   }
                } else {
                   // === PROPOSAL/REPORT IMPORT ===
                   if(d.clientInfo) {
                       const ci = d.clientInfo;
                       const contactData = seedContacts(extractPrimaryContact(ci));
                       setClientInfo({
                         companyName: ci.companyName || '',
                         street: ci.street || '',
                         houseNumber: ci.houseNumber || '',
                         addressExtra: ci.addressExtra || '',
                         zipCode: ci.zipCode || '',
                         city: ci.city || '',
                         country: ci.country || '',
                         website: ci.website || '',
                         ...contactData,
                         logo: ci.logo || null
                       });
                   } else if (d.client) {
                       const contactData = seedContacts(extractPrimaryContact(d.client));
                       setClientInfo({
                         companyName: d.client.companyName || '',
                         street: d.client.street || '',
                         houseNumber: d.client.houseNumber || '',
                         addressExtra: d.client.addressExtra || '',
                         zipCode: d.client.zipCode || '',
                         city: d.client.city || '',
                         country: d.client.country || '',
                         website: d.client.website || '',
                         ...contactData,
                         logo: d.client.logo || null
                       });
                   } else if (d.project) {
                       // Legacy: client info flattened into project. Hoist any
                       // legacy single-contact fields into the canonical
                       // contacts[] seed so the multi-contact UI renders.
                       const legacyContact = {
                         id: Date.now(),
                         name: d.project.contactName || '',
                         role: d.project.contactRole || d.project.role || '',
                         email: d.project.contactEmail || d.project.email || '',
                         phoneDirect: d.project.phoneDirect || '',
                         phoneWork: d.project.phoneWork || d.project.contactPhone || d.project.phone || ''
                       };
                       setClientInfo({
                         companyName: d.project.company || '',
                         street: d.project.street || '',
                         houseNumber: d.project.houseNumber || '',
                         addressExtra: d.project.addressExtra || '',
                         zipCode: d.project.zipCode || '',
                         city: d.project.city || '',
                         country: d.project.country || '',
                         website: d.project.website || '',
                         contactName: d.project.contactName || '',
                         role: d.project.contactRole || d.project.role || '',
                         email: d.project.contactEmail || d.project.email || '',
                         phone: d.project.contactPhone || d.project.phone || '',
                         phoneDirect: d.project.phoneDirect || '',
                         phoneWork: d.project.phoneWork || '',
                         contacts: [legacyContact],
                         logo: d.project.clientLogo || null  // legacy fallback
                       });
                   }

                   const migrateProjectPackagings = (proj) => {
                     if (!proj) return proj;
                     if (!proj.packagings) {
                       return { ...proj, packagings: proj.packagingType
                         ? [{ id: 1, packagingType: proj.packagingType || 'Retail', material: proj.material || '', length: proj.length || '', width: proj.width || '', height: proj.height || '', startWeight: proj.startWeight || '' }]
                         : [{ id: 1, packagingType: 'Retail', material: '', length: '', width: '', height: '', startWeight: '' }] };
                     }
                     return proj;
                   };
                   if(d.project) setProject(p => ({
                     ...p,
                     ...migrateProjectPackagings(d.project),
                     packingDate: d.project.packingDate || d.project.date || new Date().toISOString().split('T')[0],
                     transportMode: d.project.transportMode || '',
                     technologies: d.project.technologies || [],
                     logo: d.project.logo || BRAND.logos.default
                   })); 
                   if(d.supplyChain) setSupplyChain(d.supplyChain); 
                   if(d.groups) setGroups(d.groups.map(g => ({
                     ...g,
                     measurements: (g.measurements || []).map(m => ({
                       ...m,
                       // When an `evaluate` array is present (proposal origin), derive
                       // evaluateQuality from it so the Enable Evaluation checkbox matches
                       // what was ticked in the Variants & Planning timeline.
                       // Falls back to the explicit boolean for pure report JSONs.
                       evaluateQuality: Array.isArray(m.evaluate)
                         ? m.evaluate.length > 0
                         : (m.evaluateQuality !== undefined ? m.evaluateQuality : false)
                     }))
                   })));
                   if(d.analysis) setAnalysis({ graphNotes: d.analysis.graphNotes||'', conclusion: d.analysis.conclusion||'', variantConclusions: d.analysis.variantConclusions||{}, recommendation: d.analysis.recommendation||'retest', nextSteps: d.analysis.nextSteps||[], temperatureImages: getTempImages(d.analysis), temperatureLabel: d.analysis.temperatureLabel||'', showGasSection: d.analysis.showGasSection ?? null, showHubPredictions: d.analysis.showHubPredictions ?? null, showWeightLoss: d.analysis.showWeightLoss ?? null, generalObservations: d.analysis.generalObservations||'', targetAchieved: d.analysis.targetAchieved||null, targetEvaluation: d.analysis.targetEvaluation||'' });
                }
          };

          const importData = (e) => {
            const file = e.target.files[0]; if(!file) return;
            if (globalConfig.importJSON) {
                globalConfig.importJSON(file, applyReportData, () => alert("Error loading JSON file."));
            } else {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try { applyReportData(JSON.parse(ev.target.result)); } catch(err){ alert("Error loading file."); }
                };
                reader.readAsText(file);
            }
            e.target.value = '';
          };

          // === PROJECT BOARD INTEGRATION ===
          // When opened as ...report.html?boardProject=<id>, load that project's
          // report.json from the bound local folder and autosave edits back to it.
          const boardProjectId = new URLSearchParams(window.location.search).get('boardProject');
          const [boardState, setBoardState] = useState(boardProjectId ? 'loading' : 'off'); // off|loading|needs-permission|linked|error
          const [boardTitle, setBoardTitle] = useState('');
          const [boardPeople, setBoardPeople] = useState([]); // product managers from the board registry [{name,email,phone}]
          const boardLoadedRef = useRef(false);
          const boardSaveTimer = useRef(null);

          const normBoardPeople = (arr) => (arr || []).map(x => typeof x === 'string' ? { name: x, email: '', phone: '' } : { name: (x && x.name) || '', email: (x && x.email) || '', phone: (x && x.phone) || '' }).filter(x => x.name);

          const loadBoardProject = async () => {
            const B = window.PerfoTecBoard;
            const manifest = await B.readManifest();
            const proj = (manifest.projects || []).find(p => p.id === boardProjectId);
            if (proj) setBoardTitle(proj.title || '');
            const pmList = normBoardPeople(manifest.people && manifest.people.productManagers);
            setBoardPeople(pmList);
            // Prefer this phase's file, but fall back to the latest available phase
            // file so a moved/forwarded project always opens with its content.
            const data = await B.readProjectData(boardProjectId, 'report');
            // Refuse to arm the autosave for a payload we do not recognise: writing
            // back would replace real data with a blank export. Known shapes only.
            if (data && !(data.isPerfoTecIntake || data.isPerfoTecProposal || data.isPerfoTecReport)) {
              setBoardState('unreadable');
              return;
            }
            if (data) applyReportData(data);
            // Couple board metadata into the tool: packing date ← board packing date,
            // PerfoTec employee ← product manager (+ their email/phone), when empty.
            if (proj) {
              const pmPerson = proj.productManager ? pmList.find(x => x.name === proj.productManager) : null;
              setProject(pr => ({
                ...pr,
                packingDate: pr.packingDate || proj.startDate || pr.packingDate,
                employee: pr.employee || proj.productManager || '',
                employeeEmail: pr.employeeEmail || (pmPerson && pmPerson.email) || '',
                employeePhone: pr.employeePhone || (pmPerson && pmPerson.phone) || ''
              }));
            }
            boardLoadedRef.current = true;
            setBoardState('linked');
          };

          useEffect(() => {
            if (!boardProjectId || !window.PerfoTecBoard) { if (boardProjectId) setBoardState('error'); return; }
            let cancelled = false;
            (async () => {
              try {
                const state = await window.PerfoTecBoard.permissionState();
                if (state !== 'granted') { if (!cancelled) setBoardState('needs-permission'); return; }
                if (!cancelled) await loadBoardProject();
              } catch (err) {
                if (cancelled) return;
                setBoardState(err && err.code === 'NEEDS_PERMISSION' ? 'needs-permission' : 'error');
              }
            })();
            return () => { cancelled = true; };
          }, [boardProjectId]);

          const grantBoardAccess = async () => {
            try {
              const ok = await window.PerfoTecBoard.requestAccess();
              if (ok) { setBoardState('loading'); await loadBoardProject(); }
            } catch (err) { setBoardState('error'); }
          };

          // Deep-link: ...report.html?boardProject=<id>&measureDay=<day> opens the
          // Measurements tab and scrolls to (and flashes) that day's row.
          const measureDayParam = new URLSearchParams(window.location.search).get('measureDay');
          const measureDayHandled = useRef(false);
          useEffect(() => {
            if (measureDayParam == null || measureDayParam === '') return;
            // If board-linked, wait until the project data has loaded.
            if (boardProjectId && boardState !== 'linked') return;
            if (measureDayHandled.current) return;
            const target = parseFloat(measureDayParam);
            // 'groups' is the tab that holds the measurements table ("Variant
            // Results"). It used to say 'measurements', which matches no tab key at
            // all — the whole tab body then rendered empty on every ?measureDay link.
            setActiveTab('groups');

            // The measurements table renders ONLY the active variant, so the row
            // anchor for this day exists only when a group containing that day is
            // selected. Without this the deep link silently did nothing whenever
            // the day was absent from the default group (a Control variant often
            // has far fewer evaluation days than the treated ones). Prefer a group
            // that actually has data for the day, then any group that has the day.
            if (!isNaN(target) && Array.isArray(groups) && groups.length > 0) {
              const rowFor = (g) => (g.measurements || []).find(m => parseFloat(m.day) === target);
              const hasDay = (g) => !!rowFor(g);
              const hasData = (g) => {
                const m = rowFor(g);
                if (!m) return false;
                if (Array.isArray(m.images) && m.images.length) return true;
                if ((m.notes || '').trim()) return true;
                if (Array.isArray(m.qualityParams) && m.qualityParams.length) return true;
                return (m.samples || []).some(s => ['weight', 'o2', 'co2'].some(k => {
                  const v = String(s[k] == null ? '' : s[k]).trim();
                  return v && parseFloat(v) !== 0;
                }));
              };
              const current = groups.find(g => g.id === activeGroupId);
              if (current && hasDay(current)) {
                measureDayHandled.current = true;   // already looking at the right variant
              } else {
                const pick = groups.find(hasData) || groups.find(hasDay);
                if (pick) { setActiveGroupId(pick.id); measureDayHandled.current = true; }
                // No group has this day yet — leave it unhandled so a later data
                // load (import, or a slower board fetch) can still target it.
              }
            }

            // Poll instead of guessing a delay: the row may not be mounted yet on a
            // slow load, or right after the group switch above.
            let tries = 0;
            const iv = setInterval(() => {
              const el = document.getElementById('meas-day-' + measureDayParam);
              if (el) {
                clearInterval(iv);
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.transition = 'background-color 0.3s';
                el.style.backgroundColor = '#dcfce7';
                setTimeout(() => { el.style.backgroundColor = ''; }, 2600);
              } else if (++tries > 40) {
                clearInterval(iv); // ~4s — give up quietly rather than spin forever
              }
            }, 100);
            return () => clearInterval(iv);
          }, [boardState, measureDayParam, groups, activeGroupId]);

          // Holds the currently-pending autosave so the shared "Board" button can
          // flush it before navigating away (see PerfoTecBoard.registerFlush).
          const pendingBoardSave = useRef(null);

          // Debounced write-back to the project folder (mirrors the dashboard's autosave).
          useEffect(() => {
            if (boardState !== 'linked' || !boardLoadedRef.current) return;
            if (boardSaveTimer.current) clearTimeout(boardSaveTimer.current);
            const doBoardSave = async () => {
              pendingBoardSave.current = null;
              try {
                const B = window.PerfoTecBoard;
                await B.writePhaseFile(boardProjectId, 'report', buildExportData());
                const manifest = await B.readManifest();
                const idx = (manifest.projects || []).findIndex(p => p.id === boardProjectId);
                if (idx >= 0) {
                  const p = manifest.projects[idx];
                  const patch = { files: { ...(p.files || {}), report: true }, updatedAt: new Date().toISOString() };
                  if (!p.client && clientInfo.companyName) patch.client = clientInfo.companyName;
                  if (!p.product && project.productName) patch.product = project.productName;
                  // The product LINK is board-owned and always mirrored, unlike the
                  // product NAME, which Pipedrive owns on CRM projects and is
                  // therefore only filled when the board has nothing yet.
                  if (project.productId && p.productId !== project.productId) patch.productId = project.productId;
                  // Mirror coupled fields tool → board: packing date and PerfoTec
                  // employee (= product manager on the board).
                  if (project.packingDate) patch.startDate = project.packingDate;
                  // Fill-if-empty, like client and product above. The board owns this
                  // field: it has the people registry, the picker and rename. This
                  // tool only PREFILLS its employee box from the card, so writing it
                  // back unconditionally meant every autosave re-asserted a value the
                  // user may have just changed on the board — two writers on one
                  // field, which is exactly what surfaces as "someone else was
                  // faster" (with your own name on it, because you are both writers).
                  if (!p.productManager && project.employee) patch.productManager = project.employee;
                  if (!p.image && (project.coverImage || project.startImage)) {
                    const scaled = await B.scaleImage(project.coverImage || project.startImage, 480);
                    if (scaled) patch.image = scaled;
                  }
                  // Generate one action per planned measurement day (P+day), dated
                  // from the packing date. A day counts as DONE when its measurement
                  // actually has data entered (a photo, notes, quality params, or a
                  // sample weight/gas value) — a blank row (all zeros) stays open.
                  // Manual done-overrides (doneManual) and manual actions are kept.
                  const measHasData = (m) => {
                    if (!m) return false;
                    if (Array.isArray(m.images) && m.images.length) return true;
                    if ((m.notes || '').trim()) return true;
                    // A row's qualityParams are the criteria to ASSESS, written out
                    // when the trial is planned — identical on a measured and an
                    // unmeasured day, every score an empty string. Counting their
                    // mere presence as data marked every planned day done, so a
                    // trial with only P+0 filled in read as "all measurements done".
                    // Only a criterion that actually carries a score or a note is
                    // evidence that someone measured.
                    if (Array.isArray(m.qualityParams) && m.qualityParams.some(q => q &&
                        (String(q.score == null ? '' : q.score).trim() !== '' ||
                         String(q.notes == null ? '' : q.notes).trim() !== ''))) return true;
                    if (Array.isArray(m.samples) && m.samples.some(s => {
                      const w = String(s.weight == null ? '' : s.weight).trim();
                      const o2 = String(s.o2 == null ? '' : s.o2).trim();
                      const co2 = String(s.co2 == null ? '' : s.co2).trim();
                      return (w && parseFloat(w) > 0) || (o2 && parseFloat(o2) !== 0) || (co2 && parseFloat(co2) !== 0);
                    })) return true;
                    return false;
                  };
                  const dayDone = (d) => {
                    const rows = (groups || []).map(g => (g.measurements || []).find(mm => parseFloat(mm.day) === d)).filter(Boolean);
                    return rows.length > 0 && rows.every(measHasData);
                  };
                  const days = Array.from(new Set((groups || []).flatMap(g => (g.measurements || []).map(m => parseFloat(m.day))))).filter(d => !isNaN(d)).sort((a, b) => a - b);
                  const baseDate = project.packingDate || p.startDate;
                  const dateFor = (d) => { if (!baseDate) return ''; const dt = new Date(baseDate); if (isNaN(dt.getTime())) return ''; dt.setDate(dt.getDate() + d); return dt.toISOString().slice(0, 10); };
                  const prevActions = p.actions || [];
                  const prevMeasByDay = {};
                  prevActions.forEach(a => { if (a && a.kind === 'measurement' && a.day != null) prevMeasByDay[String(a.day)] = a; });
                  // Keep manual actions; drop legacy auto/measurement (regenerated).
                  const manualActions = prevActions.filter(a => a && a.kind !== 'measurement' && !a.auto);
                  const measActions = days.map(d => {
                    const prevA = prevMeasByDay[String(d)] || {};
                    const action = { id: 'meas-' + d, kind: 'measurement', day: d, date: dateFor(d), text: 'Measurement P+' + d, done: dayDone(d) };
                    if (prevA.doneManual != null) action.doneManual = prevA.doneManual;
                    return action;
                  });
                  // Only touch the card's actions once this tool actually holds
                  // measurements. Opening a project whose report has not been
                  // started leaves the placeholder row in `groups`, and this
                  // autosave fires there without any user edit — a shared product
                  // record rewritten by another project is enough to trigger it.
                  // Writing then would replace the real planning with one bogus
                  // "done" action. Leaving `actions` alone keeps whatever the card
                  // already had.
                  if (reportHasMeasurementsRef.current) {
                    patch.actions = [...measActions, ...manualActions];
                  } else {
                    // Repair a card the old code already corrupted. The
                    // placeholder could only ever produce a day-0 action, so
                    // clearing a measurement set that is nothing BUT day 0 —
                    // while this tool holds no measurements — removes the bogus
                    // "all measurements done" and cannot touch a real multi-day
                    // plan. Anything else is left exactly as it is.
                    const meas = prevActions.filter(a => a && a.kind === 'measurement');
                    if (meas.length && meas.every(a => Number(a.day) === 0)) patch.actions = manualActions;
                  }
                  manifest.projects[idx] = { ...p, ...patch };
                  await B.writeManifest(manifest);
                }
              } catch (err) { /* transient — next edit retries */ }
            };
            pendingBoardSave.current = doBoardSave;
            boardSaveTimer.current = setTimeout(doBoardSave, 1200);
            return () => { if (boardSaveTimer.current) clearTimeout(boardSaveTimer.current); };
          }, [boardState, clientInfo, project, supplyChain, groups, analysis, lang, unitSystem]);

          // Flush a debounced autosave when the user leaves via the shared
          // "Board" button, so the last edit is never dropped.
          useEffect(() => {
            const B = window.PerfoTecBoard;
            if (!B || !B.registerFlush) return;
            return B.registerFlush(() => {
              if (boardSaveTimer.current) { clearTimeout(boardSaveTimer.current); boardSaveTimer.current = null; }
              return pendingBoardSave.current ? pendingBoardSave.current() : null;
            });
          }, []);

          const handleGroupChange = (id, section, field, value) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== id) {
                // Verification rounds must keep an identical packaging
                // configuration to their Round-1 source, so packaging spec
                // edits propagate to linked R2 groups (sample count stays
                // independent per round).
                if (section === 'specs' && g.verificationOf === id && field !== 'sampleCount') {
                  return { ...g, specs: { ...g.specs, [field]: value } };
                }
                return g;
              }
              if (section === 'name') return { ...g, name: value };
              if (section === 'specs') return { ...g, specs: { ...g.specs, [field]: value } };
              if (section === 'startGas') return { ...g, specs: { ...g.specs, startGas: { ...g.specs.startGas, [field]: value } } };
              if (!section && field) return { ...g, [field]: value };
              return g;
            }));
          };

          const toggleCriteria = (c) => setProject(p => ({ ...p, criteria: p.criteria.includes(c) ? p.criteria.filter(x => x !== c) : [...p.criteria, c] }));
          const addNewCriteria = () => { if(newCriteria && !project.criteria.includes(newCriteria)) { toggleCriteria(newCriteria); setNewCriteria(''); }};
          
          const handleTransportModeToggle = (mode) => {
            const isDeselect = project.transportMode === mode;
            setProject(p => ({ ...p, transportMode: isDeselect ? '' : mode }));
            // Keep the supply-chain transport step in sync with the selected mode.
            if (!isDeselect) {
              const modeToStage = { 'Road Transport': rt.transportRoad, 'Sea Freight': rt.transportSea, 'Air Freight': rt.transportAir, 'Storage': rt.transportStorage };
              const newStage = modeToStage[mode];
              if (newStage) {
                setSupplyChain(prev => {
                  const i = prev.findIndex(s => isTransportStage(s.stage));
                  if (i === -1) return prev;
                  const next = [...prev];
                  next[i] = { ...next[i], stage: newStage };
                  return next;
                });
              }
            }
          };
          const toggleTechnology = (tech) => { setProject(p => ({ ...p, technologies: p.technologies?.includes(tech) ? p.technologies.filter(t => t !== tech) : [...(p.technologies || []), tech] })); };

          // === DEFECTS & PREVENTION MATRIX ===
          // Mirrors proposal.html: stable per-row ids so React keys stay valid
          // and the matrix round-trips cleanly through JSON.
          const addDefectRow = () => setProject(p => ({
            ...p,
            defectsMatrix: [...(p.defectsMatrix || []), { id: Date.now(), defect: '', cause: '', effectMHP: '', effectMAP: '' }]
          }));
          const removeDefectRow = (rowId) => setProject(p => ({
            ...p,
            defectsMatrix: (p.defectsMatrix || []).filter(r => r.id !== rowId)
          }));
          const updateDefectRow = (rowId, field, value) => setProject(p => ({
            ...p,
            defectsMatrix: (p.defectsMatrix || []).map(r => r.id === rowId ? { ...r, [field]: value } : r)
          }));

          // === PRODUCTS ===
          // Sheet parsing and the product database come from product-tools.js,
          // shared with intake.html and proposal.html. Report used to carry its
          // own parser that only understood the pre-2026 sheet template, so the
          // sheets written by the current product-sheet skill silently failed to
          // import here; using the shared one fixes that and keeps the three
          // forms in step as the template evolves.
          const Products = window.PerfoTecProduct;

          const applyProductSheet = (parsed) => {
            if (!parsed) return;
            setProject(p => ({
              ...p,
              ...(parsed.o2Target ? { o2Target: parsed.o2Target } : {}),
              ...(parsed.co2Target ? { co2Target: parsed.co2Target } : {}),
              ...(parsed.tempCritical ? { tempMin: parsed.tempCritical } : {}),
              ...(parsed.o2Acp ? { acpO2: parsed.o2Acp } : {}),
              ...(parsed.co2Max ? { co2Max: parsed.co2Max } : {}),
              ...(parsed.ethyleneProfile ? { ethyleneProfile: parsed.ethyleneProfile } : {}),
              defectsMatrix: parsed.defects && parsed.defects.length > 0 ? parsed.defects : (p.defectsMatrix || [])
            }));
          };
          const handleProductSheetFile = (file) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              const parsed = Products.parseSheet(ev.target?.result || '', lang);
              if (!Products.sheetHasData(parsed)) {
                alert(rt.productSheetParseFail || 'Could not parse this product sheet.');
                return;
              }
              applyProductSheet(parsed);
            };
            reader.onerror = () => alert(rt.productSheetParseFail || 'Could not read this product sheet.');
            reader.readAsText(file);
          };
          const [productSheetDragOver, setProductSheetDragOver] = useState(false);
          const handleProductSheetDrop = (e) => {
            e.preventDefault();
            setProductSheetDragOver(false);
            const file = e.dataTransfer?.files?.[0];
            if (file) handleProductSheetFile(file);
          };

          // === PRODUCT PICKER ===
          // Identical behaviour to intake and proposal: pick from the shared
          // product database, or type a name and add it as a new product.
          const [dashProducts, setDashProducts] = useState([]);
          // Bumped whenever a document is loaded, so the live-link effect below
          // re-checks it against the product database even when the product id is
          // unchanged from the previous document.
          const [docLoadSeq, setDocLoadSeq] = useState(0);
          const [dashState, setDashState] = useState('loading'); // loading | ready | unavailable
          const [dashMsg, setDashMsg] = useState('');
          const [creatingProduct, setCreatingProduct] = useState(null); // null | 'whole' | 'processed'

          useEffect(() => {
            let cancelled = false;
            Products.loadProducts().then(list => {
              if (cancelled) return;
              setDashProducts(list);
              setDashState(list.length > 0 ? 'ready' : 'unavailable');
            });
            return () => { cancelled = true; };
          }, []);

          const applyDashProduct = (prod) => {
            if (!prod) return;
            const { patch, defectCount } = Products.targetPatch(prod, lang);
            setProject(p => ({ ...p, ...Products.identityPatch(prod), ...patch }));
            // Defects may come from the dashboard's own matrix or from an attached
            // sheet; what matters to the user is whether any came across at all.
            setDashMsg(
              defectCount > 0
                ? (rt.dashAppliedDefects || 'Imported from the product database, including {n} defects.').replace('{n}', defectCount)
                : (rt.dashAppliedNoDefects || 'Imported the target window. This product has no defects matrix yet.')
            );
          };

          // === LIVE LINK TO THE PRODUCT DATABASE ===
          // A linked project must always show the product's CURRENT data, not a
          // snapshot from when it was first picked. Renaming a product or editing
          // its targets in the dashboard therefore reaches every project that
          // points at it, the next time that project is opened.
          //
          // Runs once per product id: after a project is loaded (from the board or
          // a file) and the product list has arrived. A product that no longer
          // exists leaves the document untouched — better a stale document than a
          // silently emptied one — and says so.
          useEffect(() => {
            const id = project.productId;
            if (!id || dashProducts.length === 0) return;
            const prod = dashProducts.find(p => p.id === id);
            if (!prod) { setDashMsg(rt.productMissing || ''); return; }
            applyDashProduct(prod);
          }, [project.productId, dashProducts, docLoadSeq]);

          const handleProductNameChange = (name) => {
            const hit = Products.matchProduct(name, dashProducts);
            if (hit) { applyDashProduct(hit); return; }
            setDashMsg('');
            setProject(p => ({
              ...p,
              productName: name,
              productId: '',
              // Leaving a linked product: clear what came from it (variety and the
              // whole characteristics block). A brand-new product has no data yet,
              // and showing the previous product's values under this name would be
              // plainly wrong. Values typed by hand while nothing was linked stay.
              ...(p.productId ? { type: '', ...Products.emptyTargetPatch() } : {})
            }));
          };

          // The state is passed in explicitly rather than read from the form's
          // processing-type toggle: that toggle silently defaults to Whole, and a
          // product's state decides which dashboard entry every later trial lands
          // in. It has to be a deliberate choice, so the user picks it here.
          const createProductFromName = async (state) => {
            const name = (project.productName || '').trim();
            if (!name || creatingProduct) return;
            setCreatingProduct(state === 'processed' ? 'processed' : 'whole');
            try {
              const prod = await Products.createProduct({
                name,
                variety: project.type || '',
                state: state === 'processed' ? 'processed' : 'whole'
              });
              setDashProducts(prev => prev.concat([prod])
                .sort((a, b) => (a.hasSheet !== b.hasSheet) ? (a.hasSheet ? -1 : 1) : a.label.localeCompare(b.label)));
              setDashState('ready');
              // Adopt the created product wholesale, so the form's processing
              // type cannot disagree with the state just chosen for it.
              setProject(p => ({ ...p, ...Products.identityPatch(prod) }));
              setDashMsg((rt.dashCreated || '✓ "{name}" added to the product database.').replace('{name}', name));
            } catch (err) {
              if (err && err.code === 'NO_STORE') {
                setDashMsg(rt.dashCreateUnavailable || 'The product database is not reachable.');
              } else {
                console.error('Creating the product failed:', err);
                setDashMsg(rt.dashCreateFailed || 'Could not add this product to the database.');
              }
            } finally {
              setCreatingProduct(null);
            }
          };

          // === EVALUATION DAYS (Groups tab) ===
          // Identity is by INDEX, not by day-value. Mirrors proposal.html so
          // editing one card doesn't shift others during typing.
          const addEvaluationDay = (groupId) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const numericDays = (g.measurements || []).map(m => parseFloat(m.day)).filter(d => !isNaN(d));
              const lastDay = numericDays.length > 0 ? Math.max(...numericDays) : 0;
              const sCount = g.specs?.sampleCount || 3;
              const newSamples = Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: '', co2: '', weight: '', initialWeight: '' }));
              return {
                ...g,
                measurements: [...(g.measurements || []), {
                  day: lastDay + 1, samples: newSamples,
                  quality: 9, notes: '', images: [], qualityParams: [], evaluateQuality: true
                }].sort((a,b) => parseFloat(a.day) - parseFloat(b.day))
              };
            }));
          };
          const removeEvaluationDay = (groupId, indexToRemove) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              return { ...g, measurements: (g.measurements || []).filter((_, i) => i !== indexToRemove) };
            }));
          };
          const updateEvaluationDay = (groupId, indexToUpdate, newDayValue) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              return {
                ...g,
                measurements: (g.measurements || []).map((m, i) =>
                  i === indexToUpdate ? { ...m, day: newDayValue } : m
                )
              };
            }));
          };

          // Supply Chain
          const addChainStep = () => setSupplyChain([...supplyChain, { stage: '', tempStart: '', tempEnd: '', daysStart: '', daysEnd: '', action: 'none' }]);
          const updateChainStep = (i, f, v) => { const n = [...supplyChain]; n[i][f] = v; setSupplyChain(n); };
          const removeChainStep = (i) => setSupplyChain(supplyChain.filter((_, idx) => idx !== i));
          const moveChainStep = (i, dir) => { const n = [...supplyChain]; if(dir==='up' && i>0){ [n[i], n[i-1]] = [n[i-1], n[i]]; } else if(dir==='down' && i<n.length-1){ [n[i], n[i+1]] = [n[i+1], n[i]]; } setSupplyChain(n); };

          // Group Movement
          const moveGroup = (id, dir) => {
            setGroups(prev => {
              const idx = prev.findIndex(g => g.id === id);
              if (idx < 0) return prev;
              const newG = [...prev];
              if (dir === 'up' && idx > 0) { [newG[idx], newG[idx - 1]] = [newG[idx - 1], newG[idx]]; } 
              else if (dir === 'down' && idx < newG.length - 1) { [newG[idx], newG[idx + 1]] = [newG[idx + 1], newG[idx]]; }
              return newG;
            });
          };

          // Modals
          const openSampleModal = (groupId, index) => {
            const g = groups.find(x => x.id === groupId);
            const meas = g.measurements[index];
            const isEndDay = project.totalDuration && parseFloat(meas.day) === parseInt(project.totalDuration);
            const isRetailDay = project.retailOpenDays && parseFloat(meas.day) === (parseInt(project.totalDuration) + parseInt(project.retailOpenDays));
            const isEvaluationDay = parseFloat(meas.day) === 0 || isEndDay || isRetailDay;
            const isDayEditable = parseFloat(meas.day) !== 0 && !isEndDay && !isRetailDay;
            const day0 = g.measurements.find(m => parseFloat(m.day) === 0);
            // Hide gas inputs when the group is not using a Modified Atmosphere
            // Packaging strategy — for ambient (MHP / Open) variants the O₂/CO₂
            // fields are meaningless.
            const isMAP = !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP';

            setEditingMeasurement({ groupId, index, data: meas, day0Samples: day0?.samples, isEvaluationDay, isDayEditable, projectCriteria: project.criteria, startWeight: g.specs.startWeight || project.packagings?.[0]?.startWeight || project.startWeight, projectTotalDuration: project.totalDuration, isMAP });
            setSampleModalOpen(true);
          };
          
          const openDetailsModal = (groupId, index) => { 
            const g = groups.find(x => x.id === groupId); 
            setEditingMeasurement({ groupId, index, data: g.measurements[index] }); 
            setDetailsModalOpen(true); 
          };

          const saveSampleData = (u) => { 
            setGroups(p => p.map(g => {
                if (g.id !== editingMeasurement.groupId) return g;
                let newMeasurements = g.measurements.map((m, i) => i === editingMeasurement.index ? { ...u, qualityParams: u.qualityParams } : m);
                newMeasurements.sort((a,b) => parseFloat(a.day) - parseFloat(b.day));
                return { ...g, measurements: newMeasurements };
            })); 
          };

          const saveDetailsData = (u) => { setGroups(p => p.map(g => g.id !== editingMeasurement.groupId ? g : { ...g, measurements: g.measurements.map((m, i) => i === editingMeasurement.index ? { ...m, images: u.images } : m) })); };

          const addMeasurementDay = (groupId) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const lastDay = parseFloat(g.measurements[g.measurements.length - 1]?.day || 0);
              const sCount = g.specs.sampleCount || 3;
              const newSamples = Array.from({length: sCount}, (_, i) => ({ id: Date.now() + i, o2: '', co2: '', weight: '', initialWeight: '' }));
              return { ...g, measurements: [...g.measurements, { day: lastDay + 1, samples: newSamples, quality: 9, notes: '', images: [], qualityParams: [], evaluateQuality: false }]};
            }));
          };
          
          const removeMeasurementDay = (groupId, index) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const newMeas = [...g.measurements];
              newMeas.splice(index, 1);
              return { ...g, measurements: newMeas };
            }));
          };

          const updateQuality = (groupId, index, val) => { setGroups(p => p.map(g => g.id !== groupId ? g : { ...g, measurements: g.measurements.map((m, i) => i === index ? { ...m, quality: val } : m) })); };

          const addNewVariant = () => {
            const newId = Math.max(...groups.map(g => g.id), 0) + 1;
            const p = parseInt(project.totalDuration) || 0;
            const o = parseInt(project.retailOpenDays) || 0;
            const sCount = groups[0]?.specs.sampleCount || 3;
            
            const genS = (isD0) => Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: isD0?'20.9':'', co2: isD0?'0.03':'', weight: '', initialWeight: '' }));

            const meas = [{ day: 0, samples: genS(true), quality: 10, notes: 'Start', images: [], qualityParams: [], evaluateQuality: true }];
            if (p > 0) meas.push({ day: p, samples: genS(false), quality: 9, notes: 'End Packing', images: [], qualityParams: [], evaluateQuality: true });
            if (p > 0 && o > 0) meas.push({ day: p + o, samples: genS(false), quality: 9, notes: 'Retail Simulation (Open)', images: [], qualityParams: [], evaluateQuality: true });
            
            setGroups([...groups, { 
                id: newId, 
                name: `Variant ${groups.length + 1}`, 
                specs: { 
                    ...(groups[0]?.specs||{}), 
                    sampleCount: sCount,
                    packaging: (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail'),
                    material: (project.packagings?.[0]?.material || project.material || ''),
                    length: (project.packagings?.[0]?.length || project.length || ''),
                    width: (project.packagings?.[0]?.width || project.width || ''),
                    height: (project.packagings?.[0]?.height || project.height || ''),
                    startWeight: (project.packagings?.[0]?.startWeight || project.startWeight || groups[0]?.specs?.startWeight || '')
                }, 
                measurements: meas, 
                predictedImage: null 
            }]);
            setActiveGroupId(newId);
          };

          const duplicateGroup = (id) => { const org = groups.find(g => g.id === id); const newId = Math.max(...groups.map(g => g.id), 0) + 1; const { verificationOf, round, ...rest } = org; setGroups(p => [...p, { ...rest, id: newId, name: `${org.name} (Copy)` }]); setActiveGroupId(newId); };

          // === VERIFICATION ROUND (Round 2) ===
          // A second test round for the same variant. The packaging
          // configuration is copied from — and stays locked to — Round 1, so
          // the second round is a true verification of the first. Deviating
          // configurations are by definition a new trial and belong in a new
          // report. Measurements start empty on the same evaluation days.
          const addVerificationRound = (sourceId) => {
            const src = groups.find(g => g.id === sourceId);
            if (!src || src.verificationOf) return;
            if (groups.some(g => g.verificationOf === sourceId)) return;
            const newId = Math.max(...groups.map(g => g.id), 0) + 1;
            const sCount = src.specs?.sampleCount || 3;
            const genS = (isD0) => Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: isD0?'20.9':'', co2: isD0?'0.03':'', weight: '', initialWeight: '' }));
            const meas = (src.measurements || []).map(m => ({
              day: m.day, samples: genS(parseFloat(m.day) === 0), quality: 9,
              notes: parseFloat(m.day) === 0 ? 'Start (Round 2)' : '', images: [], qualityParams: [],
              evaluateQuality: m.evaluateQuality || false
            }));
            setGroups(prev => {
              const idx = prev.findIndex(g => g.id === sourceId);
              const ng = { id: newId, name: `${src.name} (R2)`, round: 2, verificationOf: sourceId, specs: JSON.parse(JSON.stringify(src.specs || {})), measurements: meas, predictedImage: null };
              const arr = [...prev];
              arr.splice(idx + 1, 0, ng);
              return arr;
            });
            setActiveGroupId(newId);
          };
          
          const removeGroup = (id) => { 
            if(groups.length > 1) { 
                const newGroups = groups.filter(g => g.id !== id);
                setGroups(newGroups);
                if (activeGroupId === id) {
                   setActiveGroupId(newGroups[0].id);
                }
            }
          };

          const addNextStep = () => { 
            if (newStep.trim()) { 
                setAnalysis(prev => ({ 
                    ...prev, 
                    nextSteps: [...prev.nextSteps, { text: newStep, variantId: newStepVariant }] 
                })); 
                setNewStep(''); 
            }
          };
          const removeNextStep = (i) => setAnalysis(prev => ({ ...prev, nextSteps: prev.nextSteps.filter((_, idx) => idx !== i) }));
          // Inline edit + reorder for detailed conclusion points. Legacy string
          // entries are normalised to { text, variantId } on first edit.
          const updateNextStep = (i, field, value) => setAnalysis(prev => ({
            ...prev,
            nextSteps: prev.nextSteps.map((s, idx) => {
              if (idx !== i) return s;
              const stepObj = typeof s === 'string' ? { text: s, variantId: 'general' } : s;
              return { ...stepObj, [field]: value };
            })
          }));
          const moveNextStep = (i, dir) => setAnalysis(prev => {
            const arr = [...prev.nextSteps];
            const j = dir === 'up' ? i - 1 : i + 1;
            if (j < 0 || j >= arr.length) return prev;
            [arr[i], arr[j]] = [arr[j], arr[i]];
            return { ...prev, nextSteps: arr };
          });

          if (isPreview) {
            return <PrintPreview clientInfo={clientInfo} project={project} groups={groups} supplyChain={supplyChain} onBack={() => setIsPreview(false)} analysis={analysis} unitSystem={unitSystem} lang={lang} />;
          }

          if (isSheet) {
            return <MeasurementSheet clientInfo={clientInfo} project={project} groups={groups} onBack={() => setIsSheet(false)} unitSystem={unitSystem} lang={lang} rt={rt} />;
          }

          // Auto-detect section visibility for checkbox defaults (null = auto, true/false = manual override)
          const autoShowGas = groups.some(g =>
            (!g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP') &&
            (g.measurements || []).some(m =>
              parseFloat(m.day) > 0 &&
              (m.samples || []).some(s => s.o2 !== '' && s.o2 !== undefined && s.o2 !== null)
            )
          );
          const autoShowHub = groups.some(g =>
            (!g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP') && !!g.predictedImage
          );
          const autoShowWeight = groups.some(g => {
            const daysWithWeight = (g.measurements || []).filter(m =>
              (m.samples || []).some(s => s.weight !== '' && s.weight !== undefined && s.weight !== null && parseFloat(s.weight) > 0)
            );
            return daysWithWeight.length >= 2;
          });

          // --- EDITOR VIEW ---
          return (
            <div className="min-h-screen font-sans text-slate-800 bg-slate-50 pb-20">

              {/* PROJECT BOARD LINK BANNER */}
              {boardProjectId && boardState !== 'off' && (
                <div className="w-full text-white text-sm px-4 py-2 flex items-center justify-center gap-3 print:hidden" style={{ backgroundColor: (boardState === 'unreadable' || boardState === 'error') ? '#ea580c' : '#084BCD' }}>
                  <span className="flex items-center gap-2">
                    <FolderOpen size={16} />
                    {boardState === 'linked' && <span>Linked to Project Board{boardTitle ? `: ${boardTitle}` : ''} — changes autosave to the project folder.</span>}
                    {boardState === 'loading' && <span>Loading project from the board…</span>}
                    {boardState === 'needs-permission' && <span>Grant access to the project folder to load this project.</span>}
                    {boardState === 'error' && <span>Could not reach the project folder. Open this from the Project Board.</span>}
                    {boardState === 'unreadable' && <span>This project's file is not a recognised intake/proposal/report — nothing was changed and autosave is off, so the file stays intact.</span>}
                  </span>
                  {boardState === 'needs-permission' && (
                    <button onClick={grantBoardAccess} className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold">Grant access</button>
                  )}
                  <a href="board.html" className="underline/50 hover:underline opacity-80 hover:opacity-100">← Board</a>
                </div>
              )}

              {/* Modals */}
              <SampleModal isOpen={sampleModalOpen} onClose={() => setSampleModalOpen(false)} data={editingMeasurement ? editingMeasurement.data : {}} onSave={saveSampleData} day0Samples={editingMeasurement ? editingMeasurement.day0Samples : null} projectCriteria={project.criteria || []} isEvaluationDay={editingMeasurement ? editingMeasurement.isEvaluationDay : false} isDayEditable={editingMeasurement ? editingMeasurement.isDayEditable : false} startWeight={editingMeasurement ? editingMeasurement.startWeight : 0} projectTotalDuration={project.totalDuration} isMAP={editingMeasurement ? editingMeasurement.isMAP : true} rt={rt} />
              <DetailsModal isOpen={detailsModalOpen} onClose={() => setDetailsModalOpen(false)} data={editingMeasurement ? editingMeasurement.data : {}} onSave={saveDetailsData} rt={rt} />

              {pendingImageReplace && (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 print:hidden">
                  <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border-t-8 border-orange-500 transform transition-all">
                     <div className="flex items-center gap-4 mb-6 text-orange-600 bg-orange-50 p-4 rounded-xl">
                        <AlertTriangle size={28} />
                        <h3 className="font-extrabold text-xl">{rt.warning}</h3>
                     </div>
                     <p className="mb-8 text-base text-slate-700 leading-relaxed">{rt.warningText}</p>
                     <div className="flex justify-end gap-3">
                       <button onClick={() => setPendingImageReplace(null)} className="px-6 py-3 bg-slate-100 text-slate-700 rounded-full hover:bg-slate-200 font-bold transition">{rt.cancel}</button>
                       <button onClick={() => {
                           setGroups(prev => prev.map(g => g.id === pendingImageReplace.groupId ? { ...g, predictedImage: pendingImageReplace.result } : g));
                           setPendingImageReplace(null);
                       }} className="px-6 py-3 bg-orange-600 text-white rounded-full hover:bg-orange-700 font-bold shadow-lg shadow-orange-200 transition">{rt.overwrite}</button>
                     </div>
                  </div>
                </div>
              )}

              {/* === PRODUCT SELECTION MODAL ===
               * Shown when an intake JSON contains more than one product. The
               * user picks which product to load into this report; the
               * selected product is then passed to loadIntakeProduct().
               */}
              {pendingProductSelection && (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 print:hidden">
                  <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-2xl w-full border-t-8 transform transition-all max-h-[90vh] flex flex-col" style={{ borderColor: BRAND.colors.green }}>
                     <div className="flex items-start justify-between gap-4 mb-6">
                        <div className="flex items-center gap-4">
                           <div className="p-3 bg-green-50 rounded-xl shrink-0">
                              <Package size={28} color={BRAND.colors.green} />
                           </div>
                           <div>
                              <h3 className="font-extrabold text-xl text-slate-800 tracking-tight">{rt.selectProductTitle}</h3>
                              <p className="text-sm text-slate-500 mt-1 leading-relaxed">{rt.selectProductDesc}</p>
                           </div>
                        </div>
                        <button onClick={() => setPendingProductSelection(null)} className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition shrink-0" title={rt.cancel}>
                          <X size={20}/>
                        </button>
                     </div>
                     <p className="text-xs font-bold tracking-wide text-slate-500 uppercase mb-3">{rt.selectProductHint}</p>
                     <div className="space-y-3 overflow-y-auto pr-1 -mr-1">
                       {pendingProductSelection.products.map((p, idx) => {
                         const name = p?.name || rt.noProductName;
                         const meta = [p?.type, p?.origin, p?.processingType].filter(Boolean).join(' • ');
                         return (
                           <button
                             key={idx}
                             type="button"
                             onClick={() => confirmProductSelection(idx)}
                             className="w-full text-left p-5 bg-slate-50 hover:bg-green-50 border-2 border-slate-200 hover:border-green-400 rounded-2xl transition-all flex items-center gap-4 group shadow-sm hover:shadow-md"
                           >
                             {p?.photo ? (
                               <img src={p.photo} alt="" className="w-14 h-14 rounded-xl object-cover border border-slate-200 shrink-0"/>
                             ) : (
                               <div className="w-14 h-14 rounded-xl bg-white border border-slate-200 flex items-center justify-center shrink-0">
                                 <Package size={22} className="text-slate-300" />
                               </div>
                             )}
                             <div className="flex-1 min-w-0">

                           <div className="md:col-span-3 mt-2 bg-gradient-to-br from-slate-50 to-slate-100 p-6 rounded-2xl border border-slate-200 shadow-sm">

                                     </button>

                                 })}
                              </div>
                           </div>
                         </div>

                                      <option value="unpack" className="text-red-700">{rt.actUnpack}</option>

                                 <div className="hidden lg:flex justify-center w-full">
                                    <button onClick={() => removeChainStep(idx)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title={rt.removeStep}>
                                      <Trash2 size={20}/>
                                    </button>
                                 </div>
