                  // Fill-if-empty, like client and product above. The board owns this
                  // field: it has the people registry, the picker and rename. This
                  // tool only PREFILLS its employee box from the card, so writing it
                  // back unconditionally meant every autosave re-asserted a value the
                  // user may have just changed on the board — two writers on one
                  // field, which is exactly what surfaces as "someone else was
                  // faster" (with your own name on it, because you are both writers).
                  if (!p.productManager && project.employee) patch.productManager = project.employee;
                  if (!p.image && (project.coverImage || project.startImage)) {
                    const scaled = await B.scaleImage(project.coverImage || project.startImage, 480);
                    if (scaled) patch.image = scaled;
                  }
                  // Generate one action per planned measurement day (P+day), dated
                  // from the packing date. A day counts as DONE when its measurement
                  // actually has data entered (a photo, notes, quality params, or a
                  // sample weight/gas value) — a blank row (all zeros) stays open.
                  // Manual done-overrides (doneManual) and manual actions are kept.
                  const measHasData = (m) => {
                    if (!m) return false;
                    if (Array.isArray(m.images) && m.images.length) return true;
                    // A label the tool wrote ('End Packing', ...) is no sign of a
                    // measurement: it marked unmeasured days done.
                    if (ownNote(m.notes)) return true;
                    // A row's qualityParams are the criteria to ASSESS, written out
                    // when the trial is planned — identical on a measured and an
                    // unmeasured day, every score an empty string. Counting their
                    // mere presence as data marked every planned day done, so a
                    // trial with only P+0 filled in read as "all measurements done".
                    // Only a criterion that actually carries a score or a note is
                    // evidence that someone measured.
                    if (Array.isArray(m.qualityParams) && m.qualityParams.some(q => q &&
                        (String(q.score == null ? '' : q.score).trim() !== '' ||
                         String(q.notes == null ? '' : q.notes).trim() !== ''))) return true;
                    if (Array.isArray(m.samples) && m.samples.some(s => {
                      const w = String(s.weight == null ? '' : s.weight).trim();
                      const o2 = String(s.o2 == null ? '' : s.o2).trim();
                      const co2 = String(s.co2 == null ? '' : s.co2).trim();
                      return (w && parseFloat(w) > 0) || (o2 && parseFloat(o2) !== 0) || (co2 && parseFloat(co2) !== 0);
                    })) return true;
                    return false;
                  };
                  const dayDone = (d) => {
                    const rows = (groups || []).map(g => (g.measurements || []).find(mm => parseFloat(mm.day) === d)).filter(Boolean);
                    return rows.length > 0 && rows.every(measHasData);
                  };
                  const days = Array.from(new Set((groups || []).flatMap(g => (g.measurements || []).map(m => parseFloat(m.day))))).filter(d => !isNaN(d)).sort((a, b) => a - b);
                  const baseDate = project.packingDate || p.startDate;
                  const dateFor = (d) => { if (!baseDate) return ''; const dt = isoDayPlus(baseDate, d); return dt ? dt.toISOString().slice(0, 10) : ''; };
                  const prevActions = p.actions || [];
                  const prevMeasByDay = {};
                  prevActions.forEach(a => { if (a && a.kind === 'measurement' && a.day != null) prevMeasByDay[String(a.day)] = a; });
                  // Keep manual actions; drop legacy auto/measurement (regenerated).
                  const manualActions = prevActions.filter(a => a && a.kind !== 'measurement' && !a.auto);
                  const measActions = days.map(d => {
                    const prevA = prevMeasByDay[String(d)] || {};
                    const action = { id: 'meas-' + d, kind: 'measurement', day: d, date: dateFor(d), text: 'Measurement P+' + d, done: dayDone(d) };
                    if (prevA.doneManual != null) action.doneManual = prevA.doneManual;
                    return action;
                  });
                  // Only touch the card's actions once this tool actually holds
                  // measurements. Opening a project whose report has not been
                  // started leaves the placeholder row in `groups`, and this
                  // autosave fires there without any user edit — a shared product
                  // record rewritten by another project is enough to trigger it.
                  // Writing then would replace the real planning with one bogus
                  // "done" action. Leaving `actions` alone keeps whatever the card
                  // already had.
                  if (reportHasMeasurementsRef.current) {
                    patch.actions = [...measActions, ...manualActions];
                  } else {
                    // Repair a card the old code already corrupted. The
                    // placeholder could only ever produce a day-0 action, so
                    // clearing a measurement set that is nothing BUT day 0 —
                    // while this tool holds no measurements — removes the bogus
                    // "all measurements done" and cannot touch a real multi-day
                    // plan. Anything else is left exactly as it is.
                    const meas = prevActions.filter(a => a && a.kind === 'measurement');
                    if (meas.length && meas.every(a => Number(a.day) === 0)) patch.actions = manualActions;
                  }
                  manifest.projects[idx] = { ...p, ...patch };
                  await B.writeManifest(manifest);
                }
                markSave('saved');
              } catch (err) {
                if (err && err.conflict) {
                  // Not retried: the user decides (banner). Leaving asks first.
                  markSave('conflict');
                  pendingBoardSave.current = doBoardSave;
                  throw err;
                }
                // Shown in the banner and retried in 8 s (or on the next edit);
                // leaving the page now asks first.
                markSave('failed', (err && err.message) || String(err));
                pendingBoardSave.current = doBoardSave;
                saveRetryTimer.current = setTimeout(() => { if (pendingBoardSave.current === doBoardSave) doBoardSave().catch(() => {}); }, 8000);
                throw err;
              }
            };
            const doBoardSave = () => { const p = saveChain.current.then(runSave); saveChain.current = p.catch(() => {}); return p; };
            pendingBoardSave.current = doBoardSave;
            boardSaveTimer.current = setTimeout(() => { doBoardSave().catch(() => {}); }, 1200);
            return () => { if (boardSaveTimer.current) clearTimeout(boardSaveTimer.current); };
          }, [boardState, clientInfo, project, supplyChain, groups, analysis, lang, unitSystem]);

          // Flush a debounced autosave when the user leaves via the shared
          // "Board" button, so the last edit is never dropped.
          useEffect(() => {
            const B = window.PerfoTecBoard;
            if (!B || !B.registerFlush) return;
            return B.registerFlush(() => {
              if (boardSaveTimer.current) { clearTimeout(boardSaveTimer.current); boardSaveTimer.current = null; }
              // A save that already failed is not "nothing to do": the flush
              // rejects, so leaving asks instead of pretending it was saved.
              if (pendingBoardSave.current) return pendingBoardSave.current();
              return saveStateRef.current === 'failed' ? Promise.reject(new Error('The last save failed')) : saveChain.current;
            });
          }, []);

          dialogOpenRef.current = sampleModalOpen || detailsModalOpen;
          // Opening a dialog adds a history entry, so "back" lands on it: the
          // dialog closes (after asking, as its input is not saved yet) and the
          // report stays open. Closing it with its own buttons takes the entry
          // off again, so the history does not fill up with dialogs.
          const dialogOpen = sampleModalOpen || detailsModalOpen;
          const closedByBack = useRef(false);
          useEffect(() => {
            if (!dialogOpen) return;
            window.history.pushState({ perfotecDialog: true }, '');
            const onPop = () => {
              if (!window.confirm(rt.confirmCloseDialog || 'Close this window without saving what was entered?')) {
                window.history.pushState({ perfotecDialog: true }, '');
                return;
              }
              closedByBack.current = true;
              setSampleModalOpen(false);
              setDetailsModalOpen(false);
            };
            window.addEventListener('popstate', onPop);
            return () => {
              window.removeEventListener('popstate', onPop);
              if (!closedByBack.current && window.history.state && window.history.state.perfotecDialog) window.history.back();
              closedByBack.current = false;
            };
          }, [dialogOpen]);
          // Closing the tab or reloading with an edit not yet saved: the
          // browser asks. (The "← Board" button flushes and asks itself.)
          useEffect(() => {
            const onBeforeUnload = (e) => {
              // An open measurement or photo dialog holds input that is not in
              // the report yet (a phone's back button used to drop it).
              if (saveStateRef.current === 'saved' && !dialogOpenRef.current) return;
              e.preventDefault();
              e.returnValue = '';
              return '';
            };
            window.addEventListener('beforeunload', onBeforeUnload);
            return () => window.removeEventListener('beforeunload', onBeforeUnload);
          }, []);

          const handleGroupChange = (id, section, field, value) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== id) {
                // Verification rounds must keep an identical packaging
                // configuration to their Round-1 source, so packaging spec
                // edits propagate to linked R2 groups (sample count stays
                // independent per round).
                if (section === 'specs' && g.verificationOf === id && field !== 'sampleCount') {
                  return { ...g, specs: { ...g.specs, [field]: value } };
                }
                return g;
              }
              if (section === 'name') return { ...g, name: value };
              if (section === 'specs') return { ...g, specs: { ...g.specs, [field]: value } };
              if (section === 'startGas') return { ...g, specs: { ...g.specs, startGas: { ...g.specs.startGas, [field]: value } } };
              if (!section && field) return { ...g, [field]: value };
              return g;
            }));
          };

          const toggleCriteria = (c) => setProject(p => ({ ...p, criteria: p.criteria.includes(c) ? p.criteria.filter(x => x !== c) : [...p.criteria, c] }));
          const addNewCriteria = () => { if(newCriteria && !project.criteria.includes(newCriteria)) { toggleCriteria(newCriteria); setNewCriteria(''); }};
          
          const handleTransportModeToggle = (mode) => {
            const isDeselect = project.transportMode === mode;
            setProject(p => ({ ...p, transportMode: isDeselect ? '' : mode }));
            // Keep the supply-chain transport step in sync with the selected mode.
            if (!isDeselect) {
              const modeToStage = { 'Road Transport': rt.transportRoad, 'Sea Freight': rt.transportSea, 'Air Freight': rt.transportAir, 'Storage': rt.transportStorage };
              const newStage = modeToStage[mode];
              if (newStage) {
                setSupplyChain(prev => {
                  const i = prev.findIndex(s => isTransportStage(s.stage));
                  if (i === -1) return prev;
                  const next = [...prev];
                  next[i] = { ...next[i], stage: newStage };
                  return next;
                });
              }
            }
          };
          const toggleTechnology = (tech) => { setProject(p => ({ ...p, technologies: p.technologies?.includes(tech) ? p.technologies.filter(t => t !== tech) : [...(p.technologies || []), tech] })); };

          // === DEFECTS & PREVENTION MATRIX ===
          // Mirrors proposal.html: stable per-row ids so React keys stay valid
          // and the matrix round-trips cleanly through JSON.
          const addDefectRow = () => setProject(p => ({
            ...p,
            defectsMatrix: [...(p.defectsMatrix || []), { id: Date.now(), defect: '', cause: '', effectMHP: '', effectMAP: '' }]
          }));
          const removeDefectRow = (rowId) => setProject(p => ({
            ...p,
            defectsMatrix: (p.defectsMatrix || []).filter(r => r.id !== rowId)
          }));
          const updateDefectRow = (rowId, field, value) => setProject(p => ({
            ...p,
            defectsMatrix: (p.defectsMatrix || []).map(r => r.id === rowId ? { ...r, [field]: value } : r)
          }));

          // === PRODUCTS ===
          // Sheet parsing and the product database come from product-tools.js,
          // shared with intake.html and proposal.html. Report used to carry its
          // own parser that only understood the pre-2026 sheet template, so the
          // sheets written by the current product-sheet skill silently failed to
          // import here; using the shared one fixes that and keeps the three
          // forms in step as the template evolves.
          const Products = window.PerfoTecProduct;

          const applyProductSheet = (parsed) => {
            if (!parsed) return;
            setProject(p => ({
              ...p,
              ...(parsed.o2Target ? { o2Target: parsed.o2Target } : {}),
              ...(parsed.co2Target ? { co2Target: parsed.co2Target } : {}),
              ...(parsed.tempCritical ? { tempMin: parsed.tempCritical } : {}),
              ...(parsed.o2Acp ? { acpO2: parsed.o2Acp } : {}),
              ...(parsed.co2Max ? { co2Max: parsed.co2Max } : {}),
              ...(parsed.ethyleneProfile ? { ethyleneProfile: parsed.ethyleneProfile } : {}),
              defectsMatrix: parsed.defects && parsed.defects.length > 0 ? parsed.defects : (p.defectsMatrix || [])
            }));
          };
          const handleProductSheetFile = (file) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              const parsed = Products.parseSheet(ev.target?.result || '', lang);
              if (!Products.sheetHasData(parsed)) {
                alert(rt.productSheetParseFail || 'Could not parse this product sheet.');
                return;
              }
              applyProductSheet(parsed);
            };
            reader.onerror = () => alert(rt.productSheetParseFail || 'Could not read this product sheet.');
            reader.readAsText(file);
          };
          const [productSheetDragOver, setProductSheetDragOver] = useState(false);
          const handleProductSheetDrop = (e) => {
            e.preventDefault();
            setProductSheetDragOver(false);
            const file = e.dataTransfer?.files?.[0];
            if (file) handleProductSheetFile(file);
          };

          // === PRODUCT PICKER ===
          // Identical behaviour to intake and proposal: pick from the shared
          // product database, or type a name and add it as a new product.
          const [dashProducts, setDashProducts] = useState([]);
          // Bumped whenever a document is loaded, so the live-link effect below
          // re-checks it against the product database even when the product id is
          // unchanged from the previous document.
          const [docLoadSeq, setDocLoadSeq] = useState(0);
          const [dashState, setDashState] = useState('loading'); // loading | ready | unavailable
          const [dashMsg, setDashMsg] = useState('');
          // Set when the typed text matched one of the product's OTHER names, so
          // the link status can explain why the field now says something else.
          const [aliasNote, setAliasNote] = useState('');
          const [creatingProduct, setCreatingProduct] = useState(null); // null | 'whole' | 'processed'

          // Loaded again once a board project is linked: before the folder access
          // is granted, loadProducts can only read the old static database file,
          // and that stale list fed the live link and the "create product" buttons.
          const productsLive = !boardProjectId || boardState === 'linked';
          useEffect(() => {
            let cancelled = false;
            Products.loadProducts().then(list => {
              if (cancelled) return;
              setDashProducts(list);
              setDashState(list.length > 0 ? 'ready' : 'unavailable');
            });
            return () => { cancelled = true; };
          }, [productsLive]);

          const applyDashProduct = (prod) => {
            if (!prod) return;
            const { patch, defectCount } = Products.targetPatch(prod, lang);
            setProject(p => ({ ...p, ...Products.identityPatch(prod), ...patch }));
            // Defects may come from the dashboard's own matrix or from an attached
            // sheet; what matters to the user is whether any came across at all.
            setDashMsg(
              defectCount > 0
                ? (rt.dashAppliedDefects || 'Imported from the product database, including {n} defects.').replace('{n}', defectCount)
                : (rt.dashAppliedNoDefects || 'Imported the target window. This product has no defects matrix yet.')
            );
          };

          // === LIVE LINK TO THE PRODUCT DATABASE ===
          // A linked project must always show the product's CURRENT data, not a
          // snapshot from when it was first picked. Renaming a product or editing
          // its targets in the dashboard therefore reaches every project that
          // points at it, the next time that project is opened.
          //
          // Runs once per product id: after a project is loaded (from the board or
          // a file) and the product list has arrived. A product that no longer
          // exists leaves the document untouched — better a stale document than a
          // silently emptied one — and says so.
          useEffect(() => {
            const id = project.productId;
            if (!id || dashProducts.length === 0 || !productsLive) return;
            const prod = dashProducts.find(p => p.id === id);
            if (!prod) { setDashMsg(rt.productMissing || ''); return; }
            applyDashProduct(prod);
          }, [project.productId, dashProducts, docLoadSeq, productsLive]);

          const handleProductNameChange = (name) => {
            const hit = Products.matchProduct(name, dashProducts);
            if (hit) {
              // A product found under one of its other trade names still goes in
              // under its main name — that is what applyDashProduct writes back
              // into the field — so remember which name was recognised and say so
              // beside the link, or the field changing under your hands reads as
              // a bug. Kept out of dashMsg because the live-link effect below
              // rewrites that on every product change.
              setAliasNote(Products.matchedAlias(name, hit));
              applyDashProduct(hit);
              return;
            }
            setAliasNote('');
            setDashMsg('');
            setProject(p => ({
              ...p,
              productName: name,
              productId: '',
              // Leaving a linked product: clear what came from it (variety and the
              // whole characteristics block). A brand-new product has no data yet,
              // and showing the previous product's values under this name would be
              // plainly wrong. Values typed by hand while nothing was linked stay.
              ...(p.productId ? { type: '', ...Products.emptyTargetPatch() } : {})
            }));
          };

          // The state is passed in explicitly rather than read from the form's
          // processing-type toggle: that toggle silently defaults to Whole, and a
          // product's state decides which dashboard entry every later trial lands
          // in. It has to be a deliberate choice, so the user picks it here.
          const createProductFromName = async (state) => {
            const name = (project.productName || '').trim();
            if (!name || creatingProduct) return;
            setCreatingProduct(state === 'processed' ? 'processed' : 'whole');
            try {
              const prod = await Products.createProduct({
                name,
                variety: project.type || '',
                state: state === 'processed' ? 'processed' : 'whole'
              });
              setDashProducts(prev => prev.concat([prod])
                .sort((a, b) => (a.hasSheet !== b.hasSheet) ? (a.hasSheet ? -1 : 1) : a.label.localeCompare(b.label)));
              setDashState('ready');
              // Adopt the created product wholesale, so the form's processing
              // type cannot disagree with the state just chosen for it.
              setProject(p => ({ ...p, ...Products.identityPatch(prod) }));
              setDashMsg((rt.dashCreated || '✓ "{name}" added to the product database.').replace('{name}', name));
            } catch (err) {
              if (err && err.code === 'NO_STORE') {
                setDashMsg(rt.dashCreateUnavailable || 'The product database is not reachable.');
              } else {
                console.error('Creating the product failed:', err);
                setDashMsg(rt.dashCreateFailed || 'Could not add this product to the database.');
              }
            } finally {
              setCreatingProduct(null);
            }
          };

          // === EVALUATION DAYS (Groups tab) ===
          // Identity is by INDEX, not by day-value. Mirrors proposal.html so
          // editing one card doesn't shift others during typing.
          // ---- Global evaluation days -------------------------------------------
          // One plan for every variant that follows it (all of them, unless a
          // variant's box "follows the global evaluation days" is unticked:
          // g.ownDays). The panel lists every day those variants have; adding,
          // changing or deleting a day does so in each of them. It used to act on
          // the selected variant only, under a "Global" title. A day that holds
          // measurements asks before it is moved or deleted.
          const followsGlobal = (g) => !g.ownDays;
          const followers = groups.filter(followsGlobal);
          const globalDays = Array.from(new Set(followers.flatMap(g => (g.measurements || []).map(m => parseFloat(m.day)))))
            .filter(d => !isNaN(d)).sort((a, b) => a - b);
          const hasDay = (g, day) => (g.measurements || []).some(m => parseFloat(m.day) === day);
          const measuredOn = (day) => followers.filter(g => (g.measurements || []).some(m => parseFloat(m.day) === day && measurementHasData(m)));
          const evalRow = (g, day) => ({
            day, samples: Array.from({ length: g.specs?.sampleCount || 3 }, (_, i) => ({ id: Date.now() + i + Math.random(), o2: '', co2: '', weight: '', initialWeight: '' })),
            quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: true
          });
          const sortRows = (rows) => [...rows].sort((a, b) => parseFloat(a.day) - parseFloat(b.day));
          // Adds `day` (default: the day after the last one) to every follower
          // that does not have it yet.
          const addEvaluationDay = (day) => {
            const d = typeof day === 'number' ? day : (globalDays.length ? Math.max(...globalDays) : 0) + 1;
            setGroups(prev => prev.map(g => !followsGlobal(g) || hasDay(g, d) ? g
              : { ...g, measurements: sortRows([...(g.measurements || []), evalRow(g, d)]) }));
          };
          const removeEvaluationDay = (day) => {
            if (day === 0 || removeTooSoon()) return;
            const measured = measuredOn(day);
            if (measured.length && !window.confirm((rt.confirmRemoveGlobalDay || 'P+{day} holds measurements in {n} variant(s): {names}. Delete this day in every variant that follows the global days, with those measurements?')
                .replace('{day}', day).replace('{n}', measured.length).replace('{names}', measured.map(g => g.name || '').join(', ')))) return;
            markRemoved();
            setGroups(prev => prev.map(g => !followsGlobal(g) ? g
              : { ...g, measurements: (g.measurements || []).filter(m => parseFloat(m.day) !== day) }));
          };
          // Applied when the field is left (CommitInput). The rows keep their
          // data; a day the tool created for Total/Retail days stops moving with
          // those numbers once it is given a day of its own.
          const updateEvaluationDay = (oldDay, raw) => {
            if (oldDay === 0) return;
            const newDay = parseFloat(String(raw == null ? '' : raw).replace(',', '.'));
            if (!(newDay >= 0)) { window.alert(rt.dayInvalid || 'Enter a day of 0 or more.'); return; }
            if (newDay === oldDay) return;
            const clash = followers.filter(g => hasDay(g, oldDay) && hasDay(g, newDay));
            if (clash.length) {
              window.alert((rt.dayClash || 'P+{day} already exists in: {names}. Choose another day.').replace('{day}', newDay).replace('{names}', clash.map(g => g.name || '').join(', ')));
              return;
            }
            const measured = measuredOn(oldDay);
            if (measured.length && !window.confirm((rt.confirmMoveGlobalDay || 'P+{old} holds measurements in {n} variant(s): {names}. Move them to P+{new}?')
                .replace('{old}', oldDay).replace('{new}', newDay).replace('{n}', measured.length).replace('{names}', measured.map(g => g.name || '').join(', ')))) return;
            setGroups(prev => prev.map(g => !followsGlobal(g) ? g : {
              ...g,
              measurements: sortRows((g.measurements || []).map(m => {
                if (parseFloat(m.day) !== oldDay) return m;
                const { auto, ...rest } = m;
                return { ...rest, day: newDay };
              }))
            }));
          };

          // Supply Chain
          const addChainStep = () => setSupplyChain([...supplyChain, { stage: '', tempStart: '', tempEnd: '', daysStart: '', daysEnd: '', action: 'none' }]);
          // A new step object, not a write into the old one: the previous state
          // must stay what it was (undo, comparisons, the save that is running).
          const updateChainStep = (i, f, v) => setSupplyChain(prev => prev.map((s, j) => j === i ? { ...s, [f]: v } : s));
          const removeChainStep = (i) => setSupplyChain(supplyChain.filter((_, idx) => idx !== i));
          const moveChainStep = (i, dir) => { const n = [...supplyChain]; if(dir==='up' && i>0){ [n[i], n[i-1]] = [n[i-1], n[i]]; } else if(dir==='down' && i<n.length-1){ [n[i], n[i+1]] = [n[i+1], n[i]]; } setSupplyChain(n); };

          // Group Movement
          const moveGroup = (id, dir) => {
            setGroups(prev => {
              const idx = prev.findIndex(g => g.id === id);
              if (idx < 0) return prev;
              const newG = [...prev];
              if (dir === 'up' && idx > 0) { [newG[idx], newG[idx - 1]] = [newG[idx - 1], newG[idx]]; } 
              else if (dir === 'down' && idx < newG.length - 1) { [newG[idx], newG[idx + 1]] = [newG[idx + 1], newG[idx]]; }
              return newG;
            });
          };

          // Modals
          const openSampleModal = (groupId, index) => {
            const g = groups.find(x => x.id === groupId);
            const meas = g.measurements[index];
            const isEndDay = project.totalDuration && parseFloat(meas.day) === parseInt(project.totalDuration);
            const isRetailDay = project.retailOpenDays && parseFloat(meas.day) === (parseInt(project.totalDuration) + parseInt(project.retailOpenDays));
            const isEvaluationDay = parseFloat(meas.day) === 0 || isEndDay || isRetailDay;
            const isDayEditable = parseFloat(meas.day) !== 0 && !isEndDay && !isRetailDay;
            const day0 = g.measurements.find(m => parseFloat(m.day) === 0);
            // Hide gas inputs when the group is not using a Modified Atmosphere
            // Packaging strategy — for ambient (MHP / Open) variants the O₂/CO₂
            // fields are meaningless.
            const isMAP = !g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP';

            const otherDays = g.measurements.filter((m, i) => i !== index).map(m => parseFloat(m.day)).filter(d => !isNaN(d));
            setEditingMeasurement({ groupId, index, otherDays, loadSeq: docLoadSeq, data: meas, day0Samples: day0?.samples, isEvaluationDay, isDayEditable, projectCriteria: project.criteria, startWeight: g.specs.startWeight || project.packagings?.[0]?.startWeight || project.startWeight, projectTotalDuration: project.totalDuration, isMAP });
            setSampleModalOpen(true);
          };
          
          const openDetailsModal = (groupId, index) => { 
            const g = groups.find(x => x.id === groupId); 
            setEditingMeasurement({ groupId, index, loadSeq: docLoadSeq, data: g.measurements[index] });  
            setDetailsModalOpen(true); 
          };

          // Saves into the row the dialog opened, found again by identity (or by
          // the day it had) — not by its position, which a reload or re-sort in
          // between can give to another day. Only the fields the dialog edits are
          // written, so photos added meanwhile stay.
          const saveSampleData = (u) => {
            const em = editingMeasurement;
            if (!em) return false;
            const openedDay = parseFloat(em.data && em.data.day);
            const findRow = (g) => {
              const i = (g.measurements || []).indexOf(em.data);
              return i >= 0 ? i : (g.measurements || []).findIndex(m => parseFloat(m.day) === openedDay);
            };
            const g0 = groups.find(g => g.id === em.groupId);
            // Another document was loaded while the dialog was open.
            if (!g0 || findRow(g0) < 0 || (em.loadSeq !== undefined && em.loadSeq !== docLoadSeq)) {
              window.alert(rt.measurementGone || 'This measurement no longer exists (the report was changed or reloaded meanwhile). Your input was not saved.');
              return false;
            }
            const fields = { day: u.day, notes: u.notes, samples: u.samples, qualityParams: u.qualityParams, evaluateQuality: u.evaluateQuality, legacyQuality: u.legacyQuality };
            setGroups(p => p.map(g => {
                if (g.id !== em.groupId) return g;
                const idx = findRow(g);
                if (idx < 0) return g;
                const before = g.measurements[idx];
                let newMeasurements = g.measurements.map((m, i) => i === idx ? { ...m, ...fields } : m);
                // A P+0 sample removed or moved: the later days that compared to
                // the P+0 sample in their position keep that start weight.
                if (parseFloat(before.day) === 0) {
                  const oldBase = before.samples || [], newBase = u.samples || [];
                  const shiftFrom = oldBase.findIndex((s, j) => !newBase[j] || (s && s.id != null && newBase[j].id !== s.id));
                  if (shiftFrom >= 0) newMeasurements = newMeasurements.map((m, i) =>
                    i === idx || !(parseFloat(m.day) > 0) ? m : { ...m, samples: pinStartWeights(m.samples, oldBase, j => j >= shiftFrom) });
                }
                newMeasurements.sort((a,b) => parseFloat(a.day) - parseFloat(b.day));
                return { ...g, measurements: newMeasurements };
            }));
            return true;
          };

          // The photo dialog, likewise: into the row it opened, by identity or day.
          const saveDetailsData = (u) => { const em = editingMeasurement; if (em && em.loadSeq !== undefined && em.loadSeq !== docLoadSeq) { window.alert(rt.measurementGone || 'This measurement no longer exists. Your input was not saved.'); return; } const openedDay = parseFloat(em && em.data && em.data.day); setGroups(p => p.map(g => { if (!em || g.id !== em.groupId) return g; let idx = g.measurements.indexOf(em.data); if (idx < 0) idx = g.measurements.findIndex(m => parseFloat(m.day) === openedDay); return idx < 0 ? g : { ...g, measurements: g.measurements.map((m, i) => i === idx ? { ...m, images: u.images } : m) }; })); };

          const addMeasurementDay = (groupId) => {
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const lastDay = Math.max(0, ...(g.measurements || []).map(m => parseFloat(m.day)).filter(d => !isNaN(d)));
              const sCount = g.specs.sampleCount || 3;
              const newSamples = Array.from({length: sCount}, (_, i) => ({ id: Date.now() + i, o2: '', co2: '', weight: '', initialWeight: '' }));
              return { ...g, measurements: [...g.measurements, { day: lastDay + 1, samples: newSamples, quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: false }]};
            }));
          };
          
          const removeMeasurementDay = (groupId, index) => {
            if (removeTooSoon()) return;
            const target = groups.find(g => g.id === groupId);
            const row = target && (target.measurements || [])[index];
            if (!row) return;
            if (measurementHasData(row) && !window.confirm(
                (rt.confirmRemoveDay || 'Delete P+{day} of "{name}"?').replace('{day}', row.day).replace('{name}', target.name || ''))) return;
            markRemoved();
            setGroups(prev => prev.map(g => {
              if (g.id !== groupId) return g;
              const newMeas = [...g.measurements];
              newMeas.splice(index, 1);
              return { ...g, measurements: newMeas };
            }));
          };


          // A variant id is never handed out twice: a new variant that took the
          // id of a deleted one inherited its conclusion and action points (and
          // an orphaned R2 followed its packaging). project.maxVariantId remembers
          // the highest id ever used, deleted variants included.
          const nextGroupId = () => Math.max(0, parseInt(project.maxVariantId) || 0,
            ...groups.map(g => parseInt(g.id)).filter(n => !isNaN(n)),
            ...Object.keys(analysis.variantConclusions || {}).map(k => parseInt(k)).filter(n => !isNaN(n)),
            ...(analysis.nextSteps || []).map(s => parseInt(s && s.variantId)).filter(n => !isNaN(n))) + 1;
          const addNewVariant = () => {
            const newId = nextGroupId();
            const p = parseInt(project.totalDuration) || 0;
            const o = parseInt(project.retailOpenDays) || 0;
            const sCount = groups[0]?.specs.sampleCount || 3;
            
            const genS = (isD0) => Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: isD0?'20.9':'', co2: isD0?'0.03':'', weight: '', initialWeight: '' }));

            const meas = [{ day: 0, samples: genS(true), quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: true }];
            if (p > 0) meas.push({ day: p, auto: 'end', samples: genS(false), quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: true });
            if (p > 0 && o > 0) meas.push({ day: p + o, auto: 'open', samples: genS(false), quality: '', notes: '', images: [], qualityParams: [], evaluateQuality: true });
            
            setGroups([...groups, { 
                id: newId, 
                name: `Variant ${groups.length + 1}`, 
                specs: { 
                    ...(groups[0]?.specs||{}), 
                    sampleCount: sCount,
                    packaging: (project.packagings?.[0]?.packagingType || project.packagingType || 'Retail'),
                    material: (project.packagings?.[0]?.material || project.material || ''),
                    length: (project.packagings?.[0]?.length || project.length || ''),
                    width: (project.packagings?.[0]?.width || project.width || ''),
                    height: (project.packagings?.[0]?.height || project.height || ''),
                    startWeight: (project.packagings?.[0]?.startWeight || project.startWeight || groups[0]?.specs?.startWeight || '')
                }, 
                measurements: meas, 
                predictedImage: null 
            }]);
            setActiveGroupId(newId);
          };

          // A copy is a new packaging variant to measure: it takes the specs, the
          // measurement days and which days are evaluated, but none of the
          // readings, scores, notes, photos or the HUB prediction of the original
          // (it used to show the original's curves and photos as its own).
          const duplicateGroup = (id) => {
            const org = groups.find(g => g.id === id);
            if (!org) return;
            const newId = nextGroupId();
            const sCount = org.specs?.sampleCount || 3;
            const blank = (isD0) => Array.from({ length: sCount }, (_, i) => ({ id: Date.now() + i + Math.random(), o2: isD0 ? '20.9' : '', co2: isD0 ? '0.03' : '', weight: '', initialWeight: '' }));
            const meas = (org.measurements || []).map(m => ({
              day: m.day, ...(m.auto ? { auto: m.auto } : {}), samples: blank(parseFloat(m.day) === 0), quality: '', legacyQuality: '',
              notes: '', images: [], qualityParams: [], evaluateQuality: m.evaluateQuality || false
            }));
            setGroups(p => [...p, {
              id: newId, name: `${org.name} (Copy)`, specs: JSON.parse(JSON.stringify(org.specs || {})),
              ...(org.ownDays ? { ownDays: true } : {}), measurements: meas, predictedImage: null
            }]);
            setActiveGroupId(newId);
          };

          // === VERIFICATION ROUND (Round 2) ===
          // A second test round for the same variant. The packaging
          // configuration is copied from — and stays locked to — Round 1, so
          // the second round is a true verification of the first. Deviating
          // configurations are by definition a new trial and belong in a new
          // report. Measurements start empty on the same evaluation days.
          const addVerificationRound = (sourceId) => {
            const src = groups.find(g => g.id === sourceId);
            if (!src || src.verificationOf) return;
            if (groups.some(g => g.verificationOf === sourceId)) return;
            const newId = nextGroupId();
            const sCount = src.specs?.sampleCount || 3;
            const genS = (isD0) => Array.from({length: sCount}, (_, i) => ({ id: Date.now()+i, o2: isD0?'20.9':'', co2: isD0?'0.03':'', weight: '', initialWeight: '' }));
            const meas = (src.measurements || []).map(m => ({
              day: m.day, samples: genS(parseFloat(m.day) === 0), quality: '',
              notes: '', images: [], qualityParams: [],
              evaluateQuality: m.evaluateQuality || false
            }));
            setGroups(prev => {
              const idx = prev.findIndex(g => g.id === sourceId);
              const ng = { id: newId, name: `${src.name} (R2)`, round: 2, verificationOf: sourceId, specs: JSON.parse(JSON.stringify(src.specs || {})), measurements: meas, predictedImage: null };
              const arr = [...prev];
              arr.splice(idx + 1, 0, ng);
              return arr;
            });
            setActiveGroupId(newId);
          };
          
          // A double-click on a delete button must not also delete the row (or
          // variant) that slides into its place: after a removal, another one
          // within 600 ms is ignored. Counted from the removal itself, so the
          // time a confirm dialog stood open does not use the window up.
          const lastRemoveAt = useRef(0);
          const removeTooSoon = () => Date.now() - lastRemoveAt.current < 600;
          const markRemoved = () => { lastRemoveAt.current = Date.now(); };
          const removeGroup = (id) => {
            if (groups.length <= 1 || removeTooSoon()) return;
            const target = groups.find(g => g.id === id);
            if (!target) return;
            const measured = (target.measurements || []).filter(measurementHasData).length;
            if ((measured > 0 || groups.some(g => g.verificationOf === id)) && !window.confirm(
                (rt.confirmRemoveVariant || 'Delete variant "{name}" with {n} measured day(s), its scores and photos?')
                  .replace('{name}', target.name || rt.variantFallback || '').replace('{n}', measured))) return;
            markRemoved();
            // Its R2 round becomes an ordinary variant (an R2 without its source
            // stayed locked for good); its conclusion goes with it; its action
            // points stay, as general ones.
            const newGroups = groups.filter(g => g.id !== id).map(g => {
              if (g.verificationOf !== id) return g;
              const { verificationOf, round, ...rest } = g;
              return rest;
            });
            setGroups(newGroups);
            setProject(p => ({ ...p, maxVariantId: Math.max(parseInt(p.maxVariantId) || 0, ...groups.map(g => parseInt(g.id)).filter(n => !isNaN(n))) }));
            setAnalysis(prev => {
              const vc = { ...(prev.variantConclusions || {}) };
              delete vc[id];
              return { ...prev, variantConclusions: vc,
                nextSteps: (prev.nextSteps || []).map(s => s && String(s.variantId) === String(id) ? { ...s, variantId: 'general' } : s) };
            });
            if (activeGroupId === id) {
               setActiveGroupId(newGroups[0].id);
            }
          };

          const addNextStep = () => { 
            if (newStep.trim()) { 
                setAnalysis(prev => ({ 
                    ...prev, 
                    nextSteps: [...prev.nextSteps, { text: newStep, variantId: newStepVariant }] 
                })); 
                setNewStep(''); 
            }
          };
          const removeNextStep = (i) => setAnalysis(prev => ({ ...prev, nextSteps: prev.nextSteps.filter((_, idx) => idx !== i) }));
          // Inline edit + reorder for detailed conclusion points. Legacy string
          // entries are normalised to { text, variantId } on first edit.
          const updateNextStep = (i, field, value) => setAnalysis(prev => ({
            ...prev,
            nextSteps: prev.nextSteps.map((s, idx) => {
              if (idx !== i) return s;
              const stepObj = typeof s === 'string' ? { text: s, variantId: 'general' } : s;
              return { ...stepObj, [field]: value };
            })
          }));
          const moveNextStep = (i, dir) => setAnalysis(prev => {
            const arr = [...prev.nextSteps];
            const j = dir === 'up' ? i - 1 : i + 1;
            if (j < 0 || j >= arr.length) return prev;
            [arr[i], arr[j]] = [arr[j], arr[i]];
            return { ...prev, nextSteps: arr };
          });

          // The anonymised preview waits for its images — covered areas burnt in,
          // camera metadata dropped, left-out ones removed (anonymiseImages) —
          // and never shows the originals in the meantime.
          const anonOn = !!(analysis.anonymise && analysis.anonymise.enabled);
          // One image's decision in the anonymisation check, merged into what is stored.
          const setAnonImage = (key, patch) => setAnalysis(prev => {
            const a = { enabled: false, alias: '', extraTerms: '', hideLocation: true, ...(prev.anonymise || {}) };
            const images = a.images || {};
            return { ...prev, anonymise: { ...a, images: { ...images, [key]: { ...(images[key] || {}), ...patch } } } };
          });
          useEffect(() => {
            if (!isPreview || !anonOn) { setAnonPrep(null); return; }
            let stopped = false;
            setAnonPrep({ done: 0, total: 0 });
            Promise.resolve()
              .then(() => anonymiseImages(anonymiseReport({ clientInfo, project, groups, analysis, supplyChain }, analysis.anonymise),
                analysis.anonymise.images, (done, total) => { if (!stopped) setAnonPrep({ done, total }); }))
              .then(anon => { if (!stopped) setAnonPrep({ ready: true, anon }); })
              .catch(() => { if (!stopped) setAnonPrep({ error: true }); });
            return () => { stopped = true; };
            // The editor is not on screen while the preview is: its data cannot
            // change underneath, so opening the preview is the one trigger.
          }, [isPreview, anonOn]);

          if (isPreview) {
            // Anonymised: the preview — and so the PDF and the Word file built
            // from it — only ever sees the cleaned copy. The report itself, and
            // what autosaves, keep every client detail.
            if (anonOn) {
              if (!anonPrep || !anonPrep.ready) {
                return (
                  <div className="min-h-screen bg-slate-600 flex items-center justify-center p-6 font-sans">
                    <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center space-y-4">
                      {anonPrep && anonPrep.error ? (<>
                        <div className="font-bold text-slate-800">{rt.anonPrepFailed || 'The anonymised images could not be prepared.'}</div>
                        <p className="text-sm text-slate-500">{rt.anonPrepFailedHint || 'The anonymised preview is not shown, so no original photo can end up in it.'}</p>
                      </>) : (<>
                        <div className="font-bold text-slate-800">{rt.anonPreparing || 'Preparing the anonymised images…'}</div>
                        <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                          <div className="h-full rounded-full transition-all" style={{ width: (anonPrep && anonPrep.total ? Math.round(anonPrep.done / anonPrep.total * 100) : 5) + '%', background: BRAND.colors.green }} />
                        </div>
                        <div className="text-sm text-slate-500">{anonPrep && anonPrep.total ? `${anonPrep.done} / ${anonPrep.total}` : ''}</div>
                      </>)}
                      <button type="button" onClick={() => setIsPreview(false)} className="px-5 py-2.5 rounded-full bg-slate-800 text-white font-bold text-sm">{rt.backToEditor || 'Back to the editor'}</button>
                    </div>
                  </div>
                );
              }
              const anon = anonPrep.anon;
              return <PrintPreview clientInfo={anon.clientInfo} project={anon.project} groups={anon.groups} supplyChain={anon.supplyChain} onBack={() => setIsPreview(false)} analysis={anon.analysis} unitSystem={unitSystem} lang={lang} anonymised anonImages={anon.imageReport} />;
            }
            return <PrintPreview clientInfo={clientInfo} project={project} groups={groups} supplyChain={supplyChain} onBack={() => setIsPreview(false)} analysis={analysis} unitSystem={unitSystem} lang={lang} />;
          }

          if (isSheet) {
            return <MeasurementSheet clientInfo={clientInfo} project={project} groups={groups} onBack={() => setIsSheet(false)} unitSystem={unitSystem} lang={lang} rt={rt} />;
          }

          // Auto-detect section visibility for checkbox defaults (null = auto, true/false = manual override)
          const autoShowGas = groups.some(g =>
            (!g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP') &&
            (g.measurements || []).some(m =>
              parseFloat(m.day) > 0 &&
              (m.samples || []).some(s => s.o2 !== '' && s.o2 !== undefined && s.o2 !== null)
            )
          );
          const autoShowHub = groups.some(g =>
            (!g.specs?.atmosphereStrategy || g.specs.atmosphereStrategy === 'MAP') && !!g.predictedImage
          );
          const autoShowWeight = groups.some(g => {
            const daysWithWeight = (g.measurements || []).filter(m =>
              (m.samples || []).some(s => s.weight !== '' && s.weight !== undefined && s.weight !== null && parseFloat(s.weight) > 0)
            );
            return daysWithWeight.length >= 2;
          });
          // With more scored variants than one chart holds, the scores per
          // criterion are the annex of the report (as in the preview).
          const criteriaInAnnex = groups.filter(g => (g.measurements || []).some(m => measQuality(m))).length > VARIANTS_PER_BLOCK;

          // Photos are almost all of a report's bytes, and every save writes the
          // whole file (one live report: 136 MB, most of a second per save). Above
          // 20 MB the editor says so and offers to shrink the photos stored at
          // camera size to what new uploads get (readImageFile: 1600 px).
          const BIG_PHOTO_CHARS = 1.2e6; // data-URL characters, about 0.9 MB
          const bigPhotos = [];
          let docChars = 0;
          const countImg = (u) => { if (typeof u === 'string') docChars += u.length; };
          groups.forEach(g => {
            countImg(g.predictedImage);
            (g.measurements || []).forEach(m => (m.images || []).forEach(img => {
              const u = typeof img === 'string' ? img : img && img.url;
              countImg(u);
              if (typeof u === 'string' && u.startsWith('data:image') && u.length > BIG_PHOTO_CHARS) bigPhotos.push(u);
            }));
          });
          [project.coverImage, project.startImage, ...getTempImages(analysis)].forEach(countImg);
          const docMB = docChars * 0.75 / 1e6;
          const bigReport = docMB > 20 && bigPhotos.length > 0;
          const shrinkPhotos = async () => {
            const anonNote = analysis.anonymise && analysis.anonymise.enabled ? ' ' + (rt.shrinkAnonNote || 'Photos already checked for the anonymised version must be checked again.') : '';
            if (!window.confirm((rt.confirmShrink || 'Shrink {n} photo(s) to 1600 px, as new uploads are? This cannot be undone.').replace('{n}', bigPhotos.length) + anonNote)) return;
            const done = new Map();
            setShrinking({ done: 0, total: bigPhotos.length });
            for (let i = 0; i < bigPhotos.length; i++) {
              const url = bigPhotos[i];
              try {
                const blob = await (await fetch(url)).blob();
                const r = await globalConfig.readImageFile(new File([blob], 'photo', { type: blob.type || 'image/jpeg' }));
                if (r && r.dataUrl && r.dataUrl.length < url.length) done.set(url, r);
              } catch (e) { /* left as it is */ }
              setShrinking({ done: i + 1, total: bigPhotos.length });
            }
            setGroups(prev => prev.map(g => ({ ...g, measurements: (g.measurements || []).map(m => ({ ...m, images: (m.images || []).map(img => {
              const u = typeof img === 'string' ? img : img && img.url;
              const r = u && done.get(u);
              if (!r) return img;
              const base = typeof img === 'string' ? { caption: '', category: 'External Quality' } : img;
              return { ...base, url: r.dataUrl, w: r.width, h: r.height, bytes: r.bytes };
            }) })) })));
            setShrinking(null);
          };

          // Opened from the board but not (yet) linked: the screen shows the
          // empty placeholder report. Whatever was typed there was replaced by
          // the loaded project, or saved over its first measurement.
          const editLocked = !!boardProjectId && boardState !== 'linked' && boardState !== 'off';

          // --- EDITOR VIEW ---
          return (
            <div className="min-h-screen font-sans text-slate-800 bg-slate-50 pb-20">
              {editLocked && (
                <div className="fixed inset-0 z-40 bg-slate-50/80 backdrop-blur-[1px] flex items-start justify-center pt-28 px-4 print:hidden">
                  <div className="bg-white rounded-2xl shadow-lg border border-slate-200 px-6 py-5 max-w-md text-center text-sm text-slate-700">
                    {boardState === 'loading' && (rt.overlayLoading || 'Loading the project…')}
                    {boardState === 'needs-permission' && (rt.overlayPermission || 'Grant access to the project folder (bar above) to load this project. Nothing can be entered until it is loaded.')}
                    {(boardState === 'error' || boardState === 'unreadable' || boardState === 'newer') && (rt.overlayError || 'This project could not be opened for editing; see the bar above.')}
                  </div>
                </div>
              )}

              {/* PROJECT BOARD LINK BANNER */}
              {boardProjectId && boardState !== 'off' && (
                <div className="relative z-50 w-full text-white text-sm px-4 py-2 flex items-center justify-center gap-3 print:hidden" style={{ backgroundColor: (boardState === 'unreadable' || boardState === 'error' || boardState === 'newer') ? '#ea580c' : (boardState === 'linked' && (saveState === 'failed' || saveState === 'conflict')) ? '#dc2626' : '#084BCD' }}>
                  <span className="flex items-center gap-2">
                    <FolderOpen size={16} />
                    {boardState === 'linked' && saveState === 'conflict' && (
                      <span className="flex flex-wrap items-center gap-2">
                        <strong>{rt.saveConflict || 'Someone else saved this report in the meantime (another device or a colleague). Your latest changes are not saved yet.'}</strong>
                        <button type="button" className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold" onClick={() => { if (window.confirm(rt.confirmLoadTheirs || 'Load the saved version? Your changes since then are lost.')) { saveStateRef.current = 'saved'; window.location.reload(); } }}>{rt.loadTheirs || 'Load their version'}</button>
                        <button type="button" className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold" onClick={() => { if (window.confirm(rt.confirmSaveMine || 'Save your version over theirs? Their changes are lost.')) { forceSaveRef.current = true; markSave('saving'); const run = pendingBoardSave.current; if (run) run().catch(() => {}); } }}>{rt.saveMine || 'Save mine anyway'}</button>
                      </span>
                    )}
                    {boardState === 'linked' && saveState !== 'conflict' && <span>{rt.boardLinked || 'Linked to Project Board'}{boardTitle ? `: ${boardTitle}` : ''} — {saveState === 'failed'
                      ? <strong>{(rt.boardNotSaved || 'NOT SAVED: {err}. Retrying; keep this page open.').replace('{err}', saveError || rt.boardNotSavedDefault || 'the project folder could not be written')}</strong>
                      : saveState === 'saved' ? (rt.boardSaved || 'all changes saved.') : (rt.boardSaving || 'saving…')}</span>}
                    {boardState === 'loading' && <span>{rt.boardLoading || 'Loading project from the board…'}</span>}
                    {boardState === 'needs-permission' && <span>{rt.boardNeedsPermission || 'Grant access to the project folder to load this project.'}</span>}
                    {boardState === 'error' && <span>{rt.boardError || 'Could not reach the project folder. Open this from the Project Board.'}</span>}
                    {boardState === 'newer' && <span>{rt.boardNewer || 'This report was saved by a newer version of the report tool. Reload the page (Ctrl+F5) to get the latest version. Autosave is off, so nothing is overwritten.'}</span>}
                    {boardState === 'unreadable' && <span>{rt.boardUnreadable || "This project's file is not a recognised intake/proposal/report — nothing was changed and autosave is off, so the file stays intact."}</span>}
                  </span>
                  {boardState === 'needs-permission' && (
                    <button onClick={grantBoardAccess} className="bg-white/20 hover:bg-white/30 rounded-md px-3 py-1 font-bold">{rt.grantAccess || 'Grant access'}</button>
                  )}
                  {/* Through goToBoard, which saves first and asks when it cannot. */}
                  <a href="board.html" onClick={(e) => { const B = window.PerfoTecBoard; if (B && B.goToBoard) { e.preventDefault(); B.goToBoard(); } }} className="underline/50 hover:underline opacity-80 hover:opacity-100">← Board</a>
                </div>
              )}

              {bigReport && (
                <div className="w-full bg-amber-50 border-b border-amber-200 text-amber-900 text-sm px-4 py-2 flex flex-wrap items-center justify-center gap-3 print:hidden">
                  <span>{(rt.bigReport || 'This report is {mb} MB, mostly photos stored at camera size ({n}). Every change saves the whole file, which gets slow.').replace('{mb}', Math.round(docMB)).replace('{n}', bigPhotos.length)}</span>
                  {shrinking
                    ? <span className="font-bold">{(rt.shrinking || 'Shrinking photos… {done}/{total}').replace('{done}', shrinking.done).replace('{total}', shrinking.total)}</span>
                    : <button type="button" onClick={shrinkPhotos} className="font-bold bg-white border border-amber-300 rounded-lg px-3 py-1 hover:bg-amber-100">{rt.shrinkPhotos || 'Shrink these photos'}</button>}
                </div>
              )}

              {/* Modals */}

                                             </td>
                                           </tr>
                                         )
                                       })}
                                     </tbody>
                                   </table>
                                 </div>
                                 </>

                                 })()}
                               </div>
                             </>
